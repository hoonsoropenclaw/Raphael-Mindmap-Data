<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17211f" />
  <title>Atlas Flow — 動態工作流管理台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --ink-2: #273330;
      --muted: #6d7974;
      --muted-2: #8d9893;
      --paper: #f0f0e9;
      --paper-2: #f7f7f2;
      --panel: #fdfdf9;
      --line: #d9ddd4;
      --line-2: #c5ccc2;
      --signal: #e45f36;
      --signal-dark: #a83d20;
      --signal-soft: #fff0e8;
      --mint: #1f9270;
      --mint-soft: #dff3e9;
      --blue: #3e7ba8;
      --blue-soft: #e2eef5;
      --amber: #b47b20;
      --amber-soft: #faedc7;
      --plum: #795d91;
      --plum-soft: #eee5f4;
      --red: #bc4742;
      --red-soft: #f8e1de;
      --shadow-sm: 0 5px 18px rgba(23,33,31,.06);
      --shadow-md: 0 18px 50px rgba(23,33,31,.11);
      --radius: 6px;
      --radius-lg: 13px;
      --ease: cubic-bezier(.22,.72,.2,1);
      --topbar: 68px;
    }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
    html { overflow-x: hidden; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Manrope, "Noto Sans TC", sans-serif;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .44; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(228,95,54,.25);
      outline-offset: 2px;
    }
    ::selection { color: #fff; background: var(--signal); }
    .mono { font-family: "DM Mono", monospace; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Boot / dependency failure — never leave an empty white page. */
    #boot {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: var(--paper); transition: opacity .22s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    .boot-card { width: min(440px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 25px; box-shadow: var(--shadow-md); }
    .boot-mark { width: 36px; height: 36px; display: grid; place-items: center; background: var(--signal); color: #fff; border-radius: 50%; font-weight: 800; margin-bottom: 16px; }
    .boot-card h1 { font: 600 25px/1 Newsreader, serif; margin: 0 0 7px; }
    .boot-card p { color: var(--muted); font-size: 12px; line-height: 1.65; margin: 0; }
    .boot-list { margin: 16px 0 0; display: grid; gap: 7px; }
    .boot-row { display: flex; justify-content: space-between; gap: 15px; padding-top: 7px; border-top: 1px solid var(--line); color: var(--muted); font: 10px "DM Mono", monospace; }
    .boot-row b { color: var(--ink); }
    .boot-error { color: var(--red)!important; }

    .app-shell { width: 100%; min-width: 0; height: 100vh; display: grid; grid-template-rows: var(--topbar) minmax(0, 1fr); overflow: hidden; }
    .topbar {
      width: 100%; min-width: 0;
      position: relative; z-index: 30; display: grid; grid-template-columns: 260px minmax(0,1fr) auto;
      align-items: center; gap: 18px; padding: 0 22px; background: rgba(253,253,249,.94);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(16px);
    }
    .brand-lockup { min-width: 0; display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 33px; height: 33px; border-radius: 50%; display: grid; place-items: center;
      background: var(--ink); color: #fff; font: 500 13px "DM Mono", monospace; position: relative; flex: 0 0 auto;
    }
    .brand-mark::after { content: ""; position: absolute; width: 8px; height: 8px; right: -1px; bottom: 0; border: 2px solid var(--panel); border-radius: 50%; background: var(--signal); }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: -.045em; }
    .brand-name small { display: block; color: var(--muted); font: 8px "DM Mono", monospace; letter-spacing: .12em; margin-top: 2px; }
    .view-tabs { justify-self: center; display: flex; align-items: center; gap: 3px; padding: 4px; background: #e9ebe4; border-radius: 8px; }
    .view-tab { border: 0; background: transparent; color: var(--muted); padding: 8px 13px; border-radius: 5px; font-size: 11px; font-weight: 800; }
    .view-tab:hover { color: var(--ink); }
    .view-tab.active { color: var(--ink); background: var(--panel); box-shadow: 0 2px 7px rgba(23,33,31,.08); }
    .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .save-indicator { display: flex; align-items: center; gap: 7px; color: var(--muted); font: 9px "DM Mono", monospace; margin-right: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(31,146,112,.12); }
    .dot.amber { background: var(--amber); box-shadow: 0 0 0 4px rgba(180,123,32,.12); }
    .dot.red { background: var(--red); box-shadow: 0 0 0 4px rgba(188,71,66,.12); }
    .button {
      border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); border-radius: var(--radius);
      padding: 9px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 10px; font-weight: 800; white-space: nowrap; transition: transform .16s var(--ease), border-color .16s, background .16s, color .16s;
    }
    .button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--muted-2); background: #fff; }
    .button.primary { border-color: var(--signal); background: var(--signal); color: #fff; }
    .button.primary:hover:not(:disabled) { border-color: var(--signal-dark); background: var(--signal-dark); }
    .button.dark { border-color: var(--ink); background: var(--ink); color: #fff; }
    .button.dark:hover:not(:disabled) { background: var(--ink-2); color: #fff; }
    .button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    .button.ghost:hover:not(:disabled) { background: #e9ebe4; border-color: transparent; color: var(--ink); }
    .button.danger { color: var(--red); border-color: #ecc9c6; background: var(--red-soft); }
    .button.square { width: 34px; height: 34px; padding: 0; }

    .workbench { width: 100%; min-width: 0; min-height: 0; display: grid; grid-template-columns: 258px minmax(0,1fr) 342px; }
    .workbench > * { min-width: 0; }
    .workbench.wide { grid-template-columns: 258px minmax(0,1fr); }
    .sidebar-left, .inspector { min-height: 0; overflow-y: auto; background: rgba(247,247,242,.84); }
    .sidebar-left { border-right: 1px solid var(--line); padding: 20px 15px 28px; }
    .inspector { border-left: 1px solid var(--line); padding: 20px 18px 30px; }
    .section-kicker { color: var(--muted); font: 9px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .15em; margin: 0 7px 10px; }
    .search-wrap { position: relative; margin-bottom: 15px; }
    .search-wrap span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-2); font-size: 12px; }
    .search-input { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 10px 9px 30px; border-radius: 6px; font-size: 10px; }
    .workflow-list { display: grid; gap: 4px; }
    .workflow-item { width: 100%; border: 0; background: transparent; border-radius: 7px; color: var(--muted); padding: 11px 10px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; transition: background .16s, color .16s; }
    .workflow-item:hover { color: var(--ink); background: #e8ebe4; }
    .workflow-item.active { color: #fff; background: var(--ink); }
    .workflow-main { min-width: 0; display: flex; align-items: center; gap: 9px; }
    .workflow-bullet { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .6; flex: 0 0 auto; }
    .workflow-item.active .workflow-bullet { opacity: 1; background: var(--signal); }
    .workflow-copy { min-width: 0; }
    .workflow-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .workflow-copy small { display: block; margin-top: 3px; color: inherit; opacity: .65; font: 8px "DM Mono", monospace; }
    .workflow-count { color: inherit; opacity: .62; font: 9px "DM Mono", monospace; flex: 0 0 auto; }
    .new-workflow { width: 100%; margin-top: 8px; border: 1px dashed var(--line-2); background: transparent; color: var(--muted); border-radius: 6px; padding: 9px 10px; text-align: left; font-size: 10px; font-weight: 800; }
    .new-workflow:hover { color: var(--signal-dark); border-color: var(--signal); background: var(--signal-soft); }
    .side-rule { border: 0; border-top: 1px solid var(--line); margin: 22px 5px; }
    .palette { display: grid; gap: 6px; }
    .palette-item { width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 9px; display: grid; grid-template-columns: 28px minmax(0,1fr) 15px; align-items: center; gap: 9px; text-align: left; transition: transform .16s var(--ease), border-color .16s, background .16s; }
    .palette-item:hover { transform: translateX(3px); border-color: var(--line-2); background: #fff; }
    .palette-item:active { cursor: grabbing; }
    .palette-icon { width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; font: 500 11px "DM Mono", monospace; }
    .palette-icon.trigger { color: var(--mint); background: var(--mint-soft); }
    .palette-icon.form { color: var(--plum); background: var(--plum-soft); }
    .palette-icon.condition { color: var(--amber); background: var(--amber-soft); }
    .palette-icon.action { color: var(--blue); background: var(--blue-soft); }
    .palette-icon.approval { color: var(--signal); background: var(--signal-soft); }
    .palette-icon.notification { color: var(--mint); background: var(--mint-soft); }
    .palette-icon.end { color: var(--red); background: var(--red-soft); }
    .palette-copy strong { display: block; font-size: 10px; }
    .palette-copy small { display: block; color: var(--muted); font-size: 8px; margin-top: 2px; }
    .palette-plus { color: var(--muted-2); font-size: 14px; }
    .sidebar-note { margin: 20px 5px 0; color: var(--muted); font-size: 9px; line-height: 1.65; }
    .sidebar-note b { color: var(--ink); }

    .main-stage { min-width: 0; min-height: 0; background: var(--paper-2); }
    .builder-view { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
    .stage-header { min-height: 84px; padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 18px; background: rgba(247,247,242,.84); }
    .stage-title { min-width: 0; }
    .stage-title h1 { margin: 0; font: 600 23px/1.08 Newsreader, serif; letter-spacing: -.025em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage-title p { margin: 7px 0 0; color: var(--muted); font: 8px "DM Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
    .stage-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .canvas-wrap { position: relative; min-height: 0; overflow: hidden; background: var(--paper-2); }
    .flow-host { width: 100%; height: 100%; min-height: 480px; }
    .canvas-strip { min-height: 46px; border-top: 1px solid var(--line); background: rgba(253,253,249,.91); display: flex; align-items: center; gap: 15px; padding: 0 18px; color: var(--muted); font: 8px "DM Mono", monospace; }
    .canvas-strip .spacer { flex: 1; }
    .status-unit { display: inline-flex; align-items: center; gap: 6px; }
    .status-unit b { color: var(--ink); font-weight: 500; }
    .canvas-drop-hint { position: absolute; left: 18px; bottom: 17px; z-index: 4; display: flex; gap: 7px; pointer-events: none; }
    .hint-chip { border: 1px solid var(--line); background: rgba(253,253,249,.88); color: var(--muted); padding: 7px 9px; border-radius: 5px; font: 8px "DM Mono", monospace; backdrop-filter: blur(8px); }
    .hint-chip b { color: var(--ink); font-weight: 500; }

    /* React Flow skin. */
    .react-flow { background: var(--paper-2); }
    .react-flow__renderer { cursor: default; }
    .react-flow__attribution { display: none; }
    .react-flow__edge-path { stroke: #86938d; stroke-width: 1.55; }
    .react-flow__edge.selected .react-flow__edge-path { stroke: var(--signal); stroke-width: 2.4; }
    .react-flow__edge-text { fill: var(--ink); font: 8px "DM Mono", monospace; }
    .react-flow__edge-textbg { fill: var(--panel); fill-opacity: .94; }
    .react-flow__controls { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .react-flow__controls-button { background: var(--panel); border-bottom-color: var(--line); fill: var(--muted); }
    .react-flow__controls-button:hover { background: #fff; fill: var(--ink); }
    .react-flow__minimap { border: 1px solid var(--line); background: #e8ebe5; border-radius: 7px; box-shadow: var(--shadow-sm); }
    .flow-node { width: 198px; background: rgba(253,253,249,.98); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 8px 19px rgba(23,33,31,.08); overflow: hidden; transition: box-shadow .16s var(--ease), border-color .16s, transform .16s; }
    .flow-node:hover { border-color: var(--muted-2); box-shadow: 0 14px 29px rgba(23,33,31,.13); }
    .flow-node.selected { border: 2px solid var(--signal); box-shadow: 0 0 0 3px rgba(228,95,54,.1), 0 15px 32px rgba(23,33,31,.14); }
    .flow-node.running { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(180,123,32,.12), 0 14px 29px rgba(23,33,31,.12); }
    .flow-node.success { border-color: var(--mint); }
    .flow-node.failed { border-color: var(--red); }
    .node-accent { height: 4px; background: var(--blue); }
    .flow-node[data-kind="trigger"] .node-accent { background: var(--mint); }
    .flow-node[data-kind="form"] .node-accent { background: var(--plum); }
    .flow-node[data-kind="condition"] .node-accent { background: var(--amber); }
    .flow-node[data-kind="approval"] .node-accent { background: var(--signal); }
    .flow-node[data-kind="notification"] .node-accent { background: var(--mint); }
    .flow-node[data-kind="end"] .node-accent { background: var(--red); }
    .node-body { padding: 11px 13px 12px; }
    .node-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .node-kind { color: var(--muted); font: 8px "DM Mono", monospace; letter-spacing: .13em; text-transform: uppercase; }
    .node-state { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); }
    .node-state.running { background: var(--amber); box-shadow: 0 0 0 4px rgba(180,123,32,.15); animation: pulse 1.1s ease-in-out infinite; }
    .node-state.success { background: var(--mint); }
    .node-state.failed { background: var(--red); }
    @keyframes pulse { 50% { transform: scale(.72); opacity: .55; } }
    .node-label { font-size: 12px; font-weight: 800; letter-spacing: -.025em; line-height: 1.3; }
    .node-description { margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node-footer { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; color: var(--muted); font: 8px "DM Mono", monospace; }
    .node-footer b { color: var(--ink); font-weight: 500; }
    .rf-handle { width: 9px!important; height: 9px!important; background: var(--ink)!important; border: 2px solid var(--panel)!important; }
    .flow-node[data-kind="condition"] .rf-handle { border-radius: 2px!important; transform: rotate(45deg); }

    .inspector-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .inspector-head h2 { margin: 0; font: 600 23px/1.08 Newsreader, serif; letter-spacing: -.025em; }
    .inspector-head p { margin: 6px 0 0; color: var(--muted); font: 8px "DM Mono", monospace; word-break: break-all; }
    .inspector-tabs { display: grid; grid-template-columns: repeat(2,1fr); gap: 4px; padding: 4px; background: #e8ebe4; border-radius: 7px; margin-bottom: 18px; }
    .inspector-tab { border: 0; background: transparent; color: var(--muted); padding: 8px; border-radius: 4px; font-size: 9px; font-weight: 800; }
    .inspector-tab.active { color: var(--ink); background: var(--panel); box-shadow: 0 2px 6px rgba(23,33,31,.07); }
    .field { margin-bottom: 14px; }
    .field-label { display: flex; align-items: center; justify-content: space-between; margin: 0 0 7px; color: var(--muted); font: 8px "DM Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
    .field-label span:last-child { color: var(--muted-2); }
    .text-input, .select-input, .textarea-input, .number-input { width: 100%; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); border-radius: 5px; padding: 9px 10px; font-size: 10px; transition: border-color .16s, box-shadow .16s; }
    .text-input:focus, .select-input:focus, .textarea-input:focus, .number-input:focus { border-color: var(--signal); box-shadow: 0 0 0 3px rgba(228,95,54,.1); outline: none; }
    .textarea-input { min-height: 66px; resize: vertical; line-height: 1.5; }
    .two-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .role-grid { display: grid; gap: 6px; }
    .role-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); background: rgba(253,253,249,.7); border-radius: 6px; padding: 8px 9px; }
    .role-info { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .role-avatar { width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font: 500 8px "DM Mono", monospace; flex: 0 0 auto; }
    .role-info strong { display: block; font-size: 9px; }
    .role-info small { display: block; color: var(--muted); font-size: 8px; margin-top: 2px; }
    .toggle { width: 30px; height: 17px; border: 0; border-radius: 999px; padding: 2px; background: #cfd5cd; flex: 0 0 auto; }
    .toggle span { display: block; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .16s var(--ease); box-shadow: 0 1px 3px rgba(0,0,0,.16); }
    .toggle.on { background: var(--mint); }
    .toggle.on span { transform: translateX(13px); }
    .inspector-rule { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
    .inspector-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 18px; }
    .empty-inspector { padding: 30px 8px; color: var(--muted); font-size: 10px; line-height: 1.75; }
    .empty-inspector strong { display: block; color: var(--ink); font: 600 21px Newsreader, serif; margin-bottom: 8px; }
    .activity-list { display: grid; gap: 1px; }
    .activity-item { display: grid; grid-template-columns: 42px 8px minmax(0,1fr); gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
    .activity-time { color: var(--muted-2); font: 8px "DM Mono", monospace; }
    .activity-level { width: 7px; height: 7px; margin-top: 2px; border-radius: 50%; background: var(--blue); }
    .activity-level.ok { background: var(--mint); }
    .activity-level.warn { background: var(--amber); }
    .activity-level.error { background: var(--red); }
    .activity-copy { color: var(--muted); font-size: 9px; line-height: 1.5; }
    .activity-copy b { color: var(--ink); }

    /* Runs and versions. */
    .content-view { min-height: 100%; padding: 28px; overflow-y: auto; }
    .content-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .content-head h1 { margin: 0; font: 600 34px/1 Newsreader, serif; letter-spacing: -.035em; }
    .content-head p { margin: 8px 0 0; color: var(--muted); font-size: 10px; }
    .metric-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 24px 0; }
    .metric-card { background: var(--panel); padding: 18px; }
    .metric-value { font: 600 29px Newsreader, serif; }
    .metric-label { color: var(--muted); font: 8px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .1em; margin-top: 5px; }
    .table-card { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .table-title { padding: 15px 17px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .table-title h2 { margin: 0; font-size: 12px; }
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th, .data-table td { text-align: left; padding: 12px 17px; border-bottom: 1px solid var(--line); font-size: 9px; }
    .data-table th { color: var(--muted); font: 8px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .08em; background: #f8f8f4; }
    .data-table tr:last-child td { border-bottom: 0; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 7px; border-radius: 999px; background: var(--mint-soft); color: var(--mint); font: 8px "DM Mono", monospace; text-transform: uppercase; }
    .status-pill.running { color: var(--amber); background: var(--amber-soft); }
    .status-pill.stopped { color: var(--red); background: var(--red-soft); }

  <script>
  (function () {
    "use strict";
    const boot = document.getElementById("boot");
    const bootMessage = document.getElementById("boot-message");
    const markBoot = (id, ok) => {

    const domOK = !!(window.ReactDOM && window.ReactDOM.createRoot);

    markBoot("boot-dom", domOK);
    markBoot("boot-flow", flowOK);
    if (!reactOK || !domOK || !flowOK) {
      bootMessage.textContent = "依賴載入失敗。請確認網路可存取 unpkg.com，然後重新整理頁面。現有草稿不會被刪除。";

    const STORAGE_KEY = "atlas-flow-workspace-v1";
    const TYPE_CATALOG = [
      { kind: "trigger", name: "觸發器", short: "T", description: "事件或排程啟動流程", color: "#1f9270", owner: "System" },
      { kind: "form", name: "資料表單", short: "F", description: "收集與驗證輸入資料", color: "#795d91", owner: "Requester" },
      { kind: "condition", name: "條件分流", short: "?", description: "根據規則選擇路徑", color: "#b47b20", owner: "Rules" },
      { kind: "action", name: "自動任務", short: "A", description: "呼叫 API 或資料處理", color: "#3e7ba8", owner: "Automation" },
      { kind: "approval", name: "人工簽核", short: "✓", description: "需要角色核准或退回", color: "#e45f36", owner: "Manager" },
      { kind: "notification", name: "通知", short: "N", description: "Email、訊息或 Webhook", color: "#1f9270", owner: "System" },
      { kind: "end", name: "流程結束", short: "E", description: "結束並記錄輸出", color: "#bc4742", owner: "System" }
    ];
    const TYPE_MAP = Object.fromEntries(TYPE_CATALOG.map(item => [item.kind, item]));
    const clone = value => JSON.parse(JSON.stringify(value));
    let idSeed = Date.now();
    const uid = prefix => `${prefix}-${(++idSeed).toString(36)}`;
    const nowTime = () => new Date().toLocaleTimeString("zh-TW", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const makeNode = (id, kind, label, x, y, extra) => ({
      id,
      type: "atlas",
      position: { x, y },
      data: Object.assign({
        kind,
        label,
        description: TYPE_MAP[kind] ? TYPE_MAP[kind].description : "",
        owner: TYPE_MAP[kind] ? TYPE_MAP[kind].owner : "Unassigned",
        status: "idle",
        timeout: kind === "action" ? 30 : 0,
        retries: kind === "action" ? 2 : 0,
        roles: { requester: true, operator: kind !== "trigger", approver: kind === "approval" }
      }, extra || {})
    });
    const makeEdge = (id, source, target, label) => ({
      id, source, target, label: label || "", type: "smoothstep", animated: false,
      markerEnd: { type: MarkerType.ArrowClosed, width: 15, height: 15, color: "#86938d" },
      labelStyle: { fill: "#17211f", fontSize: 9 },
      labelBgStyle: { fill: "#fdfdf9", fillOpacity: .94 }
    });

    function onboardingGraph() {
      return {
        nodes: [
          makeNode("on-start", "trigger", "新人資料建立", 45, 205),

          makeNode("on-check", "condition", "文件是否齊全？", 290, 315),
          makeNode("on-account", "action", "建立系統帳號", 565, 70),
          makeNode("on-approve", "approval", "部門主管確認", 565, 285),
          makeNode("on-notify", "notification", "寄送報到通知", 830, 178),
          makeNode("on-end", "end", "完成入職", 1080, 178)
        ],
        edges: [
          makeEdge("oe1", "on-start", "on-form"),
          makeEdge("oe2", "on-form", "on-check"),
          makeEdge("oe3", "on-check", "on-account", "齊全"),
          makeEdge("oe4", "on-check", "on-approve", "需覆核"),
          makeEdge("oe5", "on-account", "on-notify"),
          makeEdge("oe6", "on-approve", "on-notify", "核准"),
          makeEdge("oe7", "on-notify", "on-end")
        ]
      };
    }
    function invoiceGraph() {
      return {
        nodes: [
          makeNode("in-start", "trigger", "收到供應商發票", 60, 185),
          makeNode("in-form", "form", "擷取發票欄位", 315, 185),
          makeNode("in-cond", "condition", "金額 ≥ 50,000？", 565, 185),
          makeNode("in-auto", "action", "自動入帳", 820, 70),
          makeNode("in-approve", "approval", "財務主管簽核", 820, 300),
          makeNode("in-notify", "notification", "通知供應商", 1080, 185)
        ],
        edges: [
          makeEdge("ie1", "in-start", "in-form"), makeEdge("ie2", "in-form", "in-cond"),
          makeEdge("ie3", "in-cond", "in-auto", "否"), makeEdge("ie4", "in-cond", "in-approve", "是"),
          makeEdge("ie5", "in-auto", "in-notify"), makeEdge("ie6", "in-approve", "in-notify", "核准")
        ]
      };
    }
    function incidentGraph() {
      return {
        nodes: [
          makeNode("ic-start", "trigger", "監控告警觸發", 50, 200),
          makeNode("ic-enrich", "action", "補齊告警上下文", 310, 200),
          makeNode("ic-cond", "condition", "Severity = P0？", 570, 200),
          makeNode("ic-page", "notification", "呼叫值班工程師", 825, 85),
          makeNode("ic-ticket", "action", "建立事件工單", 825, 315),
          makeNode("ic-end", "end", "事件已接管", 1080, 200)
        ],
        edges: [
          makeEdge("ce1", "ic-start", "ic-enrich"), makeEdge("ce2", "ic-enrich", "ic-cond"),
          makeEdge("ce3", "ic-cond", "ic-page", "是"), makeEdge("ce4", "ic-cond", "ic-ticket", "否"),
          makeEdge("ce5", "ic-page", "ic-end"), makeEdge("ce6", "ic-ticket", "ic-end")
        ]
      };
    }
    function initialWorkspace() {
      const a = onboardingGraph(), b = invoiceGraph(), c = incidentGraph();
      return {
        activeId: "wf-onboarding",
        workflows: [
          { id: "wf-onboarding", name: "新人入職自動化", description: "從資料收集到帳號建立的跨部門流程", updatedAt: "2 分鐘前", draft: true, nodes: a.nodes, edges: a.edges, versions: [], runs: [] },
          { id: "wf-invoice", name: "供應商發票審核", description: "金額分流與財務簽核", updatedAt: "18 分鐘前", draft: false, nodes: b.nodes, edges: b.edges, versions: [], runs: [] },
          { id: "wf-incident", name: "事件分級與派送", description: "依告警層級建立即時應變路徑", updatedAt: "昨天", draft: false, nodes: c.nodes, edges: c.edges, versions: [], runs: [] }
        ]
      };
    }

    function topologicalLayers(nodes, edges) {
      const indegree = new Map(nodes.map(node => [node.id, 0]));
      const outgoing = new Map(nodes.map(node => [node.id, []]));
      edges.forEach(edge => {
        if (indegree.has(edge.target) && outgoing.has(edge.source)) {
          indegree.set(edge.target, indegree.get(edge.target) + 1);
          outgoing.get(edge.source).push(edge.target);
        }
      });
      let queue = nodes.filter(node => indegree.get(node.id) === 0).map(node => node.id);
      const layers = [];
      let visited = 0;
      while (queue.length) {
        const layer = queue.slice();
        layers.push(layer);
        queue = [];
        layer.forEach(id => {
          visited += 1;
          outgoing.get(id).forEach(target => {
            indegree.set(target, indegree.get(target) - 1);
            if (indegree.get(target) === 0) queue.push(target);
          });
        });
      }
      if (visited !== nodes.length) throw new Error("偵測到循環依賴；工作流必須保持 DAG 結構。");
      return layers;
    }
    function validateGraph(nodes, edges) {
      if (!nodes.length) return { ok: false, message: "畫布沒有節點" };
      try {
        const layers = topologicalLayers(nodes, edges);
        const disconnected = nodes.filter(node => !edges.some(edge => edge.source === node.id || edge.target === node.id));
        return { ok: true, layers, disconnected, message: disconnected.length ? `圖形有效，但有 ${disconnected.length} 個孤立節點` : `DAG 有效，共 ${layers.length} 個執行層` };
      } catch (error) {
        return { ok: false, message: error.message };
      }
    }
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function FlowNode(props) {
      const data = props.data || {};
      const kind = TYPE_MAP[data.kind] || TYPE_MAP.action;
      const status = data.status || "idle";
      return h("div", {
        className: `flow-node ${props.selected ? "selected" : ""} ${status}`,
        "data-kind": data.kind,
        "data-node-label": data.label,
        title: `${kind.name} · ${data.label}`
      },
        h(Handle, { type: "target", position: Position.Left, className: "rf-handle", "aria-label": "輸入連接點" }),
        h("div", { className: "node-accent" }),
        h("div", { className: "node-body" },
          h("div", { className: "node-top" },
            h("span", { className: "node-kind" }, kind.name),
            h("span", { className: `node-state ${status}`, title: `狀態：${status}` })
          ),
          h("div", { className: "node-label" }, data.label || "未命名節點"),
          h("div", { className: "node-description" }, data.description || kind.description),
          h("div", { className: "node-footer" },
            h("span", null, data.owner || "Unassigned"),
            h("b", null, status === "idle" ? "READY" : status.toUpperCase())
          )
        ),
        h(Handle, { type: "source", position: Position.Right, className: "rf-handle", "aria-label": "輸出連接點" })
      );
    }
    const nodeTypes = { atlas: FlowNode };

    function Button(props) {
      const { className, children, ...rest } = props;
      return h("button", Object.assign({ type: "button", className: `button ${className || ""}` }, rest), children);
    }
    function StatusPill(props) {
      return h("span", { className: `status-pill ${props.status || ""}` },

        props.children
      );
    }

    function App() {
      const [workspace, setWorkspace] = React.useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.workflows) && parsed.workflows.length) return parsed;
          }
        } catch (_) {}
        return initialWorkspace();
      });
      const [view, setView] = React.useState("builder");
      const [compactViewport, setCompactViewport] = React.useState(() => window.innerWidth <= 560);
      const [selection, setSelection] = React.useState({ type: "node", id: "on-form" });
      const [inspectorTab, setInspectorTab] = React.useState("settings");
      const [search, setSearch] = React.useState("");
      const [rfInstance, setRfInstance] = React.useState(null);
      const [toasts, setToasts] = React.useState([]);
      const [logs, setLogs] = React.useState([{ id: 1, time: nowTime(), level: "ok", title: "工作區就緒", message: "已載入本機工作流草稿" }]);
      const [isRunning, setIsRunning] = React.useState(false);
      const historyRef = React.useRef([]);
      const futureRef = React.useRef([]);
      const dragSnapshotRef = React.useRef(null);
      const abortRef = React.useRef(false);
      const fileInputRef = React.useRef(null);
      const logSeed = React.useRef(10);
      const toastSeed = React.useRef(10);

      const active = workspace.workflows.find(item => item.id === workspace.activeId) || workspace.workflows[0];
      const nodes = active ? active.nodes : [];
      const edges = active ? active.edges : [];
      const selectedNode = selection && selection.type === "node" ? nodes.find(node => node.id === selection.id) : null;
      const selectedEdge = selection && selection.type === "edge" ? edges.find(edge => edge.id === selection.id) : null;
      const graphHealth = validateGraph(nodes, edges);

      const notify = React.useCallback((title, detail) => {
        const id = ++toastSeed.current;
        setToasts(items => [...items.slice(-2), { id, title, detail: detail || "" }]);
        window.setTimeout(() => setToasts(items => items.filter(item => item.id !== id)), 2600);
      }, []);
      const addLog = React.useCallback((level, title, message) => {
        setLogs(items => [{ id: ++logSeed.current, time: nowTime(), level, title, message: message || "" }, ...items].slice(0, 80));
      }, []);
      const currentSnapshot = React.useCallback(() => ({ nodes: clone(nodes), edges: clone(edges) }), [nodes, edges]);
      const replaceGraph = React.useCallback((graph, options) => {
        const opts = options || {};
        setWorkspace(prev => Object.assign({}, prev, {
          workflows: prev.workflows.map(item => item.id === prev.activeId ? Object.assign({}, item, {
            nodes: clone(graph.nodes), edges: clone(graph.edges), updatedAt: "剛剛", draft: opts.draft !== false
          }) : item)
        }));
      }, []);
      const commitGraph = React.useCallback((graph, label) => {
        historyRef.current.push(currentSnapshot());
        if (historyRef.current.length > 60) historyRef.current.shift();
        futureRef.current = [];
        replaceGraph(graph);
        if (label) addLog("info", label, "變更已加入復原歷史");
      }, [currentSnapshot, replaceGraph, addLog]);
      const undo = React.useCallback(() => {
        if (!historyRef.current.length) return;
        futureRef.current.push(currentSnapshot());
        replaceGraph(historyRef.current.pop());
        setSelection(null);
        notify("已復原上一個變更");
      }, [currentSnapshot, replaceGraph, notify]);
      const redo = React.useCallback(() => {
        if (!futureRef.current.length) return;
        historyRef.current.push(currentSnapshot());
        replaceGraph(futureRef.current.pop());
        setSelection(null);
        notify("已重做變更");
      }, [currentSnapshot, replaceGraph, notify]);

      const patchCurrentWorkflow = React.useCallback(patch => {
        setWorkspace(prev => Object.assign({}, prev, {
          workflows: prev.workflows.map(item => item.id === prev.activeId ? Object.assign({}, item, patch, { updatedAt: "剛剛", draft: true }) : item)
        }));
      }, []);
      const setNodesTransient = React.useCallback(updater => {
        setWorkspace(prev => Object.assign({}, prev, {
          workflows: prev.workflows.map(item => {
            if (item.id !== prev.activeId) return item;
            const nextNodes = typeof updater === "function" ? updater(item.nodes) : updater;
            return Object.assign({}, item, { nodes: nextNodes, updatedAt: "剛剛", draft: true });
          })
        }));
      }, []);
      const setEdgesTransient = React.useCallback(updater => {
        setWorkspace(prev => Object.assign({}, prev, {
          workflows: prev.workflows.map(item => {
            if (item.id !== prev.activeId) return item;
            const nextEdges = typeof updater === "function" ? updater(item.edges) : updater;
            return Object.assign({}, item, { edges: nextEdges, updatedAt: "剛剛", draft: true });
          })
        }));
      }, []);

      React.useEffect(() => {
        const timer = window.setTimeout(() => {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(workspace)); } catch (_) {}
        }, 180);
        return () => window.clearTimeout(timer);
      }, [workspace]);

        const handleResize = () => setCompactViewport(window.innerWidth <= 560);

        return () => window.removeEventListener("resize", handleResize);
      }, []);
      React.useEffect(() => {
        const handleKey = event => {
          const tag = event.target && event.target.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
