<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FlowForge DAG 工作流可視化編排器，使用 React Flow UMD 單檔運行。" />
  <title>FlowForge / DAG 工作流編排器</title>

  <!-- UMD 載入順序固定：React -> ReactDOM -> React Flow -> Babel -> App -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
  <script src="https://unpkg.com/@babel/standalone@7.25.7/babel.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f12;
      --bg-deep: #070b0d;
      --surface: #10181c;
      --surface-2: #142126;
      --surface-3: #1a2b30;
      --surface-4: #21383d;
      --line: #263a3f;
      --line-strong: #38535a;
      --text: #e8f1ed;
      --muted: #8ca29c;
      --faint: #5f7773;
      --lime: #b9f36b;
      --lime-dark: #79b94e;
      --teal: #62d8c1;
      --amber: #f2b764;
      --orange: #f18d61;
      --red: #f27575;
      --blue: #78aef5;
      --violet: #bba7f2;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
      --sans: "IBM Plex Sans", "Noto Sans TC", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; margin: 0; }
    body {
      min-width: 320px;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg-deep);
      transition: opacity 220ms ease, visibility 220ms ease;
    }
    .boot-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-card {
      width: min(430px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .boot-card h1 { margin: 0 0 7px; font-size: 17px; letter-spacing: -0.02em; }
    .boot-card p { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .boot-check { display: flex; align-items: center; gap: 9px; margin: 8px 0; color: var(--muted); font: 11px var(--mono); }
    .boot-check .mark { width: 16px; text-align: center; color: var(--faint); }
    .boot-check.ok { color: var(--text); }
    .boot-check.ok .mark { color: var(--lime); }
    .boot-check.bad { color: var(--red); }
    .boot-check.bad .mark { color: var(--red); }
    .boot-error { margin-top: 16px; padding: 10px 12px; border: 1px solid rgba(242,117,117,.35); border-radius: var(--radius-sm); color: #ffc2c2; background: rgba(114, 31, 31, .2); font: 10px/1.6 var(--mono); word-break: break-word; }
    .boot-retry { margin-top: 16px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-3); color: var(--text); }

    .app-shell { display: flex; flex-direction: column; min-height: 100dvh; }
    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: #0d1518;
      flex-wrap: wrap;
      position: relative;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 155px; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--lime-dark);
      border-radius: 8px;
      color: var(--lime);
      font: 700 11px var(--mono);
      letter-spacing: -0.12em;
      background: rgba(185,243,107,.06);
    }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.03em; }
    .brand-sub { margin-top: 2px; color: var(--faint); font: 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .workflow-meta { display: flex; align-items: center; gap: 10px; min-width: 180px; flex: 1 1 250px; }
    .workflow-name-input {
      width: min(330px, 100%);
      min-width: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      outline: 0;
      padding: 5px 0;
      color: var(--text);
      background: transparent;
      font-size: 14px;
      font-weight: 650;
    }
    .workflow-name-input:hover, .workflow-name-input:focus { border-bottom-color: var(--line-strong); }
    .draft-badge { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: 10px var(--mono); white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px rgba(185,243,107,.08); }
    .status-dot.warn { background: var(--amber); }
    .status-dot.bad { background: var(--red); }
    .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .toolbar-button, .primary-button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text);
      font-size: 11px;
      transition: background 140ms ease, border-color 140ms ease, transform 100ms ease;
    }
    .toolbar-button:hover { background: var(--surface-3); border-color: var(--teal); }
    .toolbar-button:active, .primary-button:active { transform: translateY(1px); }
    .toolbar-button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    .toolbar-button.ghost:hover { border-color: var(--line); color: var(--text); }
    .primary-button { border-color: var(--lime); background: var(--lime); color: #17210d; font-weight: 700; }
    .primary-button:hover { background: #caf985; }
    .toolbar-sep { width: 1px; height: 22px; margin: 0 3px; background: var(--line); }
    .shortcut { color: var(--faint); font: 9px var(--mono); }

    .workspace {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr) 330px;
      gap: 1px;
      flex: 1;
      min-height: 0;
      background: var(--line);
    }
    .workspace > * { min-width: 0; min-height: 0; }
    .side-panel { background: var(--surface); overflow: auto; }
    .left-panel { padding: 16px 13px 20px; }
    .right-panel { padding: 0; }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 3px 4px 14px; }
    .kicker { margin: 0 0 5px; color: var(--faint); font: 9px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
    .panel-title { margin: 0; font-size: 14px; letter-spacing: -0.02em; }
    .panel-count { color: var(--faint); font: 10px var(--mono); }
    .section-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 4px 8px; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .section-label:first-of-type { margin-top: 0; }
    .section-label small { color: var(--faint); font: 9px var(--mono); text-transform: none; letter-spacing: 0; }
    .palette-list { display: grid; gap: 6px; }
    .palette-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      color: var(--text);
      text-align: left;
      user-select: none;
      transition: border-color 140ms ease, background 140ms ease, transform 100ms ease;
    }
    .palette-item:hover { border-color: var(--line-strong); background: var(--surface-3); }
    .palette-item:active { transform: scale(.99); }
    .palette-glyph { width: 25px; height: 25px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 6px; color: #0b1110; font: 700 12px var(--mono); }
    .palette-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .palette-name { font-size: 11px; font-weight: 650; }
    .palette-desc { overflow: hidden; color: var(--faint); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .template-list { display: grid; gap: 6px; }
    .template-button { padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: transparent; color: var(--text); text-align: left; }
    .template-button:hover { border-color: var(--teal); background: rgba(98,216,193,.05); }
    .template-button strong { display: block; font-size: 11px; }
    .template-button span { display: block; margin-top: 3px; color: var(--faint); font-size: 9px; line-height: 1.4; }
    .rule-card { padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(8, 14, 16, .35); }
    .rule-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; color: var(--muted); font-size: 10px; }
    .rule-row + .rule-row { border-top: 1px solid rgba(38,58,63,.65); }
    .rule-value { color: var(--text); font: 10px var(--mono); }
    .rule-value.valid { color: var(--lime); }
    .rule-value.invalid { color: var(--red); }
    .tip { margin: 14px 4px 0; color: var(--faint); font-size: 10px; line-height: 1.65; }
    .tip kbd { padding: 1px 4px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--muted); font: 9px var(--mono); }

    .canvas-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
    .canvas-toolbar { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
    .canvas-heading { min-width: 0; }
    .canvas-heading h1 { overflow: hidden; margin: 0; font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .canvas-heading p { margin: 4px 0 0; color: var(--faint); font: 9px var(--mono); letter-spacing: .04em; }
    .canvas-actions { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .canvas-button { min-height: 30px; padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: transparent; color: var(--muted); font-size: 10px; }
    .canvas-button:hover { border-color: var(--teal); color: var(--text); background: rgba(98,216,193,.05); }
    .graph-stage { position: relative; flex: 1; min-height: 0; background-color: var(--bg); background-image: linear-gradient(rgba(98,216,193,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(98,216,193,.035) 1px, transparent 1px); background-size: 32px 32px; }
    .react-host { width: 100%; height: 100%; min-height: 440px; }
    .graph-overlay { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .graph-chip { position: absolute; top: 12px; left: 13px; display: inline-flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(10,15,18,.88); color: var(--muted); font: 9px var(--mono); pointer-events: auto; }
    .graph-chip strong { color: var(--lime); font-weight: 600; }
    .graph-hint { position: absolute; right: 13px; bottom: 13px; max-width: 255px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(10,15,18,.9); color: var(--muted); font-size: 10px; line-height: 1.55; pointer-events: auto; }
    .graph-hint b { color: var(--text); font-weight: 600; }
    .graph-hint kbd { padding: 1px 4px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--text); font: 9px var(--mono); }
    .legend { position: absolute; left: 13px; bottom: 13px; display: flex; gap: 10px; flex-wrap: wrap; max-width: 52%; padding: 8px 9px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(10,15,18,.9); color: var(--muted); font-size: 9px; pointer-events: auto; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-mark { width: 7px; height: 7px; border-radius: 2px; }

    .inspector-tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
    .inspector-tab { flex: 1; min-height: 48px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--faint); font-size: 11px; }
    .inspector-tab:hover { color: var(--muted); }
    .inspector-tab.active { border-bottom-color: var(--lime); color: var(--text); }
    .inspector-body { padding: 16px 14px 22px; overflow: auto; height: calc(100% - 49px); }
    .inspector-heading { margin: 0 0 4px; font-size: 14px; }
    .inspector-sub { margin: 0 0 16px; color: var(--faint); font: 9px var(--mono); line-height: 1.5; }
    .empty-state { padding: 15px 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--muted); font-size: 11px; line-height: 1.6; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; margin-bottom: 14px; }
    .metric { padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); }
    .metric-label { color: var(--faint); font: 9px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
    .metric-value { margin-top: 5px; color: var(--text); font: 600 17px var(--mono); }
    .metric-value.good { color: var(--lime); }
    .field { margin-top: 13px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font: 10px var(--mono); }
    .field input[type=text], .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 9px; outline: 0; background: var(--bg-deep); color: var(--text); font-size: 11px; }
    .field textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
    .field input[type=text]:focus, .field textarea:focus, .field select:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(98,216,193,.1); }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 11px; }
    .check-row input { accent-color: var(--lime); }
    .inspector-actions { display: flex; gap: 6px; margin-top: 18px; }
    .inspector-actions button { flex: 1; min-height: 32px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-3); color: var(--text); font-size: 10px; }
    .inspector-actions button.primary { border-color: var(--lime); background: var(--lime); color: #142008; font-weight: 700; }
    .inspector-actions button.danger { border-color: rgba(242,117,117,.4); background: rgba(114,31,31,.22); color: #ffb1b1; }
    .subheading { margin: 19px 0 8px; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .run-log { display: grid; gap: 5px; }
    .log-item { display: grid; grid-template-columns: 45px minmax(0,1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(38,58,63,.7); }
    .log-time { color: var(--faint); font: 9px var(--mono); }
    .log-message { color: var(--muted); font-size: 10px; line-height: 1.45; word-break: break-word; }
    .log-message b { color: var(--text); font-weight: 600; }
    .log-item.success .log-message { color: #bde8bb; }
    .log-item.error .log-message { color: #ffb4b4; }
    .log-item.running .log-message { color: #f8d69c; }
    .log-clear { width: 100%; min-height: 30px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: transparent; color: var(--muted); font-size: 10px; }
    .log-clear:hover { border-color: var(--teal); color: var(--text); }

    .statusbar { min-height: 34px; display: flex; align-items: center; gap: 14px; padding: 0 15px; border-top: 1px solid var(--line); background: #0d1518; color: var(--muted); font: 9px var(--mono); flex-wrap: wrap; }
    .statusbar strong { color: var(--text); font-weight: 500; }
    .statusbar .spacer { flex: 1; }
    .status-run { display: inline-flex; align-items: center; gap: 7px; }
    .status-run .status-dot.running { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
    .status-run .status-dot.bad { background: var(--red); }
    @keyframes pulse { 50% { opacity: .42; transform: scale(.8); } }

    .rf-node {
      position: relative;
      width: 190px;
      min-height: 88px;
      padding: 10px 11px 9px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text);
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
      transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }
    .rf-node:hover { border-color: #54767b; background: #17282d; }
    .rf-node.selected { border-color: var(--lime); box-shadow: 0 0 0 1px rgba(185,243,107,.7), 0 12px 28px rgba(0,0,0,.32); }
    .node-rail { position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--node-accent); }
    .node-status-light { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); border: 1px solid var(--surface-2); }
    .rf-node.running { border-color: var(--amber); }
    .rf-node.running .node-status-light { background: var(--amber); box-shadow: 0 0 0 4px rgba(242,183,100,.12); animation: pulse 1s ease-in-out infinite; }
    .rf-node.success { border-color: var(--lime-dark); }
    .rf-node.success .node-status-light { background: var(--lime); }
    .rf-node.failed { border-color: var(--red); }
    .rf-node.failed .node-status-light { background: var(--red); }
    .rf-node.skipped { opacity: .52; }
    .rf-node.skipped .node-status-light { background: var(--faint); }
    .node-kind { color: var(--node-accent); font: 9px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .node-title { margin: 8px 0 3px; padding-right: 13px; overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .node-description { margin: 0; min-height: 15px; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .node-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; color: var(--faint); font: 9px var(--mono); }
    .node-foot span:last-child { color: var(--muted); }
    .react-flow__handle { width: 8px; height: 8px; border: 2px solid var(--bg); background: var(--teal); }
    .react-flow { background: transparent; }
    .react-flow__background { background: transparent; }
    .react-flow__controls { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow); }
    .react-flow__controls-button { width: 28px; height: 28px; border-bottom: 1px solid var(--line); background: var(--surface-2); fill: var(--muted); color: var(--muted); }
    .react-flow__controls-button:hover { background: var(--surface-3); fill: var(--text); }
    .react-flow__minimap { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .react-flow__attribution { display: none; }
    .react-flow__edge-path { stroke: #50777a; stroke-width: 1.7; }
    .react-flow__edge.selected .react-flow__edge-path { stroke: var(--lime); stroke-width: 2.5; }
    .react-flow__edge.animated .react-flow__edge-path { stroke: var(--teal); stroke-dasharray: 5 4; animation: edge-flow .7s linear infinite; }
    .react-flow__edge-text { fill: var(--text); font: 10px var(--mono); }
    .react-flow__edge-textbg { fill: var(--surface); }
    @keyframes edge-flow { to { stroke-dashoffset: -9; } }

    .toast-region { position: fixed; right: 18px; bottom: 52px; z-index: 100; display: grid; gap: 7px; width: min(340px, calc(100vw - 36px)); pointer-events: none; }
    .toast { padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: #142126; color: var(--text); box-shadow: var(--shadow); font-size: 11px; line-height: 1.45; pointer-events: auto; animation: toast-in 180ms ease both; }
    .toast.good { border-color: rgba(185,243,107,.45); }
    .toast.warn { border-color: rgba(242,183,100,.5); color: #ffe0ac; }
    .toast.bad { border-color: rgba(242,117,117,.5); color: #ffc0c0; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 220px minmax(0,1fr); }
      .right-panel { display: none; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app-shell { min-height: 100dvh; }
      .topbar { align-items: flex-start; gap: 12px; padding: 12px; }
      .brand { min-width: 135px; }
      .workflow-meta { order: 3; flex-basis: 100%; }
      .workflow-name-input { width: 100%; }
      .toolbar { margin-left: auto; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(560px, 1fr); min-height: 0; }

        return <div className="app-shell"><header className="topbar"><div className="brand"><div className="brand-mark">FF</div><div><div className="brand-name">FlowForge</div><div className="brand-sub">signal room / graph studio</div></div></div><div className="workflow-meta"><input className="workflow-name-input" aria-label="工作流名稱" value={workflowName} onChange={function (event) { setWorkflowName(event.target.value); }} /><span className="draft-badge"><span className="status-dot"></span>LOCAL DRAFT</span></div><div className="toolbar"><button type="button" className="toolbar-button ghost" onClick={undo} disabled={!canUndo}>復原 <span className="shortcut">⌘Z</span></button><button type="button" className="toolbar-button ghost" onClick={redo} disabled={!canRedo}>重做 <span className="shortcut">⌘Y</span></button><span className="toolbar-sep"></span><button type="button" className="toolbar-button" onClick={function () { fileInput.current.click(); }}>匯入</button><button type="button" className="toolbar-button" onClick={exportGraph}>匯出</button><input ref={fileInput} type="file" accept="application/json" hidden onChange={function (event) { if (event.target.files && event.target.files[0]) importGraph(event.target.files[0]); event.target.value = ""; }} /><span className="toolbar-sep"></span><button type="button" className="primary-button" onClick={runSimulation} disabled={runState.running || !analysis.valid || !graph.nodes.length}>執行 DAG</button></div></header><div className="workspace"><Palette onAdd={addNode} onTemplate={loadTemplate} analysis={analysis} /><GraphCanvas workflowName={workflowName} nodes={graph.nodes} edges={graph.edges} analysis={analysis} gridVisible={gridVisible} mapVisible={mapVisible} onAdd={addNode} onLayout={applyLayout} onToggleGrid={function () { setGridVisible(function (value) { return !value; }); }} onToggleMap={function () { setMapVisible(function (value) { return !value; }); }} onNodesChange={onNodesChange} onEdgesChange={onEdgesChange} onConnect={onConnect} onNodeClick={function (_, node) { setSelection({ kind: "node", id: node.id }); }} onEdgeClick={function (_, edge) { setSelection({ kind: "edge", id: edge.id }); }} onPaneClick={function () { setSelection(null); }} onNodesDelete={onNodesDelete} onEdgesDelete={onEdgesDelete} /><Inspector selection={selection} nodes={graph.nodes} edges={graph.edges} analysis={analysis} logs={logs} onRun={runSimulation} onClearLogs={function () { setLogs([]); }} onSaveNode={saveNode} onSaveEdge={saveEdge} onDelete={deleteSelection} /></div><footer className="statusbar"><span className="status-run"><span className={"status-dot " + (runState.running ? "running" : runState.error ? "bad" : "")}></span>{runState.running ? "執行中，第 " + runState.layer + "/" + runState.total + " 層" : runState.done ? "DAG 執行完成" : runState.error ? "執行錯誤：" + runState.error : analysis.valid ? "圖形已驗證" : "圖形需要修正"}</span><span>節點 <strong>{graph.nodes.length}</strong></span><span>連線 <strong>{graph.edges.length}</strong></span><span>成功 <strong>{runState.completed}</strong></span><span>跳過 <strong>{runState.skipped}</strong></span><span className="spacer"></span><span>自動儲存 {graph.nodes.length || graph.edges.length ? "已啟用" : "等待內容"}</span><button type="button" className="toolbar-button" onClick={stopRun} disabled={!runState.running}>停止</button></footer>{toast ? <div className="toast-region" aria-live="polite"><div className={"toast " + toast.type}>{toast.message}</div></div> : null}</div>;
      }

      ReactDOMLib.createRoot(document.getElementById("root")).render(<ReactFlowProvider><App /></ReactFlowProvider>);
      window.__FLOWFORGE_READY__ = true;
    }());
