<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>人事作業台｜微動畫示範</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/framer-motion@10.18.0/dist/framer-motion.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{--ink:#17221e;--muted:#718078;--paper:#f3f5ef;--card:#fbfcf8;--line:#dce4dc;--jade:#65b892;--jade-dark:#287256;--sun:#e9b84b;--coral:#e68168;--shadow:0 18px 45px rgba(39,65,52,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif}button{font:inherit;cursor:pointer;border:0}.shell{max-width:1240px;margin:auto;padding:28px 34px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{display:flex;gap:13px;align-items:center;font-weight:900;letter-spacing:.08em}.mark{width:37px;height:37px;border-radius:12px 12px 12px 3px;background:var(--ink);position:relative}.mark:after{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:var(--jade);top:9px;left:9px}.mono{font:12px 'DM Mono';color:var(--muted);letter-spacing:.08em}.nav{display:flex;gap:10px;align-items:center}.nav button{background:transparent;color:var(--muted);padding:9px 12px;border-radius:8px}.nav button:hover{color:var(--ink);background:#e7eee8}.avatar{width:36px;height:36px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:900;margin-left:12px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:65px;align-items:end;margin-bottom:44px}.eyebrow{color:var(--jade-dark);font-weight:900;font-size:13px;letter-spacing:.16em;margin-bottom:15px}.hero h1{font-size:clamp(38px,5vw,72px);line-height:1.06;letter-spacing:-.07em;margin:0 0 19px;font-weight:900}.hero p{color:var(--muted);max-width:490px;line-height:1.9;margin:0}.pulse{justify-self:end;width:100%;max-width:350px;background:var(--ink);color:#f2f7f0;border-radius:24px;padding:26px;position:relative;overflow:hidden}.pulse:before{content:'';position:absolute;width:200px;height:200px;background:var(--jade);opacity:.24;filter:blur(50px);right:-50px;top:-70px}.pulse-title{display:flex;justify-content:space-between;position:relative}.pulse strong{font-size:34px;display:block;margin-top:17px}.pulse small{color:#b3c7bb}.dashboard{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 16px}.card h2{font-size:17px;margin:0}.filter{color:var(--jade-dark);background:#e5f2e9;border-radius:8px;padding:7px 10px;font-size:12px}.cases{padding:0 12px 12px}.case{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:15px;padding:18px 12px;border-top:1px solid #edf1ec}.dot{width:8px;height:8px;border-radius:50%;background:var(--jade)}.dot.amber{background:var(--sun)}.dot.coral{background:var(--coral)}.case-title{font-weight:700;font-size:14px}.case-meta{font-size:12px;color:var(--muted);margin-top:5px}.status{font-size:11px;border-radius:99px;padding:6px 9px;background:#edf5ee;color:var(--jade-dark)}.status.wait{background:#fff4da;color:#947026}.side{padding-bottom:16px}.metric{padding:18px 24px;border-top:1px solid #edf1ec}.metric:first-of-type{border-top:0}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-size:30px;font-weight:900;margin-top:5px}.bar{height:7px;background:#e8eee9;border-radius:20px;margin-top:12px;overflow:hidden}.bar i{height:100%;display:block;background:var(--jade);border-radius:20px}.activity{margin-top:18px;padding:23px 24px}.activity h2{margin:0 0 18px;font-size:17px}.feed{display:flex;gap:13px;align-items:flex-start;padding:12px 0}.feed-icon{width:27px;height:27px;border-radius:9px;background:#e4f1e7;color:var(--jade-dark);display:grid;place-items:center;font-size:13px}.feed p{margin:0;font-size:13px;line-height:1.5}.feed time{font:10px 'DM Mono';color:var(--muted);display:block;margin-top:4px}@media(max-width:800px){.shell{padding:20px}.hero,.dashboard{grid-template-columns:1fr}.pulse{justify-self:stretch;max-width:none}.top{margin-bottom:35px}.nav button{display:none}}
</style>
</head>
<body><div id="root"></div>
<script>
const {useState}=React; const {motion,AnimatePresence}=window.Motion;
const cases=[{t:'王怡君｜育嬰留停申請',m:'案件編號 HR-2048 · 今日 09:42',s:'待審核',c:'amber'},{t:'林冠宇｜年度考核覆核',m:'案件編號 HR-2047 · 昨日 16:18',s:'處理中',c:''},{t:'陳思妤｜到職資料確認',m:'案件編號 HR-2042 · 7月28日',s:'已完成',c:'coral'}];
function App(){const [toast,setToast]=useState(false),[active,setActive]=useState(null);const notify=()=>{setToast(true);setTimeout(()=>setToast(false),2400)};return <div className="shell"><motion.header className="top" initial={{opacity:0,y:-14}} animate={{opacity:1,y:0}} transition={{duration:.5}}><div className="brand"><span className="mark"/>人事作業台</div><nav className="nav"><button onClick={notify}>案件總覽</button><button onClick={notify}>團隊排程</button><button onClick={notify}>報表</button><span className="avatar">怡</span></nav></motion.header><main><motion.section className="hero" initial="hidden" animate="show" variants={{show:{transition:{staggerChildren:.12}},hidden:{}}}><div><motion.div className="eyebrow" variants={{hidden:{opacity:0,x:-15},show:{opacity:1,x:0}}}>WEDNESDAY · 30 JUL 2026</motion.div><motion.h1 variants={{hidden:{opacity:0,y:20},show:{opacity:1,y:0}}}>讓每一件<br/><em>人事小事</em>更順。</motion.h1><motion.p variants={{hidden:{opacity:0,y:15},show:{opacity:1,y:0}}}>集中追蹤、清楚交接，將繁瑣的行政流程變成團隊可以信任的節奏。</motion.p></div><motion.div className="pulse" whileHover={{y:-5,boxShadow:'0 24px 50px rgba(21,48,37,.18)'}} transition={{type:'spring',stiffness:300}}><div className="pulse-title"><span className="mono">TODAY'S PULSE</span><span>↗</span></div><strong>12 <small>件待處理</small></strong><div className="mono" style={{marginTop:12,color:'#b3c7bb'}}>比上週少 18% · 進度穩定</div></motion.div></motion.section><section className="dashboard"><motion.div className="card" initial={{opacity:0,y:22}} animate={{opacity:1,y:0}} transition={{delay:.35}}><div className="card-head"><h2>最近案件</h2><button className="filter" onClick={notify}>全部狀態⌄</button></div><div className="cases"><AnimatePresence>{cases.map((x,i)=><motion.button layout key={x.t} className="case" onClick={()=>{setActive(i);notify()}} whileHover={{x:5,backgroundColor:'#f1f7f1'}} whileTap={{scale:.985}} style={{width:'100%',textAlign:'left',background:'transparent'}}><span className={'dot '+x.c}/><span><span className="case-title">{x.t}</span><span className="case-meta">{x.m}</span></span><span className={'status '+(x.s==='待審核'?'wait':'')}>{active===i?'已開啟':x.s}</span></motion.button>)}</AnimatePresence></div></motion.div><motion.div className="card side" initial={{opacity:0,y:22}} animate={{opacity:1,y:0}} transition={{delay:.48}}><div className="card-head"><h2>本月節奏</h2><span className="mono">JUL</span></div><div className="metric"><div className="metric-label">平均處理時間</div><div className="metric-value">1.8 <small style={{fontSize:13,color:'var(--muted)'}}>日</small></div><div className="bar"><i style={{width:'72%'}}/></div></div><div className="metric"><div className="metric-label">準時完成率</div><div className="metric-value">94%</div><div className="bar"><i style={{width:'94%',background:'var(--sun)'}}/></div></div></motion.div></section><motion.section className="card activity" initial={{opacity:0}} animate={{opacity:1}} transition={{delay:.62}}><h2>團隊動態</h2><div className="feed"><span className="feed-icon">✓</span><p><b>蔡佩珊</b> 完成了「到職資料確認」<time>12 分鐘前</time></p></div><div className="feed"><span className="feed-icon">↗</span><p><b>系統</b> 已將 3 件案件分派給你<time>35 分鐘前</time></p></div></motion.section></main>{toast&&<motion.div initial={{opacity:0,y:15,scale:.94}} animate={{opacity:1,y:0,scale:1}} exit={{opacity:0}} style={{position:'fixed',bottom:28,left:'50%',transform:'translateX(-50%)',background:'var(--ink)',color:'#fff',padding:'12px 18px',borderRadius:99,fontSize:13,boxShadow:'var(--shadow)'}}>動作已記錄，流程保持順暢 ✓</motion.div>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
