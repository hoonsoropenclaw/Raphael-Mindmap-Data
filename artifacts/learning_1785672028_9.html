<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2048 I18N — Phaser Multilingual Puzzle</title>
<style>
  :root {
    --bg-0:#0f1024;
    --bg-1:#1a1b3a;
    --accent:#7c5cff;
    --text:#e8e8ff;
    --muted:#9aa0c5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", system-ui, sans-serif;
    background: radial-gradient(ellipse at top, #1a1b3a 0%, #0f1024 60%, #06061a 100%);
    color: var(--text);
  }
  .wrap {
    max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  h1 {
    font-size: 22px; margin: 0; letter-spacing: 0.5px;
    background: linear-gradient(90deg, #7c5cff, #42e3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 13px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .btn {
    background: rgba(124,92,255,0.15);
    border: 1px solid rgba(124,92,255,0.45);
    color: var(--text);
    padding: 7px 14px; border-radius: 8px; font-size: 13px;
    cursor: pointer; transition: all 0.15s ease;
  }
  .btn:hover { background: rgba(124,92,255,0.3); transform: translateY(-1px); }
  .btn.active { background: var(--accent); color: white; }
  .stage {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) 320px;
    gap: 20px; align-items: start;
  }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }
  .board-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(124,92,255,0.2);
    border-radius: 14px; padding: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  #game {
    border-radius: 10px; overflow: hidden; display: block;
    margin: 0 auto;
    touch-action: none;
  }
  .side {
    display: flex; flex-direction: column; gap: 14px;
  }
  .panel {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px; padding: 14px;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 14px; letter-spacing: 0.5px;
    color: var(--muted); text-transform: uppercase; font-weight: 600;
  }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .stat-row .k { color: var(--muted); }
  .stat-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .controls .btn { padding: 14px 0; font-size: 18px; }
  .controls .empty { visibility: hidden; }
  .help { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .lang-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(124,92,255,0.2); border: 1px solid rgba(124,92,255,0.4); }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(15,16,36,0.85); border-radius: 10px; backdrop-filter: blur(4px);
    font-size: 24px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; }
  .board-wrap { position: relative; }
  footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title">2048 · 多語言益智</h1>
      <div class="sub" data-i18n="subtitle">Phaser 3 · i18n · 4×4 合併</div>
    </div>
    <div class="toolbar">
      <span class="lang-pill" data-i18n="lang_label">語言 / Language</span>
      <button class="btn lang-btn" data-lang="zh-TW">繁中</button>
      <button class="btn lang-btn" data-lang="en-US">EN</button>
      <button class="btn lang-btn" data-lang="ja-JP">日本語</button>
      <button class="btn" id="newGameBtn" data-i18n="new_game">新局</button>
    </div>
  </header>

  <div class="stage">
    <div class="board-card">
      <div class="board-wrap">
        <div id="game"></div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <h2 data-i18n="panel_stats">數據 / Stats</h2>
        <div class="stat-row"><span class="k" data-i18n="score">分數</span><span class="v" id="scoreVal">0</span></div>
        <div class="stat-row"><span class="k" data-i18n="best">最高分</span><span class="v" id="bestVal">0</span></div>
        <div class="stat-row"><span class="k" data-i18n="moves">步數</span><span class="v" id="movesVal">0</span></div>
        <div class="stat-row"><span class="k">FPS</span><span class="v" id="fpsVal">--</span></div>
      </div>

      <div class="panel">
        <h2 data-i18n="panel_controls">操作 / Controls</h2>
        <div class="controls">
          <div class="empty"></div>
          <button class="btn" data-dir="up">↑</button>
          <div class="empty"></div>
          <button class="btn" data-dir="left">←</button>
          <button class="btn" data-dir="down">↓</button>
          <button class="btn" data-dir="right">→</button>
        </div>
        <p class="help" style="margin-top:10px" data-i18n="hint_keys">
          鍵盤：方向鍵 / WASD · 觸控：滑動
        </p>
      </div>

      <div class="panel">
        <h2 data-i18n="panel_about">關於 / About</h2>
        <p class="help" data-i18n="about">
          經典 2048 益智遊戲:合併相同方塊直到 2048。<br>
          切換語言即時更新所有 UI。<br>
          使用 Phaser 3.80 + JSON i18n 詞典。
        </p>
      </div>
    </div>
  </div>

  <footer>Built with Phaser 3 · single-file · CDN only</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* ============================================================
   i18n module
   ============================================================ */
const I18N = {
  'zh-TW': {
    title: '2048 · 多語言益智',
    subtitle: 'Phaser 3 · i18n · 4×4 合併',
    lang_label: '語言 / Language',
    new_game: '新局',
    panel_stats: '數據',
    score: '分數',
    best: '最高分',
    moves: '步數',
    panel_controls: '操作',
    hint_keys: '鍵盤:方向鍵 / WASD · 觸控:滑動',
    panel_about: '關於',
    about: '經典 2048 益智:合併相同方塊直到 2048。<br>切換語言即時更新所有 UI。<br>使用 Phaser 3.80 + JSON i18n 詞典。',
    game_over: '遊戲結束',
    you_win: '你贏了！',
    try_again: '再玩一次',
    tile_power: '方塊 威力'
  },
  'en-US': {
    title: '2048 · Multilingual Puzzle',
    subtitle: 'Phaser 3 · i18n · 4×4 merge',
    lang_label: 'Language',
    new_game: 'New',
    panel_stats: 'Stats',
    score: 'Score',
    best: 'Best',
    moves: 'Moves',
    panel_controls: 'Controls',
    hint_keys: 'Keyboard: Arrows / WASD · Touch: swipe',
    panel_about: 'About',
    about: 'Classic 2048 puzzle: merge same tiles up to 2048.<br>Switch language for instant UI update.<br>Built on Phaser 3.80 + JSON i18n dictionary.',
    game_over: 'Game Over',
    you_win: 'You Win!',
    try_again: 'Play Again',
    tile_power: 'Tile Power'
  },
  'ja-JP': {
    title: '2048 · 多言語パズル',
    subtitle: 'Phaser 3 · i18n · 4×4 マージ',
    lang_label: '言語 / Language',
    new_game: '新規',
    panel_stats: 'ステータス',
    score: 'スコア',
    best: 'ベスト',
    moves: '手数',
    panel_controls: '操作',
    hint_keys: 'キーボード:矢印 / WASD · タッチ:スワイプ',
    panel_about: 'について',
    about: 'クラシック 2048:同じタイルを合体させて 2048 を目指そう。<br>言語を切り替えると UI が即時更新されます。<br>Phaser 3.80 + JSON i18n 辞書を使用。',
    game_over: 'ゲームオーバー',
    you_win: '勝利！',
    try_again: 'もう一度',
    tile_power: 'タイル威力'
  }
};

const I18N_NUMBERS = {
  // 阿拉伯數字 -> 阿拉伯數字(西文/中日文都用) ; 改為真正本地化
  'zh-TW': v => v.toLocaleString('zh-TW'),
  'en-US': v => v.toLocaleString('en-US'),
  'ja-JP': v => v.toLocaleString('ja-JP')
};

let currentLang = (navigator.language || 'zh-TW');
if (!I18N[currentLang]) currentLang = currentLang.startsWith('zh') ? 'zh-TW' : currentLang.startsWith('ja') ? 'ja-JP' : 'en-US';

function t(key) { return (I18N[currentLang] && I18N[currentLang][key]) || I18N['en-US'][key] || key; }
function fmtNum(v) { return (I18N_NUMBERS[currentLang] || I18N_NUMBERS['en-US'])(v); }

function applyI18n() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });
  if (window.game && window.game.scene && window.game.scene.scenes[0]) {
    const s = window.game.scene.scenes[0];
    if (s.refreshAllTexts) s.refreshAllTexts();
  }
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    applyI18n();
  });
});

/* ============================================================
   Game logic (pure, decoupled from Phaser)
   ============================================================ */
const SIZE = 4;
function emptyBoard() { return Array.from({length: SIZE}, () => Array(SIZE).fill(0)); }
function clone(b) { return b.map(row => row.slice()); }
function spawn(b) {
  const empties = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (b[r][c] === 0) empties.push([r, c]);
  if (!empties.length) return false;
  const [r, c] = empties[Math.floor(Math.random() * empties.length)];
  b[r][c] = Math.random() < 0.9 ? 2 : 4;
  return { r, c, v: b[r][c] };
}

function compress(row) {
  const filtered = row.filter(v => v !== 0);
  const out = [];
  let score = 0;
  let i = 0;
  while (i < filtered.length) {
    if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
      const merged = filtered[i] * 2;
      out.push(merged);
      score += merged;
      i += 2;
    } else {
      out.push(filtered[i]); i++;
    }
  }
  while (out.length < SIZE) out.push(0);
  return { row: out, score, changed: out.some((v, idx) => v !== row[idx]) };
}

function move(board, dir) {
  // dir: 'up'|'down'|'left'|'right'
  let totalScore = 0;
  let changed = false;
  const nb = clone(board);
  const rotated = (b) => {
    // rotate 90° CCW
    const r = emptyBoard();
    for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) r[SIZE - 1 - j][i] = b[i][j];
    return r;
  };
  let work = clone(nb);
  // normalize so we always operate on rows left-to-right
  if (dir === 'up') work = rotated(rotated(rotated(work)));
  else if (dir === 'down') work = rotated(work);
  else if (dir === 'right') work = work.map(r => r.slice().reverse());
  // left
  for (let r = 0; r < SIZE; r++) {
    const { row, score, changed: ch } = compress(work[r]);
    work[r] = row; totalScore += score; if (ch) changed = true;
  }
  // de-normalize
  if (dir === 'up') { work = rotated(work); work = rotated(rotated(rotated(work))); }
  else if (dir === 'right') work = work.map(r => r.slice().reverse());
  else if (dir === 'down') work = rotated(rotated(rotated(rotated(work))));
  return { board: work, score: totalScore, changed };
}

function canMove(b) {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (b[r][c] === 0) return true;
    if (c + 1 < SIZE && b[r][c] === b[r][c + 1]) return true;
    if (r + 1 < SIZE && b[r][c] === b[r + 1][c]) return true;
  }
  return false;
}

/* ============================================================
   Phaser scene
   ============================================================ */
const TILE_COLORS = {
  0:    { bg: 'rgba(255,255,255,0.04)', fg: 'rgba(255,255,255,0.5)' },
  2:    { bg: '#eee4da', fg: '#776e65' },
  4:    { bg: '#ede0c8', fg: '#776e65' },
  8:    { bg: '#f2b179', fg: '#f9f6f2' },
  16:   { bg: '#f59563', fg: '#f9f6f2' },
  32:   { bg: '#f67c5f', fg: '#f9f6f2' },
  64:   { bg: '#f65e3b', fg: '#f9f6f2' },
  128:  { bg: '#edcf72', fg: '#f9f6f2' },
  256:  { bg: '#edcc61', fg: '#f9f6f2' },
  512:  { bg: '#edc850', fg: '#f9f6f2' },
  1024: { bg: '#edc53f', fg: '#f9f6f2' },
  2048: { bg: '#edc22e', fg: '#f9f6f2' },
  4096: { bg: '#3c3a32', fg: '#f9f6f2' },
  8192: { bg: '#1a1a1a', fg: '#ffd700' }
};

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    const W = 480, H = 480;
    this.GAP = 12;
    this.PAD = 14;
    this.tileSize = (W - this.PAD * 2 - this.GAP * (SIZE - 1)) / SIZE;
    this.score = 0;
    this.moves = 0;
    this.board = emptyBoard();
    this.tiles = {}; // key "r,c" -> container
    this.busy = false;
    this.fpsAccum = 0; this.fpsFrames = 0; this.fpsSmooth = 60;
    this.langCache = {};

    // background board
    this.add.rectangle(W / 2, H / 2, W, H, 0x0d0e1f).setOrigin(0.5);
    this.bgSlots = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const x = this.PAD + c * (this.tileSize + this.GAP) + this.tileSize / 2;
        const y = this.PAD + r * (this.tileSize + this.GAP) + this.tileSize / 2;
        const slot = this.add.rectangle(x, y, this.tileSize, this.tileSize, 0x1a1b3a).setOrigin(0.5);
        slot.setStrokeStyle(1, 0x2a2c5a, 0.6);
        this.bgSlots.push(slot);
      }
    }

    // text labels for tile power demo (bilingual)
    this.headerText = this.add.text(W / 2, 22, t('subtitle'), { fontSize: '14px', color: '#9aa0c5' }).setOrigin(0.5);
    this.refreshAllTexts();

    // seed 2 tiles
    this._spawn();
    this._spawn();
    this._drawAll();

    // input
    this.input.keyboard.on('keydown', this._onKey, this);
    let sx = 0, sy = 0;
    this.input.on('pointerdown', (p) => { sx = p.x; sy = p.y; });
    this.input.on('pointerup', (p) => {
      const dx = p.x - sx, dy = p.y - sy;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) this._attempt(dx > 0 ? 'right' : 'left');
      else this._attempt(dy > 0 ? 'down' : 'up');
    });

    // expose to window for HTML overlay
    window.gameScene = this;
  }

  refreshAllTexts() {
    this.headerText.setText(t('subtitle'));
    // re-render existing tiles so numbers use new locale + new font color
    this._drawAll();
  }

  _onKey(e) {
    const map = {
      ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
      KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right',
      w:'up', s:'down', a:'left', d:'right'
    };
    const dir = map[e.code] || map[e.key];
    if (dir) { e.preventDefault?.(); this._attempt(dir); }
  }

  _attempt(dir) {
    if (this.busy) return;
    const res = move(this.board, dir);
    if (!res.changed) return;
    this.busy = true;
    this.moves += 1;
    this.score += res.score;
    this._animateMove(dir, res, () => {
      const sp = this._spawn();
      this._drawAll();
      this._updateSidePanel();
      this.busy = false;
      // game over / win check
      if (!canMove(this.board)) this._showOverlay(t('game_over'));
      else if (this.score >= 100000 && !this._winShown) { this._winShown = true; this._showOverlay(t('you_win')); }
    });
  }

  _spawn() {
    const sp = spawn(this.board);
    return sp;
  }

  _tileX(c) { return this.PAD + c * (this.tileSize + this.GAP) + this.tileSize / 2; }
  _tileY(r) { return this.PAD + r * (this.tileSize + this.GAP) + this.tileSize / 2; }

  _makeTile(value, x, y, isNew = false, isMerged = false) {
    const c = this.add.container(x, y);
    const colors = TILE_COLORS[value] || TILE_COLORS[8192];
    const bg = this.add.rectangle(0, 0, this.tileSize, this.tileSize, Phaser.Display.Color.HexStringToColor(colors.bg).color).setOrigin(0.5);
    bg.setStrokeStyle(2, 0x000000, 0.1);
    const txt = this.add.text(0, 0, fmtNum(value), {
      fontSize: this._fontSize(value) + 'px',
      color: colors.fg,
      fontStyle: 'bold',
      fontFamily: 'system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif'
    }).setOrigin(0.5);
    c.add([bg, txt]);
    c.setSize(this.tileSize, this.tileSize);
    if (isNew) c.setScale(0.01);
    return c;
  }

  _fontSize(v) {
    if (v < 100) return 36;
    if (v < 1000) return 30;
    if (v < 10000) return 24;
    return 20;
  }

  _drawAll() {
    // simplest strategy: destroy all tile containers and rebuild
    Object.values(this.tiles).forEach(t => t.destroy());
    this.tiles = {};
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = this.board[r][c];
        if (v === 0) continue;
        const t = this._makeTile(v, this._tileX(c), this._tileY(r));
        this.tiles[`${r},${c}`] = t;
      }
    }
  }

  _animateMove(dir, res, onDone) {
    // animate each row/column by sliding containers to new positions,
    // then merge, then re-draw.  Simple tween-based animation.
    // (For brevity we use a quick "slide + pop" via tweens.)
    const allTweens = [];
    const W = 480, H = 480;
    const dt = (dir === 'left' || dir === 'right') ? 1 : 0;
    const dr = (dir === 'up' || dir === 'down') ? 1 : 0;
    const sign = (dir === 'right' || dir === 'down') ? -1 : 1;

    // simulate old->new mapping by running the algorithm but tracking per-cell movement
    // We rebuild from scratch each move to keep code simple + reliable.
    // Animation: fade old tiles, build new with scale pop.
    Object.values(this.tiles).forEach(t => {
      allTweens.push(new Promise(res => {
        this.tweens.add({
          targets: t, alpha: 0, scaleX: 0.7, scaleY: 0.7, duration: 80, onComplete: () => { t.destroy(); res(); }
        });
      }));
    });
    this.tiles = {};
    Promise.all(allTweens).then(() => {
      this._drawAll();
      // pop-in
      Object.values(this.tiles).forEach(t => {
        t.setScale(0.01);
        this.tweens.add({ targets: t, scaleX: 1, scaleY: 1, duration: 140, ease: 'Back.easeOut' });
      });
      onDone && onDone();
    });
  }

  _updateSidePanel() {
    document.getElementById('scoreVal').textContent = fmtNum(this.score);
    document.getElementById('movesVal').textContent = fmtNum(this.moves);
    const best = Math.max(Number(localStorage.getItem('best2048') || 0), this.score);
    localStorage.setItem('best2048', best);
    document.getElementById('bestVal').textContent = fmtNum(best);
  }

  _showOverlay(msg) {
    const o = document.getElementById('overlay');
    o.innerHTML = msg + '<br><button class="btn" style="margin-top:14px" id="overlayBtn">' + t('try_again') + '</button>';
    o.classList.add('show');
    o.style.pointerEvents = 'auto';
    document.getElementById('overlayBtn').onclick = () => {
      o.classList.remove('show');
      o.style.pointerEvents = 'none';
      this._reset();
    };
  }

  _reset() {
    this.score = 0; this.moves = 0; this._winShown = false;
    Object.values(this.tiles).forEach(t => t.destroy());
    this.tiles = {};
    this.board = emptyBoard();
    this._spawn(); this._spawn();
    this._drawAll();
    this._updateSidePanel();
  }

  update(time, delta) {
    // FPS smoothing
    this.fpsFrames++;
    if (delta > 0) {
      const fps = 1000 / delta;
      this.fpsSmooth = this.fpsSmooth * 0.92 + fps * 0.08;
      if (this.fpsFrames % 10 === 0) {
        const el = document.getElementById('fpsVal');
        if (el) el.textContent = this.fpsSmooth.toFixed(0);
      }
    }
  }
}

window.addEventListener('load', () => {
  // initial UI i18n
  applyI18n();

  // hookup side panel buttons
  document.querySelectorAll('[data-dir]').forEach(b => {
    b.addEventListener('click', () => {
      const sc = window.gameScene;
      if (sc) sc._attempt(b.dataset.dir);
    });
  });
  document.getElementById('newGameBtn').addEventListener('click', () => {
    if (window.gameScene) window.gameScene._reset();
  });

  // Phaser config
  const config = {
    type: Phaser.AUTO,
    width: 480, height: 480,
    parent: 'game',
    backgroundColor: '#0d0e1f',
    scene: [GameScene],
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTTOM }
  };
  window.game = new Phaser.Game(config);
});
</script>
</body>
</html>
