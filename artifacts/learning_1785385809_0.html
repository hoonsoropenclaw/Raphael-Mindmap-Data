<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>人事案件處理流程圖 · RBAC 權限管理</title>
<style>
  :root{
    --bg-0:#0b1020;
    --bg-1:#141b34;
    --panel:rgba(255,255,255,0.06);
    --panel-strong:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.14);
    --text:#e8ecff;
    --text-dim:#9aa3c7;
    --accent:#7c9cff;
    --accent-2:#62e0c2;
    --danger:#ff7a7a;
    --warn:#ffb86b;
    --ok:#62e0c2;
    --info:#7c9cff;
    --shadow:0 8px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 800px at 10% 0%,#1a2350 0%,transparent 60%),radial-gradient(900px 700px at 110% 100%,#0e2a3d 0%,transparent 60%),var(--bg-0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
  .glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .app{display:grid;grid-template-columns:280px 1fr 340px;grid-template-rows:64px 1fr;height:100vh;gap:12px;padding:12px}
  header.topbar{grid-column:1/4;grid-row:1;display:flex;align-items:center;gap:14px;padding:0 18px}
  header h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:600}
  header .sub{font-size:12px;color:var(--text-dim)}
  header .spacer{flex:1}
  header .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);font-size:12px}
  header .role-switch{display:flex;align-items:center;gap:8px}
  header select{appearance:none;background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 28px 6px 10px;font-size:13px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  header select option{background:#1a2350;color:var(--text)}
  .col-left{grid-column:1;grid-row:2;padding:14px;display:flex;flex-direction:column;gap:14px;overflow:auto}
  .col-center{grid-column:2;grid-row:2;position:relative;overflow:hidden}
  .col-right{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
  .col-right section:first-child{padding:14px;overflow:auto}
  .col-right section:last-child{padding:14px;flex:1;overflow:auto;min-height:0}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin:0 0 8px 0;font-weight:600}
  .case-list{display:flex;flex-direction:column;gap:6px}
  .case-item{padding:10px 12px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.04);cursor:pointer;transition:all .15s}
  .case-item:hover{background:rgba(255,255,255,.09);border-color:var(--border)}
  .case-item.active{background:linear-gradient(135deg,rgba(124,156,255,.25),rgba(98,224,194,.15));border-color:rgba(124,156,255,.55)}
  .case-item .name{font-size:13px;font-weight:600}
  .case-item .meta{font-size:11px;color:var(--text-dim);margin-top:2px}
  .matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
  .matrix th,.matrix td{padding:6px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}
  .matrix th{font-weight:600;color:var(--text-dim);font-size:10px}
  .matrix td:first-child,.matrix th:first-child{text-align:left;color:var(--text);font-weight:500;font-size:11px;padding-left:6px}
  .perm-cell{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:10px;font-weight:700}
  .perm-y{background:rgba(98,224,194,.18);color:var(--ok);border:1px solid rgba(98,224,194,.45)}
  .perm-n{background:rgba(255,122,122,.10);color:var(--danger);border:1px solid rgba(255,122,122,.25);opacity:.55}
  .perm-c{background:rgba(255,184,107,.18);color:var(--warn);border:1px solid rgba(255,184,107,.45)}
  .matrix tr.current-role td{background:rgba(124,156,255,.10)}
  .matrix tr.current-role td:first-child{color:var(--accent);font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text-dim);margin-top:10px}
  .legend .item{display:inline-flex;align-items:center;gap:4px}
  .legend .dot{width:8px;height:8px;border-radius:50%}
  .flow-wrap{position:absolute;inset:0}
  .react-flow__node-card{padding:0;border-radius:14px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.18);color:var(--text);min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:all .2s;position:relative}
  .react-flow__node-card.locked{opacity:.55;filter:grayscale(.4)}
  .react-flow__node-card.selected{box-shadow:0 0 0 2px var(--accent),0 6px 24px rgba(0,0,0,.4)}
  .node-body{padding:10px 12px 12px}
  .node-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .node-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
  .node-title{font-size:12.5px;font-weight:700;letter-spacing:.2px}
  .node-sub{font-size:10.5px;color:var(--text-dim);margin-bottom:8px}
  .node-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10.5px;color:var(--text-dim);flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:600;border:1px solid transparent}
  .badge-pill{padding:2px 7px;border-radius:999px;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase}
  .node-actions{display:flex;gap:5px;margin-top:8px}
  .action-btn{flex:1;padding:5px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--text);font-size:10.5px;cursor:pointer;transition:all .15s;font-family:inherit}
  .action-btn:hover:not(:disabled){background:rgba(124,156,255,.20);border-color:rgba(124,156,255,.55)}
  .action-btn:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
  .node-locked-overlay{position:absolute;top:8px;right:8px;font-size:14px;opacity:.7}
  .react-flow__handle{background:var(--accent);border:2px solid rgba(0,0,0,.4);width:8px;height:8px}
  .react-flow__edge-path{stroke:rgba(124,156,255,.55);stroke-width:2}
  .react-flow__edge.selected .react-flow__edge-path{stroke:var(--accent);stroke-width:2.5}
  .react-flow__edge.animated path{stroke-dasharray:5;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-10}}
  .react-flow__edge-text{font-size:10px;fill:var(--text-dim)}
  .react-flow__edge-textbg{fill:var(--bg-1)}
  .react-flow__controls{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;overflow:hidden;backdrop-filter:blur(10px)}
  .react-flow__controls-button{background:transparent;border:none;color:var(--text);border-bottom:1px solid var(--border);padding:6px}
  .react-flow__controls-button:hover{background:rgba(255,255,255,.08)}
  .react-flow__controls-button svg{fill:var(--text)}
  .react-flow__minimap{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(10px)}
  .react-flow__background{background:transparent}
  .react-flow__attribution{background:transparent !important;color:var(--text-dim) !important;font-size:9px !important}
  .selected-node-title{font-size:13px;font-weight:700;margin:0 0 4px}
  .selected-node-sub{font-size:11px;color:var(--text-dim);margin:0 0 10px}
  .kv{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.04);margin-bottom:4px;font-size:11.5px}
  .kv .k{color:var(--text-dim)}
  .kv .v{font-weight:600}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .perm-tile{padding:6px 8px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:11px;display:flex;justify-content:space-between;align-items:center}
  .perm-tile.granted{background:rgba(98,224,194,.10);border-color:rgba(98,224,194,.35)}
  .perm-tile.denied{background:rgba(255,122,122,.08);border-color:rgba(255,122,122,.30)}
  .timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:16px}
  .timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:rgba(255,255,255,.10)}
  .tl-item{position:relative;padding:6px 0 10px 4px}
  .tl-item::before{content:"";position:absolute;left:-15px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-0)}
  .tl-item.ok::before{background:var(--ok)}
  .tl-item.warn::before{background:var(--warn)}
  .tl-item.deny::before{background:var(--danger)}
  .tl-time{font-size:10px;color:var(--text-dim)}
  .tl-actor{font-size:11.5px;font-weight:600}
  .tl-action{font-size:11px;color:var(--text-dim)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  ::-webkit-scrollbar-track{background:transparent}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(20,27,52,.95);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:12.5px;box-shadow:var(--shadow);z-index:9999;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.allow{border-color:rgba(98,224,194,.6);color:var(--ok)}
  .toast.deny{border-color:rgba(255,122,122,.6);color:var(--danger)}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script crossorigin src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>

<script>
// ===== 純 ES 資料層(放 <script> 普通腳本,Babel 不會碰;確保 const/let 宣告乾淨) =====
const ROLES = [
  { id:"staff",    name:"人事承辦",  color:"#7c9cff", icon:"📝" },
  { id:"chief",    name:"單位主管",  color:"#62e0c2", icon:"👔" },
  { id:"director", name:"人事主任",  color:"#ffb86b", icon:"🧑‍💼" },
  { id:"principal",name:"校長",      color:"#ff7a7a", icon:"🎓" },
];

const ACTION_LABEL = { view:"檢視", edit:"編輯", approve:"核定", assign:"分派", delete:"刪除" };

const PERMISSIONS = {
  staff:    { view:"allow", edit:"conditional", approve:"deny",      assign:"conditional", delete:"deny" },
  chief:    { view:"allow", edit:"conditional", approve:"allow",     assign:"deny",        delete:"deny" },
  director: { view:"allow", edit:"allow",       approve:"allow",     assign:"allow",       delete:"conditional" },
  principal:{ view:"allow", edit:"conditional", approve:"allow",     assign:"deny",        delete:"deny" },
};

const CASE_TYPES = [
  { id:"hire",    name:"新進聘任", icon:"🆕", description:"新進教師/職員聘任流程" },
  { id:"resign",  name:"離職",     icon:"📤", description:"離職/資遣/退休流程" },
  { id:"leave",   name:"留職停薪", icon:"⏸",  description:"留職停薪申請與回職" },
  { id:"salary",  name:"敘薪核定", icon:"💰", description:"到職/調薪/敘薪核定" },
  { id:"eval",    name:"考核作業", icon:"📊", description:"年度考核、專案考績" },
];

const FLOW_NODES = [
  { id:"N1", label:"收件登記",   icon:"📥", required_role:"staff",    required_action:"edit",    desc:"承辦人收件、登記案件基本資料" },
  { id:"N2", label:"承辦登錄",   icon:"📝", required_role:"staff",    required_action:"edit",    desc:"補件、登錄人事系統" },
  { id:"N3", label:"單位會簽",   icon:"🤝", required_role:"chief",    required_action:"approve", desc:"原屬單位主管核章" },
  { id:"N4", label:"文件補件",   icon:"📎", required_role:"staff",    required_action:"edit",    desc:"缺件通知、補件追蹤" },
  { id:"N5", label:"初審",       icon:"🔍", required_role:"director", required_action:"approve", desc:"人事主任初審合規性" },
  { id:"N6", label:"主任覆核",   icon:"🧑‍⚖️", required_role:"director", required_action:"approve", desc:"人事主任綜整覆核" },
  { id:"N7", label:"校長核定",   icon:"🎓", required_role:"principal",required_action:"approve", desc:"校長最終核定" },
  { id:"N8", label:"通知當事人", icon:"📨", required_role:"staff",    required_action:"edit",    desc:"發函通知當事人" },
  { id:"N9", label:"歸檔",       icon:"🗄", required_role:"staff",    required_action:"edit",    desc:"歸檔備查、結案" },
];

const CASE_NODE_MAP = {
  hire:   ["N1","N2","N3","N5","N6","N7","N8","N9"],
  resign: ["N1","N2","N3","N5","N6","N7","N8","N9"],
  leave:  ["N1","N2","N3","N5","N7","N8","N9"],
  salary: ["N1","N2","N5","N6","N7","N8","N9"],
  eval:   ["N1","N2","N3","N5","N6","N7","N9"],
};

const FLOWS = [
  ["N1","N2"],["N2","N3"],["N3","N4"],["N4","N5"],["N5","N6"],["N6","N7"],["N7","N8"],["N8","N9"],
];

const AUDIT_LOG = [
  { time:"2026-07-30 09:12", actor:"王小明(人事承辦)", action:"register-case",  node:"N1", result:"ok" },
  { time:"2026-07-30 10:25", actor:"李組長(單位主管)", action:"approve",         node:"N3", result:"ok" },
  { time:"2026-07-30 11:08", actor:"王小明(人事承辦)", action:"edit-attachment",node:"N4", result:"ok" },
  { time:"2026-07-30 14:30", actor:"陳主任(人事主任)", action:"approve",         node:"N5", result:"ok" },
  { time:"2026-07-30 15:15", actor:"張校長",           action:"approve",         node:"N7", result:"ok" },
  { time:"2026-07-30 15:40", actor:"王小明(人事承辦)", action:"try-delete",      node:"N9", result:"deny", reason:"僅人事主任在歸檔未滿 30 天可刪除" },
  { time:"2026-07-30 16:02", actor:"王小明(人事承辦)", action:"notify",          node:"N8", result:"ok" },
];
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback, useEffect, useRef } = React;
const ReactFlowLib = window.ReactFlow || {};
const { ReactFlow, Background, Controls, MiniMap, Handle, Position, ReactFlowProvider, useNodesState, useEdgesState } = ReactFlowLib;

const nodeColors = {
  staff:    "#7c9cff",
  chief:    "#62e0c2",
  director: "#ffb86b",
  principal:"#ff7a7a",
};

// ===== 自訂節點 =====
function CaseNode({ data }){
  const roleColor = nodeColors[data.required_role] || "#7c9cff";
  return (
    <div className={"react-flow__node-card" + (data.locked ? " locked" : "")}
         style={{ borderColor: data.locked ? "rgba(255,255,255,.10)" : "rgba(255,255,255,.22)" }}>
      <Handle type="target" position={Position.Top} />
      <div className="node-body">
        <div className="node-head">
          <div className="node-icon" style={{ background:`linear-gradient(135deg, ${roleColor}55, ${roleColor}22)`, borderColor:`${roleColor}66` }}>
            {data.icon}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div className="node-title">{data.label}</div>
            <div className="node-sub">{data.id}</div>
          </div>
        </div>
        <div className="node-row">
          <span className="badge" style={{ background:`${roleColor}22`, borderColor:`${roleColor}55`, color: roleColor }}>
            {data.role_name}
          </span>
          <span className="badge badge-pill" style={{
            borderColor: data.locked ? "rgba(255,122,122,.40)" : "rgba(98,224,194,.40)",
            color: data.locked ? "#ff7a7a" : "#62e0c2",
            background: data.locked ? "rgba(255,122,122,.10)" : "rgba(98,224,194,.10)"
          }}>
            {data.locked ? "🔒 已鎖定" : "🔓 可操作"}
          </span>
        </div>
        <div className="node-row" style={{marginTop:6,fontSize:10,color:"var(--text-dim)"}}>
          需要動作: <strong style={{color:"var(--text)",marginLeft:2}}>{data.action_label}</strong>
        </div>
        <div className="node-actions">
          {data.available_actions.map(a => (
            <button
              key={a.id}
              className="action-btn"
              disabled={!a.allowed}
              title={a.allowed ? "可執行" : "權限不足"}
              onClick={(e) => {
                e.stopPropagation();
                if (typeof data.onAction === "function") data.onAction(a);
              }}
            >
              {a.label}
            </button>
          ))}
        </div>
      </div>
      {data.locked && <div className="node-locked-overlay">🔒</div>}
      <Handle type="source" position={Position.Bottom} />
    </div>
  );
}

const nodeTypes = { caseNode: CaseNode };

// ===== 計算節點圖(根據案件類型 + 角色) =====
function buildFlowState(caseTypeId, roleId, onAction){
  const enabled = new Set(CASE_NODE_MAP[caseTypeId]);
  const nodes = FLOW_NODES
    .filter(n => enabled.has(n.id))
    .map((n, idx) => {
      const role = ROLES.find(r => r.id === n.required_role);
      const perm = PERMISSIONS[roleId][n.required_action];
      const locked = perm === "deny";
      const ACTIONS = ["view","edit","approve","assign"];
      const available_actions = ACTIONS.map(act => {
        const p = PERMISSIONS[roleId][act];
        const allowed = p === "allow" || (p === "conditional" && role.id === roleId);
        return { id: act, label: ACTION_LABEL[act], allowed };
      });
      return {
        id: n.id,
        type: "caseNode",
        position: { x: (idx % 3) * 280, y: Math.floor(idx / 3) * 200 },
        data: {
          ...n,
          role_name: role.name,
          action_label: ACTION_LABEL[n.required_action],
          locked,
          available_actions,
          onAction,
        },
      };
    });

  const edges = FLOWS
    .filter(([a,b]) => enabled.has(a) && enabled.has(b))
    .map(([a,b]) => ({
      id: `e-${a}-${b}`,
      source: a,
      target: b,
      type: "smoothstep",
      animated: true,
      label: "→",
      labelStyle: { fill: "#9aa3c7", fontSize: 10 },
      labelBgStyle: { fill: "#141b34" },
      labelBgPadding: [4, 2],
      labelBgBorderRadius: 4,
      style: { stroke: "rgba(124,156,255,.55)", strokeWidth: 2 },
    }));

  return { nodes, edges };
}

// ===== Toast 工具 =====
function showToast(msg, kind){
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = "toast show " + (kind || "");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove("show"), 2200);
}

// ===== 內層 Layout =====
function AppInner(){
  const [roleId, setRoleId] = useState("staff");
  const [caseTypeId, setCaseTypeId] = useState("hire");
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [auditTrail, setAuditTrail] = useState(AUDIT_LOG);

  const handleAction = useCallback((action, node) => {
    const role = ROLES.find(r=>r.id===roleId);
    const allowed = action.allowed;
    const newEntry = {
      time: new Date().toLocaleTimeString("zh-TW",{hour12:false}),
      actor: `目前使用者(${role.name})`,
      action: action.id,
      node: node.id,
      result: allowed ? "ok" : "deny",
      reason: allowed ? null : `需要 ${ACTION_LABEL[PERMISSIONS_FOR_DENY(action.id, roleId, node, caseTypeId)]} 權限`,
    };
    setAuditTrail(prev => [newEntry, ...prev]);
    if (allowed) {
      showToast(`✓ ${role.name} 成功執行「${action.label}」於 ${node.data.label}`, "allow");
    } else {
      showToast(`✗ 權限拒絕:${role.name} 無法「${action.label}」於 ${node.data.label}`, "deny");
    }
  }, [roleId, caseTypeId]);

  const { nodes, edges } = useMemo(() => buildFlowState(caseTypeId, roleId, handleAction), [caseTypeId, roleId, handleAction]);
  const [nodeState, setNodeState, onNodesChange] = useNodesState(nodes);
  const [edgeState, setEdgeState, onEdgesChange] = useEdgesState(edges);

  useEffect(() => {
    setNodeState(nodes);
    setEdgeState(edges);
    setSelectedNodeId(null);
  }, [nodes, edges]);

  const onNodeClick = useCallback((_, node) => setSelectedNodeId(node.id), []);
  const selectedNode = useMemo(() => nodeState.find(n => n.id === selectedNodeId) || null, [nodeState, selectedNodeId]);

  // 角色下拉
  const roleSelect = (
    <select value={roleId} onChange={e => setRoleId(e.target.value)}>
      {ROLES.map(r => <option key={r.id} value={r.id}>{r.icon} {r.name}</option>)}
    </select>
  );

  // 案件類型列表
  const caseList = CASE_TYPES.map(c => (
    <div key={c.id}
         className={"case-item" + (c.id === caseTypeId ? " active" : "")}
         onClick={() => setCaseTypeId(c.id)}>
      <div className="name">{c.icon} {c.name}</div>
      <div className="meta">{c.description}</div>
    </div>
  ));

  // 矩陣
  const matrixBody = ROLES.map(r => {
    const p = PERMISSIONS[r.id];
    const cell = (k) => {
      if (p[k] === "allow") return <span className="perm-cell perm-y">✓</span>;
      if (p[k] === "conditional") return <span className="perm-cell perm-c">C</span>;
      return <span className="perm-cell perm-n">✗</span>;
    };
    return (
      <tr key={r.id} className={r.id === roleId ? "current-role" : ""}>
        <td>{r.icon} {r.name}</td>
        <td>{cell("view")}</td>
        <td>{cell("edit")}</td>
        <td>{cell("approve")}</td>
        <td>{cell("assign")}</td>
        <td>{cell("delete")}</td>
      </tr>
    );
  });

  // 節點詳情
  const nodeDetail = !selectedNode ? (
    <p className="selected-node-sub" style={{textAlign:"center",padding:"20px 0"}}>
      ← 點擊流程圖上任一節點<br/>查看權限與可執行動作
    </p>
  ) : (
    <div>
      <div className="selected-node-title">{selectedNode.data.icon} {selectedNode.data.label}</div>
      <div className="selected-node-sub">{selectedNode.data.desc}</div>
      <div className="kv"><span className="k">節點編號</span><span className="v">{selectedNode.id}</span></div>
      <div className="kv"><span className="k">負責角色</span><span className="v" style={{color: nodeColors[selectedNode.data.required_role]}}>{selectedNode.data.role_name}</span></div>
      <div className="kv"><span className="k">當前角色</span><span className="v">{ROLES.find(r=>r.id===roleId)?.name}</span></div>
      <div className="kv"><span className="k">節點狀態</span><span className="v" style={{color: selectedNode.data.locked ? "#ff7a7a" : "#62e0c2"}}>{selectedNode.data.locked ? "🔒 已鎖定" : "🔓 可操作"}</span></div>
      <div style={{marginTop:10,fontSize:11,color:"var(--text-dim)"}}>當前角色在此節點可執行的動作:</div>
      <div className="perm-grid">
        {selectedNode.data.available_actions.map(a => (
          <div key={a.id} className={"perm-tile " + (a.allowed ? "granted" : "denied")}>
            <span>{a.label}</span>
            <span>{a.allowed ? "✓" : "✗"}</span>
          </div>
        ))}
      </div>
    </div>
  );

  // 審計軌跡
  const timeline = auditTrail.map((log, idx) => (
    <div key={idx} className={"tl-item " + log.result}>
      <div className="tl-time">{log.time}</div>
      <div className="tl-actor">{log.actor}</div>
      <div className="tl-action">
        在節點 <strong>{log.node}</strong> 執行 <strong>{log.action}</strong>
        {log.result === "deny" && <span style={{color:"#ff7a7a"}}> · 拒絕{log.reason ? ` (${log.reason})` : ""}</span>}
      </div>
    </div>
  ));

  return (
    <div className="app">
      <header className="topbar glass">
        <h1>🏛 人事案件處理流程圖</h1>
        <span className="sub">Personnel Case Workflow · RBAC-Integrated</span>
        <span className="spacer"></span>
        <span className="role-switch pill">
          <span style={{color:"var(--text-dim)"}}>目前角色</span>
          {roleSelect}
        </span>
        <span className="pill">👤 王小明</span>
      </header>

      <aside className="col-left glass">
        <div>
          <div className="section-title">案件類型</div>
          <div className="case-list">{caseList}</div>
        </div>
        <div>
          <div className="section-title">RBAC 權限矩陣</div>
          <table className="matrix">
            <thead>
              <tr>
                <th>角色</th>
                <th>檢視</th><th>編輯</th><th>核定</th><th>分派</th><th>刪除</th>
              </tr>
            </thead>
            <tbody>{matrixBody}</tbody>
          </table>
          <div className="legend">
            <span className="item"><span className="dot" style={{background:"var(--ok)"}}></span>✓ 允許</span>
            <span className="item"><span className="dot" style={{background:"var(--warn)"}}></span>C 條件式</span>
            <span className="item"><span className="dot" style={{background:"var(--danger)"}}></span>✗ 禁止</span>
          </div>
        </div>
      </aside>

      <main className="col-center glass">
        <div className="flow-wrap">
          <ReactFlow
            nodes={nodeState}
            edges={edgeState}
            onNodesChange={onNodesChange}
            onEdgesChange={onEdgesChange}
            onNodeClick={onNodeClick}
            nodeTypes={nodeTypes}
            fitView
            fitViewOptions={{ padding: 0.2 }}
            minZoom={0.4}
            maxZoom={1.5}
            proOptions={{ hideAttribution: true }}
          >
            <Background color="rgba(255,255,255,.07)" gap={20} size={1} />
            <Controls position="bottom-right" />
            <MiniMap
              nodeColor={n => nodeColors[n.data?.required_role] || "#7c9cff"}
              nodeStrokeWidth={2}
              maskColor="rgba(11,16,32,0.75)"
              position="bottom-left"
              style={{background:"rgba(255,255,255,.06)"}}
            />
          </ReactFlow>
        </div>
      </main>

      <aside className="col-right">
        <section className="glass">
          <div className="section-title">節點詳情</div>
          {nodeDetail}
        </section>
        <section className="glass">
          <div className="section-title">審計紀錄 (Audit Trail)</div>
          <div className="timeline">{timeline}</div>
        </section>
      </aside>
    </div>
  );
}

// 工具:當拒絕時,推算需要哪個動作/角色
function PERMISSIONS_FOR_DENY(actionId, roleId, node, caseTypeId){
  // 直接回傳該節點需要的動作
  if (!node) return "";
  return node.data.required_action;
}

function Root(){
  return (
    <ReactFlowProvider>
      <AppInner />
    </ReactFlowProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
</body>
</html>
