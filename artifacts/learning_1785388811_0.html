<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HR 案件工作流引擎 · React Flow</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
<script crossorigin src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
<style>
  :root {
    --bg-gradient-1: #0f172a;
    --bg-gradient-2: #1e1b4b;
    --bg-gradient-3: #312e81;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-bg-strong: rgba(255, 255, 255, 0.14);
    --glass-border: rgba(255, 255, 255, 0.18);
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --accent: #818cf8;
    --accent-2: #f472b6;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    color: var(--text-primary);
    background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
    background-attachment: fixed;
    overflow: hidden;
  }
  .app-shell { display: grid; grid-template-columns: 280px 1fr 320px; grid-template-rows: 64px 1fr; height: 100vh; gap: 16px; padding: 16px; }
  .header {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; background: var(--glass-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-radius: 16px;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.5px; }
  .header h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .mode-toggle { display: flex; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 3px; }
  .mode-btn { padding: 6px 14px; border: none; border-radius: 8px; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
  .mode-btn.active { background: var(--glass-bg-strong); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .sidebar { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; overflow-y: auto; }
  .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin: 0 0 14px 0; }
  .node-palette { display: flex; flex-direction: column; gap: 10px; }
  .palette-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: grab;
    background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
    border-radius: 12px; transition: all 0.2s; user-select: none;
  }
  .palette-item:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .palette-item:active { cursor: grabbing; }
  .palette-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .palette-label { font-size: 13px; font-weight: 500; }
  .canvas-wrapper {
    background: var(--glass-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-radius: 16px;
    position: relative; overflow: hidden;
  }
  .right-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; overflow-y: auto; }
  .right-panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin: 0 0 14px 0; }
  /* 自訂節點共用 */
  .hr-node { padding: 14px 16px; border-radius: 12px; min-width: 180px; backdrop-filter: blur(10px); border: 1.5px solid; color: var(--text-primary); box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  .hr-node.selected { box-shadow: 0 0 0 2px var(--accent), 0 4px 14px rgba(0,0,0,0.25); }
  .hr-node-title { font-size: 13px; font-weight: 600; margin: 0 0 4px 0; display: flex; align-items: center; gap: 6px; }
  .hr-node-sub { font-size: 11px; color: var(--text-secondary); margin: 0; }
  .hr-node-tag { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-top: 6px; font-weight: 600; letter-spacing: 0.5px; }
  .node-start { background: rgba(52, 211, 153, 0.18); border-color: var(--success); }
  .node-decision { background: rgba(251, 191, 36, 0.15); border-color: var(--warning); }
  .node-review { background: rgba(129, 140, 248, 0.18); border-color: var(--accent); }
  .node-end { background: rgba(244, 114, 182, 0.15); border-color: var(--accent-2); }
  .field-group { margin-bottom: 14px; }
  .field-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 6px; }
  .field-group input, .field-group select, .field-group textarea {
    width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.25); border: 1px solid var(--glass-border);
    border-radius: 8px; color: var(--text-primary); font-size: 13px; font-family: inherit;
  }
  .field-group input:focus, .field-group select:focus, .field-group textarea:focus { outline: none; border-color: var(--accent); }
  .field-group textarea { resize: vertical; min-height: 60px; }
  .btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--glass-bg-strong); color: var(--text-primary); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
  .btn:hover { background: rgba(255,255,255,0.22); }
  .btn-primary { background: linear-gradient(90deg, var(--accent), #6366f1); border-color: transparent; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-danger { background: rgba(251, 113, 133, 0.2); border-color: var(--danger); }
  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .case-list { display: flex; flex-direction: column; gap: 10px; }
  .case-item { padding: 12px; background: var(--glass-bg-strong); border-radius: 10px; border: 1px solid var(--glass-border); cursor: pointer; transition: all 0.2s; }
  .case-item:hover { background: rgba(255,255,255,0.18); }
  .case-item.active { border-color: var(--accent); }
  .case-item-title { font-weight: 600; font-size: 13px; margin: 0 0 4px 0; }
  .case-item-meta { font-size: 11px; color: var(--text-muted); }
  .progress-track { height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--success), var(--accent)); transition: width 0.3s; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  .log-entry { padding: 8px 10px; background: rgba(0,0,0,0.2); border-radius: 6px; font-size: 11px; margin-bottom: 4px; border-left: 3px solid var(--accent); }
  .log-entry.warn { border-left-color: var(--warning); }
  .log-entry.error { border-left-color: var(--danger); }
  .log-time { color: var(--text-muted); margin-right: 6px; }
  .react-flow__attribution { background: rgba(0,0,0,0.4) !important; color: var(--text-muted) !important; }
  .react-flow__controls { background: var(--glass-bg) !important; border: 1px solid var(--glass-border) !important; border-radius: 8px !important; overflow: hidden; }
  .react-flow__controls button { background: var(--glass-bg-strong) !important; border-bottom: 1px solid var(--glass-border) !important; color: var(--text-primary) !important; fill: var(--text-primary) !important; }
  .react-flow__minimap { background: var(--glass-bg) !important; border: 1px solid var(--glass-border) !important; border-radius: 8px !important; }
  .react-flow__background { background-color: transparent !important; }
  .react-flow__node { font-family: inherit; }
  .react-flow__edge-path { stroke: rgba(255,255,255,0.4); stroke-width: 1.5; }
  .react-flow__edge.selected .react-flow__edge-path { stroke: var(--accent); stroke-width: 2.5; }
  .react-flow__handle { background: rgba(255,255,255,0.6) !important; border: 2px solid var(--bg-gradient-1) !important; width: 10px !important; height: 10px !important; }
  .preset-card { padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-bg-strong); margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
  .preset-card:hover { background: rgba(255,255,255,0.18); transform: translateX(3px); }
  .preset-name { font-weight: 600; font-size: 13px; }
  .preset-desc { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
  .badge-success { background: rgba(52, 211, 153, 0.2); color: var(--success); }
  .badge-warn { background: rgba(251, 191, 36, 0.2); color: var(--warning); }
  .badge-info { background: rgba(129, 140, 248, 0.2); color: var(--accent); }
  .scrollbar::-webkit-scrollbar { width: 6px; }
  .scrollbar::-webkit-scrollbar-track { background: transparent; }
  .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useCallback, useMemo, useRef, useEffect } = React;
const RF = ReactFlow;
const {
  ReactFlow, Background, Controls, MiniMap, addEdge, applyEdgeChanges, applyNodeChanges,
  Handle, Position, MarkerType
} = RF;

// ==============================
// 領域定義：人事工作流節點類型
// ==============================
const NODE_TYPES = {
  start: {
    label: '案件起點',
    color: '#34d399',
    icon: '🟢',
    description: '新案件受理的入口節點',
    fields: ['title', 'employeeName', 'employeeId', 'category']
  },
  decision: {
    label: 'SOP 決策',
    color: '#fbbf24',
    icon: '🟡',
    description: '依據規則分流到不同審核節點',
    fields: ['title', 'rule', 'options']
  },
  review: {
    label: '人事審核',
    color: '#818cf8',
    icon: '🟣',
    description: '由指定角色審核案件並決行',
    fields: ['title', 'role', 'duration', 'notes']
  },
  end: {
    label: '歸檔結案',
    color: '#f472b6',
    icon: '🔴',
    description: '案件完成、人檔歸檔結案',
    fields: ['title', 'archiveLocation', 'retention']
  }
};

// ==============================
// 自訂節點元件
// ==============================
const HRNode = ({ data, selected, type }) => {
  const cfg = NODE_TYPES[type];
  return (
    <div className={`hr-node ${cfg.className} ${selected ? 'selected' : ''}`}>
      {type !== 'start' && <Handle type="target" position={Position.Top} />}
      <div className="hr-node-title">
        <span>{cfg.icon}</span>
        <span>{data.title || cfg.label}</span>
      </div>
      <p className="hr-node-sub">
        {type === 'start' && `當事人：${data.employeeName || '未填'} · 編號 ${data.employeeId || '—'}`}
        {type === 'decision' && `規則：${data.rule || '未設定'}`}
        {type === 'review' && `審核：${data.role || '未指派'} · ${data.duration || '?'} 天`}
        {type === 'end' && `保存：${data.archiveLocation || '人檔室'} · ${data.retention || '永久'}`}
      </p>
      <span className="hr-node-tag" style={{ background: cfg.color + '33', color: cfg.color }}>
        {cfg.label}
      </span>
      {type !== 'end' && <Handle type="source" position={Position.Bottom} />}
    </div>
  );
};

const nodeTypes = {
  start: (props) => <HRNode {...props} type="start" />,
  decision: (props) => <HRNode {...props} type="decision" />,
  review: (props) => <HRNode {...props} type="review" />,
  end: (props) => <HRNode {...props} type="end" />,
};

// ==============================
// 預設 SOP 範本
// ==============================
const PRESETS = {
  onboarding: {
    name: '新進人員 SOP',
    description: '面試 → 報到 → 資料建檔 → 教育訓練',
    nodes: [
      { id: '1', type: 'start', position: { x: 250, y: 40 }, data: { title: '受理新進申請', employeeName: '', employeeId: '', category: '新進' } },
      { id: '2', type: 'review', position: { x: 200, y: 160 }, data: { title: '人資初審', role: '人資專員', duration: 1, notes: '核對身分證、學歷證書' } },
      { id: '3', type: 'decision', position: { x: 200, y: 290 }, data: { title: '主管核准?', rule: '部門主管同意?' } },
      { id: '4', type: 'review', position: { x: 60, y: 430 }, data: { title: '簽訂勞動契約', role: '當事人 + 人資', duration: 1, notes: '' } },
      { id: '5', type: 'end', position: { x: 60, y: 570 }, data: { title: '建檔完成', archiveLocation: '人檔室', retention: '永久' } },
      { id: '6', type: 'review', position: { x: 360, y: 430 }, data: { title: '重新媒合部門', role: '人資專員', duration: 3, notes: '啟動內部轉調流程' } },
      { id: '7', type: 'end', position: { x: 360, y: 570 }, data: { title: '媒合完成', archiveLocation: '人檔室', retention: '永久' } }
    ],
    edges: [
      { id: 'e1-2', source: '1', target: '2' },
      { id: 'e2-3', source: '2', target: '3' },
      { id: 'e3-4', source: '3', target: '4', label: '同意', sourceHandle: null },
      { id: 'e3-6', source: '3', target: '6', label: '婉拒' },
      { id: 'e4-5', source: '4', target: '5' },
      { id: 'e6-7', source: '6', target: '7' }
    ]
  },
  resignation: {
    name: '離職流程 SOP',
    description: '提出 → 主管確認 → 交接 → 繳回',
    nodes: [
      { id: '1', type: 'start', position: { x: 250, y: 40 }, data: { title: '收受辭呈', employeeName: '', employeeId: '', category: '離職' } },
      { id: '2', type: 'review', position: { x: 250, y: 160 }, data: { title: '主管面談', role: '直屬主管', duration: 7, notes: '了解離職原因' } },
      { id: '3', type: 'review', position: { x: 250, y: 290 }, data: { title: '業務交接', role: '當事人', duration: 14, notes: '完成工作移交清單' } },
      { id: '4', type: 'review', position: { x: 250, y: 420 }, data: { title: '人資結算', role: '人資專員', duration: 3, notes: '勞健保轉出、薪資結算' } },
      { id: '5', type: 'end', position: { x: 250, y: 550 }, data: { title: '歸檔離職資料', archiveLocation: '人檔室', retention: '永久' } }
    ],
    edges: [
      { id: 'e1-2', source: '1', target: '2' },
      { id: 'e2-3', source: '2', target: '3' },
      { id: 'e3-4', source: '3', target: '4' },
      { id: 'e4-5', source: '4', target: '5' }
    ]
  },
  complaint: {
    name: '員工申訴 SOP',
    description: '受理 → 調查 → 裁決 → 結案',
    nodes: [
      { id: '1', type: 'start', position: { x: 250, y: 40 }, data: { title: '受理申訴', employeeName: '', employeeId: '', category: '申訴' } },
      { id: '2', type: 'decision', position: { x: 250, y: 160 }, data: { title: '案件分類', rule: '性平/職場/薪資/其他' } },
      { id: '3', type: 'review', position: { x: 80, y: 290 }, data: { title: '性平會調查', role: '性平委員', duration: 30, notes: '依性平三法' } },
      { id: '4', type: 'review', position: { x: 240, y: 290 }, data: { title: '人事評議會', role: '評議委員', duration: 21, notes: '' } },
      { id: '5', type: 'review', position: { x: 420, y: 290 }, data: { title: '一般調處', role: '人資主任', duration: 14, notes: '' } },
      { id: '6', type: 'end', position: { x: 250, y: 430 }, data: { title: '申訴結案', archiveLocation: '保密檔案', retention: '10年' } }
    ],
    edges: [
      { id: 'e1-2', source: '1', target: '2' },
      { id: 'e2-3', source: '2', target: '3', label: '性平' },
      { id: 'e2-4', source: '2', target: '4', label: '職場' },
      { id: 'e2-5', source: '2', target: '5', label: '其他' },
      { id: 'e3-6', source: '3', target: '6' },
      { id: 'e4-6', source: '4', target: '6' },
      { id: 'e5-6', source: '5', target: '6' }
    ]
  }
};

// ==============================
// 主應用
// ==============================
const App = () => {
  const [mode, setMode] = useState('design'); // design | run
  const [nodes, setNodes] = useState([]);
  const [edges, setEdges] = useState([]);
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [cases, setCases] = useState([]); // 案件實例
  const [activeCaseId, setActiveCaseId] = useState(null);
  const [logs, setLogs] = useState([]);
  const reactFlowWrapper = useRef(null);
  const [rfInstance, setRfInstance] = useState(null);

  const log = (msg, level = 'info') => {
    setLogs(prev => [...prev.slice(-49), { time: new Date().toLocaleTimeString(), msg, level }]);
  };

  // 載入預設 SOP
  const loadPreset = (key) => {
    const p = PRESETS[key];
    setNodes(p.nodes.map(n => ({ ...n })));
    setEdges(p.edges.map(e => ({ ...e, markerEnd: { type: MarkerType.ArrowClosed }, labelBgStyle: { fill: '#1e1b4b' }, labelStyle: { fill: '#cbd5e1', fontSize: 11 } })));
    setSelectedNodeId(null);
    log(`已載入預設 SOP：${p.name}`, 'info');
  };

  // 圖表變更處理
  const onNodesChange = useCallback((changes) => setNodes((nds) => applyNodeChanges(changes, nds)), []);
  const onEdgesChange = useCallback((changes) => setEdges((eds) => applyEdgeChanges(changes, eds)), []);
  const onConnect = useCallback((params) => {
    // SOP 規則：一個起點只能連一個下游；決策節點可多個分支
    setEdges((eds) => addEdge({ ...params, markerEnd: { type: MarkerType.ArrowClosed } }, eds));
    log(`建立連線：${params.source} → ${params.target}`);
  }, []);

  // 從 palette 拖入節點
  const onDragStart = (event, type) => {
    event.dataTransfer.setData('application/reactflow', type);
    event.dataTransfer.effectAllowed = 'move';
  };
  const onDragOver = useCallback((event) => {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
  }, []);
  const onDrop = useCallback((event) => {
    event.preventDefault();
    const type = event.dataTransfer.getData('application/reactflow');
    if (!type || !rfInstance) return;
    const position = rfInstance.screenToFlowPosition({ x: event.clientX, y: event.clientY });
    const id = `n_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const newNode = {
      id, type, position,
      data: { title: NODE_TYPES[type].label, ...(type === 'start' ? { employeeName: '', employeeId: '', category: '' } : {}) }
    };
    setNodes((nds) => nds.concat(newNode));
    log(`新增 ${NODE_TYPES[type].label} 節點 ${id}`);
  }, [rfInstance]);

  // 選中節點
  const onNodeClick = (_, node) => setSelectedNodeId(node.id);

  // 更新節點資料
  const updateNodeData = (id, patch) => {
    setNodes((nds) => nds.map(n => n.id === id ? { ...n, data: { ...n.data, ...patch } } : n));
  };
  const deleteNode = (id) => {
    setNodes((nds) => nds.filter(n => n.id !== id));
    setEdges((eds) => eds.filter(e => e.source !== id && e.target !== id));
    setSelectedNodeId(null);
    log(`刪除節點 ${id}`, 'warn');
  };

  // SOP 連線合法性檢查
  const validateGraph = () => {
    const errors = [];
    const starts = nodes.filter(n => n.type === 'start');
    const ends = nodes.filter(n => n.type === 'end');
    if (starts.length === 0) errors.push('缺少「案件起點」');
    if (ends.length === 0) errors.push('缺少「歸檔結案」');
    if (starts.length > 1) errors.push('「案件起點」只能有一個');
    if (nodes.length > 0 && starts.length + ends.length === 0) errors.push('流程必須有起點與結案節點');
    // 孤立節點檢查
    const connected = new Set();
    edges.forEach(e => { connected.add(e.source); connected.add(e.target); });
    const orphans = nodes.filter(n => !connected.has(n.id));
    if (orphans.length > 0) errors.push(`${orphans.length} 個節點未連接（${orphans.map(o => o.id).join(', ')}）`);
    return errors;
  };

  // 啟動案件執行
  const startCase = () => {
    const errs = validateGraph();
    if (errs.length > 0) {
      log(`無法啟動案件：${errs.join('; ')}`, 'error');
      return;
    }
    const startNode = nodes.find(n => n.type === 'start');
    if (!startNode.data.employeeName) {
      log('請先在「案件起點」填寫當事人姓名', 'warn');
      return;
    }
    const caseId = `case_${Date.now()}`;
    const newCase = {
      id: caseId,
      title: `${startNode.data.category || '人事'} - ${startNode.data.employeeName}`,
      employeeName: startNode.data.employeeName,
      employeeId: startNode.data.employeeId,
      currentNodeId: startNode.id,
      completedNodes: [],
      createdAt: new Date().toLocaleString(),
      status: 'active'
    };
    setCases(prev => [newCase, ...prev]);
    setActiveCaseId(caseId);
    setMode('run');
    log(`案件 ${caseId} 已啟動：${newCase.title}`);
  };

  const activeCase = cases.find(c => c.id === activeCaseId);

  // 案件執行 — 推進到下一節點
  const advanceCase = () => {
    if (!activeCase) return;
    const currentNode = nodes.find(n => n.id === activeCase.currentNodeId);
    if (!currentNode) return;
    // 找下游節點 — SOP 決節點若有 source，運行者選一個
    const outgoing = edges.filter(e => e.source === currentNode.id);
    if (outgoing.length === 0) {
      // 走完
      const updated = cases.map(c => c.id === activeCase.id ? { ...c, status: 'done', completedAt: new Date().toLocaleString() } : c);
      setCases(updated);
      log(`案件 ${activeCase.id} 已結案`, 'info');
      return;
    }
    // 簡化：自動走第一條；實際互動可在運行模式加分支選擇
    const next = outgoing[0];
    const updated = cases.map(c => c.id === activeCase.id ? {
      ...c,
      currentNodeId: next.target,
      completedNodes: [...c.completedNodes, c.currentNodeId]
    } : c);
    setCases(updated);
    log(`案件 ${activeCase.id}: ${currentNode.data.title} → ?`);
  };

  // 選擇分支推進
  const advanceWithChoice = (edgeId) => {
    if (!activeCase) return;
    const edge = edges.find(e => e.id === edgeId);
    if (!edge) return;
    const updated = cases.map(c => c.id === activeCase.id ? {
      ...c,
      currentNodeId: edge.target,
      completedNodes: [...c.completedNodes, c.currentNodeId]
    } : c);
    setCases(updated);
    log(`案件 ${activeCase.id} 選擇分支：${edge.label || edge.id}`);
  };

  const selectedNode = nodes.find(n => n.id === selectedNodeId);
  const validationErrors = useMemo(() => validateGraph(), [nodes, edges]);

  return (
    <div className="app-shell">
      <header className="header">
        <h1><span>HR 案件工作流引擎</span> · React Flow</h1>
        <div className="header-actions">
          <div className="mode-toggle">
            <button className={`mode-btn ${mode === 'design' ? 'active' : ''}`} onClick={() => setMode('design')}>設計模式</button>
            <button className={`mode-btn ${mode === 'run' ? 'active' : ''}`} onClick={() => setMode('run')}>執行模式</button>
          </div>
          {mode === 'design' && (
            <>
              <button className="btn btn-primary" onClick={startCase}>▶ 啟動案件</button>
            </>
          )}
        </div>
      </header>

      {mode === 'design' ? (
        <>
          <aside className="sidebar scrollbar">
            <h2>節點面板</h2>
            <div className="node-palette">
              {Object.entries(NODE_TYPES).map(([key, cfg]) => (
                <div key={key} className="palette-item" onDragStart={(e) => onDragStart(e, key)} draggable>
                  <div className="palette-dot" style={{ background: cfg.color }} />
                  <div>
                    <div className="palette-label">{cfg.label}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>{cfg.description}</div>
                  </div>
                </div>
              ))}
            </div>
            <h2 style={{ marginTop: 24 }}>SOP 範本</h2>
            {Object.entries(PRESETS).map(([key, p]) => (
              <div key={key} className="preset-card" onClick={() => loadPreset(key)}>
                <div className="preset-name">{p.name}</div>
                <div className="preset-desc">{p.description}</div>
              </div>
            ))}
            <h2 style={{ marginTop: 24 }}>SOP 檢查</h2>
            {validationErrors.length === 0 ? (
              <span className="badge badge-success">流程圖合法</span>
            ) : (
              validationErrors.map((e, i) => (
                <div key={i} style={{ padding: 8, background: 'rgba(251,113,133,0.15)', borderRadius: 6, fontSize: 12, marginBottom: 4, borderLeft: '3px solid var(--danger)' }}>{e}</div>
              ))
            )}
          </aside>

          <div className="canvas-wrapper" ref={reactFlowWrapper}>
            <ReactFlow
              nodes={nodes}
              edges={edges}
              onNodesChange={onNodesChange}
              onEdgesChange={onEdgesChange}
              onConnect={onConnect}
              onInit={setRfInstance}
              onDrop={onDrop}
              onDragOver={onDragOver}
              onNodeClick={onNodeClick}
              onPaneClick={() => setSelectedNodeId(null)}
              nodeTypes={nodeTypes}
              fitView
              proOptions={{ hideAttribution: true }}
            >
              <Background color="rgba(255,255,255,0.08)" gap={20} />
              <Controls />
              <MiniMap nodeColor={(n) => NODE_TYPES[n.type]?.color || '#888'} maskColor="rgba(0,0,0,0.5)" />
            </ReactFlow>
          </div>

          <aside className="right-panel scrollbar">
            <h2>節點屬性</h2>
            {!selectedNode ? (
              <div className="empty-state">點擊畫布上任一節點<br/>以編輯其屬性</div>
            ) : (
              <>
                <div style={{ marginBottom: 16 }}>
                  <span className="badge badge-info">{NODE_TYPES[selectedNode.type].label}</span>
                  <span style={{ fontSize: 11, color: 'var(--text-muted)', marginLeft: 8 }}>ID: {selectedNode.id}</span>
                </div>
                <div className="field-group">
                  <label>標題</label>
                  <input value={selectedNode.data.title || ''} onChange={(e) => updateNodeData(selectedNode.id, { title: e.target.value })} />
                </div>
                {selectedNode.type === 'start' && (
                  <>
                    <div className="field-group">
                      <label>當事人姓名</label>
                      <input value={selectedNode.data.employeeName || ''} onChange={(e) => updateNodeData(selectedNode.id, { employeeName: e.target.value })} />
                    </div>
                    <div className="field-group">
                      <label>員工編號</label>
                      <input value={selectedNode.data.employeeId || ''} onChange={(e) => updateNodeData(selectedNode.id, { employeeId: e.target.value })} />
                    </div>
                    <div className="field-group">
                      <label>案件類別</label>
                      <select value={selectedNode.data.category || ''} onChange={(e) => updateNodeData(selectedNode.id, { category: e.target.value })}>
                        <option value="">請選擇</option>
                        <option value="新進">新進</option>
                        <option value="離職">離職</option>
                        <option value="申訴">申訴</option>
                        <option value="調職">調職</option>
                        <option value="其他">其他</option>
                      </select>
                    </div>
                  </>
                )}
                {selectedNode.type === 'decision' && (
                  <>
                    <div className="field-group">
                      <label>決策規則</label>
                      <input value={selectedNode.data.rule || ''} onChange={(e) => updateNodeData(selectedNode.id, { rule: e.target.value })} />
                    </div>
                    <div className="field-group">
                      <label>選項 (JSON)</label>
                      <textarea value={selectedNode.data.options || ''} onChange={(e) => updateNodeData(selectedNode.id, { options: e.target.value })} placeholder='["同意","婉拒"]' />
                    </div>
                  </>
                )}
                {selectedNode.type === 'review' && (
                  <>
                    <div className="field-group">
                      <label>指派角色</label>
                      <input value={selectedNode.data.role || ''} onChange={(e) => updateNodeData(selectedNode.id, { role: e.target.value })} />
                    </div>
                    <div className="field-group">
                      <label>預計天數</label>
                      <input type="number" value={selectedNode.data.duration || ''} onChange={(e) => updateNodeData(selectedNode.id, { duration: e.target.value })} />
                    </div>
                    <div className="field-group">
                      <label>備註</label>
                      <textarea value={selectedNode.data.notes || ''} onChange={(e) => updateNodeData(selectedNode.id, { notes: e.target.value })} />
                    </div>
                  </>
                )}
                {selectedNode.type === 'end' && (
                  <>
                    <div className="field-group">
                      <label>歸檔位置</label>
                      <input value={selectedNode.data.archiveLocation || ''} onChange={(e) => updateNodeData(selectedNode.id, { archiveLocation: e.target.value })} />
                    </div>
                    <div className="field-group">
                      <label>保存年限</label>
                      <input value={selectedNode.data.retention || ''} onChange={(e) => updateNodeData(selectedNode.id, { retention: e.target.value })} />
                    </div>
                  </>
                )}
                <div className="btn-row">
                  <button className="btn btn-danger btn-block" onClick={() => deleteNode(selectedNode.id)}>刪除節點</button>
                </div>
              </>
            )}
          </aside>
        </>
      ) : (
        <>
          <aside className="sidebar scrollbar">
            <h2>案件清單</h2>
            {cases.length === 0 ? (
              <div className="empty-state">尚無案件<br/>請到設計模式啟動</div>
            ) : (
              <div className="case-list">
                {cases.map(c => (
                  <div key={c.id} className={`case-item ${c.id === activeCaseId ? 'active' : ''}`} onClick={() => setActiveCaseId(c.id)}>
                    <div className="case-item-title">{c.title}</div>
                    <div className="case-item-meta">{c.createdAt}</div>
                    <div style={{ marginTop: 6 }}>
                      <span className={`badge ${c.status === 'done' ? 'badge-success' : 'badge-warn'}`}>
                        {c.status === 'done' ? '已結案' : '進行中'}
                      </span>
                    </div>
                    <div className="progress-track">
                      <div className="progress-fill" style={{ width: c.status === 'done' ? '100%' : `${(c.completedNodes.length / Math.max(1, nodes.length)) * 100}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            )}
            <h2 style={{ marginTop: 24 }}>操作日誌</h2>
            <div>
              {logs.length === 0 ? <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>尚無記錄</div> :
                logs.slice().reverse().map((l, i) => (
                  <div key={i} className={`log-entry ${l.level}`}>
                    <span className="log-time">{l.time}</span>{l.msg}
                  </div>
                ))
              }
            </div>
          </aside>

          <div className="canvas-wrapper" ref={reactFlowWrapper}>
            {activeCase ? (
              <ReactFlow
                nodes={nodes.map(n => {
                  const isCurrent = n.id === activeCase.currentNodeId;
                  const isDone = activeCase.completedNodes.includes(n.id);
                  return {
                    ...n,
                    style: {
                      ...n.style,
                      opacity: isDone ? 1 : isCurrent ? 1 : 0.45,
                      boxShadow: isCurrent ? '0 0 0 3px var(--accent), 0 0 20px rgba(129,140,248,0.6)' : undefined
                    }
                  };
                })}
                edges={edges.map(e => {
                  const isActive = activeCase.completedNodes.includes(e.source) || e.source === activeCase.currentNodeId;
                  return {
                    ...e,
                    animated: isActive,
                    style: { stroke: isActive ? '#818cf8' : 'rgba(255,255,255,0.25)', strokeWidth: isActive ? 2.5 : 1.5 }
                  };
                })}
                onInit={setRfInstance}
                nodeTypes={nodeTypes}
                fitView
                nodesDraggable={false}
                nodesConnectable={false}
                elementsSelectable={false}
                proOptions={{ hideAttribution: true }}
              >
                <Background color="rgba(255,255,255,0.08)" gap={20} />
                <Controls />
                <MiniMap nodeColor={(n) => NODE_TYPES[n.type]?.color || '#888'} maskColor="rgba(0,0,0,0.5)" />
              </ReactFlow>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', flexDirection: 'column' }}>
                <div style={{ fontSize: 48, marginBottom: 16 }}>📋</div>
                <div style={{ fontSize: 16, color: 'var(--text-secondary)' }}>請選擇一個案件查看執行狀態</div>
              </div>
            )}
          </div>

          <aside className="right-panel scrollbar">
            <h2>案件詳情</h2>
            {!activeCase ? (
              <div className="empty-state">尚未選擇案件</div>
            ) : (
              <>
                <div style={{ marginBottom: 16 }}>
                  <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{activeCase.title}</div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>ID: {activeCase.id}</div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>受理: {activeCase.createdAt}</div>
                </div>

                <div className="field-group">
                  <label>當前狀態</label>
                  {(() => {
                    const cur = nodes.find(n => n.id === activeCase.currentNodeId);
                    if (!cur) return <span className="badge badge-success">已完成</span>;
                    return (
                      <div style={{ padding: 12, background: 'rgba(129,140,248,0.15)', borderRadius: 8, borderLeft: '3px solid var(--accent)' }}>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{cur.data.title}</div>
                        <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 4 }}>
                          {NODE_TYPES[cur.type].label}
                        </div>
                      </div>
                    );
                  })()}
                </div>

                <div className="field-group">
                  <label>推進方式</label>
                  {(() => {
                    const currentNode = nodes.find(n => n.id === activeCase.currentNodeId);
                    if (!currentNode) return <div className="empty-state">流程已結束</div>;
                    const outgoing = edges.filter(e => e.source === currentNode.id);
                    if (outgoing.length === 0) {
                      return (
                        <button className="btn btn-primary btn-block" onClick={advanceCase} disabled={activeCase.status === 'done'}>
                          ✓ 結案歸檔
                        </button>
                      );
                    }
                    return outgoing.map(e => (
                      <button key={e.id} className="btn btn-block" style={{ marginBottom: 6, textAlign: 'left' }} onClick={() => advanceWithChoice(e.id)} disabled={activeCase.status === 'done'}>
                        → {e.label || '繼續'} {nodes.find(n => n.id === e.target)?.data.title || ''}
                      </button>
                    ));
                  })()}
                </div>

                <h2 style={{ marginTop: 24 }}>已完成步驟</h2>
                {activeCase.completedNodes.length === 0 ? (
                  <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>尚未推進</div>
                ) : (
                  activeCase.completedNodes.map((nid, i) => {
                    const n = nodes.find(nn => nn.id === nid);
                    return n ? (
                      <div key={nid} style={{ padding: 10, background: 'var(--glass-bg-strong)', borderRadius: 8, marginBottom: 6, fontSize: 12 }}>
                        <span style={{ color: 'var(--success)', fontWeight: 600 }}>✓ {i + 1}.</span> {n.data.title}
                      </div>
                    ) : null;
                  })
                )}
              </>
            )}
          </aside>
        </>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
