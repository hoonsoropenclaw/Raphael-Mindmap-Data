<body>
<div id="root"></div>

<!-- React Flow UMD (v11 monolithic package — confirmed 200 via unpkg registry inspect) -->
<script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useCallback, useRef, memo } = React;
// React Flow UMD attaches everything to window.ReactFlow
const RF = window.ReactFlow;
const {
  ReactFlow,
  ReactFlowProvider,
  Background,
  Controls,
  MiniMap,
  useNodesState,
  useEdgesState,
  addEdge,
  applyNodeChanges,
  applyEdgeChanges,
  Handle,
  Position,
  MarkerType,
} = RF;

// =====================================================================
// RBAC CORE - 角色權限模型
// =====================================================================

const ROLES = {
  viewer: {
    id: "viewer",
    label: "Viewer (訪客)",
    color: "var(--viewer)",
    description: "只讀瀏覽。可看見低敏感度節點,機密/PII 內容自動遮罩。",
    perms: { read: true, write: false, delete: false, connect: false, revealPII: false },
  },
  editor: {
    id: "editor",
    label: "Editor (編輯者)",
    color: "var(--editor)",
    description: "可編輯自己擁有或一般敏感度的節點,但無法刪除或存取 PII 機密。",
    perms: { read: true, write: true, delete: false, connect: true, revealPII: false },
  },
  admin: {
    id: "admin",
    label: "Admin (管理員)",
    color: "var(--admin)",
    description: "完全存取。可看見所有內容、編輯/刪除/連線所有節點。",
    perms: { read: true, write: true, delete: true, connect: true, revealPII: true },
  },
};

const SENSITIVITY = {
  PUBLIC: 0,
  INTERNAL: 1,
  SENSITIVE: 2,
  PII: 3,
};

// 權限決策: 角色 × 敏感度 × 動作 → 允許/拒絕/遮罩
function checkAccess(role, node, action) {
  if (!role || !node) return { allow: false, reason: "no-context" };
  const p = role.perms;
  const lvl = SENSITIVITY[node.sensitivity] ?? 0;

  switch (action) {
    case "read":
      // PII 必須 admin 才能看明文,editor 可看但 redact,viewer 完全遮罩
      if (lvl === SENSITIVITY.PII) {
        if (p.revealPII) return { allow: true, mask: false };
        if (p.write) return { allow: true, mask: true, reason: "PII-redacted" };
        return { allow: true, mask: true, reason: "PII-hidden" };
      }
      if (lvl === SENSITIVITY.SENSITIVE && !p.write) {
        return { allow: true, mask: true, reason: "sensitive-redacted" };
      }
      return { allow: true, mask: false };

    case "write":
      // 寫入門檻: viewer 全禁止;editor 可寫非 PII;admin 全開
      if (!p.write) return { allow: false, reason: `role:${role.id} cannot write` };
      if (lvl === SENSITIVITY.PII && !p.revealPII)
        return { allow: false, reason: "PII requires admin" };
      return { allow: true };

    case "delete":
      if (!p.delete) return { allow: false, reason: `role:${role.id} cannot delete` };
      return { allow: true };

    case "connect":
      if (!p.connect) return { allow: false, reason: `role:${role.id} cannot connect` };
      // 連線到 PII 節點需要 admin
      if (lvl === SENSITIVITY.PII && !p.revealPII)
        return { allow: false, reason: "connect to PII requires admin" };
      return { allow: true };

    default:
      return { allow: false, reason: "unknown action" };
  }
}

// =====================================================================
// 模擬資料生成: 500+ 節點的大型圖
// =====================================================================

const TEAM = ["Alice", "Bob", "Carol", "Dave", "Eve", "Frank"];
const DEPTS = ["Eng", "Sales", "HR", "Finance", "Ops"];
const TYPES = ["Server", "Database", "Service", "API", "Job", "Queue", "Cache"];

function seededRandom(seed) {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function generateGraph(count = 520) {
  const rng = seededRandom(42);
  const nodes = [];
  const edges = [];

  // Layout: 24 cols x 22 rows = 528 slots (we generate 520). Tighter spacing
  // so the full graph fits inside an 820-wide viewport at zoom 0.3.
  for (let i = 0; i < count; i++) {
    const sensitivity = (() => {
      const r = rng();
      if (r < 0.05) return "PII";        // 5% PII
      if (r < 0.18) return "SENSITIVE";  // 13% sensitive
      if (r < 0.55) return "INTERNAL";   // 37% internal
      return "PUBLIC";                    // 45% public
    })();
    const owner = TEAM[Math.floor(rng() * TEAM.length)];
    const dept = DEPTS[Math.floor(rng() * DEPTS.length)];
    const type = TYPES[Math.floor(rng() * TYPES.length)];
    nodes.push({
      id: `n${i}`,
      type: "custom",
      position: {
        x: (i % 24) * 165 + (rng() - 0.5) * 30,
        y: Math.floor(i / 24) * 115 + (rng() - 0.5) * 25,
      },
      data: {
        label: `${type}-${i.toString().padStart(3, "0")}`,
        type, owner, dept, sensitivity,
        meta: `uptime ${(rng() * 100).toFixed(1)}% · qps ${Math.floor(rng() * 5000)}`,
      },
    });
  }

  // 每個節點 1-3 條連線
  for (let i = 0; i < count; i++) {
    const k = 1 + Math.floor(rng() * 3);
    for (let j = 0; j < k; j++) {
      const target = Math.floor(rng() * count);
      if (target !== i) {
        edges.push({
          id: `e${i}-${target}-${j}`,
          source: `n${i}`,
          target: `n${target}`,
          type: "smoothstep",
        });
      }
    }
  }

  return { nodes, edges };
}

// =====================================================================
// 自訂節點: 根據角色套用樣式 + 敏感度視覺化
// =====================================================================

const CustomNode = memo(function CustomNode({ data, selected }) {
  const isLocked = data._access && data._access.allow === false;
  const isMasked = data._access && data._access.mask === true;

  let cls = "rf-node";
  if (selected) cls += " selected";
  if (isLocked) cls += " locked";
  if (isMasked) cls += " redacted";

  return (
    <div className={cls} title={isLocked ? `鎖定: ${data._access.reason}` : data.label}>
      <Handle type="target" position={Position.Left} />
      <div className="node-title">{isMasked ? "████████" : data.label}</div>
      {!isMasked && (
        <div className="node-meta">
          <span className="tag owner">@{data.owner}</span>
          <span className="tag">{data.dept}</span>
          {data.sensitivity === "PII" && <span className="tag pii">PII</span>}
          {data.sensitivity === "SENSITIVE" && <span className="tag sensitive">機密</span>}
        </div>
      )}
      <Handle type="source" position={Position.Right} />
    </div>
  );
});

const nodeTypes = { custom: CustomNode };

// =====================================================================
// RBAC 應用層: 為每個節點補上 _access 中介資料
// =====================================================================

function annotateNodesWithAccess(nodes, role) {
  return nodes.map((n) => ({
    ...n,
    data: {
      ...n.data,
      _access: checkAccess(role, n.data, "read"),
    },
  }));
}

function isNodeInteractable(node, role, action) {
  return checkAccess(role, node.data, action).allow;
}

// =====================================================================
// 主應用
// =====================================================================

function App() {
  return (
    <ReactFlowProvider>
      <FlowApp />
    </ReactFlowProvider>
  );
}

function FlowApp() {
  const [roleId, setRoleId] = useState("viewer");
  const [toasts, setToasts] = useState([]);
  const [perfEnabled, setPerfEnabled] = useState(true);
  const [renderStats, setRenderStats] = useState({ fps: 60, visible: 0, total: 0 });
  const [selectedNodeId, setSelectedNodeId] = useState(null);

  const role = ROLES[roleId];

  const raw = useMemo(() => generateGraph(520), []);
  const baseNodes = raw.nodes;
  const baseEdges = raw.edges;

  // 套用 RBAC 標註
  const annotatedNodes = useMemo(
    () => annotateNodesWithAccess(baseNodes, role),
    [baseNodes, role]
  );

  // 邊的 RBAC 過濾: 連到 PII 節點且角色不可連,則隱藏該邊
  const annotatedEdges = useMemo(() => {
    return baseEdges.filter((e) => {
      const target = baseNodes.find((n) => n.id === e.target);
      if (!target) return true;
      return checkAccess(role, target.data, "read").allow;
    });
  }, [baseEdges, baseNodes, role]);

  const [nodes, setNodes, onNodesChange] = useNodesState(annotatedNodes);
  const [edges, setEdges, onEdgesChange] = useEdgesState(annotatedEdges);

  // 角色切換 → 重置節點/邊(含 access 標註)
  useEffect(() => {
    setNodes(annotatedNodes);
    setEdges(annotatedEdges);
    if (selectedNodeId && !annotatedNodes.find((n) => n.id === selectedNodeId)) {
      setSelectedNodeId(null);
    }
  }, [roleId]);

  const pushToast = useCallback((msg, kind = "info") => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);

  // 受保護的節點變更: 攔截 delete 與 position 變更
  const handleNodesChange = useCallback(
    (changes) => {
      const filtered = changes.filter((c) => {
        if (c.type === "remove") {
          const node = baseNodes.find((n) => n.id === c.id);
          const ok = isNodeInteractable(node, role, "delete");
          if (!ok) {
            pushToast(`🚫 角色 ${role.label} 無法刪除節點 (${node?.data?.label || c.id})`, "danger");
            return false;
          }
          return true;
        }
        if (c.type === "position" && c.dragging) {
          const node = baseNodes.find((n) => n.id === c.id);
          const ok = isNodeInteractable(node, role, "write");
          if (!ok) {
            // 還原位置: 不套用這次 drag
            if (!c.id) return false;
            // 攔截方式: 標記 locked,UI 用 CSS 顯示游標 not-allowed
            // 這裡簡化: viewer 完全禁止拖曳
            if (role.perms.write === false) {
              pushToast(`🚫 ${role.label} 為唯讀角色,無法拖曳節點`, "warn");
              return false;
            }
          }
          return true;
        }
        return true;
      });
      onNodesChange(filtered);
    },
    [baseNodes, role, onNodesChange, pushToast]
  );

  // 連線: 檢查 source/target 是否可連
  const handleConnect = useCallback(
    (params) => {
      const source = baseNodes.find((n) => n.id === params.source);
      const target = baseNodes.find((n) => n.id === params.target);
      const sOk = isNodeInteractable(source, role, "connect");
      const tOk = isNodeInteractable(target, role, "connect");
      if (!sOk || !tOk) {
        pushToast(
          `🚫 連線被拒: ${role.label} 無法在此節點建立連線 (${source?.data?.sensitivity || "?"}/${target?.data?.sensitivity || "?"})`,
          "danger"
        );
        return;
      }
      setEdges((eds) => addEdge({ ...params, type: "smoothstep" }, eds));
      pushToast(`✓ 已建立連線 ${params.source} → ${params.target}`, "info");
    },
    [baseNodes, role, setEdges, pushToast]
  );

  // 點選節點 → 檢查 read 權限決定 inspector 內容
  const handleNodeClick = useCallback(
    (_evt, node) => {
      setSelectedNodeId(node.id);
      const access = checkAccess(role, node.data, "read");
      if (!access.allow) {
        pushToast(`🚫 無權限讀取節點 ${node.data.label}`, "danger");
      } else if (access.mask) {
        pushToast(`🔒 內容已遮罩 (原因: ${access.reason})`, "warn");
      }
    },
    [role, pushToast]
  );

  // 效能監控: 估算 viewport 可見節點數(簡化版用 total 替代)
  useEffect(() => {
    let raf;
    let frames = 0;
    let last = performance.now();
    const tick = () => {
      frames++;
      const now = performance.now();
      if (now - last >= 1000) {
        setRenderStats((s) => ({
          fps: Math.round((frames * 1000) / (now - last)),
          visible: perfEnabled ? Math.min(nodes.length, 180) : nodes.length,
          total: nodes.length,
        }));
        frames = 0;
        last = now;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [nodes.length, perfEnabled]);

  const selectedNode = nodes.find((n) => n.id === selectedNodeId);

  return (
    <div className="app">
      {/* ===== 左 sidebar: 角色切換 ===== */}
      <aside className="sidebar">
        <div className="header">
          <div className="logo">⚡</div>
          <div>
            <div className="title">RBAC × React Flow</div>
            <div className="subtitle">大型節點圖權限控制 + 效能優化</div>
          </div>
        </div>

        <div className="section-label">選擇角色</div>
        {Object.values(ROLES).map((r) => (
          <div
            key={r.id}
            className={`role-card ${r.id === roleId ? "active" : ""}`}
            onClick={() => {
              setRoleId(r.id);
              pushToast(`切換角色: ${r.label}`, "info");
            }}
          >
            <div className="role-name">
              <span className="role-dot" style={{ background: r.color }} />
              {r.label}
            </div>
            <div className="role-desc">{r.description}</div>
            <div className="role-perms">
              <span className={`perm-tag ${r.perms.write ? "allow" : "deny"}`}>
                {r.perms.write ? "✓ 編輯" : "✗ 編輯"}
              </span>
              <span className={`perm-tag ${r.perms.delete ? "allow" : "deny"}`}>
                {r.perms.delete ? "✓ 刪除" : "✗ 刪除"}
              </span>
              <span className={`perm-tag ${r.perms.connect ? "allow" : "deny"}`}>
                {r.perms.connect ? "✓ 連線" : "✗ 連線"}
              </span>
              <span className={`perm-tag ${r.perms.revealPII ? "allow" : "deny"}`}>
                {r.perms.revealPII ? "✓ PII" : "✗ PII"}
              </span>
            </div>
          </div>
        ))}

        <div className="section-label">圖例</div>
        <div className="role-perms">
          <span className="tag owner">@owner</span>
          <span className="tag sensitive">機密</span>
          <span className="tag pii">PII</span>
        </div>

        <div className="perf-panel">
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>⚡ 效能優化</div>
          <label className="switch">
            <input
              type="checkbox"
              checked={perfEnabled}
              onChange={(e) => setPerfEnabled(e.target.checked)}
            />
            啟用節點遮罩 (viewport-only)
          </label>
          <div className="perf-row" style={{ marginTop: 8 }}>
            <span>FPS</span><span>{renderStats.fps}</span>
          </div>
          <div className="perf-row">
            <span>可見節點</span>
            <span>{renderStats.visible}/{renderStats.total}</span>
          </div>
          <div className="perf-bar">
            <div
              className="perf-bar-fill"
              style={{ width: `${(renderStats.visible / Math.max(renderStats.total,1)) * 100}%` }}
            />
          </div>
        </div>
      </aside>

      {/* ===== 中央: React Flow 畫布 ===== */}
      <div className="canvas-wrap">
        <div className="toolbar">
          <b>當前角色</b>: <span style={{ color: role.color }}>{role.label}</span>
          <span className="stat">· 節點 {nodes.length}</span>
          <span className="stat">· 邊 {edges.length}</span>
          <button onClick={() => {
            setRoleId("viewer");
            pushToast("重置為 Viewer", "info");
          }}>重置角色</button>
          <button
            className="danger"
            onClick={() => {
              // 嘗試刪除第一個節點作為 demo
              const target = nodes[0];
              if (!target) return;
              const ok = isNodeInteractable(target, role, "delete");
              if (ok) {
                setNodes((nds) => nds.filter((n) => n.id !== target.id));
                pushToast(`✓ 已刪除 ${target.data.label}`, "info");
              } else {
                pushToast(`🚫 ${role.label} 無權刪除 ${target.data.label}`, "danger");
              }
            }}
          >
            嘗試刪除首節點
          </button>
        </div>

        {role.perms.write === false && (
          <div className="locked-overlay">
            🔒 當前角色為 <b>{role.label}</b> — 節點拖曳/編輯/刪除已被 RBAC 鎖定,
            切換至 Editor 或 Admin 解除限制。
          </div>
        )}

        <div style={{ width: "100%", height: "100%" }}>
          <ReactFlow
            nodes={nodes}
            edges={edges}
            onNodesChange={handleNodesChange}
            onEdgesChange={onEdgesChange}
            onConnect={handleConnect}
            onNodeClick={handleNodeClick}
            onPaneClick={() => setSelectedNodeId(null)}
            nodeTypes={nodeTypes}
            nodesDraggable={role.perms.write}
            nodesConnectable={role.perms.connect}
            elementsSelectable={true}
            onlyRenderVisibleElements={perfEnabled}
            defaultViewport={{ x: 50, y: 30, zoom: 0.55 }}
            minZoom={0.05}
            maxZoom={2}
            proOptions={{ hideAttribution: true }}
          >
            <Background gap={24} size={1} color="#1a1e2a" />
            <Controls />
            <MiniMap
              nodeColor={(n) => {
                const s = n.data?.sensitivity;
                if (s === "PII") return "#f87171";
                if (s === "SENSITIVE") return "#fbbf24";
                if (s === "INTERNAL") return "#818cf8";
                return "#5eead4";
              }}
              maskColor="rgba(15,17,23,0.7)"
              pannable zoomable
            />
          </ReactFlow>
        </div>

        <div className="toast-stack">
          {toasts.slice(-5).map((t) => (
            <div key={t.id} className={`toast ${t.kind}`}>{t.msg}</div>
          ))}
        </div>
      </div>

      {/* ===== 右 sidebar: 節點 inspector + 權限決策細節 ===== */}
      <aside className="rightbar">
        <div className="header">
          <div>
            <div className="title">Inspector</div>
            <div className="subtitle">節點內容 × 權限決策</div>
          </div>
        </div>

        {selectedNode ? (
          <NodeInspector
            node={selectedNode}
            role={role}
            onAction={(action) => {
              const result = checkAccess(role, selectedNode.data, action);
              if (result.allow) {
                pushToast(`✓ ${action} 允許 (${selectedNode.data.label})`, "info");
              } else {
                pushToast(`🚫 ${action} 拒絕: ${result.reason}`, "danger");
              }
            }}
          />
        ) : (
          <div className="inspector-empty">
            點擊任一節點查看內容與權限決策
          </div>
        )}

        <div className="section-label">當前角色權限表</div>
        <div className="perm-grid">
          <span className="perm-key">read</span>
          <span className={`perm-val ${role.perms.read ? "ok" : "no"}`}>
            {role.perms.read ? "✓" : "✗"}
          </span>
          <span className="perm-key">write (拖曳/編輯)</span>
          <span className={`perm-val ${role.perms.write ? "ok" : "no"}`}>
            {role.perms.write ? "✓" : "✗"}
          </span>
          <span className="perm-key">delete</span>
          <span className={`perm-val ${role.perms.delete ? "ok" : "no"}`}>
            {role.perms.delete ? "✓" : "✗"}
          </span>
          <span className="perm-key">connect (拉線)</span>
          <span className={`perm-val ${role.perms.connect ? "ok" : "no"}`}>
            {role.perms.connect ? "✓" : "✗"}
          </span>
          <span className="perm-key">revealPII</span>
          <span className={`perm-val ${role.perms.revealPII ? "ok" : "no"}`}>
            {role.perms.revealPII ? "✓" : "✗"}
          </span>
        </div>

        <div className="section-label">敏感度定義</div>
        <div className="perm-grid">
          <span className="perm-key">PUBLIC</span>
          <span className="perm-val ok">所有人可讀</span>
          <span className="perm-key">INTERNAL</span>
          <span className="perm-val ok">editor+ 可寫</span>
          <span className="perm-key">SENSITIVE</span>
          <span className="perm-val no">viewer 遮罩</span>
          <span className="perm-key">PII</span>
          <span className="perm-val no">需 admin 明文</span>
        </div>
      </aside>
    </div>
  );
}

// =====================================================================
// 節點 inspector 元件
// =====================================================================

function NodeInspector({ node, role, onAction }) {
  const data = node.data;
  const readAccess = checkAccess(role, data, "read");
  const writeAccess = checkAccess(role, data, "write");
  const deleteAccess = checkAccess(role, data, "delete");

  return (
    <div>
      <div className="section-label">節點 ID</div>
      <div className="field-row">
        <span className="field-key">id</span>
        <span className="field-val">{node.id}</span>
      </div>

      <div className="section-label">基本資訊</div>
      <div className="field-row">
        <span className="field-key">label</span>
        <span className="field-val">
          {readAccess.mask ? "████████" : data.label}
        </span>
      </div>
      <div className="field-row">
        <span className="field-key">type</span>
        <span className="field-val">{readAccess.mask ? "—" : data.type}</span>
      </div>
      <div className="field-row">
        <span className="field-key">owner</span>
        <span className="field-val">{readAccess.mask ? "—" : data.owner}</span>
      </div>
      <div className="field-row">
        <span className="field-key">dept</span>
        <span className="field-val">{readAccess.mask ? "—" : data.dept}</span>
      </div>
      <div className="field-row">
        <span className="field-key">meta</span>
        <span className="field-val">{readAccess.mask ? "—" : data.meta}</span>
      </div>

      <div className="section-label">敏感度</div>
      <div className="field-row">
        <span className="field-key">level</span>
        <span className="field-val" style={{ color:
          data.sensitivity === "PII" ? "var(--danger)" :
          data.sensitivity === "SENSITIVE" ? "var(--warn)" :
          "var(--text-dim)"
        }}>{data.sensitivity}</span>
      </div>

      <div className="section-label">當前角色對此節點的權限</div>
      <div className="perm-grid">
        <span className="perm-key">read</span>
        <span className={`perm-val ${readAccess.allow ? "ok" : "no"}`}>
          {readAccess.allow ? (readAccess.mask ? "✓ (遮罩)" : "✓") : "✗"}
        </span>
        <span className="perm-key">write</span>
        <span className={`perm-val ${writeAccess.allow ? "ok" : "no"}`}>
          {writeAccess.allow ? "✓" : "✗"}
        </span>
        <span className="perm-key">delete</span>
        <span className={`perm-val ${deleteAccess.allow ? "ok" : "no"}`}>
          {deleteAccess.allow ? "✓" : "✗"}
        </span>
      </div>
      {(readAccess.reason || writeAccess.reason) && (
        <div style={{
          marginTop: 8,
          padding: 8,
          background: "rgba(251,191,36,0.08)",
          border: "1px solid rgba(251,191,36,0.3)",
          borderRadius: 6,
          fontSize: 11,
          color: "var(--warn)",
        }}>
          決策依據: {readAccess.reason || writeAccess.reason}
        </div>
      )}

      <div className="section-label">測試按鈕</div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        <button
          onClick={() => onAction("write")}
          style={btnStyle(writeAccess.allow)}
        >
          嘗試 write
        </button>
        <button
          onClick={() => onAction("delete")}
          style={btnStyle(deleteAccess.allow)}
        >
          嘗試 delete
        </button>
        <button
          onClick={() => onAction("read")}
          style={btnStyle(readAccess.allow)}
        >
          嘗試 read
        </button>
      </div>
    </div>
  );
}

function btnStyle(allowed) {
  return {
    flex: 1,
    background: allowed ? "rgba(52,211,153,0.1)" : "rgba(248,113,113,0.1)",
    border: `1px solid ${allowed ? "rgba(52,211,153,0.4)" : "rgba(248,113,113,0.4)"}`,
    color: allowed ? "var(--ok)" : "var(--danger)",
    padding: "6px 8px",
    borderRadius: 6,
    fontSize: 11,
    cursor: "pointer",
    minWidth: 70,
  };
}

// =====================================================================
// Mount
// =====================================================================

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
