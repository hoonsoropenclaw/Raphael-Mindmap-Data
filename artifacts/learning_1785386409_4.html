<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>行政系統視覺資源庫 ｜ Visual DNA Library</title>
<meta name="description" content="從知名設計網站萃取的 29 組美感參數，作為行政系統 UI 設計參考。" />
<style>
  :root {
    --bg-page: #0b0d10;
    --bg-panel: rgba(20, 22, 27, 0.72);
    --bg-panel-strong: rgba(20, 22, 27, 0.92);
    --bg-elevated: #15181d;
    --border-faint: rgba(255,255,255,0.06);
    --border-mid: rgba(255,255,255,0.12);
    --text-primary: #f3f4f6;
    --text-secondary: #a1a8b3;
    --text-muted: #6b7280;
    --accent: #c9a96e;
    --accent-soft: #e3c799;
    --accent-ink: #1a1408;
    --danger: #ef4444;
    --success: #10b981;
    --radius-card: 16px;
    --radius-button: 999px;
    --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 18px 40px rgba(0,0,0,0.45);
    --font-display: "Geist", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    --font-body: "Geist", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 60; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.95  0 0 0 0 0.95  0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.5;
    mix-blend-mode: overlay;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 12% 0%, rgba(201,169,110,0.10), transparent 60%),
      radial-gradient(ellipse 50% 35% at 88% 100%, rgba(120,80,200,0.06), transparent 65%);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .nav {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    height: 68px;
    border-bottom: 1px solid var(--border-faint);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    background: rgba(11,13,16,0.55);
  }
  .nav-brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
  .nav-brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, #8a6d3a 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 14px rgba(201,169,110,0.25);
    display: grid; place-items: center; color: var(--accent-ink); font-weight: 700; font-size: 14px;
  }
  .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--text-secondary); }
  .nav-links a:hover { color: var(--text-primary); }
  .nav-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: var(--radius-button);
    background: var(--accent); color: var(--accent-ink); border: none;
    font-weight: 600; font-size: 13.5px;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(201,169,110,0.35); }
  .nav-cta:active { transform: translateY(0); }
  .hero {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px;
    padding: 64px 28px 56px;
    max-width: 1320px; margin: 0 auto;
    align-items: end;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .hero-eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); display: block; }
  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(34px, 4.4vw, 56px);
    line-height: 1.05; letter-spacing: -0.03em; font-weight: 600;
    margin: 0 0 22px;
  }
  .hero h1 .accent { color: var(--accent); font-style: italic; font-family: var(--font-display); }
  .hero p {
    font-size: 17px; color: var(--text-secondary); max-width: 56ch; margin: 0 0 28px;
    line-height: 1.6;
  }
  .hero-stats {
    display: flex; gap: 36px; padding-top: 28px;
    border-top: 1px solid var(--border-faint);
  }
  .hero-stat-num { font-family: var(--font-mono); font-size: 30px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.02em; }
  .hero-stat-label { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
  .hero-visual {
    aspect-ratio: 4/5;
    border-radius: 20px;
    background:
      linear-gradient(135deg, rgba(201,169,110,0.18), rgba(120,80,200,0.10)),
      var(--bg-elevated);
    border: 1px solid var(--border-mid);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    position: relative;
  }
  .hero-visual-inner {
    position: absolute; inset: 16px;
    border-radius: 12px;
    background: conic-gradient(from 200deg at 50% 50%, #1c1f25, #2a1f10, #1c1f25, #2a1f10);
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; padding: 12px;
  }
  .hero-visual-cell {
    border-radius: 10px;
    border: 1px solid var(--border-faint);
    padding: 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: rgba(0,0,0,0.25);
  }
  .hero-visual-cell .swatch-row { display: flex; gap: 4px; }
  .hero-visual-cell .sw { width: 18px; height: 18px; border-radius: 4px; }
  .hero-visual-cell .label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; color: var(--text-muted); }
  .filters {
    max-width: 1320px; margin: 0 auto; padding: 0 28px 28px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .search {
    flex: 1; min-width: 280px;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-radius: var(--radius-button);
    border: 1px solid var(--border-mid);
    background: var(--bg-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-primary); font-size: 14px; font-family: var(--font-body);
  }
  .search input::placeholder { color: var(--text-muted); }
  .search-icon { color: var(--text-muted); }
  .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 16px;
    border-radius: var(--radius-button);
    border: 1px solid var(--border-mid);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    transition: all 120ms ease;
  }
  .chip:hover { color: var(--text-primary); border-color: rgba(201,169,110,0.4); }
  .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .grid-wrap { max-width: 1320px; margin: 0 auto; padding: 20px 28px 80px; }
  .bento {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 16px;
  }
  .card {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--border-faint);
    border-radius: var(--radius-card);
    overflow: hidden;
    cursor: pointer;
    transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), border-color 220ms ease, box-shadow 220ms ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--shadow-card);
    min-height: 280px;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--border-mid); box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
  .card:active { transform: translateY(-1px); }
  .card.span-4 { grid-column: span 4; }
  .card.span-6 { grid-column: span 6; min-height: 340px; }
  .card.span-8 { grid-column: span 8; min-height: 360px; }
  .card.span-12 { grid-column: span 12; min-height: 320px; }
  .card-thumb {
    height: 50%;
    min-height: 140px;
    background: var(--bg-elevated);
    position: relative;
    overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: opacity 220ms ease; }
  .card:hover .card-thumb img { opacity: 1; }
  .card-thumb-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, rgba(11,13,16,0.65) 100%);
  }
  .card-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 10px; }
  .card-meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px;
    border-radius: var(--radius-button);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--border-mid);
    color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
  }
  .badge.curated { background: rgba(201,169,110,0.12); color: var(--accent-soft); border-color: rgba(201,169,110,0.3); }
  .badge.godly { background: rgba(96,165,250,0.10); color: #93c5fd; border-color: rgba(96,165,250,0.25); }
  .badge.theme-light { background: rgba(255,255,255,0.05); color: #e5e7eb; }
  .badge.theme-dark { background: rgba(0,0,0,0.4); color: #9ca3af; border-color: rgba(255,255,255,0.15); }
  .card-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .card-module { font-size: 12.5px; color: var(--text-muted); }
  .swatches { display: flex; gap: 4px; margin-top: 6px; }
  .sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); }
  .card.span-8 .card-thumb, .card.span-12 .card-thumb { height: 60%; min-height: 200px; }
  .card.span-12 .card-body { padding: 28px 32px 32px; }
  .card.span-12 .card-title { font-size: 24px; }
  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.55);
    opacity: 0; pointer-events: none;
    transition: opacity 220ms ease;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 51;
    width: min(560px, 100vw);
    background: var(--bg-elevated);
    border-left: 1px solid var(--border-mid);
    transform: translateX(100%);
    transition: transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
    padding: 28px 32px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-close {
    position: absolute; top: 16px; right: 16px;
    background: transparent; border: 1px solid var(--border-mid);
    width: 36px; height: 36px; border-radius: 999px;
    color: var(--text-secondary);
    display: grid; place-items: center;
    transition: all 120ms ease;
  }
  .drawer-close:hover { color: var(--text-primary); border-color: var(--accent); }
  .drawer-section { margin-bottom: 24px; }
  .drawer-label {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .drawer h2 {
    font-family: var(--font-display);
    font-size: 26px; line-height: 1.2; letter-spacing: -0.015em;
    margin: 0 0 6px;
  }
  .drawer-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
  .drawer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; }
  .drawer-grid .sw { width: 100%; height: 36px; border-radius: 6px; cursor: pointer; position: relative; }
  .drawer-grid .sw span {
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 9.5px; color: var(--text-muted);
    opacity: 0; transition: opacity 120ms ease; white-space: nowrap;
  }
  .drawer-grid .sw:hover span { opacity: 1; }
  .kv-row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-faint); font-size: 13px; }
  .kv-row .k { color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; }
  .kv-row .v { color: var(--text-primary); }
  .css-output {
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border-faint);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.65;
    color: var(--text-secondary);
    overflow-x: auto;
    white-space: pre;
  }
  .css-output .prop { color: #93c5fd; }
  .css-output .val { color: var(--accent-soft); }
  footer {
    border-top: 1px solid var(--border-faint);
    padding: 32px 28px 48px;
    max-width: 1320px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text-muted); font-size: 12.5px;
  }
  footer a:hover { color: var(--text-secondary); }
  @media (max-width: 1024px) {
    .hero { grid-template-columns: 1fr; gap: 32px; padding: 48px 24px 40px; }
    .hero-visual { aspect-ratio: 16/10; }
    .card.span-4 { grid-column: span 6; }
    .card.span-6 { grid-column: span 12; }
    .card.span-8 { grid-column: span 12; }
  }
  @media (max-width: 640px) {
    .nav-links { display: none; }
    .hero { padding: 36px 16px 32px; }
    .hero h1 { font-size: 38px; }
    .hero-stats { gap: 20px; }
    .filters { padding: 0 16px 20px; }
    .grid-wrap { padding: 16px 16px 64px; }
    .bento { grid-template-columns: 1fr; }
    .card.span-4, .card.span-6, .card.span-8, .card.span-12 { grid-column: span 1; }
    .drawer { padding: 22px 20px; }
    footer { flex-direction: column; gap: 12px; padding: 28px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>

<footer>

  const isLight = h => {
    const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
    return (r*299 + g*587 + b*114) / 1000 > 128;
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let filterState = { source: 'all', theme: 'all', query: '' };

  function buildCard(d, sizeClass) {
    const colors = d.aesthetics.colors;
    const allSwatches = [...colors.primary, ...colors.accent, ...colors.neutral].slice(0, 8);
    const themeClass = isLight(colors.semantic.bg) ? 'theme-light' : 'theme-dark';
    const sourceClass = d.source === 'curated' ? 'curated' : 'godly';
    const sourceLabel = d.source === 'curated' ? 'Curated' : 'Godly';
    const swatchHtml = allSwatches.map(c => '<div class="sw" style="background:' + c + ';" title="' + c + '"></div>').join('');
    const tagsHtml = d.meta.tags.slice(0, 3).map(t => '<span class="badge">' + esc(t) + '</span>').join('');
    const thumb = d.meta.thumbnail
      ? '<img src="' + esc(d.meta.thumbnail) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=none"/>'
      : '<div style="position:absolute;inset:0;background:conic-gradient(from ' + ((d.id.charCodeAt(0)*37)%360) + 'deg at 50% 50%, ' + (colors.primary[0]||'#444') + ', ' + (colors.neutral[0]||'#222') + ', ' + (colors.primary[0]||'#444') + ');"></div>';

    return '<article class="card ' + sizeClass + '" data-id="' + esc(d.id) + '" tabindex="0" role="button" aria-label="' + esc(d.title) + ' 詳細資料">' +
      '<div class="card-thumb">' + thumb + '<div class="card-thumb-gradient"></div></div>' +
      '<div class="card-body">' +
        '<div class="card-meta-row">' +
          '<span class="badge ' + sourceClass + '">' + sourceLabel + '</span>' +
          '<span class="badge ' + themeClass + '">' + (isLight(colors.semantic.bg)?'淺色':'深色') + '</span>' +
          tagsHtml +
        '</div>' +
        '<div class="card-title">' + esc(d.title) + '</div>' +
        '<div class="card-module">' + esc(d.admin_use_case.module) + '</div>' +
        '<div class="swatches">' + swatchHtml + '</div>' +
      '</div></article>';
  }

  function renderGrid() {
    const filtered = DNA.filter(d => {
      if (filterState.source !== 'all' && d.source !== filterState.source) return false;
      const theme = isLight(d.aesthetics.colors.semantic.bg) ? 'light' : 'dark';
      if (filterState.theme !== 'all' && theme !== filterState.theme) return false;
      if (filterState.query) {
        const blob = (d.title + ' ' + d.admin_use_case.module + ' ' + d.meta.tags.join(' ')).toLowerCase();
        if (!blob.includes(filterState.query)) return false;
      }
      return true;
    });
    const grid = document.getElementById('bento-grid');
    const empty = document.getElementById('empty-state');
    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    const sizes = ['span-8', 'span-4', 'span-4', 'span-6', 'span-6', 'span-4', 'span-4', 'span-4', 'span-12'];
    grid.innerHTML = filtered.map((d, i) => buildCard(d, sizes[i % sizes.length])).join('');
    grid.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => openDrawer(el.dataset.id));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(el.dataset.id); }});
    });
  }

  function renderHeroCells() {
    const samples = DNA.filter(d => d.source === 'curated').slice(0, 4);
    samples.forEach((d, i) => {
      const cell = document.getElementById('hero-cell-' + i);
      if (!cell) return;
      const swatches = [...d.aesthetics.colors.primary, ...d.aesthetics.colors.neutral].slice(0, 5);
      cell.innerHTML =
        '<div class="label">' + esc(d.title.split(' - ')[0].substring(0, 22)) + '</div>' +
        '<div class="swatch-row">' + swatches.map(c => '<div class="sw" style="background:' + c + ';"></div>').join('') + '</div>';
    });
  }

  function openDrawer(id) {
    const d = DNA.find(x => x.id === id);
    if (!d) return;
    const c = d.aesthetics.colors;
    const t = d.aesthetics.typography;
    const mat = d.aesthetics.materials;
    const allSwatches = [...c.primary, ...c.accent, ...c.neutral];
    const drawer = document.getElementById('drawer');
    drawer.innerHTML =
      '<button class="drawer-close" onclick="closeDrawer()" aria-label="關閉">x</button>' +
      '<div class="drawer-section">' +
        '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">' +
          '<span class="badge ' + (d.source==='curated'?'curated':'godly') + '">' + d.source + '</span>' +
          '<span class="badge ' + (isLight(c.semantic.bg)?'theme-light':'theme-dark') + '">' + (isLight(c.semantic.bg)?'淺色':'深色') + '主題</span>' +
          d.meta.tags.map(t => '<span class="badge">' + esc(t) + '</span>').join('') +
        '</div>' +
        '<h2 id="drawer-title">' + esc(d.title) + '</h2>' +
        '<div class="drawer-sub">' + (d.author ? 'by ' + esc(d.author) : '') + (d.source_url ? ' <a href="' + esc(d.source_url) + '" target="_blank" rel="noopener" style="color:var(--accent-soft); border-bottom:1px dotted;">原始來源</a>' : '') + '</div>' +
      '</div>' +
      '<div class="drawer-section">' +
        '<div class="drawer-label">行政模組判讀</div>' +
        '<div class="kv-row"><span class="k">模組</span><span class="v">' + esc(d.admin_use_case.module) + '</span></div>' +
        '<div class="kv-row"><span class="k">語氣</span><span class="v">' + esc(d.admin_use_case.tone) + '</span></div>' +
        '<div class="kv-row" style="grid-template-columns:1fr;"><span class="k" style="margin-bottom:6px;">建議</span><span class="v" style="color:var(--text-secondary);">' + esc(d.admin_use_case.verdict) + '</span></div>' +
      '</div>' +
      '<div class="drawer-section">' +
        '<div class="drawer-label">色票 (' + allSwatches.length + ' 色, hover 看 hex)</div>' +
        '<div class="drawer-grid">' +
          allSwatches.map(hex => '<div class="sw" style="background:' + hex + ';"><span>' + hex + '</span></div>').join('') +

      '<div class="drawer-section">' +

      '<div class="drawer-section">' +
        '<div class="drawer-label">版型與材質</div>' +
        '<div class="kv-row"><span class="k">網格</span><span class="v">' + esc(d.aesthetics.layout.grid) + '</span></div>' +
        '<div class="kv-row"><span class="k">密度</span><span class="v">' + esc(d.aesthetics.layout.density) + '</span></div>' +
        '<div class="kv-row"><span class="k">動態</span><span class="v">' + esc(d.aesthetics.layout.motion) + '</span></div>' +
        '<div class="kv-row"><span class="k">表面</span><span class="v">' + mat.surface.join(', ') + '</span></div>' +
        '<div class="kv-row"><span class="k">陰影</span><span class="v">' + esc(mat.shadow) + '</span></div>' +
        '<div class="kv-row"><span class="k">圓角</span><span class="v">' + esc(mat.corner_radius) + '</span></div>' +
      '</div>' +
      '<div class="drawer-section">' +
        '<div class="drawer-label">CSS 變數 (複製即用)</div>' +
        '<div class="css-output">:root { --bg: ' + c.semantic.bg + '; --text: ' + c.semantic.text + '; --border: ' + c.semantic.border + '; --font-heading: \x27' + t.headings.family + '\x27, system-ui; --font-body: \x27' + t.body.family + '\x27, system-ui; --motion: ' + d.aesthetics.layout.motion + '; --surface: ' + mat.surface[0] + '; --radius: ' + mat.corner_radius + '; }</div>' +
      '</div>' +
      '<div class="drawer-section" style="color:var(--text-muted); font-size:11.5px; padding-top:16px; border-top:1px solid var(--border-faint);">' +
        '抓取時間: ' + esc(d.meta.crawled_at) +
      '</div>';
    drawer.classList.add('open');
    document.getElementById('drawer-backdrop').classList.add('open');
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawer-backdrop').classList.remove('open');
  }

  document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  document.querySelectorAll('#source-chips .chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#source-chips .chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterState.source = btn.dataset.source;
      renderGrid();
    });
  });
  document.querySelectorAll('#theme-chips .chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#theme-chips .chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterState.theme = btn.dataset.theme;
      renderGrid();
    });
  });
  document.getElementById('search-input').addEventListener('input', e => {
    filterState.query = e.target.value.toLowerCase().trim();
    renderGrid();
  });

  renderHeroCells();
  renderGrid();
</script>

</body>
</html>
