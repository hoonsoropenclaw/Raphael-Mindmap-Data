<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Whisper Live — 即時語音轉文字工作台</title>
  <style>
    :root {
      --bg-0: #0b1020;
      --bg-1: #131a36;
      --ink: #e8ecff;
      --ink-dim: #aab3d6;
      --muted: #6f7aa6;
      --line: rgba(255, 255, 255, 0.12);
      --accent: #7aa2ff;
      --accent-2: #b388ff;
      --accent-3: #4dd0e1;
      --good: #5dd39e;
      --bad: #ff7a8a;
      --warn: #ffb454;
      --glass-bg: rgba(20, 26, 56, 0.55);
      --glass-bg-2: rgba(28, 36, 70, 0.35);
      --shadow-1: 0 18px 60px rgba(0, 0, 0, 0.45);
      --shadow-2: 0 8px 30px rgba(0, 0, 0, 0.35);
      --radius: 16px;
      --radius-sm: 10px;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-0: #eef1ff;
        --bg-1: #d9def0;
        --ink: #11142a;
        --ink-dim: #3a4070;
        --muted: #6a7196;
        --line: rgba(0, 0, 30, 0.10);
        --glass-bg: rgba(255, 255, 255, 0.55);
        --glass-bg-2: rgba(255, 255, 255, 0.35);
        --shadow-1: 0 18px 60px rgba(20, 30, 80, 0.15);
        --shadow-2: 0 8px 30px rgba(20, 30, 80, 0.12);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1100px 700px at 12% -10%, rgba(122, 162, 255, 0.35), transparent 60%),
        radial-gradient(900px 600px at 100% 10%, rgba(179, 136, 255, 0.30), transparent 55%),
        radial-gradient(900px 700px at 50% 110%, rgba(77, 208, 225, 0.25), transparent 60%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1));
      min-width: 280px;
      overflow-x: hidden;
    }
    .app {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 22px 80px;
      display: grid;
      gap: 22px;
    }
    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: var(--shadow-2);
      display: grid; place-items: center;
      color: #0b1020; font-weight: 800; font-size: 18px;
    }
    .brand h1 {
      margin: 0; font-size: 20px; letter-spacing: 0.3px;
    }
    .brand small { display: block; color: var(--ink-dim); font-size: 12px; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--glass-bg-2);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--ink-dim);
      font-size: 13px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 0 rgba(0,0,0,0);
    }
    .dot.live { background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
    .dot.ok   { background: var(--good); }
    .dot.warn { background: var(--warn); }
    .dot.bad  { background: var(--bad); }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 122, 138, 0.5); }
      70%  { box-shadow: 0 0 0 12px rgba(255, 122, 138, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 122, 138, 0); }
    }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      box-shadow: var(--shadow-1);
    }

    .controls {
      padding: 18px;
      display: grid;
      gap: 16px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field > * { min-width: 0; }
    label { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.5px; text-transform: uppercase; }
    input[type="password"], input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.18);
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    @media (prefers-color-scheme: light) {
      input[type="password"], input[type="text"], select {
        background: rgba(255, 255, 255, 0.7);
        color: #11142a;
      }
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.25);
    }
    .key-row { display: flex; gap: 8px; }
    .key-row input { flex: 1 1 auto; }
    .key-row button { flex: 0 0 auto; }

    .actions {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    button.btn {
      appearance: none; border: 1px solid var(--line); cursor: pointer;
      padding: 10px 16px; border-radius: 999px;
      font: 600 14px var(--sans);
      color: var(--ink); background: rgba(255,255,255,0.06);
      transition: transform 0.08s, background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    button.btn:hover { background: rgba(255,255,255,0.12); }
    button.btn:active { transform: translateY(1px); }
    button.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b1020;
      border: none;
      box-shadow: 0 10px 25px rgba(122, 162, 255, 0.35);
    }
    button.primary:hover { filter: brightness(1.05); }
    button.danger {
      background: linear-gradient(135deg, #ff7a8a, #ff5b70);
      color: #fff; border: none;
    }

    .panel-live {
      padding: 22px;
      display: grid;
      gap: 16px;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .panel-head h2 { margin: 0; font-size: 16px; letter-spacing: 0.4px; }
    .meter-wrap {
      display: grid; gap: 8px;
    }
    .meter {
      height: 12px; border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--line);
      position: relative;
    }
    .meter > .bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-3));
      transition: width 0.1s linear;
    }
    .wave {
      height: 84px;
      border-radius: var(--radius-sm);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)),
        rgba(0,0,0,0.20);
      border: 1px solid var(--line);
      display: block;
      width: 100%;
    }
    .hint { color: var(--ink-dim); font-size: 13px; line-height: 1.5; }

    .panel-transcript { padding: 22px; display: grid; gap: 14px; }
    .seg-list { display: grid; gap: 12px; max-height: 380px; overflow: auto; padding-right: 6px; }
    .seg {
      display: grid; gap: 6px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
    }
    .seg.live-seg {
      border-color: rgba(122,162,255,0.55);
      background: rgba(122,162,255,0.10);
    }
    .seg .meta { display: flex; gap: 10px; color: var(--muted); font-size: 11px; }
    .seg .text { font-size: 15px; line-height: 1.55; }
    .empty {
      text-align: center; color: var(--ink-dim);
      padding: 36px 16px;
    }

    .toast-stack {
      position: fixed; right: 18px; bottom: 18px;
      display: grid; gap: 10px;
      z-index: 9999;
      max-width: min(92vw, 380px);
    }
    .toast {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-2);
      color: var(--ink);
      font-size: 13px;
      animation: toast-in 0.25s ease;
    }
    .toast.good { border-color: rgba(93,211,158,0.55); }
    .toast.bad  { border-color: rgba(255,122,138,0.55); }
    .toast.warn { border-color: rgba(255,180,84,0.55); }
    @keyframes toast-in {
      from { transform: translateY(8px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .seg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .seg .ts {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }

    .legend {
      display: flex; flex-wrap: wrap; gap: 14px;
      color: var(--ink-dim); font-size: 12px;
    }
    .legend span::before {
      content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
      margin-right: 6px; vertical-align: middle; background: var(--muted);
    }
    .legend .l-live::before { background: var(--bad); }
    .legend .l-final::before { background: var(--good); }

    footer {
      text-align: center; color: var(--ink-dim); font-size: 12px;
      padding: 12px 16px;
    }
    footer code { font-family: var(--mono); }

    @media (max-width: 540px) {
      .app { padding: 18px 14px 60px; }
      .panel-live, .panel-transcript, .controls { padding: 16px; }
      .brand h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">W</div>
        <div>
          <h1>Whisper Live</h1>
          <small>基於 OpenAI Whisper API 的即時語音轉文字工作台</small>
        </div>
      </div>
      <div class="status-chip" id="statusChip" role="status" aria-live="polite">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">未連線</span>
      </div>
    </header>

    <!-- 控制列 -->
    <section class="glass controls" aria-label="錄音與轉錄設定">
      <div class="row">
        <div class="field" style="grid-column: span 2;">
          <label for="apiKey">OpenAI API Key</label>
          <div class="key-row">
            <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
            <button class="btn" type="button" id="toggleKey" title="顯示 / 隱藏">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="lang">語言</label>
          <select id="lang">
            <option value="auto">自動偵測</option>
            <option value="zh">中文 (zh)</option>
            <option value="en">英文 (en)</option>
            <option value="ja">日文 (ja)</option>
            <option value="ko">韓文 (ko)</option>
            <option value="es">西班牙文 (es)</option>
            <option value="fr">法文 (fr)</option>
            <option value="de">德文 (de)</option>
            <option value="it">義大利文 (it)</option>
            <option value="pt">葡萄牙文 (pt)</option>
            <option value="ru">俄文 (ru)</option>
          </select>
        </div>
        <div class="field">
          <label for="interval">切片長度 (秒)</label>
          <select id="interval">
            <option value="2">2 秒</option>
            <option value="3" selected>3 秒</option>
            <option value="5">5 秒</option>
            <option value="8">8 秒</option>
          </select>
        </div>
        <div class="field">
          <label for="prompt">提示詞 (選填)</label>
          <input type="text" id="prompt" placeholder="例如:會議、人名、專有名詞" />
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="btnStart" type="button">▶ 開始錄音</button>
        <button class="btn danger" id="btnStop" type="button" disabled>■ 停止</button>
        <button class="btn" id="btnDownload" type="button" disabled>⬇ 下載逐字稿</button>
        <button class="btn" id="btnClear" type="button">清除紀錄</button>
        <span class="hint" id="elapsed">已錄製 0.0 秒</span>
      </div>
    </section>

    <!-- 即時面板 -->
    <section class="glass panel-live" aria-label="即時音訊">
      <div class="panel-head">
        <h2>即時音訊</h2>
        <div class="legend">
          <span class="l-live">錄音中</span>
          <span class="l-final">送出轉錄</span>
        </div>
      </div>
      <div class="meter-wrap">
        <div class="meter" aria-hidden="true"><div class="bar" id="meterBar"></div></div>
        <canvas class="wave" id="wave" aria-label="音量波形"></canvas>
      </div>
      <p class="hint" id="liveHint">
        點「開始錄音」後,瀏覽器會請求麥克風權限。
        每 <span id="intLabel">3</span> 秒的音訊會被切片送至 Whisper API 進行轉錄,逐字稿會即時顯示於下方。
      </p>
    </section>

    <!-- 逐字稿 -->
    <section class="glass panel-transcript" aria-label="逐字稿">
      <div class="panel-head">
        <h2>逐字稿</h2>
        <div class="legend">
          <span>共 <strong id="segCount">0</strong> 段</span>
          <span>字數 <strong id="charCount">0</strong></span>
        </div>
      </div>
      <div class="seg-list" id="segList">
        <div class="empty" id="emptyState">
          還沒有任何轉錄。開始錄音後,第一段會在切片結束時出現。
        </div>
      </div>
    </section>

    <footer>
      WebM/Opus → <code>whisper-1</code> &nbsp;·&nbsp;
      純前端實作,音訊僅送往 OpenAI &nbsp;·&nbsp;
      建議使用 Chrome / Edge / Firefox 最新版
    </footer>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script>
    // ============================================================
    // Whisper Live — pure-frontend real-time speech-to-text
    // Pipeline: getUserMedia → MediaRecorder (webm/opus, 3s chunks)
    //           → fetch POST to /v1/audio/transcriptions (whisper-1)
    //           → append text segment to live transcript
    // ============================================================

    const $ = (id) => document.getElementById(id);

    // ---- DOM refs ----
    const apiKeyEl    = $('apiKey');
    const toggleKeyEl = $('toggleKey');
    const langEl      = $('lang');
    const intervalEl  = $('interval');
    const promptEl    = $('prompt');
    const btnStart    = $('btnStart');
    const btnStop     = $('btnStop');
    const btnDl       = $('btnDownload');
    const btnClear    = $('btnClear');
    const elapsedEl   = $('elapsed');
    const intLabel    = $('intLabel');
    const meterBar    = $('meterBar');
    const wave        = $('wave');
    const segList     = $('segList');
    const segCountEl  = $('segCount');
    const charCountEl = $('charCount');
    const emptyState  = $('emptyState');
    const statusDot   = $('statusDot');
    const statusText  = $('statusText');
    const toastStack  = $('toastStack');

    // ---- State ----
    const state = {
      recording: false,
      chunks: [],          // queue of pending Blob chunks awaiting transcription
      pendingInflight: 0,  // active fetch count
      segments: [],        // final transcript segments
      startedAt: 0,
      mimeType: '',
      mediaRecorder: null,
      stream: null,
      audioCtx: null,
      analyser: null,
      rafId: 0,
      lastChunkSentAt: 0,
    };

    // ---- Toast helper ----
    function toast(msg, kind = '') {
      const el = document.createElement('div');
      el.className = 'toast ' + kind;
      el.textContent = msg;
      toastStack.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity .3s, transform .3s';
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(() => el.remove(), 320);
      }, 3600);
    }

    // ---- Status helper ----
    function setStatus(text, kind = '') {
      statusText.textContent = text;
      statusDot.className = 'dot ' + kind;
    }

    // ---- Pick a supported MIME type ----
    function pickMime() {
      const candidates = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/mp4',
      ];
      for (const m of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
      }
      return ''; // browser default
    }

    // ---- Waveform / meter drawing ----
    function ensureAudioCtx() {
      if (state.audioCtx) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      state.audioCtx = new Ctx();
      const src = state.audioCtx.createMediaStreamSource(state.stream);
      const analyser = state.audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      src.connect(analyser);
      state.analyser = analyser;
    }

    function drawLoop() {
      if (!state.recording) return;
      const ctx = wave.getContext('2d');
      const w = wave.width = wave.clientWidth * devicePixelRatio;
      const h = wave.height = wave.clientHeight * devicePixelRatio;

      const analyser = state.analyser;
      let level = 0;
      if (analyser) {
        const buf = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) {
          const v = (buf[i] - 128) / 128;
          sum += v * v;
        }
        level = Math.sqrt(sum / buf.length); // RMS
      }

      // Background
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(0, 0, w, h);

      // Waveform
      ctx.lineWidth = 2 * devicePixelRatio;
      ctx.strokeStyle = '#7aa2ff';
      ctx.beginPath();
      const mid = h / 2;
      const amp = h * 0.4 * Math.min(1, level * 4 + 0.05);
      const segs = 80;
      for (let i = 0; i <= segs; i++) {
        const x = (i / segs) * w;
        const phase = (i / segs) * Math.PI * 8 + performance.now() / 220;
        const env = Math.sin((i / segs) * Math.PI);
        const y = mid + Math.sin(phase) * amp * env;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Meter
      meterBar.style.width = Math.min(100, level * 380) + '%';

      state.rafId = requestAnimationFrame(drawLoop);
    }

    // ---- Pick Whisper-compatible file extension for MIME ----
    function extForMime(m) {
      if (!m) return 'webm';
      if (m.includes('webm')) return 'webm';
      if (m.includes('ogg'))  return 'ogg';
      if (m.includes('mp4'))  return 'mp4';
      return 'webm';
    }

    // ---- Send one chunk to Whisper ----
    async function transcribeBlob(blob, seq) {
      const apiKey = apiKeyEl.value.trim();
      if (!apiKey) {
        toast('請先填入 OpenAI API Key', 'warn');
        return;
      }

      const lang = langEl.value;
      const prompt = promptEl.value.trim();
      const filename = `chunk-${Date.now()}-${seq}.${extForMime(state.mimeType)}`;

      const form = new FormData();
      form.append('file', blob, filename);
      form.append('model', 'whisper-1');
      form.append('response_format', 'verbose_json');
      if (lang !== 'auto') form.append('language', lang);
      if (prompt) form.append('prompt', prompt);

      state.pendingInflight++;
      setStatus(`送出第 ${seq} 段…`, 'warn');
      const t0 = performance.now();
      try {
        const resp = await fetch('https://api.openai.com/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + apiKey },
          body: form,
        });

        if (!resp.ok) {
          let msg = `HTTP ${resp.status}`;
          try {
            const err = await resp.json();
            if (err && err.error && err.error.message) msg = err.error.message;
          } catch (_) { /* not JSON */ }
          throw new Error(msg);
        }

        const data = await resp.json();
        const text = (data && typeof data.text === 'string') ? data.text.trim() : '';
        const dt = Math.round(performance.now() - t0);

        if (text) {
          appendSegment(text, seq, dt);
          toast(`第 ${seq} 段轉錄完成 (${dt} ms)`, 'good');
        } else {
          toast(`第 ${seq} 段:沒有偵測到語音`, 'warn');
        }
        setStatus(`錄音中…(已完成 ${seq} 段)`, 'live');
      } catch (err) {
        toast(`第 ${seq} 段失敗:${err.message || err}`, 'bad');
        setStatus(`錄音中(第 ${seq} 段失敗)`, 'warn');
      } finally {
        state.pendingInflight--;
        updateExportable();
      }
    }

    // ---- Segment rendering ----
    function appendSegment(text, seq, dtMs) {
      if (emptyState && emptyState.parentNode) emptyState.remove();
      const ts = new Date();
      const tsStr = ts.toLocaleTimeString();
      const el = document.createElement('div');
      el.className = 'seg';
      el.dataset.text = text;
      el.innerHTML = `
        <div class="seg-head">
          <div class="meta">
            <span>#${seq}</span>
            <span class="ts">${tsStr}</span>
            <span class="ts">${dtMs} ms</span>
          </div>
        </div>
        <div class="text"></div>
      `;
      el.querySelector('.text').textContent = text;
      segList.prepend(el);
      state.segments.unshift({ seq, text, ts: tsStr, dtMs });
      segCountEl.textContent = state.segments.length;
      charCountEl.textContent = state.segments.reduce((n, s) => n + s.text.length, 0);
      updateExportable();
    }

    function updateExportable() {
      btnDl.disabled = state.segments.length === 0;
    }

    // ---- Start ----
    async function startRecording() {
      if (state.recording) return;
      const apiKey = apiKeyEl.value.trim();
      if (!apiKey) {
        toast('請先填入 OpenAI API Key', 'warn');
        apiKeyEl.focus();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast('此瀏覽器不支援麥克風存取', 'bad');
        return;
      }
      try {
        state.stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
          video: false,
        });
      } catch (err) {
        const msg = err && (err.name === 'NotAllowedError')
          ? '麥克風權限被拒絕,請至瀏覽器設定允許麥克風'
          : '無法取得麥克風:' + (err && err.message || err);
        toast(msg, 'bad');
        setStatus('權限錯誤', 'bad');
        return;
      }

      state.mimeType = pickMime();
      let rec;
      try {
        rec = state.mimeType
          ? new MediaRecorder(state.stream, { mimeType: state.mimeType })
          : new MediaRecorder(state.stream);
      } catch (err) {
        toast('MediaRecorder 建立失敗:' + (err && err.message || err), 'bad');
        cleanupStream();
        return;
      }
      state.mediaRecorder = rec;

      rec.ondataavailable = async (ev) => {
        if (!ev.data || ev.data.size === 0) return;
        // queue for transcription (avoid overlapping API calls per chunk)
        state.chunks.push({ blob: ev.data, seq: state.chunks.length + 1 });
        flushQueue();
      };

      rec.onerror = (ev) => {
        toast('MediaRecorder 錯誤:' + (ev.error && ev.error.message || ev.error), 'bad');
      };

      rec.onstop = () => {
        // recorder stopped; flush any remaining
        flushQueue(true);
      };

      // slice every N seconds (use timeslice)
      const intervalMs = parseInt(intervalEl.value, 10) * 1000 || 3000;
      rec.start(intervalMs);

      // analyser for waveform / meter
      try { ensureAudioCtx(); } catch (e) { /* ignore */ }

      state.recording = true;
      state.startedAt = Date.now();
      state.lastChunkSentAt = Date.now();
      btnStart.disabled = true;
      btnStop.disabled = false;
      intLabel.textContent = (intervalMs / 1000).toString();
      setStatus('錄音中…', 'live');
      tickElapsed();
      drawLoop();
      toast('開始錄音,請對著麥克風說話', 'good');
    }

    // Sequentially drain queued chunks to keep ordering stable
    let flushing = false;
    async function flushQueue(drainAll = false) {
      if (flushing) return;
      flushing = true;
      try {
        while (state.chunks.length > 0) {
          // soft backpressure: if many in flight, wait briefly
          if (state.pendingInflight >= 2) {
            await new Promise((r) => setTimeout(r, 150));
            continue;
          }
          const next = state.chunks.shift();
          // Fire without await so concurrent inflight is allowed up to 2
          transcribeBlob(next.blob, next.seq).catch(() => {});
          if (!drainAll) {
            // allow next tick to pick up further
            await new Promise((r) => setTimeout(r, 30));
          }
        }
      } finally {
        flushing = false;
      }
    }

    function tickElapsed() {
      if (!state.recording) return;
      const sec = (Date.now() - state.startedAt) / 1000;
      elapsedEl.textContent = `已錄製 ${sec.toFixed(1)} 秒`;
      setTimeout(tickElapsed, 250);
    }

    // ---- Stop ----
    async function stopRecording() {
      if (!state.recording) return;
      btnStop.disabled = true;
      setStatus('停止中…', 'warn');

      try {
        if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
          state.mediaRecorder.stop();
        }
      } catch (_) { /* ignore */ }

      cancelAnimationFrame(state.rafId);
      cleanupStream();

      // Wait briefly for in-flight to finish (best effort)
      const deadline = Date.now() + 4000;
      while (state.pendingInflight > 0 && Date.now() < deadline) {
        await new Promise((r) => setTimeout(r, 100));
      }
      flushQueue(true);

      state.recording = false;
      btnStart.disabled = false;
      setStatus(state.segments.length ? `已停止 · 共 ${state.segments.length} 段` : '已停止', state.segments.length ? 'ok' : '');
      toast('錄音已停止', 'good');
    }

    function cleanupStream() {
      if (state.stream) {
        state.stream.getTracks().forEach((t) => t.stop());
        state.stream = null;
      }
      if (state.audioCtx) {
        try { state.audioCtx.close(); } catch (_) {}
        state.audioCtx = null;
        state.analyser = null;
      }
    }

    // ---- Download transcript ----
    function downloadTranscript() {
      if (state.segments.length === 0) return;
      const ordered = [...state.segments].reverse(); // oldest first
      const lines = ordered.map((s) => `[${s.ts}] (#${s.seq}, ${s.dtMs}ms) ${s.text}`);
      const body = lines.join('\n\n') + '\n';
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      a.href = url;
      a.download = `whisper-live-${stamp}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('已下載逐字稿', 'good');
    }

    function clearAll() {
      if (state.recording) {
        toast('請先停止錄音', 'warn');
        return;
      }
      state.segments = [];
      segList.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.id = 'emptyState';
      empty.textContent = '還沒有任何轉錄。開始錄音後,第一段會在切片結束時出現。';
      segList.appendChild(empty);
      segCountEl.textContent = '0';
      charCountEl.textContent = '0';
      updateExportable();
    }

    // ---- Wire up events ----
    btnStart.addEventListener('click', startRecording);
    btnStop.addEventListener('click', stopRecording);
    btnDl.addEventListener('click', downloadTranscript);
    btnClear.addEventListener('click', clearAll);
    toggleKeyEl.addEventListener('click', () => {
      apiKeyEl.type = apiKeyEl.type === 'password' ? 'text' : 'password';
    });
    intervalEl.addEventListener('change', () => {
      intLabel.textContent = intervalEl.value;
    });

    // Sanity warnings
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      toast('此瀏覽器不支援麥克風,將無法錄音', 'bad');
      setStatus('瀏覽器不支援', 'bad');
    } else if (!window.MediaRecorder) {
      toast('此瀏覽器不支援 MediaRecorder', 'bad');
      setStatus('瀏覽器不支援', 'bad');
    }

    // Expose tiny API for self-test hooks (optional, no UI impact)
    window.__whisperLive = {
      state,
      startRecording,
      stopRecording,
      downloadTranscript,
      clearAll,
    };
  </script>
</body>
</html>
