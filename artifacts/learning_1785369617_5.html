<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cross-Browser Data Extraction — Demo UI</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a1f29;
    --border: #2a3142;
    --text: #e6e6e6;
    --muted: #8b94a7;
    --accent: #4a90e2;
    --ok: #4ade80;
    --err: #f87171;
    --code-bg: #0a0d12;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px;
    line-height: 1.55;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 28px; }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 14px; }

  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    margin-bottom: 24px;
  }
  .controls input {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .controls input:focus { outline: none; border-color: var(--accent); }
  .controls button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px 24px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s;
  }
  .controls button:hover { background: #357abd; }
  .controls button:disabled { background: #555; cursor: not-allowed; }

  .toggles {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .toggle.active { background: rgba(74, 144, 226, 0.15); border-color: var(--accent); color: var(--accent); }

  .results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 16px;
  }
  .browser-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .browser-header {
    padding: 14px 18px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .browser-name { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status-dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .browser-meta { font-size: 12px; color: var(--muted); }
  .browser-body { padding: 14px 18px; max-height: 500px; overflow-y: auto; }
  .extractor-block { margin-bottom: 14px; }
  .extractor-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .extractor-count {
    background: rgba(74, 144, 226, 0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-left: 8px;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin: 0;
    overflow-x: auto;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    line-height: 1.5;
  }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .error-message {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: var(--err);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-family: ui-monospace, monospace;
    white-space: pre-wrap;
  }

  .screenshot-strip {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .screenshot-strip img {
    max-width: 200px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  summary { cursor: pointer; padding: 4px 0; user-select: none; }
  summary:hover { color: var(--accent); }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌐 Cross-Browser <span>Data Extraction</span></h1>
    <p class="subtitle">Live demo UI for <code>cross_browser_extract.mjs</code> — extracts JSON-LD, microdata, tables, and OpenGraph metadata across Chromium / Firefox / WebKit.</p>
  </header>

  <div class="controls">
    <input id="url" type="text" value="https://en.wikipedia.org/wiki/Playwright_(software)" placeholder="Enter URL to extract">
    <button id="runBtn">▶ Run Extraction</button>
    <div class="toggles" id="browserToggles">
      <div class="toggle active" data-browser="chromium">● Chromium</div>
      <div class="toggle active" data-browser="firefox">● Firefox</div>
      <div class="toggle active" data-browser="webkit">● WebKit</div>
    </div>
    <div class="toggles" id="extractorToggles">
      <div class="toggle active" data-extractor="jsonld">JSON-LD</div>
      <div class="toggle active" data-extractor="og">OpenGraph</div>
      <div class="toggle active" data-extractor="table">Tables</div>
      <div class="toggle active" data-extractor="microdata">Microdata</div>
    </div>
  </div>

  <div id="results" class="results">
    <div class="empty">點 ▶ Run Extraction 開始提取，或查看下方預載入的範例結果。</div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const resultsEl = $('results');
const toastEl = $('toast');

function showToast(msg, ms = 2200) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), ms);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
}

function renderExtractorData(name, data) {
  if (!data) return `<div class="empty">no data</div>`;
  const count = data.count ?? Object.keys(data.meta || {}).length ?? (Array.isArray(data.items) ? data.items.length : 0);
  let body = '';
  if (name === 'jsonld' || name === 'table') {
    const items = data.items || [];
    body = `<pre>${escapeHtml(JSON.stringify(items, null, 2).slice(0, 6000))}</pre>`;
  } else if (name === 'og') {
    body = `<pre>${escapeHtml(JSON.stringify(data.meta || {}, null, 2))}</pre>`;
  } else if (name === 'microdata') {
    body = `<pre>${escapeHtml(JSON.stringify(data.items || [], null, 2).slice(0, 6000))}</pre>`;
  }
  return `<div class="extractor-block">
    <div class="extractor-label">${name}<span class="extractor-count">${count}</span></div>
    ${body}
  </div>`;
}

function renderResult(r) {
  const ico = r.success ? 'ok' : 'err';
  const title = r.metadata?.title || '—';
  const status = r.metadata?.status || 'err';
  const nav = r.metadata?.navDuration ? `${r.metadata.navDuration}ms` : '—';
  const extractors = ['jsonld', 'og', 'table', 'microdata'];
  const bodies = extractors.map((n) => r.data?.[n] ? renderExtractorData(n, r.data[n]) : '').join('');
  const errors = r.errors?.length
    ? `<div class="error-message">${escapeHtml(r.errors.join('\n'))}</div>`
    : '';
  const screenshot = r.screenshot
    ? `<div class="screenshot-strip"><img src="./extraction-output/${escapeHtml(r.screenshotRel || r.screenshot.split('/').pop())}" alt="${r.browser} screenshot"></div>`
    : '';
  return `<div class="browser-card">
    <div class="browser-header">
      <div class="browser-name"><span class="status-dot ${ico}"></span>${escapeHtml(r.browser)}</div>
      <div class="browser-meta">${status} · ${nav} · ${escapeHtml(title.slice(0, 40))}</div>
    </div>
    <div class="browser-body">
      ${errors}
      ${bodies}
      ${screenshot}
    </div>
  </div>`;
}

// ----- Demo data (loaded from extraction-output/report.json on analysis endpoint) -----
async function loadSampleData() {
  // Load the most recent extraction report from the local file via a fetch
  // (works when served with `python -m http.server` from the project dir)
  try {
    const resp = await fetch('./extraction-output/report.json');
    if (!resp.ok) throw new Error('no report.json');
    const data = await resp.json();
    resultsEl.innerHTML = data.results.map(renderResult).join('');
    showToast(`✓ Loaded ${data.results.length} browser results from last run`);
  } catch (e) {
    resultsEl.innerHTML = `<div class="empty">範例結果未就緒：${escapeHtml(e.message)}。<br>請先執行 <code>node cross_browser_extract.mjs &lt;url&gt;</code> 然後透過 HTTP server 載入此頁。</div>`;
  }
}

// ----- Live run (uses backend endpoint if available) -----
async function runLive() {
  const url = $('url').value.trim();
  if (!url) { showToast('⚠ Please enter a URL'); return; }
  const browsers = Array.from(document.querySelectorAll('#browserToggles .toggle.active')).map((el) => el.dataset.browser).join(',');
  const extractors = Array.from(document.querySelectorAll('#extractorToggles .toggle.active')).map((el) => el.dataset.extractor).join(',');
  $('runBtn').disabled = true;
  $('runBtn').textContent = '⏳ Running...';
  resultsEl.innerHTML = `<div class="empty">⏳ Running cross-browser extraction: ${escapeHtml(url)}<br>Browsers: ${browsers} · Extractors: ${extractors}</div>`;
  try {
    const resp = await fetch(`/api/extract?url=${encodeURIComponent(url)}&browsers=${browsers}&extractors=${extractors}`);
    if (!resp.ok) throw new Error('API not available');
    const data = await resp.json();
    resultsEl.innerHTML = data.results.map(renderResult).join('');
    showToast(`✓ Extracted in ${(data.durationMs / 1000).toFixed(1)}s`);
  } catch (e) {
    resultsEl.innerHTML = `<div class="error-message">live API not available: ${escapeHtml(e.message)}<br>請用 <code>python3 -m http.server 8000</code> 從此目錄啟動以載入。</div>`;
  } finally {
    $('runBtn').disabled = false;
    $('runBtn').textContent = '▶ Run Extraction';
  }
}

// ----- Toggle interactions -----
document.querySelectorAll('.toggle').forEach((el) => {
  el.addEventListener('click', () => el.classList.toggle('active'));
});
$('runBtn').addEventListener('click', runLive);
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') runLive(); });

// Initial load
loadSampleData();
</script>
</body>
</html>
