<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cross-Browser Visual Regression Demo</title>
<style>
  :root {
    --bg-grad-a: #667eea;
    --bg-grad-b: #764ba2;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.30);
    --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --text: #1f2937;
    --muted: #6b7280;
    --success: #10b981;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-grad-a) 0%, var(--bg-grad-b) 100%);
    background-attachment: fixed;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 8px 0;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.20);
  }
  .subtitle {
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    margin: 0 0 24px 0;
  }
  /* Glassmorphism card with @supports fallback */
  .glass-card {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--glass-shadow);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  @supports not (backdrop-filter: blur(8px)) {
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
  }
  .glass-card h2 {
    margin: 0 0 12px 0;
    font-size: 18px;
    color: var(--text);
  }
  .counter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: var(--accent);
    color: #ffffff;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button.secondary {
    background: rgba(79, 70, 229, 0.12);
    color: var(--accent);
  }
  button.secondary:hover {
    background: rgba(79, 70, 229, 0.20);
  }
  .count-display {
    font-size: 32px;
    font-weight: 700;
    min-width: 64px;
    text-align: center;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .status {
    margin-top: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    background: rgba(16, 185, 129, 0.12);
    color: var(--success);
    display: inline-block;
  }
  .status[data-state="failed"] {
    background: rgba(239, 68, 68, 0.12);
    color: var(--danger);
  }
  .status[data-state="ready"] {
    background: rgba(107, 114, 128, 0.12);
    color: var(--muted);
  }
  /* Server-fetched list */
  .data-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .data-list li {
    padding: 8px 12px;
    margin: 4px 0;
    background: rgba(255, 255, 255, 0.65);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text);
  }
  .empty-state {
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }
  footer {
    color: rgba(255, 255, 255, 0.75);
    font-size: 12px;
    text-align: center;
    margin-top: 24px;
  }
  /* hide feature for visual stability of baselines */
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>跨瀏覽器視覺回歸測試 Demo <span class="badge" data-testid="env-badge">DEMO</span></h1>
    <p class="subtitle">Playwright × Chromium / Firefox / WebKit × Visual Regression</p>

    <!-- Counter card -->
    <section class="glass-card" data-testid="counter-card">
      <h2>互動計數器</h2>
      <div class="counter-row">
        <button data-testid="increment-btn" type="button">+1</button>
        <button data-testid="decrement-btn" class="secondary" type="button">-1</button>
        <div class="count-display" data-testid="count-display">0</div>
        <button data-testid="reset-btn" class="secondary" type="button">重置</button>
      </div>
      <div class="status" data-testid="counter-status" data-state="passed">Count: 0</div>
    </section>

    <!-- Data fetching card -->
    <section class="glass-card" data-testid="data-card">
      <h2>載入遠端資料</h2>
      <p class="empty-state" data-testid="data-empty">尚未載入資料。</p>
      <ul class="data-list" data-testid="data-list" hidden></ul>
      <div style="margin-top: 12px;">
        <button data-testid="load-data-btn" type="button">載入</button>
        <button data-testid="clear-data-btn" class="secondary" type="button">清空</button>
      </div>
      <div class="status" data-testid="data-status" data-state="ready" style="margin-top: 12px;">Idle — click 載入 to fetch /api/items.json</div>
    </section>

    <footer>
      <span data-testid="user-agent"></span>
    </footer>
  </div>

<script>
  // ---------- Counter ----------
  (function counterModule() {
    const display = document.querySelector('[data-testid="count-display"]');
    const status  = document.querySelector('[data-testid="counter-status"]');
    const inc     = document.querySelector('[data-testid="increment-btn"]');
    const dec     = document.querySelector('[data-testid="decrement-btn"]');
    const reset   = document.querySelector('[data-testid="reset-btn"]');

    function set(n) {
      display.textContent = String(n);
      status.textContent  = `Count: ${n}`;
      status.dataset.state = 'passed';
    }
    let count = 0;
    set(count);
    inc.addEventListener('click',   () => set(++count));
    dec.addEventListener('click',   () => set(--count));
    reset.addEventListener('click', () => { count = 0; set(count); status.textContent = 'Reset'; status.dataset.state = 'ready'; });
  })();

  // ---------- Data loading (fetch) ----------
  (function dataModule() {
    const empty  = document.querySelector('[data-testid="data-empty"]');
    const list   = document.querySelector('[data-testid="data-list"]');
    const load   = document.querySelector('[data-testid="load-data-btn"]');
    const clear  = document.querySelector('[data-testid="clear-data-btn"]');
    const status = document.querySelector('[data-testid="data-status"]');

    async function loadData() {
      status.textContent = 'Loading...';
      status.dataset.state = 'ready';
      try {
        // Note: this fails in offline test runs; interceptor will mock it.
        const res = await fetch('/api/items.json');
        const data = await res.json();
        list.innerHTML = '';
        data.items.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item.name;
          li.dataset.id = item.id;
          list.appendChild(li);
        });
        list.hidden = false;
        empty.hidden = true;
        status.textContent = `Loaded ${data.items.length} items`;
        status.dataset.state = 'passed';
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.dataset.state = 'failed';
      }
    }
    load.addEventListener('click', loadData);
    clear.addEventListener('click', () => {
      list.innerHTML = '';
      list.hidden = true;
      empty.hidden = false;
      status.textContent = 'Cleared';
      status.dataset.state = 'ready';
    });
  })();

  // ---------- User agent label (read-only, not asserted) ----------
  document.querySelector('[data-testid="user-agent"]').textContent =
    `Browser: ${navigator.userAgent.split(' ').pop()}`;
</script>
</body>
</html>
