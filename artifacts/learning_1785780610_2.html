<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Calendar Sync · RBAC 儀表板</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a23;
    --panel-2: #1d222e;
    --border: #2a3040;
    --text: #e7ebf3;
    --muted: #8a93a6;
    --accent: #6aa7ff;
    --accent-2: #8b5cf6;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --admin: #f59e0b;
    --manager: #8b5cf6;
    --editor: #6aa7ff;
    --viewer: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 20px 28px;
    background: linear-gradient(135deg, #161a23 0%, #1d222e 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header h1 small {
    color: var(--muted);
    font-weight: 400;
    margin-left: 8px;
    font-size: 13px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .status-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status-pill.online .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .status-pill.err .dot { background: var(--err); }

  main {
    max-width: 1240px;
    margin: 24px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .card h2 .badge {
    margin-left: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0;
  }

  /* Login */
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button {
    cursor: pointer;
    background: var(--accent);
    color: #0a1426;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 600;
    font-size: 13px;
    font-family: inherit;
    transition: filter 0.15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.danger { background: var(--err); color: #1a0808; }
  button.tiny { padding: 4px 10px; font-size: 12px; }

  .demo-users {
    margin-top: 14px;
    display: grid;
    gap: 6px;
  }
  .demo-user {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .demo-user:hover { border-color: var(--accent); }
  .demo-user .role {
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.05em;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .role.admin { background: var(--admin); color: #2a1a00; }
  .role.manager { background: var(--manager); color: #1f0a3e; }
  .role.editor { background: var(--editor); color: #0a1426; }
  .role.viewer { background: var(--viewer); color: #062818; }

  /* User badge in header */
  .me {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--panel-2);
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .me .name { font-weight: 600; }
  .me .email { color: var(--muted); font-size: 11px; }

  /* Permissions matrix */
  .perm-grid {
    display: grid;
    grid-template-columns: 140px repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 12px;
    margin-top: 10px;
  }
  .perm-grid > div {
    background: var(--panel-2);
    padding: 6px 8px;
  }
  .perm-grid .head {
    background: var(--panel);
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 10px;
  }
  .perm-grid .own {
    background: rgba(106, 167, 255, 0.12);
    color: var(--accent);
    font-weight: 600;
  }
  .perm-grid .yes::before { content: "✓ "; color: var(--ok); }
  .perm-grid .no::before { content: "· "; color: var(--muted); }

  /* Events list */
  .event {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: start;
  }
  .event:hover { border-color: var(--accent); }
  .event h3 {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 600;
  }
  .event .meta {
    color: var(--muted);
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .event .actions {
    display: flex;
    gap: 6px;
    flex-direction: column;
  }
  .event .source-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .source-tag.memory { background: var(--panel); color: var(--muted); }
  .source-tag.google { background: rgba(106, 167, 255, 0.2); color: var(--accent); }
  .source-tag.synced { background: rgba(139, 92, 246, 0.2); color: var(--accent-2); }

  .empty {
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    max-width: 360px;
    z-index: 100;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
  .toast .title { font-weight: 600; margin-bottom: 2px; }
  .toast .body { color: var(--muted); font-size: 12px; }

  .disabled-block {
    opacity: 0.5;
    pointer-events: none;
  }
  .lock-note {
    color: var(--warn);
    font-size: 12px;
    margin-top: 6px;
  }
</style>
</head>
<body>
<header>
  <h1>
    📅 Hermes Calendar Sync
    <small>FastAPI + Google Calendar + RBAC</small>
  </h1>
  <div id="headerRight">
    <span class="status-pill" id="connStatus"><span class="dot"></span><span id="connText">未連線</span></span>
  </div>
</header>

<main>
  <div id="sidebar"></div>
  <div id="content"></div>
</main>

<div id="toasts"></div>

<script>
// ===== 設定 =====
const API_BASE = window.location.origin;  // 同一個 origin 即可
const PERMS_MATRIX = {
  admin:   ["events:read","events:create","events:update","events:delete","sync:run","users:list","settings:write"],
  manager: ["events:read","events:create","events:update","events:delete","sync:run","users:list"],
  editor:  ["events:read","events:create","events:update","sync:run"],
  viewer:  ["events:read"],
};
const ROLES = ["admin", "manager", "editor", "viewer"];
const DEMO = [
  { username: "alice", password: "admin123",   role: "admin",   email: "alice@example.com" },
  { username: "bob",   password: "manager123", role: "manager", email: "bob@example.com"   },
  { username: "carol", password: "editor123",  role: "editor",  email: "carol@example.com" },
  { username: "dave",  password: "viewer123",  role: "viewer",  email: "dave@example.com"  },
];

// ===== 狀態 =====
let state = {
  token: localStorage.getItem("hermes_token") || null,
  me: JSON.parse(localStorage.getItem("hermes_me") || "null"),
};

// ===== 工具 =====
function escape(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("zh-TW", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}
function nowIsoPlus(hours) {
  const d = new Date(Date.now() + hours * 3600 * 1000);
  return d.toISOString().slice(0, 16);
}
function toast(title, body, kind = "") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.innerHTML = `<div class="title">${escape(title)}</div><div class="body">${escape(body)}</div>`;
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 4500);
}
async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (state.token) headers["Authorization"] = `Bearer ${state.token}`;
  const r = await fetch(API_BASE + path, { ...opts, headers });
  if (r.status === 204) return null;
  const txt = await r.text();
  let body = txt;
  try { body = JSON.parse(txt); } catch {}
  if (!r.ok) {
    const detail = (body && body.detail) || `HTTP ${r.status}`;
    const err = new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
    err.status = r.status;
    err.body = body;
    throw err;
  }
  return body;
}

// ===== 渲染 =====
function setStatus(online, msg) {
  const el = document.getElementById("connStatus");
  el.classList.toggle("online", !!online);
  el.classList.toggle("err", online === false);
  document.getElementById("connText").textContent = msg;
}

function renderHeaderRight() {
  const el = document.getElementById("headerRight");
  if (!state.me) {
    el.innerHTML = `<span class="status-pill" id="connStatus"><span class="dot"></span><span id="connText">未連線</span></span>`;
    setStatus(false, "未登入");
    return;
  }
  el.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="me">
        <span class="role ${state.me.role}">${state.me.role}</span>
        <div>
          <div class="name">${escape(state.me.username)}</div>
          <div class="email">${escape(state.me.email)}</div>
        </div>
      </div>
      <button class="secondary tiny" id="logoutBtn">登出</button>
    </div>
    <span class="status-pill online" id="connStatus"><span class="dot"></span><span id="connText">已連線</span></span>
  `;
  document.getElementById("logoutBtn").onclick = () => {
    state.token = null;
    state.me = null;
    localStorage.removeItem("hermes_token");
    localStorage.removeItem("hermes_me");
    toast("已登出", "");
    render();
  };
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  if (!state.me) {
    sb.innerHTML = `
      <div class="card">
        <h2>登入</h2>
        <div class="field">
          <label>Username</label>
          <input id="loginUser" placeholder="alice" />
        </div>
        <div class="field">
          <label>Password</label>
          <input id="loginPass" type="password" />
        </div>
        <button id="loginBtn" style="width:100%;">登入</button>
        <div id="loginErr" class="lock-note" style="display:none;"></div>
        <h2 style="margin-top:20px;">Demo 帳號</h2>
        <div class="demo-users" id="demoList"></div>
      </div>
    `;
    document.getElementById("loginBtn").onclick = doLogin;
    document.getElementById("loginPass").onkeydown = (e) => { if (e.key === "Enter") doLogin(); };
    const dl = document.getElementById("demoList");
    DEMO.forEach(u => {
      const div = document.createElement("div");
      div.className = "demo-user";
      div.innerHTML = `
        <div>
          <div style="font-weight:600;">${escape(u.username)}</div>
          <div style="color:var(--muted);font-size:11px;">${escape(u.email)}</div>
        </div>
        <span class="role ${u.role}">${u.role}</span>
      `;
      div.onclick = () => {
        document.getElementById("loginUser").value = u.username;
        document.getElementById("loginPass").value = u.password;
        doLogin();
      };
      dl.appendChild(div);
    });
    return;
  }
  sb.innerHTML = `
    <div class="card">
      <h2>RBAC 權限矩陣 <span class="badge">${state.me.role}</span></h2>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">
        ✓ = 擁有 · 目前角色
      </div>
      <div class="perm-grid">
        <div class="head">權限</div>
        ${ROLES.map(r => `<div class="head ${r === state.me.role ? 'own' : ''}">${r}</div>`).join("")}
        ${allPerms().map(perm => `
          <div>${escape(perm)}</div>
          ${ROLES.map(r => `
            <div class="${PERMS_MATRIX[r].includes(perm) ? 'yes' : 'no'} ${r === state.me.role ? 'own' : ''}">
              ${PERMS_MATRIX[r].includes(perm) ? '擁有' : ''}
            </div>
          `).join("")}
        `).join("")}
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <h2>使用者清單 <span class="badge" id="userCount"></span></h2>
      <div id="userList" style="font-size:13px;">(需要 users:list 權限)</div>
    </div>
  `;
  if (hasPerm("users:list")) loadUsers();
}

function allPerms() {
  const s = new Set();
  Object.values(PERMS_MATRIX).forEach(arr => arr.forEach(p => s.add(p)));
  return Array.from(s).sort();
}

function hasPerm(p) {
  return state.me && PERMS_MATRIX[state.me.role].includes(p);
}

function renderContent() {
  const c = document.getElementById("content");
  if (!state.me) {
    c.innerHTML = `
      <div class="card">
        <h2>歡迎</h2>
        <p style="color:var(--muted);">請從左側選擇一個 Demo 帳號登入,或輸入自己的帳密。</p>
        <p style="color:var(--muted);font-size:13px;">
          系統提供四種角色:<br>
          <strong style="color:var(--admin)">admin</strong> — 全部權限<br>
          <strong style="color:var(--manager)">manager</strong> — 事件 CRUD + sync + 列出使用者<br>
          <strong style="color:var(--editor)">editor</strong> — 事件 CRUD (無 delete) + sync<br>
          <strong style="color:var(--viewer)">viewer</strong> — 唯讀
        </p>
      </div>
    `;
    return;
  }
  c.innerHTML = `
    <div class="card">
      <h2>事件管理</h2>
      <div class="toolbar">
        <button id="syncBtn" ${hasPerm("sync:run") ? "" : "disabled"}>🔄 同步 Google Calendar</button>
        <button id="refreshBtn" class="secondary">⟳ 重新整理</button>
        <span style="color:var(--muted);font-size:12px;margin-left:auto;">
          Provider: <span id="providerName">—</span>
        </span>
      </div>
      ${hasPerm("events:create") ? `
        <div class="card" style="background:var(--panel-2);margin-bottom:14px;">
          <h2 style="font-size:12px;">➕ 新增事件</h2>
          <div class="row">
            <div class="field">
              <label>標題 *</label>
              <input id="evSummary" placeholder="週會" />
            </div>
            <div class="field">
              <label>地點</label>
              <input id="evLocation" placeholder="會議室 A" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>開始 *</label>
              <input id="evStart" type="datetime-local" value="${nowIsoPlus(1)}" />
            </div>
            <div class="field">
              <label>結束 *</label>
              <input id="evEnd" type="datetime-local" value="${nowIsoPlus(2)}" />
            </div>
          </div>
          <div class="field">
            <label>描述</label>
            <textarea id="evDesc" placeholder="議程..."></textarea>
          </div>
          <div class="field">
            <label>參與者 (email, 逗號分隔)</label>
            <input id="evAttendees" placeholder="bob@example.com" />
          </div>
          <button id="createBtn">建立事件</button>
        </div>
      ` : `<div class="lock-note">⚠️ viewer 角色無法新增事件</div>`}
      <div id="eventsList"></div>
    </div>
  `;
  if (hasPerm("events:create")) {
    document.getElementById("createBtn").onclick = createEvent;
  }
  document.getElementById("refreshBtn").onclick = loadEvents;
  if (hasPerm("sync:run")) {
    document.getElementById("syncBtn").onclick = doSync;
  }
  loadEvents();
  loadHealth();
}

// ===== 動作 =====
async function doLogin() {
  const username = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const errEl = document.getElementById("loginErr");
  errEl.style.display = "none";
  try {
    const r = await api("/auth/login", {
      method: "POST",
      body: JSON.stringify({ username, password }),
    });
    state.token = r.access_token;
    const me = await api("/auth/me");
    state.me = me;
    localStorage.setItem("hermes_token", r.access_token);
    localStorage.setItem("hermes_me", JSON.stringify(me));
    toast("登入成功", `${me.username} (${me.role})`, "ok");
    setStatus(true, "已連線");
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = "block";
    setStatus(false, "登入失敗");
  }
}

async function loadEvents() {
  const list = document.getElementById("eventsList");
  list.innerHTML = '<div class="empty">載入中…</div>';
  try {
    const events = await api("/events?days=30");
    if (!events.length) {
      list.innerHTML = '<div class="empty">目前沒有事件。</div>';
      return;
    }
    list.innerHTML = "";
    events.forEach(ev => {
      const div = document.createElement("div");
      div.className = "event";
      div.innerHTML = `
        <div>
          <h3>${escape(ev.summary)}</h3>
          <div class="meta">
            <span>🕒 ${fmtDate(ev.start)} → ${fmtDate(ev.end)}</span>
            ${ev.location ? `<span>📍 ${escape(ev.location)}</span>` : ""}
            ${ev.attendees && ev.attendees.length ? `<span>👥 ${ev.attendees.length} 位參與者</span>` : ""}
            <span class="source-tag ${ev.source}">${ev.source}</span>
            <span style="color:var(--muted);">by ${escape(ev.created_by)}</span>
          </div>
          ${ev.description ? `<div style="margin-top:6px;color:var(--muted);font-size:12px;">${escape(ev.description)}</div>` : ""}
        </div>
        <div class="actions">
          ${hasPerm("events:update") ? `<button class="secondary tiny" data-act="edit" data-id="${escape(ev.id)}">編輯</button>` : ""}
          ${hasPerm("events:delete") ? `<button class="danger tiny" data-act="del" data-id="${escape(ev.id)}">刪除</button>` : ""}
        </div>
      `;
      list.appendChild(div);
    });
    list.querySelectorAll("button[data-act]").forEach(btn => {
      const id = btn.dataset.id;
      if (btn.dataset.act === "del") btn.onclick = () => deleteEvent(id);
      if (btn.dataset.act === "edit") btn.onclick = () => editEvent(id);
    });
  } catch (e) {
    list.innerHTML = `<div class="empty" style="color:var(--err);">載入失敗:${escape(e.message)}</div>`;
  }
}

async function createEvent() {
  const summary = document.getElementById("evSummary").value.trim();
  if (!summary) { toast("錯誤", "請輸入標題", "err"); return; }
  const start = document.getElementById("evStart").value;
  const end = document.getElementById("evEnd").value;
  if (!start || !end) { toast("錯誤", "請輸入時間", "err"); return; }
  const attendees = document.getElementById("evAttendees").value
    .split(",").map(s => s.trim()).filter(Boolean);
  try {
    const ev = await api("/events", {
      method: "POST",
      body: JSON.stringify({
        summary,
        location: document.getElementById("evLocation").value.trim() || null,
        start: new Date(start).toISOString(),
        end: new Date(end).toISOString(),
        description: document.getElementById("evDesc").value.trim() || null,
        attendees,
        timezone: "Asia/Taipei",
        visibility: "default",
      }),
    });
    toast("建立成功", ev.summary, "ok");
    document.getElementById("evSummary").value = "";
    document.getElementById("evLocation").value = "";
    document.getElementById("evDesc").value = "";
    document.getElementById("evAttendees").value = "";
    loadEvents();
  } catch (e) {
    toast("建立失敗", e.message, "err");
  }
}

async function editEvent(id) {
  const newSummary = prompt("新標題?");
  if (!newSummary) return;
  try {
    await api(`/events/${id}`, {
      method: "PATCH",
      body: JSON.stringify({ summary: newSummary }),
    });
    toast("更新成功", newSummary, "ok");
    loadEvents();
  } catch (e) {
    toast("更新失敗", e.message, "err");
  }
}

async function deleteEvent(id) {
  if (!confirm("確定刪除?")) return;
  try {
    await api(`/events/${id}`, { method: "DELETE" });
    toast("已刪除", id, "ok");
    loadEvents();
  } catch (e) {
    toast("刪除失敗", e.message, "err");
  }
}

async function doSync() {
  try {
    const r = await api("/sync?days=30", { method: "POST" });
    toast(
      "同步完成",
      `pulled=${r.pulled} errors=${r.errors.length}`,
      r.errors.length ? "err" : "ok"
    );
    loadEvents();
  } catch (e) {
    toast("同步失敗", e.message, "err");
  }
}

async function loadHealth() {
  try {
    const h = await api("/health");
    document.getElementById("providerName").textContent = h.provider;
  } catch {}
}

async function loadUsers() {
  const el = document.getElementById("userList");
  if (!el) return;
  try {
    const users = await api("/users");
    el.innerHTML = users.map(u => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
        <div>
          <div style="font-weight:600;">${escape(u.username)}</div>
          <div style="color:var(--muted);font-size:11px;">${escape(u.email)}</div>
        </div>
        <span class="role ${u.role}">${u.role}</span>
      </div>
    `).join("");
    document.getElementById("userCount").textContent = users.length;
  } catch (e) {
    el.innerHTML = `<div style="color:var(--err);font-size:12px;">${escape(e.message)}</div>`;
  }
}

function render() {
  renderHeaderRight();
  renderSidebar();
  renderContent();
}

// ===== 啟動 =====
window.addEventListener("DOMContentLoaded", async () => {
  render();
  // 若有 token,驗證一下
  if (state.token) {
    try {
      state.me = await api("/auth/me");
      localStorage.setItem("hermes_me", JSON.stringify(state.me));
      setStatus(true, "已連線");
      render();
    } catch {
      state.token = null;
      state.me = null;
      localStorage.removeItem("hermes_token");
      localStorage.removeItem("hermes_me");
      render();
    }
  }
});
</script>
</body>
</html>
