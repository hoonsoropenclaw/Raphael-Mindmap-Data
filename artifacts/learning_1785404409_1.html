// ① 浮動卡片：hover scale / tap 微縮
function FloatingCard({ children, delay = 0, className = '' }) {
  const reduce = useReducedMotion();
  return (
    <motion.div
      initial={reduce ? false : { opacity: 0, y: 24 }}
      whileInView={reduce ? undefined : { opacity: 1, y: 0 }}
      viewport={{ once: true, amount: 0.3 }}
      transition={{ duration: 0.6, delay, ease: [0.16, 1, 0.3, 1] }}
      whileHover={reduce ? undefined : { y: -6, scale: 1.02 }}
      whileTap={reduce ? undefined : { scale: 0.98 }}
      className={className}
    >
      {children}
    </motion.div>
  );
}

// ② Stagger 容器：讓子項目依序入場
function StaggerContainer({ children, className = '', stagger = 0.08 }) {
  const reduce = useReducedMotion();
  return (
    <motion.div
      className={className}
      initial="hidden"
      whileInView={reduce ? undefined : "show"}
      viewport={{ once: true, amount: 0.2 }}
      variants={{
        hidden: {},
        show: { transition: { staggerChildren: stagger, delayChildren: 0.1 } },
      }}
    >
      {children}
    </motion.div>
  );
}

// ⑥ Animated Counter：滾動到視區時從 0 計數到目標
function StatItem({ label, target, suffix = '' }) {
  const [value, setValue] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !started.current) {
          started.current = true;
          const dur = 1400;
          const t0 = performance.now();
          const step = (now) => {
            const p = Math.min(1, (now - t0) / dur);
            const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
            setValue(Math.round(target * eased));
            if (p < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        }
      });
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [target]);

  return (
    <div ref={ref} className="text-center">
      <div className="text-4xl font-extrabold tabular-nums tracking-tight text-brand-600 sm:text-5xl dark:text-brand-400">
        {value.toLocaleString()}{suffix}
      </div>
      <div className="mt-2 text-sm text-slate-500 dark:text-slate-400">{label}</div>
    </div>
  );
}

    { name: 'Yuki',    role: 'Tech Lead @ Helio',    quote: 'prefers-reduced-motion 的 fallback 寫得很乾淨，無障礙審查直接過。' },

  }, [reduce, items.length]);

  return (
    <section id="testimonials" className="py-20 md:py-28">
      <div className="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">

        <div className="relative mt-10 overflow-hidden">
          <AnimatePresence mode="wait">
            <motion.figure
              key={idx}
              initial={reduce ? false : { opacity: 0, x: 40 }}
              animate={{ opacity: 1, x: 0 }}
              exit={reduce ? undefined : { opacity: 0, x: -40 }}
              transition={{ duration: 0.5, ease: [0.16, 1, 0.3, 1] }}

    <section id="pricing" className="bg-slate-50 py-20 dark:bg-slate-950 md:py-28">
      <div className="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        <div className="text-center">
          <motion.h2
            initial={{ opacity: 0, y: 12 }}
            whileInView={{ opacity: 1, y: 0 }}
            viewport={{ once: true }}
            className="text-3xl font-bold sm:text-4xl"
          >透明的定價</motion.h2>

          <div className="mt-6 inline-flex rounded-full border border-slate-200 bg-white p-1 text-sm dark:border-slate-700 dark:bg-slate-900">
            <button
              onClick={() => setYearly(false)}
              className={`rounded-full px-4 py-1.5 font-medium transition-colors ${!yearly ? 'bg-brand-600 text-white' : 'text-slate-600 dark:text-slate-300'}`}
            >月繳</button>
            <button
              onClick={() => setYearly(true)}
              className={`rounded-full px-4 py-1.5 font-medium transition-colors ${yearly ? 'bg-brand-600 text-white' : 'text-slate-600 dark:text-slate-300'}`}
            >年繳 <span className={`ml-1 ${yearly ? 'text-white/80' : 'text-brand-500'}`}>省 20%</span></button>
          </div>
        </div>

        <StaggerContainer className="mt-12 grid grid-cols-1 gap-6 md:grid-cols-3">
          {plans.map((p) => {
            const price = yearly ? Math.round(p.monthly * 12 * 0.8 / 12) : p.monthly;
            return (
              <motion.div
                key={p.name}
                variants={itemFadeUp}
                whileHover={{ y: -8 }}
                className={`relative rounded-2xl border p-6 shadow-sm transition-shadow hover:shadow-2xl
                  ${p.highlight
                    ? 'border-brand-500/60 bg-gradient-to-br from-brand-50 to-white dark:from-brand-900/30 dark:to-slate-900'
                    : 'border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900'}`}
              >
                {p.highlight && (
                  <span className="absolute -top-3 left-6 rounded-full bg-brand-600 px-3 py-0.5 text-xs font-semibold text-white">熱門</span>
                )}
                <h3 className="text-xl font-semibold">{p.name}</h3>
                <p className="mt-1 text-sm text-slate-500 dark:text-slate-400">{p.desc}</p>
                <div className="my-6 flex items-end gap-1">
                  <span className="text-5xl font-extrabold tracking-tight">${price}</span>
                  <span className="mb-1 text-sm text-slate-500 dark:text-slate-400">/ 月</span>
                </div>
                <ul className="space-y-2 text-sm text-slate-700 dark:text-slate-200">
                  {p.features.map((ft) => (
                    <li key={ft} className="flex items-center gap-2">
                      <span className="text-brand-500">✓</span>{ft}
                    </li>
                  ))}
                </ul>
                <motion.button
                  onClick={() => onOpenModal({ plan: p.name, price })}
                  whileHover={{ scale: 1.03 }}
                  whileTap={{ scale: 0.96 }}
                  className={`mt-6 w-full rounded-xl px-4 py-2.5 text-sm font-semibold transition-colors
                    ${p.highlight
                      ? 'bg-brand-600 text-white hover:bg-brand-700'
                      : 'border border-slate-300 bg-white text-slate-800 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800'}`}
                >選擇 {p.name}</motion.button>
              </motion.div>
            );
          })}
        </StaggerContainer>
      </div>
    </section>
  );
}

// ⑨ Modal：portal 風格（背景模糊 + 縮放入場 + ESC 關閉）
function Modal({ open, payload, onClose }) {
  const reduce = useReducedMotion();
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [open, onClose]);

  return (
    <AnimatePresence>
      {open && (
        <motion.div
          className="fixed inset-0 z-[60] flex items-center justify-center p-4"
          initial={reduce ? { opacity: 1 } : { opacity: 0 }}
          animate={{ opacity: 1 }}
          exit={{ opacity: 0 }}
          transition={{ duration: 0.25 }}
        >
          <motion.div
            className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"
            onClick={onClose}
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
          />
          <motion.div
            role="dialog" aria-modal="true"
            className="relative z-10 w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900"
            initial={reduce ? { opacity: 1, scale: 1 } : { opacity: 0, scale: 0.92, y: 20 }}
            animate={{ opacity: 1, scale: 1, y: 0 }}
            exit={reduce ? { opacity: 0 } : { opacity: 0, scale: 0.92, y: 20 }}
            transition={{ duration: 0.35, ease: [0.16, 1, 0.3, 1] }}
          >
            <h3 className="text-xl font-semibold">
              確認訂閱 {payload?.plan}？
            </h3>
            <p className="mt-2 text-sm text-slate-600 dark:text-slate-300">
              每月將收取 <span className="font-semibold text-brand-600">${payload?.price}</span>，
              可隨時取消。我們不會寄送垃圾信。
            </p>
            <div className="mt-6 flex justify-end gap-2">
              <button
                onClick={onClose}
                className="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800"
              >取消</button>
              <motion.button
                onClick={onClose}
                whileHover={{ scale: 1.04 }}
                whileTap={{ scale: 0.96 }}
                className="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700"
              >確認訂閱</motion.button>
            </div>
          </motion.div>
        </motion.div>
      )}
    </AnimatePresence>
  );
}

/* =========================================================================
   App：把所有模組組起來、處理 theme 持久化
   ========================================================================= */
function App() {
  const [theme, setTheme] = useState(() => {
    if (typeof window === 'undefined') return 'light';
    const saved = localStorage.getItem('hermes-ui-theme');
    if (saved) return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  const [modalOpen, setModalOpen] = useState(false);
  const [modalPayload, setModalPayload] = useState(null);

  useEffect(() => {
    const root = document.documentElement;
    root.classList.toggle('dark', theme === 'dark');
    try { localStorage.setItem('hermes-ui-theme', theme); } catch {}
  }, [theme]);

  const openModal = (payload) => {
    setModalPayload(payload);
    setModalOpen(true);
  };

  return (
    <>
      <Navbar theme={theme} setTheme={setTheme} />
      <main>
        <Hero />
        <Features />
        <Stats />
        <Testimonials />
        <Pricing onOpenModal={openModal} />
      </main>
      <Footer />
      <Modal open={modalOpen} payload={modalPayload} onClose={() => setModalOpen(false)} />
    </>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
</script>
