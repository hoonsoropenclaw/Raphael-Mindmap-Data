  <script>
  /* ============================================================
     SchemaForge — Schema-driven dynamic form generator
     核心：JSON Schema → HTML form + 即時驗證
     ============================================================ */
  'use strict';

  // ---------- 範本定義（JSON Schema 子集） ----------
  const TEMPLATES = {
    contact: {
      title: '聯絡我們',
      fields: [
        { name: 'name', label: '姓名', type: 'text', required: true, minLength: 2, maxLength: 50, autocomplete: 'name', placeholder: '王小明' },
        { name: 'email', label: 'Email', type: 'email', required: true, autocomplete: 'email', placeholder: 'you@example.com' },
        { name: 'phone', label: '電話', type: 'tel', required: false, autocomplete: 'tel', placeholder: '0912-345-678' },
        { name: 'subject', label: '主旨', type: 'select', required: true, options: [
            { value: 'general', label: '一般詢問' },
            { value: 'support', label: '技術支援' },
            { value: 'business', label: '商務合作' }
        ]},
        { name: 'message', label: '訊息內容', type: 'textarea', required: true, minLength: 10, maxLength: 1000, rows: 5, placeholder: '請描述您的需求…' }
      ]
    },
    survey: {
      title: '滿意度問卷',
      fields: [
        { name: 'rating', label: '整體滿意度', type: 'radio', required: true, options: [
            { value: '5', label: '⭐⭐⭐⭐⭐ 非常滿意' },
            { value: '4', label: '⭐⭐⭐⭐ 滿意' },
            { value: '3', label: '⭐⭐⭐ 普通' },
            { value: '2', label: '⭐⭐ 不滿意' },
            { value: '1', label: '⭐ 非常不滿意' }
        ]},
        { name: 'features', label: '最常用的功能（可複選）', type: 'checkbox', required: false, options: [
            { value: 'docs', label: '文件系統' },
            { value: 'api', label: 'API 整合' },
            { value: 'cli', label: '命令列工具' },
            { value: 'web', label: 'Web UI' }
        ]},
        { name: 'feedback', label: '其他建議', type: 'textarea', required: false, maxLength: 500, rows: 4, placeholder: '想對我們說的話…' }
      ]
    },
    subscribe: {
      title: '電子報訂閱',
      fields: [
        { name: 'email', label: 'Email', type: 'email', required: true, autocomplete: 'email', placeholder: 'you@example.com' },
        { name: 'frequency', label: '寄送頻率', type: 'radio', required: true, defaultValue: 'weekly', options: [
            { value: 'daily', label: '每日' },
            { value: 'weekly', label: '每週' },
            { value: 'monthly', label: '每月' }
        ]},
        { name: 'topics', label: '想收到的主題（可複選）', type: 'checkbox', required: true, options: [
            { value: 'tech', label: '技術新知' },
            { value: 'product', label: '產品更新' },
            { value: 'community', label: '社群活動' }
        ]},
        { name: 'agree', label: '我同意接收電子報', type: 'checkbox', required: true, options: [{ value: 'yes', label: '同意' }] }
      ]
    }
  };

  // ---------- Schema 渲染器 ----------
  function renderForm(schema) {
    const container = document.getElementById('form-container');
    container.innerHTML = '';

    const form = document.createElement('form');
    form.noValidate = true;
    form.setAttribute('aria-label', schema.title);

    schema.fields.forEach(field => {
      const wrapper = document.createElement('div');
      wrapper.className = 'form-field';
      wrapper.dataset.field = field.name;

      // Label
      const label = document.createElement('label');
      label.htmlFor = `field-${field.name}`;
      label.textContent = field.label;
      if (field.required) {
        const req = document.createElement('span');
        req.className = 'required';
        req.setAttribute('aria-hidden', 'true');
        req.textContent = '*';
        label.appendChild(req);
      }
      wrapper.appendChild(label);

      // Input 依 type 分派
      const inputId = `field-${field.name}`;
      let inputEl;

      if (field.type === 'textarea') {
        inputEl = document.createElement('textarea');
        if (field.rows) inputEl.rows = field.rows;
      } else if (field.type === 'select') {
        inputEl = document.createElement('select');
        field.options.forEach(opt => {
          const o = document.createElement('option');
          o.value = opt.value;
          o.textContent = opt.label;
          inputEl.appendChild(o);
        });
      } else if (field.type === 'radio' || field.type === 'checkbox') {
        const group = document.createElement('div');
        group.className = field.type === 'radio' ? 'radio-group' : 'checkbox-group';
        group.setAttribute('role', field.type === 'radio' ? 'radiogroup' : 'group');
        field.options.forEach((opt, idx) => {
          const optLabel = document.createElement('label');
          const optInput = document.createElement('input');
          optInput.type = field.type;
          optInput.name = field.name;
          optInput.value = opt.value;
          optInput.id = `${inputId}-${idx}`;
          if (field.required) optInput.required = true;
          if (field.defaultValue && field.defaultValue === opt.value) optInput.checked = true;
          optLabel.appendChild(optInput);
          optLabel.appendChild(document.createTextNode(' ' + opt.label));
          group.appendChild(optLabel);
        });
        inputEl = group;
      } else {
        inputEl = document.createElement('input');
        inputEl.type = field.type;
        if (field.placeholder) inputEl.placeholder = field.placeholder;
        if (field.autocomplete) inputEl.autocomplete = field.autocomplete;
        if (field.minLength) inputEl.minLength = field.minLength;
        if (field.maxLength) inputEl.maxLength = field.maxLength;
      }

      if (inputEl.id !== undefined) inputEl.id = inputId;
      if (inputEl.name === undefined && field.type !== 'radio' && field.type !== 'checkbox') {
        inputEl.name = field.name;
      }
      if (field.required && (inputEl.required === undefined || !inputEl.required)) {
        inputEl.setAttribute('aria-required', 'true');
      }
      wrapper.appendChild(inputEl);

      // Help text
      if (field.help) {
        const help = document.createElement('div');
        help.className = 'help';
        help.textContent = field.help;
        wrapper.appendChild(help);
      }

      // Error message slot
      const err = document.createElement('div');
      err.className = 'error-msg';
      err.setAttribute('role', 'alert');
      err.id = `${inputId}-error`;
      wrapper.appendChild(err);

      form.appendChild(wrapper);
    });

    // Submit
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'submit-btn';
    submit.textContent = '提交表單';
    form.appendChild(submit);

    // Submit handler — 收集 + 驗證
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (validateForm(form, schema)) {
        const data = collectFormData(form, schema);
        showSuccess(schema, data);
      }
    });

    container.appendChild(form);
  }

  // ---------- 驗證 ----------
  function validateForm(form, schema) {
    let valid = true;
    schema.fields.forEach(field => {
      const wrapper = form.querySelector(`[data-field="${field.name}"]`);
      wrapper.classList.remove('has-error');
      const errEl = wrapper.querySelector('.error-msg');
      errEl.textContent = '';

      let value;
      if (field.type === 'radio') {
        const checked = form.querySelector(`input[name="${field.name}"]:checked`);
        value = checked ? checked.value : '';
      } else if (field.type === 'checkbox') {
        const checked = form.querySelectorAll(`input[name="${field.name}"]:checked`);
        value = Array.from(checked).map(c => c.value);
      } else {
        const input = wrapper.querySelector('input, select, textarea');
        value = input ? input.value.trim() : '';
      }

      if (field.required) {
        if (field.type === 'checkbox' && field.options.length > 1) {
          if (value.length === 0) { markError(wrapper, errEl, '至少選擇一項'); valid = false; return; }
        } else if (!value) {
          markError(wrapper, errEl, '此欄位為必填'); valid = false; return;
        }
      }
      if (value) {
        if (field.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          markError(wrapper, errEl, 'Email 格式不正確'); valid = false; return;
        }
        if (field.minLength && value.length < field.minLength) {
          markError(wrapper, errEl, `至少需 ${field.minLength} 個字元`); valid = false; return;
        }
        if (field.maxLength && value.length > field.maxLength) {
          markError(wrapper, errEl, `不可超過 ${field.maxLength} 個字元`); valid = false; return;
        }
      }
    });
    return valid;
  }

  function markError(wrapper, errEl, msg) {
    wrapper.classList.add('has-error');
    errEl.textContent = msg;
    const input = wrapper.querySelector('input, select, textarea');
    if (input) input.classList.add('invalid');
  }

  function collectFormData(form, schema) {
    const data = {};
    schema.fields.forEach(field => {
      if (field.type === 'radio') {
        const checked = form.querySelector(`input[name="${field.name}"]:checked`);
        data[field.name] = checked ? checked.value : null;
      } else if (field.type === 'checkbox') {
        const checked = form.querySelectorAll(`input[name="${field.name}"]:checked`);
        data[field.name] = Array.from(checked).map(c => c.value);
      } else {
        const input = form.querySelector(`[data-field="${field.name}"] input, [data-field="${field.name}"] select, [data-field="${field.name}"] textarea`);
        data[field.name] = input ? input.value : '';
      }
    });
    return data;
  }

  function showSuccess(schema, data) {
    const container = document.getElementById('form-container');
    container.innerHTML = `
      <div class="success-state" role="status">
        <h3>✅ 提交成功！</h3>
        <p>表單「${schema.title}」已通過驗證。以下是收集到的 JSON payload（可接後端 API）：</p>
        <pre>${JSON.stringify(data, null, 2)}</pre>
        <button class="submit-btn" style="margin-top: 1rem;" onclick="resetForm()">重新填寫</button>
      </div>
    `;
  }

  function resetForm() {
    renderForm(currentSchema);
  }

  // ---------- Schema Viewer 同步 ----------
  function renderSchemaViewer(schema) {
    const viewer = document.getElementById('schema-viewer');
    viewer.textContent = JSON.stringify(schema, null, 2);
  }

  // ---------- SEO 即時檢查 ----------
  function runSEOAudit() {
    const checks = [];
    const title = document.title;
    const desc = document.querySelector('meta[name="description"]')?.content || '';
    const canonical = document.querySelector('link[rel="canonical"]')?.href || '';
    const ogImage = document.querySelector('meta[property="og:image"]')?.content || '';
    const jsonLd = document.querySelector('script[type="application/ld+json"]')?.textContent || '';

    checks.push({ status: title.length >= 30 && title.length <= 60 ? 'pass' : 'warn',
      icon: title.length >= 30 && title.length <= 60 ? '✅' : '⚠️',
      msg: `<strong>Title 標籤</strong>: ${title.length} 字元 ${title.length >= 30 && title.length <= 60 ? '(最佳長度 30-60)' : '(過短或過長)'}` });
    checks.push({ status: desc.length >= 120 && desc.length <= 160 ? 'pass' : 'warn',
      icon: desc.length >= 120 && desc.length <= 160 ? '✅' : '⚠️',
      msg: `<strong>Meta description</strong>: ${desc.length} 字元 ${desc.length >= 120 && desc.length <= 160 ? '(最佳長度 120-160)' : '(可優化)'}` });
    checks.push({ status: canonical ? 'pass' : 'warn', icon: canonical ? '✅' : '⚠️',
      msg: `<strong>Canonical URL</strong>: ${canonical || '未設定'}` });
    checks.push({ status: ogImage ? 'pass' : 'warn', icon: ogImage ? '✅' : '⚠️',
      msg: `<strong>Open Graph image</strong>: ${ogImage ? '已設定' : '未設定'}` });
    checks.push({ status: jsonLd ? 'pass' : 'fail', icon: jsonLd ? '✅' : '❌',
      msg: `<strong>JSON-LD 結構化資料</strong>: ${jsonLd ? '已嵌入 Schema.org WebApplication' : '未設定（嚴重 SEO 缺失）'}` });

    const ogTitle = document.querySelector('meta[property="og:title"]')?.content;
    const twitterCard = document.querySelector('meta[name="twitter:card"]')?.content;
    checks.push({ status: ogTitle ? 'pass' : 'warn', icon: ogTitle ? '✅' : '⚠️',
      msg: `<strong>Open Graph title</strong>: ${ogTitle ? '已設定' : '未設定'}` });
    checks.push({ status: twitterCard ? 'pass' : 'warn', icon: twitterCard ? '✅' : '⚠️',
      msg: `<strong>Twitter Card</strong>: ${twitterCard || '未設定'}` });

    const container = document.getElementById('seo-checks');
    container.innerHTML = checks.map(c =>
      `<div class="seo-check ${c.status === 'warn' ? 'warn' : c.status === 'fail' ? 'fail' : ''}" role="listitem">
         <span class="icon" aria-hidden="true">${c.icon}</span>
         <span>${c.msg}</span>
       </div>`
    ).join('');
  }

  // ---------- 範本切換 ----------
  let currentSchema = TEMPLATES.contact;
  document.querySelectorAll('.template-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.template-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      const tpl = btn.dataset.template;
      currentSchema = TEMPLATES[tpl];
      renderForm(currentSchema);
      renderSchemaViewer(currentSchema);
    });
  });

  // ---------- 初始化 ----------
  renderForm(currentSchema);
  renderSchemaViewer(currentSchema);
  runSEOAudit();
  </script>
</body>
</html>
