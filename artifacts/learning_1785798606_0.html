<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross-Browser Visual Regression Demo</title>
  <style>
    /* 簡化樣式，著重一致渲染（不用花俏字型、不用 backdrop-filter，跨瀏覽器表現穩） */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2937;
      background: #f9fafb;
    }
    header {
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: white;
      padding: 32px 24px;
    }
    header h1 { margin: 0 0 4px; font-size: 24px; }
    header p { margin: 0; opacity: 0.92; }
    main { max-width: 1024px; margin: 0 auto; padding: 24px; }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card h2 { margin: 0 0 12px; font-size: 18px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.passed { background: #d1fae5; color: #065f46; }
    .badge.failed { background: #fee2e2; color: #991b1b; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    button {
      background: #4f46e5;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    button:focus-visible { outline: 2px solid #06b6d4; outline-offset: 2px; }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
    footer {
      text-align: center;
      padding: 24px;
      color: #6b7280;
      font-size: 13px;
    }
    .clock { font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; }
    /* 響應式：mobile 寬度自動 stack */
    @media (max-width: 600px) {
      header { padding: 20px 16px; }
      main { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Cross-Browser Visual Regression Demo</h1>
    <p>Playwright 跨瀏覽器自動化測試 + pixelmatch 視覺回歸</p>
  </header>

  <main>
    <section class="card" data-testid="card-status">
      <h2>1. Page Status</h2>
      <p>Test status: <span class="badge passed" data-testid="status-badge">all systems go</span></p>
      <p>Build: <code data-testid="build-id">v1.0.0</code></p>
      <!-- data-dynamic 會被凍結器隱藏，避免隨機時間干擾截圖 -->
      <p class="clock" data-dynamic>
        Current time: <span data-testid="clock">--</span>
      </p>
    </section>

    <section class="card" data-testid="card-form">
      <h2>2. Form Interaction</h2>
      <form data-testid="contact-form" novalidate>
        <div style="margin-bottom: 12px">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" data-testid="input-name" placeholder="Enter name" required>
        </div>
        <div style="margin-bottom: 12px">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" data-testid="input-email" placeholder="you@example.com" required>
        </div>
        <button type="submit" data-testid="submit-btn">Submit</button>
      </form>
      <p id="form-feedback" data-testid="form-feedback" hidden></p>
    </section>

    <section class="card" data-testid="card-grid">
      <h2>3. Responsive Grid</h2>
      <div class="grid">
        <div class="card" style="margin:0">Alpha</div>
        <div class="card" style="margin:0">Bravo</div>
        <div class="card" style="margin:0">Charlie</div>
        <div class="card" style="margin:0">Delta</div>
      </div>
    </section>
  </main>

  <footer>
    Rendered at <span class="clock" data-dynamic data-testid="render-time">--</span>
  </footer>

  <script>
    // === 動態內容：時鐘、隨機數（給凍結器抓的範例） ===
    (function init() {
      const clockEl = document.querySelector('[data-testid="clock"]');
      const renderEl = document.querySelector('[data-testid="render-time"]');
      function tick() {
        const now = new Date();
        const t = now.toISOString().replace('T', ' ').slice(0, 19);
        if (clockEl) clockEl.textContent = t + ' UTC';
        if (renderEl) renderEl.textContent = t + ' UTC';
      }
      tick();
      setInterval(tick, 1000);

      // === 表單互動（smoke test 會驗證） ===
      const form = document.querySelector('[data-testid="contact-form"]');
      const feedback = document.querySelector('[data-testid="form-feedback"]');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = /** @type {HTMLInputElement} */(document.getElementById('name')).value.trim();
          const email = /** @type {HTMLInputElement} */(document.getElementById('email')).value.trim();
          if (!name || !email) {
            feedback.textContent = 'Please fill all fields.';
            feedback.style.color = '#991b1b';
          } else {
            feedback.textContent = 'Submitted: ' + name + ' <' + email + '>';
            feedback.style.color = '#065f46';
          }
          feedback.hidden = false;
        });
      }
    })();
  </script>
</body>
</html>
