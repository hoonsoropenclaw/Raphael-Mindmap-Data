<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📅 Calendar Reminder</title>
<style>
:root {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-2: #334155;
  --border: #475569;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-hover: #0ea5e9;
  --good: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-2: #f1f5f9;
    --border: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  min-height: 100vh;
}
a { color: var(--accent); }
.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
header h1 { margin: 0; font-size: 26px; }
.subtitle { color: var(--text-muted); font-size: 13px; }
.subtitle code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); }
button {
  cursor: pointer;
  font: inherit;
  background: var(--accent);
  color: #0b1220;
  border: 0;
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: 600;
  transition: background .15s;
}
button:hover:not(:disabled) { background: var(--accent-hover); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.secondary {
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--border);
}
button.secondary:hover:not(:disabled) { background: var(--border); }
button.danger {
  background: var(--bad);
  color: #1a0606;
}
input, select, textarea {
  font: inherit;
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  border-radius: 6px;
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
}
.layout {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 24px;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 18px;
}
.panel h2 {
  margin: 0 0 12px;
  font-size: 17px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h2 .count {
  background: var(--panel-2);
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.toolbar input[type="search"] { flex: 1; min-width: 200px; }
.event-list { display: flex; flex-direction: column; gap: 8px; }
.event {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.event.selected { outline: 2px solid var(--accent); }
.event-main { flex: 1; min-width: 0; }
.event-title { font-weight: 600; font-size: 16px; }
.event-time { color: var(--text-muted); font-size: 13px; font-family: var(--mono); }
.event-loc { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.event-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.tag {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-family: var(--mono);
}
.tag.delivered { color: var(--good); border-color: var(--good); }
.tag.pending { color: var(--warn); border-color: var(--warn); }
.event-actions {
  display: flex;
  gap: 4px;
  flex-direction: column;
}
.event-actions button { padding: 4px 10px; font-size: 12px; }
.empty {
  color: var(--text-muted);
  text-align: center;
  padding: 24px;
}
.detail .field {
  display: block;
  margin-bottom: 10px;
}
.detail .field label {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 4px;
  font-weight: 600;
  letter-spacing: .02em;
}
.detail .field .value {
  background: var(--panel-2);
  border-radius: 6px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
}
.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.section-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin: 12px 0 6px;
  font-weight: 700;
}
.reminder-row {
  display: grid;
  grid-template-columns: 1fr 90px auto;
  gap: 6px;
  margin-bottom: 6px;
  align-items: center;
}
.reminder-row .del-btn {
  padding: 4px 8px;
  font-size: 12px;
  background: var(--bad);
  color: #1a0606;
}
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #0b1220;
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 99;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.error { background: var(--bad); color: #1a0606; }
.status-bar {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
  font-family: var(--mono);
}
.spacer { flex: 1; }
hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>📅 Calendar Reminder</h1>
      <div class="subtitle">Google Calendar API 自動化事件管理 + 多管道提醒</div>
    </div>
    <div class="subtitle" id="config-info">載入中…</div>
  </header>

  <div class="layout">
    <!-- 左側:列表 -->
    <div>
      <div class="panel">
        <div class="toolbar">
          <input type="search" id="q" placeholder="搜尋 summary / description / location">
          <button class="secondary" id="today-btn">今日</button>
          <button class="secondary" id="week-btn">本週</button>
          <button class="secondary" id="all-btn">全部</button>
          <button id="add-btn">+ 新增</button>
        </div>
        <h2>事件清單 <span class="count" id="event-count">0</span></h2>
        <div id="events" class="event-list"></div>
        <div class="status-bar" id="status"></div>
      </div>

      <div class="panel">
        <h2>提醒掃描 <span class="count">daemon</span></h2>
        <p class="subtitle">跑一次掃描會檢查 ±2 小時內的所有事件,觸發到期的 reminders。</p>
        <button id="remind-btn">▶ 立即掃描</button>
        <div class="status-bar" id="remind-status"></div>
      </div>
    </div>

    <!-- 右側:詳情 / 新增表單 -->
    <div>
      <div class="panel detail" id="detail-panel">
        <h2>詳細資訊</h2>
        <div id="detail-body">
          <div class="empty">從左側選一個事件,或在 toolbar 按「+ 新增」</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === 全域狀態 ===
const state = {
  events: [],
  selectedId: null,
  mode: 'view', // 'view' | 'add' | 'edit'
  filter: 'all', // 'all' | 'today' | 'week' | 'search'
  query: '',
  config: null,
};

// === API helper ===
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = `HTTP ${r.status}`;
    try { const j = await r.json(); msg = j.detail || msg; } catch {}
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}

// === Toast ===
let toastTimer;
function toast(msg, isErr = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// === 載入 config ===
async function loadConfig() {
  try {
    const c = await api('GET', '/api/config');
    state.config = c;
    document.getElementById('config-info').innerHTML =
      `backend: <code>${c.backend}</code> · tz: <code>${c.timezone}</code> · v${c.version}`;
  } catch (e) { toast(`config load failed: ${e.message}`, true); }
}

// === 載入 events ===
async function loadEvents() {
  const params = new URLSearchParams();
  if (state.filter === 'today') params.set('today', '1');
  if (state.filter === 'week') params.set('week', '1');
  if (state.filter === 'search' && state.query) params.set('q', state.query);
  try {
    const data = await api('GET', `/api/events?${params}`);
    state.events = data.events;
    render();
  } catch (e) {
    toast(`載入事件失敗: ${e.message}`, true);
    document.getElementById('status').textContent = `錯誤: ${e.message}`;
  }
}

// === 渲染事件清單 ===
function render() {
  const list = document.getElementById('events');
  document.getElementById('event-count').textContent = state.events.length;
  if (state.events.length === 0) {
    list.innerHTML = '<div class="empty">無事件</div>';
    document.getElementById('status').textContent = '';
    return;
  }
  document.getElementById('status').textContent = `上次更新: ${new Date().toLocaleTimeString('zh-TW')}`;
  list.innerHTML = '';
  for (const ev of state.events) {
    const remTag = ev.reminders.map(r =>
      `<span class="tag ${r.delivered ? 'delivered' : 'pending'}">${r.method}/${r.minutes_before}m</span>`
    ).join('');
    const recur = ev.recurrence ? `<span class="tag">↻ ${ev.recurrence.freq}</span>` : '';
    const el = document.createElement('div');
    el.className = 'event' + (state.selectedId === ev.id ? ' selected' : '');
    el.innerHTML = `
      <div class="event-main">
        <div class="event-title">${esc(ev.summary)}</div>
        <div class="event-time">${fmtTime(ev.start)} → ${fmtTime(ev.end)}</div>
        ${ev.location ? `<div class="event-loc">📍 ${esc(ev.location)}</div>` : ''}
        <div class="event-meta">${remTag}${recur}</div>
      </div>
      <div class="event-actions">
        <button class="secondary" data-act="edit" data-id="${ev.id}">編輯</button>
        <button class="secondary" data-act="remind" data-id="${ev.id}">提醒</button>
        <button class="danger" data-act="del" data-id="${ev.id}">刪除</button>
      </div>
    `;
    el.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      state.selectedId = ev.id;
      state.mode = 'view';
      render();
      renderDetail();
    });
    list.appendChild(el);
  }

  list.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      if (act === 'del') return deleteEvent(id);
      if (act === 'remind') return remindNow(id);
      if (act === 'edit') {
        state.selectedId = id;
        state.mode = 'edit';
        render();
        renderDetail();
      }
    });
  });
}

// === 渲染詳情 ===
function renderDetail() {
  const body = document.getElementById('detail-body');
  if (state.mode === 'add') {
    body.innerHTML = renderForm({});
    attachFormHandlers(null);
    return;
  }
  const ev = state.events.find(e => e.id === state.selectedId);
  if (!ev) {
    body.innerHTML = '<div class="empty">從左側選一個事件</div>';
    return;
  }
  if (state.mode === 'view') {
    body.innerHTML = `
      <div class="field"><label>標題</label><div class="value">${esc(ev.summary)}</div></div>
      <div class="row2">
        <div class="field"><label>開始</label><div class="value">${fmtTime(ev.start)}</div></div>
        <div class="field"><label>結束</label><div class="value">${fmtTime(ev.end)}</div></div>
      </div>
      ${ev.location ? `<div class="field"><label>地點</label><div class="value">${esc(ev.location)}</div></div>` : ''}
      ${ev.description ? `<div class="field"><label>說明</label><div class="value">${esc(ev.description)}</div></div>` : ''}
      <div class="field"><label>提醒</label><div class="value">${ev.reminders.map(r =>
        `${r.method} ${r.minutes_before} 分鐘前` + (r.delivered ? ` ✓ (${r.delivered_at})` : '')
      ).join('\n')}</div></div>
      ${ev.recurrence ? `<div class="field"><label>週期</label><div class="value">${ev.recurrence.freq} (interval=${ev.recurrence.interval}${ev.recurrence.count ? `, count=${ev.recurrence.count}` : ''})</div></div>` : ''}
    `;
    return;
  }
  if (state.mode === 'edit') {
    body.innerHTML = renderForm(ev);
    attachFormHandlers(ev);
  }
}

// === 表單 ===
function renderForm(ev) {
  const r = (ev.reminders && ev.reminders.length) ? ev.reminders : [{ method: 'log', minutes_before: 15 }];
  const remindersHtml = r.map((rem, i) => `
    <div class="reminder-row" data-i="${i}">
      <select name="rmethod">
        ${['log','popup','local','email','telegram'].map(m => `<option value="${m}" ${m===rem.method?'selected':''}>${m}</option>`).join('')}
      </select>
      <input type="number" name="rmin" value="${rem.minutes_before}" min="0" step="1">
      <button type="button" class="del-btn">×</button>
    </div>
  `).join('');
  return `
    <form id="ev-form">
      <div class="field"><label>標題</label><input name="summary" required value="${escAttr(ev.summary||'')}"></div>
      <div class="row2">
        <div class="field"><label>開始 (ISO8601 with TZ)</label><input name="start" required value="${ev.start||''}" placeholder="2026-08-15T14:00:00+08:00"></div>
        <div class="field"><label>結束</label><input name="end" value="${ev.end||''}" placeholder="2026-08-15T15:00:00+08:00"></div>
      </div>
      <div class="field"><label>地點</label><input name="location" value="${escAttr(ev.location||'')}"></div>
      <div class="field"><label>說明</label><textarea name="description" rows="3">${esc(ev.description||'')}</textarea></div>

      <div class="section-title">提醒 (Reminders)</div>
      <div id="reminders-list">${remindersHtml}</div>
      <button type="button" class="secondary" id="add-reminder">+ 加一條提醒</button>

      <div class="section-title">週期 (Recurrence,選填)</div>
      <div class="row2">
        <select name="rfreq">
          <option value="">不循環</option>
          ${['DAILY','WEEKLY','MONTHLY','YEARLY'].map(f => `<option ${ev.recurrence && ev.recurrence.freq===f?'selected':''} value="${f}">${f}</option>`).join('')}
        </select>
        <input name="rinterval" type="number" min="1" value="${ev.recurrence?.interval || 1}" placeholder="interval">
      </div>

      <hr>
      <button type="submit">${state.mode === 'edit' ? '儲存變更' : '建立事件'}</button>
      <button type="button" class="secondary" id="cancel-btn">取消</button>
    </form>
  `;
}

function attachFormHandlers(ev) {
  const form = document.getElementById('ev-form');
  document.getElementById('cancel-btn').onclick = () => {
    state.mode = 'view';
    renderDetail();
  };
  document.getElementById('add-reminder').onclick = () => {
    const list = document.getElementById('reminders-list');
    const i = list.children.length;
    const row = document.createElement('div');
    row.className = 'reminder-row';
    row.dataset.i = i;
    row.innerHTML = `
      <select name="rmethod">
        ${['log','popup','local','email','telegram'].map(m => `<option value="${m}">${m}</option>`).join('')}
      </select>
      <input type="number" name="rmin" value="15" min="0" step="1">
      <button type="button" class="del-btn">×</button>
    `;
    list.appendChild(row);
    bindReminderRow(row);
  };
  document.querySelectorAll('.reminder-row').forEach(bindReminderRow);

  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const reminders = [];
    document.querySelectorAll('.reminder-row').forEach(row => {
      reminders.push({
        method: row.querySelector('[name=rmethod]').value,
        minutes_before: parseInt(row.querySelector('[name=rmin]').value, 10) || 0,
      });
    });
    const payload = {
      summary: fd.get('summary'),
      start: fd.get('start'),
      end: fd.get('end') || null,
      location: fd.get('location') || '',
      description: fd.get('description') || '',
      reminders,
      recurrence: fd.get('rfreq') ? {
        freq: fd.get('rfreq'),
        interval: parseInt(fd.get('rinterval'), 10) || 1,
      } : null,
    };
    try {
      if (state.mode === 'edit') {
        await api('PATCH', `/api/events/${state.selectedId}`, payload);
        toast('已更新');
      } else {
        await api('POST', '/api/events', payload);
        toast('已建立');
      }
      state.mode = 'view';
      await loadEvents();
      renderDetail();
    } catch (err) { toast(err.message, true); }
  };
}

function bindReminderRow(row) {
  row.querySelector('.del-btn').onclick = () => row.remove();
}

// === Actions ===
async function deleteEvent(id) {
  if (!confirm('確定刪除此事件?')) return;
  try {
    await api('DELETE', `/api/events/${id}`);
    toast('已刪除');
    if (state.selectedId === id) state.selectedId = null;
    await loadEvents();
    renderDetail();
  } catch (e) { toast(e.message, true); }
}

async function remindNow(id) {
  try {
    const r = await api('POST', `/api/events/${id}/remind-now`);
    if (r.sent.length === 0) toast('無 reminder 送達', true);
    else toast(`已送達 ${r.sent.length} 提醒: ${r.sent.map(s => s.method).join(', ')}`);
  } catch (e) { toast(e.message, true); }
}

// === Toolbar ===
document.getElementById('q').addEventListener('input', (e) => {
  state.query = e.target.value;
  state.filter = state.query ? 'search' : 'all';
  loadEvents();
});
document.getElementById('all-btn').onclick = () => { state.filter = 'all'; loadEvents(); };
document.getElementById('today-btn').onclick = () => { state.filter = 'today'; loadEvents(); };
document.getElementById('week-btn').onclick = () => { state.filter = 'week'; loadEvents(); };
document.getElementById('add-btn').onclick = () => { state.mode = 'add'; state.selectedId = null; renderDetail(); };
document.getElementById('remind-btn').onclick = async () => {
  const sb = document.getElementById('remind-status');
  sb.textContent = '掃描中…';
  try {
    const r = await api('POST', '/api/reminder/run-once');
    sb.textContent = `${new Date().toLocaleTimeString('zh-TW')}: fired ${r.fired} reminder(s)`;
    toast(`fired ${r.fired} reminder(s)`);
    await loadEvents();
  } catch (e) { sb.textContent = `錯誤: ${e.message}`; toast(e.message, true); }
};

// === Utils ===
function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }
function escAttr(s) { return esc(s); }
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('zh-TW', { hour12: false });
}

// === Boot ===
(async () => {
  await loadConfig();
  await loadEvents();
})();

// === Periodic refresh (30s) ===
setInterval(() => { if (state.filter !== 'search') loadEvents(); }, 30000);
</script>
</body>
</html>
