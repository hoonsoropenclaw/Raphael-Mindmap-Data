 *
 *   /app
 *     /layout.jsx              ← RootLayout (含 SessionProvider)

 *     /(dashboard)/layout.jsx  ← 受保護佈局 (middleware 檢查)

 *     /(dashboard)/audit/page.jsx

 *   /lib/rbac.js               ← 純函式:can() / requirePermission()
 * ============================================================ */

/* ---------- 1) 權限定義 (對應真實 RBAC schema) ---------- */
const PERMISSIONS = {
  USER_READ:        'user:read',

/* ---------- 2) 角色矩陣 (真實後端會在 DB) ---------- */

/* ---------- 4) /lib/rbac.js — 純函式核心 ---------- */
const rbac = {
  // server-side 風格,接收 (session, permission) 回傳 boolean
  can(session, permission) {
    if (!session || !session.user) return false;
    const role = ROLES[session.user.role];
    if (!role) return false;
    return role.permissions.has(permission);
  },
  // 高階,丟 exception 給 server action / API route 用
  require(session, permission) {
    if (!this.can(session, permission)) {
      const err = new Error('FORBIDDEN');
      err.code = 403;
      err.required = permission;
      err.role = session?.user?.role;
      throw err;
    }
    return true;
  },
  // middleware 用:整個路由區段需要的權限
  guardRoute(session, path) {
    // 對應 Next.js middleware 的 matcher 設定
    const protectedMap = [
      { match: /^\/users(\/|$)/,   need: PERMISSIONS.USER_READ  },
      { match: /^\/roles(\/|$)/,   need: PERMISSIONS.ROLE_READ  },
      { match: /^\/audit(\/|$)/,   need: PERMISSIONS.AUDIT_READ },
      { match: /^\/billing(\/|$)/, need: PERMISSIONS.BILLING_READ },
      { match: /^\/settings(\/|$)/,need: PERMISSIONS.SETTINGS_WRITE },
    ];
    for (const rule of protectedMap) {
      if (rule.match.test(path)) return this.can(session, rule.need);
    }
    // / 與 /dashboard 只要登入就放行
    return !!session;
  },
};

/* ---------- CanGuard — 客戶端用 Component-level guard ---------- */
const Can = ({ perm, session, fallback = null, children }) => {
  if (!rbac.can(session, perm)) return fallback;
  return children;
};

export const PERMISSIONS = {
  USER_READ: 'user:read', USER_WRITE: 'user:write', /* ... */
};

export const rbac = {
  can(session, permission) {
    if (!session?.user) return false;
    const role = ROLES[session.user.role];
    return role?.permissions.has(permission) ?? false;
  },
  require(session, permission) {
    if (!this.can(session, permission)) {
      throw Object.assign(new Error('FORBIDDEN'), { code: 403, required: permission });
    }
  },
  guardRoute(session, path) {
    const rules = [
      [/^\\/users/,    'user:read'],
      [/^\\/roles/,    'role:read'],
      [/^\\/audit/,    'audit:read'],
      [/^\\/settings/, 'settings:write'],
    ];
    for (const [re, p] of rules) if (re.test(path)) return this.can(session, p);
    return !!session;
  },
};`}</pre>
      </div>
    </div>
  );
};

/* ===========================================================
 * /app/(dashboard)/roles/page.jsx — 角色權限矩陣
 * ============================================================ */
const RolesPage = ({ session }) => {
  const [roleMatrix, setRoleMatrix] = useState(() => {
    const m = {};
    Object.entries(ROLES).forEach(([id, r]) => {
      m[id] = new Set(r.permissions);
    });
    return m;
  });
  const canWrite = rbac.can(session, PERMISSIONS.ROLE_WRITE);

  const togglePerm = (roleId, perm) => {
    if (!canWrite) {
      logAudit({ user: session.user.name, role: session.user.role, action: 'ROLE_WRITE', target: `${roleId}:${perm}`, result: 'DENIED' });
      alert('⛔ 權限不足:role:write 被拒。事件已寫入稽核日誌。');
      return;
    }
    setRoleMatrix(prev => {
      const next = { ...prev, [roleId]: new Set(prev[roleId]) };
      if (next[roleId].has(perm)) next[roleId].delete(perm);
      else next[roleId].add(perm);
      return next;
    });
    logAudit({
      user: session.user.name, role: session.user.role,
      action: 'ROLE_WRITE',
      target: `${roleId} ${roleMatrix[roleId].has(perm) ? '−' : '+'} ${perm}`,
      result: 'OK',
    });
  };

  const reset = () => {
    const m = {};
    Object.entries(ROLES).forEach(([id, r]) => { m[id] = new Set(r.permissions); });
    setRoleMatrix(m);
  };

  return (
    <div className="space-y-6 fade-in">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">角色權限矩陣</h1>
          <p className="text-sm text-slate-500">點擊格子切換權限 · 即時生效 · 對應 <span className="mono-cell text-xs bg-slate-100 px-1.5 py-0.5 rounded">/roles/page.jsx</span></p>
        </div>
        <Can perm={PERMISSIONS.ROLE_WRITE} session={session}>
          <button onClick={reset} className="px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs hover:bg-slate-50">
            ↺ 還原預設
          </button>
        </Can>
      </div>

      <div className="glass rounded-2xl p-5 shadow-sm overflow-x-auto">
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr>
              <th className="text-left p-3 text-xs font-medium text-slate-500 sticky left-0 bg-white/80 backdrop-blur">權限 \ 角色</th>
              {Object.entries(ROLES).map(([id, r]) => (
                <th key={id} className="p-3 text-center min-w-[120px]">
                  <div className="font-bold text-slate-700">{r.label}</div>
                  <div className="text-[10px] text-slate-400 mono-cell mt-0.5">{id}</div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {ALL_PERMS.map(perm => (
              <tr key={perm} className="border-t border-slate-100 hover:bg-brand-50/30 transition">
                <td className="p-3 mono-cell text-[11px] text-slate-600 sticky left-0 bg-white/80 backdrop-blur">{perm}</td>
                {Object.entries(ROLES).map(([roleId, role]) => {
                  const has = roleMatrix[roleId].has(perm);
                  return (
                    <td key={roleId} className="p-2 text-center">
                      <button
                        onClick={() => togglePerm(roleId, perm)}
                        disabled={!canWrite}
                        className={`w-9 h-9 rounded-lg inline-flex items-center justify-center transition
                          ${has ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/30' : 'bg-slate-100 text-slate-300'}
                          ${canWrite ? 'hover:scale-110 cursor-pointer' : 'cursor-not-allowed opacity-70'}`}
                        data-tip={has ? `已授權 ${perm}` : `未授權 ${perm}`}
                      >
                        {has ? <Icon.Check className="w-4 h-4" /> : <Icon.X className="w-4 h-4" />}
                      </button>
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {!canWrite && (
        <div className="glass rounded-2xl p-5 shadow-sm border-l-4 border-rose-400">
          <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2">
            <Icon.Lock className="w-4 h-4 text-rose-500" />
            目前為唯讀模式
          </h4>
          <p className="text-sm text-slate-600">
            你的角色 <Badge color={ROLES[session.user.role].color}>{ROLES[session.user.role].label}</Badge> 沒有 role:write 權限。
            切換到「系統管理員」即可編輯權限矩陣(變更會即時生效,並寫入稽核日誌)。
          </p>
        </div>
      )}
    </div>
  );
};

             fallback={<Icon.Lock className="w-4 h-4 text-rose-500" />}>
          <label className="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" defaultChecked className="sr-only peer" />
            <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
          </label>
        </Can>
      </div>
      <div className="flex items-center justify-between py-3 border-b border-slate-100">
        <div>
          <div className="font-medium text-slate-700">Session 逾時 (分鐘)</div>
          <div className="text-xs text-slate-500">無操作自動登出時間</div>
        </div>
        <Can perm={PERMISSIONS.SETTINGS_WRITE} session={session}
             fallback={<span className="text-slate-400 mono-cell text-xs">60</span>}>
          <input type="number" defaultValue={60} className="w-20 px-2 py-1 rounded-lg border border-slate-200 text-sm text-right" />
        </Can>
      </div>
    </div>
  </div>
);

/* ===========================================================
 * Forbidden page (middleware 攔截後顯示)
 * ============================================================ */
const ForbiddenPage = ({ session, path, onNavigate }) => {
  // 找出需要哪個權限
  const required = (() => {
    const m = path.match(/^\/(\w+)/);
    const map = {
      users: PERMISSIONS.USER_READ, roles: PERMISSIONS.ROLE_READ,
      billing: PERMISSIONS.BILLING_READ, settings: PERMISSIONS.SETTINGS_WRITE,
      audit: PERMISSIONS.AUDIT_READ,
    };
    return map[m?.[1]] || null;
  })();
  const role = ROLES[session.user.role];
  return (
    <div className="flex items-center justify-center min-h-[60vh] fade-in">
      <div className="glass rounded-3xl p-10 max-w-lg text-center shadow-xl">
        <div className="w-20 h-20 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-rose-500 to-pink-500 flex items-center justify-center shadow-lg shadow-rose-500/40">
          <Icon.Lock className="w-10 h-10 text-white" />
        </div>
        <h2 className="text-2xl font-bold text-slate-800 mb-2">403 · 存取被拒絕</h2>
        <p className="text-sm text-slate-600 mb-4">
          middleware.js 已攔截此路由,因為你的角色缺少必要權限。
        </p>
        <div className="bg-slate-50 rounded-xl p-4 mb-6 text-left space-y-2">
          <div className="flex justify-between text-xs">
            <span className="text-slate-500">嘗試存取路徑</span>
            <span className="mono-cell text-slate-700">{path}</span>
          </div>
          <div className="flex justify-between text-xs">
            <span className="text-slate-500">必要權限</span>
            <span className="mono-cell text-rose-600 font-medium">{required || '-'}</span>
          </div>
          <div className="flex justify-between text-xs">
            <span className="text-slate-500">你的角色</span>
            <Badge color={role.color}>{role.label}</Badge>
          </div>
          <div className="flex justify-between text-xs">
            <span className="text-slate-500">擁有此權限的角色</span>
            <span className="text-xs text-slate-700">
              {Object.entries(ROLES).filter(([_,r]) => required && r.permissions.has(required)).map(([id]) => ROLES[id].label).join('、')}
            </span>
          </div>
        </div>
        <button
          onClick={() => onNavigate('/')}
          className="px-5 py-2.5 rounded-xl bg-brand-600 text-white text-sm font-medium shadow-md hover:bg-brand-700 transition"
        >
          ← 返回儀表板
        </button>
      </div>
    </div>
  );
};

/* ===========================================================
 * Root App — 對應 /app/layout.jsx
 * ============================================================ */
const App = () => {
  // 模擬 sessionStorage 的 session (實際 Next.js 會用 cookies/JWT)
  const [session, setSession] = useState(null);
  const [currentPath, setCurrentPath] = useState('/');
  const [bootDone, setBootDone] = useState(false);

  useEffect(() => {
    // 模擬 hydrate (Next.js 的 root layout 載入流程)
    const saved = sessionStorage.getItem('rbac_session');
    if (saved) {
      try { setSession(JSON.parse(saved)); } catch {}
    }
    setBootDone(true);
  }, []);

  const handleLogin = (user) => {
    const sess = { user, loginAt: Date.now() };
    setSession(sess);
    sessionStorage.setItem('rbac_session', JSON.stringify(sess));
    logAudit({ user: user.name, role: user.role, action: 'LOGIN', target: '-', result: 'OK' });
    setCurrentPath('/');
  };

  const handleLogout = () => {
    logAudit({ user: session.user.name, role: session.user.role, action: 'LOGOUT', target: '-', result: 'OK' });
    setSession(null);
    sessionStorage.removeItem('rbac_session');
    setCurrentPath('/');
  };

  // middleware 邏輯 — 在 render 前先檢查
  const guardResult = useMemo(() => {
    if (!bootDone) return 'loading';
    if (!session) return 'no-session';
    return rbac.guardRoute(session, currentPath) ? 'allow' : 'deny';
  }, [session, currentPath, bootDone]);

  if (!bootDone) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-slate-400 text-sm mono-cell">⟳ hydrating layout…</div>
      </div>
    );
  }

  if (!session || guardResult === 'no-session') {
    return <LoginPage onLogin={handleLogin} />;
  }

  // 路由解析
  let page;
  if (guardResult === 'deny') {
    page = <ForbiddenPage session={session} path={currentPath} onNavigate={setCurrentPath} />;
  } else {
    switch (currentPath) {
      case '/':         page = <Dashboard session={session} />; break;
      case '/users':    page = <UsersPage session={session} />; break;
      case '/roles':    page = <RolesPage session={session} />; break;
      case '/billing':  page = <BillingPage session={session} />; break;
      case '/settings': page = <SettingsPage session={session} />; break;
      case '/audit':    page = <AuditPage session={session} />; break;
      default:          page = <Dashboard session={session} />;
    }
  }

  return (
    <div className="min-h-screen flex">
      <Sidebar session={session} currentPath={currentPath} onNavigate={setCurrentPath} onLogout={handleLogout} />
      <main className="flex-1 p-6 lg:p-8 overflow-y-auto">
        <div className="max-w-6xl mx-auto">{page}</div>
      </main>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>
</body>
</html>
