<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>人事案件處理流程圖 · RBAC 權限管理 v2</title>
<style>
  :root{
    --bg-0:#0a0f1f;
    --bg-1:#131a35;
    --panel:rgba(255,255,255,0.05);
    --panel-strong:rgba(255,255,255,0.09);
    --border:rgba(255,255,255,0.13);
    --text:#e8ecff;
    --text-dim:#9aa3c7;
    --text-mute:#6b7596;
    --accent:#7c9cff;
    --accent-2:#62e0c2;
    --danger:#ff7a7a;
    --warn:#ffb86b;
    --ok:#62e0c2;
    --info:#7c9cff;
    --shadow:0 8px 32px rgba(0,0,0,.4);
    --shadow-strong:0 12px 48px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 800px at 10% 0%,#1a2350 0%,transparent 60%),radial-gradient(900px 700px at 110% 100%,#0e2a3d 0%,transparent 60%),var(--bg-0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden}
  .glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .glass-strong{background:var(--panel-strong);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-strong)}
  .app{display:grid;grid-template-columns:300px 1fr 360px;grid-template-rows:64px 1fr;height:100vh;gap:12px;padding:12px}
  header.topbar{grid-column:1/4;grid-row:1;display:flex;align-items:center;gap:14px;padding:0 18px}
  header h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  header h1 .live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
  header .sub{font-size:12px;color:var(--text-dim)}
  header .spacer{flex:1}
  header .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);font-size:12px}
  header .role-switch{display:flex;align-items:center;gap:8px}
  header select{appearance:none;background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 28px 6px 10px;font-size:13px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  header select option{background:#1a2350;color:var(--text)}
  header .icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
  header .icon-btn:hover{background:var(--panel-strong);border-color:var(--accent)}
  header .icon-btn.primary{background:linear-gradient(135deg,rgba(124,156,255,.25),rgba(98,224,194,.15));border-color:rgba(124,156,255,.55)}

  .col-left{grid-column:1;grid-row:2;padding:14px;display:flex;flex-direction:column;gap:14px;overflow:auto}
  .col-center{grid-column:2;grid-row:2;position:relative;overflow:hidden;padding:0}
  .col-center-inner{position:absolute;inset:14px}
  .col-right{grid-column:3;grid-row:2;display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
  .col-right section{padding:14px}
  .col-right section:first-child{padding:14px;overflow:auto;max-height:55%}
  .col-right section:last-child{padding:14px;flex:1;overflow:auto;min-height:0;border-top:1px solid var(--border)}

  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin:0 0 8px 0;font-weight:600;display:flex;align-items:center;justify-content:space-between}
  .section-title .badge-count{background:var(--panel);border:1px solid var(--border);padding:1px 7px;border-radius:8px;font-size:10px;letter-spacing:0}

  .case-list{display:flex;flex-direction:column;gap:6px}
  .case-item{padding:10px 12px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.04);cursor:pointer;transition:all .15s}
  .case-item:hover{background:rgba(255,255,255,.09);border-color:var(--border);transform:translateX(2px)}
  .case-item.active{background:linear-gradient(135deg,rgba(124,156,255,.22),rgba(98,224,194,.12));border-color:rgba(124,156,255,.55)}
  .case-item .name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .case-item .meta{font-size:10.5px;color:var(--text-dim);margin-top:3px}
  .case-item .progress-bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:6px;overflow:hidden}
  .case-item .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}

  .matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
  .matrix th,.matrix td{padding:6px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}
  .matrix th{font-weight:600;color:var(--text-dim);font-size:10px}
  .matrix td:first-child,.matrix th:first-child{text-align:left;color:var(--text);font-weight:500;font-size:11px;padding-left:6px}
  .perm-cell{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;border-radius:4px;font-size:10px;font-weight:700}
  .perm-y{background:rgba(98,224,194,.18);color:var(--ok);border:1px solid rgba(98,224,194,.45)}
  .perm-n{background:rgba(255,122,122,.10);color:var(--danger);border:1px solid rgba(255,122,122,.25);opacity:.55}
  .perm-c{background:rgba(255,184,107,.18);color:var(--warn);border:1px solid rgba(255,184,107,.45)}
  .matrix tr.current-role td{background:rgba(124,156,255,.10)}
  .matrix tr.current-role td:first-child{color:var(--accent);font-weight:700}
  .matrix tr.current-role td:first-child::before{content:"▸ ";color:var(--accent)}

  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text-dim);margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
  .legend .item{display:inline-flex;align-items:center;gap:4px}
  .legend .dot{width:8px;height:8px;border-radius:50%}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .stat-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .stat-card .label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
  .stat-card .value{font-size:18px;font-weight:700;margin-top:2px;color:var(--text)}
  .stat-card .value.ok{color:var(--ok)}
  .stat-card .value.warn{color:var(--warn)}
  .stat-card .value.danger{color:var(--danger)}
  .stat-card .value.info{color:var(--accent)}

  /* React Flow styling */
  .flow-wrap{position:absolute;inset:0;border-radius:14px;overflow:hidden}
  .react-flow__node-card{padding:0;border-radius:14px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1.5px solid rgba(255,255,255,.18);color:var(--text);min-width:210px;max-width:230px;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:all .2s;position:relative}
  .react-flow__node-card.locked{opacity:.55;filter:grayscale(.4)}
  .react-flow__node-card.done{opacity:.7;border-color:rgba(98,224,194,.5)}
  .react-flow__node-card.selected{box-shadow:0 0 0 2px var(--accent),0 6px 24px rgba(0,0,0,.4);border-color:rgba(124,156,255,.7)}
  .react-flow__node-card.current{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,156,255,.25),0 6px 24px rgba(0,0,0,.4)}
  .node-body{padding:10px 12px 12px}
  .node-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .node-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);flex-shrink:0}
  .node-title{font-size:12.5px;font-weight:700;letter-spacing:.2px;line-height:1.3}
  .node-sub{font-size:10px;color:var(--text-mute);margin-bottom:6px;font-family:ui-monospace,monospace}
  .node-desc{font-size:10.5px;color:var(--text-dim);margin-bottom:8px;line-height:1.4}
  .node-row{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:var(--text-dim);flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:5px;font-size:9.5px;font-weight:600;border:1px solid transparent}
  .badge-pill{padding:2px 7px;border-radius:999px;font-size:9px;letter-spacing:.5px;text-transform:uppercase}
  .node-actions{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .action-btn{flex:1 1 auto;min-width:50px;padding:5px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--text);font-size:10px;cursor:pointer;transition:all .15s;font-family:inherit;font-weight:500}
  .action-btn:hover:not(:disabled){background:rgba(124,156,255,.20);border-color:rgba(124,156,255,.55);transform:translateY(-1px)}
  .action-btn:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
  .action-btn.primary{background:linear-gradient(135deg,rgba(124,156,255,.30),rgba(98,224,194,.18));border-color:rgba(124,156,255,.6)}
  .node-progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);border-radius:14px 14px 0 0;overflow:hidden}
  .node-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}
  .node-status-badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}

  .react-flow__handle{background:var(--accent);border:2px solid rgba(0,0,0,.4);width:8px;height:8px}
  .react-flow__edge-path{stroke:rgba(124,156,255,.55);stroke-width:2}
  .react-flow__edge.selected .react-flow__edge-path{stroke:var(--accent);stroke-width:2.5}
  .react-flow__edge.animated path{stroke-dasharray:5;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-10}}
  .react-flow__edge-text{font-size:10px;fill:var(--text-dim);font-weight:600}
  .react-flow__edge-textbg{fill:var(--bg-1);stroke:rgba(255,255,255,.08)}
  .react-flow__controls{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;overflow:hidden;backdrop-filter:blur(10px)}
  .react-flow__controls-button{background:transparent;border:none;color:var(--text);border-bottom:1px solid var(--border);padding:6px}
  .react-flow__controls-button:hover{background:rgba(255,255,255,.08)}
  .react-flow__controls-button svg{fill:var(--text)}
  .react-flow__minimap{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(10px)}
  .react-flow__background{background:transparent}
  .react-flow__attribution{background:transparent !important;color:var(--text-dim) !important;font-size:9px !important}

  .selected-node-title{font-size:14px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .selected-node-sub{font-size:11px;color:var(--text-dim);margin:0 0 10px;line-height:1.4}
  .kv{display:flex;justify-content:space-between;padding:7px 10px;border-radius:6px;background:rgba(255,255,255,.04);margin-bottom:4px;font-size:11.5px;align-items:center}
  .kv .k{color:var(--text-dim);font-size:11px}
  .kv .v{font-weight:600;font-size:11.5px}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .perm-tile{padding:7px 8px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:10.5px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
  .perm-tile.granted{background:rgba(98,224,194,.10);border-color:rgba(98,224,194,.35)}
  .perm-tile.denied{background:rgba(255,122,122,.08);border-color:rgba(255,122,122,.30);opacity:.75}
  .perm-tile.conditional{background:rgba(255,184,107,.10);border-color:rgba(255,184,107,.30)}

  .timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:18px}
  .timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:rgba(255,255,255,.10)}
  .tl-item{position:relative;padding:6px 0 10px 6px}
  .tl-item::before{content:"";position:absolute;left:-15px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-0)}
  .tl-item.ok::before{background:var(--ok)}
  .tl-item.warn::before{background:var(--warn)}
  .tl-item.deny::before{background:var(--danger)}
  .tl-time{font-size:9.5px;color:var(--text-mute);font-family:ui-monospace,monospace}
  .tl-actor{font-size:11.5px;font-weight:600;margin-top:1px}
  .tl-action{font-size:10.5px;color:var(--text-dim);line-height:1.4}
  .tl-action strong{color:var(--text);font-weight:600}
  .tl-reason{font-size:10px;color:var(--danger);margin-top:2px;font-style:italic}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}
  ::-webkit-scrollbar-track{background:transparent}

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(20,27,52,.96);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;padding:11px 20px;font-size:12.5px;box-shadow:var(--shadow-strong);z-index:9999;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.allow{border-color:rgba(98,224,194,.6);color:var(--ok)}
  .toast.deny{border-color:rgba(255,122,122,.6);color:var(--danger)}
  .toast.warn{border-color:rgba(255,184,107,.6);color:var(--warn)}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:9000;display:none;align-items:center;justify-content:center}
  .modal-backdrop.show{display:flex}
  .modal{background:rgba(20,27,52,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:20px;width:min(420px,90vw);box-shadow:var(--shadow-strong)}
  .modal h3{margin:0 0 8px;font-size:14px}
  .modal p{margin:0 0 14px;font-size:12px;color:var(--text-dim);line-height:1.5}
  .modal textarea{width:100%;min-height:70px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:12px;resize:vertical}
  .modal textarea:focus{outline:none;border-color:var(--accent)}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .modal button{padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;font-family:inherit;font-weight:500}
  .modal button.primary{background:linear-gradient(135deg,rgba(124,156,255,.30),rgba(98,224,194,.18));border-color:rgba(124,156,255,.55)}
  .modal button:hover{background:var(--panel-strong)}

  /* Toggle */
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;margin-top:8px;font-size:11px}
  .toggle-row .label-text{color:var(--text-dim)}
  .toggle{position:relative;width:32px;height:18px;background:rgba(255,255,255,.1);border-radius:9px;cursor:pointer;transition:background .2s;border:1px solid var(--border)}
  .toggle.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:#fff;border-radius:50%;transition:left .2s}
  .toggle.on::after{left:16px}

  .empty-state{padding:24px 16px;text-align:center;color:var(--text-dim);font-size:12px;line-height:1.6}
  .empty-state .icon{font-size:32px;opacity:.4;margin-bottom:8px}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="modal-backdrop" class="modal-backdrop">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
    <textarea id="modal-input" placeholder="輸入理由 (選填)..."></textarea>
    <div class="modal-actions">
      <button id="modal-cancel">取消</button>
      <button id="modal-confirm" class="primary">確認執行</button>
    </div>
  </div>
</div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script crossorigin src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>

<script>
// ===== 純 ES 資料層 =====
const ROLES = [
  { id:"staff",    name:"人事承辦",  color:"#7c9cff", icon:"📝" },
  { id:"chief",    name:"單位主管",  color:"#62e0c2", icon:"👔" },
  { id:"director", name:"人事主任",  color:"#ffb86b", icon:"🧑‍💼" },
  { id:"principal",name:"校長",      color:"#ff7a7a", icon:"🎓" },
];

const ACTION_LABEL = { view:"檢視", edit:"編輯", approve:"核定", assign:"分派", delete:"刪除" };

// RBAC 權限表: allow / deny / conditional (需另外檢查業務條件)
const PERMISSIONS = {
  staff:    { view:"allow", edit:"conditional", approve:"deny",      assign:"conditional", delete:"deny" },
  chief:    { view:"allow", edit:"conditional", approve:"allow",     assign:"deny",        delete:"deny" },
  director: { view:"allow", edit:"allow",       approve:"allow",     assign:"allow",       delete:"conditional" },
  principal:{ view:"allow", edit:"conditional", approve:"allow",     assign:"deny",        delete:"deny" },
};

// 業務規則(用於 conditional 條件檢查)
const BUSINESS_RULES = {
  edit: { requireOwner: true, desc:"僅限案件承辦人編輯" },
  assign: { requireDirector: true, desc:"僅人事主任可分派" },
  delete: { requireDirector: true, desc:"僅人事主任可刪除,且歸檔未滿 30 天" },
};

const CASE_TYPES = [
  { id:"hire",    name:"新進聘任", icon:"🆕", description:"新進教師/職員聘任流程" },
  { id:"resign",  name:"離職",     icon:"📤", description:"離職/資遣/退休流程" },
  { id:"leave",   name:"留職停薪", icon:"⏸",  description:"留職停薪申請與回職" },
  { id:"salary",  name:"敘薪核定", icon:"💰", description:"到職/調薪/敘薪核定" },
  { id:"eval",    name:"考核作業", icon:"📊", description:"年度考核、專案考績" },
];

const FLOW_NODES = [
  { id:"N1", label:"收件登記",   icon:"📥", required_role:"staff",    required_action:"edit",    desc:"承辦人收件、登記案件基本資料" },
  { id:"N2", label:"承辦登錄",   icon:"📝", required_role:"staff",    required_action:"edit",    desc:"補件、登錄人事系統" },
  { id:"N3", label:"單位會簽",   icon:"🤝", required_role:"chief",    required_action:"approve", desc:"原屬單位主管核章" },
  { id:"N4", label:"文件補件",   icon:"📎", required_role:"staff",    required_action:"edit",    desc:"缺件通知、補件追蹤" },
  { id:"N5", label:"初審",       icon:"🔍", required_role:"director", required_action:"approve", desc:"人事主任初審合規性" },
  { id:"N6", label:"主任覆核",   icon:"🧑‍⚖️", required_role:"director", required_action:"approve", desc:"人事主任綜整覆核" },
  { id:"N7", label:"校長核定",   icon:"🎓", required_role:"principal",required_action:"approve", desc:"校長最終核定" },
  { id:"N8", label:"通知當事人", icon:"📨", required_role:"staff",    required_action:"edit",    desc:"發函通知當事人" },
  { id:"N9", label:"歸檔",       icon:"🗄", required_role:"staff",    required_action:"edit",    desc:"歸檔備查、結案" },
];

// 案件類型對應的流程節點序列
const CASE_NODE_MAP = {
  hire:   ["N1","N2","N3","N5","N6","N7","N8","N9"],
  resign: ["N1","N2","N3","N5","N6","N7","N8","N9"],

const FLOWS = [
  ["N1","N2"],["N2","N3"],["N3","N4"],["N4","N5"],["N5","N6"],["N6","N7"],["N7","N8"],["N8","N9"],
];

const INITIAL_AUDIT_LOG = [
  { time:"2026-07-30 09:12", actor:"王小明(人事承辦)", action:"register-case",  node:"N1", result:"ok", reason:null },
  { time:"2026-07-30 10:25", actor:"李組長(單位主管)", action:"approve",         node:"N3", result:"ok", reason:null },

  { time:"2026-07-30 16:02", actor:"王小明(人事承辦)", action:"notify",          node:"N8", result:"ok", reason:null },
];

// 模擬案件進度(每個案件類型的當前進度索引)
const INITIAL_CASE_PROGRESS = {

  resign: { current: 3, completed: ["N1","N2","N3"] },

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback, useEffect, useRef } = React;
const ReactFlowLib = window.ReactFlow || {};
const { ReactFlow, Background, Controls, MiniMap, Handle, Position, ReactFlowProvider, useNodesState, useEdgesState, MarkerType } = ReactFlowLib;

const nodeColors = {
  staff:    "#7c9cff",
  chief:    "#62e0c2",
  director: "#ffb86b",
  principal:"#ff7a7a",
};

// ===== RBAC 邏輯層 =====
function checkPermission(roleId, action, role, caseProgress, nodeId){
  const perm = PERMISSIONS[roleId][action];
  if (perm === "allow") return { allowed: true, reason: null };
  if (perm === "deny") return { allowed: false, reason: `角色「${role.name}」未獲 ${ACTION_LABEL[action]} 授權` };
  // conditional: 依業務規則檢查
  if (action === "edit" && BUSINESS_RULES.edit.requireOwner){
    if (nodeId){
      const node = FLOW_NODES.find(n => n.id === nodeId);
      if (node && node.required_role === "staff"){
        // 承辦人可編輯任何 staff 節點(模擬:目前使用者即為承辦人)
        return { allowed: true, reason: null, conditional: true };
      }
    }
    return { allowed: false, reason: BUSINESS_RULES.edit.desc, conditional: true };
  }
  if (action === "assign" && BUSINESS_RULES.assign.requireDirector){
    return { allowed: roleId === "director", reason: BUSINESS_RULES.assign.desc, conditional: true };
  }
  if (action === "delete" && BUSINESS_RULES.delete.requireDirector){
    return { allowed: false, reason: BUSINESS_RULES.delete.desc, conditional: true };
  }
  return { allowed: false, reason: "業務規則未通過", conditional: true };
}

// ===== 自訂節點 =====
function CaseNode({ data }){
  const roleColor = nodeColors[data.required_role] || "#7c9cff";
  const cardClass = "react-flow__node-card"
    + (data.locked ? " locked" : "")
    + (data.completed ? " done" : "")
    + (data.isCurrent ? " current" : "");
  const nodeProgress = data.nodeProgressPct || 0;
  return (
    <div className={cardClass}>
      <div className="node-progress">
        <div className="node-progress-fill" style={{width: nodeProgress + "%"}}></div>
      </div>
      <Handle type="target" position={Position.Top} />
      <div className="node-body">
        <div className="node-head">
          <div className="node-icon" style={{ background:`linear-gradient(135deg, ${roleColor}55, ${roleColor}22)`, borderColor:`${roleColor}66` }}>
            {data.icon}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div className="node-title">{data.label}</div>
            <div className="node-sub">{data.id}</div>
          </div>
        </div>
        <div className="node-desc">{data.desc}</div>
        <div className="node-row">
          <span className="badge" style={{ background:`${roleColor}22`, borderColor:`${roleColor}55`, color: roleColor }}>
            {data.role_name}
          </span>
          {data.completed ? (
            <span className="badge badge-pill" style={{
              borderColor: "rgba(98,224,194,.50)",
              color: "#62e0c2",
              background: "rgba(98,224,194,.12)"
            }}>✓ 已完成</span>
          ) : data.isCurrent ? (
            <span className="badge badge-pill" style={{
              borderColor: "rgba(124,156,255,.60)",
              color: "#7c9cff",
              background: "rgba(124,156,255,.15)"
            }}>⚡ 進行中</span>
          ) : data.locked ? (
            <span className="badge badge-pill" style={{
              borderColor: "rgba(255,122,122,.40)",
              color: "#ff7a7a",
              background: "rgba(255,122,122,.10)"
            }}>🔒 已鎖定</span>
          ) : (
            <span className="badge badge-pill" style={{
              borderColor: "rgba(255,184,107,.40)",
              color: "#ffb86b",
              background: "rgba(255,184,107,.10)"
            }}>⏳ 待處理</span>
          )}
        </div>
        <div className="node-row" style={{marginTop:4,fontSize:9.5,color:"var(--text-mute)"}}>
          需要: <strong style={{color:"var(--text)",marginLeft:2}}>{data.action_label}</strong>
          {data.conditional && <span style={{marginLeft:4,color:"var(--warn)"}}>(條件式)</span>}
        </div>
        <div className="node-actions">
          {data.available_actions.map(a => (
            <button
              key={a.id}
              className={"action-btn" + (a.id === data.required_action ? " primary" : "")}
              disabled={!a.allowed}
              title={a.allowed ? "可執行" : a.reason || "權限不足"}
              onClick={(e) => {
                e.stopPropagation();
                if (typeof data.onAction === "function") data.onAction(a, data);
              }}
            >
              {a.label}
            </button>
          ))}
        </div>
      </div>
      <Handle type="source" position={Position.Bottom} />
    </div>
  );
}

const nodeTypes = { caseNode: CaseNode };

// ===== 計算節點圖(根據案件類型 + 角色 + 進度) =====
function buildFlowState(caseTypeId, roleId, caseProgress, onAction){
  const enabled = new Set(CASE_NODE_MAP[caseTypeId]);
  const completedSet = new Set(caseProgress.completed);
  const currentIdx = caseProgress.current;
  const enabledNodes = CASE_NODE_MAP[caseTypeId].map(id => FLOW_NODES.find(n => n.id === id));
  const currentNodeId = enabledNodes[currentIdx]?.id;

  const nodes = enabledNodes.map((n, idx) => {
    const role = ROLES.find(r => r.id === n.required_role);
    const isCompleted = completedSet.has(n.id);
    const isCurrent = n.id === currentNodeId && !isCompleted;
    const ACTIONS = ["view","edit","approve","assign","delete"];
    const available_actions = ACTIONS.map(act => {
      // view 永遠允許
      if (act === "view") return { id: act, label: ACTION_LABEL[act], allowed: true };
      const result = checkPermission(roleId, act, role, caseProgress, n.id);
      return { id: act, label: ACTION_LABEL[act], allowed: result.allowed, reason: result.reason, conditional: result.conditional };
    });
    // 鎖定條件: 不是當前節點 + 不是已完成 + 不是檢視動作
    const locked = !isCompleted && !isCurrent;
    return {
      id: n.id,
      type: "caseNode",
      position: { x: (idx % 4) * 270, y: Math.floor(idx / 4) * 230 },
      data: {
        ...n,
        role_name: role.name,
        action_label: ACTION_LABEL[n.required_action],
        locked,
        completed: isCompleted,
        isCurrent,
        nodeProgressPct: isCompleted ? 100 : (isCurrent ? 60 : 0),
        available_actions,
        onAction,
      },
    };
  });

  const edges = FLOWS
    .filter(([a,b]) => enabled.has(a) && enabled.has(b))
    .map(([a,b]) => {
      const aDone = completedSet.has(a);
      const bDone = completedSet.has(b);
      const bCurrent = b === currentNodeId && !bDone;
      const animated = aDone && !bDone;
      return {
        id: `e-${a}-${b}`,
        source: a,
        target: b,
        type: "smoothstep",
        animated,
        label: bDone ? "✓" : (animated ? "→" : ""),
        labelStyle: { fill: bDone ? "#62e0c2" : "#9aa3c7", fontSize: 11, fontWeight: 600 },
        labelBgStyle: { fill: "#141b34", stroke: "rgba(255,255,255,.1)" },
        labelBgPadding: [4, 2],
        labelBgBorderRadius: 4,
        style: {
          stroke: bDone ? "rgba(98,224,194,.7)" : (animated ? "rgba(124,156,255,.75)" : "rgba(124,156,255,.25)"),
          strokeWidth: bDone || animated ? 2 : 1.5
        },
        markerEnd: { type: MarkerType.ArrowClosed, color: bDone ? "#62e0c2" : (animated ? "#7c9cff" : "#3a4570") },
      };
    });

  return { nodes, edges };
}

// ===== Toast 工具 =====
function showToast(msg, kind){
  const el = document.getElementById("toast");
  if (!el) return;
  const icon = kind === "allow" ? "✓" : kind === "deny" ? "✗" : "⚠";
  el.innerHTML = `<span style="font-weight:700">${icon}</span><span>${msg}</span>`;
  el.className = "toast show " + (kind || "");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove("show"), 2400);
}

// ===== Modal 工具 =====
function showModal({ title, desc, onConfirm }){
  const backdrop = document.getElementById("modal-backdrop");
  const titleEl = document.getElementById("modal-title");
  const descEl = document.getElementById("modal-desc");
  const inputEl = document.getElementById("modal-input");
  const confirmBtn = document.getElementById("modal-confirm");
  const cancelBtn = document.getElementById("modal-cancel");
  titleEl.textContent = title;
  descEl.textContent = desc;
  inputEl.value = "";
  backdrop.classList.add("show");
  const cleanup = () => {
    backdrop.classList.remove("show");
    confirmBtn.onclick = null;
    cancelBtn.onclick = null;
  };
  confirmBtn.onclick = () => {
    const reason = inputEl.value.trim();
    cleanup();
    onConfirm(reason);
  };
  cancelBtn.onclick = cleanup;
}

// ===== 持久化(localStorage) =====
const STORAGE_KEY = "hermes_rbac_workflow_state_v2";
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}
function saveState(state){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ===== 內層 Layout =====
function AppInner(){
  const persisted = useMemo(() => loadState(), []);
  const [roleId, setRoleId] = useState(persisted?.roleId || "staff");
  const [caseTypeId, setCaseTypeId] = useState(persisted?.caseTypeId || "hire");
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [auditTrail, setAuditTrail] = useState(persisted?.auditTrail || INITIAL_AUDIT_LOG);
  const [caseProgress, setCaseProgress] = useState(persisted?.caseProgress || INITIAL_CASE_PROGRESS);
  const [autoAdvance, setAutoAdvance] = useState(persisted?.autoAdvance !== false);

  useEffect(() => {
    saveState({ roleId, caseTypeId, auditTrail, caseProgress, autoAdvance });
  }, [roleId, caseTypeId, auditTrail, caseProgress, autoAdvance]);

  const handleAction = useCallback((action, node) => {
    const role = ROLES.find(r => r.id === roleId);
    const newEntry = {
      time: new Date().toLocaleTimeString("zh-TW", {hour12: false}),
      actor: `${role.name}(目前使用者)`,
      action: action.id,
      node: node.id,
      result: action.allowed ? "ok" : "deny",
      reason: action.allowed ? null : action.reason,
    };

    // 對於需要理由的 conditional 動作(如刪除、覆核),彈出 Modal
    if (action.allowed && action.conditional){
      showModal({
        title: `${action.label} - ${node.label}`,
        desc: `此動作為條件式授權,需填寫理由。(${action.reason || "依業務規則"})`,
        onConfirm: (reason) => {
          newEntry.reason = reason || "(未填寫)";
          setAuditTrail(prev => [newEntry, ...prev]);
          showToast(`✓ ${role.name}「${action.label}」於 ${node.label} 執行成功`, "allow");
          // 自動推進進度
          if (autoAdvance && action.id === "approve" && action.allowed){
            advanceProgress(node.id);
          } else if (autoAdvance && action.id === "edit" && action.allowed && node.id === caseProgress.currentNodeRef){
            advanceProgress(node.id);
          }
        }
      });
      return;
    }

    setAuditTrail(prev => [newEntry, ...prev]);
    if (action.allowed) {
      showToast(`✓ ${role.name}「${action.label}」於 ${node.label} 執行成功`, "allow");
      if (autoAdvance && action.id === "approve"){
        advanceProgress(node.id);
      }
    } else {
      showToast(`✗ 權限拒絕:${role.name} 無法「${action.label}」${node.label}`, "deny");
    }
  }, [roleId, caseTypeId, autoAdvance]);

  const advanceProgress = useCallback((nodeId) => {
    setCaseProgress(prev => {
      const cp = prev[caseTypeId];
      const enabled = CASE_NODE_MAP[caseTypeId];
      const completed = new Set(cp.completed);
      completed.add(nodeId);
      const nextIdx = cp.current + 1;
      return { ...prev, [caseTypeId]: { current: nextIdx, completed: Array.from(completed) } };
    });
  }, [caseTypeId]);

  const { nodes, edges } = useMemo(
    () => buildFlowState(caseTypeId, roleId, caseProgress[caseTypeId], handleAction),
    [caseTypeId, roleId, caseProgress, handleAction]
  );
  const [nodeState, setNodeState, onNodesChange] = useNodesState(nodes);
  const [edgeState, setEdgeState, onEdgesChange] = useEdgesState(edges);

  useEffect(() => {
    setNodeState(nodes);
    setEdgeState(edges);
    setSelectedNodeId(null);
  }, [nodes, edges]);

  const onNodeClick = useCallback((_, node) => setSelectedNodeId(node.id), []);
  const selectedNode = useMemo(() => nodeState.find(n => n.id === selectedNodeId) || null, [nodeState, selectedNodeId]);

  // 統計
  const stats = useMemo(() => {
    const cp = caseProgress[caseTypeId];
    const enabled = CASE_NODE_MAP[caseTypeId];
    const total = enabled.length;
    const done = cp.completed.length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    const auditAllow = auditTrail.filter(a => a.result === "ok").length;
    const auditDeny = auditTrail.filter(a => a.result === "deny").length;
    return { total, done, pct, auditAllow, auditDeny };
  }, [caseProgress, caseTypeId, auditTrail]);

  // 重置當前案件進度
  const resetCaseProgress = useCallback(() => {
    setCaseProgress(prev => ({ ...prev, [caseTypeId]: { current: 0, completed: [] } }));
    showToast(`已重置 ${CASE_TYPES.find(c => c.id === caseTypeId)?.name} 進度`, "warn");
  }, [caseTypeId]);

  // 清空審計
  const clearAudit = useCallback(() => {
    setAuditTrail([]);
    showToast("審計紀錄已清空", "warn");
  }, []);

  // 匯出流程為 JSON
  const exportFlow = useCallback(() => {
    const data = {
      exported_at: new Date().toISOString(),
      case_type: CASE_TYPES.find(c => c.id === caseTypeId),
      current_role: ROLES.find(r => r.id === roleId),
      progress: caseProgress[caseTypeId],
      permissions: PERMISSIONS,
      nodes: nodes.map(n => ({ id: n.id, label: n.data.label, role: n.data.role_name, status: n.data.completed ? "done" : (n.data.isCurrent ? "current" : "pending") })),
      edges: edges.map(e => ({ from: e.source, to: e.target })),
      audit_trail: auditTrail.slice(0, 50),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `personnel-workflow-${caseTypeId}-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("流程 JSON 已匯出", "allow");
  }, [caseTypeId, roleId, caseProgress, nodes, edges, auditTrail]);

  const roleSelect = (
    <select value={roleId} onChange={e => setRoleId(e.target.value)}>
      {ROLES.map(r => <option key={r.id} value={r.id}>{r.icon} {r.name}</option>)}
    </select>
  );

  const caseList = CASE_TYPES.map(c => {
    const cp = caseProgress[c.id];
    const total = CASE_NODE_MAP[c.id].length;
    const pct = total > 0 ? Math.round((cp.completed.length / total) * 100) : 0;
    return (
      <div key={c.id}
           className={"case-item" + (c.id === caseTypeId ? " active" : "")}
           onClick={() => setCaseTypeId(c.id)}>
        <div className="name">{c.icon} {c.name}</div>
        <div className="meta">{c.description} · {cp.completed.length}/{total} ({pct}%)</div>
        <div className="progress-bar"><div className="progress-fill" style={{width: pct + "%"}}></div></div>
      </div>
    );
  });

  const matrixBody = ROLES.map(r => {
    const p = PERMISSIONS[r.id];
    const cell = (k) => {
      if (p[k] === "allow") return <span className="perm-cell perm-y">✓</span>;
      if (p[k] === "conditional") return <span className="perm-cell perm-c">C</span>;
      return <span className="perm-cell perm-n">✗</span>;
    };
    return (
      <tr key={r.id} className={r.id === roleId ? "current-role" : ""}>
        <td>{r.icon} {r.name}</td>
        <td>{cell("view")}</td>
        <td>{cell("edit")}</td>
        <td>{cell("approve")}</td>
        <td>{cell("assign")}</td>
        <td>{cell("delete")}</td>
      </tr>
    );
  });

  const nodeDetail = !selectedNode ? (
    <div className="empty-state">
      <div className="icon">👆</div>
      點擊流程圖上任一節點<br/>查看權限與可執行動作
    </div>
  ) : (
    <div>
      <div className="selected-node-title">
        <span>{selectedNode.data.icon}</span>
        <span>{selectedNode.data.label}</span>
      </div>
      <div className="selected-node-sub">{selectedNode.data.desc}</div>
      <div className="kv"><span className="k">節點編號</span><span className="v">{selectedNode.id}</span></div>
      <div className="kv"><span className="k">負責角色</span><span className="v" style={{color: nodeColors[selectedNode.data.required_role]}}>{selectedNode.data.role_name}</span></div>
      <div className="kv"><span className="k">目前角色</span><span className="v">{ROLES.find(r => r.id === roleId)?.name}</span></div>
      <div className="kv">
        <span className="k">狀態</span>
        <span className="v" style={{color: selectedNode.data.completed ? "#62e0c2" : (selectedNode.data.isCurrent ? "#7c9cff" : (selectedNode.data.locked ? "#ff7a7a" : "#ffb86b"))}}>
          {selectedNode.data.completed ? "✓ 已完成" : (selectedNode.data.isCurrent ? "⚡ 進行中" : (selectedNode.data.locked ? "🔒 已鎖定" : "⏳ 待處理"))}
        </span>
      </div>
      <div className="kv">
        <span className="k">需要動作</span>
        <span className="v">{selectedNode.data.action_label}{selectedNode.data.conditional && <span style={{color:"var(--warn)",fontSize:10,marginLeft:4}}>(條件式)</span>}</span>
      </div>
      <div style={{marginTop:10,fontSize:10.5,color:"var(--text-dim)",textTransform:"uppercase",letterSpacing:1}}>當前角色在此節點可執行動作:</div>
      <div className="perm-grid">
        {selectedNode.data.available_actions.map(a => (
          <div key={a.id} className={"perm-tile " + (a.allowed ? "granted" : (a.conditional ? "conditional" : "denied"))} title={a.reason || ""}>
            <span>{a.label}</span>
            <span style={{fontWeight:700}}>{a.allowed ? "✓" : (a.conditional ? "C" : "✗")}</span>
          </div>
        ))}
      </div>
    </div>
  );

  const timeline = auditTrail.length === 0 ? (
    <div className="empty-state">
      <div className="icon">📋</div>
      目前尚無審計紀錄<br/>點擊節點上的按鈕執行操作
    </div>
  ) : auditTrail.slice(0, 30).map((log, idx) => (
    <div key={idx} className={"tl-item " + log.result}>
      <div className="tl-time">{log.time}</div>
      <div className="tl-actor">{log.actor}</div>
      <div className="tl-action">
        在節點 <strong>{log.node}</strong> 執行 <strong>{log.action}</strong>
      </div>
      {log.reason && <div className="tl-reason">{log.result === "deny" ? "🚫 " : "📝 "}{log.reason}</div>}
    </div>
  ));

  return (
    <div className="app">
      <header className="topbar glass">
        <h1>
          <span className="live-dot"></span>
          🏛 人事案件處理流程圖
        </h1>
        <span className="sub">Personnel Case Workflow · RBAC v2.0</span>
        <span className="spacer"></span>
        <span className="role-switch pill">
          <span style={{color:"var(--text-dim)"}}>👤 目前角色</span>
          {roleSelect}
        </span>
        <button className="icon-btn" onClick={resetCaseProgress} title="重置當前案件進度">🔄 重置進度</button>
        <button className="icon-btn" onClick={clearAudit} title="清空審計紀錄">🗑 清審計</button>
        <button className="icon-btn primary" onClick={exportFlow} title="匯出流程 JSON">📥 匯出</button>
      </header>

      <aside className="col-left glass">
        <div>
          <div className="section-title">
            <span>案件類型</span>
            <span className="badge-count">{CASE_TYPES.length}</span>
          </div>
          <div className="case-list">{caseList}</div>
        </div>
        <div>
          <div className="section-title">
            <span>當前案件狀態</span>
            <span className="badge-count" style={{color: stats.pct === 100 ? "var(--ok)" : "var(--accent)"}}>{stats.pct}%</span>
          </div>
          <div className="stats-grid">
            <div className="stat-card">
              <div className="label">已完成</div>
              <div className="value ok">{stats.done}<span style={{fontSize:11,color:"var(--text-dim)",marginLeft:2}}>/{stats.total}</span></div>
            </div>
            <div className="stat-card">
              <div className="label">允許操作</div>
              <div className="value info">{stats.auditAllow}</div>
            </div>
            <div className="stat-card">
              <div className="label">拒絕操作</div>
              <div className="value danger">{stats.auditDeny}</div>
            </div>
            <div className="stat-card">
              <div className="label">總審計</div>
              <div className="value">{auditTrail.length}</div>
            </div>
          </div>
        </div>
        <div>
          <div className="section-title">
            <span>RBAC 權限矩陣</span>
            <span className="badge-count">5×4</span>
          </div>
          <table className="matrix">
            <thead>
              <tr>
                <th>角色</th>
                <th>檢視</th><th>編輯</th><th>核定</th><th>分派</th><th>刪除</th>
              </tr>
            </thead>
            <tbody>{matrixBody}</tbody>
          </table>
          <div className="legend">
            <span className="item"><span className="dot" style={{background:"var(--ok)"}}></span>✓ 允許</span>
            <span className="item"><span className="dot" style={{background:"var(--warn)"}}></span>C 條件式</span>
            <span className="item"><span className="dot" style={{background:"var(--danger)"}}></span>✗ 禁止</span>
          </div>
          <div className="toggle-row">
            <span className="label-text">⚡ 自動推進案件進度</span>
            <div className={"toggle" + (autoAdvance ? " on" : "")} onClick={() => setAutoAdvance(!autoAdvance)}></div>
          </div>
        </div>
      </aside>

      <main className="col-center">
        <div className="col-center-inner">
          <div className="flow-wrap glass">
            <ReactFlow
              nodes={nodeState}
              edges={edgeState}
              onNodesChange={onNodesChange}
              onEdgesChange={onEdgesChange}
              onNodeClick={onNodeClick}
              onPaneClick={() => setSelectedNodeId(null)}
              nodeTypes={nodeTypes}
              fitView
              fitViewOptions={{ padding: 0.2 }}
              minZoom={0.3}
              maxZoom={1.8}
              proOptions={{ hideAttribution: true }}
              defaultEdgeOptions={{ type: "smoothstep" }}
            >
              <Background color="rgba(255,255,255,.07)" gap={20} size={1} />
              <Controls position="bottom-right" />
              <MiniMap
                nodeColor={n => {
                  if (n.data?.completed) return "#62e0c2";
                  if (n.data?.isCurrent) return "#7c9cff";
                  return nodeColors[n.data?.required_role] || "#7c9cff";
                }}
                nodeStrokeWidth={2}
                maskColor="rgba(11,16,32,0.78)"
                position="bottom-left"
                style={{background:"rgba(255,255,255,.06)"}}
              />
            </ReactFlow>
          </div>
        </div>
      </main>

      <aside className="col-right glass">
        <section>
          <div className="section-title">
            <span>節點詳情</span>
            {selectedNode && <span className="badge-count" style={{color:"var(--accent)"}}>{selectedNode.id}</span>}
          </div>
          {nodeDetail}
        </section>
        <section>
          <div className="section-title">
            <span>審計紀錄</span>
            <span className="badge-count">{auditTrail.length}</span>
          </div>
          <div className="timeline">{timeline}</div>
        </section>
      </aside>
    </div>
  );
}

function Root(){
  return (
    <ReactFlowProvider>
      <AppInner />
    </ReactFlowProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
</body>
</html>
