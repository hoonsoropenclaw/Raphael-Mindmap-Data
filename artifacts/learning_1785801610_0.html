<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowForge — 動態工作流程管理系統</title>

<!-- React 18 UMD -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<!-- Babel for in-browser JSX -->
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<!-- React Flow 12 -->
<link rel="stylesheet" href="https://unpkg.com/reactflow@12.3.5/dist/style.css" />
<script src="https://unpkg.com/reactflow@12.3.5/dist/umd/index.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />

<script>
  tailwind.config = {
    darkMode: ['class', '[data-theme="dark"]'],
    theme: {
      extend: {
        fontFamily: {
          sans: ['Manrope', 'Noto Sans TC', 'ui-sans-serif', 'sans-serif'],
          mono: ['IBM Plex Mono', 'ui-monospace', 'monospace']
        },
        colors: {
          nimbus: { 400: '#5eead4', 500: '#2dd4bf', 600: '#0d9488' },
          ember:  '#fb7185',
          ink:    { 900: '#0a0f14', 800: '#0d161e', 700: '#111c26' }
        }
      }
    }
  };
</script>

<style>
  :root {
    --glass:        rgba(16, 43, 36, 0.46);
    --glass-strong: rgba(12, 36, 30, 0.78);
    --glass-soft:   rgba(20, 50, 42, 0.32);
    --border:       rgba(94, 234, 212, 0.18);
    --border-soft:  rgba(148, 163, 184, 0.14);
    --bd:           blur(18px) saturate(140%);
  }

  * { box-sizing: border-box; }

  html, body, #root {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #050a0d;
    color: #e2e8f0;
    font-family: 'Manrope', 'Noto Sans TC', sans-serif;
    overflow: hidden;
  }

  /* Animated aurora background */
  .aurora {
    position: fixed; inset: 0;
    z-index: 0;
    background:
      radial-gradient(900px 600px at 12% 18%, rgba(45, 212, 191, 0.20), transparent 60%),
      radial-gradient(800px 500px at 88% 82%, rgba(251, 113, 133, 0.16), transparent 60%),
      radial-gradient(700px 700px at 60% 10%, rgba(99, 102, 241, 0.12), transparent 65%),
      linear-gradient(180deg, #050a0d 0%, #07111a 100%);
    pointer-events: none;
  }
  .grid-overlay {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(94,234,212,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,234,212,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    pointer-events: none;
  }

  .glass {
    background: var(--glass);
    backdrop-filter: var(--bd);
    -webkit-backdrop-filter: var(--bd);
    border: 1px solid var(--border);
  }
  .glass-strong {
    background: var(--glass-strong);
    backdrop-filter: var(--bd);
    -webkit-backdrop-filter: var(--bd);
    border: 1px solid var(--border);
  }
  .glass-soft {
    background: var(--glass-soft);
    backdrop-filter: var(--bd);
    -webkit-backdrop-filter: var(--bd);
    border: 1px solid var(--border-soft);
  }

  /* React Flow tweaks */
  .react-flow__renderer { background: transparent !important; }
  .react-flow__background { background: transparent !important; }
  .react-flow__edge-path {
    stroke: #5eead4;
    stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(94, 234, 212, 0.45));
  }
  .react-flow__edge.selected .react-flow__edge-path,
  .react-flow__edge:hover .react-flow__edge-path {
    stroke: #fb7185;
    stroke-width: 3;
  }
  .react-flow__edge-text {
    fill: #e2e8f0;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
  }
  .react-flow__edge-textbg {
    fill: rgba(12, 36, 30, 0.95);
    stroke: rgba(94, 234, 212, 0.35);
  }
  .react-flow__handle {
    width: 10px; height: 10px;
    background: #2dd4bf;
    border: 2px solid #0a0f14;
    box-shadow: 0 0 8px rgba(45, 212, 191, 0.6);
  }
  .react-flow__handle:hover {
    background: #fb7185;
    box-shadow: 0 0 8px rgba(251, 113, 133, 0.7);
  }
  .react-flow__controls {
    background: rgba(12, 36, 30, 0.78);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .react-flow__controls-button {
    background: transparent;
    border-bottom: 1px solid var(--border-soft);
    color: #e2e8f0;
    width: 30px; height: 30px;
  }
  .react-flow__controls-button:hover {
    background: rgba(94, 234, 212, 0.15);
    color: #5eead4;
  }
  .react-flow__controls-button svg {
    fill: currentColor;
    max-width: 14px;
    max-height: 14px;
  }
  .react-flow__minimap {
    background: rgba(12, 36, 30, 0.78) !important;
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .react-flow__attribution { display: none; }
  .react-flow__node {
    font-family: 'Manrope', 'Noto Sans TC', sans-serif;
  }
  .react-flow__node.selected > div {
    box-shadow: 0 0 0 2px #5eead4, 0 0 24px rgba(94, 234, 212, 0.35) !important;
  }

  /* Custom node base */
  .flow-node {
    min-width: 200px;
    border-radius: 14px;
    padding: 12px 14px;
    color: #e2e8f0;
    cursor: grab;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    position: relative;
  }
  .flow-node:active { cursor: grabbing; }
  .flow-node:hover { transform: translateY(-1px); }

  .node-start {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.35), rgba(20, 184, 166, 0.55));
    border: 1px solid rgba(94, 234, 212, 0.55);
    box-shadow: 0 8px 22px -10px rgba(16, 185, 129, 0.55);
  }
  .node-process {
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
    border: 1px solid rgba(94, 234, 212, 0.32);
    box-shadow: 0 8px 22px -10px rgba(2, 6, 23, 0.7);
  }
  .node-decision {
    background: linear-gradient(135deg, rgba(251, 113, 133, 0.32), rgba(217, 70, 239, 0.42));
    border: 1px solid rgba(251, 113, 133, 0.6);
    box-shadow: 0 8px 22px -10px rgba(251, 113, 133, 0.55);
  }
  .node-end {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.32), rgba(79, 70, 229, 0.5));
    border: 1px solid rgba(99, 102, 241, 0.6);
    box-shadow: 0 8px 22px -10px rgba(99, 102, 241, 0.55);
  }
  .node-io {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.32), rgba(217, 119, 6, 0.42));
    border: 1px solid rgba(245, 158, 11, 0.55);
    box-shadow: 0 8px 22px -10px rgba(245, 158, 11, 0.5);
  }

  .node-badge {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e2e8f0;
    font-weight: 700;
  }
  .node-title {
    font-size: 14px;
    font-weight: 700;
    margin-top: 8px;
    margin-bottom: 2px;
    letter-spacing: 0.01em;
  }
  .node-desc {
    font-size: 11px;
    color: rgba(226, 232, 240, 0.72);
    line-height: 1.4;
    max-width: 200px;
  }
  .node-meta {
    margin-top: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .node-meta-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.3);
    color: #5eead4;
    border: 1px solid rgba(94, 234, 212, 0.25);
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(94, 234, 212, 0.25);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(94, 234, 212, 0.45); }

  /* Inputs */
  .ff-input {
    width: 100%;
    background: rgba(5, 10, 13, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #e2e8f0;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .ff-input:focus {
    outline: none;
    border-color: #5eead4;
    box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.18);
  }
  .ff-select {
    width: 100%;
    background: rgba(5, 10, 13, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #e2e8f0;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }

  .ff-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    border: 1px solid rgba(94, 234, 212, 0.3);
    background: rgba(45, 212, 191, 0.12);
    color: #5eead4;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ff-btn:hover {
    background: rgba(45, 212, 191, 0.22);
    box-shadow: 0 4px 14px -6px rgba(45, 212, 191, 0.6);
  }
  .ff-btn-ghost {
    background: transparent;
    border-color: rgba(148, 163, 184, 0.2);
    color: #cbd5e1;
  }
  .ff-btn-ghost:hover {
    border-color: rgba(94, 234, 212, 0.4);
    color: #e2e8f0;
    background: rgba(94, 234, 212, 0.06);
  }
  .ff-btn-danger {
    border-color: rgba(251, 113, 133, 0.4);
    background: rgba(251, 113, 133, 0.1);
    color: #fda4af;
  }
  .ff-btn-danger:hover {
    background: rgba(251, 113, 133, 0.22);
    box-shadow: 0 4px 14px -6px rgba(251, 113, 133, 0.6);
  }

  /* Palette item */
  .palette-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(5, 10, 13, 0.4);
    border: 1px solid rgba(148, 163, 184, 0.14);
    cursor: grab;
    transition: all 0.15s;
    margin-bottom: 8px;
  }
  .palette-item:hover {
    border-color: rgba(94, 234, 212, 0.5);
    background: rgba(45, 212, 191, 0.08);
    transform: translateX(2px);
  }
  .palette-item:active { cursor: grabbing; }
  .palette-dot {
    width: 24px; height: 24px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(12, 36, 30, 0.95);
    border: 1px solid rgba(94, 234, 212, 0.4);
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(12px);
    z-index: 1000;
    animation: toast-in 0.25s ease;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  /* Modal */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-body {
    width: min(560px, 90vw);
    max-height: 70vh;
    padding: 22px;
    border-radius: 14px;
    overflow: auto;
  }
  .modal-body pre {
    background: rgba(0, 0, 0, 0.5);
    padding: 14px;
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.6;
    color: #5eead4;
    overflow: auto;
    max-height: 50vh;
    border: 1px solid rgba(94, 234, 212, 0.18);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Helpers */
  .ring-soft { box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
  .text-mute { color: rgba(226, 232, 240, 0.55); }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="grid-overlay"></div>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;
const RF = ReactFlow;
const {
  ReactFlow, ReactFlowProvider,
  Background, Controls, MiniMap,
  addEdge, applyNodeChanges, applyEdgeChanges,
  Handle, Position, useNodesState, useEdgesState,
} = RF;

// ============================================================================
// 1. DESIGN TOKENS & PALETTE
// ============================================================================
const NODE_TYPES = [
  {
    type: 'start',
    label: '起始節點',
    desc: '工作流程的進入點',
    color: 'linear-gradient(135deg, #10b981, #14b8a6)',
    border: '#5eead4',
  },
  {
    type: 'process',
    label: '處理節點',
    desc: '執行具體業務邏輯',
    color: 'linear-gradient(135deg, #1e293b, #0f172a)',
    border: '#5eead4',
  },
  {
    type: 'decision',
    label: '決策節點',
    desc: '條件分支,Yes/No 流程',
    color: 'linear-gradient(135deg, #fb7185, #d946ef)',
    border: '#fb7185',
  },
  {
    type: 'io',
    label: 'I/O 節點',
    desc: '外部資料輸入/輸出',
    color: 'linear-gradient(135deg, #f59e0b, #d97706)',
    border: '#f59e0b',
  },
  {
    type: 'end',
    label: '結束節點',
    desc: '工作流程的終點',
    color: 'linear-gradient(135deg, #6366f1, #4f46e5)',
    border: '#818cf8',
  },
];

const TYPE_LABEL = Object.fromEntries(NODE_TYPES.map(n => [n.type, n.label]));

// ============================================================================
// 2. CUSTOM NODE COMPONENT
// ============================================================================
function FlowNode({ data, selected }) {
  const { type, title, desc, meta } = data;
  const klass = `flow-node node-${type}`;

  const isDecision = type === 'decision';

  return (
    <div className={klass}>
      {/* Handles */}
      <Handle type="target" position={Position.Left}  style={{ top: '50%' }} id="in" />
      <Handle type="source" position={Position.Right} style={{ top: '50%' }} id="out" />
      {isDecision && (
        <>
          <Handle type="source" position={Position.Bottom} id="out-no"
                  style={{ background: '#fb7185', left: '35%' }} />
          <Handle type="source" position={Position.Bottom} id="out-yes"
                  style={{ background: '#5eead4', left: '65%' }} />
        </>
      )}

      <span className="node-badge">{TYPE_LABEL[type] || type}</span>
      <div className="node-title">{title}</div>
      {desc && <div className="node-desc">{desc}</div>}

      {meta && meta.length > 0 && (
        <div className="node-meta">
          {meta.map((m, i) => (
            <span key={i} className="node-meta-item">{m}</span>
          ))}
        </div>
      )}

      <div style={{
        position: 'absolute', bottom: 4, right: 8,
        fontFamily: 'IBM Plex Mono, monospace',
        fontSize: 9, color: 'rgba(226,232,240,0.4)'
      }}>
        #{data.nodeId || '?'}
      </div>
    </div>
  );
}

const nodeTypes = { flowNode: FlowNode };

// ============================================================================
// 3. PALETTE (DRAG SOURCE)
// ============================================================================
function Palette({ onAddAtCenter }) {
  return (
    <div>
      <div className="text-mute text-xs uppercase tracking-widest mb-3 font-semibold">
        節點元件庫
      </div>
      {NODE_TYPES.map(n => (
        <div
          key={n.type}
          className="palette-item"
          draggable
          onDragStart={(e) => {
            e.dataTransfer.setData('application/flowforge-node-type', n.type);
            e.dataTransfer.effectAllowed = 'copy';
          }}
          onDoubleClick={() => onAddAtCenter(n.type)}
          title={`拖拉到畫布 / 雙擊新增 (${n.label})`}
        >
          <div className="palette-dot" style={{ background: n.color }} />
          <div className="flex-1 min-w-0">
            <div className="text-sm font-semibold text-slate-100">{n.label}</div>
            <div className="text-xs text-mute truncate">{n.desc}</div>
          </div>
        </div>
      ))}
      <div className="mt-4 p-3 rounded-lg text-xs text-mute glass-soft leading-relaxed">
        <div className="font-semibold text-slate-300 mb-1">💡 操作提示</div>
        拖拉節點到畫布 ・ 雙擊節點空白處新增 ・ 拖曳節點右上 handle 連線 ・ 滑鼠滾輪縮放
      </div>
    </div>
  );
}

// ============================================================================
// 4. PROPERTY INSPECTOR
// ============================================================================
function Inspector({ node, onChange, onDelete }) {
  if (!node) {
    return (
      <div className="text-center text-mute mt-10 px-4">
        <div className="text-4xl mb-3 opacity-40">◎</div>
        <div className="text-sm">選取一個節點</div>
        <div className="text-xs mt-1">即可在右側編輯屬性</div>
      </div>
    );
  }

  const { data } = node;
  const update = (patch) => onChange(node.id, { ...data, ...patch });

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <span className="node-badge">{TYPE_LABEL[data.type] || data.type}</span>
        <span className="text-xs text-mute font-mono">{node.id.slice(0, 8)}</span>
      </div>

      <label className="block text-xs text-mute uppercase tracking-wider mb-1 mt-3">
        標題
      </label>
      <input
        className="ff-input"
        value={data.title || ''}
        onChange={(e) => update({ title: e.target.value })}
      />

      <label className="block text-xs text-mute uppercase tracking-wider mb-1 mt-3">
        說明
      </label>
      <textarea
        className="ff-input"
        rows={3}
        value={data.desc || ''}
        onChange={(e) => update({ desc: e.target.value })}
      />

      <label className="block text-xs text-mute uppercase tracking-wider mb-1 mt-3">
        節點類型
      </label>
      <select
        className="ff-select"
        value={data.type}
        onChange={(e) => update({ type: e.target.value })}
      >
        {NODE_TYPES.map(n => (
          <option key={n.type} value={n.type}>{n.label}</option>
        ))}
      </select>

      <label className="block text-xs text-mute uppercase tracking-wider mb-1 mt-3">
        標籤 (逗號分隔)
      </label>
      <input
        className="ff-input font-mono"
        value={(data.meta || []).join(', ')}
        onChange={(e) => update({
          meta: e.target.value.split(',').map(s => s.trim()).filter(Boolean)
        })}
      />

      <label className="block text-xs text-mute uppercase tracking-wider mb-1 mt-3">
        負責人 / 角色
      </label>
      <input
        className="ff-input"
        value={data.assignee || ''}
        onChange={(e) => update({ assignee: e.target.value })}
      />

      <label className="block text-xs text-mute uppercase tracking-wider mb-1 mt-3">
        狀態
      </label>
      <select
        className="ff-select"
        value={data.status || 'todo'}
        onChange={(e) => update({ status: e.target.value })}
      >
        <option value="todo">待辦 (To Do)</option>
        <option value="doing">執行中 (In Progress)</option>
        <option value="done">完成 (Done)</option>
        <option value="blocked">阻塞 (Blocked)</option>
      </select>

      <div className="mt-5 pt-4 border-t border-slate-700/40">
        <button
          className="ff-btn ff-btn-danger w-full justify-center"
          onClick={() => onDelete(node.id)}
        >
          ✕ 刪除此節點
        </button>
      </div>
    </div>
  );
}

// ============================================================================
// 5. TOP TOOLBAR
// ============================================================================
function Toolbar({ stats, onSave, onLoad, onExport, onImport, onClear, onFit }) {
  return (
    <div className="flex items-center gap-2 px-4 py-3">
      <div className="flex items-center gap-2 mr-2">
        <div className="w-8 h-8 rounded-lg flex items-center justify-center"
             style={{background: 'linear-gradient(135deg, #2dd4bf, #14b8a6)', boxShadow:'0 0 14px rgba(45,212,191,0.5)'}}>
          <span style={{color:'#0a0f14',fontWeight:800,fontSize:18}}>▣</span>
        </div>
        <div>
          <div className="font-bold text-base text-slate-100 leading-none">FlowForge</div>
          <div className="text-[10px] uppercase tracking-widest text-mute font-semibold">
            Dynamic Workflow Designer
          </div>
        </div>
      </div>

      <div className="flex-1 flex justify-center gap-2">
        <button className="ff-btn" onClick={onSave} title="下載 JSON 工作流定義">⬇ 儲存</button>
        <button className="ff-btn ff-btn-ghost" onClick={onLoad} title="讀取已存檔的 JSON">⬆ 讀檔</button>
        <button className="ff-btn ff-btn-ghost" onClick={onExport} title="檢視 JSON">⊕ 匯出</button>
        <button className="ff-btn ff-btn-ghost" onClick={onImport} title="匯入 JSON">↥ 匯入</button>
        <button className="ff-btn ff-btn-ghost" onClick={onFit} title="縮放到全覽">⛶ 適配視圖</button>
        <button className="ff-btn ff-btn-danger ml-2" onClick={onClear} title="清空畫布">✕ 清空</button>
      </div>

      <div className="flex gap-2 ml-2">
        <div className="px-3 py-1.5 rounded-md glass-soft text-xs">
          <span className="text-mute">節點</span>
          <span className="text-nimbus-400 font-bold ml-1.5 font-mono">{stats.nodes}</span>
        </div>
        <div className="px-3 py-1.5 rounded-md glass-soft text-xs">
          <span className="text-mute">連線</span>
          <span className="text-ember font-bold ml-1.5 font-mono">{stats.edges}</span>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// 6. MAIN CANVAS APP
// ============================================================================
function FlowCanvas() {
  const reactFlowWrapper = useRef(null);
  const fileInputRef = useRef(null);
  const [rfInstance, setRfInstance] = useState(null);
  const [nodes, setNodes] = useNodesState([]);
  const [edges, setEdges] = useEdgesState([]);
  const [selectedNode, setSelectedNode] = useState(null);
  const [selectedEdge, setSelectedEdge] = useState(null);
  const [toast, setToast]     = useState(null);
  const [showJson, setShowJson] = useState(false);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }, []);

  // --- Initial demo data (laoded on first mount) ---
  useEffect(() => {
    const initial = {
      nodes: [
        {
          id: 'n1', type: 'flowNode', position: { x: 40, y: 100 },
          data: { type: 'start', title: '使用者登入', desc: '接收登入請求',
                  meta: ['auth', 'gateway'], assignee: 'gateway', status: 'doing', nodeId: 1 }
        },
        {
          id: 'n2', type: 'flowNode', position: { x: 320, y: 100 },
          data: { type: 'process', title: '驗證憑證', desc: '比對帳號密碼 / Token',
                  meta: ['jwt', 'bcrypt'], assignee: 'auth-svc', status: 'doing', nodeId: 2 }
        },
        {
          id: 'n3', type: 'flowNode', position: { x: 600, y: 60 },
          data: { type: 'decision', title: '憑證有效?', desc: '判斷是否通過驗證',
                  meta: ['if-else'], assignee: 'router', status: 'todo', nodeId: 3 }
        },
        {
          id: 'n4', type: 'flowNode', position: { x: 900, y: -60 },
          data: { type: 'process', title: '建立 Session', desc: '產生 session_id 並回傳',
                  meta: ['redis', 'cookie'], assignee: 'session-svc', status: 'todo', nodeId: 4 }
        },
        {
          id: 'n5', type: 'flowNode', position: { x: 900, y: 160 },
          data: { type: 'io', title: '回傳 401', desc: '寫入 audit log',
                  meta: ['audit', 'log'], assignee: 'logger', status: 'todo', nodeId: 5 }
        },
        {
          id: 'n6', type: 'flowNode', position: { x: 1200, y: -60 },
          data: { type: 'end', title: '進入 Dashboard', desc: '登入成功後跳轉',
                  meta: ['/home'], assignee: 'frontend', status: 'todo', nodeId: 6 }
        },
      ],
      edges: [
        { id: 'e1-2', source: 'n1', target: 'n2', type: 'smoothstep',
          label: 'request', animated: true },
        { id: 'e2-3', source: 'n2', target: 'n3', type: 'smoothstep',
          label: 'verified' },
        { id: 'e3-4', source: 'n3', target: 'n4', sourceHandle: 'out-yes',
          type: 'smoothstep', label: 'Yes', animated: true },
        { id: 'e3-5', source: 'n3', target: 'n5', sourceHandle: 'out-no',
          type: 'smoothstep', label: 'No', style: { stroke: '#fb7185' } },
        { id: 'e4-6', source: 'n4', target: 'n6', type: 'smoothstep',
          label: 'redirect', animated: true },
      ],
    };
    setNodes(initial.nodes);
    setEdges(initial.edges);
  }, []);

  // --- Sync selectedNode whenever nodes change ---
  useEffect(() => {
    if (selectedNode) {
      const fresh = nodes.find(n => n.id === selectedNode.id);
      if (fresh) setSelectedNode(fresh);
    }
  }, [nodes]);

  // --- Handlers ---
  const onNodesChange = useCallback((changes) => {
    setNodes((nds) => applyNodeChanges(changes, nds));
  }, [setNodes]);

  const onEdgesChange = useCallback((changes) => {
    setEdges((eds) => applyEdgeChanges(changes, eds));
  }, [setEdges]);

  const onConnect = useCallback((params) => {
    // auto-add default label
    const newEdge = {
      ...params,
      type: 'smoothstep',
      animated: true,
      label: params.sourceHandle === 'out-yes' ? 'Yes'
           : params.sourceHandle === 'out-no'  ? 'No'
           : 'flow',
    };
    setEdges((eds) => addEdge(newEdge, eds));
  }, [setEdges]);

  const onNodeClick = useCallback((_, node) => {
    setSelectedNode(node);
    setSelectedEdge(null);
  }, []);

  const onEdgeClick = useCallback((_, edge) => {
    setSelectedEdge(edge);
    setSelectedNode(null);
  }, []);

  const onPaneClick = useCallback(() => {
    setSelectedNode(null);
    setSelectedEdge(null);
  }, []);

  const onDragOver = useCallback((e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  }, []);

  const onDrop = useCallback((e) => {
    e.preventDefault();
    const type = e.dataTransfer.getData('application/flowforge-node-type');
    if (!type || !reactFlowWrapper.current || !rfInstance) return;

    const bounds = reactFlowWrapper.current.getBoundingClientRect();
    const position = rfInstance.screenToFlowPosition({
      x: e.clientX - bounds.left,
      y: e.clientY - bounds.top,
    });

    const newNode = createNode(type, position, nodes.length + 1);
    setNodes((nds) => nds.concat(newNode));
    showToast(`✓ 已新增「${TYPE_LABEL[type]}」`);
  }, [rfInstance, nodes, setNodes, showToast]);

  const createNode = (type, position, nodeId) => ({
    id: `n_${Math.random().toString(36).slice(2, 9)}`,
    type: 'flowNode',
    position,
    data: {
      type,
      title: `新${TYPE_LABEL[type]}`,
      desc: '',
      meta: [],
      assignee: '',
      status: 'todo',
      nodeId,
    }
  });

  const addNodeAtCenter = useCallback((type) => {
    if (!rfInstance) return;
    const vp = rfInstance.getViewport();
    const cx = (window.innerWidth / 2 - vp.x) / vp.zoom - 100;
    const cy = (window.innerHeight / 2 - vp.y) / vp.zoom - 30;
    const newNode = createNode(type, { x: cx, y: cy }, nodes.length + 1);
    setNodes((nds) => nds.concat(newNode));
    setSelectedNode(newNode);
    showToast(`✓ 已新增「${TYPE_LABEL[type]}」`);
  }, [rfInstance, nodes, setNodes, showToast, setSelectedNode]);

  const handleNodeDataChange = useCallback((id, newData) => {
    setNodes((nds) => nds.map(n => n.id === id
      ? { ...n, data: newData } : n));
  }, [setNodes]);

  const deleteNode = useCallback((id) => {
    setNodes((nds) => nds.filter(n => n.id !== id));
    setEdges((eds) => eds.filter(e => e.source !== id && e.target !== id));
    setSelectedNode(null);
    showToast('✕ 節點已刪除');
  }, [setNodes, setEdges, showToast]);

  const deleteEdge = useCallback((id) => {
    setEdges((eds) => eds.filter(e => e.id !== id));
    setSelectedEdge(null);
    showToast('✕ 連線已刪除');
  }, [setEdges, showToast]);

  // --- Toolbar actions ---
  const handleSave = useCallback(() => {
    const data = {
      version: '1.0',
      savedAt: new Date().toISOString(),
      nodes,
      edges,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `flowforge-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('⬇ 工作流已下載為 JSON');
  }, [nodes, edges, showToast]);

  const handleLoad = () => fileInputRef.current?.click();

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data.nodes) && Array.isArray(data.edges)) {
          setNodes(data.nodes);
          setEdges(data.edges);
          showToast(`⬆ 載入成功 (${data.nodes.length} 節點 / ${data.edges.length} 連線)`);
        } else {
          showToast('⚠ 檔案格式錯誤');
        }
      } catch {
        showToast('⚠ JSON 解析失敗');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const handleClear = useCallback(() => {
    if (nodes.length === 0) return;
    if (!confirm('確認清空所有節點與連線?')) return;
    setNodes([]);
    setEdges([]);
    setSelectedNode(null);
    showToast('✕ 畫布已清空');
  }, [nodes, setNodes, setEdges, showToast]);

  const handleFitView = useCallback(() => {
    rfInstance?.fitView({ padding: 0.2, duration: 400, maxZoom: 1.0, minZoom: 0.2 });
  }, [rfInstance]);

  const stats = useMemo(() => ({ nodes: nodes.length, edges: edges.length }), [nodes, edges]);

  // --- Edge label editing ---
  const updateEdgeLabel = (id, label) => {
    setEdges((eds) => eds.map(e => e.id === id ? { ...e, label } : e));
  };

  return (
    <div className="w-screen h-screen relative z-10 flex flex-col">
      <div className="glass-strong z-20" style={{ borderBottom: '1px solid var(--border)' }}>
        <Toolbar
          stats={stats}
          onSave={handleSave}
          onLoad={handleLoad}
          onExport={() => setShowJson(true)}
          onImport={handleLoad}
          onClear={handleClear}
          onFit={handleFitView}
        />
      </div>

      <div className="flex-1 flex overflow-hidden">
        {/* LEFT: Palette */}
        <div className="glass-strong overflow-y-auto p-4"
             style={{ width: 240, borderRight: '1px solid var(--border)' }}>
          <Palette onAddAtCenter={addNodeAtCenter} />
        </div>

        {/* CENTER: Canvas */}
        <div className="flex-1 relative" ref={reactFlowWrapper}>
          <ReactFlow
            nodes={nodes}
            edges={edges}
            onNodesChange={onNodesChange}
            onEdgesChange={onEdgesChange}
            onConnect={onConnect}
            onInit={setRfInstance}
            onDrop={onDrop}
            onDragOver={onDragOver}
            onNodeClick={onNodeClick}
            onEdgeClick={onEdgeClick}
            onPaneClick={onPaneClick}
            nodeTypes={nodeTypes}
            fitView
            fitViewOptions={{ padding: 0.2, maxZoom: 1.0 }}
            minZoom={0.2}
            maxZoom={2}
            defaultEdgeOptions={{ type: 'smoothstep' }}
            connectionLineStyle={{ stroke: '#fb7185', strokeWidth: 2 }}
            connectionLineType="smoothstep"
            proOptions={{ hideAttribution: true }}
          >
            <Background
              color="rgba(94, 234, 212, 0.08)"
              gap={24}
              size={1}
            />
            <Controls position="bottom-right" />
            <MiniMap
              position="bottom-left"
              nodeColor={(n) => {
                const t = n?.data?.type;
                return ({
                  start: '#10b981',
                  process: '#64748b',
                  decision: '#fb7185',
                  io: '#f59e0b',
                  end: '#6366f1',
                })[t] || '#5eead4';
              }}
              maskColor="rgba(5, 10, 13, 0.7)"
              pannable
              zoomable
            />
          </ReactFlow>

          {/* Helper hint */}
          <div className="absolute top-4 left-1/2 -translate-x-1/2 z-10
                          px-3 py-1.5 rounded-full glass-soft text-xs text-mute">
            ⌘ 拖拉節點建立流程 ・ Delete 鍵移除選取元素
          </div>
        </div>

        {/* RIGHT: Inspector */}
        <div className="glass-strong overflow-y-auto p-4"
             style={{ width: 320, borderLeft: '1px solid var(--border)' }}>
          {selectedEdge ? (
            <div>
              <div className="text-xs uppercase tracking-widest text-mute mb-3 font-semibold">
                連線屬性
              </div>
              <div className="text-xs text-mute mb-1">連線 ID</div>
              <div className="font-mono text-xs text-slate-300 mb-3 truncate">{selectedEdge.id}</div>

              <label className="block text-xs text-mute uppercase tracking-wider mb-1">
                標籤 (流程條件)
              </label>
              <input
                className="ff-input"
                value={selectedEdge.label || ''}
                onChange={(e) => updateEdgeLabel(selectedEdge.id, e.target.value)}
              />

              <label className="flex items-center gap-2 mt-3 text-sm cursor-pointer">
                <input
                  type="checkbox"
                  checked={!!selectedEdge.animated}
                  onChange={(e) => setEdges((eds) =>
                    eds.map(ed => ed.id === selectedEdge.id
                      ? { ...ed, animated: e.target.checked } : ed)
                  )}
                />
                <span>流動動畫</span>
              </label>

              <button
                className="ff-btn ff-btn-danger w-full justify-center mt-5"
                onClick={() => deleteEdge(selectedEdge.id)}
              >
                ✕ 刪除此連線
              </button>
            </div>
          ) : (
            <>
              <div className="flex items-center justify-between mb-3">
                <div className="text-xs uppercase tracking-widest text-mute font-semibold">
                  屬性面板
                </div>
                <div className="text-[10px] text-mute font-mono">
                  {selectedNode ? 'SELECTED' : 'IDLE'}
                </div>
              </div>
              <Inspector
                node={selectedNode}
                onChange={handleNodeDataChange}
                onDelete={deleteNode}
              />
            </>
          )}
        </div>
      </div>

      {/* Hidden file input */}
      <input
        ref={fileInputRef}
        type="file"
        accept=".json,application/json"
        style={{ display: 'none' }}
        onChange={handleFile}
      />

      {/* Toast */}
      {toast && <div className="toast">{toast}</div>}

      {/* JSON Modal */}
      {showJson && (
        <div className="modal-mask" onClick={() => setShowJson(false)}>
          <div className="modal-body glass-strong" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-semibold">JSON 定義 / 可複製到剪貼簿</div>
              <button
                className="ff-btn ff-btn-ghost"
                onClick={() => {
                  navigator.clipboard.writeText(JSON.stringify({nodes, edges}, null, 2));
                  showToast('✓ 已複製到剪貼簿');
                }}
              >
                ⧉ 複製
              </button>
            </div>
            <pre>{JSON.stringify({nodes, edges}, null, 2)}</pre>
            <div className="text-xs text-mute mt-3">
              按 <kbd className="px-1.5 py-0.5 rounded bg-slate-700">Esc</kbd> 關閉
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================================
// 7. APP ROOT
// ============================================================================
function App() {
  return (
    <ReactFlowProvider>
      <FlowCanvas />
    </ReactFlowProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
