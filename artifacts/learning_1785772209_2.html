<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar Automation</title><style>:root{font-family:Inter,system-ui;color:#172038;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:40px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#e5f8ed;color:#137a43;padding:7px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:360px 1fr;gap:24px;margin-top:25px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px;box-shadow:0 10px 30px #24345b0d}label{display:block;font-size:13px;color:#59647b;margin:14px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid #ced5e3;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:#3455db;color:white;margin-top:15px}.event{border-left:4px solid #3455db;padding:12px 15px;margin:12px 0;background:#f7f9ff;border-radius:8px}.event small{color:#69748a}.danger{background:#fff;color:#b3261e;border:1px solid #f0c8c5;padding:6px 9px;margin:7px 0 0}.notice{padding:9px 0;border-bottom:1px solid #edf0f5}.error{color:#b3261e}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><div><h1>事件自動化管理</h1><p>FastAPI × Google Calendar API</p></div><span id="status" class="badge">連線中</span></div><section class="grid"><form id="form" class="card"><h2>建立事件</h2><label>標題</label><input id="summary" required value="專案進度會議"><label>開始時間</label><input id="start" type="datetime-local" required><label>結束時間</label><input id="end" type="datetime-local"><label>說明</label><textarea id="description">自動建立並寄送 Google Calendar 提醒</textarea><label>參與者 Email（逗號分隔）</label><input id="attendees" placeholder="team@example.com"><button>建立並通知</button><p id="msg"></p></form><div><section class="card"><h2>近期事件</h2><div id="events">載入中…</div></section><section class="card" style="margin-top:20px"><h2>通知中心</h2><div id="notifications">尚無通知</div></section></div></section></main><script>const api='';const $=x=>document.getElementById(x);function init(){let d=new Date(Date.now()+3600000);$('start').value=d.toISOString().slice(0,16);$('end').value=new Date(+d+3600000).toISOString().slice(0,16);load()}async function req(path,opt){let r=await fetch(api+path,opt),body=r.status===204?null:await r.json();if(!r.ok)throw Error(body.detail||'請求失敗');return body}async function load(){try{let h=await req('/health');$('status').textContent=h.mode==='google'?'Google 已連線':'本機 Demo 模式';let e=await req('/api/events');$('events').innerHTML=e.data.length?e.data.map(x=>`<div class="event"><b>${esc(x.summary)}</b><br><small>${esc(x.start?.dateTime||'')}</small><br><button class="danger" onclick="del('${x.id}')">取消</button></div>`).join(''):'尚無事件';let n=await req('/api/notifications');$('notifications').innerHTML=n.data.length?n.data.map(x=>`<div class="notice">${esc(x.message)}</div>`).join(''):'尚無通知'}catch(e){$('status').textContent='離線';$('events').innerHTML='<p class=error>'+esc(e.message)+'</p>'}}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='處理中…';try{await req('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary:$('summary').value,start:new Date($('start').value).toISOString(),end:$('end').value?new Date($('end').value).toISOString():null,description:$('description').value,attendees:$('attendees').value.split(',').map(x=>x.trim()).filter(Boolean)})});$('msg').textContent='事件已建立';load()}catch(x){$('msg').className='error';$('msg').textContent=x.message}};async function del(id){await req('/api/events/'+id,{method:'DELETE'});load()}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init()</script></body></html>
