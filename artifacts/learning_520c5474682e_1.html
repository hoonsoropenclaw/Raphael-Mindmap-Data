<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glassmorphism × Framer Motion · 高質感 + 60fps</title>
<style>
  /* =========================================================
     BASE
     ========================================================= */
  :root{
    --bg-0:#0a0e27;
    --ink:#e9ecff;
    --ink-dim:#aab1d6;
    --accent-1:#7aa2ff;
    --accent-2:#b18cff;
    --accent-3:#ff7ad9;
    --glass-bg:rgba(255,255,255,.08);
    --glass-stroke:rgba(255,255,255,.18);
    --glass-stroke-strong:rgba(255,255,255,.32);
    --shadow-1:0 10px 30px rgba(0,0,0,.25);
    --shadow-2:0 20px 60px rgba(0,0,0,.35);
    --radius-lg:24px;
    --ease-out-expo:cubic-bezier(.16,1,.3,1);
    --ease-out-quart:cubic-bezier(.25,1,.5,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow-x:hidden}

  /* =========================================================
     ANIMATED MESH BACKGROUND (CSS only, GPU-friendly)
     ========================================================= */
  .mesh{position:fixed;inset:-10vh -10vw;z-index:-1;overflow:hidden;
    background:
      radial-gradient(60vmax 60vmax at 20% 30%, #4f6cff 0%, transparent 60%),
      radial-gradient(50vmax 50vmax at 80% 20%, #b18cff 0%, transparent 60%),
      radial-gradient(55vmax 55vmax at 60% 80%, #ff7ad9 0%, transparent 60%),
      var(--bg-0);
    filter:saturate(1.15);
  }
  .mesh::before,.mesh::after{
    content:"";position:absolute;inset:-20%;border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,255,255,.18), transparent 70%);
    filter:blur(40px);will-change:transform;
  }
  .mesh::before{animation:drift-a 22s var(--ease-out-expo) infinite alternate;}
  .mesh::after {animation:drift-b 28s var(--ease-out-expo) infinite alternate;}
  @keyframes drift-a{
    0%   {transform:translate3d(-10%,-5%,0) scale(1)}
    100% {transform:translate3d(15%,10%,0)  scale(1.2)}
  }
  @keyframes drift-b{
    0%   {transform:translate3d(10%,5%,0)  scale(1.1)}
    100% {transform:translate3d(-15%,-10%,0) scale(.9)}
  }
  .grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>");
  }

  /* =========================================================
     LAYOUT
     ========================================================= */
  .stage{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:64px 28px 96px}
  header.hero{display:grid;gap:12px;margin-bottom:36px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-3);box-shadow:0 0 12px var(--accent-3)}
  h1{font-size:clamp(34px,4.4vw,52px);line-height:1.05;margin:0;letter-spacing:-.02em;
    background:linear-gradient(120deg,#fff 0%,#cdd6ff 40%,#b18cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.lede{color:var(--ink-dim);max-width:60ch;margin:0;font-size:17px}

  .grid{display:grid;gap:20px;grid-template-columns:repeat(12,1fr);margin-top:28px}
  .col-3{grid-column:span 3} .col-4{grid-column:span 4} .col-6{grid-column:span 6}
  .col-8{grid-column:span 8} .col-12{grid-column:span 12}
  @media (max-width:900px){.col-3,.col-4,.col-6,.col-8,.col-12{grid-column:span 12}}

  /* =========================================================
     GLASS CARD
     ========================================================= */
  .glass{
    position:relative;border-radius:var(--radius-lg);
    background:var(--glass-bg);
    border:1px solid var(--glass-stroke);
    box-shadow:var(--shadow-1), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    overflow:hidden;
    transform:translateZ(0);
  }
  .glass::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,.18) 35%, transparent 60%);
    transform:translateX(-110%);
    transition:transform .8s var(--ease-out-expo);
  }
  .glass:hover::after{transform:translateX(110%)}
  .glass .body{padding:22px 22px 20px;display:grid;gap:12px}
  .glass h3{margin:0;font-size:18px;letter-spacing:-.01em}
  .glass p{margin:0;color:var(--ink-dim);font-size:14px}
  .glass .meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-dim)}

  .glass.tinted-blue{background:linear-gradient(140deg, rgba(122,162,255,.18), rgba(255,255,255,.06))}
  .glass.tinted-violet{background:linear-gradient(140deg, rgba(177,140,255,.18), rgba(255,255,255,.06))}
  .glass.tinted-pink{background:linear-gradient(140deg, rgba(255,122,217,.18), rgba(255,255,255,.06))}
  .glass.strong{border-color:var(--glass-stroke-strong);box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.28)}

  /* Hero Card */
  .hero-card{padding:28px;border-radius:28px;min-height:220px;
    background:linear-gradient(140deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border:1px solid var(--glass-stroke-strong);
    box-shadow:var(--shadow-2), inset 0 1px 0 rgba(255,255,255,.32);
    backdrop-filter:blur(22px) saturate(1.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);
    display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:stretch;
  }
  .hero-card .visual{position:relative;border-radius:18px;background:
      radial-gradient(60% 60% at 30% 30%, rgba(122,162,255,.6), transparent 60%),
      radial-gradient(60% 60% at 70% 70%, rgba(255,122,217,.55), transparent 60%),
      rgba(255,255,255,.05);
    overflow:hidden;
  }
  .hero-card .visual::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,.18) 30deg, transparent 60deg);animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero-card h2{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.02em}
  .hero-card .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
  .kpi{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--glass-stroke)}
  .kpi b{display:block;font-size:22px;letter-spacing:-.01em}
  .kpi span{font-size:11px;color:var(--ink-dim);letter-spacing:.12em;text-transform:uppercase}
  @media (max-width:900px){.hero-card{grid-template-columns:1fr}}

  .icon-wrap{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:rgba(255,255,255,.1);border:1px solid var(--glass-stroke);font-size:20px}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));border-radius:inherit}

  /* Switch */
  .switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .switch input{display:none}
  .switch .track{width:42px;height:24px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--glass-stroke);position:relative;transition:background .25s var(--ease-out-quart)}
  .switch .knob{position:absolute;top:50%;left:2px;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .25s var(--ease-out-quart)}
  .switch input:checked + .track{background:linear-gradient(90deg, var(--accent-1), var(--accent-3))}
  .switch input:checked + .track .knob{transform:translate(18px,-50%)}

  /* HUD */
  .hud{position:fixed;top:14px;right:14px;z-index:99;display:flex;gap:8px;align-items:center;
    padding:10px 14px;border-radius:12px;font-size:12px;font-variant-numeric:tabular-nums;
    background:rgba(10,14,39,.6);border:1px solid var(--glass-stroke);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .hud .fps{font-weight:700;letter-spacing:.04em}
  .hud .fps.good{color:#7CFFB2}
  .hud .fps.ok{color:#FFD27A}
  .hud .fps.bad{color:#FF7A9C}
  .hud .label{color:var(--ink-dim);letter-spacing:.16em;text-transform:uppercase;font-size:10px}

  /* Cursor glow */
  .cursor-glow{position:fixed;left:0;top:0;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(122,162,255,.35), transparent 70%);
    pointer-events:none;z-index:0;
    transform:translate3d(-50%,-50%,0);
    mix-blend-mode:screen;
  }

  /* Body switch state — 當 reduced motion 開啟, 關掉所有非必要動畫 */
  body[data-reduced="1"] .mesh::before,
  body[data-reduced="1"] .mesh::after,
  body[data-reduced="1"] .hero-card .visual::after{animation:none !important}
  body[data-reduced="1"] .glass::after{transition:none !important;transform:translateX(-110%) !important}

  @media (prefers-reduced-motion: reduce){
    .mesh::before,.mesh::after,.hero-card .visual::after{animation:none !important}
  }
</style>
</head>
<body>
  <div class="mesh" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
  <div id="hud" class="hud" aria-live="polite" style="opacity:0">FPS · MS</div>

  <main class="stage">
    <header class="hero">
      <span class="eyebrow"><span class="dot"></span>Framer Motion × Glassmorphism</span>
      <h1>高質感玻璃介面，<br>60fps 不掉幀</h1>
      <p class="lede">使用 React + Framer Motion（<code>m</code> 元件 + LazyMotion）以最小 bundle 載入，動畫僅觸碰 <code>transform</code> / <code>opacity</code>，並用 <code>useMotionValue</code> 繞過 React re-render，維持穩定 60fps。</p>
    </header>

    <div id="grid"></div>

    <div class="cta-wrap" style="margin-top:12px;max-width:1180px;margin-left:auto;margin-right:auto;padding:0 28px">
      <div id="ctaBody"></div>
    </div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "framer-motion": "https://esm.sh/framer-motion@11.11.17?deps=react@18.3.1,react-dom@18.3.1"
    }
  }
  </script>

  <script type="module">
    import React, { useEffect, useRef, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      LazyMotion, domAnimation, m, useMotionValue, useSpring, useTransform, animate
    } from 'framer-motion';

    const h = React.createElement;
    const useCallback = React.useCallback;

    /* =========================================================
       1. GlassCard — Hover 視差 (transform-only)
       ========================================================= */
    function GlassCard({ children, className = '', tint = '' }) {
      const ref = useRef(null);
      const rotX = useSpring(useMotionValue(0), { stiffness: 220, damping: 18, mass: .4 });
      const rotY = useSpring(useMotionValue(0), { stiffness: 220, damping: 18, mass: .4 });

      const onMove = useCallback((e) => {
        const r = ref.current.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;
        const py = (e.clientY - r.top) / r.height;
        rotY.set((px - .5) * 10);
        rotX.set(-(py - .5) * 10);
      }, [rotX, rotY]);

      const onLeave = useCallback(() => {
        rotX.set(0); rotY.set(0);
      }, [rotX, rotY]);

      return h(m.div, {
        ref,
        className: `glass ${tint} ${className}`,
        style: {
          rotateX: rotX, rotateY: rotY,
          transformStyle: 'preserve-3d',
          transformPerspective: 1000,
        },
        onMouseMove: onMove,
        onMouseLeave: onLeave,
        whileHover: { scale: 1.015 },
        whileTap:   { scale: .985 },
        transition: { type: 'spring', stiffness: 260, damping: 22 },
      }, h('div', { className: 'body' }, children));
    }

    /* =========================================================
       2. 6 種卡片資料
       ========================================================= */
    const CARDS = [
      { id:'a', tint:'tinted-blue',   span:4, icon:'🪟', title:'Backdrop Filter', body:'玻璃模糊的核心：backdrop-filter + 半透明邊框 + 內陰影高光。', bar:88, meta:'GPU · Layer · 60fps' },
      { id:'b', tint:'tinted-violet', span:4, icon:'✨', title:'Transform-only', body:'只動 transform / opacity — 不動 backdrop-filter 或 box-shadow。', bar:72, meta:'No Repaint · No Reflow' },
      { id:'c', tint:'tinted-pink',   span:4, icon:'🎯', title:'MotionValue', body:'useMotionValue 直接寫到 DOM，繞過 React render tree。', bar:94, meta:'0 Re-render · 60fps Lock' },
      { id:'d', tint:'',              span:6, icon:'🪶', title:'LazyMotion + m', body:'m 元件是 motion 的 tree-shake 版，只載入 domAnimation，bundle -80%。', bar:65, meta:'Tree-shake · Tiny' },
      { id:'e', tint:'strong',        span:6, icon:'🌀', title:'Spring Physics', body:'stiffness / damping / mass 三參數決定觸感，比 easing 更自然。', bar:80, meta:'Natural · Bouncy' },
    ];

    /* =========================================================
       3. Grid — stagger 進場
       ========================================================= */
    function Grid() {
      return h(m.section, {
        className: 'grid',
        initial: 'hidden',
        animate: 'show',
        variants: {
          hidden: {},
          show: { transition: { staggerChildren: .08, delayChildren: .1 } }
        }
      },
        ...CARDS.map(c =>
          h(m.div, {
            key: c.id,
            style: { gridColumn: `span ${c.span}` },
            variants: {
              hidden: { opacity: 0, y: 24, filter: 'blur(8px)' },
              show:   { opacity: 1, y: 0,  filter: 'blur(0px)',
                        transition: { duration: .7, ease: [.16,1,.3,1] } }
            }
          },
            h(GlassCard, { tint: c.tint, className: c.id === 'e' ? 'strong' : '' },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
                h('div', { className: 'icon-wrap' }, c.icon),
                h('h3', null, c.title)
              ),
              h('p', null, c.body),
              h('div', { className: 'bar' }, h('i', { style: { width: c.bar + '%' } })),
              h('div', { className: 'meta' },
                h('span', null, c.meta),
                h('span', null, c.bar + '%')
              )
            )
          )
        ),
        h(HeroCard)
      );
    }

    /* =========================================================
       4. Hero Card + AnimatedNumber
       ========================================================= */
    function AnimatedNumber({ to, dur = 1.4 }) {
      const mv = useMotionValue(0);
      const spring = useSpring(mv, { stiffness: 60, damping: 18 });
      const [val, setVal] = useState(0);
      useEffect(() => {
        const controls = animate(mv, to, { duration: dur, ease: [.16,1,.3,1] });
        const unsub = spring.on('change', v => setVal(Math.round(v)));
        return () => { if (controls.stop) controls.stop(); unsub(); };
      }, [to, dur, mv, spring]);
      return h('b', null, val);
    }

    function HeroCard() {
      return h(m.div, {
        className: 'hero-card col-12',
        style: { gridColumn: 'span 12' },
        initial: { opacity: 0, y: 30, filter: 'blur(10px)' },
        animate: { opacity: 1, y: 0,  filter: 'blur(0px)' },
        transition: { duration: .9, ease: [.16,1,.3,1], delay: .4 }
      },
        h('div', null,
          h('h2', null, 'Glassmorphism 質感關鍵'),
          h('p', { style: { color: 'var(--ink-dim)', maxWidth: '52ch', margin: '8px 0 0' } },
            '背景先做一層彩色 mesh / blob；玻璃層只負責模糊與邊框；進場動畫只動 transform + opacity；互動用 spring 提供觸感。'
          ),
          h('div', { className: 'kpis', style: { marginTop: 24 } },
            h('div', { className: 'kpi' }, h(AnimatedNumber, { to: 60 }), h('span', null, 'FPS Target')),
            h('div', { className: 'kpi' }, h(AnimatedNumber, { to: 16 }), h('span', null, 'MS Frame Budget')),
            h('div', { className: 'kpi' }, h(AnimatedNumber, { to: 5  }), h('span', null, 'Glass Layers'))
          )
        ),
        h('div', { className: 'visual', 'aria-hidden': true })
      );
    }

    /* =========================================================
       5. Cursor Glow — motionValue 直寫
       ========================================================= */
    function CursorGlow() {
      const x = useMotionValue(-300);
      const y = useMotionValue(-300);
      const sx = useSpring(x, { stiffness: 180, damping: 22 });
      const sy = useSpring(y, { stiffness: 180, damping: 22 });
      useEffect(() => {
        const onMove = e => { x.set(e.clientX); y.set(e.clientY); };
        window.addEventListener('pointermove', onMove, { passive: true });
        return () => window.removeEventListener('pointermove', onMove);
      }, [x, y]);
      return h(m.div, { className: 'cursor-glow', style: { x: sx, y: sy } });
    }

    /* =========================================================
       6. FPS HUD (rAF, 不走 React re-render 路線)
       - 用 motionValue 直寫 DOM，避免每幀 setState
       ========================================================= */
    function FpsHud() {
      const ref = useRef(null);
      useEffect(() => {
        let raf, last = performance.now(), acc = 0, frames = 0;
        const loop = (t) => {
          const dt = t - last; last = t; acc += dt; frames++;
          if (acc >= 500) {
            const f = Math.round((frames * 1000) / acc);
            const ms = (1000 / f).toFixed(1);
            const el = ref.current;
            if (el) {
              const fpsEl = el.querySelector('.fps');
              const msEl  = el.querySelector('.ms-v');
              if (fpsEl) {
                fpsEl.textContent = f;
                fpsEl.className = 'fps ' + (f >= 55 ? 'good' : f >= 40 ? 'ok' : 'bad');
              }
              if (msEl) msEl.textContent = ms;
            }
            acc = 0; frames = 0;
          }
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, []);

      return h('div', { ref, className: 'hud', 'aria-live': 'polite' },
        h('span', { className: 'label' }, 'FPS'),
        h('span', { className: 'fps good' }, '60'),
        h('span', { className: 'label', style: { marginLeft: 8 } }, 'MS'),
        h('span', { className: 'ms-v' }, '16.6')
      );
    }

    /* =========================================================
       7. Reduced Toggle
       ========================================================= */
    function ReducedToggle() {
      const [on, setOn] = useState(() => window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      useEffect(() => {
        document.body.dataset.reduced = on ? '1' : '0';
      }, [on]);
      return h(m.label, {
        className: 'switch',
        whileTap: { scale: .96 },
        initial: { opacity: 0 },
        animate: { opacity: 1 },
        transition: { delay: .9 }
      },
        h('input', { type: 'checkbox', checked: on, onChange: e => setOn(e.target.checked) }),
        h('span', { className: 'track' }, h('span', { className: 'knob' })),
        h('span', null, 'Reduced Motion')
      );
    }

    /* =========================================================
       8. CTA Card 內容 (用 whileInView 進場)
       ========================================================= */
    function CtaCard() {
      return h(m.article, {
        className: 'glass strong',
        initial: { opacity: 0, y: 20 },
        animate: { opacity: 1, y: 0 },
        transition: { duration: .8, ease: [.16,1,.3,1], delay: 1.0 }
      },
        h('div', {
          className: 'body cta-body',
          style: { display: 'grid', gridTemplateColumns: 'minmax(0,1fr) auto', alignItems: 'center', gap: 24 }
        },
          h('div', null,
            h('h3', null, 'LazyMotion + m 元件'),
            h('p', null, '只載入用到的功能 (domAnimation)，比預設 motion bundle 小 80%+。所有 glass 進場、退場、滑鼠跟隨都用同一份 GPU-friendly 路徑。')
          ),
          h(ReducedToggle)
        )
      );
    }

    /* =========================================================
       9. Mount
       ========================================================= */
    const gridRoot = createRoot(document.getElementById('grid'));
    gridRoot.render(h(LazyMotion, { features: domAnimation, strict: true }, h(Grid)));

    const ctaRoot = createRoot(document.getElementById('ctaBody'));
    ctaRoot.render(h(LazyMotion, { features: domAnimation }, h(CtaCard)));

    const hudMount = document.getElementById('hud');
    if (hudMount) {
      hudMount.style.opacity = '1';
      createRoot(hudMount).render(h(LazyMotion, { features: domAnimation }, h(FpsHud)));
    }

    const glowMount = document.getElementById('cursorGlow');
    if (glowMount) createRoot(glowMount).render(h(LazyMotion, { features: domAnimation }, h(CursorGlow)));
  </script>
</body>
</html>
