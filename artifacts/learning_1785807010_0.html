<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨瀏覽器視覺回歸測試頁面 v1.0</title>
<style>
  :root {
    --accent: #5eead4;
    --bg: #0f172a;
    --fg: #e2e8f0;
    --card: #1e293b;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    padding: 48px 24px;
    text-align: center;
    border-bottom: 3px solid var(--accent);
  }
  h1 { margin: 0 0 12px 0; font-size: 32px; color: var(--accent); }
  .tagline { font-size: 16px; color: #94a3b8; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card h3 { margin: 0 0 8px 0; color: var(--accent); font-size: 18px; }
  .card p { margin: 0; color: #cbd5e1; font-size: 14px; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 12px;
  }
  .badge.green { background: #064e3b; color: #6ee7b7; }
  .badge.blue  { background: #1e3a8a; color: #93c5fd; }
  .badge.purple{ background: #581c87; color: #d8b4fe; }
  .btn {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 24px;
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { background: #2dd4bf; }
  footer {
    margin-top: 48px;
    padding: 20px;
    text-align: center;
    color: #64748b;
    font-size: 12px;
    border-top: 1px solid var(--border);
  }
  @media (max-width: 600px) {
    h1 { font-size: 24px; }
    header { padding: 32px 16px; }
  }
</style>
</head>
<body>
  <header>
    <h1>跨瀏覽器視覺回歸測試頁面</h1>
    <p class="tagline">Playwright × Chromium / Firefox / WebKit — v1.0 baseline</p>
  </header>
  <main>
    <p>本頁面是視覺回歸測試的 baseline。任何 CSS / 結構改動都應觸發 pixel diff 警告。</p>
    <button class="btn" id="cta">主要按鈕</button>
    <div class="grid">
      <div class="card">
        <h3>卡片 A</h3>
        <p>這是測試卡片,用於驗證字型、間距、顏色渲染一致性。</p>
        <span class="badge green">stable</span>
      </div>
      <div class="card">
        <h3>卡片 B</h3>
        <p>第二張卡片,測試 grid 排版與 hover 效果跨瀏覽器一致性。</p>
        <span class="badge blue">review</span>
      </div>
      <div class="card">
        <h3>卡片 C</h3>
        <p>第三張卡片,測試響應式斷點在 600px 以下的字級縮放行為。</p>
        <span class="badge purple">draft</span>
      </div>
    </div>
  </main>
  <footer>
    © 2026 — 自動測試 baseline · 不要手動改這個檔案
  </footer>
</body>
</html>
