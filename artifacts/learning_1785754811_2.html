<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSX Live Playground — Babel Standalone 即時編譯</title>

<!-- Babel Standalone：瀏覽器內即時編譯 JSX 的唯一依賴 -->
<script src="https://unpkg.com/@babel/standalone@7.25.7/babel.min.js"></script>

<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #0b1220;
    --accent: #38bdf8;
    --accent-2: #f472b6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --ok: #4ade80;
    --err: #f87171;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, #0b1220, #1e293b);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.4px;
  }
  header h1 .badge {
    background: var(--accent);
    color: #0b1220;
    padding: 2px 8px;
    border-radius: 6px;
    margin-right: 8px;
    font-weight: 700;
  }
  header .sub { color: var(--muted); font-size: 13px; }
  .bar { display: flex; gap: 8px; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: #0b1220;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.1); color: #0b1220; }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 14px;
    height: calc(100vh - 56px);
  }
  .pane {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .pane-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pane-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    display: inline-block;
    margin-right: 6px;
  }
  .pane-header.err .dot { background: var(--err); }
  textarea#editor {
    flex: 1;
    width: 100%;
    background: var(--panel-2);
    color: #f1f5f9;
    border: 0;
    padding: 14px;
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.55;
    resize: none;
    outline: none;
    tab-size: 2;
  }
  iframe#preview {
    flex: 1;
    width: 100%;
    border: 0;
    background: #ffffff;
    color: #111827;
  }
  .err-box {
    flex: 1;
    overflow: auto;
    padding: 12px 16px;
    background: #2a1014;
    color: #fecaca;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .examples {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    flex-wrap: wrap;
  }
  .examples button {
    font-size: 12px;
    padding: 4px 10px;
  }
  footer {
    padding: 6px 14px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    border-top: 1px solid var(--border);
    background: var(--panel-2);
  }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; height: auto; }
    .pane { min-height: 360px; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="badge">JSX</span>Live Playground <span class="sub">— Babel Standalone 即時編譯（瀏覽器端、零建置）</span></h1>
  <div class="bar">
    <button id="btnCompile" class="primary">▶ 重編 (Re-compile)</button>
    <button id="btnClear">清除輸出</button>
  </div>
</header>

<main>
  <section class="pane">
    <div class="pane-header">
      <span>JSX 編輯器（純前端輸入）</span>
      <span id="sizeBadge">0 字</span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="在這裡寫 JSX，按 Ctrl/Cmd+Enter 即時編譯..."></textarea>
    <div class="examples">
      <span style="color:var(--muted); font-size:12px; align-self:center;">範例：</span>
      <button data-ex="counter">計數器</button>
      <button data-ex="card">卡片</button>
      <button data-ex="fetch">fetch + useEffect</button>
      <button data-ex="error">故意報錯</button>
    </div>
  </section>

  <section class="pane">
    <div class="pane-header" id="statusBar">
      <span><span class="dot"></span><span id="statusText">預覽輸出（沙盒 iframe）</span></span>
      <span id="latency"></span>
    </div>
    <iframe id="preview" sandbox="allow-scripts allow-same-origin" title="preview"></iframe>
    <div id="errBox" class="err-box" style="display:none;"></div>
  </section>
</main>

<footer>
  來源：&lt;script type="text/babel" data-presets="react,env"&gt;  •  變更自動 debounce 600ms  •  Babel 7.25.7
</footer>

<!-- ========================================================== -->
<!-- 預設範例程式碼（已驗證可正確編譯）                         -->
<!-- 注意：Babel Standalone 在 type="text/babel" 下會自動       -->
<!--       把 JSX 與 React JSX-runtime 串起來，無需手動 import。-->
<!-- ========================================================== -->
<script type="text/babel" data-presets="react,env" id="examples">
const EXAMPLES = {
  counter: `function App() {
  const [count, setCount] = React.useState(0);
  return (
    <div style={{fontFamily:'sans-serif',padding:24}}>
      <h2>計數器範例</h2>
      <p>目前值：<b>{count}</b></p>
      <button onClick={() => setCount(c => c + 1)}
              style={{padding:'6px 12px',marginRight:8}}>
        +1
      </button>
      <button onClick={() => setCount(0)}
              style={{padding:'6px 12px'}}>
        重設
      </button>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root'))
  .render(<App />);`,

  card: `function Card({title, children}) {
  return (
    <div style={{
      maxWidth:320,padding:20,borderRadius:12,
      boxShadow:'0 4px 18px rgba(0,0,0,.08)',
      fontFamily:'sans-serif',background:'#fff',color:'#111'
    }}>
      <h3 style={{marginTop:0}}>{title}</h3>
      {children}
    </div>
  );
}
function App() {
  return (
    <div style={{padding:24,background:'#f1f5f9',minHeight:'100vh'}}>
      <Card title="Babel Standalone">
        <p>這張卡片是 <b>JSX</b> 在瀏覽器端即時編譯後渲染的。</p>
        <p style={{color:'#64748b',fontSize:13}}>
          改左邊程式碼 → 右邊即時更新。
        </p>
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);`,

  fetch: `function App() {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    fetch('https://jsonplaceholder.typicode.com/todos/1')
      .then(r => r.json())
      .then(j => { setData(j); setLoading(false); });
  }, []);
  if (loading) return <p>載入中...</p>;
  return (
    <pre style={{padding:20,fontFamily:'monospace'}}>
      {JSON.stringify(data, null, 2)}
    </pre>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);`,

  error: `function App() {
  return <div>{undefinedVar.title}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);`
};

window.__EXAMPLES = EXAMPLES;
</script>

<!-- ========================================================== -->
<!-- 主邏輯：debounce、compile、注入 iframe、錯誤隔離            -->
<!-- Babel 本身：拿 source 後用 Babel.transform(...) 編譯        -->
<!-- ========================================================== -->
<script>
(function () {
  const editor    = document.getElementById('editor');
  const preview   = document.getElementById('preview');
  const errBox    = document.getElementById('errBox');
  const statusBar = document.getElementById('statusBar');
  const statusTxt = document.getElementById('statusText');
  const latency   = document.getElementById('latency');
  const sizeBadge = document.getElementById('sizeBadge');

  // 預設載入第一個範例
  let currentExample = localStorage.getItem('jsx:lastExample') || 'counter';

  function loadExample(key) {
    const src = (window.__EXAMPLES || {})[key];
    if (src) {
      editor.value = src;
      currentExample = key;
      localStorage.setItem('jsx:lastExample', key);
      compile();
    }
  }
  // 等 Babel 與範例 script 都 ready
  document.addEventListener('DOMContentLoaded', () => {
    // 範例 script 是 text/babel，Babel 跑完才會把 window.__EXAMPLES 寫出來
    // 直接以輪詢確保可用（最簡單可靠的做法）
    const waitExamples = setInterval(() => {
      if (window.__EXAMPLES) {
        clearInterval(waitExamples);
        loadExample(currentExample);
      }
    }, 30);
  });

  // ====== 編譯核心 ======
  function compile() {
    const src = editor.value;
    const t0 = performance.now();
    sizeBadge.textContent = `${src.length} 字`;

    // 組合注入 iframe 的 HTML：React 18 UMD + Babel-standalone runtime
    // React/ReactDOM 走 unpkg，全域 React / ReactDOM
    const htmlShell = `<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#111}
  #root{padding:8px}
</style>
</head><body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>
<script src="https://unpkg.com/@babel/standalone@7.25.7/babel.min.js"><\/script>
<script>__USER_CODE__<\/script>
</body></html>`;

    // Step 1：Babel 編譯 user JSX -> JS
    let compiled;
    try {
      compiled = Babel.transform(src, {
        presets: ['react'],
        filename: 'user.jsx'
      }).code;
    } catch (e) {
      showError('Babel 編譯失敗：\n' + (e.message || e));
      return;
    }

    // Step 2：注入 iframe
    const finalHtml = htmlShell.replace('__USER_CODE__', compiled);
    preview.srcdoc = finalHtml;

    // 計算 iframe 內容載入完成時間（近似）
    preview.onload = () => {
      const dt = Math.round(performance.now() - t0);
      latency.textContent = `${dt} ms`;
      statusBar.classList.remove('err');
      statusTxt.textContent = '預覽輸出（沙盒 iframe）— 編譯成功';
      errBox.style.display = 'none';

      // 抓 iframe 內 runtime error
      preview.contentWindow.addEventListener('error', (ev) => {
        showError('Runtime error：\n' + (ev.message || ev.error));
      });
      preview.contentWindow.addEventListener('unhandledrejection', (ev) => {
        showError('Unhandled rejection：\n' + (ev.reason || ev));
      });
    };
  }

  function showError(msg) {
    errBox.style.display = 'block';
    errBox.textContent = msg;
    statusBar.classList.add('err');
    statusTxt.textContent = '編譯 / 執行錯誤';
    latency.textContent = '';
  }

  // ====== debounce 自動編譯 ======
  let timer = null;
  editor.addEventListener('input', () => {
    if (timer) clearTimeout(timer);
    timer = setTimeout(compile, 600);
  });

  // ====== Ctrl/Cmd + Enter 立即重編 ======
  editor.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      if (timer) clearTimeout(timer);
      compile();
    }
  });

  // ====== 按鈕 ======
  document.getElementById('btnCompile').addEventListener('click', compile);
  document.getElementById('btnClear').addEventListener('click', () => {
    preview.srcdoc = '<!doctype html><html><body style="margin:0;background:#fff;color:#aaa;font-family:sans-serif;padding:24px;">已清除輸出</body></html>';
    statusBar.classList.remove('err');
    statusTxt.textContent = '預覽輸出（沙盒 iframe）';
    errBox.style.display = 'none';
    latency.textContent = '';
  });

  document.querySelectorAll('.examples button[data-ex]').forEach(btn => {
    btn.addEventListener('click', () => loadExample(btn.dataset.ex));
  });
})();
</script>

</body>
</html>
