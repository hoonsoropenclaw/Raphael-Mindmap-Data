<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Next.js Dynamic Routing + RBAC Demo Platform</title>
<style>
  /* ============================================================
     全域樣式 - 致敬 Next.js + 簡潔設計系統
     ============================================================ */
  :root {
    --bg: #0a0a0f;
    --bg-elev: #13131c;
    --bg-card: #1a1a25;
    --border: #2a2a3a;
    --text: #e4e4e7;
    --text-dim: #a1a1aa;
    --text-faint: #71717a;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --admin: #ef4444;
    --editor: #f59e0b;
    --viewer: #10b981;
    --code-bg: #0d0d14;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea {
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    width: 100%;
    font-size: 14px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* ============================================================
     App Shell Layout
     ============================================================ */
  .app-shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    min-height: 100vh;
  }

  .header {
    grid-area: header;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-mark {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: white;
    font-weight: 700;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 12px 4px 4px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
  }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 12px;
    color: white;
  }
  .role-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .role-badge.admin { background: var(--admin); color: white; }
  .role-badge.editor { background: var(--editor); color: #1a1a25; }
  .role-badge.viewer { background: var(--viewer); color: #1a1a25; }
  .role-badge.guest { background: var(--text-faint); color: white; }

  /* Sidebar Navigation */
  .sidebar {
    grid-area: sidebar;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    overflow-y: auto;
  }

  .nav-section {
    padding: 0 16px;
    margin-bottom: 24px;
  }
  .nav-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-faint);
    padding: 0 12px 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .nav-item:hover {
    background: var(--bg-card);
    color: var(--text);
  }
  .nav-item.active {
    background: var(--accent);
    color: white;
  }
  .nav-item.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }
  .nav-item .lock-icon {
    margin-left: auto;
    font-size: 11px;
  }
  .nav-icon {
    width: 16px;
    text-align: center;
    font-size: 14px;
  }

  /* Main Content */
  .main {
    grid-area: main;
    padding: 32px 40px;
    overflow-y: auto;
    max-width: 1200px;
    width: 100%;
  }

  .page-header {
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .breadcrumb {
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .page-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .page-desc {
    color: var(--text-dim);
    font-size: 14px;
  }

  /* Cards / Components */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-desc { font-size: 13px; color: var(--text-dim); }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 900px) {
    .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }

  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
  }
  .stat-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--bg-card);
    border-color: var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger {
    background: var(--danger);
    color: white;
  }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    font-weight: 600;
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  tr:hover td { background: var(--bg-elev); }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    font-size: 11px;
    border-radius: 4px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .badge.active { background: var(--success); color: #0a0a0f; border-color: transparent; }
  .badge.draft { background: var(--warning); color: #0a0a0f; border-color: transparent; }
  .badge.archived { background: var(--text-faint); color: white; border-color: transparent; }

  /* Login */
  .login-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .login-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  .login-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  .login-sub {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 24px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .quick-roles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 16px;
  }
  .quick-role-btn {
    padding: 12px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elev);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-size: 12px;
  }
  .quick-role-btn:hover { border-color: var(--accent); }
  .quick-role-btn .role-name {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
    display: block;
  }
  .quick-role-btn .role-desc { color: var(--text-faint); }

  /* 403 Page */
  .denied-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
  }
  .denied-code {
    font-size: 64px;
    font-weight: 800;
    color: var(--danger);
    margin-bottom: 16px;
  }
  .denied-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .denied-desc { color: var(--text-dim); margin-bottom: 24px; max-width: 480px; }

  /* Code Block */
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
  }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .code-comment { color: var(--text-faint); }
  .code-keyword { color: #c084fc; }
  .code-string { color: #86efac; }
  .code-fn { color: #93c5fd; }

  /* Permission Matrix */
  .perm-grid {
    display: grid;
    grid-template-columns: 200px repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .perm-cell {
    background: var(--bg-card);
    padding: 12px;
    font-size: 13px;
  }
  .perm-cell.header { background: var(--bg-elev); font-weight: 600; }
  .perm-cell.feature { color: var(--text-dim); font-size: 13px; }
  .perm-yes { color: var(--success); font-weight: 600; }
  .perm-no { color: var(--text-faint); }
  .perm-partial { color: var(--warning); font-weight: 600; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 520px;
  }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 2000;
    animation: slideUp 0.25s ease-out;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Notice */
  .notice {
    background: rgba(99, 102, 241, 0.08);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .notice.warn { background: rgba(245, 158, 11, 0.08); border-color: rgba(245, 158, 11, 0.3); }
  .notice.success { background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.3); }

  /* Dynamic params */
  .param-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .param-chip {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  .param-chip .key { color: var(--accent-hover); }
  .param-chip .val { color: var(--text); }

  /* Tab bar */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Article (dynamic [id]) */
  .article-hero {
    background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
    border-radius: 12px;
    padding: 32px;
    color: white;
    margin-bottom: 20px;
  }
  .article-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .article-meta { font-size: 13px; opacity: 0.85; }

  /* Tree (file-system routing) */
  .tree {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.9;
    padding: 16px;
    background: var(--code-bg);
    border-radius: 8px;
    overflow-x: auto;
  }
  .tree-folder { color: var(--accent-hover); }
  .tree-file { color: var(--text-dim); }
  .tree-file.dyn { color: var(--warning); }
  .tree-file.layout { color: var(--success); }
  .tree-comment { color: var(--text-faint); }
</style>
</head>
<body>

<div id="root"></div>

<script>
/* =================================================================
   Next.js Dynamic Routing + RBAC Demo
   單檔 SPA，模擬 Next.js App Router 的 file-system routing
   與 Role-Based Access Control 的完整流程
   ================================================================= */

(function () {
  'use strict';

  // ============================================================
  // 1) 模擬「Next.js App Router」的檔案式路由表
  //    真實 Next.js 中每個資料夾 = 一個路由段，[id] = dynamic segment
  //    這裡把所有路由集中註冊，route.params 就是 URL 中的動態參數
  // ============================================================
  const ROUTE_TABLE = [
    // 靜態路由
    { pattern: '/',                   file: 'app/page.js',                title: 'Dashboard',     icon: '📊', section: 'main',     roles: ['admin','editor','viewer'] },
    { pattern: '/articles',           file: 'app/articles/page.js',       title: 'Articles',      icon: '📰', section: 'main',     roles: ['admin','editor','viewer'] },
    // 動態路由 - [id]
    { pattern: '/articles/[id]',      file: 'app/articles/[id]/page.js',  title: 'Article Detail',icon: '📄', section: 'main',     roles: ['admin','editor','viewer'], isDynamic: true },
    // Catch-all 動態路由
    { pattern: '/docs/[...slug]',     file: 'app/docs/[...slug]/page.js', title: 'Docs',          icon: '📚', section: 'main',     roles: ['admin','editor','viewer'], isCatchAll: true },
    // 巢狀 layout 段
    { pattern: '/admin',              file: 'app/admin/layout.js + page.js', title: 'Admin Panel', icon: '🛡️', section: 'admin',    roles: ['admin'] },
    { pattern: '/admin/users',        file: 'app/admin/users/page.js',    title: 'User Mgmt',     icon: '👥', section: 'admin',    roles: ['admin'] },
    { pattern: '/admin/roles',        file: 'app/admin/roles/page.js',    title: 'Role & Perms',  icon: '🔑', section: 'admin',    roles: ['admin'] },
    // Editor 區
    { pattern: '/editor',             file: 'app/editor/page.js',         title: 'Content Editor',icon: '✏️', section: 'editor',   roles: ['admin','editor'] },
    // 帳號
    { pattern: '/profile',            file: 'app/profile/page.js',        title: 'My Profile',    icon: '👤', section: 'account',  roles: ['admin','editor','viewer'] },
  ];

  // ============================================================
  // 2) 模擬「資料層」— 之後接真實 Next.js 時可換成 fetch('/api/...')
  // ============================================================
  const DATA = {
    stats: {
      totalArticles: 124,
      totalUsers: 38,
      activeEditors: 12,
      publishedToday: 5,
    },
    articles: [
      { id: '101', title: '使用 Next.js 14 App Router 建立動態路由', author: 'Alice Chen', status: 'active',   date: '2026-08-01', views: 1248 },
      { id: '102', title: 'RBAC 權限模型設計實戰：從零到完整方案', author: 'Bob Lin',     status: 'active',   date: '2026-07-28', views: 892 },
      { id: '103', title: 'Middleware 在 Next.js 14 中的最佳實踐',   author: 'Carol Wang',  status: 'draft',    date: '2026-08-03', views: 0 },
      { id: '104', title: 'Server Components vs Client Components',   author: 'David Liu',   status: 'active',   date: '2026-07-25', views: 2103 },
      { id: '105', title: '為什麼我們從 Pages Router 遷移到 App Router', author: 'Eva Huang', status: 'archived', date: '2026-06-12', views: 567 },
      { id: '106', title: 'RBAC + ABAC 混合權限模型介紹',           author: 'Frank Yang',  status: 'active',   date: '2026-08-02', views: 1456 },
    ],
    users: [
      { id: 1, name: 'Admin User',     email: 'admin@example.com',     role: 'admin',  joined: '2025-01-15', lastLogin: '2026-08-04' },
      { id: 2, name: 'Editor User',    email: 'editor@example.com',    role: 'editor', joined: '2025-03-22', lastLogin: '2026-08-03' },
      { id: 3, name: 'Viewer User',    email: 'viewer@example.com',    role: 'viewer', joined: '2025-06-10', lastLogin: '2026-08-04' },
      { id: 4, name: 'Alice Chen',     email: 'alice@example.com',     role: 'editor', joined: '2025-04-05', lastLogin: '2026-08-02' },
      { id: 5, name: 'Bob Lin',        email: 'bob@example.com',       role: 'viewer', joined: '2025-08-18', lastLogin: '2026-07-30' },
    ],
    docsTree: [
      { slug: 'getting-started', title: 'Getting Started',  desc: '30 秒建立第一個路由' },
      { slug: 'routing/dynamic', title: 'Dynamic Routes',   desc: '[id]、[...slug] 完整教學' },
      { slug: 'routing/catch-all', title: 'Catch-all Routes', desc: '文件型 catch-all 路由' },
      { slug: 'auth/rbac',       title: 'RBAC 權限設計',     desc: 'Role-Based Access Control' },
      { slug: 'auth/middleware', title: 'Middleware 守衛',   desc: '路由級權限攔截' },
    ],
  };

  // ============================================================
  // 3) 模擬「session」— 真實 Next.js 會從 cookies/JWT 來
  //    這裡用 localStorage 模擬持久化登入
  // ============================================================
  const SESSION_KEY = 'rbac_demo_session';

  function getSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function setSession(user) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(user));
  }
  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }

  // 預設帳號 (mock auth — 真實環境會打 /api/auth)
  const ACCOUNTS = {
    admin:  { id: 1, name: 'Admin User',  email: 'admin@example.com',  role: 'admin',  avatar: 'A' },
    editor: { id: 2, name: 'Editor User', email: 'editor@example.com', role: 'editor', avatar: 'E' },
    viewer: { id: 3, name: 'Viewer User', email: 'viewer@example.com', role: 'viewer', avatar: 'V' },
  };

  // ============================================================
  // 4) 路由解析 — 模擬 Next.js 的 usePathname + params 行為
  //    - 靜態路由優先
  //    - 再比對 [id] / [...slug]
  // ============================================================
  function resolveRoute(path) {
    // 完全相等 (靜態)
    const exact = ROUTE_TABLE.find(r => r.pattern === path && !r.isDynamic && !r.isCatchAll);
    if (exact) return { route: exact, params: {} };

    // 動態 [id]
    const dynCandidates = ROUTE_TABLE.filter(r => r.isDynamic);
    for (const r of dynCandidates) {
      const regex = new RegExp('^' + r.pattern.replace(/\[id\]/g, '([^/]+)') + '$');
      const m = path.match(regex);
      if (m) return { route: r, params: { id: m[1] } };
    }

    // Catch-all [...slug]
    const catchAllCandidates = ROUTE_TABLE.filter(r => r.isCatchAll);
    for (const r of catchAllCandidates) {
      const regex = new RegExp('^' + r.pattern.replace(/\[\.\.\.slug\]/g, '(.+)') + '$');
      const m = path.match(regex);
      if (m) return { route: r, params: { slug: m[1].split('/') } };
    }

    return { route: null, params: {} };
  }

  // RBAC 權限判斷
  function canAccess(route, user) {
    if (!route) return false;
    if (!user) return false;
    return route.roles.includes(user.role);
  }

  // 5) URL 工具 — 用 hash routing 避免 SPA 需要 server rewrite
  //    真實 Next.js 用的是 path-based，但這裡為單檔 HTML 演示
  //    所以使用 #/articles/101 這種格式
  // ============================================================
  function getCurrentPath() {
    const hash = window.location.hash.slice(1) || '/';
    return hash;
  }
  function navigate(path) {
    window.location.hash = path;
  }

  // ============================================================
  // 6) DOM Helpers
  // ============================================================
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k.startsWith('on') && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === 'style' && typeof v === 'object') {
          Object.assign(node.style, v);
        } else {
          node.setAttribute(k, v);
        }
      }
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      if (typeof c === 'string' || typeof c === 'number') {
        node.appendChild(document.createTextNode(String(c)));
      } else {
        node.appendChild(c);
      }
    }
    return node;
  }

    const t = el('div', { class: 'toast ' + (type || '') }, message);
    document.body.appendChild(t);

        el('div', { style: { fontSize: '12px', color: 'var(--text-dim)', marginTop: '2px' } }, d.desc)
      ))
    ));

    if (doc) {
      wrap.appendChild(el('div', { class: 'card' },
        el('div', { class: 'card-title' }, '📄 ' + doc.title),
        el('div', { style: { fontSize: '13px', color: 'var(--text-dim)', marginBottom: '12px' } }, '路徑: ' + doc.slug),
        el('pre', {},
'// app/docs/[...slug]/page.js\n',
'export default function DocPage({ params }) {\n',
'  const slug = params.slug.join("/");\n',
'  const doc = await getDoc(slug);\n',
'  return <Article doc={doc} />;\n',
'}\n'
        )
      ));
    }
    return wrap;
  }

  // 7.6 Admin Dashboard
  function AdminPage() {
    const wrap = el('div');
    wrap.appendChild(el('div', { class: 'page-header' },
      el('div', { class: 'breadcrumb' }, 'app / admin / layout.js + page.js'),
      el('h1', { class: 'page-title' }, '🛡️ Admin Panel'),
      el('p', { class: 'page-desc' }, 'Admin-only 區域 — 由 RBAC middleware 攔截，非 admin 角色會被 403 擋下。')
    ));

    wrap.appendChild(el('div', { class: 'notice success' },
      '✓ 你目前是 ADMIN，可以看到這個區域。其他角色會被 middleware 自動 redirect 到 /403。'
    ));

    const grid = el('div', { class: 'grid-2' });
    grid.appendChild(el('div', { class: 'card', onClick: () => navigate('/admin/users'), style: { cursor: 'pointer' } },
      el('div', { class: 'card-title' }, '👥 User Management'),
      el('p', { class: 'card-desc' }, '管理所有使用者帳號、角色、權限。共有 ' + DATA.users.length + ' 位使用者。')
    ));
    grid.appendChild(el('div', { class: 'card', onClick: () => navigate('/admin/roles'), style: { cursor: 'pointer' } },
      el('div', { class: 'card-title' }, '🔑 Role & Permissions'),
      el('p', { class: 'card-desc' }, '設定角色對應的權限、可存取的路由、UI 元素的可見性。')
    ));
    wrap.appendChild(grid);

    return wrap;
  }

  // 7.7 Admin Users
  function AdminUsersPage() {
    const wrap = el('div');
    wrap.appendChild(el('div', { class: 'page-header' },
      el('div', { class: 'breadcrumb' }, 'app / admin / users / page.js'),
      el('h1', { class: 'page-title' }, '👥 User Management'),
      el('p', { class: 'page-desc' }, 'Admin 限定 — 可調整使用者角色、停用帳號')
    ));

    const tableWrap = el('div', { class: 'card', style: { padding: 0, overflow: 'hidden' } });
    const table = el('table');
    table.appendChild(el('thead', {},
      el('tr', {},
        el('th', {}, 'ID'),
        el('th', {}, 'Name'),
        el('th', {}, 'Email'),
        el('th', {}, 'Role'),
        el('th', {}, 'Joined'),
        el('th', {}, 'Last Login'),
        el('th', {}, 'Actions')
      )
    ));

    const tbody = el('tbody');
    DATA.users.forEach(u => {
      const tr = el('tr');
      tr.appendChild(el('td', { style: { fontFamily: 'ui-monospace, monospace', color: 'var(--text-faint)' } }, '#' + u.id));
      tr.appendChild(el('td', {},
        el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
          el('div', { class: 'avatar', style: { width: '24px', height: '24px', fontSize: '11px' } }, u.name[0]),
          u.name
        )
      ));
      tr.appendChild(el('td', { style: { color: 'var(--text-dim)', fontFamily: 'ui-monospace, monospace', fontSize: '12px' } }, u.email));
      tr.appendChild(el('td', {}, el('span', { class: 'role-badge ' + u.role }, u.role)));
      tr.appendChild(el('td', { style: { color: 'var(--text-dim)', fontSize: '12px' } }, u.joined));
      tr.appendChild(el('td', { style: { color: 'var(--text-dim)', fontSize: '12px' } }, u.lastLogin));
      tr.appendChild(el('td', {},
        el('button', { class: 'btn btn-secondary btn-sm', style: { marginRight: '4px' } }, 'Edit'),
        el('button', { class: 'btn btn-danger btn-sm' }, 'Disable')
      ));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    wrap.appendChild(tableWrap);

    return wrap;
  }

  // 7.8 Admin Roles
  function AdminRolesPage() {
    const wrap = el('div');
    wrap.appendChild(el('div', { class: 'page-header' },
      el('div', { class: 'breadcrumb' }, 'app / admin / roles / page.js'),
      el('h1', { class: 'page-title' }, '🔑 Role & Permissions'),
      el('p', { class: 'page-desc' }, 'RBAC 設定中心 — 編輯每個角色可存取的路由與操作')
    ));

    // Role cards
    [
      { role: 'admin',  color: 'var(--admin)',  desc: '完整權限 — 可存取所有路由，包含 /admin/*', routes: ['/', '/articles/*', '/docs/*', '/editor', '/admin/*', '/profile'] },
      { role: 'editor', color: 'var(--editor)', desc: '可讀取所有內容、可編輯文章，但不能管理使用者', routes: ['/', '/articles/*', '/docs/*', '/editor', '/profile'] },
      { role: 'viewer', color: 'var(--viewer)', desc: '唯讀 — 只能查看 dashboard、articles、docs', routes: ['/', '/articles/*', '/docs/*', '/profile'] },
    ].forEach(r => {
      wrap.appendChild(el('div', { class: 'card' },
        el('div', { class: 'card-title' },
          el('span', { class: 'role-badge ' + r.role, style: { marginRight: '8px' } }, r.role),
          el('span', { style: { fontSize: '12px', color: 'var(--text-dim)', fontWeight: 'normal' } }, r.desc)
        ),
        el('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px', marginTop: '8px' } },
          r.routes.map(rt => el('code', { style: { padding: '3px 8px', background: 'var(--bg-elev)', borderRadius: '4px', fontSize: '12px' } }, rt))
        )
      ));
    });

    return wrap;
  }

  // 7.9 Editor page
  function EditorPage() {
    const wrap = el('div');
    wrap.appendChild(el('div', { class: 'page-header' },
      el('div', { class: 'breadcrumb' }, 'app / editor / page.js'),
      el('h1', { class: 'page-title' }, '✏️ Content Editor'),
      el('p', { class: 'page-desc' }, 'Editor 限定 — 可建立/編輯文章')
    ));

    wrap.appendChild(el('div', { class: 'card' },
      el('div', { class: 'card-title' }, '📝 New Article'),
      el('div', { class: 'form-group' },
        el('label', { class: 'form-label' }, 'Title'),
        el('input', { type: 'text', placeholder: '輸入文章標題', id: 'article-title' })
      ),
      el('div', { class: 'form-group' },
        el('label', { class: 'form-label' }, 'Content'),
        el('textarea', { rows: '6', placeholder: '開始撰寫...', id: 'article-content' })
      ),
      el('div', { style: { display: 'flex', gap: '8px', justifyContent: 'flex-end' } },
        el('button', { class: 'btn btn-secondary' }, 'Save Draft'),
        el('button', {
          class: 'btn btn-primary',
          onClick: () => {
            const title = document.getElementById('article-title').value;
            if (!title) { toast('標題不能為空', 'error'); return; }
            toast(`已發布: "${title}" (Demo)`, 'success');
            document.getElementById('article-title').value = '';
            document.getElementById('article-content').value = '';
          }
        }, 'Publish')
      )
    ));
    return wrap;
  }

  // 7.10 Profile
  function ProfilePage() {
    const user = getSession();
    const wrap = el('div');
    wrap.appendChild(el('div', { class: 'page-header' },
      el('div', { class: 'breadcrumb' }, 'app / profile / page.js'),
      el('h1', { class: 'page-title' }, '👤 My Profile'),
      el('p', { class: 'page-desc' }, '當前登入資訊 + session token 細節')
    ));

    wrap.appendChild(el('div', { class: 'card' },
      el('div', { style: { display: 'flex', alignItems: 'center', gap: '16px', marginBottom: '20px' } },
        el('div', { class: 'avatar', style: { width: '64px', height: '64px', fontSize: '24px' } }, user.avatar),
        el('div', {},
          el('div', { style: { fontSize: '20px', fontWeight: '600' } }, user.name),
          el('div', { style: { fontSize: '13px', color: 'var(--text-dim)' } }, user.email),
          el('span', { class: 'role-badge ' + user.role, style: { marginTop: '6px', display: 'inline-block' } }, user.role)
        )
      ),
      el('table', {},
        el('tbody', {},
          row('User ID', '#' + user.id),
          row('Role', user.role),
          row('Email', user.email),
          row('Avatar', user.avatar),
          row('Session Storage', 'localStorage["' + SESSION_KEY + '"]'),
          row('Auth Strategy', 'Mock (real prod: cookies + JWT)')
        )
      )
    ));

    return wrap;
  }
  function row(k, v) {
    return el('tr', {},
      el('td', { style: { width: '180px', color: 'var(--text-faint)', fontSize: '12px', padding: '8px 12px' } }, k),
      el('td', { style: { padding: '8px 12px' } }, v)
    );
  }

  // 7.11 403 Forbidden
  function ForbiddenPage(route, user) {
    const wrap = el('div', { class: 'denied-wrap' },
      el('div', { class: 'denied-code' }, '403'),
      el('div', { class: 'denied-title' }, 'Forbidden — 權限不足'),
      el('div', { class: 'denied-desc' },
        '路由 ', el('code', { style: { background: 'var(--bg-card)', padding: '2px 6px', borderRadius: '4px' } }, route.pattern),
        ' 需要角色 ', el('code', { style: { background: 'var(--bg-card)', padding: '2px 6px', borderRadius: '4px' } }, route.roles.join(' / ')),
        '，但你目前是 ', el('code', { style: { background: 'var(--bg-card)', padding: '2px 6px', borderRadius: '4px' } }, user ? user.role : 'guest'), '。'
      ),
      el('div', { style: { display: 'flex', gap: '8px' } },
        el('button', { class: 'btn btn-secondary', onClick: () => history.back() }, '← Back'),
        el('button', { class: 'btn btn-primary', onClick: () => navigate('/') }, 'Go to Dashboard')
      ),
      el('pre', { style: { marginTop: '32px', maxWidth: '600px', textAlign: 'left' } },
'// middleware.ts (真實 Next.js 攔截邏輯)\n',
'if (!rule.roles.includes(userRole)) {\n',
'  return NextResponse.redirect(new URL("/403", request.url));\n',
'}\n'
      )
    );
    return wrap;
  }

  // 7.12 404 Not Found
  function NotFoundPage(path) {
    const wrap = el('div', { class: 'denied-wrap' },
      el('div', { class: 'denied-code', style: { color: 'var(--text-faint)' } }, '404'),
      el('div', { class: 'denied-title' }, 'Route Not Found'),
      el('div', { class: 'denied-desc' }, '找不到路徑 ', el('code', {}, path), ' 對應的 page.js')
    );
    return wrap;
  }

  // ============================================================
  // 8) App Shell — Sidebar + Header + Main
  // ============================================================
  function AppShell(user, content) {
    const shell = el('div', { class: 'app-shell' });

    // Header
    const header = el('header', { class: 'header' },
      el('div', { class: 'logo' },
        el('span', { class: 'logo-mark' }, 'N'),
        el('span', {}, 'Next.js + RBAC Demo')
      ),
      el('div', { style: { display: 'flex', alignItems: 'center', gap: '16px' } },
        el('span', { class: 'role-badge ' + user.role }, user.role),
        el('div', { class: 'user-chip' },
          el('div', { class: 'avatar' }, user.avatar),
          el('span', {}, user.name)
        ),
        el('button', {
          class: 'btn btn-secondary btn-sm',
          onClick: () => { clearSession(); navigate('/'); }
        }, 'Sign Out')
      )
    );

    // Sidebar — grouped by section
    const sidebar = el('aside', { class: 'sidebar' });
    const sections = [
      { key: 'main',    title: 'Main' },
      { key: 'editor',  title: 'Editor' },
      { key: 'admin',   title: 'Admin' },
      { key: 'account', title: 'Account' },
    ];

    sections.forEach(sec => {
      const items = ROUTE_TABLE.filter(r => r.section === sec.key);
      if (!items.length) return;
      sidebar.appendChild(el('div', { class: 'nav-section' },
        el('div', { class: 'nav-title' }, sec.title)
      ));
      const secEl = el('div', { class: 'nav-section', style: { paddingTop: 0 } });
      const currentPath = getCurrentPath();

      items.forEach(r => {
        const accessible = canAccess(r, user);
        const navItem = el('div', {
          class: 'nav-item' + (currentPath === r.pattern ? ' active' : '') + (accessible ? '' : ' disabled'),
          onClick: () => {
            if (!accessible) {
              toast(`🔒 ${r.title} 需要 ${r.roles.join('/')} 角色`, 'error');
              return;
            }
            navigate(r.pattern);
          }
        },
          el('span', { class: 'nav-icon' }, r.icon),
          el('span', {}, r.title),
          accessible ? null : el('span', { class: 'lock-icon', title: '需要 ' + r.roles.join('/') }, '🔒')
        );
        secEl.appendChild(navItem);
      });
      sidebar.appendChild(secEl);
    });

    // Main content wrapper
    const main = el('main', { class: 'main' }, content);

    shell.appendChild(header);
    shell.appendChild(sidebar);
    shell.appendChild(main);
    return shell;
  }

  // ============================================================
  // 9) Router — Render 入口
  // ============================================================
  function render() {
    const user = getSession();
    const root = document.getElementById('root');
    root.innerHTML = '';

    // 沒登入 → 強制 Login
    if (!user) {
      root.appendChild(LoginPage());
      return;
    }

    const path = getCurrentPath();
    const { route, params } = resolveRoute(path);

    // 路由不存在
    if (!route) {
      root.appendChild(AppShell(user, NotFoundPage(path)));
      return;
    }

    // RBAC 攔截
    if (!canAccess(route, user)) {
      root.appendChild(AppShell(user, ForbiddenPage(route, user)));
      return;
    }

    // 路由 → 頁面
    let pageContent;
    if (route.pattern === '/') pageContent = DashboardPage();
    else if (route.pattern === '/articles') pageContent = ArticlesListPage();
    else if (route.pattern === '/articles/[id]') pageContent = ArticleDetailPage(params);
    else if (route.pattern === '/docs/[...slug]') pageContent = DocsPage(params);
    else if (route.pattern === '/admin') pageContent = AdminPage();
    else if (route.pattern === '/admin/users') pageContent = AdminUsersPage();
    else if (route.pattern === '/admin/roles') pageContent = AdminRolesPage();
    else if (route.pattern === '/editor') pageContent = EditorPage();
    else if (route.pattern === '/profile') pageContent = ProfilePage();

    root.appendChild(AppShell(user, pageContent));
  }

  // ============================================================
  // 10) Bootstrap
  // ============================================================
  window.addEventListener('hashchange', render);
  window.addEventListener('DOMContentLoaded', render);

  // 若直接打開且 hash 為空，預設指向 dashboard
  if (!window.location.hash) {
    window.location.hash = '/';
  }
})();
</script>
