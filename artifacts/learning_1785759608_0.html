<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RBAC Workflow Manager · 基於角色的工作流管理系統</title>

  <!-- ====== React 18 + Babel Standalone + React Flow UMD ====== -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.25.7/babel.min.js"></script>
  <script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />

  <style>
    :root {
      --bg-0: #0a0e1a;
      --bg-1: #111728;
      --bg-2: #1a2238;
      --bg-3: #232d4a;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.18);
      --text-0: #e6edf7;
      --text-1: #a8b3cf;
      --text-2: #6b7593;
      --accent: #6ea8ff;
      --accent-2: #8b5cf6;
      --accent-3: #14b8a6;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ok: #22c55e;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-strong: rgba(255, 255, 255, 0.08);
      --role-admin: #f59e0b;
      --role-manager: #6ea8ff;
      --role-approver: #8b5cf6;
      --role-viewer: #14b8a6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background:
        radial-gradient(1200px 800px at 10% -10%, rgba(110, 168, 255, 0.18), transparent 60%),
        radial-gradient(900px 600px at 110% 110%, rgba(139, 92, 246, 0.16), transparent 60%),
        linear-gradient(180deg, var(--bg-0), #05080f);
      color: var(--text-0);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      font-size: 13px;
      min-height: 100vh;
      overflow: hidden;
    }
    button {
      font-family: inherit; font-size: inherit; color: inherit;
      background: transparent; border: 1px solid var(--line-strong);
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      transition: all .15s ease;
    }
    button:hover { background: var(--glass-strong); border-color: var(--accent); }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent; color: #fff; font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.1); }
    button.danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.4); }
    button.danger:hover { background: rgba(239, 68, 68, 0.12); }
    button.ghost { border-color: transparent; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    select, input, textarea {
      font-family: inherit; font-size: inherit;
      background: rgba(0,0,0,0.25); color: var(--text-0);
      border: 1px solid var(--line-strong); border-radius: 6px;
      padding: 6px 10px; outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    /* ===== App layout ===== */
    #root { height: 100vh; display: flex; flex-direction: column; }
    .app-shell { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; border-bottom: 1px solid var(--line);
      background: rgba(8, 12, 24, 0.7);
      backdrop-filter: blur(20px);
    }
    .topbar .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.3px;
    }
    .topbar .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: conic-gradient(from 210deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
      box-shadow: 0 0 22px rgba(110, 168, 255, 0.4);
    }
    .topbar .brand-text small { display: block; font-size: 10px; color: var(--text-2); font-weight: 400; letter-spacing: 1.5px; }
    .topbar .session {
      display: flex; align-items: center; gap: 12px;
    }
    .role-pill {
      padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    .role-pill.admin { background: rgba(245, 158, 11, 0.15); color: var(--role-admin); border: 1px solid rgba(245, 158, 11, 0.4); }
    .role-pill.manager { background: rgba(110, 168, 255, 0.15); color: var(--role-manager); border: 1px solid rgba(110, 168, 255, 0.4); }
    .role-pill.approver { background: rgba(139, 92, 246, 0.15); color: var(--role-approver); border: 1px solid rgba(139, 92, 246, 0.4); }
    .role-pill.viewer { background: rgba(20, 184, 166, 0.15); color: var(--role-viewer); border: 1px solid rgba(20, 184, 166, 0.4); }

    .body { display: grid; grid-template-columns: 240px 1fr 320px; height: calc(100vh - 56px); overflow: hidden; }
    .panel { padding: 14px; overflow-y: auto; }
    .panel.left { border-right: 1px solid var(--line); background: rgba(8, 12, 24, 0.4); }
    .panel.right { border-left: 1px solid var(--line); background: rgba(8, 12, 24, 0.4); }
    .panel h3 {
      margin: 0 0 10px; font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; color: var(--text-2); text-transform: uppercase;
    }
    .panel h3:not(:first-child) { margin-top: 22px; }

    .palette-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; margin-bottom: 6px;
      cursor: grab; border: 1px dashed var(--line-strong);
      transition: all .15s ease; user-select: none;
    }
    .palette-item:hover { background: var(--glass-strong); border-color: var(--accent); transform: translateX(2px); }
    .palette-item:active { cursor: grabbing; }
    .palette-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .palette-item small { color: var(--text-2); margin-left: auto; font-size: 10px; }

    /* Flow canvas */
    .canvas-wrap { position: relative; }
    .flow-canvas { width: 100%; height: 100%; background:
      radial-gradient(circle at 50% 50%, rgba(110, 168, 255, 0.05), transparent 60%);
    }
    .canvas-overlay {
      position: absolute; bottom: 14px; left: 14px;
      display: flex; gap: 8px; z-index: 5;
    }
    .canvas-overlay .chip {
      padding: 4px 10px; border-radius: 999px; font-size: 11px;
      background: rgba(8, 12, 24, 0.85); border: 1px solid var(--line-strong);
      backdrop-filter: blur(10px);
    }

    /* Custom node */
    .wf-node {
      min-width: 200px; max-width: 240px;
      border-radius: 12px; padding: 10px 12px;
      background: linear-gradient(160deg, rgba(35, 45, 74, 0.95), rgba(17, 23, 40, 0.95));
      border: 1.5px solid var(--line-strong);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      color: var(--text-0);
      position: relative;
    }
    .wf-node.selected { box-shadow: 0 0 0 2px var(--accent), 0 12px 32px rgba(110, 168, 255, 0.35); }
    .wf-node.locked { opacity: 0.55; }
    .wf-node .node-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .wf-node .node-icon {
      width: 22px; height: 22px; border-radius: 6px;
      display: grid; place-items: center; font-size: 12px;
      background: rgba(0,0,0,0.35);
    }
    .wf-node .node-title { font-weight: 600; font-size: 13px; }
    .wf-node .node-sub { font-size: 11px; color: var(--text-2); }
    .wf-node .role-tag {
      display: inline-block; margin-top: 6px;
      padding: 2px 7px; border-radius: 999px;
      font-size: 10px; letter-spacing: 0.4px;
    }
    .wf-node .node-status {
      position: absolute; top: 8px; right: 8px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--text-2);
    }
    .wf-node .node-status.idle { background: var(--text-2); }
    .wf-node .node-status.running { background: var(--warn); animation: pulse 1.2s infinite; }
    .wf-node .node-status.done { background: var(--ok); }
    .wf-node .node-status.blocked { background: var(--danger); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
    }

    /* node colors per type */
    .wf-node.start { border-color: rgba(34, 197, 94, 0.6); }
    .wf-node.start .node-icon { background: rgba(34, 197, 94, 0.2); color: var(--ok); }
    .wf-node.task { border-color: rgba(110, 168, 255, 0.5); }
    .wf-node.task .node-icon { background: rgba(110, 168, 255, 0.2); color: var(--accent); }
    .wf-node.approval { border-color: rgba(139, 92, 246, 0.6); }
    .wf-node.approval .node-icon { background: rgba(139, 92, 246, 0.2); color: var(--accent-2); }
    .wf-node.decision { border-color: rgba(245, 158, 11, 0.5); }
    .wf-node.decision .node-icon { background: rgba(245, 158, 11, 0.2); color: var(--warn); }
    .wf-node.end { border-color: rgba(239, 68, 68, 0.5); }
    .wf-node.end .node-icon { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .role-tag.admin { background: rgba(245, 158, 11, 0.15); color: var(--role-admin); border: 1px solid rgba(245, 158, 11, 0.3); }
    .role-tag.manager { background: rgba(110, 168, 255, 0.15); color: var(--role-manager); border: 1px solid rgba(110, 168, 255, 0.3); }
    .role-tag.approver { background: rgba(139, 92, 246, 0.15); color: var(--role-approver); border: 1px solid rgba(139, 92, 246, 0.3); }
    .role-tag.viewer { background: rgba(20, 184, 166, 0.15); color: var(--role-viewer); border: 1px solid rgba(20, 184, 166, 0.3); }
    .role-tag.any { background: rgba(255,255,255,0.05); color: var(--text-1); border: 1px solid var(--line-strong); }

    /* React Flow overrides */
    .react-flow__node { padding: 0; border: none; background: transparent; }
    .react-flow__handle { width: 10px; height: 10px; background: var(--accent); border: 2px solid var(--bg-1); }
    .react-flow__edge-path { stroke: rgba(110, 168, 255, 0.6); stroke-width: 2; }
    .react-flow__edge.selected .react-flow__edge-path { stroke: var(--accent); stroke-width: 2.5; }
    .react-flow__controls { background: rgba(8, 12, 24, 0.85); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: none; }
    .react-flow__controls button { background: transparent; color: var(--text-0); border-bottom: 1px solid var(--line); }
    .react-flow__controls button:hover { background: var(--glass-strong); }
    .react-flow__minimap { background: rgba(8, 12, 24, 0.85); border: 1px solid var(--line-strong); border-radius: 8px; }
    .react-flow__background { background: transparent; }
    .react-flow__attribution { display: none; }

    /* Right panel sections */
    .section-card {
      border-radius: 10px; padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .section-card h4 {
      margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-1);
    }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .field label { font-size: 10px; color: var(--text-2); letter-spacing: 0.5px; text-transform: uppercase; }
    .field-row { display: flex; gap: 8px; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 600;
    }
    .badge.ok { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
    .badge.warn { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
    .badge.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .badge.neutral { background: rgba(255,255,255,0.06); color: var(--text-1); }

    .audit-list { font-size: 11px; font-family: ui-monospace, monospace; max-height: 240px; overflow-y: auto; }
    .audit-item { padding: 6px 8px; border-radius: 6px; margin-bottom: 3px; background: rgba(0,0,0,0.2); border-left: 3px solid var(--text-2); }
    .audit-item.deny { border-left-color: var(--danger); }
    .audit-item.grant { border-left-color: var(--ok); }
    .audit-item .audit-ts { color: var(--text-2); font-size: 10px; }
    .audit-item .audit-msg { color: var(--text-0); }

    .user-card {
      display: flex; align-items: center; gap: 10px; padding: 10px;
      border-radius: 10px; margin-bottom: 8px; cursor: pointer;
      border: 1px solid var(--line);
      transition: all .15s ease;
    }
    .user-card:hover { border-color: var(--accent); background: var(--glass-strong); }
    .user-card.active { border-color: var(--accent); background: rgba(110, 168, 255, 0.1); }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 700;
      color: #fff; flex-shrink: 0;
    }
    .avatar.admin { background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .avatar.manager { background: linear-gradient(135deg, #6ea8ff, #3b82f6); }
    .avatar.approver { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
    .avatar.viewer { background: linear-gradient(135deg, #14b8a6, #06b6d4); }

    .progress-bar { height: 4px; background: rgba(0,0,0,0.3); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-3)); transition: width .4s ease; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.2);
      border: 1px solid var(--line);
    }
    .stat .v { font-size: 18px; font-weight: 700; }
    .stat .l { font-size: 10px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }

    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; color: var(--text-1); }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

    .empty-state {
      display: grid; place-items: center; height: 100%;
      color: var(--text-2); text-align: center; padding: 20px;
    }
    .empty-state .big { font-size: 32px; opacity: 0.3; margin-bottom: 8px; }

    .toast {
      position: fixed; bottom: 20px; right: 20px;
      padding: 12px 18px; border-radius: 10px;
      background: rgba(8, 12, 24, 0.95);
      border: 1px solid var(--line-strong);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      z-index: 100;
      animation: slideIn .25s ease;
      max-width: 360px;
    }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast.danger { border-left: 3px solid var(--danger); }
    .toast.success { border-left: 3px solid var(--ok); }
    .toast.info { border-left: 3px solid var(--accent); }

    .perm-matrix { font-size: 10px; width: 100%; border-collapse: collapse; margin-top: 8px; }
    .perm-matrix th, .perm-matrix td { padding: 4px 6px; text-align: center; border: 1px solid var(--line); }
    .perm-matrix th { background: rgba(0,0,0,0.3); font-weight: 600; color: var(--text-2); }
    .perm-matrix .yes { color: var(--ok); }
    .perm-matrix .no { color: var(--text-2); }

    /* Tab bar */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .tab-btn {
      flex: 1; padding: 6px 10px; font-size: 11px;
      background: transparent; border: 1px solid transparent; border-radius: 6px;
      color: var(--text-2); cursor: pointer;
    }
    .tab-btn.active { background: var(--glass-strong); color: var(--text-0); border-color: var(--accent); }
    .tab-btn:hover:not(.active) { background: var(--glass); color: var(--text-1); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

    /* Lock overlay on locked nodes */
    .lock-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 18px; color: var(--danger); pointer-events: none;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:grid;place-items:center;height:100vh;color:#a8b3cf;font-family:system-ui">
      載入 React + React Flow 中…
    </div>
  </div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    // ReactFlow UMD puts everything under window.ReactFlow namespace
    const RF = window.ReactFlow;
    const {
      ReactFlow, ReactFlowProvider, Background, Controls, MiniMap,
      useNodesState, useEdgesState, addEdge, applyNodeChanges, applyEdgeChanges,
      Handle, Position, MarkerType
    } = RF;

    /* =====================================================================
     * 1. RBAC CORE (from skill: Advanced Access Control and Logging)
     * ===================================================================== */
    const ROLE_HIERARCHY = {
      admin:    ['approver', 'manager', 'viewer'],
      approver: ['manager', 'viewer'],
      manager:  ['viewer'],
      viewer:   []
    };

    const ROLE_PERMISSIONS = {
      admin: [
        'workflow.create', 'workflow.delete', 'workflow.edit',
        'node.create', 'node.delete', 'node.edit', 'node.lock',
        'role.assign', 'audit.view', 'audit.clear',
        'workflow.run', 'workflow.reset',
        'edge.create', 'edge.delete'
      ],
      approver: [
        'workflow.run', 'workflow.reset',
        'node.edit', 'node.lock', 'node.delete',
        'audit.view', 'edge.create', 'edge.delete'
      ],
      manager: [
        'workflow.create', 'workflow.edit', 'workflow.run',
        'node.create', 'node.edit',
        'edge.create',
        'audit.view'
      ],
      viewer: [
        'audit.view'
      ]
    };

    function expandRoles(role) {
      const out = new Set([role]);
      const queue = [role];
      while (queue.length) {
        const cur = queue.shift();
        for (const r of (ROLE_HIERARCHY[cur] || [])) {
          if (!out.has(r)) { out.add(r); queue.push(r); }
        }
      }
      return Array.from(out);
    }

    function can(user, perm) {
      if (!user || !user.role) return false;
      return expandRoles(user.role).some(r => (ROLE_PERMISSIONS[r] || []).includes(perm));
    }

    function roleCanHandleNode(user, requiredRole) {
      if (!requiredRole || requiredRole === 'any') return true;
      return expandRoles(user.role).includes(requiredRole);
    }

    const DEMO_USERS = [
      { id: 'u1', email: 'admin@org.local',    name: 'Alex Chen',    role: 'admin',    avatar: 'AC' },
      { id: 'u2', email: 'manager@org.local',  name: 'Mira Lin',     role: 'manager',  avatar: 'ML' },
      { id: 'u3', email: 'approver@org.local', name: 'Daria Wang',   role: 'approver', avatar: 'DW' },
      { id: 'u4', email: 'viewer@org.local',   name: 'Ben Ho',       role: 'viewer',   avatar: 'BH' }
    ];

    /* =====================================================================
     * 2. NODE TYPE REGISTRY
     * ===================================================================== */
    const NODE_TYPES = {
      start:    { label: '開始',   icon: '▶', color: 'start',    defaultRole: 'any',      description: '流程入口點' },
      task:     { label: '任務',   icon: '✎', color: 'task',     defaultRole: 'manager',  description: '指派給特定角色的執行任務' },
      approval: { label: '審批',   icon: '✓', color: 'approval', defaultRole: 'approver', description: '需要指定角色審批才能通過' },
      decision: { label: '決策',   icon: '◆', color: 'decision', defaultRole: 'manager',  description: '條件分支節點 (Y/N)' },
      end:      { label: '結束',   icon: '■', color: 'end',      defaultRole: 'any',      description: '流程終點' }
    };

    /* =====================================================================
     * 3. CUSTOM NODE COMPONENT
     * ===================================================================== */
    function WorkflowNode({ data, selected }) {
      const cfg = NODE_TYPES[data.nodeType] || NODE_TYPES.task;
      const status = data.status || 'idle';
      const locked = data.locked && !data.unlockedFor;
      return (
        <div
          className={`wf-node ${cfg.color} ${selected ? 'selected' : ''} ${locked ? 'locked' : ''}`}
          data-testid={`wf-node-${data.nodeType}`}
        >
          <Handle type="target" position={Position.Left} />
          <div className="node-status" data-status={status} title={`狀態: ${status}`}></div>
          <div className="node-head">
            <div className="node-icon">{cfg.icon}</div>
            <div>
              <div className="node-title">{data.label || cfg.label}</div>
              <div className="node-sub">{cfg.description}</div>
            </div>
          </div>
          {data.requiredRole && data.requiredRole !== 'any' && (
            <span className={`role-tag ${data.requiredRole}`}>
              需要: {data.requiredRole}
            </span>
          )}
          {data.requiredRole === 'any' && (
            <span className="role-tag any">任何角色</span>
          )}
          {data.assignee && (
            <div style={{marginTop: 4, fontSize: 10, color: 'var(--text-1)'}}>
              負責人: <strong>{data.assignee}</strong>
            </div>
          )}
          {locked && <div className="lock-overlay">🔒</div>}
          <Handle type="source" position={Position.Right} />
        </div>
      );
    }

    const nodeTypes = { workflow: WorkflowNode };

    /* =====================================================================
     * 4. INITIAL SAMPLE WORKFLOW
     * ===================================================================== */
    function makeInitialWorkflow() {
      return {
        name: '員工入職流程',
        nodes: [

        return data;
      } catch (e) { return null; }

    /* =====================================================================
     * 7. DAG TOPOLOGICAL SORT (from skill: DAG Topological Sorting)
     * ===================================================================== */
    function topoSort(nodes, edges) {
      const inDeg = {};
      const adj = {};
      nodes.forEach(n => { inDeg[n.id] = 0; adj[n.id] = []; });
      edges.forEach(e => {
        if (inDeg[e.source] !== undefined && inDeg[e.target] !== undefined) {
          adj[e.source].push(e.target);
          inDeg[e.target] += 1;
        }
      });
      const queue = Object.keys(inDeg).filter(k => inDeg[k] === 0);
      const order = [];
      while (queue.length) {
        const id = queue.shift();
        order.push(id);
        for (const next of adj[id]) {
          inDeg[next] -= 1;
          if (inDeg[next] === 0) queue.push(next);
        }
      }
      if (order.length !== nodes.length) {
        return { order, cycle: true };
      }
      return { order, cycle: false };
    }

    /* =====================================================================
     * 15. ROOT APP
     * ===================================================================== */
    function App() {
      // ====== Restore from localStorage ======
      const persisted = useMemo(() => loadState(), []);
      const initial = useMemo(() => {
        const wf = makeInitialWorkflow();
        return {
          user: persisted?.user || DEMO_USERS[0],
          nodes: persisted?.nodes || wf.nodes,
          edges: persisted?.edges || wf.edges,
          workflowName: persisted?.workflowName || wf.name,
          audit: persisted?.audit || [],
          runState: persisted?.runState || { totalSteps: 0, completedSteps: 0, running: false, topo: { order: [], cycle: false } }
        };
      }, []);

      const [user, setUser] = useState(initial.user);
      const [nodes, setNodes] = useNodesState(initial.nodes);
      const [edges, setEdges] = useEdgesState(initial.edges);
      const [workflowName, setWorkflowName] = useState(initial.workflowName);
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [audit, setAudit] = useState(initial.audit);
      const [toast, setToast] = useState(null);
      const [tab, setTab] = useState('props');
      const [runState, setRunState] = useState(initial.runState);
      const auditRef = useRef({ entries: initial.audit, listeners: [] });

      // ----- audit subscriber
      useEffect(() => {
        const fn = (entries) => setAudit([...entries]);
        auditRef.current.listeners.push(fn);
        return () => { auditRef.current.listeners = auditRef.current.listeners.filter(x => x !== fn); };
      }, []);

      // ----- compute topo on every graph change
      useEffect(() => {
        const t = topoSort(nodes, edges);
        setRunState(rs => ({
          ...rs,
          topo: t,
          totalSteps: t.order.length
        }));
      }, [nodes, edges]);

      // ----- persistence (debounced via simple effect)
      useEffect(() => {
        const id = setTimeout(() => {
          saveState({ user, nodes, edges, workflowName, audit: auditRef.current, runState });
        }, 250);
        return () => clearTimeout(id);
      }, [user, nodes, edges, workflowName, runState]);

      const showToast = (msg, kind = 'info') => {
        setToast({ msg, kind, id: Date.now() });
        setTimeout(() => setToast(null), 2800);
      };

      const log = useCallback((entry) => {
        logAudit(auditRef.current, entry);
      }, []);

      // ----- RBAC helpers (closure-bound to current user)
      const c = useCallback((perm) => can(user, perm), [user]);
      const selectedNode = useMemo(
        () => nodes.find(n => n.id === selectedNodeId),
        [nodes, selectedNodeId]
      );

      // ----- handlers
      const onConnect = useCallback((connection) => {
        if (!c('edge.create')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試建立連線 (權限不足)` });
          showToast('權限不足:無法建立連線', 'danger');
          return;
        }
        const newEdge = {
          ...connection,
          id: 'e' + Date.now(),
          type: 'smoothstep',
          animated: true,
          style: { stroke: '#6ea8ff' },
          markerEnd: { type: MarkerType.ArrowClosed, color: '#6ea8ff' }
        };
        setEdges(eds => addEdge(newEdge, eds));
        log({ kind: 'grant', message: `✓ ${user.role} 建立連線 ${connection.source} → ${connection.target}` });
      }, [c, user, log, setEdges]);

      const onNodeClick = useCallback((_, node) => {
        setSelectedNodeId(node.id);
        setTab('props');
      }, []);

      const onPaneClick = useCallback(() => {
        setSelectedNodeId(null);
      }, []);

      const updateNode = useCallback((id, patch) => {
        if (!c('node.edit')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試編輯節點 ${id}` });
          showToast('權限不足:無法編輯節點', 'danger');
          return;
        }
        setNodes(nds => nds.map(n => n.id === id ? {
          ...n,
          data: { ...n.data, ...patch }
        } : n));
        log({ kind: 'grant', message: `✓ ${user.role} 更新節點 ${id}: ${JSON.stringify(patch)}` });
      }, [c, user, log, setNodes]);

      const deleteNode = useCallback((id) => {
        if (!c('node.delete')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試刪除節點 ${id}` });
          showToast('權限不足:無法刪除', 'danger');
          return;
        }
        setNodes(nds => nds.filter(n => n.id !== id));
        setEdges(eds => eds.filter(e => e.source !== id && e.target !== id));
        if (selectedNodeId === id) setSelectedNodeId(null);
        log({ kind: 'grant', message: `✓ ${user.role} 刪除節點 ${id}` });
      }, [c, user, log, setNodes, setEdges, selectedNodeId]);

      const addNode = useCallback((type) => {
        if (!c('node.create') && !c('workflow.edit')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試新增節點` });
          showToast('權限不足:無法新增節點', 'danger');
          return;
        }
        const cfg = NODE_TYPES[type];
        const id = 'n' + Date.now().toString(36);
        const newNode = {
          id,
          type: 'workflow',
          position: {
            x: 200 + Math.random() * 400,
            y: 80 + Math.random() * 300
          },
          data: {
            nodeType: type,
            label: cfg.label + ' #' + id.slice(-3),
            requiredRole: cfg.defaultRole,
            status: 'idle'
          }
        };
        setNodes(nds => [...nds, newNode]);
        setSelectedNodeId(id);
        log({ kind: 'grant', message: `✓ ${user.role} 新增 ${cfg.label} 節點 ${id}` });
      }, [c, user, log, setNodes]);

      // ----- DAG execution
      const runWorkflow = useCallback(() => {
        if (!c('workflow.run')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試啟動工作流` });
          showToast('權限不足:無法執行工作流', 'danger');
          return;
        }
        const t = topoSort(nodes, edges);
        if (t.cycle) {
          showToast('工作流包含循環,無法執行', 'danger');
          log({ kind: 'deny', message: `❌ 偵測到循環,拒絕執行` });
          return;
        }
        // Validate: current user can handle every requiredRole
        const blocked = nodes.filter(n => !roleCanHandleNode(user, n.data.requiredRole) && n.data.nodeType !== 'end');
        if (blocked.length > 0) {
          const roles = [...new Set(blocked.map(n => n.data.requiredRole))].join(', ');
          showToast(`您無法處理需要 ${roles} 角色的節點`, 'danger');
          log({ kind: 'deny', message: `❌ ${user.role} 角色不足以處理 ${roles} 節點` });
          return;
        }
        setRunState(rs => ({ ...rs, running: true, completedSteps: 0 }));
        log({ kind: 'grant', message: `▶ ${user.role} 啟動工作流 "${workflowName}" (${t.order.length} 步)` });

        // Simulate step-by-step execution
        let i = 0;
        const step = () => {
          if (i >= t.order.length) {
            setRunState(rs => ({ ...rs, running: false, completedSteps: t.order.length }));
            showToast('工作流執行完成 ✓', 'success');
            log({ kind: 'grant', message: `✅ 工作流 "${workflowName}" 執行完成` });
            return;
          }
          const nodeId = t.order[i];
          setNodes(nds => nds.map(n => n.id === nodeId ? { ...n, data: { ...n.data, status: 'done' } } : n));
          setRunState(rs => ({ ...rs, completedSteps: i + 1 }));
          i++;
          setTimeout(step, 450);
        };
        setNodes(nds => nds.map(n => ({ ...n, data: { ...n.data, status: 'idle' } })));
        setTimeout(step, 250);
      }, [c, user, log, nodes, edges, workflowName, setNodes]);

      const stepForward = useCallback(() => {
        if (!c('workflow.run')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試單步執行` });
          showToast('權限不足', 'danger');
          return;
        }
        const t = topoSort(nodes, edges);
        const next = t.order[runState.completedSteps];
        if (!next) { showToast('已執行完所有步驟', 'info'); return; }
        const node = nodes.find(n => n.id === next);
        if (node && !roleCanHandleNode(user, node.data.requiredRole) && node.data.nodeType !== 'end') {
          log({ kind: 'deny', message: `❌ ${user.role} 無法處理 ${next} (需要 ${node.data.requiredRole})` });
          showToast(`需要 ${node.data.requiredRole} 角色才能處理此步驟`, 'danger');
          return;
        }
        setNodes(nds => nds.map(n => n.id === next ? { ...n, data: { ...n.data, status: 'done' } } : n));
        setRunState(rs => ({ ...rs, completedSteps: rs.completedSteps + 1 }));
        log({ kind: 'grant', message: `✓ 執行步驟: ${next} (${node?.data?.label || ''})` });
      }, [c, user, log, nodes, edges, runState.completedSteps, setNodes]);

      const resetWorkflow = useCallback(() => {
        if (!c('workflow.reset')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試重置` });
          showToast('權限不足', 'danger');
          return;
        }
        setNodes(nds => nds.map(n => ({ ...n, data: { ...n.data, status: 'idle' } })));
        setRunState(rs => ({ ...rs, completedSteps: 0, running: false }));
        log({ kind: 'grant', message: `⟲ ${user.role} 重置工作流` });
        showToast('工作流已重置', 'info');
      }, [c, user, log, setNodes]);

      const clearAudit = useCallback(() => {
        if (!c('audit.clear')) {
          log({ kind: 'deny', message: `❌ ${user.role} 嘗試清除稽核日誌` });
          showToast('僅 admin 可清除稽核日誌', 'danger');
          return;
        }
        auditRef.current.entries = [];
        auditRef.current.listeners.forEach(fn => fn([]));
        log({ kind: 'grant', message: `✓ ${user.role} 清除稽核日誌` });
      }, [c, user, log]);

      const switchUser = useCallback((u) => {
        setUser(u);
        setSelectedNodeId(null);
        log({ kind: 'grant', message: `👤 切換至 ${u.name} (${u.role})` });
        showToast(`已切換至 ${u.name}`, 'info');
      }, [log]);

      // ====== Render ======
      return (
        <div className="app-shell">
          {/* Top bar */}
          <div className="topbar">
            <div className="brand">
              <div className="brand-mark"></div>
              <div className="brand-text">
                RBAC Workflow Manager
                <small>基於角色的工作流管理系統 · React Flow × DAG × RBAC</small>
              </div>
            </div>
            <div className="session">
              <div style={{textAlign: 'right'}}>
                <div style={{fontWeight: 600}}>{user.name}</div>
                <div style={{fontSize: 10, color: 'var(--text-2)'}}>{user.email}</div>
              </div>
              <div className={`avatar ${user.role}`} style={{width: 36, height: 36}}>
                {user.avatar}
              </div>
              <span className={`role-pill ${user.role}`}>{user.role}</span>
            </div>
          </div>

          {/* Body */}
          <div className="body">
            {/* Left panel — users + palette */}
            <div className="panel left">
              <UserSwitcher currentUser={user} onSwitch={switchUser} />
              <NodePalette canAdd={c('node.create') || c('workflow.edit')} onAdd={addNode} />
            </div>

            {/* Canvas */}
            <div className="canvas-wrap">
              <ReactFlowProvider>
                <FlowCanvas
                  nodes={nodes}
                  edges={edges}
                  onNodesChange={(changes) => {
                    // permission gate: only filter out selectChanges; allow position, remove, dimensions
                    setNodes(nds => applyNodeChanges(changes, nds));
                  }}
                  onEdgesChange={(changes) => setEdges(eds => applyEdgeChanges(changes, eds))}
                  onConnect={onConnect}
                  onNodeClick={onNodeClick}
                  onPaneClick={onPaneClick}
                  selectedNode={selectedNode}
                  currentUser={user}
                />
              </ReactFlowProvider>
              <div className="canvas-overlay">
                <div className="chip">
                  {user.role === 'admin'    && '🔓 完整權限'}
                  {user.role === 'approver' && '🛡 審批權限'}
                  {user.role === 'manager'  && '✎ 編輯權限'}
                  {user.role === 'viewer'   && '👁 唯讀模式'}
                </div>
                <div className="chip">節點 {nodes.length} · 連線 {edges.length}</div>
              </div>
            </div>

            {/* Right panel — props / audit / run */}
            <div className="panel right">
              <div className="tab-bar">
                <button className={`tab-btn ${tab === 'props' ? 'active' : ''}`} onClick={() => setTab('props')}>屬性</button>
                <button className={`tab-btn ${tab === 'run' ? 'active' : ''}`} onClick={() => setTab('run')}>執行</button>
                <button className={`tab-btn ${tab === 'audit' ? 'active' : ''}`} onClick={() => setTab('audit')}>稽核</button>
                <button className={`tab-btn ${tab === 'rbac' ? 'active' : ''}`} onClick={() => setTab('rbac')}>RBAC</button>
              </div>

              {tab === 'props' && (
                <PropertiesPanel
                  node={selectedNode}
                  onUpdate={updateNode}
                  onDelete={deleteNode}
                  currentUser={user}
                  can={c}
                />
              )}
              {tab === 'run' && (
                <ExecutionPanel
                  runState={runState}
                  canRun={c('workflow.run')}
                  canReset={c('workflow.reset')}
                  onRun={runWorkflow}
                  onReset={resetWorkflow}
                  onStepForward={stepForward}
                  workflowName={workflowName}
                  setWorkflowName={setWorkflowName}
                  canRename={c('workflow.edit')}
                  nodeCount={nodes.length}
                  edgeCount={edges.length}
                />
              )}
              {tab === 'audit' && (
                <AuditPanel
                  audit={audit}
                  canClear={c('audit.clear')}
                  onClear={clearAudit}
                />
              )}
              {tab === 'rbac' && (
                <div>
                  <h3>RBAC 權限矩陣</h3>
                  <p style={{fontSize: 11, color: 'var(--text-2)', lineHeight: 1.6}}>
                    系統採用四層角色繼承:<br/>
                    <strong style={{color: 'var(--role-admin)'}}>admin</strong> → <strong style={{color: 'var(--role-approver)'}}>approver</strong> → <strong style={{color: 'var(--role-manager)'}}>manager</strong> → <strong style={{color: 'var(--role-viewer)'}}>viewer</strong>
                  </p>
                  <PermissionMatrix />
                  <h3>節點角色指派</h3>
                  <p style={{fontSize: 11, color: 'var(--text-2)', lineHeight: 1.6}}>
                    每個工作流節點可以指定「需要角色」。若當前使用者角色不包含該角色,節點會被標記為鎖定。
                  </p>
                  <div style={{display: 'flex', flexDirection: 'column', gap: 4}}>
                    {nodes.filter(n => n.data.requiredRole && n.data.requiredRole !== 'any').map(n => (
                      <div key={n.id} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '4px 8px', borderRadius: 6, background: 'rgba(0,0,0,0.2)'}}>
                        <span style={{fontSize: 11}}>{n.data.label}</span>
                        <span className={`role-tag ${n.data.requiredRole}`} style={{fontSize: 9}}>{n.data.requiredRole}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Toast */}
          {toast && (
            <div className={`toast ${toast.kind}`}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    /* =====================================================================
     * 16. MOUNT
     * ===================================================================== */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
