<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cross-Browser Smoke &amp; Visual Regression Target</title>
  <style>
    :root {
      --bg: #0f1226;
      --panel: #1a1f3a;
      --accent: #4f8cff;
      --accent-2: #6fe7c4;
      --text: #e6e9f5;
      --muted: #9aa3c7;
      --danger: #ff6b6b;
      --ok: #6fe7c4;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 20% 0%, #1a2150 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    p.lead {
      color: var(--muted);
      margin: 0 0 32px;
      font-size: 15px;
    }
    .card {
      background: rgba(26, 31, 58, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
    }
    .card h2 {
      font-size: 17px;
      margin: 0 0 14px;
      color: var(--accent-2);
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    button:hover { background: #6aa1ff; }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: transparent;
      color: var(--text);
    }
    button.secondary:hover { background: rgba(255, 255, 255, 0.05); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(111, 231, 196, 0.12);
      color: var(--ok);
      font-size: 13px;
      font-weight: 600;
      min-width: 180px;
      justify-content: center;
    }
    .status[data-state="ready"] {
      background: rgba(154, 163, 199, 0.12);
      color: var(--muted);
    }
    .status[data-state="passed"] {
      background: rgba(111, 231, 196, 0.16);
      color: var(--ok);
    }
    .status[data-state="failed"] {
      background: rgba(255, 107, 107, 0.16);
      color: var(--danger);
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .counter {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .log {
      margin-top: 14px;
      background: #0a0d1f;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      color: var(--muted);
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .log .entry { color: var(--text); }
    .log .entry .ts { color: var(--accent); margin-right: 6px; }
    .meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }
    .meta strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cross-Browser Smoke &amp; Visual Regression</h1>
    <p class="lead">Interactive target page for Playwright cross-browser automation + visual diff baseline.</p>

    <div class="card" data-testid="check-card">
      <h2>1. Smoke Flow</h2>
      <div class="row">
        <span data-testid="check-status" class="status" data-state="ready">Ready to run</span>
        <button data-testid="run-check" type="button">Run Check</button>
        <button data-testid="reset-check" class="secondary" type="button">Reset</button>
      </div>
      <div class="log" data-testid="event-log" aria-live="polite">
        <div class="entry"><span class="ts">[00:00:00]</span>awaiting first run...</div>
      </div>
    </div>

    <div class="card" data-testid="counter-card">
      <h2>2. Click Counter</h2>
      <div class="row">
        <span class="counter" data-testid="counter-value">0</span>
        <button data-testid="counter-inc" type="button">Increment</button>
        <button data-testid="counter-dec" class="secondary" type="button">Decrement</button>
      </div>
    </div>

    <div class="card" data-testid="info-card">
      <h2>3. Environment</h2>
      <div class="meta">
        <div><strong>User Agent:</strong> <span data-testid="ua-info">detected at runtime</span></div>
        <div><strong>Viewport:</strong> <span data-testid="vp-info">detected at runtime</span></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var state = { runCount: 0, counter: 0, startedAt: new Date() };
      var status = document.querySelector('[data-testid="check-status"]');
      var log = document.querySelector('[data-testid="event-log"]');
      var counterEl = document.querySelector('[data-testid="counter-value"]');
      var uaEl = document.querySelector('[data-testid="ua-info"]');
      var vpEl = document.querySelector('[data-testid="vp-info"]');
      var runBtn = document.querySelector('[data-testid="run-check"]');
      var resetBtn = document.querySelector('[data-testid="reset-check"]');
      var incBtn = document.querySelector('[data-testid="counter-inc"]');
      var decBtn = document.querySelector('[data-testid="counter-dec"]');

      function pad(n) { return n < 10 ? "0" + n : "" + n; }
      function timestamp() {
        var d = new Date();
        return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      }
      function appendLog(msg) {
        var line = document.createElement("div");
        line.className = "entry";
        line.innerHTML = '<span class="ts">[' + timestamp() + "]</span>" + msg;
        log.appendChild(line);
        while (log.children.length > 8) log.removeChild(log.firstChild);
        log.scrollTop = log.scrollHeight;
      }
      function setStatus(stateName, text) {
        status.setAttribute("data-state", stateName);
        status.textContent = text;
      }
      function setCounter(n) {
        state.counter = n;
        counterEl.textContent = String(n);
      }
      function detectEnv() {
        uaEl.textContent = navigator.userAgent;
        vpEl.textContent = window.innerWidth + "x" + window.innerHeight;
      }

      runBtn.addEventListener("click", function () {
        state.runCount += 1;
        if (state.runCount % 2 === 1) {
          setStatus("passed", "Smoke check passed");
          appendLog("run #" + state.runCount + " -> passed");
        } else {
          setStatus("failed", "Smoke check failed");
          appendLog("run #" + state.runCount + " -> failed");
        }
      });
      resetBtn.addEventListener("click", function () {
        state.runCount = 0;
        setStatus("ready", "Ready to run");
        appendLog("reset to ready");
      });
      incBtn.addEventListener("click", function () { setCounter(state.counter + 1); });
      decBtn.addEventListener("click", function () { setCounter(state.counter - 1); });
      window.addEventListener("resize", detectEnv);
      detectEnv();
    })();
  </script>
</body>
</html>
