<!doctype html>
<html lang="zh-Hant" class="h-full antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Motion Kit — Framer Motion 微動畫庫 · Tailwind 設計系統</title>
  <meta name="description" content="一個基於 Framer Motion 的可重用微動畫組件庫，搭配信感級 Tailwind CSS 設計系統：暗色模式、玻璃面板、磁性按鈕、Tilt 卡片、Marquee、Stagger 進場、Scroll 進度條、可摺疊區塊。完全 single-file，可直接打開瀏覽器。"/>

  <!-- ① Tailwind CSS v4 (browser CDN) — JS-less, pure CSS @theme config -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4/dist/index.global.min.js"></script>

  <!-- ② 設計系統：CSS-first @theme 配置 (Tailwind v4) -->
  <style type="text/tailwindcss">
    @theme {
      /* === Colors === */
      --color-canvas:        #0b0d12;
      --color-canvas-subtle: #10131a;
      --color-canvas-raised: #161a23;
      --color-ink:           #e6e8ee;
      --color-ink-soft:      #a4abb8;
      --color-ink-mute:      #6c7280;
      --color-brand-50:      #eef4ff;
      --color-brand-100:     #dbe6ff;
      --color-brand-200:     #b8ccff;
      --color-brand-300:     #8aabff;
      --color-brand-400:     #5a87ff;
      --color-brand-500:     #3b6bff;
      --color-brand-600:     #2a55e6;
      --color-brand-700:     #1f43b8;
      --color-brand-800:     #1b378f;
      --color-brand-900:     #172b6b;
      --color-accent:        #7cf5cf;
      --color-accent-soft:   #34d9a7;
      --color-warn:          #f5a524;
      --color-danger:        #f0556d;
      --color-success:       #34d9a7;

      /* === Type scale === */
      --font-display: "Cabinet Grotesk", "Geist", "Inter", system-ui, sans-serif;
      --font-sans:    "Geist", "Inter", system-ui, sans-serif;
      --font-mono:    "JetBrains Mono", "Geist Mono", ui-monospace, monospace;

      /* === Radii === */
      --radius-4xl: 2rem;
      --radius-5xl: 2.5rem;

      /* === Easings (named) === */
      --ease-out-expo:   cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-quart:  cubic-bezier(0.25, 1, 0.5, 1);
      --ease-in-out-soft: cubic-bezier(0.7, 0, 0.3, 1);
    }

    /* === Custom keyframes (CSS layer for utilities) === */
    @keyframes fade-in {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }
    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* 動畫 utilities (對應 tailwind.config.animation) */
    @utility animate-fade-in {
      animation: fade-in 0.5s var(--ease-out-expo) both;
    }
    @utility animate-shimmer {
      background-image: linear-gradient(110deg, rgba(255,255,255,.04) 8%, rgba(255,255,255,.10) 18%, rgba(255,255,255,.04) 33%);
      background-size: 200% 100%;
      animation: shimmer 2.5s linear infinite;
    }
    @utility animate-pulse-soft {
      animation: pulse-soft 2s ease-in-out infinite;
    }
    @utility animate-marquee {
      animation: marquee 28s linear infinite;
    }
  </style>

  <!-- ③ 全域基底樣式 + 自訂元件樣式 (在 @import 之前) -->
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(59,107,255,.18), transparent 60%),
        radial-gradient(900px 600px at -10% 30%, rgba(124,245,207,.10), transparent 60%),
        #0b0d12;
      color: #e6e8ee;
      font-family: 'Geist','Inter',system-ui,sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .hairline { background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); height: 1px; }
    .glass {
      background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 30px 60px -30px rgba(0,0,0,.6);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }
    .scroll-progress { height: 2px; background: linear-gradient(90deg,#3b6bff,#7cf5cf); transform-origin: 0% 50%; }
    .marquee-mask { mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
    .code-block { font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12.5px; line-height:1.65; }
    .ring-soft:focus { outline: 2px solid rgba(59,107,255,.5); outline-offset: 2px; }
    .preserve-3d { transform-style: preserve-3d; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    }
  </style>

  <!-- ④ React + Motion (UMD 雙 CDN) + Babel for in-browser JSX (no build step) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/framer-motion@11.11.10/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body class="min-h-screen">
  <!-- ⑤ Top scroll progress bar (Framer Motion useScroll + useSpring) -->
  <div id="scroll-progress" class="scroll-progress fixed top-0 left-0 right-0 z-50"></div>

  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    /* eslint-disable */
    const { useState, useRef, useEffect, useMemo, useCallback, useLayoutEffect } = React;
    const FM = window["framer-motion"] || window.Motion || {};
    const {
      motion, AnimatePresence, useScroll, useSpring, useTransform, useMotionValue,
      useMotionTemplate, useInView, useReducedMotion, LayoutGroup, Reorder,
    } = FM;

    /* =========================================================
       §1 — 設計系統常數 (Design Tokens 拉成 JS 常數)
       這樣元件可以共用色票/曲線，避免 magic value。
    ========================================================= */
    const DS = {
      ease:  [0.16, 1, 0.3, 1],
      ease2: [0.25, 1, 0.5, 1],
      ease3: [0.7, 0, 0.3, 1],
      spring: { type:'spring', stiffness: 260, damping: 30 },
      soft:   { type:'spring', stiffness: 120, damping: 18 },
    };

    /* =========================================================
       §2 — 共用 primitives
    ========================================================= */
    const Pill = ({ children, tone='brand' }) => {
      const map = {
        brand:  'bg-brand-500/15 text-brand-200 ring-brand-400/30',
        accent: 'bg-accent/15 text-accent ring-accent/30',
        warn:   'bg-warn/15 text-warn ring-warn/30',
      };
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-[11px] font-medium ring-1 ${map[tone]}`}>
          {children}
        </span>
      );
    };

    const Section = ({ eyebrow, title, kicker, children, id }) => (
      <section id={id} className="relative mx-auto w-full max-w-7xl px-6 py-24 md:py-32">
        <div className="mb-12 flex flex-col gap-3 md:mb-16">
          {eyebrow && <Pill tone="brand">{eyebrow}</Pill>}
          <h2 className="font-display text-3xl font-semibold leading-[1.05] tracking-tight md:text-5xl">
            {title}
          </h2>
          {kicker && <p className="max-w-2xl text-base text-ink-soft md:text-lg">{kicker}</p>}
        </div>
        {children}
      </section>
    );

    const Card = ({ children, className='' }) => (
      <div className={`glass rounded-3xl p-6 md:p-8 ${className}`}>{children}</div>
    );

    /* =========================================================
       §3 — 元件 1：磁性按鈕 (Magnetic Button)
    ========================================================= */
    const MagneticButton = ({ children, className='', strength=0.35, ...rest }) => {
      const ref = useRef(null);
      const x = useMotionValue(0), y = useMotionValue(0);
      const sx = useSpring(x, { stiffness: 250, damping: 18, mass: 0.4 });
      const sy = useSpring(y, { stiffness: 250, damping: 18, mass: 0.4 });
      const reduce = useReducedMotion();

      return (
        <motion.button
          ref={ref}
          style={{ x: reduce ? 0 : sx, y: reduce ? 0 : sy }}
          onMouseMove={(e) => {
            if (reduce || !ref.current) return;
            const r = ref.current.getBoundingClientRect();
            x.set((e.clientX - (r.left + r.width/2)) * strength);
            y.set((e.clientY - (r.top  + r.height/2)) * strength);
          }}
          onMouseLeave={() => { x.set(0); y.set(0); }}
          whileTap={{ scale: 0.96 }}
          className={`group relative inline-flex items-center gap-2 overflow-hidden rounded-full bg-gradient-to-br from-brand-500 to-brand-700 px-6 py-3 text-sm font-semibold text-white shadow-[0_0_0_1px_rgba(59,107,255,.35),0_8px_32px_-8px_rgba(59,107,255,.45)] ring-1 ring-white/10 transition-colors ${className}`}
          {...rest}
        >
          <span className="pointer-events-none absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/30 to-transparent transition-transform duration-700 group-hover:translate-x-full" />
          <span className="relative">{children}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" className="relative transition-transform duration-300 group-hover:translate-x-0.5">
            <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </motion.button>
      );
    };

    /* =========================================================
       §4 — 元件 2：Tilt 卡片 (3D Perspective Tilt)
    ========================================================= */
    const TiltCard = ({ children, className='' }) => {
      const ref = useRef(null);
      const mx = useMotionValue(0.5), my = useMotionValue(0.5);
      const rotX = useTransform(my, [0,1], [8, -8]);
      const rotY = useTransform(mx, [0,1], [-8, 8]);
      const gl = useTransform([mx, my], ([x,y]) =>
        `radial-gradient(circle at ${x*100}% ${y*100}%, rgba(255,255,255,0.18), transparent 55%)`
      );
      const reduce = useReducedMotion();

      // useMotionTemplate 需在所有 motionValue 都 stable 之後才能用
      // 用 useMotionTemplate 直接組合 background
      const bg = useMotionTemplate`linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02)), ${gl}`;

      return (
        <motion.div
          ref={ref}
          onMouseMove={(e) => {
            if (reduce || !ref.current) return;
            const r = ref.current.getBoundingClientRect();
            mx.set((e.clientX - r.left) / r.width);
            my.set((e.clientY - r.top)  / r.height);
          }}
          onMouseLeave={() => { mx.set(0.5); my.set(0.5); }}
          style={{
            rotateX: reduce ? 0 : rotX,
            rotateY: reduce ? 0 : rotY,
            transformPerspective: 1000,
            backgroundImage: reduce ? undefined : bg,
          }}
          className={`glass preserve-3d relative cursor-pointer overflow-hidden rounded-3xl p-8 ${className}`}
        >
          {children}
        </motion.div>
      );
    };

    /* =========================================================
       §5 — 元件 3：Stagger 進場列表 (Reveal-on-scroll + stagger)
    ========================================================= */
    const StaggerGrid = ({ items }) => {
      const container = {
        hidden: {},
        show:   { transition: { staggerChildren: 0.07, delayChildren: 0.05 } },
      };
      const child = {
        hidden: { opacity: 0, y: 22, filter: 'blur(6px)' },
        show:   { opacity: 1, y: 0,  filter: 'blur(0px)', transition: { duration: 0.7, ease: DS.ease } },
      };
      return (
        <motion.ul
          variants={container}
          initial="hidden"
          whileInView="show"
          viewport={{ once: true, margin: '-80px' }}
          className="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3"
        >
          {items.map((it, i) => (
            <motion.li key={i} variants={child}
              className="glass group rounded-2xl p-5 transition-colors hover:border-brand-400/40">
              <div className="mb-3 flex items-center gap-2">
                <span className="font-mono text-[11px] text-ink-mute">0{i+1}</span>
                <Pill tone="accent">{it.tag}</Pill>
              </div>
              <h3 className="mb-1 text-lg font-semibold text-ink">{it.title}</h3>
              <p className="text-sm text-ink-soft">{it.desc}</p>
            </motion.li>
          ))}
        </motion.ul>
      );
    };

    /* =========================================================
       §6 — 元件 4：Scroll-linked 視差 Hero
    ========================================================= */
    const Hero = () => {
      const { scrollYProgress } = useScroll();
      const sScale = useTransform(scrollYProgress, [0, 0.2], [1, 0.92]);
      const sY     = useTransform(scrollYProgress, [0, 0.2], [0, -60]);
      const sBlur  = useTransform(scrollYProgress, [0, 0.2], [0, 8]);
      const filter = useMotionTemplate`blur(${sBlur}px)`;

      useEffect(() => {
        const el = document.getElementById('scroll-progress');
        if (!el) return;
        const u = scrollYProgress.on('change', v => { el.style.transform = `scaleX(${v})`; });
        return () => { if (u) u(); };
      }, [scrollYProgress]);

      return (
        <header className="relative overflow-hidden">
          <div className="pointer-events-none absolute inset-0 -z-10">
            <div className="absolute -top-32 left-1/2 h-[480px] w-[480px] -translate-x-1/2 rounded-full bg-brand-500/30 blur-[140px]" />
            <div className="absolute right-0 top-40 h-[320px] w-[320px] rounded-full bg-accent/20 blur-[120px]" />
          </div>

          <div className="mx-auto flex min-h-[88dvh] w-full max-w-7xl flex-col items-start justify-center px-6 py-20">
            <motion.div
              initial={{ opacity: 0, y: 30 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.9, ease: DS.ease }}
              className="mb-6"
            >
              <Pill tone="accent">v1.0 · Motion Kit</Pill>
            </motion.div>

            <motion.h1
              style={{ scale: sScale, y: sY, filter }}
              initial={{ opacity: 0, y: 40 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 1, ease: DS.ease, delay: 0.05 }}
              className="font-display text-5xl font-semibold leading-[0.95] tracking-tight md:text-7xl lg:text-[88px]"
            >
              把介面<span className="bg-gradient-to-r from-brand-300 via-accent to-brand-300 bg-clip-text text-transparent">動起來</span>，
              <br className="hidden md:block" />而且每個像素都對得起設計系統。
            </motion.h1>

            <motion.p
              initial={{ opacity: 0, y: 20 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.9, ease: DS.ease, delay: 0.2 }}
              className="mt-6 max-w-2xl text-lg text-ink-soft md:text-xl"
            >
              10 個開箱即用的 Framer Motion 微動畫元件 + 一套可主題化的 Tailwind 設計系統。Single-file，無建置，CDN 直接跑。Production-ready patterns，不是 demo。
            </motion.p>

            <motion.div
              initial={{ opacity: 0, y: 20 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.9, ease: DS.ease, delay: 0.35 }}
              className="mt-10 flex flex-wrap items-center gap-4"
            >
              <MagneticButton>開始使用</MagneticButton>
              <motion.a
                href="#components"
                whileHover={{ y: -2 }}
                className="group inline-flex items-center gap-2 rounded-full px-5 py-3 text-sm font-medium text-ink-soft ring-1 ring-white/10 transition-colors hover:bg-white/5 hover:text-ink"
              >
                查看元件
                <span className="transition-transform group-hover:translate-y-0.5">↓</span>
              </motion.a>
            </motion.div>

            <motion.div
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              transition={{ delay: 0.6, duration: 1 }}
              className="mt-16 flex items-center gap-3 text-xs text-ink-mute"
            >
              <span className="relative flex h-2 w-2"><span className="absolute inset-0 animate-ping rounded-full bg-accent/60" /><span className="relative inline-block h-2 w-2 rounded-full bg-accent" /></span>
              100% motion driven · prefers-reduced-motion safe
            </motion.div>
          </div>
        </header>
      );
    };

    /* =========================================================
       §7 — 元件 5：可摺疊 FAQ (LayoutGroup + AnimatePresence)
    ========================================================= */
    const FAQItem = ({ q, a, defaultOpen=false }) => {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <motion.div layout className="glass overflow-hidden rounded-2xl">
          <motion.button
            layout
            onClick={() => setOpen(o => !o)}
            className="flex w-full items-center justify-between gap-4 px-6 py-5 text-left"
          >
            <span className="text-base font-medium text-ink md:text-lg">{q}</span>
            <motion.span
              animate={{ rotate: open ? 45 : 0 }}
              transition={DS.spring}
              className="grid h-7 w-7 place-items-center rounded-full bg-white/5 text-brand-300"
            >+</motion.span>
          </motion.button>
          <AnimatePresence initial={false}>
            {open && (
              <motion.div
                key="content"
                initial={{ height: 0, opacity: 0 }}
                animate={{ height: 'auto', opacity: 1 }}
                exit={{ height: 0, opacity: 0 }}
                transition={{ duration: 0.45, ease: DS.ease }}
                className="overflow-hidden"
              >
                <div className="px-6 pb-6 text-sm leading-relaxed text-ink-soft md:text-base">{a}</div>
              </motion.div>
            )}
          </AnimatePresence>
        </motion.div>
      );
    };

    /* =========================================================
       §8 — 元件 6：Marquee + Reorder 拖拽重排
    ========================================================= */
    const Marquee = ({ items }) => (
      <div className="marquee-mask relative overflow-hidden">
        <div className="flex w-max animate-marquee gap-3 will-change-transform">
          {[...items, ...items].map((it, i) => (
            <div key={i} className="glass flex shrink-0 items-center gap-3 rounded-full px-5 py-2.5 text-sm text-ink-soft">
              <span className="text-accent">◆</span>{it}
            </div>
          ))}
        </div>
      </div>
    );

    const ReorderList = () => {
      const [items, setItems] = useState([
        '設定 design tokens','定義 spacing scale','組裝 primitives','串接 motion layer','效能審查 + Lighthouse'
      ]);
      return (
        <LayoutGroup>
          <Reorder.Group axis="y" values={items} onReorder={setItems} className="space-y-2">
            {items.map((t) => (
              <Reorder.Item key={t} value={t}
                className="glass flex cursor-grab items-center gap-3 rounded-xl px-4 py-3 text-sm text-ink active:cursor-grabbing"
                whileDrag={{ scale: 1.03, boxShadow: '0 20px 40px -10px rgba(0,0,0,.5)' }}
              >
                <span className="text-ink-mute">⋮⋮</span>{t}
              </Reorder.Item>
            ))}
          </Reorder.Group>
        </LayoutGroup>
      );
    };

    /* =========================================================
       §9 — 元件 7：Animated Counter
    ========================================================= */
    const Counter = ({ from=0, to=100, duration=1.6 }) => {
      const ref = useRef(null);
      const mv = useMotionValue(from);
      const rounded = useTransform(mv, v => Math.round(v).toLocaleString());
      const inView = useInView(ref, { once: true, margin: '-50px' });
      useEffect(() => {
        if (!inView) return;
        const start = performance.now();
        let raf;
        const tick = (t) => {
          const p = Math.min(1, (t - start) / (duration * 1000));
          const eased = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
          mv.set(from + (to - from) * eased);
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [inView, from, to, duration]);
      return <span ref={ref}><motion.span>{rounded}</motion.span></span>;
    };

    /* =========================================================
       §10 — 元件 8：Toast (AnimatePresence + spring)
    ========================================================= */
    const useToasts = () => {
      const [list, setList] = useState([]);
      const push = useCallback((msg, tone='brand') => {
        const id = Math.random().toString(36).slice(2);
        setList(l => [...l, { id, msg, tone }]);
        setTimeout(() => setList(l => l.filter(t => t.id !== id)), 3200);
      }, []);
      return { list, push };
    };
    const ToastStack = ({ toasts, onDismiss }) => (
      <div className="pointer-events-none fixed bottom-6 right-6 z-50 flex w-full max-w-sm flex-col gap-2">
        <AnimatePresence>
          {toasts.map(t => (
            <motion.div
              key={t.id}
              layout
              initial={{ opacity: 0, x: 40, scale: 0.95 }}
              animate={{ opacity: 1, x: 0, scale: 1 }}
              exit={{ opacity: 0, x: 40, scale: 0.95 }}
              transition={DS.spring}
              className="pointer-events-auto glass flex items-center gap-3 rounded-xl px-4 py-3"
            >
              <span className="h-2 w-2 rounded-full bg-accent shadow-[0_0_8px_rgba(124,245,207,.6)]" />
              <span className="flex-1 text-sm text-ink">{t.msg}</span>
              <button onClick={() => onDismiss(t.id)} className="text-ink-mute transition-colors hover:text-ink">✕</button>
            </motion.div>
          ))}
        </AnimatePresence>
      </div>
    );

    /* =========================================================
       §11 — 元件 9：Tab 切換 (LayoutGroup + layoutId)
    ========================================================= */
    const Tabs = ({ tabs }) => {
      const [active, setActive] = useState(tabs[0].id);
      const cur = tabs.find(t => t.id === active);
      return (
        <div>
          <LayoutGroup id="tab-pills">
            <div className="glass relative inline-flex rounded-full p-1">
              {tabs.map(t => (
                <button key={t.id} onClick={() => setActive(t.id)}
                  className="relative z-10 rounded-full px-4 py-1.5 text-sm font-medium text-ink-soft transition-colors data-[on=true]:text-ink"
                  data-on={t.id === active}
                >
                  {t.id === active && (
                    <motion.span layoutId="tab-bg"
                      className="absolute inset-0 -z-10 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 shadow-[0_0_0_1px_rgba(59,107,255,.35),0_8px_32px_-8px_rgba(59,107,255,.45)]" />
                  )}
                  {t.label}
                </button>
              ))}
            </div>
          </LayoutGroup>
          <div className="mt-6">
            <AnimatePresence mode="wait">
              <motion.div key={cur.id}
                initial={{ opacity: 0, y: 12, filter: 'blur(6px)' }}

          <div className="h-3 w-1/2 animate-shimmer rounded" />

       §13 — 元件 11：Toast 觸發示範

    /* =========================================================
       §15 — 主頁面
    ========================================================= */

      { tag:'Hero',     title:'Scroll-linked 視差',     desc:'標題跟著滾動縮放、位移、模糊，0 React re-render。' },

      { tag:'Card',     title:'Tilt 3D 透視',           desc:'滑鼠追蹤 + 內反光高光，呈現物理玻璃質感。' },
      { tag:'List',     title:'Stagger 進場',           desc:'子元素錯時進場 + 模糊轉清晰，自然不機械。' },
      { tag:'Layout',   title:'FAQ 平滑摺疊',           desc:'LayoutGroup 動態高度 + 圖示旋轉。' },
      { tag:'Marquee',  title:'無限跑馬燈',             desc:'雙倍副本無縫銜接，搭配 mask 漸隱收邊。' },

      { tag:'Counter',  title:'Spring 計數',            desc:'進入視口才觸發，ease-out-expo 收尾。' },
      { tag:'Toast',    title:'佇列式通知',             desc:'AnimatePresence 自動處理進入離場。' },
      { tag:'Tabs',     title:'共享佈局',               desc:'layoutId 讓 pill 切換像同一個元件變形。' },
      { tag:'Skeleton', title:'Shimmer 骨架屏',         desc:'純 CSS keyframes 動畫，零 JS 開銷。' },
      { tag:'A11y',     title:'可訪問性',               desc:'prefers-reduced-motion 自動降級為靜態。' },
    ];

    const tabs = [
      { id:'motion',  label:'Motion',  body:'每個進場、離場、互動都遵循同一套 spring 參數：stiffness 260 / damping 30 的「果斷不彈跳」基準。設計意圖是「動作要被看見，但不喧賓奪主」。' },
      { id:'tokens',  label:'Tokens',  body:'色票、字型、圓角、陰影、緩動曲線全部在 @theme 集中定義。換品牌只要改 5 行；元件零修改。' },
      { id:'perf',    label:'Perf',    body:'只用 transform / opacity；useMotionValue 避免 React re-render；GSAP/Three.js 不混用；動畫皆在 React.memo 葉元件。' },
      { id:'a11y',    label:'A11y',    body:'prefers-reduced-motion 直接把所有 animation-duration 設為 0s。鍵盤焦點環使用 outline 而非 box-shadow 以免被裁切。' },
    ];

    const App = () => (

        <div className="my-6">

        <Section id="components" eyebrow="01 · 元件庫" title="10+ 個可重用微動畫"
          kicker="從 Hero 到 Toast，每個元件都遵循一致的設計語言、命名與行為。所有原始碼都內嵌在這個檔案中，可以直接拷貝到任何 React 專案。">
          <StaggerGrid items={items.slice(0, 6)} />
          <div className="mt-6">
            <StaggerGrid items={items.slice(6)} />
          </div>
        </Section>

        <div className="hairline mx-auto w-full max-w-7xl" />

        <Section id="demos" eyebrow="02 · 互動展示" title="每一個都能用"

          <div className="grid grid-cols-1 gap-6 md:grid-cols-3">
            {[

          </div>

          <div className="mt-12">
            <Tabs tabs={tabs} />

        </Section>

        <div className="hairline mx-auto w-full max-w-7xl" />

        <Section id="faq" eyebrow="04 · 常見問題" title="設計紀律"
          kicker="看起來漂亮只是結果，過程中守住紀律才是不退化的關鍵。">
          <div className="space-y-3">
            <FAQItem defaultOpen q="為什麼不直接用 CSS animation 就好？"
              a="CSS 適合做「無限循環」與「單純進入離場」。但遇到 spring 緩動、layout 過渡、進度追蹤、動畫編隊這類需要中繼狀態的情境，Framer Motion 的 motion value 與宣告式 API 會比維護一堆 keyframes 省下 3-5 倍工。" />
            <FAQItem q="會影響 Lighthouse 嗎？"
              a="Framer Motion gzip 約 32KB。對多數網站是 < 5% 的 JS 預算。若你追求極致，可改用 motion-mini（4KB）或在桌機載入、行動裝置不載。" />
            <FAQItem q="怎麼處理 prefers-reduced-motion？"
              a="本檔案有兩層防線：① Framer 端用 useReducedMotion() 自動跳過 spring 位移；② 全域 CSS 對 reduced-motion 媒體查詢把所有 animation/transition 設為 0s，確保子元件也安全降級。" />
            <FAQItem q="顏色飽和度為什麼都壓得這麼低？"
              a="AI 預設喜歡高飽和的紫藍漸層（俗稱 AI-purple slop）。我們把 brand-500 設為 #3b6bff（飽和 75%），accent 用 #7cf5cf 偏冷綠。在暗背景上對比足夠，又不刺眼。" />

        <Section id="playground" eyebrow="05 · 互動" title="也來按按看"

          <ToastDemo />
        </Section>

        <Footer />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
