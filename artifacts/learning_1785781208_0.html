<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="FlowForge DAG workflow editor with React Flow and an in-browser scheduler simulation." />
  <title>FlowForge / DAG Scheduler</title>
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
  <style>
    :root {
      --ink: #17221f;
      --muted: #71807b;
      --paper: #f4f6f0;
      --panel: #fbfcf8;
      --line: #dbe3dc;
      --line-strong: #c5d2c7;
      --forest: #1f6b4f;
      --forest-deep: #123d30;
      --mint: #d9eee2;
      --lime: #d4ed63;
      --amber: #e6a43a;
      --rose: #d96768;
      --blue: #4f86b6;
      --shadow: 0 18px 50px rgba(19, 52, 40, .09);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body {
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(31, 107, 79, .28);
      outline-offset: 2px;
    }

    .shell {
      display: grid;
      grid-template-rows: 72px 1fr;
      height: 100%;
      min-height: 560px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px 0 26px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 252, 248, .92);
      position: relative;
      z-index: 20;
    }
    .brand-lockup { display: flex; align-items: center; gap: 12px; min-width: 240px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      color: var(--paper);
      background: var(--forest-deep);
      border-radius: 9px;
      font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.08em;
      box-shadow: 4px 4px 0 var(--lime);
    }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: .02em; }
    .brand-context { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .topbar-center { display: flex; align-items: center; gap: 10px; }
    .flow-title {
      min-width: 210px;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      padding: 8px 2px;
    }
    .flow-title:hover { border-bottom-color: var(--forest); }
    .run-state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .run-state::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--line-strong);
    }
    .run-state.is-running { color: var(--forest); }
    .run-state.is-running::before { background: var(--lime); box-shadow: 0 0 0 4px rgba(212,237,99,.28); }
    .run-state.is-error { color: var(--rose); }
    .run-state.is-error::before { background: var(--rose); }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .btn:hover { border-color: var(--forest); transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn-primary { color: #f6fbf5; background: var(--forest); border-color: var(--forest); }
    .btn-primary:hover { background: var(--forest-deep); border-color: var(--forest-deep); }
    .btn-stop { color: #fff; background: var(--rose); border-color: var(--rose); }
    .btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .btn-quiet:hover { background: var(--mint); color: var(--forest-deep); }
    .btn-icon { width: 34px; padding: 0; font-size: 16px; }
    .workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 300px;
      min-height: 0;
    }
    .left-rail, .right-rail {
      min-width: 0;
      background: var(--panel);
      overflow: auto;
    }
    .left-rail { border-right: 1px solid var(--line); padding: 20px 16px; }
    .right-rail { border-left: 1px solid var(--line); padding: 20px 17px; }
    .rail-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 14px;
    }
    .rail-heading h2 { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .rail-heading span { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10px; }
    .rail-copy { color: var(--muted); font-size: 11px; line-height: 1.55; margin: 0 0 18px; }
    .palette { display: grid; gap: 8px; }
    .palette-item {
      display: grid;
      grid-template-columns: 31px 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .palette-item:hover { border-color: var(--forest); transform: translateX(2px); box-shadow: 4px 5px 0 rgba(31,107,79,.08); }
    .palette-glyph {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 8px;
      color: var(--forest-deep);
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      font-weight: 800;
    }
    .glyph-trigger { background: var(--lime); }
    .glyph-task { background: #cfe5f4; }
    .glyph-condition { background: #f2d2a4; }
    .glyph-delay { background: #ddd6f1; }
    .glyph-notify { background: #f4d0d0; }
    .glyph-end { background: #cfe5d5; }
    .palette-label { font-size: 12px; font-weight: 700; }
    .palette-sub { color: var(--muted); font-size: 10px; margin-top: 2px; }
    .rail-separator { height: 1px; background: var(--line); margin: 22px 0 18px; }
    .shortcut-list { display: grid; gap: 10px; }
    .shortcut { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 11px; }
    kbd {
      padding: 3px 6px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      white-space: nowrap;
    }
    .canvas-wrap { position: relative; min-width: 0; min-height: 0; background: #eaf0e9; }
    .canvas-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(31,107,79,.035) 1px, transparent 1px),
        linear-gradient(rgba(31,107,79,.035) 1px, transparent 1px);
      background-size: 36px 36px;
      z-index: 0;
    }
    .canvas-status {
      position: absolute;
      left: 18px;
      top: 16px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border: 1px solid rgba(197,210,199,.8);
      border-radius: 9px;
      background: rgba(251,252,248,.9);
      color: var(--muted);
      box-shadow: 0 8px 26px rgba(19,52,40,.06);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
    }
    .canvas-status strong { color: var(--ink); }
    .react-flow { position: relative; z-index: 1; }
    .react-flow__controls { border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
    .react-flow__controls-button { background: var(--panel); border-color: var(--line); color: var(--forest-deep); }
    .react-flow__minimap { border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
    .react-flow__attribution { display: none; }
    .react-flow__edge-path { stroke: #85a497; stroke-width: 2; }
    .react-flow__edge.selected .react-flow__edge-path { stroke: var(--forest); stroke-width: 3; }
    .react-flow__handle { width: 9px; height: 9px; background: var(--forest); border: 2px solid #eaf0e9; }
    .flow-node {
      min-width: 190px;
      border: 1px solid var(--line-strong);
      border-left: 4px solid var(--node-accent, var(--forest));
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 9px 25px rgba(18,61,48,.11);
      overflow: hidden;
    }
    .flow-node.selected { border-color: var(--forest); box-shadow: 0 0 0 3px rgba(31,107,79,.16), 0 12px 30px rgba(18,61,48,.16); }
    .flow-node.is-running { box-shadow: 0 0 0 3px rgba(212,237,99,.35), 0 12px 30px rgba(18,61,48,.16); }
    .flow-node.is-failed { border-color: var(--rose); }
    .node-head { display: flex; align-items: center; justify-content: space-between; gap: 7px; padding: 9px 11px 6px 10px; }
    .node-type { color: var(--node-accent, var(--forest)); font-family: "IBM Plex Mono", monospace; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .node-status { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
    .node-status.queued { background: var(--blue); }
    .node-status.running { background: var(--lime); box-shadow: 0 0 0 4px rgba(212,237,99,.25); }
    .node-status.success { background: var(--forest); }
    .node-status.failed { background: var(--rose); }
    .node-label { padding: 0 10px 4px; font-size: 13px; font-weight: 800; letter-spacing: -.01em; }
    .node-action { min-height: 29px; padding: 4px 10px 9px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .node-foot { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-top: 1px solid var(--line); background: #f1f5ef; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; }
    .node-foot strong { color: var(--ink); font-weight: 700; }
    .node-accent-trigger { --node-accent: #7b9d16; }
    .node-accent-task { --node-accent: #3974a1; }
    .node-accent-condition { --node-accent: #b67613; }
    .node-accent-delay { --node-accent: #806eb3; }
    .node-accent-notify { --node-accent: #bd5759; }
    .node-accent-end { --node-accent: #40825b; }
    .inspector-empty { color: var(--muted); font-size: 12px; line-height: 1.65; padding: 13px 0; }
    .selection-card { border: 1px solid var(--line); border-radius: 11px; background: #fff; padding: 12px; }
    .selection-card .node-preview { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .preview-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 8px; font-family: "IBM Plex Mono", monospace; font-weight: 800; }
    .preview-copy strong { display: block; font-size: 13px; }
    .preview-copy span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .field { display: grid; gap: 6px; margin-top: 12px; }
    .field:first-child { margin-top: 0; }
    .field label { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: 12px;
      padding: 8px 9px;
    }
    .field textarea { min-height: 62px; resize: vertical; line-height: 1.45; }
    .field input:hover, .field select:hover, .field textarea:hover { border-color: var(--line-strong); }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-actions { display: flex; gap: 7px; margin-top: 14px; }
    .form-actions .btn { flex: 1; }
    .danger { color: var(--rose); }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .metric { padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .metric-label { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; text-transform: uppercase; }
    .metric-value { margin-top: 4px; font-size: 19px; font-weight: 800; letter-spacing: -.04em; }
    .queue { display: grid; gap: 7px; margin-top: 11px; }
    .queue-row { display: grid; grid-template-columns: 7px 1fr auto; align-items: center; gap: 8px; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    .queue-row:last-child { border-bottom: 0; }
    .queue-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
    .queue-dot.queued { background: var(--blue); }
    .queue-dot.running { background: var(--lime); }
    .queue-dot.success { background: var(--forest); }
    .queue-dot.failed { background: var(--rose); }
    .queue-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 700; }
    .queue-meta { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; }
    .log-panel { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 5; max-width: 440px; pointer-events: none; }
    .log-panel-inner { border: 1px solid rgba(197,210,199,.9); border-radius: 10px; background: rgba(251,252,248,.9); box-shadow: var(--shadow); overflow: hidden; }
    .log-title { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .log-list { max-height: 112px; overflow: hidden; padding: 6px 10px 8px; }
    .log-line { display: flex; gap: 8px; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; line-height: 1.7; }
    .log-line strong { color: var(--forest); font-weight: 700; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 50;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 14px;
      border: 1px solid var(--forest);
      border-radius: 9px;
      background: var(--forest-deep);
      color: #f6fbf5;
      font-size: 12px;
      box-shadow: var(--shadow);
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .fatal {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 30px;
      background: var(--paper);
      color: var(--ink);
      text-align: center;
    }
    .fatal div { max-width: 520px; padding: 28px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .fatal h1 { margin: 0 0 10px; font-size: 20px; }
    .fatal p { color: var(--muted); font-size: 13px; line-height: 1.6; }
    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 190px minmax(0, 1fr) 260px; }
      .topbar-center { position: absolute; left: 50%; transform: translateX(-50%); }
      .flow-title { min-width: 150px; }
      .brand-context { display: none; }
    }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .shell { grid-template-rows: auto auto; min-height: 100dvh; }
      .topbar { min-height: 72px; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
      .brand-lockup { min-width: 0; }
      .topbar-center { position: static; order: 3; width: 100%; transform: none; }
      .flow-title { min-width: 0; flex: 1; }
      .toolbar { margin-left: auto; }
      .toolbar .btn:not(.btn-primary):not(.btn-stop) { display: none; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(540px, 68dvh) auto; }
      .left-rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 15px; overflow: visible; }
      .palette { grid-template-columns: repeat(3, 1fr); }
      .palette-item { grid-template-columns: 27px 1fr; padding: 7px; }
      .palette-glyph { width: 27px; height: 27px; }
      .palette-sub { display: none; }
      .rail-copy, .shortcut-list, .left-rail .rail-separator { display: none; }
      .right-rail { border-left: 0; border-top: 1px solid var(--line); padding: 15px; }
      .log-panel { left: 12px; right: 12px; bottom: 12px; }
      .canvas-status { left: 12px; top: 12px; }
    }
    @media (max-width: 480px) {
      .palette { grid-template-columns: repeat(2, 1fr); }
      .brand-name { font-size: 13px; }
      .toolbar { gap: 4px; }
      .btn-primary { padding: 0 9px; }
      .flow-node { min-width: 170px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"><div class="fatal"><div><h1>正在載入 FlowForge</h1><p>正在初始化 React Flow 工作流畫布。</p></div></div></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
  <script>
    (function () {
      'use strict';
      const rootEl = document.getElementById('root');
      const h = React.createElement;
      const RF = window.ReactFlow;

      if (!window.React || !window.ReactDOM || !RF) {
        rootEl.innerHTML = '<div class="fatal"><div><h1>React Flow 無法載入</h1><p>請用可連線的瀏覽器開啟本檔，或確認 unpkg CDN 未被網路政策阻擋。</p></div></div>';
        return;
      }

      const Flow = RF.default || RF.ReactFlow || RF;
      const Background = RF.Background;
      const Controls = RF.Controls;
      const MiniMap = RF.MiniMap;
      const Handle = RF.Handle;
      const Position = RF.Position;
      const MarkerType = RF.MarkerType;
      const applyNodeChanges = RF.applyNodeChanges;
      const applyEdgeChanges = RF.applyEdgeChanges;

      const STORAGE_KEY = 'flowforge-dag-workflow-v1';
      const TYPE_META = {
        trigger: { label: 'TRIGGER', glyph: '▶', accent: 'trigger', color: '#7b9d16', action: '接收事件並啟動流程' },
        task: { label: 'TASK', glyph: '∎', accent: 'task', color: '#3974a1', action: '執行一個自動化任務' },
        condition: { label: 'CONDITION', glyph: '?', accent: 'condition', color: '#b67613', action: '依規則判斷下一條路徑' },
        delay: { label: 'DELAY', glyph: '◷', accent: 'delay', color: '#806eb3', action: '等待指定時間後繼續' },
        notify: { label: 'NOTIFY', glyph: '!', accent: 'notify', color: '#bd5759', action: '發送通知或外部訊息' },
        end: { label: 'END', glyph: '■', accent: 'end', color: '#40825b', action: '完成流程並寫入結果' }
      };
      const PALETTE_ORDER = ['trigger', 'task', 'condition', 'delay', 'notify', 'end'];

      function uid(prefix) {
        return prefix + '_' + Math.random().toString(36).slice(2, 8) + '_' + Date.now().toString(36).slice(-4);
      }

      function initialGraph() {
        const nodes = [
          node('trigger_1', 'trigger', '收到申請事件', 60, 220, { action: 'Webhook: application.created', owner: '系統', priority: 'high', schedule: '即時' }),
          node('task_1', 'task', '整理申請資料', 320, 220, { action: 'Normalize payload + attach files', owner: '行政組', priority: 'high', duration: '2', schedule: '事件觸發' }),
          node('condition_1', 'condition', '資料是否完整？', 580, 220, { action: 'requiredFields >= 6', owner: '驗證器', priority: 'high', schedule: '依賴完成' }),
          node('notify_1', 'notify', '通知補件', 840, 82, { action: 'Email: applicant.missing_fields', owner: '行政組', priority: 'normal', duration: '1', schedule: '依賴完成' }),
          node('task_2', 'task', '建立審核案件', 840, 355, { action: 'Create case + assign reviewer', owner: '人事室', priority: 'high', duration: '3', schedule: '依賴完成' }),
          node('delay_1', 'delay', '等待主管審核', 1100, 355, { action: 'Pause until approval.received', owner: '工作流', priority: 'normal', duration: '15', schedule: '依賴完成' }),
          node('notify_2', 'notify', '發送結果通知', 1360, 355, { action: 'Email: application.completed', owner: '人事室', priority: 'normal', duration: '1', schedule: '依賴完成' }),
          node('end_1', 'end', '封存並結案', 1620, 355, { action: 'Archive audit trail', owner: '系統', priority: 'low', duration: '1', schedule: '依賴完成' })
        ];
        const edges = [
          edge('trigger_1', 'task_1'),
          edge('task_1', 'condition_1'),
          edge('condition_1', 'notify_1', '否'),
          edge('condition_1', 'task_2', '是'),
          edge('task_2', 'delay_1'),
          edge('delay_1', 'notify_2'),
          edge('notify_2', 'end_1')
        ];
        return { nodes: nodes, edges: edges };
      }

      function node(id, type, label, x, y, data) {
        return {
          id: id,
          type: 'workflowNode',
          position: { x: x, y: y },
          data: Object.assign({ type: type, label: label, status: 'idle', action: TYPE_META[type].action, owner: '未指定', priority: 'normal', duration: '1', schedule: '依賴完成' }, data || {})
        };
      }

      function edge(source, target, label) {
        const item = { id: 'e_' + source + '_' + target, source: source, target: target, type: 'smoothstep', label: label || '', animated: false, style: { stroke: '#85a497', strokeWidth: 2 } };
        if (MarkerType && MarkerType.ArrowClosed) item.markerEnd = { type: MarkerType.ArrowClosed, color: '#85a497' };
        return item;
      }

      function WorkflowNode(props) {
        const d = props.data || {};
        const meta = TYPE_META[d.type] || TYPE_META.task;
        const status = d.status || 'idle';
        return h('div', { className: 'flow-node node-accent-' + meta.accent + ' ' + (props.selected ? 'selected ' : '') + (status === 'running' ? 'is-running ' : '') + (status === 'failed' ? 'is-failed' : '') },
          h(Handle, { type: 'target', position: Position.Left, id: 'input' }),
          h('div', { className: 'node-head' },
            h('span', { className: 'node-type' }, meta.label),
            h('span', { className: 'node-status ' + status, title: status })
          ),
          h('div', { className: 'node-label' }, d.label),
          h('div', { className: 'node-action' }, d.action || meta.action),
          h('div', { className: 'node-foot' },
            h('span', null, d.owner || '未指定'),
            h('strong', null, d.priority === 'high' ? 'P1' : d.priority === 'low' ? 'P3' : 'P2')
          ),
          h(Handle, { type: 'source', position: Position.Right, id: 'output' })
        );
      }

      const nodeTypes = { workflowNode: WorkflowNode };

      function getIncoming(id, edges) { return edges.filter(function (e) { return e.target === id; }).map(function (e) { return e.source; }); }
      function getOutgoing(id, edges) { return edges.filter(function (e) { return e.source === id; }).map(function (e) { return e.target; }); }

      function topologicalSort(nodes, edges) {
        const indegree = {};
        const adjacency = {};
        nodes.forEach(function (n) { indegree[n.id] = 0; adjacency[n.id] = []; });
        edges.forEach(function (e) {
          if (!indegree.hasOwnProperty(e.source) || !indegree.hasOwnProperty(e.target)) return;
          indegree[e.target] += 1;
          adjacency[e.source].push(e.target);
        });
        const queue = nodes.filter(function (n) { return indegree[n.id] === 0; }).map(function (n) { return n.id; });
        const order = [];
        while (queue.length) {
          const current = queue.shift();
          order.push(current);
          adjacency[current].forEach(function (next) {
            indegree[next] -= 1;
            if (indegree[next] === 0) queue.push(next);
          });
        }
        return { order: order, hasCycle: order.length !== nodes.length };
      }

      function validateGraph(nodes, edges) {
        const result = topologicalSort(nodes, edges);
        const triggers = nodes.filter(function (n) { return n.data.type === 'trigger'; });
        const ends = nodes.filter(function (n) { return n.data.type === 'end'; });
        const warnings = [];
        if (!triggers.length) warnings.push('尚未設定 Trigger 節點');
        if (!ends.length) warnings.push('尚未設定 End 節點');
        nodes.forEach(function (n) {
          if (n.data.type !== 'trigger' && getIncoming(n.id, edges).length === 0) warnings.push('節點「' + n.data.label + '」沒有上游依賴');
        });
        return { valid: !result.hasCycle && warnings.length === 0, hasCycle: result.hasCycle, warnings: warnings, order: result.order };
      }

      function safeLoad() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return null;
          const parsed = JSON.parse(saved);
          if (!parsed || !Array.isArray(parsed.nodes) || !Array.isArray(parsed.edges)) return null;
          return parsed;
        } catch (e) { return null; }
      }

      function App() {
        const saved = safeLoad();
        const boot = saved || initialGraph();
        const [nodes, setNodes] = React.useState(boot.nodes);
        const [edges, setEdges] = React.useState(boot.edges);
        const [selectedId, setSelectedId] = React.useState(null);
        const [running, setRunning] = React.useState(false);
        const [runResult, setRunResult] = React.useState('idle');
        const [logs, setLogs] = React.useState([{ time: '就緒', text: saved ? '已還原本機工作流' : '範例工作流已載入' }]);
        const [toast, setToast] = React.useState('');
        const [flowInstance, setFlowInstance] = React.useState(null);
        const runRef = React.useRef(null);
        const fileInputRef = React.useRef(null);
        const titleRef = React.useRef(null);
        const selected = nodes.find(function (n) { return n.id === selectedId; }) || null;
        const validation = React.useMemo(function () { return validateGraph(nodes, edges); }, [nodes, edges]);
        const metrics = React.useMemo(function () {
          const statuses = nodes.reduce(function (acc, n) { acc[n.data.status || 'idle'] = (acc[n.data.status || 'idle'] || 0) + 1; return acc; }, {});
          return { total: nodes.length, edges: edges.length, done: statuses.success || 0, queued: (statuses.idle || 0) + (statuses.queued || 0), running: statuses.running || 0 };
        }, [nodes, edges]);
        const queueNodes = React.useMemo(function () {
          const rank = { high: 0, normal: 1, low: 2 };
          return nodes.slice().sort(function (a, b) { return (rank[a.data.priority] || 1) - (rank[b.data.priority] || 1); });
        }, [nodes]);

        React.useEffect(function () {
          return function () { if (runRef.current) window.clearTimeout(runRef.current); };
        }, []);

        function notify(message) {
          setToast(message);
          window.clearTimeout(notify.timer);
          notify.timer = window.setTimeout(function () { setToast(''); }, 2200);
        }

        function addLog(text) {
          const stamp = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLogs(function (current) { return current.concat([{ time: stamp, text: text }]).slice(-6); });
        }

        function onNodesChange(changes) { setNodes(function (current) { return applyNodeChanges(changes, current); }); }
        function onEdgesChange(changes) { setEdges(function (current) { return applyEdgeChanges(changes, current); }); }
        function onConnect(connection) {
          if (!connection.source || !connection.target || connection.source === connection.target) { notify('不能建立自我連線'); return; }
          const duplicate = edges.some(function (e) { return e.source === connection.source && e.target === connection.target; });
          if (duplicate) { notify('這條依賴已存在'); return; }
          const candidate = edge(connection.source, connection.target);
          const check = topologicalSort(nodes, edges.concat([candidate]));
          if (check.hasCycle) { notify('已阻止循環依賴，DAG 必須保持無環'); return; }
          setEdges(function (current) { return current.concat([candidate]); });
          addLog('新增依賴連線');
        }
        function onNodeClick(event, n) { setSelectedId(n.id); }
        function onPaneClick() { setSelectedId(null); }

        function updateSelected(patch) {
          if (!selected) return;
          setNodes(function (current) { return current.map(function (n) { return n.id === selected.id ? Object.assign({}, n, { data: Object.assign({}, n.data, patch) }) : n; }); });
        }
        function addNode(type) {
          const index = nodes.length;
          const x = flowInstance && flowInstance.getViewport ? (280 - flowInstance.getViewport().x) / flowInstance.getViewport().zoom : 300 + (index % 3) * 240;
          const y = flowInstance && flowInstance.getViewport ? (240 - flowInstance.getViewport().y) / flowInstance.getViewport().zoom : 180 + Math.floor(index / 3) * 150;
          const meta = TYPE_META[type];
          const fresh = node(uid(type), type, type === 'task' ? '新的自動化任務' : '新的' + meta.label + '節點', x, y, {});
          setNodes(function (current) { return current.concat([fresh]); });
          setSelectedId(fresh.id);
          addLog('新增 ' + meta.label + ' 節點');
        }
        function resetStatuses() {
          setNodes(function (current) { return current.map(function (n) { return Object.assign({}, n, { data: Object.assign({}, n.data, { status: 'idle' }) }); }); });
          setRunResult('idle');
        }
        function saveFlow() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ nodes: nodes, edges: edges }));
          addLog('工作流已保存至 localStorage');
          notify('已保存到本機瀏覽器');
        }
        function exportFlow() {
          const payload = JSON.stringify({ version: 1, name: 'FlowForge workflow', exportedAt: new Date().toISOString(), nodes: nodes, edges: edges }, null, 2);
          const blob = new Blob([payload], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = 'flowforge-workflow.json'; a.click();
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 500);
          notify('已匯出 JSON');
        }
        function importFlow(event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function () {
            try {
              const parsed = JSON.parse(reader.result);
              if (!Array.isArray(parsed.nodes) || !Array.isArray(parsed.edges)) throw new Error('schema');
              setNodes(parsed.nodes.map(function (n) { return Object.assign({}, n, { type: 'workflowNode', data: Object.assign({}, n.data, { status: 'idle' }) }); }));
              setEdges(parsed.edges);
              setSelectedId(null); setRunResult('idle'); addLog('已匯入 ' + file.name); notify('JSON 工作流已匯入');
            } catch (e) { notify('匯入失敗，請確認 JSON 格式'); }
            event.target.value = '';
          };
          reader.readAsText(file);
        }
        function resetFlow() {
          const fresh = initialGraph(); setNodes(fresh.nodes); setEdges(fresh.edges); setSelectedId(null); setRunResult('idle'); setLogs([{ time: '就緒', text: '已重設為範例工作流' }]); notify('已重設範例');
        }
        function stopRun() {
          if (runRef.current) window.clearTimeout(runRef.current);
          runRef.current = null; setRunning(false); setRunResult('idle');
          setNodes(function (current) { return current.map(function (n) { return n.data.status === 'running' ? Object.assign({}, n, { data: Object.assign({}, n.data, { status: 'idle' }) }) : n; }); });
          addLog('執行已由使用者停止');
        }
        function runFlow() {
          if (running) return;
          const check = validateGraph(nodes, edges);
          if (check.hasCycle) { setRunResult('error'); notify('無法執行：偵測到循環依賴'); addLog('驗證失敗：DAG 含循環'); return; }
          if (check.warnings.length) { setRunResult('error'); notify('請先修正工作流驗證警告'); addLog('驗證失敗：' + check.warnings[0]); return; }
          const order = check.order;
          const byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
          setRunning(true); setRunResult('running');
          setNodes(function (current) { return current.map(function (n) { return Object.assign({}, n, { data: Object.assign({}, n.data, { status: 'queued' }) }); }); });
          addLog('排程器已建立 ' + order.length + ' 個執行單元');
          let cursor = 0;
          function tick() {
            if (cursor >= order.length) {
              setRunning(false); setRunResult('success'); runRef.current = null; addLog('所有節點執行完成，流程成功'); return;
            }
            const id = order[cursor]; const currentNode = byId[id];
            setNodes(function (current) { return current.map(function (n) { return n.id === id ? Object.assign({}, n, { data: Object.assign({}, n.data, { status: 'running' }) }) : n; }); });
            addLog('執行：' + currentNode.data.label);
            const wait = Math.max(500, Math.min(1100, Number(currentNode.data.duration || 1) * 160));
            runRef.current = window.setTimeout(function () {
              setNodes(function (current) { return current.map(function (n) { return n.id === id ? Object.assign({}, n, { data: Object.assign({}, n.data, { status: 'success' }) }) : n; }); });
              addLog('完成：' + currentNode.data.label);
              cursor += 1; tick();
            }, wait);
          }
          tick();
        }

        const runButton = running ? h('button', { className: 'btn btn-stop', onClick: stopRun, title: '停止目前的模擬執行' }, '停止') : h('button', { className: 'btn btn-primary', onClick: runFlow, title: '驗證 DAG 並啟動自動排程模擬' }, '執行工作流');
        const stateLabel = running ? '執行中' : runResult === 'success' ? '上次執行成功' : runResult === 'error' ? '需要修正' : '編輯中';
        const stateClass = running ? 'is-running' : runResult === 'error' ? 'is-error' : '';

        return h('div', { className: 'shell' },
          h('header', { className: 'topbar' },
            h('div', { className: 'brand-lockup' },
              h('div', { className: 'brand-mark', 'aria-hidden': 'true' }, 'ƒ'),
              h('div', null, h('div', { className: 'brand-name' }, 'FLOWFORGE'), h('div', { className: 'brand-context' }, 'DAG workflow orchestration'))
            ),
            h('div', { className: 'topbar-center' },
              h('input', { ref: titleRef, className: 'flow-title', defaultValue: '申請案件自動化流程', 'aria-label': '工作流名稱' }),
              h('span', { className: 'run-state ' + stateClass }, stateLabel)
            ),
            h('div', { className: 'toolbar' },
              h('button', { className: 'btn btn-quiet btn-icon', onClick: function () { flowInstance && flowInstance.fitView({ padding: .2, duration: 300 }); }, title: '適合畫布' }, '⌗'),
              h('button', { className: 'btn btn-quiet', onClick: function () { fileInputRef.current && fileInputRef.current.click(); } }, '匯入'),
              h('button', { className: 'btn btn-quiet', onClick: exportFlow }, '匯出'),
              h('button', { className: 'btn', onClick: saveFlow }, '保存'),
              runButton,
              h('input', { ref: fileInputRef, type: 'file', accept: 'application/json,.json', onChange: importFlow, hidden: true })
            )
          ),
          h('main', { className: 'workspace' },
            h('aside', { className: 'left-rail' },
              h('div', { className: 'rail-heading' }, h('h2', null, '節點工具箱'), h('span', null, PALETTE_ORDER.length + ' types')),
              h('p', { className: 'rail-copy' }, '建立節點後，在畫布上拖曳連線。系統會在連線建立前檢查循環依賴。'),
              h('div', { className: 'palette' }, PALETTE_ORDER.map(function (type) {
                const meta = TYPE_META[type];
                return h('button', { key: type, className: 'palette-item', onClick: function () { addNode(type); }, title: '新增 ' + meta.label + ' 節點' },
                  h('span', { className: 'palette-glyph glyph-' + type }, meta.glyph),
                  h('span', null, h('span', { className: 'palette-label' }, type === 'task' ? '自動任務' : type === 'trigger' ? '觸發器' : type === 'condition' ? '條件判斷' : type === 'delay' ? '延遲等待' : type === 'notify' ? '通知' : '結束'), h('span', { className: 'palette-sub' }, meta.label))
                );
              })),
              h('div', { className: 'rail-separator' }),
              h('div', { className: 'rail-heading' }, h('h2', null, '快捷操作'), h('span', null, 'tips')),
              h('div', { className: 'shortcut-list' },
                h('div', { className: 'shortcut' }, h('span', null, '刪除選取節點'), h('kbd', null, 'Backspace')),
                h('div', { className: 'shortcut' }, h('span', null, '拖動畫布'), h('kbd', null, 'Space + 拖曳')),
                h('div', { className: 'shortcut' }, h('span', null, '縮放畫布'), h('kbd', null, '滾輪')),
                h('div', { className: 'shortcut' }, h('span', null, '重設範例'), h('button', { className: 'btn btn-quiet', style: { minHeight: 'auto', padding: 0, fontSize: '10px' }, onClick: resetFlow }, '重設'))
              )
            ),
            h('section', { className: 'canvas-wrap', 'aria-label': 'DAG 工作流畫布' },
              h('div', { className: 'canvas-status' }, h('strong', null, metrics.total + ' nodes'), h('span', null, metrics.edges + ' dependencies'), h('span', null, validation.valid ? 'DAG valid' : 'needs review')),
              h(Flow, {
                nodes: nodes,
                edges: edges,
                nodeTypes: nodeTypes,
                onNodesChange: onNodesChange,
                onEdgesChange: onEdgesChange,
                onConnect: onConnect,
                onNodeClick: onNodeClick,
                onPaneClick: onPaneClick,
                onInit: setFlowInstance,
                fitView: true,
                fitViewOptions: { padding: .16, minZoom: .25, maxZoom: .9 },
                minZoom: .25,
                maxZoom: 1.5,
                snapToGrid: true,
                snapGrid: [16, 16],
                deleteKeyCode: ['Backspace', 'Delete'],
                connectionLineStyle: { stroke: '#1f6b4f', strokeWidth: 2 },
                defaultEdgeOptions: { type: 'smoothstep' }
              },
                h(Background, { color: '#b6c8ba', gap: 36, size: 1 }),
                h(Controls, { showInteractive: false }),
                h(MiniMap, { nodeColor: function (n) { return (TYPE_META[n.data && n.data.type] || TYPE_META.task).color; }, maskColor: 'rgba(234,240,233,.72)' })
              ),
              h('div', { className: 'log-panel' }, h('div', { className: 'log-panel-inner' },
                h('div', { className: 'log-title' }, h('span', null, 'Execution log'), h('span', null, running ? 'live' : 'idle')),
                h('div', { className: 'log-list' }, logs.slice(-5).map(function (log, i) { return h('div', { className: 'log-line', key: i }, h('span', null, log.time), h('strong', null, log.text)); }))
              ))
            ),
            h('aside', { className: 'right-rail' },
              h('div', { className: 'rail-heading' }, h('h2', null, '節點檢視器'), h('span', null, selected ? 'selected' : 'none')),
              selected ? h(Inspector, { selected: selected, updateSelected: updateSelected, remove: function () { setNodes(function (current) { return current.filter(function (n) { return n.id !== selected.id; }); }); setEdges(function (current) { return current.filter(function (e) { return e.source !== selected.id && e.target !== selected.id; }); }); setSelectedId(null); addLog('刪除節點：' + selected.data.label); } }) : h('div', { className: 'inspector-empty' }, '點選畫布上的節點以編輯任務設定。每個節點都可以指定負責人、優先級、執行動作與模擬耗時。'),
              h('div', { className: 'metric-grid' },
                h('div', { className: 'metric' }, h('div', { className: 'metric-label' }, '節點數'), h('div', { className: 'metric-value' }, metrics.total)),
                h('div', { className: 'metric' }, h('div', { className: 'metric-label' }, '依賴數'), h('div', { className: 'metric-value' }, metrics.edges)),
                h('div', { className: 'metric' }, h('div', { className: 'metric-label' }, '已完成'), h('div', { className: 'metric-value' }, metrics.done)),
                h('div', { className: 'metric' }, h('div', { className: 'metric-label' }, '待排程'), h('div', { className: 'metric-value' }, metrics.queued))
              ),
              h('div', { className: 'rail-separator' }),
              h('div', { className: 'rail-heading' }, h('h2', null, '排程佇列'), h('span', null, 'priority')),
              h('div', { className: 'queue' }, queueNodes.slice(0, 7).map(function (n) { return h('div', { className: 'queue-row', key: n.id, onClick: function () { setSelectedId(n.id); } }, h('span', { className: 'queue-dot ' + (n.data.status || 'idle') }), h('span', { className: 'queue-name' }, n.data.label), h('span', { className: 'queue-meta' }, n.data.priority === 'high' ? 'P1' : n.data.priority === 'low' ? 'P3' : 'P2')); }))
            )
          ),
          h('div', { className: 'toast ' + (toast ? 'visible' : '') }, toast)
        );
      }

      function Inspector(props) {
        const selected = props.selected;
        const d = selected.data;
        const meta = TYPE_META[d.type] || TYPE_META.task;
        return h('div', { className: 'selection-card' },
          h('div', { className: 'node-preview' }, h('div', { className: 'preview-icon glyph-' + d.type }, meta.glyph), h('div', { className: 'preview-copy' }, h('strong', null, d.label), h('span', null, meta.label + ' / ' + selected.id))),
          h('div', { className: 'field' }, h('label', null, '節點名稱'), h('input', { value: d.label || '', onChange: function (e) { props.updateSelected({ label: e.target.value }); } })),
          h('div', { className: 'field' }, h('label', null, '自動化動作'), h('textarea', { value: d.action || '', onChange: function (e) { props.updateSelected({ action: e.target.value }); } })),
          h('div', { className: 'field' }, h('label', null, '負責人'), h('input', { value: d.owner || '', onChange: function (e) { props.updateSelected({ owner: e.target.value }); } })),
          h('div', { className: 'field-grid' },
            h('div', { className: 'field' }, h('label', null, '優先級'), h('select', { value: d.priority || 'normal', onChange: function (e) { props.updateSelected({ priority: e.target.value }); } }, h('option', { value: 'high' }, 'P1 / 高'), h('option', { value: 'normal' }, 'P2 / 標準'), h('option', { value: 'low' }, 'P3 / 低'))),
            h('div', { className: 'field' }, h('label', null, '模擬秒數'), h('input', { type: 'number', min: 1, max: 10, value: d.duration || 1, onChange: function (e) { props.updateSelected({ duration: e.target.value }); } }))
          ),
          h('div', { className: 'field' }, h('label', null, '排程策略'), h('select', { value: d.schedule || '依賴完成', onChange: function (e) { props.updateSelected({ schedule: e.target.value }); } }, h('option', null, '即時'), h('option', null, '事件觸發'), h('option', null, '依賴完成'), h('option', null, '每日 09:00'), h('option', null, '工作日 08:30'))),
          h('div', { className: 'form-actions' }, h('button', { className: 'btn btn-quiet danger', onClick: props.remove }, '刪除節點'))
        );
      }

      ReactDOM.createRoot(rootEl).render(h(App));
    })();
  </script>
</body>
</html>
