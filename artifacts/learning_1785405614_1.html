<script type="text/babel" data-type="module">
const { useState, useEffect, useRef } = React;
const {
  motion,
  AnimatePresence,
  useScroll,
  useTransform,
  useInView,
  useMotionValue,
  useSpring,
  useAnimate,
} = window["framer-motion"] || window["Motion"] || window.FramerMotion;

// -------- 共用：浮動的色塊 (background blob) --------
function FloatingBlob({ color, size, top, left, delay = 0 }) {
  return (
    <motion.div
      className="absolute rounded-full blur-3xl opacity-30 pointer-events-none"
      style={{
        width: size, height: size, top, left, background: color,
      }}
      animate={{
        y: [0, -30, 0],
        x: [0, 20, 0],
        scale: [1, 1.1, 1],
      }}
      transition={{ duration: 12 + delay, repeat: Infinity, ease: 'easeInOut', delay }}
    />
  );
}

// -------- 導覽列 --------
function Nav() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const links = ['Hero', 'Features', 'Stats', 'Showcase', 'Tabs', 'Contact'];

  return (
    <motion.nav
      initial={{ y: -80, opacity: 0 }}
      animate={{ y: 0, opacity: 1 }}
      transition={{ duration: 0.7, ease: 'easeOut' }}
      className={`fixed top-0 inset-x-0 z-50 transition-all duration-300 ${

      }`}

        >
          <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-neon-violet to-neon-cyan animate-pulse-glow" />
          <span>Motion<span className="text-neon-cyan">Lab</span></span>
        </motion.div>

        <ul className="hidden md:flex items-center gap-8 text-sm font-medium text-gray-300">
          {links.map((l, i) => (
            <motion.li

              transition={{ delay: 0.2 + i * 0.08 }}

                <span className="absolute -bottom-1 left-0 w-0 h-0.5 bg-neon-cyan group-hover:w-full transition-all duration-300" />
              </a>
            </motion.li>
          ))}

        <motion.button

// -------- Hero：滾動視差 + 打字機 --------
function Hero() {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
  const y     = useTransform(scrollYProgress, [0, 1], [0, 200]);
  const opacity = useTransform(scrollYProgress, [0, 0.8], [1, 0]);
  const scale = useTransform(scrollYProgress, [0, 1], [1, 0.9]);

  // 打字機效果
  const words = ['動畫。', '互動。', '體驗。', '未來。'];
  const [text, setText] = useState('');
  const [wIdx, setWIdx] = useState(0);
  const [del, setDel] = useState(false);

  useEffect(() => {
    const word = words[wIdx];
    const speed = del ? 50 : 110;
    const t = setTimeout(() => {
      if (!del && text === word) {
        setTimeout(() => setDel(true), 1200);
      } else if (del && text === '') {
        setDel(false);
        setWIdx((wIdx + 1) % words.length);
      } else {
        setText(del ? word.slice(0, text.length - 1) : word.slice(0, text.length + 1));
      }
    }, speed);
    return () => clearTimeout(t);
  }, [text, del, wIdx]);

  return (
    <section id="hero" ref={ref} className="relative min-h-screen flex items-center justify-center overflow-hidden">
      {/* 浮動 blob */}
      <FloatingBlob color="#A78BFA" size={420} top="-100px" left="-100px" />
      <FloatingBlob color="#22D3EE" size={360} top="20%"     left="60%" delay={2} />
      <FloatingBlob color="#F472B6" size={300} top="60%"     left="10%" delay={4} />

      <motion.div
        style={{ y, opacity, scale }}
        className="relative z-10 max-w-5xl mx-auto px-6 text-center"
      >
        <motion.div
          initial={{ opacity: 0, y: 30 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.8 }}
          className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-md mb-8"
        >
          <span className="w-2 h-2 rounded-full bg-neon-lime animate-pulse" />
          <span className="text-xs font-mono text-gray-300">v2.0 · Tailwind × Framer Motion</span>
        </motion.div>

        <motion.h1
          initial={{ opacity: 0, y: 40 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.9, delay: 0.15 }}
          className="font-display text-5xl md:text-7xl lg:text-8xl font-bold leading-[1.05] tracking-tight"
        >
          打造流暢的<br/>
          <span className="text-gradient">使用者介面</span>
        </motion.h1>

        <motion.div
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}
          transition={{ delay: 0.6 }}
          className="mt-8 font-display text-3xl md:text-5xl text-gray-300 h-14"
        >
          用 <span className="text-neon-cyan">React</span> ＋ <span className="text-neon-violet">Motion</span> 寫出
          <span className="text-neon-amber caret font-mono ml-2">{text}</span>
        </motion.div>

        <motion.p
          initial={{ opacity: 0, y: 20 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ delay: 0.9 }}
          className="mt-8 text-lg text-gray-400 max-w-2xl mx-auto"
        >
          一個完整的 motion design 實驗室：滾動視差、staggered reveal、3D tilt、layout 過場、scroll-linked 動畫 — 全部使用 Tailwind CSS utility + Framer Motion declarative API。
        </motion.p>

        <motion.div
          initial={{ opacity: 0, y: 20 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ delay: 1.1 }}
          className="mt-10 flex flex-wrap items-center justify-center gap-4"
        >
          <motion.button
            whileHover={{ scale: 1.06, boxShadow: '0 0 40px rgba(167,139,250,0.6)' }}
            whileTap={{ scale: 0.95 }}
            className="px-7 py-3 rounded-full bg-gradient-to-r from-neon-violet to-neon-cyan text-ink-950 font-semibold shadow-xl"
          >
            開始探索 →
          </motion.button>
          <motion.button
            whileHover={{ scale: 1.06, backgroundColor: 'rgba(255,255,255,0.08)' }}
            whileTap={{ scale: 0.95 }}
            className="px-7 py-3 rounded-full border border-white/20 text-white font-semibold"
          >
            觀看 Demo
          </motion.button>
        </motion.div>

        {/* 滾動指示器 */}
        <motion.div
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}
          transition={{ delay: 1.5 }}
          className="mt-20 flex flex-col items-center gap-2 text-gray-500 text-xs font-mono"
        >
          <span>SCROLL</span>
          <motion.div
            animate={{ y: [0, 8, 0] }}
            transition={{ duration: 1.6, repeat: Infinity }}
            className="w-5 h-8 rounded-full border border-gray-600 flex items-start justify-center pt-1.5"
          >
            <div className="w-1 h-1.5 rounded-full bg-gray-400" />
          </motion.div>
        </motion.div>
      </motion.div>
    </section>
  );
}

// -------- Features：staggered reveal + hover tilt --------
function FeatureCard({ icon, title, desc, color, delay = 0 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-80px' });
  const mx = useMotionValue(0);
  const my = useMotionValue(0);
  const rotateX = useTransform(my, [-0.5, 0.5], [10, -10]);
  const rotateY = useTransform(mx, [-0.5, 0.5], [-10, 10]);
  const springR = { type: 'spring', stiffness: 220, damping: 18 };

  return (
    <motion.div
      ref={ref}
      initial={{ opacity: 0, y: 60 }}
      animate={inView ? { opacity: 1, y: 0 } : {}}
      transition={{ duration: 0.7, delay, ease: 'easeOut' }}
      style={{ rotateX, rotateY, transformPerspective: 1000 }}
      onMouseMove={(e) => {
        const r = e.currentTarget.getBoundingClientRect();
        mx.set(((e.clientX - r.left) / r.width)  - 0.5);
        my.set(((e.clientY - r.top)  / r.height) - 0.5);
      }}
      onMouseLeave={() => { mx.set(0); my.set(0); }}
      whileHover={{ y: -8 }}
      className="relative group p-8 rounded-2xl bg-gradient-to-br from-white/[0.04] to-white/[0.01] border border-white/10 backdrop-blur-sm cursor-pointer overflow-hidden"
    >
      {/* hover 光暈 */}
      <div
        className="absolute -inset-px rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"
        style={{ background: `radial-gradient(circle at center, ${color}33, transparent 70%)` }}
      />
      <motion.div
        animate={{ rotate: [0, 8, -8, 0] }}
        transition={{ duration: 6, repeat: Infinity, delay: delay * 2 }}
        className="relative w-14 h-14 rounded-xl flex items-center justify-center text-3xl mb-5"
        style={{ background: `linear-gradient(135deg, ${color}22, ${color}05)`, border: `1px solid ${color}44` }}
      >
        {icon}
      </motion.div>
      <h3 className="relative font-display font-bold text-xl text-white mb-3">{title}</h3>
      <p className="relative text-sm text-gray-400 leading-relaxed">{desc}</p>

      {/* hover 浮現箭頭 */}
      <motion.div
        initial={{ x: -10, opacity: 0 }}
        whileHover={{ x: 0, opacity: 1 }}
        className="relative mt-6 flex items-center gap-2 text-xs font-mono"
        style={{ color }}
      >
        <span>EXPLORE</span>
        <motion.span animate={{ x: [0, 4, 0] }} transition={{ duration: 1.4, repeat: Infinity }}>→</motion.span>
      </motion.div>
    </motion.div>
  );
}

// -------- Stats：scroll-triggered count up --------
function Counter({ to, duration = 2 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true });
  const mv = useMotionValue(0);
  const spring = useSpring(mv, { duration: duration * 1000, bounce: 0 });
  const [display, setDisplay] = useState(0);

  useEffect(() => {
    if (inView) mv.set(to);
    const unsub = spring.on('change', (v) => setDisplay(Math.round(v)));
    return () => unsub();
  }, [inView, to]);

  return <span ref={ref}>{display.toLocaleString()}</span>;
}

              </div>
              <div className="relative mt-3 text-sm text-gray-400 font-mono">{s.label}</div>
            </motion.div>
          ))}
        </div>

  );

              className={`flex-shrink-0 w-72 h-44 rounded-2xl bg-gradient-to-br ${it.color} border border-white/10 backdrop-blur-sm p-6 flex flex-col justify-between cursor-pointer`}
            >
              <div className="text-xs font-mono text-white/60">#{String(i+1).padStart(2,'0')}</div>
              <div>
                <div className="font-display text-2xl font-bold text-white">{it.title}</div>
                <div className="mt-1 text-xs font-mono text-white/70">{it.tag}</div>
              </div>
            </motion.div>
          ))}
        </motion.div>
      </div>
    </section>
  );
}

// -------- Tabs：AnimatePresence layout --------
function Tabs() {
  const tabs = [
    { id: 'design', label: 'Design',  icon: '🎨',
      title: '以設計為先的 motion',
      desc: '動畫不是附加品，而是設計語言的一環。我們用 easing、duration、stagger 來表達層級與因果關係。',
      bullets: ['12 種精選 easing curve', 'Design tokens 直接映射', '自動 reduced-motion 支援'] },
    { id: 'perf',  label: 'Performance', icon: '⚡',
      title: '60fps 為基本門檻',
      desc: '只用 transform / opacity 做動畫，避免 layout thrashing。Motion Lab 內建 FPS monitor 自動降級。',
      bullets: ['GPU composited layers', 'will-change 自動管理', 'FPS drop 自動暫停非關鍵動畫'] },
    { id: 'a11y',  label: 'Accessibility', icon: '♿',
      title: '為每個人設計',
      desc: 'prefers-reduced-motion、focus-visible、screen reader announcements — 全部內建在元件裡。',
      bullets: ['respect prefers-reduced-motion', 'keyboard navigation 完整支援', 'ARIA live regions 自動處理'] },
  ];
  const [active, setActive] = useState(tabs[0].id);
  const activeTab = tabs.find(t => t.id === active);

  return (
    <section id="tabs" className="relative py-32 px-6">
      <div className="max-w-5xl mx-auto">
        <motion.div
          initial={{ opacity: 0, y: 30 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true }}
          className="text-center mb-12"
        >
          <h2 className="font-display text-4xl md:text-5xl font-bold text-white">
            三大 <span className="text-gradient">核心原則</span>
          </h2>
        </motion.div>

        <div className="flex justify-center gap-2 mb-10 flex-wrap">
          {tabs.map((t) => (
            <motion.button
              key={t.id}
              onClick={() => setActive(t.id)}
              whileHover={{ scale: 1.05 }}
              whileTap={{ scale: 0.95 }}
              className={`relative px-5 py-2.5 rounded-full font-medium text-sm flex items-center gap-2 transition-colors ${
                active === t.id
                  ? 'text-ink-950'
                  : 'text-gray-400 hover:text-white border border-white/10'
              }`}
            >
              {active === t.id && (
                <motion.div
                  layoutId="activeTabPill"
                  className="absolute inset-0 rounded-full bg-gradient-to-r from-neon-violet to-neon-cyan"
                  transition={{ type: 'spring', stiffness: 350, damping: 30 }}
                />
              )}
              <span className="relative z-10">{t.icon}</span>
              <span className="relative z-10">{t.label}</span>
            </motion.button>
          ))}
        </div>

        <AnimatePresence mode="wait">
          <motion.div
            key={active}
            initial={{ opacity: 0, y: 30, filter: 'blur(10px)' }}
            animate={{ opacity: 1, y: 0,  filter: 'blur(0px)' }}
            exit={{ opacity: 0, y: -30, filter: 'blur(10px)' }}
            transition={{ duration: 0.45 }}
            className="p-10 rounded-3xl bg-gradient-to-br from-white/[0.06] to-white/[0.01] border border-white/10 backdrop-blur-md"
          >
            <h3 className="font-display text-3xl font-bold text-white mb-4">{activeTab.title}</h3>
            <p className="text-gray-400 text-lg leading-relaxed mb-8">{activeTab.desc}</p>
            <ul className="space-y-3">
              {activeTab.bullets.map((b, i) => (
                <motion.li
                  key={i}
                  initial={{ opacity: 0, x: -20 }}
                  animate={{ opacity: 1, x: 0 }}
                  transition={{ delay: 0.1 + i * 0.1 }}
                  className="flex items-center gap-3 text-gray-300"
                >
                  <span className="w-6 h-6 rounded-full bg-neon-violet/20 border border-neon-violet/40 flex items-center justify-center text-neon-violet text-xs">✓</span>
                  {b}
                </motion.li>
              ))}
            </ul>
          </motion.div>
        </AnimatePresence>
      </div>
    </section>
  );
}

// -------- CTA / Contact --------
function Contact() {
  const [email, setEmail] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [scope, animate] = useAnimate();

  const onSubmit = async (e) => {
    e.preventDefault();
    if (!email.includes('@')) {
      animate(scope.current, { x: [0, -10, 10, -10, 10, 0] }, { duration: 0.5 });
      return;
    }
    setSubmitted(true);
    setTimeout(() => { setSubmitted(false); setEmail(''); }, 3000);
  };

  return (
    <section id="contact" className="relative py-32 px-6 overflow-hidden">
      <FloatingBlob color="#22D3EE" size={500} top="20%" left="30%" />
      <div className="relative max-w-3xl mx-auto text-center">
        <motion.h2
          initial={{ opacity: 0, y: 30 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true }}
          className="font-display text-5xl md:text-6xl font-bold text-white"
        >
          準備好開始了嗎？
        </motion.h2>
        <motion.p
          initial={{ opacity: 0 }}
          whileInView={{ opacity: 1 }}
          viewport={{ once: true }}
          transition={{ delay: 0.2 }}
          className="mt-6 text-gray-400 text-lg"
        >
          訂閱 Motion Lab，每週收到一封精心挑選的 motion design 案例與技巧。
        </motion.p>

        <motion.form
          ref={scope}
          onSubmit={onSubmit}
          initial={{ opacity: 0, y: 30 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true }}
          transition={{ delay: 0.4 }}
          className="mt-10 flex flex-col sm:flex-row gap-3 max-w-md mx-auto"
        >
          <input
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            placeholder="your@email.com"
            className="flex-1 px-5 py-3 rounded-full bg-white/5 border border-white/15 text-white placeholder-gray-500 focus:outline-none focus:border-neon-cyan focus:bg-white/10 transition"
          />
          <motion.button
            type="submit"
            whileHover={{ scale: 1.06 }}
            whileTap={{ scale: 0.95 }}
            className="px-6 py-3 rounded-full bg-gradient-to-r from-neon-violet to-neon-cyan text-ink-950 font-semibold shadow-lg whitespace-nowrap"
          >
            {submitted ? '✓ 已訂閱' : '訂閱電子報'}
          </motion.button>
        </motion.form>
      </div>
    </section>
  );
}
