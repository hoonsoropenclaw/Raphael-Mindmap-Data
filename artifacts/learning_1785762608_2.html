<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Calendar Automation · 日程管理與事件提醒</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'PingFang TC', 'Microsoft JhengHei', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'monospace'],
          },
          colors: {
            ink: { 950: '#070912', 900: '#0d1220', 800: '#161b2e', 700: '#222840', 600: '#3a445e' },
            accent: { 50: '#f5f3ff', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' },
            glow: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'slide-in': 'slideIn 0.3s ease-out',
            'fade-in': 'fadeIn 0.4s ease-out',
          },
          keyframes: {
            slideIn: { '0%': { transform: 'translateX(20px)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },

        },
      },
    };

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    body { background: radial-gradient(ellipse at top left, #1c1c3a 0%, #0a0a18 50%, #050510 100%); background-attachment: fixed; color: #e2e8f0; min-height: 100vh; }

    .calendar-cell { min-height: 96px; transition: all 0.15s ease; }
    .calendar-cell:hover { background: rgba(167, 139, 250, 0.06); border-color: rgba(167, 139, 250, 0.3); }

    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(167,139,250,0.5); }

    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4); }
    .btn-primary:active { transform: translateY(0); }

    details > summary::-webkit-details-marker { display: none; }

    .chev { transition: transform 0.2s; }
    [x-cloak] { display: none !important; }
    .ring-focus:focus { outline: none; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.4); }

<body class="grid-bg font-sans antialiased">
  <div id="app" class="min-h-screen flex flex-col"></div>

  <!-- Mount point + Alpine-style minimal state store -->
  <script type="module">
    // ──────────────────────────────────────────────────────────────
    // Hermes Calendar Automation — 前端單頁(SPA)
    // 模組構成:
    //   1. Store          — 中央 state(事件/視圖/auth/設定)
    //   2. ApiClient      — 封裝後端 API(預設走 mock,可切換 Google)
    //   3. CalendarEngine — 月曆計算與事件渲染
    //   4. Components     — Sidebar / Calendar / SidePanel / Settings
    //   5. Toast          — 通知系統
    // ──────────────────────────────────────────────────────────────

    // ---------- 後端 API URL(若 N100 上跑後端,改這裡) ----------
    const API_BASE = 'http://localhost:8765';

    // ============================================================
    // Store (vanilla)
    // ============================================================
    const Store = {
      state: {
        view: 'month',                  // month | list | week
        cursor: new Date(),             // 當前顯示月份
        selectedDate: null,             // 點選的日期
        events: [],
        authMode: 'mock',               // mock | google
        authStatus: { connected: false, account: null, scopes: [], tokenExpiry: null },
        reminders: { leadMinutes: [10, 60], channel: 'console', enabled: false },
        ical: { source: '', lastImport: null, lastExport: null },
        toast: null,
        loading: false,
      },
      listeners: new Set(),
      set(patch) {
        this.state = { ...this.state, ...patch };
        this.listeners.forEach(fn => fn(this.state));
      },
      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      },
    };

    // ============================================================
    // Toast
    // ============================================================
    function showToast(message, type = 'info', duration = 3500) {
      Store.set({ toast: { id: Date.now(), message, type } });
      setTimeout(() => {
        if (Store.state.toast && Store.state.toast.message === message) Store.set({ toast: null });
      }, duration);
    }

    // ============================================================
    // API Client (mock 實作 + Google 後端對接)
    // ============================================================
    const Api = {
      // MOCK: 內建 mock events 以便 demo 完全自走
      _seed() {
        const today = new Date();
        const y = today.getFullYear(); const m = today.getMonth();
        const fmt = (d, h = 9, mn = 0) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mn).toISOString();
        const day = (offset, h, mn) => { const d = new Date(); d.setDate(d.getDate() + offset); return fmt(d, h, mn); };
        const events = [
          { id: 'e1', summary: '團隊週會', description: 'Q3 OKR 對齊 + sprint planning', location: '線上會議室', start: day(0, 10, 0), end: day(0, 11, 30), reminders: { overrides: [{ minutes: 10 }] }, color: '#a78bfa' },
          { id: 'e2', summary: '醫師回診', description: '帶健保卡與用藥紀錄', location: '臺大醫院', start: day(2, 14, 30), end: day(2, 15, 30), reminders: { overrides: [{ minutes: 60 }, { minutes: 10 }] }, color: '#f472b6' },
          { id: 'e3', summary: '產品 Demo 錄影', description: 'Hermes Portal v2 上線展示', location: 'YouTube Studio', start: day(1, 16, 0), end: day(1, 17, 0), reminders: { overrides: [{ minutes: 30 }] }, color: '#22d3ee' },
          { id: 'e4', summary: '運動 - 羽球', description: '', location: '校隊球場', start: day(3, 19, 0), end: day(3, 21, 0), reminders: {}, color: '#34d399' },
          { id: 'e5', summary: '期中考複習', description: '統計學 + 線代', location: '家中', start: day(5, 9, 0), end: day(5, 12, 0), reminders: { overrides: [{ minutes: 120 }] }, color: '#fbbf24' },
          { id: 'e6', summary: '與 mentor 1:1', description: '討論研究方向', location: '學校研究室', start: day(7, 13, 0), end: day(7, 14, 0), reminders: {}, color: '#a78bfa' },
          { id: 'e7', summary: '週末家庭聚餐', description: '媽媽生日', location: '老家', start: day(9, 18, 30), end: day(9, 21, 0), reminders: { overrides: [{ minutes: 1440 }] }, color: '#f472b6' },
          { id: 'e8', summary: '峰會演講', description: 'AI Agent 自動化分享', location: '臺北文創', start: day(11, 10, 0), end: day(11, 12, 0), reminders: { overrides: [{ minutes: 1440 }, { minutes: 60 }] }, color: '#22d3ee' },
        ];
        Store.set({ events });
      },

      async listEvents({ timeMin, timeMax } = {}) {
        if (Store.state.authMode === 'google') {
          try {
            const r = await fetch(`${API_BASE}/events?timeMin=${timeMin}&timeMax=${timeMax}`);
            if (!r.ok) throw new Error('API error');
            return await r.json();
          } catch (e) {
            showToast('後端連線失敗,切回 mock', 'error');
            Store.set({ authMode: 'mock' });
          }
        }
        const min = timeMin ? new Date(timeMin).getTime() : 0;
        const max = timeMax ? new Date(timeMax).getTime() : Infinity;
        return Store.state.events.filter(ev => {
          const t = new Date(ev.start).getTime();
          return t >= min && t <= max;
        });
      },

      async createEvent(payload) {
        if (Store.state.authMode === 'google') {
          const r = await fetch(`${API_BASE}/events`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          return await r.json();
        }
        const ev = {
          id: 'e' + Date.now(),
          ...payload,
          color: payload.color || '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'),
        };
        Store.set({ events: [...Store.state.events, ev] });
        return ev;
      },

      async updateEvent(id, patch) {
        if (Store.state.authMode === 'google') {
          const r = await fetch(`${API_BASE}/events/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
          return await r.json();
        }
        Store.set({
          events: Store.state.events.map(e => (e.id === id ? { ...e, ...patch } : e)),
        });
        return Store.state.events.find(e => e.id === id);
      },

      async deleteEvent(id) {
        if (Store.state.authMode === 'google') {
          await fetch(`${API_BASE}/events/${id}`, { method: 'DELETE' });
        }
        Store.set({ events: Store.state.events.filter(e => e.id !== id) });
        showToast('事件已刪除', 'success');
      },

      async importIcal(source) {
        // 直接讀使用者貼的 .ics 文字(因瀏覽器 CORS 通常阻擋 file:// 與跨網域 fetch)
        try {
          const events = parseIcs(source);
          Store.set({ events: [...Store.state.events, ...events], ical: { ...Store.state.ical, lastImport: { count: events.length, at: new Date().toISOString() } } });
          showToast(`✅ 已匯入 ${events.length} 個事件`, 'success');
          return events.length;
        } catch (e) {
          showToast('解析失敗:' + e.message, 'error');
          return 0;
        }
      },

      async exportIcal() {
        const ics = generateIcs(Store.state.events);
        const blob = new Blob([ics], { type: 'text/calendar' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `calendar-${new Date().toISOString().slice(0, 10)}.ics`;
        a.click();
        URL.revokeObjectURL(url);
        Store.set({ ical: { ...Store.state.ical, lastExport: { count: Store.state.events.length, at: new Date().toISOString() } } });
        showToast(`📤 已匯出 ${Store.state.events.length} 個事件`, 'success');
      },
    };

    // ============================================================
    // ICS parser / generator(輕量,處理基本 RFC 5545)
    // ============================================================
    function unescapeIcs(s) {
      return s.replace(/\\,/g, ',').replace(/\\n/g, '\n').replace(/\\;/g, ';').replace(/\\\\/g, '\\');
    }
    function parseIcs(text) {
      const lines = text.replace(/\r\n/g, '\n').split('\n').filter(Boolean);
      const events = [];
      let cur = null;
      for (const line of lines) {
        if (line === 'BEGIN:VEVENT') { cur = { id: '', summary: '', description: '', location: '', start: '', end: '', allDay: false }; continue; }
        if (line === 'END:VEVENT') { if (cur && cur.summary) events.push(cur); cur = null; continue; }
        if (!cur) continue;
        const idx = line.indexOf(':');
        if (idx === -1) continue;
        const key = line.slice(0, idx);
        const val = line.slice(idx + 1);
        const prop = key.split(';')[0];
        if (prop === 'SUMMARY') cur.summary = unescapeIcs(val);
        else if (prop === 'DESCRIPTION') cur.description = unescapeIcs(val);
        else if (prop === 'LOCATION') cur.location = unescapeIcs(val);
        else if (prop === 'UID') cur.id = val;
        else if (prop === 'DTSTART') { cur.start = icsDateToIso(val); cur.allDay = /^\d{8}$/.test(val); }
        else if (prop === 'DTEND') cur.end = icsDateToIso(val);
      }
      return events.map(e => ({ ...e, color: '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0') }));
    }
    function icsDateToIso(s) {
      if (/^\d{8}$/.test(s)) return new Date(`${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}T00:00:00+08:00`).toISOString();
      const compact = s.replace(/[Z]/, '');
      const y = compact.slice(0, 4); const mo = compact.slice(4, 6); const d = compact.slice(6, 8);
      const h = compact.slice(9, 11) || '00'; const mi = compact.slice(11, 13) || '00';
      return new Date(`${y}-${mo}-${d}T${h}:${mi}:00+08:00`).toISOString();
    }
    function generateIcs(events) {
      const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hermes Calendar Automation//TW', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
      for (const e of events) {
        lines.push('BEGIN:VEVENT');
        lines.push(`UID:${e.id || Date.now() + Math.random()}@hermes`);
        lines.push(`DTSTAMP:${toIcsDate(new Date())}`);
        lines.push(`DTSTART:${toIcsDate(new Date(e.start))}`);
        if (e.end) lines.push(`DTEND:${toIcsDate(new Date(e.end))}`);
        lines.push(`SUMMARY:${(e.summary || '').replace(/,/g, '\\,').replace(/\n/g, '\\n')}`);
        if (e.description) lines.push(`DESCRIPTION:${e.description.replace(/,/g, '\\,').replace(/\n/g, '\\n')}`);
        if (e.location) lines.push(`LOCATION:${e.location.replace(/,/g, '\\,')}`);
        lines.push('END:VEVENT');
      }
      lines.push('END:VCALENDAR');
      return lines.join('\r\n');
    }
    function toIcsDate(d) {
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    }

    // ============================================================
    // Calendar Engine
    // ============================================================
    function buildMonthGrid(date) {
      const y = date.getFullYear(); const m = date.getMonth();
      const first = new Date(y, m, 1);
      const startDay = first.getDay();          // 0=Sun
      const offset = (startDay + 6) % 7;        // 一週開始=週一
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const prevMonthDays = new Date(y, m, 0).getDate();
      const cells = [];
      // 上月補
      for (let i = offset - 1; i >= 0; i--) cells.push({ date: new Date(y, m - 1, prevMonthDays - i), muted: true });
      for (let d = 1; d <= daysInMonth; d++) cells.push({ date: new Date(y, m, d), muted: false });
      // 下月補到 42 格(6 週)
      while (cells.length < 42) {
        const last = cells[cells.length - 1].date;
        const next = new Date(last); next.setDate(last.getDate() + 1);
        cells.push({ date: next, muted: next.getMonth() !== m });
      }
      return cells;
    }
    function eventsByDay(events) {
      const map = new Map();
      for (const ev of events) {
        const key = new Date(ev.start).toDateString();
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(ev);
      }
      return map;
    }
    function isSameDay(a, b) {
      const da = new Date(a); const db = new Date(b);
      return da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth() && da.getDate() === db.getDate();
    }
    function formatTime(iso) {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ============================================================
    // Components(渲染函式 — 用 vanilla JS + Tailwind class,可在
    // 不引入框架的情況下維持 JSX-like 結構)
    // ============================================================
    function Sidebar(state) {
      const totalEvents = state.events.length;
      const upcoming = state.events
        .filter(e => new Date(e.start) >= new Date())
        .sort((a, b) => new Date(a.start) - new Date(b.start))
        .slice(0, 5);

      const connBadge = state.authStatus.connected
        ? `<div class="flex items-center gap-2 text-sm"><span class="led bg-green-400"></span><span class="text-green-300">已連線 · ${state.authStatus.account || ''}</span></div>`
        : `<div class="flex items-center gap-2 text-sm"><span class="led bg-amber-400"></span><span class="text-amber-300">未連線 · ${state.authMode === 'mock' ? 'Mock 模式' : '待授權'}</span></div>`;

      return `
        <aside class="glass w-72 flex-shrink-0 border-r border-accent-700/20 flex flex-col">
          <div class="p-6 border-b border-accent-700/20">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent-500 to-glow-500 flex items-center justify-center shadow-lg shadow-accent-500/30">
                <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              </div>
              <div>
                <h1 class="text-base font-bold text-white">Hermes Calendar</h1>
                <p class="text-xs text-accent-400">自動化 · 提醒 · 同步</p>
              </div>
            </div>
            ${connBadge}
          </div>

          <div class="p-4">
            <button data-action="create-event" class="btn-primary w-full px-4 py-2.5 rounded-xl text-white font-medium flex items-center justify-center gap-2 shadow-lg">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
              新增事件
            </button>
          </div>

          <div class="px-4 pb-4 space-y-1">
            <button data-action="view-month" class="w-full text-left px-3 py-2 rounded-lg ${state.view === 'month' ? 'tab-active' : 'text-slate-400 hover:bg-white/5'} transition flex items-center gap-3 text-sm">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              月檢視
            </button>
            <button data-action="view-list" class="w-full text-left px-3 py-2 rounded-lg ${state.view === 'list' ? 'tab-active' : 'text-slate-400 hover:bg-white/5'} transition flex items-center gap-3 text-sm">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
              列表檢視
            </button>
            <button data-action="open-settings" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-white/5 transition flex items-center gap-3 text-sm">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              設定 · OAuth
            </button>
          </div>

          <div class="px-4 pb-2 text-xs uppercase tracking-wider text-slate-500 font-semibold">即將到來</div>
          <div class="flex-1 overflow-y-auto scrollbar-thin px-4 pb-4 space-y-2">
            ${upcoming.length === 0 ? '<div class="text-sm text-slate-500 text-center py-6">接下來沒有事件 🎉</div>' : ''}
            ${upcoming.map(ev => `
              <button data-action="open-event" data-id="${ev.id}" class="w-full text-left p-3 rounded-lg border border-white/5 hover:border-accent-500/40 hover:bg-white/[0.03] transition">
                <div class="flex items-center gap-2 mb-1">
                  <span class="w-2 h-2 rounded-full" style="background:${ev.color || '#a78bfa'}"></span>
                  <span class="text-xs text-slate-400">${formatTime(ev.start)} · ${new Date(ev.start).getDate()}日</span>
                </div>
                <div class="text-sm text-slate-100 font-medium truncate">${escapeHtml(ev.summary)}</div>

          </div>

          <div class="flex-1 overflow-y-auto scrollbar-thin grid grid-cols-7 grid-rows-6">

    function ListView(state) {

      const initEnd = editing
        ? new Date(editing.end).toISOString().slice(0, 16)

                    const label = n >= 1440 ? `${n / 1440} 天前` : n >= 60 ? `${n / 60} 小時前` : `${n} 分前`;
                    return `<button data-action="toggle-modal-reminder" data-min="${n}" class="px-3 py-1.5 rounded-lg border text-xs ${sel ? 'border-accent-500 bg-accent-500/20 text-accent-400' : 'border-white/10 text-slate-400'}">${label}</button>`;

    function Toast(state) {
      const t = state.toast;
      if (!t) return '';
      const colors = { success: 'border-green-500/50 bg-green-500/10', error: 'border-red-500/50 bg-red-500/10', info: 'border-accent-500/50 bg-accent-500/10' };
      return `<div class="fixed bottom-6 right-6 z-50 animate-slide-in"><div class="glass-strong rounded-xl px-4 py-3 border ${colors[t.type] || colors.info} text-sm text-slate-100 shadow-2xl">${t.message}</div></div>`;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ============================================================
    // 應用根組件 + 路由 + 全域動作分派
    // ============================================================
    let STATE = {
      ...Store.state,
      modal: null,                 // 'create' | 'edit' | 'settings' | 'detail'
      modalEvent: null,
      modalReminders: [],
      modalColor: '#a78bfa',
    };

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="flex h-screen">
          ${Sidebar(STATE)}
          ${STATE.view === 'month' ? MonthView(STATE) : ListView(STATE)}
        </div>
        ${STATE.modal === 'create' ? CreateEventModal(STATE) : ''}
        ${STATE.modal === 'edit' && STATE.modalEvent ? CreateEventModal(STATE, STATE.modalEvent) : ''}
        ${STATE.modal === 'settings' ? SettingsPanel(STATE) : ''}
        ${Toast(STATE)}
      `;
    }

    Store.subscribe(() => {
      STATE = { ...STATE, ...Store.state };
      render();
    });

    // ============================================================
    // Event delegation
    // ============================================================
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      const date = btn.dataset.date;
      const mode = btn.dataset.mode;
      const channel = btn.dataset.channel;
      const min = btn.dataset.min;
      const color = btn.dataset.color;

      switch (action) {
        case 'create-event':
          STATE.modal = 'create'; STATE.modalColor = '#a78bfa'; STATE.modalReminders = []; render(); break;
        case 'close-event-modal':
          STATE.modal = null; render(); break;
        case 'view-month':
          Store.set({ view: 'month' }); break;
        case 'view-list':
          Store.set({ view: 'list' }); break;
        case 'cursor-prev': {
          const d = new Date(STATE.cursor); d.setMonth(d.getMonth() - 1); Store.set({ cursor: d }); break;
        }
        case 'cursor-next': {
          const d = new Date(STATE.cursor); d.setMonth(d.getMonth() + 1); Store.set({ cursor: d }); break;
        }
        case 'cursor-today':
          Store.set({ cursor: new Date(), selectedDate: new Date() }); break;
        case 'select-date':
          Store.set({ selectedDate: date }); break;
        case 'open-event': {
          const ev = STATE.events.find(e => e.id === id);
          if (ev) { STATE.modalEvent = ev; STATE.modal = 'edit'; render(); }
          break;
        }
        case 'create-event-submit':
        case 'update-event-submit': {
          const inputs = document.querySelectorAll('[data-input]');
          const data = {};
          inputs.forEach(inp => { data[inp.dataset.input] = inp.value; });
          if (!data.summary) { showToast('標題不能空白', 'error'); return; }
          const payload = {
            summary: data.summary,
            start: new Date(data.start).toISOString(),
            end: new Date(data.end).toISOString(),
            description: data.description,
            location: data.location,
            reminders: { overrides: STATE.modalReminders.map(m => ({ minutes: m })) },
            color: STATE.modalColor,
          };
          if (action === 'create-event-submit') {
            await Api.createEvent(payload);
            showToast('✅ 事件已建立', 'success');
          } else {
            await Api.updateEvent(id, payload);
            showToast('✅ 已儲存變更', 'success');
          }
          STATE.modal = null; STATE.modalEvent = null; render();
          break;
        }
        case 'delete-event':
          if (confirm('確認刪除此事件?')) await Api.deleteEvent(id);
          break;
        case 'toggle-modal-reminder': {
          const m = parseInt(min, 10);
          if (STATE.modalReminders.includes(m)) STATE.modalReminders = STATE.modalReminders.filter(x => x !== m);
          else STATE.modalReminders = [...STATE.modalReminders, m].sort((a, b) => a - b);
          render();
          break;
        }
        case 'set-color':
          STATE.modalColor = color; render(); break;
        case 'open-settings':
          STATE.modal = 'settings'; render(); break;
        case 'close-settings':
          STATE.modal = null; render(); break;
        case 'set-mode':
          Store.set({ authMode: mode });
          if (mode === 'google') {
            // 提示使用者如何連線
            showToast('切換到 Google 模式 — 請先在終端機跑 device_flow_auth 拿 token', 'info', 6000);
          }
          break;
        case 'toggle-reminder': {
          const m = parseInt(min, 10);
          const cur = STATE.reminders.leadMinutes;
          const next = cur.includes(m) ? cur.filter(x => x !== m) : [...cur, m].sort((a, b) => a - b);
          Store.set({ reminders: { ...STATE.reminders, leadMinutes: next } });
          break;
        }
        case 'set-channel':
          Store.set({ reminders: { ...STATE.reminders, channel } });
          break;
        case 'remind-toggle': {
          const enabled = !STATE.reminders.enabled;
          Store.set({ reminders: { ...STATE.reminders, enabled } });
          if (enabled) startReminderLoop();
          else stopReminderLoop();
          showToast(enabled ? '⏰ 提醒已啟用' : '提醒已停用', 'info');
          break;
        }
        case 'ical-import': {
          const src = document.querySelector('[data-input="ical-source"]')?.value || '';
          if (src.trim()) await Api.importIcal(src);
          break;
        }
        case 'ical-export':
          await Api.exportIcal(); break;
        case 'disconnect':
          Store.set({ authStatus: { connected: false, account: null, scopes: [], tokenExpiry: null } });
          showToast('已中斷連線', 'info'); break;
      }
    });

    // ============================================================
    // Reminder loop(瀏覽器內模擬,與後端 daemon 行為一致)
    // ============================================================
    let reminderTimer = null;
    function startReminderLoop() {
      if (reminderTimer) clearInterval(reminderTimer);
      reminderTimer = setInterval(() => {
        const now = Date.now();
        const lead = STATE.reminders.leadMinutes;
        for (const ev of STATE.events) {
          const delta = (new Date(ev.start).getTime() - now) / 60000;
          for (const m of lead) {
            if (Math.abs(delta - m) < 0.5) {
              if (Notification.permission === 'granted') {
                new Notification(`⏰ ${m} 分鐘後:${ev.summary}`, { body: ev.location });
              } else {
                showToast(`⏰ ${m} 分鐘後:${ev.summary}`, 'info', 5000);
              }
            }
          }
        }
      }, 30000);
      // 請求通知權限
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }
    function stopReminderLoop() {
      if (reminderTimer) clearInterval(reminderTimer);
      reminderTimer = null;
    }

    // ============================================================
    // Boot
    // ============================================================
    Api._seed();
    render();

    window.__HermesCalendar = { Store, Api, STATE: () => STATE };
  </script>
</body>
</html>
