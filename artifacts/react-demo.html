<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React UI 展示 - 任務管理系統</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .task-enter { opacity: 0; transform: translateY(10px); }
        .task-enter-active { opacity: 1; transform: translateY(0); transition: all 300ms ease-in; }
    </style>
</head>
<body class="min-h-screen p-8 flex justify-center items-center">

    <div id="root" class="w-full max-w-3xl"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [tasks, setTasks] = useState([
                { id: 1, title: '完成系統架構設計', category: 'Architecture', completed: true },
                { id: 2, title: '修復心智圖文字重疊問題', category: 'Bugfix', completed: true },
                { id: 3, title: '實作 React UI 展示頁面', category: 'Feature', completed: false },
                { id: 4, title: '檢查 Minimax Token 額度', category: 'DevOps', completed: false }
            ]);
            const [newTask, setNewTask] = useState('');
            const [filter, setFilter] = useState('all');

            const addTask = (e) => {
                e.preventDefault();
                if (!newTask.trim()) return;
                setTasks([{ id: Date.now(), title: newTask, category: 'General', completed: false }, ...tasks]);
                setNewTask('');
            };

            const toggleTask = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            const filteredTasks = useMemo(() => {
                if (filter === 'active') return tasks.filter(t => !t.completed);
                if (filter === 'completed') return tasks.filter(t => t.completed);
                return tasks;
            }, [tasks, filter]);

            const stats = {
                total: tasks.length,
                completed: tasks.filter(t => t.completed).length,
                pending: tasks.filter(t => !t.completed).length
            };

            return (
                <div className="glass-panel rounded-2xl shadow-2xl overflow-hidden flex flex-col">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-6">
                        <h1 className="text-3xl font-bold flex items-center gap-3">
                            <i data-lucide="layout-dashboard"></i>
                            Antigravity 任務管理中樞
                        </h1>
                        <p className="text-blue-100 mt-2 opacity-80">展示 React 複雜狀態管理 (useState, useMemo) 與動態 UI 渲染</p>
                    </div>

                    <div className="p-6">
                        {/* Stats Board */}
                        <div className="grid grid-cols-3 gap-4 mb-8">
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center">
                                <span className="text-slate-400 text-sm font-medium uppercase tracking-wider">總任務</span>
                                <span className="text-3xl font-bold text-white mt-1">{stats.total}</span>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center">
                                <span className="text-slate-400 text-sm font-medium uppercase tracking-wider">已完成</span>
                                <span className="text-3xl font-bold text-emerald-400 mt-1">{stats.completed}</span>
                            </div>
                            <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center">
                                <span className="text-slate-400 text-sm font-medium uppercase tracking-wider">待處理</span>
                                <span className="text-3xl font-bold text-amber-400 mt-1">{stats.pending}</span>
                            </div>
                        </div>

                        {/* Add Task Form */}
                        <form onSubmit={addTask} className="flex gap-3 mb-8 relative">
                            <input 
                                type="text" 
                                value={newTask}
                                onChange={(e) => setNewTask(e.target.value)}
                                placeholder="輸入新任務名稱..." 
                                className="flex-1 bg-slate-800/50 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                            />
                            <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2">
                                <i data-lucide="plus-circle" className="w-5 h-5"></i> 新增
                            </button>
                        </form>

                        {/* Filter Tabs */}
                        <div className="flex gap-2 mb-6 border-b border-slate-700 pb-2">
                            {['all', 'active', 'completed'].map(f => (
                                <button 
                                    key={f}
                                    onClick={() => setFilter(f)}
                                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${filter === f ? 'bg-slate-700 text-white shadow-inner' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}
                                >
                                    {f === 'all' ? '全部' : f === 'active' ? '進行中' : '已完成'}
                                </button>
                            ))}
                        </div>

                        {/* Task List */}
                        <div className="space-y-3 min-h-[300px]">
                            {filteredTasks.length === 0 ? (
                                <div className="text-center text-slate-500 py-10 flex flex-col items-center">
                                    <i data-lucide="inbox" className="w-12 h-12 mb-3 opacity-50"></i>
                                    <p>沒有符合條件的任務</p>
                                </div>
                            ) : (
                                filteredTasks.map(task => (
                                    <div key={task.id} className={`flex items-center justify-between p-4 rounded-xl border transition-all duration-300 ${task.completed ? 'bg-slate-800/30 border-slate-700/50' : 'bg-slate-800/80 border-slate-600 shadow-lg'}`}>
                                        <div className="flex items-center gap-4">
                                            <button 
                                                onClick={() => toggleTask(task.id)}
                                                className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${task.completed ? 'bg-emerald-500 border-emerald-500' : 'border-slate-500 hover:border-blue-400'}`}
                                            >
                                                {task.completed && <i data-lucide="check" className="w-4 h-4 text-white"></i>}
                                            </button>
                                            <div>
                                                <h3 className={`font-medium transition-all ${task.completed ? 'text-slate-500 line-through' : 'text-slate-200'}`}>
                                                    {task.title}
                                                </h3>
                                                <span className={`text-xs px-2 py-1 rounded-md mt-1 inline-block ${task.completed ? 'bg-slate-800 text-slate-600' : 'bg-blue-900/50 text-blue-300 border border-blue-800/50'}`}>
                                                    {task.category}
                                                </span>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => deleteTask(task.id)}
                                            className="text-slate-500 hover:text-red-400 p-2 rounded-lg hover:bg-slate-700 transition-colors opacity-0 hover:opacity-100 focus:opacity-100 group-hover:opacity-100"
                                            style={{opacity: 1}} // Force visible for demo
                                        >
                                            <i data-lucide="trash-2" className="w-5 h-5"></i>
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Initialize Lucide icons after render
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
