<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raphael | Autonomous Learning Core</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        :root {
            --bg-color: #0f111a;
            --glass-bg: rgba(20, 22, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-1: #00f2fe;
            --accent-2: #4facfe;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        h1 {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meta-info {
            display: flex;
            gap: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .meta-value {
            color: var(--text-main);
            font-weight: 600;
            font-size: 1rem;
            margin-top: 0.2rem;
        }

        #chart-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        /* Legend styling */
        .legend-box {
            position: absolute;
            left: 20px;
            bottom: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            z-index: 100;
            font-size: 0.9rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }
        .legend-item:last-child {
            margin-bottom: 0;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="status-indicator"></div>
            <h1>RAPHAEL CORE</h1>
        </div>
        <div class="meta-info">
            <div class="meta-item">
                <span>Last Updated</span>
                <span class="meta-value" id="last-updated">Fetching...</span>
            </div>
            <div class="meta-item">
                <span>Total Nodes</span>
                <span class="meta-value" id="total-nodes" style="color: var(--accent-1);">0</span>
            </div>
        </div>
    </header>

    <div id="chart-container"></div>
    
    <div class="legend-box">
        <div class="legend-item"><div class="legend-color" style="background:#10b981;"></div><span>進行中 (Ongoing)</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#f59e0b;"></div><span>計畫中 (Planned)</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#3b82f6;"></div><span>已完成 (Completed)</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#ec4899; box-shadow: 0 0 10px #ec4899;"></div><span>包含 GitHub 實作連結</span></div>
        <div class="legend-item"><div class="legend-color" style="background:transparent; border: 1px solid #94a3b8;"></div><span>父節點 / 分支點</span></div>
    </div>

    <script>
        const chartDom = document.getElementById('chart-container');
        const myChart = echarts.init(chartDom, 'dark');
        myChart.setOption({ backgroundColor: 'transparent' });
        
        myChart.showLoading({
            text: 'Loading Neural Pathways...',
            color: '#00f2fe',
            textColor: '#fff',
            maskColor: 'rgba(15, 17, 26, 0.8)',
            zlevel: 0
        });

        function countNodes(node) {
            let count = 1;
            if (node.children) {
                for (let child of node.children) {
                    count += countNodes(child);
                }
            }
            return count;
        }

        // 遞迴處理節點樣式
        function styleNodes(node) {
            // 基本的樣式覆寫
            node.itemStyle = {};
            
            if (node.children && node.children.length > 0) {
                // 父節點
                node.symbol = 'emptyCircle';
                node.symbolSize = 14;
                node.itemStyle.borderColor = '#94a3b8';
                node.itemStyle.borderWidth = 2;
                node.itemStyle.shadowBlur = 10;
                node.itemStyle.shadowColor = 'rgba(255,255,255,0.2)'; // 3D厚度感
                for (let child of node.children) {
                    styleNodes(child);
                }
            } else {
                // 子節點 (圓角矩形)
                node.symbol = 'roundRect';
                node.symbolSize = [140, 36];
                
                // 依據狀態給色
                let bgColor = '#3b82f6'; // 預設：已完成 (藍)
                if (node.status === 'ongoing') bgColor = '#10b981'; // 進行中 (綠)
                if (node.status === 'planned') bgColor = '#f59e0b'; // 計畫中 (橘)
                
                node.itemStyle = { color: bgColor, borderRadius: 6 };
                
                // 有 URL 的給予高亮 / 特殊顏色 (粉橘紅色)
                if (node.url) {
                    node.itemStyle.color = '#ec4899';
                    node.itemStyle.shadowBlur = 15;
                    node.itemStyle.shadowColor = '#ec4899';
                }
                
                node.label = {
                    position: 'inside',
                    color: '#ffffff',
                    fontSize: 12,
                    formatter: function(params) {
                        let text = params.name;
                        // 簡單折行處理，若太長則分兩行
                        if(text.length > 15 && text.includes('(')) {
                            return text.replace(' (', '\n(');
                        }
                        return text;
                    }
                };
            }
            return node;
        }

        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                myChart.hideLoading();
                
                document.getElementById('last-updated').innerText = data.last_updated || new Date().toLocaleString();
                document.getElementById('total-nodes').innerText = countNodes(data.mindmap);

                const styledData = styleNodes(data.mindmap);

                const option = {
                    tooltip: {
                        trigger: 'item',
                        triggerOn: 'mousemove',
                        backgroundColor: 'rgba(20, 22, 35, 0.9)',
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        textStyle: { color: '#e2e8f0' },
                        formatter: function(params) {
                            let res = `<b>${params.name}</b>`;
                            if(params.data.status) res += `<br/>狀態: ${params.data.status}`;
                            if(params.data.url) res += `<br/><span style="color:#ec4899;">[點擊開啟 URL]</span>`;
                            return res;
                        }
                    },
                    series: [
                        {
                            type: 'tree',
                            data: [styledData],
                            top: '5%',
                            left: '10%',
                            bottom: '5%',
                            right: '15%',
                            layout: 'orthogonal', // 確保垂直分佈均勻
                            edgeShape: 'curve',
                            initialTreeDepth: 3,
                            roam: true, // 支援平移與縮放
                            nodePadding: 20,
                            layerPadding: 60,
                            
                            label: {
                                position: 'left',
                                verticalAlign: 'middle',
                                align: 'right',
                                fontSize: 13,
                                color: '#e2e8f0'
                            },
                            
                            expandAndCollapse: true,
                            animationDuration: 550,
                            animationDurationUpdate: 750,
                            
                            lineStyle: {
                                color: 'source',
                                width: 2,
                                curveness: 0.5
                            }
                        }
                    ]
                };

                myChart.setOption(option);
                
                // 點擊事件：縮放與打開連結
                myChart.on('click', function (params) {
                    if (params.data.url) {
                        window.open(params.data.url, '_blank');
                    } else if (!params.data.children || params.data.children.length === 0) {
                        // 點擊最末端節點時放大置中
                        myChart.dispatchAction({
                            type: 'highlight',
                            dataIndex: params.dataIndex
                        });
                    }
                });
            })
            .catch(error => {
                console.error("Error loading data:", error);
                myChart.hideLoading();
                myChart.setOption({
                    title: {
                        text: 'Failed to load neural data.json',
                        left: 'center',
                        top: 'center',
                        textStyle: { color: '#ef4444' }
                    }
                });
            });

        window.addEventListener('resize', () => {
            myChart.resize();
        });
    </script>
</body>
</html>
