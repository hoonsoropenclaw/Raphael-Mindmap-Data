<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>即時桌面 OCR</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151c30;--line:#2b3654;--text:#eef3ff;--muted:#9eabc9;--accent:#7dd3fc;--ok:#86efac;--bad:#fca5a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#172554,transparent 35%),var(--bg);font:16px system-ui;color:var(--text)}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:clamp(28px,5vw,48px);margin:0}.lead{color:var(--muted);margin:8px 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151c30dd;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 50px #0005}.drop{min-height:280px;border:2px dashed #47567a;border-radius:14px;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer}.drop.drag{border-color:var(--accent);background:#0c4a6e55}.drop img{max-width:100%;max-height:300px;border-radius:8px}button,select,input{font:inherit}button{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#082f49;font-weight:700;cursor:pointer}button.secondary{background:#26324d;color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.field{display:grid;gap:5px;color:var(--muted);font-size:13px}select,input[type=number]{background:#0b1020;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.status{padding:9px 12px;border-radius:9px;background:#202a43;color:var(--muted)}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}textarea{width:100%;min-height:290px;resize:vertical;background:#090e1b;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font:15px ui-monospace,monospace}.metrics{display:flex;gap:16px;color:var(--muted);font-size:14px}kbd{background:#27324c;padding:2px 6px;border-radius:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>即時桌面 OCR</h1><p class="lead">圖片留在本機。上傳、貼上截圖，或在支援 GUI 的桌面啟用即時擷取。</p>
<div class="row"><span id="health" class="status">檢查服務…</span><label class="field">語言<select id="lang"></select></label><label class="field">版面<select id="psm"><option value="6">一般區塊</option><option value="3">自動</option><option value="11">稀疏文字</option></select></label><label class="field">預處理<select id="prep"><option>auto</option><option>gray</option><option>threshold</option><option>none</option></select></label><label class="field">間隔(ms)<input id="interval" type="number" min="500" max="10000" value="1500"></label></div>
<div class="grid"><section class="card"><div id="drop" class="drop" tabindex="0"><div id="hint"><strong>拖入圖片或點擊選擇</strong><br><span class="lead">也可按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 貼上截圖</span></div><img id="preview" hidden alt="待辨識圖片預覽"></div><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif" hidden><div class="row"><button id="ocr" disabled>辨識圖片</button><button id="live" class="secondary">啟用即時桌面</button></div></section>
<section class="card"><div class="row"><button id="copy" class="secondary">複製文字</button><button id="save" class="secondary">下載 .txt</button><span id="state" class="status">待命</span></div><div class="metrics"><span>信心 <b id="confidence">—</b></span><span>耗時 <b id="duration">—</b></span><span>文字框 <b id="blocks">—</b></span></div><textarea id="output" aria-label="OCR 結果" placeholder="辨識結果會顯示在這裡"></textarea></section></div></main>
<script>
const $=id=>document.getElementById(id), drop=$('drop'), file=$('file'), preview=$('preview');let blob=null,timer=null,busy=false,last='';
const options=()=>`lang=${encodeURIComponent($('lang').value)}&psm=${$('psm').value}&preprocess=${$('prep').value}`;
function state(text,bad=false){$('state').textContent=text;$('state').className='status '+(bad?'bad':'ok')}
function setImage(f){if(!f||!f.type.startsWith('image/'))return state('請選擇圖片',true);if(f.size>10*1024*1024)return state('圖片超過 10 MiB',true);blob=f;preview.src=URL.createObjectURL(f);preview.hidden=false;$('hint').hidden=true;$('ocr').disabled=false;state('圖片已載入')}
function render(r){if(r.text!==last){$('output').value=r.text;last=r.text}$('confidence').textContent=r.confidence+'%';$('duration').textContent=r.duration_ms+' ms';$('blocks').textContent=r.blocks.length;state(r.text?'辨識完成':'未偵測到文字')}
async function request(url,opts){if(busy)return;busy=true;state('辨識中…');try{const res=await fetch(url,opts),data=await res.json();if(!res.ok)throw Error(data.error||`HTTP ${res.status}`);render(data)}catch(e){state(e.message,true)}finally{busy=false}}
$('ocr').onclick=()=>request('/api/ocr?'+options(),{method:'POST',headers:{'Content-Type':blob.type},body:blob});
$('live').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('live').textContent='啟用即時桌面';state('即時模式已停止');return}const tick=()=>request('/api/capture?'+options());tick();timer=setInterval(tick,Math.max(500,Number($('interval').value)||1500));$('live').textContent='停止即時桌面'};
drop.onclick=()=>file.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')file.click()};file.onchange=()=>setImage(file.files[0]);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>setImage(e.dataTransfer.files[0]));document.addEventListener('paste',e=>{const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(f)setImage(f)});
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('output').value);state('已複製')};$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('output').value],{type:'text/plain'}));a.download='ocr-result.txt';a.click()};
fetch('/api/health').then(r=>r.json()).then(h=>{const el=$('health');el.textContent=h.ok?`OCR 就緒 · ${h.languages.join(', ')}`:'Tesseract 不可用';el.className='status '+(h.ok?'ok':'bad');h.languages.forEach(x=>$('lang').add(new Option(x,x)));$('lang').value=h.languages.includes('eng')?'eng':h.languages[0];if(!h.capture_available){$('live').disabled=true;$('live').title='目前主機沒有圖形桌面，請上傳或貼上截圖'}}).catch(()=>{$('health').textContent='無法連線本機服務';$('health').className='status bad'});
</script></body></html>
