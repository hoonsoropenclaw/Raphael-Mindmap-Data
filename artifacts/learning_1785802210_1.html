<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Glassmorphism Visual Regression Fixture</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eef2ff;background:#0b1020}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 10%,#4f46e555,transparent 35%),radial-gradient(circle at 90% 80%,#06b6d455,transparent 32%),#0b1020}
    .orb{position:fixed;border-radius:50%;filter:blur(2px);opacity:.5;pointer-events:none}.orb.a{width:260px;height:260px;background:#a855f7;top:-80px;left:-70px}.orb.b{width:320px;height:320px;background:#06b6d4;right:-100px;bottom:-120px}
    .shell{position:relative;max-width:1040px;margin:auto;padding:64px 24px}.glass{border:1px solid #ffffff2b;background:#ffffff12;box-shadow:0 24px 80px #00000033,inset 0 1px #ffffff22;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px}
    header{padding:28px 32px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:20px} h1{font-size:clamp(1.8rem,5vw,3.8rem);line-height:1;margin:0 0 10px;letter-spacing:-.05em} p{color:#cbd5e1;margin:0}.eyebrow{color:#67e8f9;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:700}
    .badge{border:1px solid #67e8f966;background:#67e8f91a;color:#a5f3fc;padding:9px 13px;border-radius:999px;white-space:nowrap;font-size:.8rem}
    main{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.panel{padding:28px}.panel h2{margin:0 0 20px;font-size:1.15rem}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:18px;border-radius:16px;background:#ffffff0b;border:1px solid #ffffff1c}.metric strong{display:block;font-size:1.7rem;margin-top:6px}.metric span{color:#94a3b8;font-size:.78rem}.bar{height:9px;background:#ffffff18;border-radius:99px;overflow:hidden;margin:22px 0}.bar i{display:block;width:76%;height:100%;background:linear-gradient(90deg,#22d3ee,#818cf8);border-radius:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap}.button{cursor:pointer;border:1px solid #ffffff2b;background:#ffffff12;color:#fff;padding:11px 16px;border-radius:12px;font-weight:700}.button.primary{background:linear-gradient(135deg,#06b6d4,#6366f1);border:0}.button:focus-visible{outline:3px solid #67e8f9;outline-offset:3px}.status{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #ffffff12}.dot{width:9px;height:9px;background:#34d399;border-radius:50%;box-shadow:0 0 14px #34d399}.status:last-child{border:0}.status small{display:block;color:#94a3b8;margin-top:3px}.toast{display:none;margin-top:16px;padding:12px;border-radius:12px;background:#34d39922;color:#a7f3d0;border:1px solid #34d39955}.toast.show{display:block}@media(max-width:720px){.shell{padding:24px 14px}header{padding:22px;align-items:flex-start;flex-direction:column}main{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:span 2}}
  </style>
</head>
<body><div class="orb a"></div><div class="orb b"></div><div class="shell">
  <header class="glass"><div><div class="eyebrow">Visual QA Fixture</div><h1>Glass / Signal</h1><p>可重跑的 Glassmorphism 視覺回歸測試頁</p></div><span class="badge">baseline ready</span></header>
  <main><section class="glass panel"><h2>系統概況</h2><div class="metrics"><div class="metric"><span>視覺穩定度</span><strong>98.4%</strong></div><div class="metric"><span>元件覆蓋</span><strong>24</strong></div><div class="metric"><span>差異像素</span><strong>0.03%</strong></div></div><div class="bar"><i></i></div><div class="actions"><button class="button primary" id="run">執行視覺檢查</button><button class="button" id="reset">重設</button></div><div class="toast" id="toast" role="status">視覺檢查完成：未發現退化。</div></section>
  <aside class="glass panel"><h2>驗證清單</h2><div class="status"><i class="dot"></i><div>Backdrop blur<small>18px glass layer</small></div></div><div class="status"><i class="dot"></i><div>Contrast<small>WCAG-friendly text</small></div></div><div class="status"><i class="dot"></i><div>Responsive<small>desktop → mobile</small></div></div></aside></main>
</div><script>const toast=document.querySelector('#toast');document.querySelector('#run').onclick=()=>toast.classList.add('show');document.querySelector('#reset').onclick=()=>toast.classList.remove('show');</script></body></html>
