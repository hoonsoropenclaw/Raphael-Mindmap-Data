<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GlassMorphism 行政系統 | Framer Motion</title>

<!-- React 18 -->
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel JSX -->
<script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
<!-- Framer Motion -->
<script src="https://unpkg.com/framer-motion@11.2.10/dist/framer-motion.js"></script>

<style>
  :root {
    --bg-grad-1: #1a1c4b;
    --bg-grad-2: #4a1a6b;
    --bg-grad-3: #1a4b6b;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --text-muted: rgba(255, 255, 255, 0.45);
    --accent: #7c5cff;
    --accent-2: #ff5cc8;
    --accent-3: #5ce0ff;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
    color: var(--text-primary);
    overflow: hidden;
    background: #0a0a1e;
  }

  /* 動態漸層背景 */
  .aurora-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
    background-size: 400% 400%;
    animation: aurora 20s ease infinite;
  }
  @keyframes aurora {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
  }
  .blob-1 { width: 500px; height: 500px; background: #7c5cff; top: -100px; left: -100px; animation: float1 18s ease-in-out infinite; }
  .blob-2 { width: 400px; height: 400px; background: #ff5cc8; bottom: -100px; right: -100px; animation: float2 22s ease-in-out infinite; }
  .blob-3 { width: 350px; height: 350px; background: #5ce0ff; top: 40%; left: 60%; animation: float3 25s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(80px,60px) scale(1.1);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-60px,-80px) scale(1.15);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-100px,40px) scale(0.9);} }

  /* Glassmorphism */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 20px;
  }

  /* 主佈局 */
  .app-shell {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: 1fr auto;
    grid-template-areas:
      "sidebar main"
      "sidebar footer";
    gap: 16px;
    padding: 16px;
  }

  .sidebar { grid-area: sidebar; width: 240px; }
  .main    { grid-area: main; overflow: auto; padding: 8px; }
  .footer  { grid-area: footer; height: 52px; }

  /* Sidebar 內部 */
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; margin: 4px 8px;
    border-radius: 12px; cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px; font-weight: 500;
    transition: background 0.25s, color 0.25s;
    position: relative; overflow: hidden;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
  .nav-item.active { background: rgba(124,92,255,0.18); color: var(--text-primary); }
  .nav-item.active::before {
    content:""; position: absolute; left: 0; top: 20%;
    width: 3px; height: 60%; background: var(--accent);
    border-radius: 0 4px 4px 0;
  }
  .nav-icon {
    width: 20px; height: 20px; display: inline-flex;
    align-items: center; justify-content: center;
  }

  /* Topbar */
  .search-box {
    flex: 1;
    max-width: 480px;
    height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .search-box input {
    flex: 1; background: transparent; border: none; outline: none;
    color: white; font-size: 14px;
  }
  .search-box input::placeholder { color: var(--text-muted); }

  /* KPI 卡片 */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .kpi-card { padding: 20px; cursor: pointer; }
  .kpi-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
  .kpi-value { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi-delta { font-size: 12px; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; }
  .delta-up   { color: var(--success); }
  .delta-down { color: var(--danger); }
  .kpi-spark { height: 32px; margin-top: 12px; }

  /* 內容區 grid */
  .content-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
  }
  .panel { padding: 20px; }
  .panel-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .panel-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  /* 待辦清單 */
  .todo-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 10px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .todo-row:hover { background: rgba(255,255,255,0.06); }
  .todo-check {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
  }
  .todo-check.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .todo-title { flex: 1; font-size: 14px; }
  .todo-title.done { text-decoration: line-through; color: var(--text-muted); }
  .todo-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: rgba(124,92,255,0.2); color: #c4b5fd;
  }
  .todo-tag.urgent { background: rgba(248,113,113,0.2); color: #fca5a5; }
  .todo-tag.normal { background: rgba(251,191,36,0.15); color: #fde68a; }

  /* 時間軸 */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before {
    content:""; position: absolute; left: 8px; top: 8px; bottom: 8px;
    width: 2px; background: linear-gradient(to bottom, var(--accent), transparent);
  }
  .timeline-item {
    position: relative; padding: 10px 0;
  }
  .timeline-dot {
    position: absolute; left: -22px; top: 14px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(124,92,255,0.2);
  }
  .timeline-time { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .timeline-title { font-size: 13px; font-weight: 500; }
  .timeline-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  /* 案件流程圖 */
  .flow-container {
    display: flex; align-items: center; gap: 8px;
    padding: 20px 0; overflow-x: auto;
  }
  .flow-node {
    padding: 12px 16px; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 12px; font-weight: 500;
    white-space: nowrap; min-width: 110px;
    text-align: center;
  }
  .flow-node.done { background: rgba(74,222,128,0.15); border-color: rgba(74,222,128,0.4); color: #bbf7d0; }
  .flow-node.current { background: rgba(124,92,255,0.25); border-color: rgba(124,92,255,0.5); color: #ddd6fe; }
  .flow-arrow { color: var(--text-muted); font-size: 18px; }

  /* Bar chart */
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 8px; }
  .bar {
    flex: 1; border-radius: 6px 6px 0 0;
    background: linear-gradient(to top, var(--accent), var(--accent-2));
    position: relative;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .bar:hover { filter: brightness(1.3); }
  .bar-label { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 6px; }

  /* Buttons */
  .btn {
    padding: 8px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: white; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.15); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
  }
  .btn-primary:hover { filter: brightness(1.15); }

  /* Avatar */
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
    flex-shrink: 0;
  }
  .avatar.sm { width: 28px; height: 28px; font-size: 11px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

  /* Responsive */
  @media (max-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .content-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .sidebar { width: 64px; }
    .nav-text { display: none; }
    .kpi-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="aurora-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo } = React;
const { motion, AnimatePresence } = window["framer-motion"] || {};

/* ====== 圖示組件（內嵌 SVG，避免外部依賴） ====== */
const Icon = ({ name, size = 18 }) => {
  const paths = {
    dashboard: <><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,
    staff: <><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2 1.5-3.5 3.5-3.5"/></>,
    calendar: <><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></>,
    doc: <><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></>,
    approve: <><polyline points="20 6 9 17 4 12"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></>,
    bell: <><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></>,
    search: <><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></>,
    plus: <><path d="M12 5v14M5 12h14"/></>,
    trend: <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>,
    user: <><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></>,
    logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {paths[name]}
    </svg>
  );
};

/* ====== 動畫 variants ====== */
const sidebarVariants = {
  open: { width: 240, transition: { duration: 0.4, ease: [0.4, 0, 0.2, 1] } },
  closed: { width: 64, transition: { duration: 0.4, ease: [0.4, 0, 0.2, 1] } },
};

const containerStagger = {
  hidden: { opacity: 0 },
  visible: { opacity: 1, transition: { staggerChildren: 0.08, delayChildren: 0.1 } },
};

const fadeUp = {
  hidden: { opacity: 0, y: 20 },
  visible: { opacity: 1, y: 0, transition: { duration: 0.5, ease: [0.4, 0, 0.2, 1] } },
};

const fadeIn = {
  hidden: { opacity: 0 },
  visible: { opacity: 1, transition: { duration: 0.4 } },
};

const itemSlide = {
  hidden: { opacity: 0, x: -16 },
  visible: { opacity: 1, x: 0, transition: { duration: 0.4, ease: [0.4, 0, 0.2, 1] } },
};

/* ====== Sidebar ====== */
const Sidebar = ({ active, onSelect, collapsed }) => {
  const items = [
    { id: "dashboard", label: "儀表板", icon: "dashboard" },
    { id: "staff",     label: "人員名冊", icon: "staff" },
    { id: "calendar",  label: "行事曆", icon: "calendar" },
    { id: "doc",       label: "文件管理", icon: "doc" },
    { id: "approve",   label: "簽核中心", icon: "approve" },
    { id: "settings",  label: "系統設定", icon: "settings" },
  ];

  return (
    <motion.div
      className="sidebar glass"
      animate={collapsed ? "closed" : "open"}
      variants={sidebarVariants}
      initial={false}
      style={{ overflow: "hidden", padding: "16px 0" }}
    >
      {/* Logo */}
      <div style={{ padding: "8px 20px 24px", display: "flex", alignItems: "center", gap: 10 }}>
        <motion.div
          initial={{ rotate: 0 }}
          animate={{ rotate: 360 }}
          transition={{ duration: 18, repeat: Infinity, ease: "linear" }}
          style={{ width: 32, height: 32, borderRadius: 10,
            background: "linear-gradient(135deg, var(--accent), var(--accent-2))",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontWeight: 800, fontSize: 14, flexShrink: 0 }}>
          GM
        </motion.div>
        {!collapsed && (
          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            transition={{ delay: 0.1 }}
          >
            <div style={{ fontSize: 14, fontWeight: 700 }}>GlassMorphism</div>
            <div style={{ fontSize: 11, color: "var(--text-muted)" }}>行政系統 v2.0</div>
          </motion.div>
        )}
      </div>

      {/* Nav items */}
      <motion.div
        variants={containerStagger}
        initial="hidden"
        animate="visible"
      >
        {items.map(it => {
          const isActive = active === it.id;
          return (
            <motion.div
              key={it.id}
              className={`nav-item ${isActive ? "active" : ""}`}
              onClick={() => onSelect(it.id)}
              variants={itemSlide}
              whileHover={{ x: 4 }}
              whileTap={{ scale: 0.98 }}
            >
              <span className="nav-icon"><Icon name={it.icon} /></span>
              {!collapsed && <span className="nav-text">{it.label}</span>}
              {!collapsed && it.id === "approve" && (
                <motion.span
                  initial={{ scale: 0 }}
                  animate={{ scale: 1 }}
                  transition={{ delay: 0.6, type: "spring" }}
                  style={{
                    marginLeft: "auto", fontSize: 10, padding: "2px 7px",
                    background: "var(--danger)", borderRadius: 10, fontWeight: 600
                  }}
                >5</motion.span>
              )}
            </motion.div>
          );
        })}
      </motion.div>

      {!collapsed && (
        <motion.div
          initial={{ opacity: 0, y: 20 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ delay: 0.6, duration: 0.5 }}
          style={{
            margin: "20px", padding: 16, borderRadius: 14,
            background: "linear-gradient(135deg, rgba(124,92,255,0.25), rgba(255,92,200,0.18))",
            border: "1px solid rgba(255,255,255,0.12)",
            fontSize: 12, color: "var(--text-secondary)"
          }}
        >
          <div style={{ fontWeight: 600, color: "white", marginBottom: 6 }}>✨ Pro 升級</div>
          解鎖進階報表、<br/>無限成員與 OCR
        </motion.div>
      )}
    </motion.div>
  );
};

/* ====== Topbar ====== */
const Topbar = ({ collapsed, setCollapsed }) => (
  <motion.div
    className="glass"
    initial={{ y: -20, opacity: 0 }}
    animate={{ y: 0, opacity: 1 }}
    transition={{ delay: 0.2, duration: 0.5 }}
    style={{
      display: "flex", alignItems: "center", gap: 16,
      padding: "0 20px", height: 64, marginBottom: 16
    }}
  >
    <button
      onClick={() => setCollapsed(c => !c)}
      style={{ background: "transparent", border: "none", color: "white", cursor: "pointer", padding: 8 }}
      title="切換側邊欄"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div className="search-box">
      <Icon name="search" />
      <input placeholder="搜尋人員、文件、案件…" />
      <kbd style={{
        fontSize: 10, padding: "2px 6px", borderRadius: 4,
        background: "rgba(255,255,255,0.1)", color: "var(--text-muted)",
        border: "1px solid rgba(255,255,255,0.15)"
      }}>⌘ K</kbd>
    </div>

    <motion.button
      className="btn btn-primary"
      whileHover={{ scale: 1.05 }}
      whileTap={{ scale: 0.95 }}
      style={{ display: "flex", alignItems: "center", gap: 6 }}
    >
      <Icon name="plus" size={14} /> 新增案件
    </motion.button>

    <motion.div whileHover={{ scale: 1.1 }} style={{ position: "relative", cursor: "pointer" }}>
      <Icon name="bell" />
      <motion.span
        animate={{ scale: [1, 1.2, 1] }}
        transition={{ duration: 1.8, repeat: Infinity }}
        style={{
          position: "absolute", top: -2, right: -2, width: 8, height: 8,
          background: "var(--danger)", borderRadius: "50%"
        }}
      />
    </motion.div>

    <div className="avatar" title="總工程師">總</div>
  </motion.div>
);

/* ====== KPI Card ====== */
const KpiCard = ({ label, value, delta, deltaUp, sparkData, accent }) => {
  const max = Math.max(...sparkData);
  const points = sparkData.map((v, i) => {
    const x = (i / (sparkData.length - 1)) * 100;
    const y = 100 - (v / max) * 100;
    return `${x},${y}`;
  }).join(" ");

  return (
    <motion.div
      className="glass kpi-card"
      variants={fadeUp}
      whileHover={{ y: -4, boxShadow: "0 12px 40px rgba(0,0,0,0.35)" }}
      transition={{ type: "spring", stiffness: 300 }}
    >
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">
        <CountUp to={value} />
      </div>
      <div className={`kpi-delta ${deltaUp ? "delta-up" : "delta-down"}`}>
        <span>{deltaUp ? "▲" : "▼"}</span>
        <span>{delta}</span>
        <span style={{ color: "var(--text-muted)" }}>vs 上週</span>
      </div>
      <svg className="kpi-spark" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <linearGradient id={`grad-${label}`} x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor={accent} stopOpacity="0.5"/>
            <stop offset="100%" stopColor={accent} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <motion.polyline
          fill="none" stroke={accent} strokeWidth="2"
          points={points}
          initial={{ pathLength: 0, opacity: 0 }}
          animate={{ pathLength: 1, opacity: 1 }}
          transition={{ duration: 1.2, delay: 0.4, ease: "easeOut" }}
        />
        <motion.polygon
          fill={`url(#grad-${label})`}
          points={`0,100 ${points} 100,100`}
          initial={{ opacity: 0 }}
          animate={{ opacity: 1 }}
          transition={{ duration: 1.4, delay: 0.6 }}
        />
      </svg>
    </motion.div>
  );
};

/* 數字滾動 Hook */
const CountUp = ({ to, duration = 1.2 }) => {
  const [n, setN] = useState(0);
  useEffect(() => {
    const start = performance.now();
    let raf;
    const step = (now) => {
      const t = Math.min((now - start) / (duration * 1000), 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setN(Math.floor(eased * to));
      if (t < 1) raf = requestAnimationFrame(step);
      else setN(to);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [to, duration]);
  return <span>{n.toLocaleString()}</span>;
};
