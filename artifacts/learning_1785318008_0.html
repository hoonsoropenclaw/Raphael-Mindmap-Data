  const [rfInstance, setRfInstance] = useState(null);

  // 計算 layout：左側放角色、右側放權限（自動排版）
  const layoutNodesAndEdges = useCallback((roles, perms, assignments) => {
    const ROLE_X = 80,
      PERM_X = 480;
    const ROW_HEIGHT = 110,
      COL_WIDTH = 220;
    const roleNodes = roles.map((r, i) => ({
      id: r.id,
      type: "roleNode",
      position: {
        x: ROLE_X,
        y: 60 + i * ROW_HEIGHT
      },
      data: {
        ...r,
        permissionCount: (assignments[r.id] || []).length
      }
    }));
    const permNodes = perms.map((p, i) => ({
      id: p.id,
      type: "permNode",
      position: {
        x: PERM_X + i % 3 * COL_WIDTH,
        y: 40 + Math.floor(i / 3) * ROW_HEIGHT
      },
      data: {
        ...p
      }
    }));

    Object.entries(assignments).forEach(([roleId, permIds]) => {
      permIds.forEach(permId => {
        newEdges.push({
          id: `e:${roleId}-${permId}`,
          source: roleId,
          target: permId,
          type: "smoothstep",
          markerEnd: {
            type: MarkerType.ArrowClosed,
            color: "#38bdf8"
          },
          data: {
            granted: true,
            roleId,
            permId
          }
        });
      });
    });

      nodes: [...roleNodes, ...permNodes],
      edges: newEdges
    };

      nodes: n,
      edges: e

    setEdges(e);

      nodes: n,
      edges: e
    } = layoutNodesAndEdges(roles, permissions, assignments);

      const old = prev.find(p => p.id === nn.id);
      return old ? {
        ...nn,
        position: old.position

  }, []);
  const onPaneClick = useCallback(() => {

    setSelectedEdgeId(null);

    event.preventDefault();

  }, []);

    event.preventDefault();

      y: event.clientY - reactFlowBounds.top

        id: newId,
        label: "新角色",
        tier: "editor",
        color: "#38bdf8"

      setAssignments(a => ({
        ...a,

      setPermissions(ps => [...ps, {
        id: newId,
        label: "新權限",
