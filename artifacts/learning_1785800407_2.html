<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RBAC Flow Studio · 以 React Flow + RBAC 為核心的工作流自動化系統</title>
<meta name="description" content="RBAC Flow Studio：以 React Flow 為核心的工作流自動化系統，內建 Role-Based Access Control、JSON Schema 動態表單、4 種業務範本與多角色即時權限矩陣。" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237c3aed'/><path d='M8 22 L14 10 L20 22 M11 17 H17' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='24' cy='10' r='3' fill='%23fbbf24'/><path d='M22 19 L24 21 L28 17' stroke='%23fbbf24' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>" />
<style>
  /* =========================================================================
     Design tokens
     ========================================================================= */
  :root {
    --bg-0: #0b0d12;
    --bg-1: #11141c;
    --bg-2: #161a24;
    --bg-3: #1c2230;
    --bg-4: #242b3a;
    --line: #2a3346;
    --line-soft: #1f2638;
    --text-0: #f5f7fb;
    --text-1: #c8cfdd;
    --text-2: #8993a8;
    --text-3: #5a647a;
    --accent: #7c3aed;
    --accent-2: #a78bfa;
    --accent-soft: rgba(124, 58, 237, 0.14);
    --good: #10b981;
    --good-soft: rgba(16, 185, 129, 0.15);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.15);
    --bad: #ef4444;
    --bad-soft: rgba(239, 68, 68, 0.15);
    --info: #38bdf8;
    --info-soft: rgba(56, 189, 248, 0.15);
    --shadow-1: 0 1px 0 rgba(255,255,255,0.04), 0 4px 14px rgba(0,0,0,0.35);
    --shadow-2: 0 1px 0 rgba(255,255,255,0.04), 0 12px 32px rgba(0,0,0,0.5);
    --radius-1: 6px;
    --radius-2: 10px;
    --radius-3: 14px;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(124, 58, 237, 0.10), transparent 60%),
      radial-gradient(900px 600px at -10% 100%, rgba(56, 189, 248, 0.08), transparent 60%),
      var(--bg-0);
    color: var(--text-0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* =========================================================================
     App layout
     ========================================================================= */
  .app {
    display: grid;
    grid-template-rows: 56px 1fr;
    height: 100%;
  }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--bg-1);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; letter-spacing: 0.2px;
  }
  .brand .logo {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent) 0%, #5b21b6 100%);
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 4px 12px rgba(124,58,237,0.35);
    color: white; font-weight: 800;
  }
  .brand .name { font-size: 15px; }
  .brand .tag {
    color: var(--text-2); font-weight: 500; font-size: 12px;
    padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg-2);
  }
  .topbar .spacer { flex: 1; }
  .topbar .group { display: flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-3);
    color: var(--text-0);
    border: 1px solid var(--line);
    border-radius: var(--radius-1);
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    transition: background 120ms, border-color 120ms, transform 80ms;
  }
  .btn:hover { background: var(--bg-4); border-color: #364257; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn.primary {
    background: linear-gradient(180deg, #8b5cf6, var(--accent));
    border-color: rgba(255,255,255,0.12);
    color: white;
  }
  .btn.primary:hover { background: linear-gradient(180deg, #a78bfa, #7c3aed); }
  .btn.danger { color: #fecaca; border-color: rgba(239,68,68,0.4); }
  .btn.danger:hover { background: rgba(239,68,68,0.1); }
  .btn.ghost { background: transparent; }
  .btn .ico { width: 14px; height: 14px; }

  .role-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 4px 4px 10px;
    font-size: 12px;
    color: var(--text-1);
  }
  .role-pill .swatch {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .role-pill select {
    background: var(--bg-2);
    color: var(--text-0);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 24px 3px 10px;
    font-size: 12px;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238993a8' d='M5 6 0 0h10z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--bg-3);
    color: var(--text-1);
    border: 1px solid var(--line);
  }
  .badge.good { background: var(--good-soft); color: #6ee7b7; border-color: rgba(16,185,129,0.3); }
  .badge.warn { background: var(--warn-soft); color: #fcd34d; border-color: rgba(245,158,11,0.3); }
  .badge.bad  { background: var(--bad-soft);  color: #fca5a5; border-color: rgba(239,68,68,0.3); }
  .badge.info { background: var(--info-soft); color: #7dd3fc; border-color: rgba(56,189,248,0.3); }

  .kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--bg-3);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 5px;
    color: var(--text-1);
  }

  /* =========================================================================
     Body grid
     ========================================================================= */
  .body {
    display: grid;
    grid-template-columns: 240px 1fr 320px;
    min-height: 0;
  }
  .panel {
    background: var(--bg-1);
    border-right: 1px solid var(--line);
    overflow: auto;
    min-width: 0;
  }
  .panel.right {
    border-right: none;
    border-left: 1px solid var(--line);
  }
  .panel header {
    position: sticky; top: 0;
    background: linear-gradient(180deg, var(--bg-1), rgba(17,20,28,0.95));
    border-bottom: 1px solid var(--line);
    padding: 12px 14px 10px;
    z-index: 2;
  }
  .panel header h3 {
    margin: 0; font-size: 12px; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--text-2); font-weight: 600;
  }
  .panel header .sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  /* Library items */
  .lib-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .lib-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-2);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-2);
    padding: 10px 12px;
    cursor: grab;
    user-select: none;
    transition: background 120ms, border-color 120ms, transform 80ms;
  }
  .lib-item:hover { background: var(--bg-3); border-color: var(--line); }
  .lib-item:active { cursor: grabbing; transform: scale(0.98); }
  .lib-item .ico {
    width: 30px; height: 30px;
    border-radius: 7px;
    display: grid; place-items: center;
    background: var(--bg-3);
    border: 1px solid var(--line);
    color: var(--accent-2);
    flex-shrink: 0;
  }
  .lib-item .body { min-width: 0; }
  .lib-item .body .t { font-size: 13px; color: var(--text-0); font-weight: 600; }
  .lib-item .body .d { font-size: 11px; color: var(--text-2); }
  .lib-item.locked { opacity: 0.45; cursor: not-allowed; }
  .lib-item.locked:hover { background: var(--bg-2); border-color: var(--line-soft); }
  .lib-item .lock {
    margin-left: auto;
    color: var(--text-3);
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px;
  }

  /* Inspector */
  .inspector { padding: 12px 14px 24px; }
  .insp-empty {
    color: var(--text-3);
    text-align: center;
    padding: 40px 10px;
    font-size: 12px;
  }
  .insp-section { margin-bottom: 18px; }
  .insp-section h4 {
    margin: 0 0 8px;
    font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-2); font-weight: 600;
  }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .field label { font-size: 11px; color: var(--text-2); }
  .field input, .field select, .field textarea {
    background: var(--bg-2);
    color: var(--text-0);
    border: 1px solid var(--line);
    border-radius: var(--radius-1);
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color 120ms, background 120ms;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); background: var(--bg-3);
  }
  .field textarea { min-height: 70px; resize: vertical; font-family: var(--mono); font-size: 12px; }
  .field .row { display: flex; gap: 6px; }
  .field .row > * { flex: 1; min-width: 0; }
  .perm-matrix {
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    gap: 6px 8px;
    align-items: center;
    font-size: 12px;
  }
  .perm-matrix .h { color: var(--text-3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .perm-matrix .nm { color: var(--text-1); }
  .perm-matrix .v { font-family: var(--mono); font-size: 11px; color: var(--text-1); text-align: center; min-width: 44px; }
  .perm-matrix .v.y { color: #6ee7b7; }
  .perm-matrix .v.n { color: #fca5a5; }

  /* Audit log */
  .audit { padding: 8px 12px 24px; }
  .audit-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: 12px;
  }
  .audit-item:last-child { border-bottom: none; }
  .audit-item .dot {
    margin-top: 6px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2);
    flex-shrink: 0;
  }
  .audit-item .dot.deny { background: var(--bad); }
  .audit-item .dot.allow { background: var(--good); }
  .audit-item .dot.info { background: var(--info); }
  .audit-item .when { color: var(--text-3); font-family: var(--mono); font-size: 10px; }
  .audit-item .what { color: var(--text-1); }
  .audit-item .who { color: var(--text-2); }
  .audit-item .what b { color: var(--text-0); }
  .audit-item .deny-reason { color: #fca5a5; font-size: 11px; margin-top: 2px; }

  /* =========================================================================
     Canvas
     ========================================================================= */
  .canvas-wrap {
    position: relative;
    min-width: 0;
    background:
      linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0/24px 24px,
      radial-gradient(circle at 50% 50%, var(--bg-1) 0%, var(--bg-0) 100%);
    overflow: hidden;
  }
  /* React Flow theme overrides */
  .react-flow__attribution { display: none !important; }
  .react-flow__controls {
    background: var(--bg-2) !important;
    border: 1px solid var(--line) !important;
    border-radius: var(--radius-2) !important;
    box-shadow: var(--shadow-1) !important;
    overflow: hidden;
  }
  .react-flow__controls-button {
    background: var(--bg-2) !important;
    border-bottom: 1px solid var(--line) !important;
    color: var(--text-1) !important;
    fill: var(--text-1) !important;
  }
  .react-flow__controls-button:hover { background: var(--bg-3) !important; }
  .react-flow__controls-button svg { fill: currentColor; }
  .react-flow__minimap {
    background: var(--bg-2) !important;
    border: 1px solid var(--line) !important;
    border-radius: var(--radius-2) !important;
  }
  .react-flow__edge-path { stroke: #5a647a; stroke-width: 1.6; }
  .react-flow__edge.selected .react-flow__edge-path { stroke: var(--accent-2); stroke-width: 2.4; }
  .react-flow__edge .react-flow__edge-text { fill: var(--text-1); font-size: 11px; }
  .react-flow__edge .react-flow__edge-textbg { fill: var(--bg-2); stroke: var(--line); }
  .react-flow__handle {
    background: var(--accent) !important;
    border: 2px solid var(--bg-1) !important;
    width: 10px !important; height: 10px !important;
  }
  .react-flow__handle:hover { background: var(--accent-2) !important; }
  .react-flow__background { background-color: transparent !important; }
  .react-flow__background > svg { pointer-events: none !important; }
  .react-flow__node { font-family: inherit; }
  .react-flow__node.selected .ff-node { box-shadow: 0 0 0 2px var(--accent-2), var(--shadow-2); }
  .react-flow__node:focus { outline: none; }
  .react-flow__edge .react-flow__edge-textwrapper { display: none; }
  .react-flow__connection-path { stroke: var(--accent-2); stroke-width: 2; stroke-dasharray: 4 3; }

  .canvas-overlay {
    position: absolute;
    pointer-events: none;
    inset: 0;
    z-index: 4;
  }
  .canvas-overlay .pill {
    position: absolute;
    pointer-events: auto;
    top: 12px; left: 12px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(17, 20, 28, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-1);
  }
  .canvas-overlay .legend {
    position: absolute;
    bottom: 12px; left: 12px;
    display: flex; gap: 10px;
    background: rgba(17, 20, 28, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: var(--radius-2);
    padding: 8px 10px;
    font-size: 11px; color: var(--text-2);
  }
  .canvas-overlay .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .canvas-overlay .legend .swatch { width: 10px; height: 10px; border-radius: 3px; }

  .toast {
    position: absolute;
    bottom: 16px; right: 16px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-2);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-0);
    box-shadow: var(--shadow-2);
    z-index: 50;
    max-width: 340px;
    animation: toast-in 200ms ease-out;
  }
  .toast.deny { border-left-color: var(--bad); }
  .toast.success { border-left-color: var(--good); }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* =========================================================================
     Node styles
     ========================================================================= */
  .ff-node {
    min-width: 180px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-2);
    box-shadow: var(--shadow-1);
    overflow: hidden;
    transition: box-shadow 120ms, border-color 120ms;
  }
  .ff-node.running { box-shadow: 0 0 0 2px var(--info), 0 0 14px rgba(56,189,248,0.4); border-color: rgba(56,189,248,0.4); }
  .ff-node.success { box-shadow: 0 0 0 2px var(--good), 0 0 12px rgba(16,185,129,0.4); border-color: rgba(16,185,129,0.4); }
  .ff-node.failed  { box-shadow: 0 0 0 2px var(--bad),  0 0 12px rgba(239,68,68,0.4);  border-color: rgba(239,68,68,0.4); }
  .ff-node.locked { opacity: 0.55; }
  .ff-node .head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line-soft);
  }
  .ff-node .head .ico {
    width: 22px; height: 22px;
    border-radius: 5px;
    display: grid; place-items: center;
    color: white;
    flex-shrink: 0;
  }
  .ff-node .head .title { font-size: 13px; font-weight: 600; color: var(--text-0); }
  .ff-node .head .sub { font-size: 11px; color: var(--text-2); margin-left: auto; }
  .ff-node .body { padding: 8px 10px; font-size: 12px; color: var(--text-1); }
  .ff-node .body .k { color: var(--text-3); }
  .ff-node .body .v { color: var(--text-0); font-family: var(--mono); font-size: 11px; }
  .ff-node .body .row { display: flex; justify-content: space-between; gap: 8px; }
  .ff-node .body .row + .row { margin-top: 3px; }
  .ff-node.locked-banner {
    border-left: 3px solid var(--bad);
  }
  .ff-node .lock-msg {
    margin-top: 6px;
    font-size: 11px;
    color: #fca5a5;
    background: var(--bad-soft);
    border-radius: 4px;
    padding: 3px 6px;
  }

  /* Node icon backgrounds by kind */
  .kind-trigger  { background: linear-gradient(135deg, #10b981, #047857); }
  .kind-http     { background: linear-gradient(135deg, #38bdf8, #0369a1); }
  .kind-email    { background: linear-gradient(135deg, #a78bfa, #6d28d9); }
  .kind-condition{ background: linear-gradient(135deg, #f59e0b, #b45309); }
  .kind-approval { background: linear-gradient(135deg, #ec4899, #9d174d); }
  .kind-delay    { background: linear-gradient(135deg, #6366f1, #3730a3); }
  .kind-end      { background: linear-gradient(135deg, #475569, #1e293b); }

  /* Responsive */
  @media (max-width: 1100px) {
    .body { grid-template-columns: 200px 1fr 280px; }
  }
  @media (max-width: 880px) {
    .body { grid-template-columns: 1fr; grid-template-rows: 140px 1fr 220px; }
    .panel { border-right: none; border-bottom: 1px solid var(--line); max-height: 220px; }
    .panel.right { border-bottom: none; border-left: none; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<script type="text/babel" data-presets="react" data-type="module">
"use strict";
const { useState, useEffect, useMemo, useCallback, useRef, useLayoutEffect } = React;
const RF = ReactFlow;
const ReactFlowRenderer = RF.ReactFlow;
const ReactFlowProvider = RF.ReactFlowProvider;
const useReactFlow = RF.useReactFlow;
const RFBackground = RF.Background;
const RFControls = RF.Controls;
const RFMiniMap = RF.MiniMap;
const Handle = RF.Handle;
const Position = RF.Position;
const useNodesState = RF.useNodesState;
const useEdgesState = RF.useEdgesState;
const addEdge = RF.addEdge;

// =========================================================================
// 0a. Workflow Templates — 4 種業務場景範本（每個自帶 RBAC 場景）
// =========================================================================
const TEMPLATES = {
  order: {
    id: "order",
    name: "訂單處理",
    swatch: "#7c3aed",
    desc: "新訂單 → 查會員 → VIP 簽核 → 寄信",
    nodes: [
      { id: "n1", type: "ff", position: { x: 40,  y: 200 }, data: { kind: "trigger",   label: "新訂單觸發",     config: { event: "order.created", cron: "* * * * *" } } },

// =========================================================================
// 1. RBAC engine
// =========================================================================
// RBAC 核心：誰 (rolesMap)、能做什麼 (permsMap)、對什麼 (ctx.nodeKind/field) 做什麼動作 (action)
// 這個函式是純函式；它接受當下的角色與權限表，因此能同時支援內建角色與自訂角色
function can(rolesMap, permsMap, role, action, ctx = {}) {
  const p = permsMap[role] || {};
  // 1. baseline role gate
  if (!(action in p) || !p[action]) {
    return { allowed: false, reason: `角色「${rolesMap[role]?.name || role}」沒有「${action}」權限` };
  }
  // 2. node-kind specific gates
  if (action === "approve") {
    if (ctx.nodeKind !== "approval") {
      return { allowed: false, reason: "只有 Approval 節點需要簽核" };
    }
  }
  if (action === "configure" && ctx.nodeKind === "end") {
    // End node has no inputs to configure beyond label
    if (ctx.field && ctx.field !== "label") {
      return { allowed: false, reason: "End 節點不可設定執行細節" };
    }
  }
  if (action === "delete" && ctx.nodeKind === "trigger" && ctx.isOnlyTrigger) {
    return { allowed: false, reason: "流程至少要保留一個 Trigger 起點" };
  }
  return { allowed: true };
}

// =========================================================================
// 2. Audit log (in-memory)
// =========================================================================
function useAudit() {
  const [log, setLog] = useState([]);
  const record = useCallback((entry) => {
    setLog((prev) => [
      { ...entry, id: Math.random().toString(36).slice(2, 9), ts: new Date() },
      ...prev,
    ].slice(0, 200));
  }, []);
  const clear = useCallback(() => setLog([]), []);
  return { log, record, clear };
}

function FFNode({ data, selected }) {
  const kind = data.kind;
  const meta = NODE_KINDS[kind] || NODE_KINDS.trigger;
  const status = data.status; // 'idle' | 'running' | 'success' | 'failed'
  const locked = data.locked;
  return (
    <div className={`ff-node ${meta.color} ${status || ""} ${selected ? "selected" : ""} ${locked ? "locked" : ""} ${locked ? "locked-banner" : ""}`}>
      <Handle type="target" position={Position.Left} />
      <div className="head">
        <div className={`ico ${meta.color}`}><span style={{ fontSize: 11, fontWeight: 700 }}>{meta.icon}</span></div>
        <div className="title">{data.label || meta.label}</div>
        <div className="sub">
          {status === "running" && <span className="badge info">執行中</span>}
          {status === "success" && <span className="badge good">✓ 成功</span>}
          {status === "failed"  && <span className="badge bad">✗ 失敗</span>}
          {!status && <span className="badge">待命中</span>}
        </div>
      </div>
      <div className="body">
        {kind === "trigger" && (
          <>
            <div className="row"><span className="k">事件</span><span className="v">{data.config?.event || "manual"}</span></div>
            <div className="row"><span className="k">排程</span><span className="v">{data.config?.cron || "—"}</span></div>
          </>
        )}
        {kind === "http" && (
          <>
            <div className="row"><span className="k">方法</span><span className="v">{data.config?.method || "GET"}</span></div>
            <div className="row"><span className="k">URL</span><span className="v" style={{ maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{data.config?.url || "—"}</span></div>
          </>
        )}
        {kind === "email" && (
          <>
            <div className="row"><span className="k">收件人</span><span className="v" style={{ maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{data.config?.to || "—"}</span></div>
            <div className="row"><span className="k">主旨</span><span className="v" style={{ maxWidth: 140, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{data.config?.subject || "—"}</span></div>
          </>
        )}
        {kind === "condition" && (
          <div className="row"><span className="k">條件</span><span className="v" style={{ maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{data.config?.expr || "—"}</span></div>
        )}
        {kind === "approval" && (
          <>
            <div className="row"><span className="k">簽核者</span><span className="v">{data.config?.approver || "Approver"}</span></div>
            <div className="row"><span className="k">逾時</span><span className="v">{data.config?.timeout || "24h"}</span></div>
          </>
        )}
        {kind === "delay" && (
          <div className="row"><span className="k">延遲</span><span className="v">{data.config?.seconds || 0}s</span></div>
        )}
        {kind === "end" && (
          <div className="row"><span className="k">狀態</span><span className="v">{data.config?.status || "completed"}</span></div>
        )}
        {locked && <div className="lock-msg">🔒 當前角色無權編輯</div>}
      </div>
      <Handle type="source" position={Position.Right} />
    </div>
  );
}

          continue;
        }
      }
      if (typeof v === "string") {
        if (rule.minLength && v.length < rule.minLength) {
          errs[f.name] = `至少 ${rule.minLength} 字`;
          continue;
        }
        if (rule.maxLength && v.length > rule.maxLength) {
          errs[f.name] = `最多 ${rule.maxLength} 字`;
          continue;
        }
        if (rule.pattern && !new RegExp(rule.pattern).test(v)) {
          errs[f.name] = `格式不符（${rule.pattern}）`;
          continue;
        }
      }
    }
    return errs;
  }, []);

  const handleAddCustomRole = useCallback(() => {
    const errs = validateCustomForm(customFormData, CUSTOM_ROLE_SCHEMA);
    if (Object.keys(errs).length) {
      setCustomFormErrors(errs);
      showToast("表單有誤，請看紅字標示", "deny");
      return;
    }
    if (mergedRoles[customFormData.key]) {
      setCustomFormErrors({ key: "已存在同 ID 的角色" });
      showToast("角色 ID 已存在", "deny");
      return;
    }
    const { key, name, color, desc, level, ...boolPerms } = customFormData;
    const perms = {};
    for (const k of Object.keys(boolPerms)) perms[k] = !!boolPerms[k];
    setCustomRoles((m) => ({ ...m, [key]: { name, swatch: color, desc: desc || "(無描述)", level, perms } }));
    setCustomFormErrors({});
    showToast(`已新增角色「${name}」`, "success");
    audit(`新增自訂角色 ${name} (${key})`, mergedRoles[role]?.name || "system", "allow");
    setCustomFormData((d) => ({ ...d, name: "", desc: "" }));
  }, [customFormData, mergedRoles, mergedPerms, role, audit, showToast, validateCustomForm]);

  const handleRemoveCustomRole = useCallback((key) => {
    setCustomRoles((m) => {
      const c = { ...m };
      delete c[key];
      return c;
    });
    if (role === key) setRole("admin");
    audit(`移除自訂角色 ${key}`, mergedRoles[role]?.name || "system", "info");
  }, [role, audit, mergedRoles]);

  const updateCustomFormField = useCallback((name, value) => {
    setCustomFormData((d) => ({ ...d, [name]: value }));
    setCustomFormErrors((e) => {
      if (!(name in e)) return e;
      const c = { ...e };
      delete c[name];
      return c;
    });
  }, []);

  // ---- Re-apply lock flag on all nodes when role changes ----
  useEffect(() => {
    setNodes((nds) => nds.map((n) => {
      const editGate = can(mergedRoles, mergedPerms, role, "edit", { nodeKind: n.data.kind });
      const dragGate = can(mergedRoles, mergedPerms, role, "drag");
      return { ...n, draggable: dragGate.allowed, data: { ...n.data, locked: !editGate.allowed } };
    }));
    audit(`切換角色為 ${mergedRoles[role].name}`, mergedRoles[role].name, "info");
  }, [role]);

  // ---- Handlers ----
  const onConnect = useCallback((params) => {
    const g = can(mergedRoles, mergedPerms, role, "connect");
    if (!g.allowed) {
      showToast(`連線被拒：${g.reason}`, "deny");
      audit("嘗試建立連線", mergedRoles[role].name, "deny", g.reason);
      return;
    }
    setEdges((eds) => addEdge({ ...params, animated: false, type: "smoothstep" }, eds));
    audit("建立連線", mergedRoles[role].name, "allow");
  }, [role]);

  const handleAddNode = useCallback((kind, position) => {
    const g = can(mergedRoles, mergedPerms, role, "create");
    if (!g.allowed) {
      showToast(`建立被拒：${g.reason}`, "deny");
      audit(`嘗試建立 ${NODE_KINDS[kind].label} 節點`, mergedRoles[role].name, "deny", g.reason);
      return;
    }
    const id = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
    const pos = position || screenToFlowPosition({ x: 320, y: 200 });
    const newNode = {
      id, type: "ff", position: pos,
      data: {
        kind,
        label: NODE_KINDS[kind].label + " #" + (nodes.length + 1),
        config: defaultConfigFor(kind),
      },
    };
    setNodes((nds) => nds.concat(newNode));
    setSelectedNodeId(id);
    audit(`建立 ${NODE_KINDS[kind].label} 節點`, mergedRoles[role].name, "allow");
  }, [role, nodes, screenToFlowPosition]);

  const handleDeleteNode = useCallback((id) => {
    const target = nodes.find((n) => n.id === id);
    if (!target) return;
    const triggers = nodes.filter((n) => n.data.kind === "trigger");
    const g = can(mergedRoles, mergedPerms, role, "delete", { nodeKind: target.data.kind, isOnlyTrigger: triggers.length === 1 && target.data.kind === "trigger" });
    if (!g.allowed) {
      showToast(`刪除被拒：${g.reason}`, "deny");
      audit(`嘗試刪除節點 ${target.data.label}`, mergedRoles[role].name, "deny", g.reason);
      return;
    }
    setNodes((nds) => nds.filter((n) => n.id !== id));
    setEdges((eds) => eds.filter((e) => e.source !== id && e.target !== id));
    if (selectedNodeId === id) setSelectedNodeId(null);
    audit(`刪除節點 ${target.data.label}`, mergedRoles[role].name, "allow");
  }, [role, nodes, selectedNodeId]);

  const handleUpdateNode = useCallback((id, patch) => {
    const target = nodes.find((n) => n.id === id);
    if (!target) return;
    // configure gate per field
    if (patch && patch.config) {
      for (const field of Object.keys(patch.config)) {
        const g = can(mergedRoles, mergedPerms, role, "configure", { nodeKind: target.data.kind, field });
        if (!g.allowed) {
          showToast(`設定被拒：${g.reason}`, "deny");
          audit(`嘗試修改 ${target.data.label}.${field}`, mergedRoles[role].name, "deny", g.reason);
          return;
        }
      }
    }
    setNodes((nds) => nds.map((n) => n.id === id ? { ...n, data: { ...n.data, ...patch, config: { ...(n.data.config||{}), ...(patch.config||{}) } } } : n));
    audit(`更新節點 ${target.data.label}`, mergedRoles[role].name, "allow");
  }, [role, nodes]);

  const handleApprove = useCallback((id, approved) => {
    const target = nodes.find((n) => n.id === id);
    if (!target) return;
    const g = can(mergedRoles, mergedPerms, role, "approve", { nodeKind: target.data.kind });
    if (!g.allowed) {
      showToast(`簽核被拒：${g.reason}`, "deny");
      audit(`嘗試簽核 ${target.data.label}`, mergedRoles[role].name, "deny", g.reason);
      return;
    }
    setApprovalOverride((m) => ({ ...m, [id]: approved }));
    setNodes((nds) => nds.map((n) => n.id === id ? { ...n, data: { ...n.data, status: approved ? "success" : "failed" } } : n));
    audit(approved ? `簽核通過 ${target.data.label}` : `簽核拒絕 ${target.data.label}`, mergedRoles[role].name, approved ? "allow" : "deny");
  }, [role, nodes]);

  // ---- Persistence ----
  useEffect(() => {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.nodes && parsed.edges) {
          setNodes(parsed.nodes);
          setEdges(parsed.edges);
          audit("從 localStorage 載入流程", "system", "info");
        }
      }
    } catch (e) { /* ignore */ }
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ nodes, edges }));
    } catch (e) { /* ignore */ }
  }, [nodes, edges]);

  // ---- Run simulation ----
  const runWorkflow = useCallback(async () => {
    const g = can(mergedRoles, mergedPerms, role, "run");
    if (!g.allowed) {
      showToast(`執行被拒：${g.reason}`, "deny");
      audit("嘗試執行流程", mergedRoles[role].name, "deny", g.reason);
      return;
    }
    if (isRunning) return;
    setIsRunning(true);
    audit("開始執行流程", mergedRoles[role].name, "allow");

    // topological-ish walk: from triggers outward
    const outEdges = new Map();
    edges.forEach((e) => {
      if (!outEdges.has(e.source)) outEdges.set(e.source, []);
      outEdges.get(e.source).push(e.target);
    });
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const queue = nodes.filter((n) => n.data.kind === "trigger").map((n) => n.id);
    const visited = new Set();

    // reset
    setNodes((nds) => nds.map((n) => ({ ...n, data: { ...n.data, status: undefined } })));

    const stepDelay = 550;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    while (queue.length) {
      const id = queue.shift();
      if (visited.has(id)) continue;
      visited.add(id);
      const node = byId.get(id);
      if (!node) continue;
      // mark running
      setNodes((nds) => nds.map((n) => n.id === id ? { ...n, data: { ...n.data, status: "running" } } : n));
      await wait(stepDelay);
      // decide outcome
      let outcome = "success";
      if (node.data.kind === "approval") {
        // wait for approver (simulated): not approved unless override says so
        outcome = approvalOverride[id] === true ? "success" : "failed";
      } else if (node.data.kind === "end") {
        outcome = "success";
      }
      setNodes((nds) => nds.map((n) => n.id === id ? { ...n, data: { ...n.data, status: outcome } } : n));
      // enqueue children
      (outEdges.get(id) || []).forEach((t) => queue.push(t));
      await wait(180);
    }
    setIsRunning(false);
    audit("流程執行完畢", mergedRoles[role].name, "info");
    showToast("執行完成", "success");
  }, [role, isRunning, nodes, edges, approvalOverride]);

  const stopRun = useCallback(() => {
    setIsRunning(false);
    setNodes((nds) => nds.map((n) => ({ ...n, data: { ...n.data, status: undefined } })));
    audit("中斷執行", mergedRoles[role].name, "info");
  }, [role]);

  const resetWorkflow = useCallback(() => {
    const tpl = TEMPLATES[currentTemplateId];
    setNodes(tpl.nodes.map((n) => ({ ...n, data: { ...n.data, status: undefined } })));
    setEdges(tpl.edges);
    setSelectedNodeId(null);
    audit("重置為目前範本", mergedRoles[role]?.name || "system", "info");
    setTimeout(() => fitView({ padding: 0.2, duration: 400 }), 50);
  }, [role, currentTemplateId, mergedRoles, audit, fitView, setNodes, setEdges]);

  const exportJSON = useCallback(() => {
    const g = can(mergedRoles, mergedPerms, role, "export");
    if (!g.allowed) {
      showToast(`匯出被拒：${g.reason}`, "deny");
      return;
    }
    const data = { nodes, edges, exportedAt: new Date().toISOString(), role };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "flowforge-workflow.json";
    a.click();
    URL.revokeObjectURL(url);
    audit("匯出流程 JSON", mergedRoles[role].name, "allow");
  }, [role, nodes, edges]);

  const importJSON = useCallback((file) => {
    const g = can(mergedRoles, mergedPerms, role, "import");
    if (!g.allowed) {
      showToast(`匯入被拒：${g.reason}`, "deny");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result || ""));
        if (Array.isArray(parsed.nodes) && Array.isArray(parsed.edges)) {
          setNodes(parsed.nodes);
          setEdges(parsed.edges);
          setSelectedNodeId(null);
          audit("匯入流程 JSON", mergedRoles[role].name, "allow");
          showToast("匯入成功", "success");
          setTimeout(() => fitView({ padding: 0.2, duration: 400 }), 50);
        }
      } catch (e) { showToast("匯入失敗：" + e.message, "deny"); }
    };
    reader.readAsText(file);
  }, [role]);

  // ---- DnD from library to canvas ----
  const onDragStart = (e, kind) => {
    const g = can(mergedRoles, mergedPerms, role, "create");
    if (!g.allowed) {
      e.preventDefault();
      showToast(`建立被拒：${g.reason}`, "deny");
      return;
    }
    e.dataTransfer.setData("application/flowforge-kind", kind);
    e.dataTransfer.effectAllowed = "move";
  };
  const onDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; };
  const onDrop = (e) => {
    e.preventDefault();
    const kind = e.dataTransfer.getData("application/flowforge-kind");
    if (!kind || !NODE_KINDS[kind]) return;
    const pos = screenToFlowPosition({ x: e.clientX, y: e.clientY });
    handleAddNode(kind, pos);
  };

  // ---- Keyboard shortcuts ----
  useEffect(() => {
    const onKey = (e) => {
      if ((e.key === "Delete" || e.key === "Backspace") && selectedNodeId && document.activeElement && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "SELECT") {
        e.preventDefault();
        handleDeleteNode(selectedNodeId);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [selectedNodeId, handleDeleteNode]);

  // ---- Derived: selected node object ----
  const selectedNode = useMemo(() => nodes.find((n) => n.id === selectedNodeId) || null, [nodes, selectedNodeId]);
  const createPerm = can(mergedRoles, mergedPerms, role, "create");
  const runPerm = can(mergedRoles, mergedPerms, role, "run");
  const exportPerm = can(mergedRoles, mergedPerms, role, "export");

  return (
    <div className="app">
      {/* === Topbar === */}
      <header className="topbar">
        <div className="brand">
          <div className="logo">R</div>
          <div className="name">RBAC Flow Studio</div>
          <div className="tag">React Flow + RBAC</div>
        </div>
        <div className="group">
          <span className="badge" title="目前使用的範本">📐 {currentTemplate.name}</span>
          <select
            value={currentTemplateId}
            onChange={(e) => switchTemplate(e.target.value)}
            className="role-pill-select"
            style={{ background: "var(--bg-3)", color: "var(--text-0)", border: "1px solid var(--line)", borderRadius: 6, padding: "5px 8px", fontSize: 12 }}
          >
            {Object.entries(TEMPLATES).map(([k, v]) => (
              <option key={k} value={k}>{v.name} — {v.desc}</option>
            ))}
          </select>
        </div>
        <div className="spacer" />
        <div className="group">
          <span className="badge info" title="節點總數">📦 {nodes.length} nodes</span>
          <span className="badge" title="連線總數">🔗 {edges.length} edges</span>
        </div>
        <div className="group">
          {!isRunning ? (
            <button className="btn primary" disabled={!runPerm.allowed} onClick={runWorkflow} title={runPerm.allowed ? "執行流程" : runPerm.reason}>
              ▶ 執行
            </button>
          ) : (
            <button className="btn danger" onClick={stopRun}>■ 停止</button>
          )}
          <button className="btn" onClick={resetWorkflow} title="重置為預設範例">↺ 重置</button>
          <button className="btn" onClick={exportJSON} disabled={!exportPerm.allowed} title={exportPerm.allowed ? "匯出 JSON" : exportPerm.reason}>⬇ 匯出</button>
          <label className={`btn ${can(mergedRoles, mergedPerms, role, "import").allowed ? "" : "disabled"}`} style={{ opacity: can(mergedRoles, mergedPerms, role, "import").allowed ? 1 : 0.45, cursor: can(mergedRoles, mergedPerms, role, "import").allowed ? "pointer" : "not-allowed" }} title={can(mergedRoles, mergedPerms, role, "import").allowed ? "匯入 JSON" : can(mergedRoles, mergedPerms, role, "import").reason}>
            ⬆ 匯入
            <input type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => e.target.files && e.target.files[0] && importJSON(e.target.files[0])} />
          </label>
        </div>
        <div className="group">
          <div className="role-pill" title={mergedRoles[role]?.desc || ""}>
            <span className="swatch" style={{ background: mergedRoles[role]?.swatch || "#666" }} />
            <span>角色</span>
            <select value={role} onChange={(e) => setRole(e.target.value)}>
              {mergedRoleKeys.map((k) => (
                <option key={k} value={k}>{mergedRoles[k].name}{customRoles[k] ? " (自訂)" : ""}</option>
              ))}
            </select>
          </div>
        </div>
      </header>

      {/* === Body === */}
      <div className="body">
        {/* Library */}
        <aside className="panel">
          <header>
            <h3>節點庫</h3>
            <div className="sub">拖曳到畫布 · 或雙擊加入</div>
          </header>
          <div className="lib-list">
            {Object.entries(NODE_KINDS).map(([kind, meta]) => {
              const locked = !createPerm.allowed;
              return (
                <div
                  key={kind}
                  className={`lib-item ${locked ? "locked" : ""}`}
                  draggable={!locked}
                  onDragStart={(e) => onDragStart(e, kind)}
                  onDoubleClick={() => !locked && handleAddNode(kind)}
                  title={locked ? createPerm.reason : `${meta.label} — ${meta.desc}`}
                >
                  <div className={`ico ${meta.color}`}><span style={{ fontSize: 12, fontWeight: 700 }}>{meta.icon}</span></div>
                  <div className="body">
                    <div className="t">{meta.label}</div>
                    <div className="d">{meta.desc}</div>
                  </div>
                  {locked && <span className="lock">🔒</span>}
                </div>
              );
            })}
          </div>
        </aside>

        {/* Canvas */}
        <main className="canvas-wrap" ref={wrapRef} onDragOver={onDragOver} onDrop={onDrop}>
          <ReactFlowRenderer
            nodes={nodes}
            edges={edges}
            onNodesChange={onNodesChange}
            onEdgesChange={onEdgesChange}
            onConnect={onConnect}
            onNodeClick={(_, n) => setSelectedNodeId(n.id)}
            onPaneClick={() => setSelectedNodeId(null)}
            nodeTypes={nodeTypes}
            fitView
            fitViewOptions={{ padding: 0.2 }}
            defaultEdgeOptions={{ type: "smoothstep", style: { stroke: "#5a647a", strokeWidth: 1.6 } }}
            proOptions={{ hideAttribution: true }}
            deleteKeyCode={null}
            connectionLineType={"smoothstep"}
            nodesConnectable={can(mergedRoles, mergedPerms, role, "connect").allowed}
            nodesDraggable={can(mergedRoles, mergedPerms, role, "drag").allowed}
          >
            <RFBackground gap={24} color="#1f2638" />
            <RFControls position="bottom-right" />
            <RFMiniMap
              position="top-right"
              nodeColor={(n) => {
                const k = n.data?.kind;
                if (k === "trigger") return "#10b981";
                if (k === "http") return "#38bdf8";
                if (k === "email") return "#a78bfa";
                if (k === "condition") return "#f59e0b";
                if (k === "approval") return "#ec4899";
                if (k === "delay") return "#6366f1";
                if (k === "end") return "#475569";
                return "#7c3aed";
              }}
              maskColor="rgba(11,13,18,0.7)"
              pannable
              zoomable
            />
          </ReactFlowRenderer>

          <div className="canvas-overlay">
            <div className="pill">
              <span className="badge info">i</span>
              <span>目前角色 <b style={{ color: mergedRoles[role].swatch }}>{mergedRoles[role].name}</b> — {mergedRoles[role].desc}</span>
            </div>
            <div className="legend">
              <span><span className="swatch" style={{ background: "#7c3aed" }} /> Trigger</span>
              <span><span className="swatch" style={{ background: "#38bdf8" }} /> HTTP</span>
              <span><span className="swatch" style={{ background: "#a78bfa" }} /> Email</span>
              <span><span className="swatch" style={{ background: "#f59e0b" }} /> Cond</span>
              <span><span className="swatch" style={{ background: "#ec4899" }} /> Approve</span>
              <span><span className="swatch" style={{ background: "#6366f1" }} /> Delay</span>
              <span><span className="swatch" style={{ background: "#475569" }} /> End</span>
            </div>
            {toast && (
              <div className={`toast ${toast.kind}`}>
                {toast.message}
              </div>
            )}
          </div>
        </main>

        {/* Right panel — tabs */}
        <aside className="panel right">
          <header>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 4, marginBottom: 6 }}>
              <button className={`btn ${rightTab === "inspector" ? "primary" : ""}`} onClick={() => setRightTab("inspector")} style={{ justifyContent: "center", fontSize: 11 }}>🔍 檢視</button>
              <button className={`btn ${rightTab === "audit" ? "primary" : ""}`} onClick={() => setRightTab("audit")} style={{ justifyContent: "center", fontSize: 11 }}>📜 稽核 ({log.length})</button>
              <button className={`btn ${rightTab === "rbac" ? "primary" : ""}`} onClick={() => setRightTab("rbac")} style={{ justifyContent: "center", fontSize: 11 }}>🛡 RBAC 矩陣</button>
              <button className={`btn ${rightTab === "custom" ? "primary" : ""}`} onClick={() => setRightTab("custom")} style={{ justifyContent: "center", fontSize: 11 }}>➕ 自訂角色</button>
            </div>
          </header>

          {rightTab === "inspector" && (
            <div className="inspector">
              {!selectedNode && (
                <div className="insp-empty">
                  點選任一節點以檢視或編輯其內容。<br/>
                  <span className="kbd">Del</span> 刪除選中節點
                </div>
              )}
              {selectedNode && (
                <Inspector
                  node={selectedNode}
                  role={role}
                  rolesMap={mergedRoles}
                  permsMap={mergedPerms}
                  onUpdate={handleUpdateNode}
                  onDelete={handleDeleteNode}
                  onApprove={handleApprove}
                  approvalOverride={approvalOverride[selectedNode.id]}
                />
              )}
            </div>
          )}

          {rightTab === "audit" && (
            <div className="audit">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 12, color: "var(--text-2)" }}>最近 200 筆操作</div>
                <button className="btn ghost" style={{ fontSize: 11, padding: "3px 8px" }} onClick={clear}>清空</button>
              </div>
              {log.length === 0 && <div className="insp-empty">尚無操作記錄</div>}
              {log.map((e) => (
                <div key={e.id} className="audit-item">
                  <div className={`dot ${e.kind}`} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="when">{e.ts.toLocaleTimeString("zh-Hant", { hour12: false })}</div>
                    <div className="what"><b>{e.who}</b> · {e.what}</div>
                    {e.denyReason && <div className="deny-reason">⛔ {e.denyReason}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {rightTab === "rbac" && (
            <div className="inspector">
              <div className="insp-section">
                <h4>角色列表（點擊切換）</h4>
                {mergedRoleKeys.map((k) => (
                  <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, background: role === k ? "var(--accent-soft)" : "var(--bg-2)", border: "1px solid " + (role === k ? "var(--accent)" : "var(--line-soft)"), marginBottom: 6, cursor: "pointer" }} onClick={() => setRole(k)}>
                    <span className="swatch" style={{ width: 10, height: 10, borderRadius: 5, background: mergedRoles[k].swatch, display: "inline-block" }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
                        {mergedRoles[k].name}
                        {customRoles[k] && <span className="badge info" style={{ fontSize: 9 }}>自訂</span>}
                        <span className="badge" style={{ fontSize: 9, opacity: 0.7 }}>{mergedRoles[k].level || "standard"}</span>
                      </div>
                      <div style={{ fontSize: 11, color: "var(--text-2)" }}>{mergedRoles[k].desc}</div>
                    </div>
                    {role === k && <span className="badge info">使用中</span>}
                    {customRoles[k] && (
                      <button className="btn danger" style={{ fontSize: 10, padding: "2px 6px" }} onClick={(e) => { e.stopPropagation(); handleRemoveCustomRole(k); }}>✕</button>
                    )}
                  </div>
                ))}
              </div>
              <div className="insp-section">
                <h4>角色 × 動作 權限矩陣</h4>
                <div style={{ overflowX: "auto", maxWidth: "100%" }}>
                  <div className="perm-matrix" style={{ gridTemplateColumns: `120px repeat(${mergedRoleKeys.length}, 1fr)` }}>
                    <div></div>
                    {mergedRoleKeys.map((k) => (
                      <div key={k} className="h" style={{ textAlign: "center", color: mergedRoles[k].swatch }}>
                        {mergedRoles[k].name}
                      </div>
                    ))}
                    {["create","edit","delete","run","approve","drag","connect","configure","export","import"].map((act) => (
                      <React.Fragment key={act}>
                        <div className="nm">{act}</div>
                        {mergedRoleKeys.map((rk) => {
                          const v = mergedPerms[rk] && mergedPerms[rk][act];
                          return <div key={rk} className={`v ${v ? "y" : "n"}`}>{v ? "✓" : "✕"}</div>;
                        })}
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              </div>
              <div className="insp-section">
                <h4>節點類型 × 動作 細粒度權限</h4>
                <p style={{ fontSize: 11, color: "var(--text-3)", margin: "0 0 6px" }}>
                  以下表以角色 <b style={{ color: mergedRoles[role]?.swatch }}>{mergedRoles[role]?.name}</b> 為視角，列出對每種節點類型的可執行動作。
                </p>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", fontSize: 11, borderCollapse: "collapse" }}>
                    <thead>
                      <tr style={{ color: "var(--text-3)", textAlign: "left" }}>
                        <th style={{ padding: "4px 6px", borderBottom: "1px solid var(--line-soft)" }}>節點類型</th>
                        {["create","edit","delete","configure","approve"].map((a) => (
                          <th key={a} style={{ padding: "4px 6px", borderBottom: "1px solid var(--line-soft)", textAlign: "center" }}>{a}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {Object.entries(NODE_KINDS).map(([k, meta]) => (
                        <tr key={k}>
                          <td style={{ padding: "4px 6px", borderBottom: "1px dashed var(--line-soft)", color: "var(--text-1)" }}>
                            <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, marginRight: 6, background: meta.color.includes("trigger") ? "#10b981" : meta.color.includes("http") ? "#38bdf8" : meta.color.includes("email") ? "#a78bfa" : meta.color.includes("condition") ? "#f59e0b" : meta.color.includes("approval") ? "#ec4899" : meta.color.includes("delay") ? "#6366f1" : "#475569" }} />
                            {meta.label}
                          </td>
                          {["create","edit","delete","configure","approve"].map((act) => {
                            const g = can(mergedRoles, mergedPerms, role, act, { nodeKind: k });
                            return (
                              <td key={act} style={{ padding: "4px 6px", borderBottom: "1px dashed var(--line-soft)", textAlign: "center", color: g.allowed ? "#6ee7b7" : "#fca5a5", fontFamily: "var(--mono)" }}>
                                {g.allowed ? "✓" : "✕"}
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              <div className="insp-section">
                <h4>規則約束（節點類型層級）</h4>
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, color: "var(--text-1)", lineHeight: 1.7 }}>
                  <li>Viewer / Auditor 完全唯讀；按鈕、拖曳、連線全部鎖定</li>
                  <li>Editor / Operator 不可刪除節點（防止誤刪結構）</li>
                  <li>Approver / Operator 僅能對 <code>approval</code> 節點執行簽核</li>
                  <li>Admin 擁有所有權限</li>
                  <li>流程必須保留至少一個 <code>trigger</code> 起點</li>
                  <li><code>end</code> 節點不開放執行細節設定</li>
                  <li>自訂角色可由「➕ 自訂角色」分頁透過 JSON Schema 表單建立</li>
                </ul>
              </div>
            </div>
          )}

          {rightTab === "custom" && (
            <div className="inspector">
              <div className="insp-section">
                <h4>{CUSTOM_ROLE_SCHEMA.title}</h4>
                <p style={{ fontSize: 11, color: "var(--text-3)", margin: "0 0 8px" }}>{CUSTOM_ROLE_SCHEMA.description}</p>
                <form onSubmit={(e) => { e.preventDefault(); handleAddCustomRole(); }}>
                  {CUSTOM_ROLE_SCHEMA.fields.map((f) => (
                    <div className="field" key={f.name}>
                      <label>
                        {f.label}
                        {f.validation?.required && <span style={{ color: "#fca5a5" }}> *</span>}
                      </label>
                      {f.type === "boolean" && (
                        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--text-1)" }}>
                          <input
                            type="checkbox"
                            checked={!!customFormData[f.name]}
                            onChange={(e) => updateCustomFormField(f.name, e.target.checked)}
                          />
                          <span>{customFormData[f.name] ? "允許" : "禁止"}</span>
                        </label>
                      )}
                      {f.type === "text" && (
                        <input
                          type="text"
                          value={customFormData[f.name] || ""}
                          onChange={(e) => updateCustomFormField(f.name, e.target.value)}
                          placeholder={f.placeholder || ""}
                          style={customFormErrors[f.name] ? { borderColor: "#ef4444" } : null}
                        />
                      )}
                      {f.type === "textarea" && (
                        <textarea
                          value={customFormData[f.name] || ""}
                          onChange={(e) => updateCustomFormField(f.name, e.target.value)}
                          placeholder={f.placeholder || ""}
                          style={customFormErrors[f.name] ? { borderColor: "#ef4444" } : null}
                        />
                      )}
                      {f.type === "color" && (
                        <input
                          type="color"
                          value={customFormData[f.name] || "#7c3aed"}
                          onChange={(e) => updateCustomFormField(f.name, e.target.value)}
                          style={{ height: 36, padding: 2 }}
                        />
                      )}
                      {f.type === "select" && (
                        <select
                          value={customFormData[f.name] || ""}
                          onChange={(e) => updateCustomFormField(f.name, e.target.value)}
                        >
                          {f.options.map((o) => (
                            <option key={o.value} value={o.value}>{o.label}</option>
                          ))}
                        </select>
                      )}
                      {customFormErrors[f.name] && (
                        <div style={{ fontSize: 11, color: "#fca5a5", marginTop: 2 }}>{customFormErrors[f.name]}</div>
                      )}
                    </div>
                  ))}
                  <button type="submit" className="btn primary" style={{ width: "100%", justifyContent: "center", marginTop: 8 }}>
                    ➕ 新增自訂角色
                  </button>
                </form>
              </div>
              <div className="insp-section">
                <h4>已建立的自訂角色（{Object.keys(customRoles).length}）</h4>
                {Object.keys(customRoles).length === 0 && (
                  <div className="insp-empty" style={{ padding: 12 }}>尚未建立任何自訂角色</div>
                )}
                {Object.entries(customRoles).map(([k, v]) => (
                  <div key={k} style={{ padding: "6px 8px", borderRadius: 6, background: "var(--bg-2)", border: "1px solid var(--line-soft)", marginBottom: 6 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ width: 10, height: 10, borderRadius: 5, background: v.swatch, display: "inline-block" }} />
                      <b style={{ fontSize: 12 }}>{v.name}</b>
                      <span className="badge" style={{ fontSize: 9 }}>{v.level}</span>
                      <span style={{ marginLeft: "auto", fontSize: 10, color: "var(--text-3)", fontFamily: "var(--mono)" }}>{k}</span>
                      <button className="btn danger" style={{ fontSize: 10, padding: "2px 6px" }} onClick={() => handleRemoveCustomRole(k)}>移除</button>
                    </div>
                    <div style={{ fontSize: 11, color: "var(--text-2)", marginTop: 4 }}>{v.desc}</div>
                    <div style={{ marginTop: 4, display: "flex", flexWrap: "wrap", gap: 3 }}>
                      {Object.entries(v.perms).filter(([, vv]) => vv).map(([pk]) => (
                        <span key={pk} className="badge good" style={{ fontSize: 9 }}>{pk}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </aside>
      </div>
    </div>
  );
}

// =========================================================================
// 6. Inspector (per-node config + approval action)
// =========================================================================
function Inspector({ node, role, rolesMap, permsMap, onUpdate, onDelete, onApprove, approvalOverride }) {
  const kind = node.data.kind;
  const meta = NODE_KINDS[kind];
  const cfg = node.data.config || {};
  const configureG = can(rolesMap, permsMap, role, "configure", { nodeKind: kind, field: "label" });
  const deleteG = can(rolesMap, permsMap, role, "delete", { nodeKind: kind });
  const approveG = can(rolesMap, permsMap, role, "approve", { nodeKind: kind });
  const roleName = rolesMap[role]?.name || role;

  const upd = (patch) => onUpdate(node.id, patch);

  return (
    <>
      <div className="insp-section">
        <h4>節點資訊</h4>
        <div className="field">
          <label>標籤</label>
          <input
            type="text"
            value={node.data.label || ""}
            onChange={(e) => upd({ label: e.target.value })}
            disabled={!configureG.allowed}
            placeholder={meta.label}
          />
        </div>
        <div className="field">
          <label>類型</label>
          <input type="text" value={meta.label} readOnly />
        </div>
        <div className="field">
          <label>ID</label>
          <input type="text" value={node.id} readOnly style={{ fontFamily: "var(--mono)", fontSize: 11 }} />
        </div>
      </div>

      <div className="insp-section">
        <h4>設定</h4>
        {kind === "trigger" && (
          <>
            <div className="field">
              <label>事件名稱</label>
              <input type="text" value={cfg.event || ""} onChange={(e) => upd({ config: { event: e.target.value } })} disabled={!configureG.allowed} placeholder="order.created" />
            </div>
            <div className="field">
              <label>排程 (cron)</label>
              <input type="text" value={cfg.cron || ""} onChange={(e) => upd({ config: { cron: e.target.value } })} disabled={!configureG.allowed} placeholder="* * * * *" />
            </div>
          </>
        )}
        {kind === "http" && (
          <>
            <div className="field">
              <label>方法</label>
              <select value={cfg.method || "GET"} onChange={(e) => upd({ config: { method: e.target.value } })} disabled={!configureG.allowed}>
                <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
              </select>
            </div>
            <div className="field">
              <label>URL</label>
              <input type="text" value={cfg.url || ""} onChange={(e) => upd({ config: { url: e.target.value } })} disabled={!configureG.allowed} placeholder="https://..." />
            </div>
            <div className="field">
              <label>Headers (JSON)</label>
              <textarea value={cfg.headers || ""} onChange={(e) => upd({ config: { headers: e.target.value } })} disabled={!configureG.allowed} placeholder='{"Authorization": "Bearer ..."}' />
            </div>
          </>
        )}
        {kind === "email" && (
          <>
            <div className="field">
              <label>收件人</label>
              <input type="text" value={cfg.to || ""} onChange={(e) => upd({ config: { to: e.target.value } })} disabled={!configureG.allowed} placeholder="user@example.com" />
            </div>
            <div className="field">
              <label>主旨</label>
              <input type="text" value={cfg.subject || ""} onChange={(e) => upd({ config: { subject: e.target.value } })} disabled={!configureG.allowed} />
            </div>
            <div className="field">
              <label>內文</label>
              <textarea value={cfg.body || ""} onChange={(e) => upd({ config: { body: e.target.value } })} disabled={!configureG.allowed} placeholder="您好，{{user.name}}..." />
            </div>
          </>
        )}
        {kind === "condition" && (
          <div className="field">
            <label>條件表達式</label>
            <textarea value={cfg.expr || ""} onChange={(e) => upd({ config: { expr: e.target.value } })} disabled={!configureG.allowed} placeholder="user.tier === 'VIP' && order.total > 1000" />
          </div>
        )}
        {kind === "approval" && (
          <>
            <div className="field">
              <label>簽核者角色</label>
              <select value={cfg.approver || "Approver"} onChange={(e) => upd({ config: { approver: e.target.value } })} disabled={!configureG.allowed}>
                <option>Approver</option><option>Admin</option>
              </select>
            </div>
            <div className="field">
              <label>逾時 (h)</label>
              <input type="number" min="1" value={cfg.timeoutH || 24} onChange={(e) => upd({ config: { timeoutH: Number(e.target.value) } })} disabled={!configureG.allowed} />
            </div>
            <div className="field">
              <label>備註</label>
              <textarea value={cfg.note || ""} onChange={(e) => upd({ config: { note: e.target.value } })} disabled={!configureG.allowed} placeholder="可填寫簽核重點" />
            </div>
          </>
        )}
        {kind === "delay" && (
          <div className="field">
            <label>延遲秒數</label>
            <input type="number" min="0" value={cfg.seconds || 0} onChange={(e) => upd({ config: { seconds: Number(e.target.value) } })} disabled={!configureG.allowed} />
          </div>
        )}
        {kind === "end" && (
          <div className="field">
            <label>結束狀態</label>
            <select value={cfg.status || "completed"} onChange={(e) => upd({ config: { status: e.target.value } })} disabled={!configureG.allowed}>
              <option value="completed">completed</option>
              <option value="cancelled">cancelled</option>
              <option value="failed">failed</option>
            </select>
          </div>
        )}
        {!configureG.allowed && <div className="badge bad" style={{ marginTop: 4 }}>🔒 {roleName} 不可編輯此節點</div>}
      </div>

      {kind === "approval" && (
        <div className="insp-section">
          <h4>簽核動作</h4>
          {approvalOverride === true && <div className="badge good" style={{ marginBottom: 6 }}>已通過</div>}
          {approvalOverride === false && <div className="badge bad" style={{ marginBottom: 6 }}>已拒絕</div>}
          <div className="row" style={{ display: "flex", gap: 6 }}>
            <button className="btn primary" disabled={!approveG.allowed} onClick={() => onApprove(node.id, true)} title={approveG.allowed ? "簽核通過" : approveG.reason}>✓ 通過</button>
            <button className="btn danger" disabled={!approveG.allowed} onClick={() => onApprove(node.id, false)} title={approveG.allowed ? "簽核拒絕" : approveG.reason}>✗ 拒絕</button>
          </div>
          {!approveG.allowed && <div className="badge bad" style={{ marginTop: 6 }}>🔒 {approveG.reason}</div>}
        </div>
      )}

      <div className="insp-section">
        <h4>危險區</h4>
        <button className="btn danger" onClick={() => onDelete(node.id)} disabled={!deleteG.allowed} title={deleteG.allowed ? "刪除節點" : deleteG.reason} style={{ width: "100%", justifyContent: "center" }}>
          🗑 刪除節點
        </button>
        {!deleteG.allowed && <div className="badge bad" style={{ marginTop: 6 }}>🔒 {deleteG.reason}</div>}
      </div>
    </>
  );
}

function defaultConfigFor(kind) {
  switch (kind) {
    case "trigger":   return { event: "manual", cron: "" };
    case "http":      return { method: "GET", url: "https://", headers: "" };
    case "email":     return { to: "", subject: "", body: "" };
    case "condition": return { expr: "value > 0" };
    case "approval":  return { approver: "Approver", timeoutH: 24, note: "" };
    case "delay":     return { seconds: 5 };
    case "end":       return { status: "completed" };
    default: return {};
  }
}

// =========================================================================
// 7. Boot
// =========================================================================
function Root() {
  return (
    <ReactFlowProvider>
      <AppInner />
    </ReactFlowProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
</body>
</html>
