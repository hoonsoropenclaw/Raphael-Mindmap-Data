<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>跨瀏覽器視覺回歸測試樣本</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#101e31;--line:#27405f;--text:#eef7ff;--muted:#9db1c9;--accent:#5ce1e6;--good:#83f28f}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 20% 0,#183858 0,transparent 42%),var(--bg);color:var(--text)}
    main{width:min(1100px,calc(100% - 32px));margin:auto;padding:64px 0}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    h1{max-width:820px;font-size:clamp(2.4rem,7vw,5.6rem);line-height:.96;margin:18px 0}p{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:42px}
    .card{padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(21,42,68,.92),rgba(10,23,39,.94));box-shadow:0 20px 55px rgba(0,0,0,.24)}
    .card strong{font-size:1.16rem}.pill{display:inline-block;margin-top:14px;padding:7px 11px;border:1px solid #39728a;border-radius:999px;color:var(--good);font-size:.85rem}
    button{margin-top:32px;border:0;border-radius:12px;padding:14px 20px;background:var(--accent);color:#052026;font-weight:800;cursor:pointer}#status{display:inline-block;margin-left:14px;color:var(--good)}
    @media(max-width:760px){main{padding-top:38px}.grid{grid-template-columns:1fr}h1{font-size:3rem}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Playwright Visual QA</div>
    <h1>一次驗證三種瀏覽器引擎。</h1>
    <p>這是穩定、無遠端字型、無動畫的視覺基準頁，供 Chromium、Firefox 與 WebKit 產生可重現截圖。</p>
    <section class="grid" aria-label="測試能力">
      <article class="card"><strong>跨瀏覽器</strong><p>同一測試矩陣覆蓋 Chromium、Firefox、WebKit。</p><span class="pill">3 engines</span></article>
      <article class="card"><strong>像素差異</strong><p>以 pixelmatch 計算差異率並輸出紅色 diff 圖。</p><span class="pill">pixel diff</span></article>
      <article class="card"><strong>可攜報告</strong><p>HTML 內嵌 baseline、current 與 diff，不依賴外部資源。</p><span class="pill">self-contained</span></article>
    </section>
    <button id="probe" type="button">執行互動探針</button><span id="status" role="status">等待測試</span>
  </main>
  <script>document.getElementById('probe').addEventListener('click',()=>{document.getElementById('status').textContent='互動正常';});</script>
</body>
</html>
