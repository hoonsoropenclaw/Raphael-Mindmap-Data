<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Framer Motion 微動畫展示 · Hermes Lab</title>

  <!-- React 17 UMD（與 Framer Motion 4.x UMD 兼容,Babel Standalone 可直接吃 JSX） -->
  <script crossorigin src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/framer-motion@4.1.17/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg-0: #0b0d12;
      --bg-1: #11151c;
      --bg-2: #1a2030;
      --fg-0: #e8ecf3;
      --fg-1: #a4adc2;
      --fg-2: #6b7591;
      --accent: #7c5cff;
      --accent-2: #29d3a1;
      --danger: #ff5d6c;
      --border: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.04);
      --radius: 14px;
      --shadow-1: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--fg-0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Noto Sans TC",
        "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(41,211,161,0.12), transparent 60%),
      var(--bg-0);
    }
    .app { max-width: 1120px; margin: 0 auto; padding: 32px 24px 96px; }
    header.hero { display: flex; align-items: flex-end; justify-content: space-between;
      gap: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; flex-wrap: wrap; }
    .hero h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
    .hero p { margin: 0; color: var(--fg-1); font-size: 14px; max-width: 60ch; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--fg-1);
      background: var(--glass); }
    .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent-2); box-shadow: 0 0 0 4px rgba(41,211,161,0.18); }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
    .card { grid-column: span 6; background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
      border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-1);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .card h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: 0.01em; }
    .card .desc { margin: 0 0 18px; color: var(--fg-2); font-size: 12.5px; }
    .card .stage { min-height: 200px; display: flex; align-items: center; justify-content: center; padding: 12px;
      border-radius: 10px; background: rgba(0,0,0,0.25); border: 1px dashed var(--border); }
    .card.row-12 { grid-column: span 12; }
    @media (max-width: 800px) { .card { grid-column: span 12; } }

    .btn { appearance: none; border: 1px solid var(--border); background: var(--bg-2);
      color: var(--fg-0); padding: 10px 16px; border-radius: 10px; font-size: 14px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; transition: border-color 120ms ease; }
    .btn:hover { border-color: rgba(124,92,255,0.5); }
    .btn.primary { background: linear-gradient(180deg, #7c5cff, #5a3dff); border-color: transparent; }

    .toggle { width: 48px; height: 28px; border-radius: 999px; background: #2a3042; position: relative; cursor: pointer;
      border: 1px solid var(--border); }
    .toggle .knob { width: 22px; height: 22px; border-radius: 999px; background: #fff; position: absolute; top: 2px; left: 2px; }

    .note { width: min(420px, 92%); padding: 14px 16px; border-radius: 12px;
      background: rgba(28,34,48,0.92); border: 1px solid var(--border);
      box-shadow: 0 18px 50px rgba(0,0,0,0.5); display: flex; align-items: flex-start; gap: 12px; }
    .note .icon { width: 28px; height: 28px; border-radius: 8px; flex: 0 0 28px;
      display: grid; place-items: center; color: white; font-weight: 600; }
    .note h4 { margin: 0 0 2px; font-size: 14px; }
    .note p { margin: 0; color: var(--fg-1); font-size: 12.5px; }
    .note.success .icon { background: linear-gradient(180deg, #29d3a1, #16a37a); }
    .note.danger .icon { background: linear-gradient(180deg, #ff5d6c, #d63b4b); }

    .tabs { display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: 12px; position: relative; }
    .tab { flex: 1; padding: 9px 14px; text-align: center; cursor: pointer; color: var(--fg-1); font-size: 13.5px;
      border-radius: 8px; position: relative; z-index: 1; user-select: none; }
    .tab.active { color: var(--fg-0); }
    .tabs .pill { position: absolute; top: 4px; bottom: 4px; border-radius: 8px;
      background: var(--bg-2); border: 1px solid var(--border); }

    .flipcard { width: 220px; height: 140px; perspective: 1000px; cursor: pointer; }
    .flip-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
    .flip-face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 12px;
      border: 1px solid var(--border); backface-visibility: hidden; -webkit-backface-visibility: hidden; font-size: 14px; }
    .flip-face.front { background: linear-gradient(135deg, #1f2540, #161a2c); }
    .flip-face.back { background: linear-gradient(135deg, #2a1f40, #1a132c); transform: rotateY(180deg); }

    .drag-tile { width: 96px; height: 96px; border-radius: 16px;
      background: linear-gradient(180deg, #2a304a, #1a1f30); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--fg-0); font-weight: 600; cursor: grab; user-select: none; touch-action: none; }
    .drag-tile:active { cursor: grabbing; }

    .dots { display: flex; gap: 8px; }
    .dot-step { width: 10px; height: 10px; border-radius: 999px; background: #2a3042; border: 1px solid var(--border); }

    .toasts { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 99; }

    .scroller { height: 240px; overflow: auto; padding: 16px; border: 1px solid var(--border);
      border-radius: 10px; background: rgba(0,0,0,0.25); }
    .scroller .bar { position: sticky; top: 0; height: 6px; background: #2a3042; border-radius: 999px; overflow: hidden; }
    .scroller .bar > div { height: 100%; background: linear-gradient(90deg, #7c5cff, #29d3a1); }
    .scroller p { color: var(--fg-1); line-height: 1.7; font-size: 13px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <h1>Framer Motion · 微動畫展示</h1>
        <p>10 個互動展示塊：motion / variants / AnimatePresence / layoutId / 拖拽 / 手勢 / useScroll / useSpring / useTransform / useReducedMotion 守護。</p>
      </div>
      <div class="badges">
        <span class="badge"><span class="dot"></span>Framer Motion 4.1.17</span>
        <span class="badge">React 17 UMD</span>
        <span class="badge">a11y · reduced-motion</span>
      </div>
    </header>

    <main id="root" class="grid"></main>
  </div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    // Framer Motion 4.1.17 UMD 掛在 window.Motion
    const FM = window.Motion || {};
    const { motion, AnimatePresence, useViewportScroll, useTransform, useMotionValue,
            useSpring, useReducedMotion, LayoutGroup } = FM;

    // ---------- 1. Hover / Tap Button ----------
    function HoverTap() {
      const [count, setCount] = useState(0);
      return (
        <div className="card">
          <h2>1 · Hover / Tap 動畫</h2>
          <p className="desc">whileHover 放大 + 陰影、whileTap 縮小、spring 過渡回彈。</p>
          <div className="stage" style={{ flexDirection: 'column', gap: 14 }}>
            <motion.button
              className="btn primary"
              onClick={() => setCount(c => c + 1)}
              whileHover={{ scale: 1.06, boxShadow: '0 18px 40px rgba(124,92,255,0.5)' }}
              whileTap={{ scale: 0.94 }}
              transition={{ type: 'spring', stiffness: 400, damping: 18 }}
            >
              點我 ({count})
            </motion.button>
            <div style={{ color: 'var(--fg-2)', fontSize: 12 }}>已點擊 {count} 次</div>
          </div>
        </div>
      );
    }

    // ---------- 2. AnimatePresence 切換 ----------
    function PresenceSwitch() {
      const [on, setOn] = useState(true);
      return (
        <div className="card">
          <h2>2 · AnimatePresence 切換</h2>
          <p className="desc">exit 動畫 + 進場動畫,使用 mode='wait' 確保乾淨切換。</p>
          <div className="stage" style={{ flexDirection: 'column', gap: 16 }}>
            <motion.div className="toggle" onClick={() => setOn(v => !v)}>
              <motion.div className="knob"
                animate={{ x: on ? 20 : 0, backgroundColor: on ? '#7c5cff' : '#fff' }}
                transition={{ type: 'spring', stiffness: 500, damping: 30 }} />
            </motion.div>
            <AnimatePresence mode="wait">
              <motion.div key={on ? 'on' : 'off'}
                initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -6 }}
                transition={{ duration: 0.2 }}
                style={{ color: 'var(--fg-1)', fontSize: 13 }}>
                狀態：<strong style={{ color: 'var(--fg-0)' }}>{on ? 'ON' : 'OFF'}</strong>
              </motion.div>
            </AnimatePresence>
          </div>
        </div>
      );
    }

    // ---------- 3. Layout 動畫 (Tabs) ----------
    function LayoutTabs() {
      const items = ['總覽', '設定', '成員', '日誌'];
      const [active, setActive] = useState(items[0]);
      const tabRefs = useRef({});
      const [pill, setPill] = useState({ left: 4, width: 60 });
      useEffect(() => {
        const el = tabRefs.current[active];
        if (el) setPill({ left: el.offsetLeft, width: el.offsetWidth });
      }, [active]);
      return (
        <div className="card">
          <h2>3 · Layout 動畫 (FLIP)</h2>
          <p className="desc">用 motion 量測 + animate 變化做位置過渡(純 React 4.x 示範,非 layoutId)。</p>
          <div className="stage" style={{ flexDirection: 'column', gap: 12 }}>
            <div className="tabs" style={{ width: '100%', maxWidth: 420 }}>
              <motion.div className="pill"
                initial={false}
                animate={{ left: pill.left, width: pill.width }}
                transition={{ type: 'spring', stiffness: 380, damping: 30 }} />
              {items.map(it => (
                <div key={it} ref={el => tabRefs.current[it] = el}
                  className={'tab' + (active === it ? ' active' : '')}
                  onClick={() => setActive(it)}>{it}</div>
              ))}
            </div>
            <div style={{ color: 'var(--fg-2)', fontSize: 12 }}>當前分頁：{active}</div>
          </div>
        </div>
      );
    }

    // ---------- 4. Variants 階梯動畫 ----------
    function StaggerList() {
      const list = { hidden: {}, show: { transition: { staggerChildren: 0.08, delayChildren: 0.05 } } };
      const item = {
        hidden: { opacity: 0, y: 14 },
        show: { opacity: 1, y: 0, transition: { type: 'spring', stiffness: 300, damping: 22 } }
      };
      const [k, setK] = useState(0);
      useEffect(() => { const t = setInterval(() => setK(v => v + 1), 3500); return () => clearInterval(t); }, []);
      return (
        <div className="card">
          <h2>4 · Variants 階梯動畫</h2>
          <p className="desc">父層 variants 控制 staggerChildren,讓子元素依序彈入。</p>
          <div className="stage" style={{ flexDirection: 'column', gap: 10 }}>
            <AnimatePresence mode="wait">
              <motion.ul key={k}
                variants={list} initial="hidden" animate="show" exit={{ opacity: 0 }}
                style={{ listStyle: 'none', margin: 0, padding: 0, display: 'grid', gap: 8, width: '100%', maxWidth: 360 }}>
                {[1,2,3,4,5].map(n => (
                  <motion.li key={n} variants={item}
                    style={{ padding: '10px 14px', borderRadius: 10, border: '1px solid var(--border)',
                      background: 'rgba(255,255,255,0.03)', display: 'flex', justifyContent: 'space-between' }}>
                    <span>任務 #{n}</span>
                    <span style={{ color: 'var(--accent-2)' }}>完成</span>
                  </motion.li>
                ))}
              </motion.ul>
            </AnimatePresence>
          </div>
        </div>
      );
    }

    // ---------- 5. Flip Card ----------
    function FlipCard() {
      const [flipped, setFlipped] = useState(false);
      return (
        <div className="card">
          <h2>5 · 3D 翻牌</h2>
          <p className="desc">使用 rotateY + spring 過渡做出擬真翻牌。</p>
          <div className="stage" style={{ perspective: 1000 }}>
            <div className="flipcard" onClick={() => setFlipped(v => !v)}>
              <motion.div className="flip-inner"
                animate={{ rotateY: flipped ? 180 : 0 }}
                transition={{ type: 'spring', stiffness: 200, damping: 18 }}>
                <div className="flip-face front">正面 · 點擊翻面</div>
                <div className="flip-face back">背面 · 已翻開</div>
              </motion.div>
            </div>
          </div>
        </div>
      );
    }

    // ---------- 6. Drag ----------
    function DragTile() {
      const [pos, setPos] = useState({ x: 0, y: 0 });
      return (
        <div className="card">
          <h2>6 · 拖拽 (drag)</h2>
          <p className="desc">drag + dragConstraints 邊界 + dragElastic,onDragEnd 取得落點。</p>
          <div className="stage" style={{ minHeight: 220, position: 'relative' }}>
            <motion.div className="drag-tile"
              drag dragConstraints={{ left: -100, right: 100, top: -40, bottom: 40 }}
              dragElastic={0.2}
              whileDrag={{ scale: 1.08, boxShadow: '0 18px 40px rgba(0,0,0,0.5)' }}
              onDragEnd={(_, info) => setPos({ x: info.offset.x, y: info.offset.y })}>
              DRAG
            </motion.div>
            <div style={{ position: 'absolute', bottom: 8, left: 12, color: 'var(--fg-2)', fontSize: 11 }}>
              落點：x={pos.x.toFixed(0)} y={pos.y.toFixed(0)}
            </div>
          </div>
        </div>
      );
    }

    // ---------- 7. useViewportScroll 進度條 ----------
    function ScrollProgress() {
      const { scrollYProgress } = useViewportScroll();
      const width = useTransform(scrollYProgress, [0, 1], ['0%', '100%']);
      const widthPx = useTransform(scrollYProgress, [0, 1], [0, 380]);
      return (
        <div className="card row-12">
          <h2>7 · useViewportScroll + useTransform 進度條</h2>
          <p className="desc">scrollYProgress 0~1 → width 線性映射,點下方按鈕展開捲動區塊即可看到效果。</p>
          <div style={{ position: 'relative', height: 10, background: 'rgba(255,255,255,0.05)',
            borderRadius: 999, overflow: 'hidden', border: '1px solid var(--border)' }}>
            <motion.div style={{ height: '100%', width, background:
              'linear-gradient(90deg, #7c5cff, #29d3a1)' }} />
          </div>
        </div>
      );
    }

    // ---------- 8. useSpring 鍵盤 step 進度 ----------
    function KeyboardStepper() {
      const [step, setStep] = useState(0);
      const total = 5;
      // 用 useSpring 讓 progress bar 有彈性
      const targetWidth = useMotionValue(0);
      const smoothWidth = useSpring(targetWidth, { stiffness: 120, damping: 20 });
      useEffect(() => {
        const onKey = e => {
          if (e.key === 'ArrowRight') setStep(s => Math.min(s + 1, total - 1));
          if (e.key === 'ArrowLeft') setStep(s => Math.max(s - 1, 0));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => { targetWidth.set(((step + 1) / total) * 300); }, [step]);
      return (
        <div className="card">
          <h2>8 · useSpring 鍵盤步進</h2>
          <p className="desc">用 ← / → 控制步進,useSpring 讓進度條有 spring 過渡。</p>
          <div className="stage" style={{ flexDirection: 'column', gap: 14 }}>
            <div className="dots" role="progressbar" aria-valuenow={step + 1} aria-valuemin={1} aria-valuemax={total}>
              {Array.from({ length: total }).map((_, i) => (
                <motion.div key={i} className="dot-step"
                  animate={{ scale: i === step ? 1.4 : 1,
                    backgroundColor: i <= step ? '#7c5cff' : '#2a3042' }}
                  transition={{ type: 'spring', stiffness: 300, damping: 22 }} />
              ))}
            </div>
            <div style={{ width: 300, height: 6, background: '#2a3042',
              borderRadius: 999, overflow: 'hidden' }}>
              <motion.div style={{ height: '100%', width: smoothWidth,
                background: 'linear-gradient(90deg, #7c5cff, #29d3a1)' }} />
            </div>
            <div style={{ color: 'var(--fg-2)', fontSize: 12 }}>Step {step + 1} / {total}</div>
          </div>
        </div>
      );
    }

    // ---------- 9. 通知 Toaster ----------
    function Toaster() {
      const [notes, setNotes] = useState([]);
      const push = (kind) => {
        const id = Date.now() + Math.random();
        setNotes(arr => [...arr, { id, kind, title: kind === 'success' ? '儲存成功' : '刪除成功', body: '已同步至雲端' }]);
        setTimeout(() => setNotes(arr => arr.filter(n => n.id !== id)), 3200);
      };
      return (
        <div className="card row-12">
          <h2>9 · 通知 Toaster (AnimatePresence + layout)</h2>
          <p className="desc">進場/退場堆疊,點下方按鈕觸發。</p>
          <div className="stage" style={{ justifyContent: 'flex-start', gap: 12, padding: 20 }}>
            <button className="btn" onClick={() => push('success')}>觸發成功通知</button>
            <button className="btn" onClick={() => push('danger')}>觸發刪除通知</button>
          </div>
          <div className="toasts" aria-live="polite">
            <AnimatePresence>
              {notes.map(n => (
                <motion.div key={n.id} className={'note ' + n.kind}
                  layout
                  initial={{ opacity: 0, x: 60, scale: 0.96 }}
                  animate={{ opacity: 1, x: 0, scale: 1 }}
                  exit={{ opacity: 0, x: 60, scale: 0.96 }}
                  transition={{ type: 'spring', stiffness: 360, damping: 28 }}>
                  <div className="icon">{n.kind === 'success' ? '✓' : '✕'}</div>
                  <div>
                    <h4>{n.title}</h4>
                    <p>{n.body}</p>
                  </div>
                </motion.div>
              ))}
            </AnimatePresence>
          </div>
        </div>
      );
    }

    // ---------- 10. useReducedMotion 守護 ----------
    function RespectReducedMotion() {
      const reduce = useReducedMotion();
      return (
        <div className="card row-12" style={{ background: 'linear-gradient(180deg, rgba(124,92,255,0.06), rgba(41,211,161,0.04))' }}>
          <h2>10 · 架構審查守護（a11y）</h2>
          <p className="desc">useReducedMotion 偵測 → 自動縮短/停用動畫。系統層面另以 CSS media query 兜底。</p>
          <div className="stage" style={{ gap: 18, flexDirection: 'column' }}>
            <motion.div
              animate={reduce ? { x: 0 } : { x: [0, 30, -30, 0] }}
              transition={reduce ? { duration: 0 } : { duration: 2, repeat: Infinity, ease: 'easeInOut' }}
              style={{ width: 80, height: 80, borderRadius: 14,
                background: 'linear-gradient(180deg, #7c5cff, #29d3a1)',
                display: 'grid', placeItems: 'center', color: 'white', fontWeight: 700 }}>
              a11y
            </motion.div>
            <div style={{ color: 'var(--fg-1)', fontSize: 13 }}>
              目前作業系統偏好：<strong style={{ color: 'var(--fg-0)' }}>{reduce ? '減少動效' : '正常'}</strong>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <>
          <HoverTap />
          <PresenceSwitch />
          <LayoutTabs />
          <StaggerList />
          <FlipCard />
          <DragTile />
          <ScrollProgress />
          <KeyboardStepper />
          <Toaster />
          <RespectReducedMotion />
        </>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
