<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HR 案件流程圖 + RBAC 權限管理 Demo</title>

<!-- Tailwind CSS via CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React 18 UMD -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<!-- Babel for in-browser JSX -->
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- React Flow (xyflow) UMD -->
<script src="https://unpkg.com/@xyflow/react@12.3.5/dist/umd/index.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.3.5/dist/style.css" />

<style>
  body { font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  .react-flow__node { font-size: 12px; }
  .react-flow__node-hr     { border: 2px solid #2563eb; background: #dbeafe; border-radius: 8px; padding: 10px; width: 180px; }
  .react-flow__node-manager{ border: 2px solid #16a34a; background: #dcfce7; border-radius: 8px; padding: 10px; width: 180px; }
  .react-flow__node-applicant{ border: 2px solid #ca8a04; background: #fef9c3; border-radius: 8px; padding: 10px; width: 180px; }
  .react-flow__node-final  { border: 2px solid #9333ea; background: #f3e8ff; border-radius: 8px; padding: 10px; width: 180px; }
  .react-flow__node-locked { opacity: 0.35; filter: grayscale(80%); }
  .react-flow__edge.locked { opacity: 0.2; }
  .rf-shell { width: 100%; height: 600px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
  .badge-allow { background: #dcfce7; color: #166534; }
  .badge-deny  { background: #fee2e2; color: #991b1b; }
  .badge-view  { background: #e0e7ff; color: #3730a3; }
</style>
</head>

<body class="bg-slate-50 min-h-screen">
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useMemo, useCallback, useEffect } = React;
const {
  ReactFlow,
  Background,
  Controls,
  MiniMap,
  applyNodeChanges,
  applyEdgeChanges,
  Handle,
  Position,
  MarkerType,
} = ReactFlow;

// ============================================================
// 1. 流程節點定義 (HR Recruitment Lifecycle - 6 階段)
// ============================================================
const NODE_DEFS = {
  n1: {
    id: 'n1', type: 'hr', position: { x:  40, y:  40 },
    label: '① 職缺申請',
    desc: '申請人或部門主管提出新職缺',
    actor: 'applicant',
  },
  n2: {
    id: 'n2', type: 'hr', position: { x: 280, y:  40 },
    label: '② HR 初審',
    desc: 'HR 確認 JD 合理性、預算、職等',
    actor: 'hr',
  },
  n3: {
    id: 'n3', type: 'manager', position: { x: 520, y:  40 },
    label: '③ 部門主管審核',
    desc: '用人主管確認需求、面試名單',
    actor: 'manager',
  },
  n4: {
    id: 'n4', type: 'hr', position: { x: 760, y:  40 },
    label: '④ 面試安排',
    desc: 'HR 排程面試、收集回饋',
    actor: 'hr',
  },
  n5: {
    id: 'n5', type: 'manager', position: { x: 520, y: 240 },
    label: '⑤ 背景調查',
    desc: 'HR + 主管共同確認學經歷真實性',
    actor: 'both',
  },
  n6: {
    id: 'n6', type: 'final', position: { x: 280, y: 240 },
    label: '⑥ 入職決策',
    desc: 'Offer 簽核、報到資料準備',
    actor: 'hr',
  },
};

const NODE_LIST = Object.values(NODE_DEFS);

// ============================================================
// 2. 初始 edges
// ============================================================
const INITIAL_EDGES = [
  { id: 'e12', source: 'n1', target: 'n2', animated: true, markerEnd: { type: MarkerType.ArrowClosed } },
  { id: 'e23', source: 'n2', target: 'n3', animated: true, markerEnd: { type: MarkerType.ArrowClosed } },
  { id: 'e34', source: 'n3', target: 'n4', animated: true, markerEnd: { type: MarkerType.ArrowClosed } },
  { id: 'e45', source: 'n4', target: 'n5', animated: true, markerEnd: { type: MarkerType.ArrowClosed } },
  { id: 'e56', source: 'n5', target: 'n6', animated: true, markerEnd: { type: MarkerType.ArrowClosed } },
];

// ============================================================
// 3. RBAC 規則:角色 -> 每個節點的權限(view / edit / deny)
// ============================================================
const ROLES = ['applicant', 'hr', 'manager', 'admin'];

const RBAC = {
  applicant: {
    n1: 'edit', n2: 'view', n3: 'view', n4: 'view', n5: 'deny', n6: 'view',
  },
  hr: {
    n1: 'view', n2: 'edit', n3: 'view', n4: 'edit', n5: 'edit', n6: 'edit',
  },
  manager: {
    n1: 'edit', n2: 'view', n3: 'edit', n4: 'view', n5: 'edit', n6: 'view',
  },
  admin: {
    n1: 'edit', n2: 'edit', n3: 'edit', n4: 'edit', n5: 'edit', n6: 'edit',
  },
};

const PERM_LABEL = { edit: '可編輯', view: '僅檢視', deny: '🔒 拒絕存取' };

// ============================================================
// 4. 自訂節點元件 (帶權限標示)
// ============================================================
function HRNode({ data }) {
  const perm = data.perm;
  const locked = perm === 'deny';

  return (
    <div className={locked ? 'react-flow__node-hr react-flow__node-locked' : `react-flow__node-${data.kind}`}>
      <Handle type="target" position={Position.Left} />
      <div className="font-semibold text-sm">{data.label}</div>
      <div className="text-xs text-slate-600 mt-1">{data.desc}</div>
      <div className="mt-2">
        {perm === 'edit' && <span className="badge badge-allow">可編輯</span>}
        {perm === 'view' && <span className="badge badge-view">僅檢視</span>}
        {perm === 'deny' && <span className="badge badge-deny">🔒 鎖定</span>}
      </div>
      <Handle type="source" position={Position.Right} />
    </div>
  );
}

const nodeTypes = { hr: HRNode, manager: HRNode, applicant: HRNode, final: HRNode };

// ============================================================
// 5. 主元件
// ============================================================
function App() {
  const [role, setRole] = useState('hr');
  const [nodes, setNodes] = useState(() => NODE_LIST.map(n => ({
    ...n,
    data: { ...n, kind: n.type, perm: RBAC[role][n.id] },
    draggable: RBAC[role][n.id] !== 'deny',
  })));
  const [edges, setEdges] = useState(INITIAL_EDGES);
  const [log, setLog] = useState([]);

  // role 變動 → 重新計算每節點 perm
  useEffect(() => {
    setNodes(curr => curr.map(n => ({
      ...n,
      data: { ...n.data, perm: RBAC[role][n.id] },
      draggable: RBAC[role][n.id] !== 'deny',
    })));
    setLog(L => [
      { t: new Date().toLocaleTimeString(), msg: `切換角色 → ${role}，權限已重新計算` },
      ...L.slice(0, 19),
    ]);
  }, [role]);

  const onNodesChange = useCallback((changes) => {
    setNodes(ns => applyNodeChanges(changes, ns));
    changes.forEach(c => {
      if (c.type === 'position' && c.dragging) {
        const node = nodes.find(n => n.id === c.id);
        const perm = node ? node.data.perm : '?';
        if (perm === 'deny') {
          setLog(L => [{ t: new Date().toLocaleTimeString(), msg: `⛔ 阻擋：角色 ${role} 嘗試拖動 ${c.id}（無權限）` }, ...L.slice(0, 19)]);
        }
      }
    });
  }, [nodes, role]);

  const onEdgesChange = useCallback((changes) => setEdges(es => applyEdgeChanges(changes, es)), []);

  // 嘗試刪除節點(僅 admin 可)
  const onNodesDelete = useCallback((deleted) => {
    setLog(L => [{
      t: new Date().toLocaleTimeString(),
      msg: role === 'admin' ? `🗑️ admin 刪除節點 ${deleted.map(d=>d.id).join(',')}` : `⛔ 阻擋：角色 ${role} 嘗試刪除 ${deleted.map(d=>d.id).join(',')}`,
    }, ...L.slice(0, 19)]);
  }, [role]);

  const counts = useMemo(() => {
    const c = { edit: 0, view: 0, deny: 0 };
    nodes.forEach(n => { c[n.data.perm] = (c[n.data.perm] || 0) + 1; });
    return c;
  }, [nodes]);

  return (
    <div className="p-6 max-w-7xl mx-auto">
      <header className="mb-4">
        <h1 className="text-2xl font-bold text-slate-800">HR 案件流程圖 + RBAC 權限管理 Demo</h1>
        <p className="text-sm text-slate-600 mt-1">
          React Flow 12 + React 18 + Tailwind。切換角色觀察每個節點的權限遮罩、嘗試拖動「鎖定」節點會被擋下。
        </p>
      </header>

      {/* 角色切換 + RBAC 矩陣 */}
      <section className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-4">
        <div className="flex items-center gap-3 mb-3">
          <span className="text-sm font-medium text-slate-700">目前角色:</span>
          {ROLES.map(r => (
            <button
              key={r}
              onClick={() => setRole(r)}
              className={`px-3 py-1.5 rounded-md text-sm font-medium transition ${
                role === r
                  ? 'bg-blue-600 text-white shadow'
                  : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
              }`}
            >
              {r === 'applicant' && '👤 申請人'}
              {r === 'hr' && '🧑‍💼 HR'}
              {r === 'manager' && '👔 部門主管'}
              {r === 'admin' && '🛠️ 系統管理員'}
            </button>
          ))}
          <div className="ml-auto flex gap-2 text-xs">
            <span className="badge badge-allow">可編輯 {counts.edit}</span>
            <span className="badge badge-view">僅檢視 {counts.view || 0}</span>
            <span className="badge badge-deny">鎖定 {counts.deny || 0}</span>
          </div>
        </div>

        {/* RBAC 矩陣 */}
        <div className="overflow-x-auto">
          <table className="min-w-full text-xs border-collapse">
            <thead>
              <tr className="bg-slate-100">
                <th className="border border-slate-300 px-2 py-1 text-left">節點 \ 角色</th>
                {ROLES.map(r => (
                  <th key={r} className={`border border-slate-300 px-2 py-1 text-center ${r===role?'bg-blue-100':''}`}>
                    {r}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {NODE_LIST.map(n => (
                <tr key={n.id} className={RBAC[role][n.id] === 'deny' ? 'bg-red-50' : ''}>
                  <td className="border border-slate-300 px-2 py-1 font-mono">{n.id} {n.label}</td>
                  {ROLES.map(r => {
                    const p = RBAC[r][n.id];
                    return (
                      <td key={r} className={`border border-slate-300 px-2 py-1 text-center ${r===role?'bg-blue-50':''}`}>
                        <span className={`badge ${p==='edit'?'badge-allow':p==='view'?'badge-view':'badge-deny'}`}>
                          {p === 'edit' ? '✏️ edit' : p === 'view' ? '👁 view' : '🔒 deny'}
                        </span>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      {/* React Flow */}
      <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div className="lg:col-span-3">
          <div className="rf-shell">
            <ReactFlow
              nodes={nodes}
              edges={edges}
              onNodesChange={onNodesChange}
              onEdgesChange={onEdgesChange}
              onNodesDelete={onNodesDelete}
              nodeTypes={nodeTypes}
              fitView
              deleteKeyCode={role === 'admin' ? 'Delete' : null}
              proOptions={{ hideAttribution: true }}
            >
              <Background />
              <Controls />
              <MiniMap pannable zoomable />
            </ReactFlow>
          </div>
          <p className="text-xs text-slate-500 mt-2">
            💡 試試：以 <b>申請人</b> 身份拖動 n5(背景調查)，它會被 RBAC 鎖定；以 <b>系統管理員</b> 身份可以 Delete 節點。
          </p>
        </div>

        {/* 事件日誌 */}
        <aside className="bg-white border border-slate-200 rounded-lg p-3 h-[600px] overflow-y-auto">
          <h3 className="text-sm font-semibold text-slate-700 mb-2">🪵 權限事件日誌</h3>
          {log.length === 0 && <p className="text-xs text-slate-400">尚無事件</p>}
          <ul className="space-y-1 text-xs">
            {log.map((e, i) => (
              <li key={i} className="border-l-2 border-blue-400 pl-2 py-1 bg-slate-50">
                <span className="text-slate-400 font-mono">{e.t}</span> <span>{e.msg}</span>
              </li>
            ))}
          </ul>
        </aside>
      </div>

      <footer className="mt-6 text-xs text-slate-500 border-t pt-3">
        <p>技術:React 18 UMD + React Flow 12 + Tailwind CSS (CDN,無 build step)。開啟方式:任何瀏覽器直接打開本檔即可。</p>
        <p>規範說明:本檔是「最通用版本」(HR 6 階段 + 4 角色),因任務規格空白做合理 fallback。詳見 IMPL_NOTES.md。</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
