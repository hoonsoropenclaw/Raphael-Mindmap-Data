  <style>

<body>
  <div id="root"></div>

  <script type="module">
    import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      ReactFlow,
      ReactFlowProvider,
      Background,
      Controls,
      MiniMap,
      Handle,
      MarkerType,
      Position,
      addEdge,
      useEdgesState,
      useNodesState,
      useReactFlow
    } from '@xyflow/react';

    const NODE_TYPES = {
      trigger: { label: 'Trigger', color: '#e3aa62', icon: '↗' },
      task: { label: 'Task', color: '#91b7a0', icon: '□' },
      decision: { label: 'Decision', color: '#d58b78', icon: '?' },
      output: { label: 'Output', color: '#8fa9c2', icon: '✓' }
    };

    const sampleNodes = [
      { id: 'intake', type: 'flowNode', position: { x: 80, y: 190 }, data: { label: '收件與建檔', kind: 'trigger', meta: 'INTAKE / 01' } },
      { id: 'review', type: 'flowNode', position: { x: 360, y: 100 }, data: { label: '資格初審', kind: 'task', meta: 'REVIEW / 02' } },
      { id: 'route', type: 'flowNode', position: { x: 360, y: 300 }, data: { label: '分流判斷', kind: 'decision', meta: 'ROUTE / 03' } },
      { id: 'approve', type: 'flowNode', position: { x: 650, y: 100 }, data: { label: '主管核定', kind: 'task', meta: 'APPROVE / 04' } },
      { id: 'request', type: 'flowNode', position: { x: 650, y: 300 }, data: { label: '補件通知', kind: 'task', meta: 'REQUEST / 05' } },
      { id: 'archive', type: 'flowNode', position: { x: 940, y: 100 }, data: { label: '歸檔完成', kind: 'output', meta: 'ARCHIVE / 06' } }
    ];

    const edge = (id, source, target, label = '') => ({
      id, source, target, label,
      type: 'smoothstep',
      markerEnd: { type: MarkerType.ArrowClosed, color: '#91a39a' },
      style: { stroke: '#91a39a', strokeWidth: 1.7 },
      labelStyle: { fill: '#aab5ae', fontSize: 10, fontFamily: 'DM Mono, monospace' },
      labelBgStyle: { fill: '#111515', fillOpacity: .96 },
      labelBgPadding: [5, 3],
      labelBgBorderRadius: 3
    });

    const sampleEdges = [
      edge('e-intake-review', 'intake', 'review'),
      edge('e-intake-route', 'intake', 'route'),
      edge('e-review-approve', 'review', 'approve', '通過'),
      edge('e-route-request', 'route', 'request', '補件'),
      edge('e-approve-archive', 'approve', 'archive')
    ];

    function topologicalSort(nodes, edges) {
      const ids = nodes.map(node => node.id);
      const inDegree = new Map(ids.map(id => [id, 0]));
      const adjacency = new Map(ids.map(id => [id, []]));
      for (const currentEdge of edges) {
        if (!inDegree.has(currentEdge.source) || !inDegree.has(currentEdge.target)) continue;
        adjacency.get(currentEdge.source).push(currentEdge.target);
        inDegree.set(currentEdge.target, inDegree.get(currentEdge.target) + 1);
      }
      const queue = ids.filter(id => inDegree.get(id) === 0);
      const order = [];
      for (let cursor = 0; cursor < queue.length; cursor += 1) {
        const id = queue[cursor];
        order.push(id);
        for (const target of adjacency.get(id)) {
          const nextDegree = inDegree.get(target) - 1;
          inDegree.set(target, nextDegree);
          if (nextDegree === 0) queue.push(target);
        }
      }
      const remaining = ids.filter(id => !order.includes(id));
      return { order, remaining, hasCycle: order.length !== ids.length };
    }

    function findCycleNodes(nodes, edges) {
      const adjacency = new Map(nodes.map(node => [node.id, []]));
      for (const currentEdge of edges) {
        if (adjacency.has(currentEdge.source)) adjacency.get(currentEdge.source).push(currentEdge.target);
      }
      const color = new Map(nodes.map(node => [node.id, 0]));
      const stack = [];
      const cycleNodes = new Set();
      function visit(id) {
        color.set(id, 1);
        stack.push(id);
        for (const target of adjacency.get(id) || []) {
          if (color.get(target) === 0) {
            visit(target);
          } else if (color.get(target) === 1) {
            const start = stack.lastIndexOf(target);
            stack.slice(start).forEach(item => cycleNodes.add(item));
          }
        }
        stack.pop();
        color.set(id, 2);
      }
      nodes.forEach(node => { if (color.get(node.id) === 0) visit(node.id); });
      return cycleNodes;
    }

    function canConnect(nodes, edges, source, target) {
      if (!source || !target || source === target) return false;
      if (edges.some(currentEdge => currentEdge.source === source && currentEdge.target === target)) return false;
      const probe = [...edges, { source, target }];
      return !topologicalSort(nodes, probe).hasCycle;
    }

    function FlowNode({ data, selected }) {
      const tone = NODE_TYPES[data.kind] || NODE_TYPES.task;
      const inHandleStyle = { background: tone.color };
      return React.createElement(
        'div',
        { className: `node-card${data.cycle ? ' cycle' : ''}${data.selected ? ' selected' : ''}`, style: { '--node-color': tone.color } },
        React.createElement(Handle, { type: 'target', position: Position.Left, style: inHandleStyle }),
        React.createElement('div', { className: 'node-accent' }),
        React.createElement('div', { className: 'node-inner' },
          React.createElement('div', { className: 'node-top' },
            React.createElement('div', { className: 'node-icon', 'aria-hidden': 'true' }, tone.icon),
            React.createElement('div', { className: 'node-type' }, tone.label),
            data.cycle ? React.createElement('div', { className: 'node-badge' }, 'CYCLE') : null
          ),
          React.createElement('div', { className: 'node-label' }, data.label),
          React.createElement('div', { className: 'node-meta' }, data.meta || 'WORKFLOW NODE')
        ),
        React.createElement(Handle, { type: 'source', position: Position.Right, style: inHandleStyle })
      );
    }

    const nodeTypes = { flowNode: FlowNode };

    function App() {
      const saved = useMemo(() => {
        try { return JSON.parse(localStorage.getItem('flowforge-dag-state') || 'null'); } catch { return null; }
      }, []);
      const [nodes, setNodes, onNodesChange] = useNodesState(saved?.nodes?.length ? saved.nodes : sampleNodes);
      const [edges, setEdges, onEdgesChange] = useEdgesState(saved?.edges || sampleEdges);
      const [selectedId, setSelectedId] = useState(null);
      const [toast, setToast] = useState(null);
      const [theme, setTheme] = useState(saved?.theme || 'dark');
      const idCounter = useRef(100);
      const toastTimer = useRef(null);
      const { fitView } = useReactFlow();

      const result = useMemo(() => topologicalSort(nodes, edges), [nodes, edges]);
      const cycleNodes = useMemo(() => findCycleNodes(nodes, edges), [nodes, edges]);
      const selectedNode = nodes.find(node => node.id === selectedId) || null;
      const orderedNodes = result.order.map(id => nodes.find(node => node.id === id)).filter(Boolean);
      const displayNodes = useMemo(() => nodes.map(node => ({
        ...node,
        data: { ...node.data, cycle: cycleNodes.has(node.id), selected: node.id === selectedId }
      })), [nodes, cycleNodes, selectedId]);

      useEffect(() => {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('flowforge-dag-state', JSON.stringify({ nodes, edges, theme }));
      }, [nodes, edges, theme]);

      const notify = useCallback((message, kind = 'info') => {
        window.clearTimeout(toastTimer.current);
        setToast({ message, kind });
        toastTimer.current = window.setTimeout(() => setToast(null), 3600);
      }, []);

      const onConnect = useCallback((params) => {
        if (!canConnect(nodes, edges, params.source, params.target)) {
          notify('連線會形成循環，已阻擋這次修改。DAG 必須保持無環。', 'error');
          return;
        }
        setEdges(current => addEdge({ ...edge(`e-${params.source}-${params.target}-${Date.now()}`, params.source, params.target), ...params }, current));
        notify('已建立依賴關係。', 'success');
      }, [edges, nodes, notify, setEdges]);

      const addNode = useCallback((kind) => {
        idCounter.current += 1;
        const id = `node-${idCounter.current}`;
        const tone = NODE_TYPES[kind];
        const created = {
          id,
          type: 'flowNode',
          position: { x: 160 + (idCounter.current % 3) * 150, y: 120 + (idCounter.current % 4) * 90 },
          data: { label: `新的${tone.label}節點`, kind, meta: `${tone.label.toUpperCase()} / ${String(idCounter.current).padStart(2, '0')}` }
        };
        setNodes(current => [...current, created]);
        setSelectedId(id);
        notify(`已新增 ${tone.label} 節點。`, 'success');
      }, [notify, setNodes]);

      const updateSelected = useCallback((patch) => {
        if (!selectedId) return;
        setNodes(current => current.map(node => node.id === selectedId ? { ...node, data: { ...node.data, ...patch } } : node));
      }, [selectedId, setNodes]);

      const removeSelected = useCallback(() => {
        if (!selectedId) return;
        setNodes(current => current.filter(node => node.id !== selectedId));
        setEdges(current => current.filter(currentEdge => currentEdge.source !== selectedId && currentEdge.target !== selectedId));
        setSelectedId(null);
        notify('已移除選取節點與相關依賴。', 'success');
      }, [notify, selectedId, setEdges, setNodes]);

      const validate = useCallback(() => {
        if (!nodes.length) { notify('畫布目前沒有節點。', 'error'); return; }
        if (result.hasCycle) {
