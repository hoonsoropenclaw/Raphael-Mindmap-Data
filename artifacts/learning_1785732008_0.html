<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowPilot — Playwright Test Orchestrator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--ink:#17212b;--muted:#708090;--line:#dfe7ee;--paper:#f7fafc;--orange:#ef8354;--blue:#2d6cdf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:64px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;gap:12px;align-items:center;font-weight:800;letter-spacing:-.03em}.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:650;color:#415161}.btn:hover{border-color:#b6c5d2;transform:translateY(-1px)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}.layout{display:grid;grid-template-columns:240px 1fr 292px;min-height:0}.sidebar,.inspector{background:#fff;padding:22px 18px}.sidebar{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#95a5b2;font-weight:800}.side-title{font-size:18px;font-weight:800;margin:5px 0 24px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:8px;color:#627383;cursor:pointer}.nav button.active,.nav button:hover{background:#f0f4f7;color:var(--ink);font-weight:700}.section{margin-top:27px}.scenario{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;font-size:13px;color:#526575}.dot{width:7px;height:7px;background:#63b17e;border-radius:50%;display:inline-block;margin-right:8px}.workspace{position:relative;min-width:0;display:grid;grid-template-rows:76px 1fr 42px}.workspace-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#fff;border-bottom:1px solid var(--line)}.workspace-head h1{margin:2px 0 0;font-size:21px;letter-spacing:-.04em}.meta{font-size:12px;color:var(--muted);margin-top:3px}.canvas{position:relative;overflow:hidden;background-color:#fbfcfd;background-image:radial-gradient(#cfdae3 1px,transparent 1px);background-size:20px 20px}.edge-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{fill:none;stroke:#8ca3b5;stroke-width:2;stroke-dasharray:6 5}.node{position:absolute;width:190px;background:#fff;border:1px solid #d8e1e8;border-radius:12px;box-shadow:0 8px 20px rgba(23,33,43,.08);cursor:pointer;transition:.15s}.node:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(23,33,43,.12)}.node.selected{border:2px solid var(--blue)}.node-head{padding:12px 13px 7px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800}.node-body{padding:0 13px 12px;color:#758694;font-size:11px;line-height:1.45}.node-status{height:4px;background:#63b17e;border-radius:0 0 12px 12px}.node-status.wait{background:#e8b04d}.port{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #8ca3b5;top:42%;}.port.left{left:-6px}.port.right{right:-6px}.pos1{left:8%;top:17%}.pos2{left:38%;top:14%}.pos3{left:68%;top:21%}.pos4{left:38%;top:56%}.pos5{left:68%;top:65%}.canvas-tools{position:absolute;left:18px;bottom:16px;display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 4px 12px #cdd7df66}.canvas-tools button{width:38px;height:34px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer}.canvas-tools button:last-child{border:0}.statusbar{display:flex;align-items:center;gap:18px;padding:0 18px;border-top:1px solid var(--line);font-size:11px;color:#718392;background:#fff}.status-live{color:#3b8b5a;font-weight:700}.inspector h2{font-size:15px;margin:7px 0 20px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;color:#8393a0;font-weight:750}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fbfcfd;color:var(--ink)}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#566979}.run-card{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}.run-card p{font-size:12px;color:var(--muted);line-height:1.5}.browser-list{display:flex;gap:6px;flex-wrap:wrap}.browser{padding:5px 8px;border-radius:6px;background:#eef3f6;color:#526575;font-size:11px}.toast{position:absolute;right:22px;bottom:60px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:8px;font-size:12px;display:none}.toast.show{display:block}@media(max-width:980px){.layout{grid-template-columns:190px 1fr}.inspector{display:none}}@media(max-width:680px){.layout{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 15px}.top-actions .btn:not(.orange){display:none}.workspace-head{padding:14px}.node{width:155px}.pos1{left:4%}.pos2{left:52%}.pos3{left:52%;top:36%}.pos4{left:4%;top:58%}.pos5{left:52%;top:70%}}
</style>
</head>
<body>
<div class="app" id="root"></div>
<div id="fallback" style="padding:40px;font-family:system-ui"><b>FlowPilot</b><p>Loading workflow engine…</p></div>
<script type="text/babel" data-type="module" data-presets="react">
const {useState} = React;
const createRoot = ReactDOM.createRoot;
const initial=[{id:'trigger',type:'test',position:{x:90,y:90},data:{title:'Open application',desc:'Navigate to the target URL',status:'ready'}},{id:'auth',type:'test',position:{x:360,y:70},data:{title:'Authenticate',desc:'Reuse a saved storage state',status:'ready'}},{id:'assert',type:'test',position:{x:630,y:110},data:{title:'Assert dashboard',desc:'Check URL, title and key UI',status:'ready'}},{id:'capture',type:'test',position:{x:360,y:290},data:{title:'Capture evidence',desc:'Screenshot + trace.zip',status:'ready'}},{id:'report',type:'test',position:{x:630,y:330},data:{title:'Publish report',desc:'Chromium · Firefox · WebKit',status:'waiting'}}];
function App(){const [nodes,setNodes]=useState(initial);const [selected,setSelected]=useState('trigger');const [running,setRunning]=useState(false);const [toast,setToast]=useState('');const [url,setUrl]=useState('https://demo.flowpilot.dev');const selectedNode=nodes.find(n=>n.id===selected)||nodes[0];function run(){setRunning(true);setToast('Playwright matrix started');setTimeout(()=>{setRunning(false);setToast('3 browsers passed · report ready')},1500);setTimeout(()=>setToast(''),3500)}function updateTitle(e){setNodes(ns=>ns.map(n=>n.id===selected?{...n,data:{...n.data,title:e.target.value}}:n))}return <><header className="topbar"><div className="brand"><div className="mark">FP</div><span>FlowPilot</span><span className="eyebrow">TEST ORCHESTRATOR</span></div><div className="top-actions"><span className="meta">Last saved 2 min ago</span><button className="btn" onClick={()=>setToast('Workflow exported as JSON')}>Export</button><button className="btn orange" onClick={run} data-testid="run-button">{running?'Running…':'Run workflow'}</button></div></header><main className="layout"><aside className="sidebar"><div className="eyebrow">Workspace</div><div className="side-title">QA Control Room</div><nav className="nav"><button className="active">Workflows</button><button>Test suites</button><button>Environments</button><button>Runs & traces</button></nav><div className="section eyebrow">Pinned suites</div><div className="scenario"><span><i className="dot"/>Smoke / production</span><b>12</b></div><div className="scenario"><span><i className="dot" style={{background:'#e8b04d'}}/>Checkout regression</span><b>24</b></div><div className="section eyebrow">Execution</div><div className="scenario"><span>Workers</span><b>03</b></div><div className="scenario"><span>Pass rate</span><b>98.2%</b></div></aside><section className="workspace"><div className="workspace-head"><div><div className="eyebrow">Workflow / Smoke production</div><h1>Release confidence pipeline</h1><div className="meta">Visualise, run and inspect browser journeys as a repeatable graph.</div></div><div className="browser-list"><span className="browser">Chromium</span><span className="browser">Firefox</span><span className="browser">WebKit</span></div></div><div className="canvas"><svg className="edge-layer" viewBox="0 0 900 520" preserveAspectRatio="none"><path className="edge" d="M260 135 C310 135 320 115 360 115"/><path className="edge" d="M530 115 C580 115 590 135 630 135"/><path className="edge" d="M530 125 C580 230 580 280 630 350"/><path className="edge" d="M530 335 C580 350 590 360 630 350"/></svg>{nodes.map(n=><div key={n.id} className={'node '+(selected===n.id?'selected':'')+' '+({trigger:'pos1',auth:'pos2',assert:'pos3',capture:'pos4',report:'pos5'}[n.id]||'')} onClick={()=>setSelected(n.id)}><span className="port left"/><div className="node-head"><span style={{color:n.data.status==='waiting'?'#e8b04d':'#2d6cdf'}}>●</span>{n.data.title}</div><div className="node-body">{n.data.desc}</div><div className={'node-status '+(n.data.status==='waiting'?'wait':'')}></div><span className="port right"/></div>)}<div className="canvas-tools"><button onClick={()=>setToast('Zoom in')}>＋</button><button onClick={()=>setToast('Zoom out')}>−</button><button onClick={()=>setToast('Canvas fitted')}>⌗</button></div><div className={'toast '+(toast?'show':'')}>{toast}</div></div><div className="statusbar"><span className="status-live">● System operational</span><span>5 nodes</span><span>4 connections</span><span>Parallel execution enabled</span></div></section><aside className="inspector"><div className="eyebrow">Node inspector</div><h2>{selectedNode.data.title}</h2><div className="field"><label>Node name</label><input value={selectedNode.data.title} onChange={updateTitle}/></div><div className="field"><label>Action</label><select defaultValue="browser"><option value="browser">Browser interaction</option><option value="assert">Assertion</option><option value="capture">Evidence capture</option></select></div><div className="field"><label>Target URL</label><input value={url} onChange={e=>setUrl(e.target.value)} data-testid="target-url"/></div><label className="check"><input type="checkbox" defaultChecked/> Wait for network idle</label><label className="check"><input type="checkbox" defaultChecked/> Record trace on failure</label><div className="run-card"><div className="eyebrow">Execution matrix</div><p>Each run fans out across three browser engines and stores an isolated trace for debugging.</p><div className="browser-list"><span className="browser">✓ Chromium</span><span className="browser">✓ Firefox</span><span className="browser">✓ WebKit</span></div><button className="btn primary" style={{width:'100%',marginTop:16}} onClick={run}>{running?'Running matrix…':'Run selected node'}</button></div></aside></main></>}
createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>window.addEventListener('load',()=>{try{const src=document.querySelector('script[type="text/babel"]').textContent;const out=Babel.transform(src,{presets:['react']}).code;eval(out);document.getElementById('fallback').remove()}catch(e){document.getElementById('fallback').innerHTML='<b>FlowPilot failed to load</b><p>'+e.message+'</p>'}})</script></body></html>
