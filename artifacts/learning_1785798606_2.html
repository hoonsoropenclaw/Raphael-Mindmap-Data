<!DOCTYPE html>
<html lang="zh-Hant" data-theme="aurora">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TokenForge · 設計代幣驅動的設計系統</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React 18 UMD + Babel -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
  :root {
    /* 預設主題：aurora（會被 JS 動態覆寫） */
    --color-primary-50:#eef2ff;  --color-primary-100:#e0e7ff;
    --color-primary-200:#c7d2fe;  --color-primary-300:#a5b4fc;
    --color-primary-400:#818cf8;  --color-primary-500:#6366f1;
    --color-primary-600:#4f46e5;  --color-primary-700:#4338ca;
    --color-primary-800:#3730a3;  --color-primary-900:#312e81;

    --color-accent-500:#ec4899;
    --color-success-500:#10b981;
    --color-warning-500:#f59e0b;
    --color-danger-500:#ef4444;
    --color-info-500:#3b82f6;

    --color-bg-base:#fafaff;
    --color-bg-elevated:#ffffff;
    --color-bg-sunken:#f1f5f9;
    --color-bg-overlay:rgba(255,255,255,0.7);

    --color-fg-default:#0f172a;
    --color-fg-muted:#64748b;
    --color-fg-subtle:#94a3b8;
    --color-fg-inverse:#ffffff;

    --color-border-default:#e2e8f0;
    --color-border-strong:#cbd5e1;

    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px;
    --shadow-sm:0 1px 2px 0 rgba(15,23,42,0.05);
    --shadow-md:0 4px 12px -2px rgba(15,23,42,0.08),0 2px 4px -2px rgba(15,23,42,0.04);
    --shadow-lg:0 16px 40px -8px rgba(15,23,42,0.18),0 4px 12px -4px rgba(15,23,42,0.08);
    --shadow-glow:0 0 0 4px rgba(99,102,241,0.18);

    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;

    --font-sans:'Inter','PingFang TC','Noto Sans TC',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono','Fira Code','SF Mono',monospace;

    --transition-fast:120ms cubic-bezier(.4,0,.2,1);
    --transition-base:220ms cubic-bezier(.4,0,.2,1);
    --transition-slow:420ms cubic-bezier(.4,0,.2,1);
  }

  /* 主題：sunset */
  [data-theme="sunset"] {
    --color-primary-500:#f97316; --color-primary-600:#ea580c; --color-primary-700:#c2410c;
    --color-primary-400:#fb923c; --color-primary-300:#fdba74;
    --color-accent-500:#db2777;
    --color-bg-base:#fff7ed; --color-bg-elevated:#ffffff; --color-bg-sunken:#fed7aa;
    --color-fg-default:#431407; --color-fg-muted:#9a3412; --color-fg-subtle:#c2410c;
    --color-border-default:#fed7aa; --color-border-strong:#fdba74;
  }

  /* 主題：forest */
  [data-theme="forest"] {
    --color-primary-500:#10b981; --color-primary-600:#059669; --color-primary-700:#047857;
    --color-primary-400:#34d399; --color-primary-300:#6ee7b7;
    --color-accent-500:#84cc16;
    --color-bg-base:#f0fdf4; --color-bg-elevated:#ffffff; --color-bg-sunken:#dcfce7;
    --color-fg-default:#052e16; --color-fg-muted:#166534; --color-fg-subtle:#15803d;
    --color-border-default:#bbf7d0; --color-border-strong:#86efac;
  }

  /* 主題：cyberpunk */
  [data-theme="cyberpunk"] {
    --color-primary-500:#f0f; --color-primary-600:#d0d; --color-primary-700:#b0b;
    --color-primary-400:#f6f; --color-primary-300:#faf;
    --color-accent-500:#0ff;
    --color-bg-base:#0a0a1a; --color-bg-elevated:#14142b; --color-bg-sunken:#06060f;
    --color-bg-overlay:rgba(20,20,43,0.7);
    --color-fg-default:#f0f0ff; --color-fg-muted:#a0a0c0; --color-fg-subtle:#606080;
    --color-fg-inverse:#0a0a1a;
    --color-border-default:#2a2a4a; --color-border-strong:#3a3a6a;
    --shadow-glow:0 0 24px rgba(255,0,255,0.35);
  }

  /* 主題：dark（darkMode override） */
  [data-theme="dark"] {
    --color-primary-500:#818cf8; --color-primary-600:#6366f1; --color-primary-700:#4f46e5;
    --color-primary-400:#a5b4fc; --color-primary-300:#c7d2fe;
    --color-accent-500:#f472b6;
    --color-bg-base:#0b0d17; --color-bg-elevated:#14172a; --color-bg-sunken:#07080f;
    --color-bg-overlay:rgba(20,23,42,0.7);
    --color-fg-default:#e2e8f0; --color-fg-muted:#94a3b8; --color-fg-subtle:#64748b;
    --color-fg-inverse:#0b0d17;
    --color-border-default:#1e2236; --color-border-strong:#2a2f4a;
    --shadow-glow:0 0 0 4px rgba(129,140,248,0.18);
  }

  html, body {
    background: var(--color-bg-base);
    color: var(--color-fg-default);
    font-family: var(--font-sans);
    transition: background var(--transition-base), color var(--transition-base);
  }

  /* aurora background */
  [data-theme="aurora"] body {
    background:
      radial-gradient(at 12% 18%, rgba(99,102,241,0.18) 0, transparent 50%),
      radial-gradient(at 88% 12%, rgba(236,72,153,0.16) 0, transparent 50%),
      radial-gradient(at 50% 90%, rgba(16,185,129,0.12) 0, transparent 50%),
      var(--color-bg-base);
    background-attachment: fixed;
  }

  /* glass utility */
  .glass {
    background: var(--color-bg-overlay);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid var(--color-border-default);
  }
  @supports not (backdrop-filter: blur(1px)) {
    .glass { background: var(--color-bg-elevated); }
  }

  /* token swatch */
  .swatch { transition: transform var(--transition-fast); }
  .swatch:hover { transform: translateY(-2px); }

  /* code style */
  code, pre { font-family: var(--font-mono); }
  pre { background: var(--color-bg-sunken); padding: 12px; border-radius: var(--radius-md); overflow-x:auto; font-size:12px; }

  /* scrollbar */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: var(--color-bg-sunken); }

  /* toast */
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .toast { animation: slideUp var(--transition-base) forwards; }

  /* shimmer */
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .shimmer {
    background: linear-gradient(90deg,
      var(--color-bg-sunken) 0%,
      var(--color-border-default) 50%,
      var(--color-bg-sunken) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
  }
</style>

<script>
  // Tailwind 動態注入：讀 CSS variables 映射為 utility colors
  function tokenColor(name) {
    return getComputedStyle(document.documentElement).getPropertyValue('--color-' + name).trim();
  }

  function syncTailwindConfig() {
    const tw = window.tailwind;
    if (!tw) return;
    tw.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            primary: {
              50: tokenColor('primary-50'), 100: tokenColor('primary-100'),
              200: tokenColor('primary-200'), 300: tokenColor('primary-300'),
              400: tokenColor('primary-400'), 500: tokenColor('primary-500'),
              600: tokenColor('primary-600'), 700: tokenColor('primary-700'),
              800: tokenColor('primary-800'), 900: tokenColor('primary-900'),
            },
            accent: { 500: tokenColor('accent-500') },
            success: { 500: tokenColor('success-500') },
            warning: { 500: tokenColor('warning-500') },
            danger:  { 500: tokenColor('danger-500')  },
            info:    { 500: tokenColor('info-500')    },
            surface: {
              base:      tokenColor('bg-base'),
              elevated:  tokenColor('bg-elevated'),
              sunken:    tokenColor('bg-sunken'),
            },
            ink: {
              DEFAULT: tokenColor('fg-default'),
              muted:   tokenColor('fg-muted'),
              subtle:  tokenColor('fg-subtle'),
              inverse: tokenColor('fg-inverse'),
            },
            line: {
              DEFAULT: tokenColor('border-default'),
              strong:  tokenColor('border-strong'),
            },
          },
          fontFamily: {
            sans: ['Inter','PingFang TC','Noto Sans TC','system-ui','sans-serif'],
            mono: ['JetBrains Mono','Fira Code','SF Mono','monospace'],
          },
          borderRadius: {
            sm: tokenColor('radius-sm') || '6px',
            md: tokenColor('radius-md') || '10px',
            lg: tokenColor('radius-lg') || '16px',
            xl: tokenColor('radius-xl') || '24px',
          },
          boxShadow: {
            sm: tokenColor('shadow-sm') || '0 1px 2px rgba(0,0,0,.05)',
            md: tokenColor('shadow-md') || '0 4px 12px rgba(0,0,0,.08)',
            lg: tokenColor('shadow-lg') || '0 16px 40px rgba(0,0,0,.18)',
            glow: tokenColor('shadow-glow') || '0 0 0 4px rgba(99,102,241,.18)',
          },
        },
      },
    };
  }

  // 啟動 Tailwind 並立即同步一次
  if (window.tailwind) {
    syncTailwindConfig();
    // Tailwind CDN 觀察 DOM 變化自動重新編譯
    new MutationObserver(() => {
      try { syncTailwindConfig(); } catch(e) {}
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }
</script>
</head>

<body class="min-h-screen antialiased">

<div id="root"></div>

<!-- ============== Token 系統資料層 ============== -->
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, createContext, useContext } = React;

/* =========================================================
 * 1. 設計代幣（Design Tokens）
 * 結構化資料，符合 W3C Design Token spec 精神
 * ========================================================= */
const INITIAL_TOKENS = {
  meta: {
    name: "Aurora Tokens",
    version: "1.0.0",
    updated: "2026-08-04",
  },
  color: {
    primary: {
      50:  "#eef2ff", 100: "#e0e7ff", 200: "#c7d2fe", 300: "#a5b4fc",
      400: "#818cf8", 500: "#6366f1", 600: "#4f46e5", 700: "#4338ca",
      800: "#3730a3", 900: "#312e81",
    },
    accent:    { 500: "#ec4899" },
    semantic:  {
      success: "#10b981",
      warning: "#f59e0b",
      danger:  "#ef4444",
      info:    "#3b82f6",
    },
    surface: {
      base:     "#fafaff",
      elevated: "#ffffff",
      sunken:   "#f1f5f9",
    },
    ink: {
      default: "#0f172a",
      muted:   "#64748b",
      subtle:  "#94a3b8",
      inverse: "#ffffff",
    },
    line: {
      default: "#e2e8f0",
      strong:  "#cbd5e1",
    },
  },
  radius: { sm: "6px", md: "10px", lg: "16px", xl: "24px" },
  shadow: {
    sm:   "0 1px 2px 0 rgba(15,23,42,0.05)",
    md:   "0 4px 12px -2px rgba(15,23,42,0.08),0 2px 4px -2px rgba(15,23,42,0.04)",
    lg:   "0 16px 40px -8px rgba(15,23,42,0.18),0 4px 12px -4px rgba(15,23,42,0.08)",
    glow: "0 0 0 4px rgba(99,102,241,0.18)",
  },
  spacing: { 1:"4px",2:"8px",3:"12px",4:"16px",5:"20px",6:"24px",8:"32px",10:"40px",12:"48px" },
  typography: {
    fontSans: "'Inter','PingFang TC','Noto Sans TC',system-ui,sans-serif",
    fontMono: "'JetBrains Mono','Fira Code','SF Mono',monospace",
    sizes:   { xs:"12px", sm:"14px", base:"16px", lg:"18px", xl:"20px", "2xl":"24px", "3xl":"30px" },
  },
};

const PRESETS = {
  aurora: {
    name: "Aurora", emoji: "🌌",
    color: {
      primary: { 50:"#eef2ff",100:"#e0e7ff",200:"#c7d2fe",300:"#a5b4fc",400:"#818cf8",
                 500:"#6366f1",600:"#4f46e5",700:"#4338ca",800:"#3730a3",900:"#312e81" },
      accent:  { 500:"#ec4899" },
      surface: { base:"#fafaff", elevated:"#ffffff", sunken:"#f1f5f9" },
      ink:     { default:"#0f172a", muted:"#64748b", subtle:"#94a3b8", inverse:"#ffffff" },
      line:    { default:"#e2e8f0", strong:"#cbd5e1" },
    },
  },
  sunset: {
    name: "Sunset", emoji: "🌅",
    color: {
      primary: { 50:"#fff7ed",100:"#ffedd5",200:"#fed7aa",300:"#fdba74",400:"#fb923c",
                 500:"#f97316",600:"#ea580c",700:"#c2410c",800:"#9a3412",900:"#7c2d12" },
      accent:  { 500:"#db2777" },
      surface: { base:"#fff7ed", elevated:"#ffffff", sunken:"#ffedd5" },
      ink:     { default:"#431407", muted:"#9a3412", subtle:"#c2410c", inverse:"#ffffff" },
      line:    { default:"#fed7aa", strong:"#fdba74" },
    },
  },
  forest: {
    name: "Forest", emoji: "🌲",
    color: {
      primary: { 50:"#f0fdf4",100:"#dcfce7",200:"#bbf7d0",300:"#86efac",400:"#34d399",
                 500:"#10b981",600:"#059669",700:"#047857",800:"#065f46",900:"#064e3b" },
      accent:  { 500:"#84cc16" },
      surface: { base:"#f0fdf4", elevated:"#ffffff", sunken:"#dcfce7" },
      ink:     { default:"#052e16", muted:"#166534", subtle:"#15803d", inverse:"#ffffff" },
      line:    { default:"#bbf7d0", strong:"#86efac" },
    },
  },
  cyberpunk: {
    name: "Cyberpunk", emoji: "🤖",
    color: {
      primary: { 50:"#fafaff",100:"#f0f0ff",200:"#e0e0ff",300:"#d0d0ff",400:"#f0f",
                 500:"#f0f",600:"#d0d",700:"#b0b",800:"#909",900:"#708" },
      accent:  { 500:"#0ff" },
      surface: { base:"#0a0a1a", elevated:"#14142b", sunken:"#06060f" },
      ink:     { default:"#f0f0ff", muted:"#a0a0c0", subtle:"#606080", inverse:"#0a0a1a" },
      line:    { default:"#2a2a4a", strong:"#3a3a6a" },
    },
  },
  dark: {
    name: "Dark", emoji: "🌙",
    color: {
      primary: { 50:"#eef2ff",100:"#e0e7ff",200:"#c7d2fe",300:"#a5b4fc",400:"#a5b4fc",
                 500:"#818cf8",600:"#6366f1",700:"#4f46e5",800:"#3730a3",900:"#312e81" },
      accent:  { 500:"#f472b6" },
      surface: { base:"#0b0d17", elevated:"#14172a", sunken:"#07080f" },
      ink:     { default:"#e2e8f0", muted:"#94a3b8", subtle:"#64748b", inverse:"#0b0d17" },
      line:    { default:"#1e2236", strong:"#2a2f4a" },
    },
  },
};

/* =========================================================
 * 2. Token 系統 → CSS 變數注入器
 * 這是設計系統的「核心引擎」：任何代幣變更 → 即時重算 CSS 變數
 * ========================================================= */
function tokensToCssVars(tokens) {
  const out = [];
  const c = tokens.color;
  Object.entries(c.primary).forEach(([k,v]) => out.push(`--color-primary-${k}: ${v}`));
  Object.entries(c.accent).forEach(([k,v]) => out.push(`--color-accent-${k}: ${v}`));
  out.push(`--color-success-500: ${c.semantic.success}`);
  out.push(`--color-warning-500: ${c.semantic.warning}`);
  out.push(`--color-danger-500:  ${c.semantic.danger}`);
  out.push(`--color-info-500:    ${c.semantic.info}`);
  out.push(`--color-bg-base:     ${c.surface.base}`);
  out.push(`--color-bg-elevated: ${c.surface.elevated}`);
  out.push(`--color-bg-sunken:   ${c.surface.sunken}`);
  out.push(`--color-bg-overlay:  rgba(${hexToRgb(c.surface.elevated)},0.72)`);
  out.push(`--color-fg-default:  ${c.ink.default}`);
  out.push(`--color-fg-muted:    ${c.ink.muted}`);
  out.push(`--color-fg-subtle:   ${c.ink.subtle}`);
  out.push(`--color-fg-inverse:  ${c.ink.inverse}`);
  out.push(`--color-border-default: ${c.line.default}`);
  out.push(`--color-border-strong:  ${c.line.strong}`);
  Object.entries(tokens.radius).forEach(([k,v]) => out.push(`--radius-${k}: ${v}`));
  Object.entries(tokens.shadow).forEach(([k,v]) => out.push(`--shadow-${k}: ${v}`));
  out.push(`--font-sans: ${tokens.typography.fontSans}`);
  out.push(`--font-mono: ${tokens.typography.fontMono}`);
  return out.join('; ');
}

function hexToRgb(hex) {
  const m = String(hex).replace('#','').trim();
  if (m.length !== 6) return '255,255,255';
  const r = parseInt(m.slice(0,2),16);
  const g = parseInt(m.slice(2,4),16);
  const b = parseInt(m.slice(4,6),16);
  return `${r},${g},${b}`;
}

/* =========================================================
 * 3. Context — 全域狀態（tokens / 主題 / 編輯狀態）
 * ========================================================= */
const TokenContext = createContext(null);

function TokenProvider({ children }) {
  const [tokens, setTokens] = useState(() => {
    try {
      const saved = localStorage.getItem('tokenforge.tokens');
      return saved ? JSON.parse(saved) : INITIAL_TOKENS;
    } catch { return INITIAL_TOKENS; }
  });
  const [themeName, setThemeName] = useState(() => localStorage.getItem('tokenforge.theme') || 'aurora');
  const [toast, setToast] = useState(null);

  // 套用代幣 → CSS 變數 + Tailwind
  useEffect(() => {
    const css = tokensToCssVars(tokens);
    document.documentElement.setAttribute('style', css);
    document.documentElement.setAttribute('data-theme', themeName);
    localStorage.setItem('tokenforge.tokens', JSON.stringify(tokens));
    localStorage.setItem('tokenforge.theme', themeName);
    if (window.tailwind) {
      try { syncTailwindConfig(); } catch(e) {}
    }
  }, [tokens, themeName]);

  const showToast = useCallback((msg, kind='success') => {
    setToast({ msg, kind, id: Date.now() });
    setTimeout(() => setToast(null), 2400);
  }, []);

  const applyPreset = useCallback((name) => {
    const p = PRESETS[name];
    if (!p) return;
    setThemeName(name);
    setTokens(t => ({ ...t, color: { ...t.color, ...p.color }, meta: { ...t.meta, name: p.name, updated: new Date().toISOString().slice(0,10) } }));
    showToast(`已切換至 ${p.name} 主題`);
  }, [showToast]);

  const updateToken = useCallback((path, value) => {
    setTokens(t => {
      const next = JSON.parse(JSON.stringify(t));
      const segs = path.split('.');
      let cur = next;
      for (let i=0; i<segs.length-1; i++) cur = cur[segs[i]];
      cur[segs[segs.length-1]] = value;
      return next;
    });
  }, []);

  const resetTokens = useCallback(() => {
    setTokens(INITIAL_TOKENS);
    setThemeName('aurora');
    showToast('已重置為預設 Token');
  }, [showToast]);

  const importTokens = useCallback((json) => {
    try {
      const parsed = typeof json === 'string' ? JSON.parse(json) : json;
      setTokens(parsed);
      showToast('Token JSON 匯入成功');
      return true;
    } catch (e) {
      showToast('JSON 解析失敗：' + e.message, 'danger');
      return false;
    }
  }, [showToast]);

  const exportTokens = useCallback(() => JSON.stringify(tokens, null, 2), [tokens]);

  return (
    <TokenContext.Provider value={{
      tokens, themeName, setThemeName,
      applyPreset, updateToken, resetTokens, importTokens, exportTokens,
      toast, showToast,
    }}>
      {children}
    </TokenContext.Provider>
  );
}

const useTokens = () => useContext(TokenContext);

/* =========================================================
 * 4. UI 元件庫（從設計代幣組合）
 * ========================================================= */
function Button({ variant='primary', size='md', children, onClick, disabled, icon }) {
  const sizeMap = { sm:'px-3 py-1.5 text-xs', md:'px-4 py-2 text-sm', lg:'px-6 py-3 text-base' };
  const variantMap = {
    primary:   'bg-primary-500 text-ink-inverse hover:bg-primary-600 shadow-md hover:shadow-lg',
    secondary: 'bg-surface-elevated text-ink border border-line hover:border-primary-400',
    ghost:     'bg-transparent text-ink hover:bg-surface-sunken',
    accent:    'bg-accent-500 text-ink-inverse hover:opacity-90 shadow-md',
    danger:    'bg-danger-500 text-ink-inverse hover:opacity-90 shadow-md',
    outline:   'bg-transparent border border-primary-500 text-primary-500 hover:bg-primary-500 hover:text-ink-inverse',
  };
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className={`inline-flex items-center gap-2 rounded-md font-medium transition-all duration-200
                  ${sizeMap[size]} ${variantMap[variant]} ${disabled?'opacity-40 cursor-not-allowed':'active:scale-[0.98]'}`}>
      {icon}{children}
    </button>
  );
}

function Card({ title, children, footer, accent }) {
  return (
    <div className="rounded-lg bg-surface-elevated border border-line shadow-md hover:shadow-lg transition-shadow overflow-hidden">
      {title && (
        <div className="px-5 py-3 border-b border-line flex items-center justify-between"
             style={accent ? { borderTopWidth:'3px', borderTopColor:'var(--color-primary-500)', borderTopStyle:'solid' } : {}}>
          <h3 className="font-semibold text-ink">{title}</h3>
          {accent && <span className="text-xs px-2 py-0.5 rounded-sm bg-primary-100 text-primary-700">{accent}</span>}
        </div>
      )}
      <div className="p-5 text-ink">{children}</div>
      {footer && <div className="px-5 py-3 bg-surface-sunken border-t border-line text-xs text-ink-muted">{footer}</div>}
    </div>
  );
}

function Badge({ tone='primary', children }) {
  const map = {
    primary: 'bg-primary-100 text-primary-700',
    accent:  'bg-accent-500/15 text-accent-500',
    success: 'bg-success-500/15 text-success-500',
    warning: 'bg-warning-500/15 text-warning-500',
    danger:  'bg-danger-500/15  text-danger-500',
    info:    'bg-info-500/15    text-info-500',
  };
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-sm text-xs font-medium ${map[tone]}`}>{children}</span>;
}

function Alert({ tone='info', title, children }) {
  const map = {
    info:    { bar:'bg-info-500',    text:'text-info-500' },
    success: { bar:'bg-success-500', text:'text-success-500' },
    warning: { bar:'bg-warning-500', text:'text-warning-500' },
    danger:  { bar:'bg-danger-500',  text:'text-danger-500' },
  };
  const s = map[tone];
  return (
    <div className="flex gap-3 p-4 rounded-md border border-line bg-surface-elevated">
      <div className={`w-1 rounded-md ${s.bar}`}></div>
      <div>
        {title && <div className={`font-semibold mb-1 ${s.text}`}>{title}</div>}
        <div className="text-sm text-ink-muted">{children}</div>
      </div>
    </div>
  );
}

function Input({ label, value, onChange, placeholder }) {
  return (
    <label className="block">
      {label && <span className="block text-xs font-medium text-ink-muted mb-1">{label}</span>}
      <input
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        className="w-full px-3 py-2 rounded-md bg-surface-elevated border border-line
                   text-ink placeholder:text-ink-subtle
                   focus:border-primary-500 focus:shadow-glow focus:outline-none transition-all duration-200"
      />
    </label>
  );
}

/* =========================================================
 * 5. 視圖層
 * ========================================================= */
function ThemeSwitcher() {
  const { themeName, applyPreset } = useTokens();
  return (
    <div className="flex items-center gap-2 flex-wrap">
      {Object.entries(PRESETS).map(([key, p]) => (
        <button
          key={key}
          onClick={() => applyPreset(key)}
          className={`group flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-medium transition-all duration-200
                      ${themeName === key
                        ? 'bg-primary-500 text-ink-inverse shadow-glow'
                        : 'bg-surface-elevated text-ink border border-line hover:border-primary-400'}`}>
          <span className="text-base leading-none">{p.emoji}</span>
          <span>{p.name}</span>
        </button>
      ))}
    </div>
  );
}

function ColorPalette() {
  const { tokens, updateToken, showToast } = useTokens();
  const c = tokens.color;

  const groups = [
    { label:'Primary', keys: Object.keys(c.primary), path: k => `color.primary.${k}`, values: c.primary },
    { label:'Accent',  keys: Object.keys(c.accent),  path: k => `color.accent.${k}`,  values: c.accent },
    { label:'Surface', keys: Object.keys(c.surface), path: k => `color.surface.${k}`, values: c.surface },
    { label:'Ink',     keys: Object.keys(c.ink),     path: k => `color.ink.${k}`,     values: c.ink },
    { label:'Line',    keys: Object.keys(c.line),    path: k => `color.line.${k}`,    values: c.line },
  ];

  return (
    <div className="space-y-5">
      {groups.map(g => (
        <div key={g.label}>
          <div className="text-xs font-semibold uppercase tracking-wider text-ink-muted mb-2">{g.label}</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
            {g.keys.map(k => (
              <div key={k} className="swatch rounded-md overflow-hidden border border-line bg-surface-elevated shadow-sm hover:shadow-md">
                <div className="h-14 w-full cursor-pointer relative group" style={{ background: g.values[k] }}
                     onClick={() => {
                       navigator.clipboard?.writeText(g.values[k]);
                       showToast(`已複製 ${g.values[k]}`);
                     }}>
                  <div className="absolute inset-0 bg-ink-default/0 group-hover:bg-ink-default/10 transition-colors duration-200 flex items-center justify-center">
                    <span className="opacity-0 group-hover:opacity-100 text-xs font-mono text-ink-inverse">點擊複製</span>
                  </div>
                </div>
                <div className="p-2">
                  <div className="text-[10px] font-mono text-ink-muted">{k}</div>
                  <input
                    value={g.values[k]}
                    onChange={e => updateToken(g.path(k), e.target.value)}
                    className="w-full text-[10px] font-mono bg-transparent text-ink border-none focus:outline-none p-0"
                  />
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function TypographyPanel() {
  const { tokens, updateToken } = useTokens();
  const sizes = tokens.typography.sizes;
  return (
    <div className="space-y-3">
      {Object.entries(sizes).map(([key, value]) => (
        <div key={key} className="flex items-center gap-4 p-3 rounded-md bg-surface-elevated border border-line">
          <div className="w-12 text-xs font-mono text-ink-muted">{key}</div>
          <div className="flex-1 text-ink" style={{ fontSize: value, lineHeight: 1.3 }}>The quick brown fox 快速的棕色狐狸</div>
          <input
            value={value}
            onChange={e => updateToken(`typography.sizes.${key}`, e.target.value)}
            className="w-20 px-2 py-1 text-xs font-mono rounded-sm bg-surface-sunken border border-line text-ink focus:outline-none focus:border-primary-500"
          />
        </div>
      ))}
    </div>
  );
}

function RadiusShadowPanel() {
  const { tokens, updateToken } = useTokens();
  return (
    <div className="grid md:grid-cols-2 gap-5">
      <div>
        <div className="text-xs font-semibold uppercase tracking-wider text-ink-muted mb-2">Radius</div>
        <div className="grid grid-cols-2 gap-3">
          {Object.entries(tokens.radius).map(([k,v]) => (
            <div key={k} className="p-3 bg-surface-elevated border border-line">
              <div className="h-12 w-full bg-primary-500 mb-2" style={{ borderRadius: v }}></div>
              <div className="text-xs font-mono text-ink-muted">{k}</div>
              <input
                value={v}
                onChange={e => updateToken(`radius.${k}`, e.target.value)}
                className="w-full text-[10px] font-mono bg-transparent text-ink border-none focus:outline-none p-0"
              />
            </div>
          ))}
        </div>
      </div>
      <div>
        <div className="text-xs font-semibold uppercase tracking-wider text-ink-muted mb-2">Shadow</div>
        <div className="space-y-3">
          {Object.entries(tokens.shadow).map(([k,v]) => (
            <div key={k} className="p-4 bg-surface-elevated border border-line" style={{ boxShadow: v }}>
              <div className="text-xs font-semibold text-ink">shadow-{k}</div>
              <div className="text-[10px] font-mono text-ink-muted mt-1 break-all">{v}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ComponentGallery() {
  const { showToast } = useTokens();
  return (
    <div className="space-y-5">
      <Card title="Buttons" footer="variant × size 矩陣">
        <div className="flex flex-wrap items-center gap-3">
          <Button variant="primary"   onClick={() => showToast('Primary action')}>Primary</Button>
          <Button variant="secondary" onClick={() => showToast('Secondary')}>Secondary</Button>
          <Button variant="accent"    onClick={() => showToast('Accent!')}>Accent</Button>
          <Button variant="ghost"     onClick={() => showToast('Ghost')}>Ghost</Button>
          <Button variant="outline"   onClick={() => showToast('Outline')}>Outline</Button>
          <Button variant="danger"    onClick={() => showToast('Danger!')}>Danger</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
        <div className="mt-4 flex flex-wrap items-center gap-3">
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
        </div>
      </Card>

      <Card title="Badges & Alerts">
        <div className="flex flex-wrap gap-2 mb-4">
          <Badge tone="primary">primary</Badge>
          <Badge tone="accent">accent</Badge>
          <Badge tone="success">success</Badge>
          <Badge tone="warning">warning</Badge>
          <Badge tone="danger">danger</Badge>
          <Badge tone="info">info</Badge>
        </div>
        <div className="grid md:grid-cols-2 gap-3">
          <Alert tone="info" title="Heads up!">Token 變更會即時套用到所有元件。</Alert>
          <Alert tone="success" title="Success">所有主題已成功載入。</Alert>
          <Alert tone="warning" title="Warning">匯入 JSON 會覆蓋現有 Token。</Alert>
          <Alert tone="danger" title="Danger">刪除主題會永久移除所有顏色。</Alert>
        </div>
      </Card>

      <Card title="Form Controls">
        <div className="grid md:grid-cols-2 gap-3">
          <Input label="Primary Color (500)" placeholder="#6366f1" />
          <Input label="Border Radius" placeholder="10px" />
          <Input label="Font Family" placeholder="Inter, sans-serif" />
          <Input label="Shadow Blur" placeholder="16px" />
        </div>
      </Card>

      <Card title="Typography" footer="字級由 typography.sizes Token 控制">
        <div className="space-y-2">
          <div className="text-ink" style={{fontSize:'30px',fontWeight:700}}>Heading 3XL</div>
          <div className="text-ink" style={{fontSize:'24px',fontWeight:600}}>Heading 2XL</div>
          <div className="text-ink" style={{fontSize:'20px',fontWeight:600}}>Heading XL</div>
          <div className="text-ink" style={{fontSize:'16px'}}>Body base — 設計代幣（Design Token）是設計系統的最小原子單元。</div>
          <div className="text-ink-muted" style={{fontSize:'14px'}}>Body sm — 次要文字、metadata、caption。</div>
          <div className="text-ink-subtle" style={{fontSize:'12px'}}>Body xs — 輔助說明、版權資訊。</div>
        </div>
      </Card>
    </div>
  );
}

function JsonEditor() {
  const { tokens, exportTokens, importTokens } = useTokens();
  const [text, setText] = useState(exportTokens);
  useEffect(() => setText(exportTokens()), [tokens]);
  return (
    <div className="space-y-3">
      <textarea
        value={text}
        onChange={e => setText(e.target.value)}
        className="w-full h-72 p-3 font-mono text-xs rounded-md bg-surface-sunken border border-line text-ink focus:outline-none focus:border-primary-500 focus:shadow-glow transition-all duration-200"
        spellCheck="false"
      />
      <div className="flex flex-wrap gap-2">
        <Button variant="primary" onClick={() => importTokens(text)}>匯入並套用</Button>
        <Button variant="secondary" onClick={() => {
          navigator.clipboard?.writeText(text);
        }}>複製到剪貼簿</Button>
        <Button variant="ghost" onClick={() => setText(exportTokens())}>重置為當前</Button>
      </div>
    </div>
  );
}

function Toast() {
  const { toast } = useTokens();
  if (!toast) return null;
  const map = {
    success: 'bg-success-500 text-ink-inverse',
    danger:  'bg-danger-500  text-ink-inverse',
    info:    'bg-info-500    text-ink-inverse',
  };
  return (
    <div className="fixed bottom-6 right-6 z-50 toast">
      <div className={`px-4 py-3 rounded-md shadow-lg ${map[toast.kind]||map.info}`}>
        {toast.msg}
      </div>
    </div>
  );
}

/* =========================================================
 * 6. 主畫面
 * ========================================================= */
function App() {
  const { resetTokens, tokens } = useTokens();
  const [tab, setTab] = useState('gallery');

  const tabs = [
    { id:'gallery',   label:'元件展示', icon:'🧩' },
    { id:'palette',   label:'色彩 Token', icon:'🎨' },
    { id:'typography',label:'字級',     icon:'🔤' },
    { id:'effects',   label:'圓角/陰影', icon:'✨' },
    { id:'json',      label:'JSON 編輯', icon:'📦' },
  ];

  return (
    <div className="min-h-screen">
      {/* Header */}
      <header className="sticky top-0 z-40 glass border-b border-line">
        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-md bg-primary-500 text-ink-inverse flex items-center justify-center font-bold shadow-md">T</div>
            <div>
              <div className="font-bold text-ink">TokenForge</div>
              <div className="text-[10px] text-ink-muted font-mono">v{tokens.meta.version} · {tokens.meta.name}</div>
            </div>
          </div>
          <ThemeSwitcher />
          <div className="flex items-center gap-2">
            <Badge tone="primary">{tokens.meta.updated}</Badge>
            <Button variant="ghost" size="sm" onClick={resetTokens}>重置</Button>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-6 py-8">
        {/* Hero */}
        <section className="mb-8">
          <div className="flex items-start justify-between gap-6 flex-wrap">
            <div>
              <h1 className="text-3xl font-bold text-ink mb-2">
                一個 <span className="text-primary-500">Token</span> 驅動一切的設計系統
              </h1>
              <p className="text-ink-muted max-w-2xl">
                所有顏色、字級、圓角、陰影都存在結構化 JSON 裡。任何變更即時反映到 Tailwind utility class 與所有元件 —
                換主題、改色票、編輯 JSON，整個 UI 同心跳動。
              </p>
            </div>
            <div className="flex gap-2 flex-wrap">
              <Badge tone="info">CDN Tailwind</Badge>
              <Badge tone="success">React 18 UMD</Badge>
              <Badge tone="accent">W3C-style Tokens</Badge>
              <Badge tone="warning">5 種預設主題</Badge>
            </div>
          </div>
        </section>

        {/* Tabs */}
        <nav className="mb-6 border-b border-line">
          <div className="flex gap-1 overflow-x-auto">
            {tabs.map(t => (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`px-4 py-2.5 text-sm font-medium transition-all duration-200 border-b-2 -mb-px whitespace-nowrap
                            ${tab === t.id
                              ? 'text-primary-500 border-primary-500'
                              : 'text-ink-muted border-transparent hover:text-ink hover:border-line'}`}>
                <span className="mr-2">{t.icon}</span>{t.label}
              </button>
            ))}
          </div>
        </nav>

        {/* Content */}
        <section>
          {tab === 'gallery'    && <ComponentGallery />}
          {tab === 'palette'    && <ColorPalette />}
          {tab === 'typography' && <TypographyPanel />}
          {tab === 'effects'    && <RadiusShadowPanel />}
          {tab === 'json'       && (
            <Card title="Design Tokens · JSON" footer="修改後按「匯入並套用」即時更新整個 UI">
              <JsonEditor />
            </Card>
          )}
        </section>

        {/* Stats */}
        <section className="mt-10 grid grid-cols-2 md:grid-cols-4 gap-4">
          <Card><div className="text-3xl font-bold text-primary-500">10</div><div className="text-xs text-ink-muted">Primary 色階</div></Card>
          <Card><div className="text-3xl font-bold text-accent-500">5</div><div className="text-xs text-ink-muted">預設主題</div></Card>
          <Card><div className="text-3xl font-bold text-success-500">4</div><div className="text-xs text-ink-muted">語意色</div></Card>
          <Card><div className="text-3xl font-bold text-info-500">7</div><div className="text-xs text-ink-muted">字級尺寸</div></Card>
        </section>
      </main>

      <footer className="border-t border-line mt-12 py-6">
        <div className="max-w-7xl mx-auto px-6 text-xs text-ink-muted flex items-center justify-between flex-wrap gap-2">
          <div>TokenForge · 設計代幣 × Tailwind CSS × React UMD</div>
          <div>所有 token 變更即時寫入 localStorage，重整後保留</div>
        </div>
      </footer>

      <Toast />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <TokenProvider>
    <App />
  </TokenProvider>
);
</script>
</body>
</html>
