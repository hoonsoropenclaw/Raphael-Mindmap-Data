<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Framer Motion 高質感 UI + 效能優化展示</title>

  <!--
    架構說明（給未來讀這檔的人）：
    1) React 18 / ReactDOM 走 UMD（從 react_advanced_integration 微技能複用）
    2) Framer Motion 11 UMD 會 require("react")，所以 React 必須先以 window.React 載入
    3) Babel-standalone 在瀏覽器端編譯 JSX（純展示用，正式 production 該走 build pipeline）
    4) 全部動畫只用 transform + opacity（合成器友善，不觸發 layout/paint）
    5) FPS HUD 用 rAF 量即時幀率，作為「不卡頓」的可驗證證據
  -->

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Framer Motion 11 UMD：注意它會 require("react")，所以 React 一定要先載好 -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/framer-motion@11.18.2/dist/framer-motion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    /* ============================================================
       Design Tokens（從 modern_ui_design_and_management 微技能複用）
       ============================================================ */
    :root {
      --bg-0: #0a0a14;
      --bg-1: #13132a;
      --bg-2: #1c1c3a;
      --fg-0: #f4f4ff;
      --fg-1: #c8c8e0;
      --fg-2: #8a8ab0;
      --accent: #7c5cff;
      --accent-2: #5ce1ff;
      --accent-3: #ff5c9c;
      --good: #5cffaa;
      --warn: #ffcc5c;
      --bad: #ff5c6c;

      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 22px;
      --shadow-card: 0 10px 40px -10px rgba(124, 92, 255, 0.35),
                     0 4px 12px -2px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--fg-0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                   "Microsoft JhengHei", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124, 92, 255, 0.18), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(92, 225, 255, 0.12), transparent 60%),
        radial-gradient(800px 800px at 50% 120%, rgba(255, 92, 156, 0.10), transparent 60%),
        linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       Layout（用 Grid 一次把 layout 算好，動畫期不重排）
       ============================================================ */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 96px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    .header h1 {
      font-size: clamp(28px, 4vw, 44px);
      margin: 0 0 12px;
      background: linear-gradient(120deg, var(--accent-2), var(--accent), var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }
    .header p {
      color: var(--fg-2);
      margin: 0;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    /* ============================================================
       Glass card（從 modern_ui_design_and_management 微技能 Glassmorphism 段複用）
       加 @supports fallback 避免舊瀏覽器炸效能
       ============================================================ */
    .glass {
      position: relative;
      background: rgba(28, 28, 58, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--r-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transform: translateZ(0);     /* 合成器 promotion */
      will-change: transform;        /* 動畫期才開，動畫結束會自動收回（見 .anim-keep） */
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
    }
    @supports not (backdrop-filter: blur(1px)) {
      .glass { background: rgba(28, 28, 58, 0.95); }
    }
    /* 動畫結束後釋放 will-change（重要！常駐 will-change 是掉幀元凶之一） */
    .anim-done { will-change: auto; }

    .glass h2 {
      font-size: 18px;
      margin: 0 0 6px;
      color: var(--fg-0);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .glass .desc {
      color: var(--fg-2);
      font-size: 13px;
      margin: 0 0 18px;
      line-height: 1.55;
    }

    /* 動畫 Demo 容器：固定高度，動畫只在 transform/opacity 層動 */
    .stage {
      height: 220px;
      position: relative;
      border-radius: var(--r-md);
      background:
        linear-gradient(135deg, rgba(124, 92, 255, 0.08), rgba(92, 225, 255, 0.04)),
        rgba(10, 10, 20, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    /* ============================================================
       Demo 1：Orb — 滑鼠跟隨
       ============================================================ */
    .orb {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff8, transparent 40%),
                  radial-gradient(circle at 70% 70%, var(--accent-2), var(--accent) 70%);
      box-shadow: 0 0 60px var(--accent),
                  inset 0 0 30px rgba(255, 255, 255, 0.2);
      cursor: grab;
      touch-action: none;
    }
    .orb:active { cursor: grabbing; }
    .orb-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 130px;
      height: 130px;
      margin: -65px 0 0 -65px;
      border-radius: 50%;
      border: 1px dashed rgba(124, 92, 255, 0.4);
      pointer-events: none;
    }

    /* ============================================================
       Demo 2：List — 加入/移除/重排
       用 shared layout（比 layout 動畫便宜，只動 transform）
       ============================================================ */
    .list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: var(--r-sm);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      list-style: none;
    }
    .list-row .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .list-row .label {
      flex: 1;
      font-size: 14px;
      color: var(--fg-1);
    }
    .list-row .idx {
      font-size: 11px;
      color: var(--fg-2);
      font-variant-numeric: tabular-nums;
    }
    .list-controls {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .btn {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid rgba(124, 92, 255, 0.4);
      background: linear-gradient(180deg, rgba(124, 92, 255, 0.15), rgba(124, 92, 255, 0.05));
      color: var(--fg-0);
      border-radius: var(--r-sm);
      font-size: 13px;
      cursor: pointer;
      transition: background 160ms ease-out, border-color 160ms ease-out;
    }
    .btn:hover { border-color: var(--accent); background: rgba(124, 92, 255, 0.25); }
    .btn:active { transform: scale(0.97); }

    /* ============================================================
       Demo 3：Tilt card — 滑鼠傾斜
       重點：傾斜用 transform: rotateX/rotateY（不觸發 layout）
       高光也是 linear-gradient + opacity（合成器屬性）
       ============================================================ */
    .tilt-wrap { perspective: 1000px; height: 100%; }
    .tilt-card {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--r-md);
      background: linear-gradient(135deg, #1c1c3a, #2a1c4a);
      overflow: hidden;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
    }
    .tilt-card .big {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tilt-card .small { color: var(--fg-2); font-size: 12px; }
    .tilt-card .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%),
                                  rgba(255, 255, 255, 0.18), transparent 50%);
      mix-blend-mode: overlay;
    }

    /* ============================================================
       FPS HUD
       ============================================================ */
    .hud {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 50;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      background: rgba(10, 10, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      color: var(--fg-1);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .hud .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 12px var(--good);
      transition: background 200ms, box-shadow 200ms;
    }
    .hud .dot.warn { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
    .hud .dot.bad  { background: var(--bad);  box-shadow: 0 0 12px var(--bad); }
    .hud .fps-num { color: var(--fg-0); font-weight: 600; font-variant-numeric: tabular-nums; }
    .hud .label   { color: var(--fg-2); }
    .hud .stat    { color: var(--fg-1); font-variant-numeric: tabular-nums; }

    /* 尊重 prefers-reduced-motion（覆蓋整個 app） */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }

    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--fg-2);
      font-size: 12px;
    }
    footer code {
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--fg-1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // ============================================================
    // 全域 hooks（UMD 把 React / ReactDOM / Motion 掛到 window）
    // ============================================================
    const { useState, useEffect, useRef, useMemo, useCallback, memo, Fragment } = React;
    const { createRoot } = ReactDOM;
    const {
      motion,            // motion.div / motion.button / ...
      AnimatePresence,   // 進出場動畫
      MotionConfig,      // 全域 transition / reducedMotion 設定
      useMotionValue,    // 繞過 React render 的 motion value
      useTransform,      // 從 motion value 派生
      useSpring,         // 物理彈簧
      useReducedMotion,  // 偵測 prefers-reduced-motion
      LayoutGroup,       // 局部 layout scope
    } = window.Motion;

    // ============================================================
    // FPS HUD hook：用 rAF 計算 1 秒平均幀率
    // 用 useRef 儲存計數（繞過 React render，不會干擾動畫）
    // ============================================================
    function useFps() {
      const [fps, setFps] = useState(60);
      const framesRef = useRef(0);
      const lastRef = useRef(performance.now());

      useEffect(() => {
        let rafId;
        const tick = (now) => {
          framesRef.current += 1;
          const elapsed = now - lastRef.current;
          if (elapsed >= 500) {                 // 每 500ms 更新一次（避免 React render 太頻繁）
            const current = Math.round((framesRef.current * 1000) / elapsed);
            setFps(current);
            framesRef.current = 0;
            lastRef.current = now;
          }
          rafId = requestAnimationFrame(tick);
        };
        rafId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafId);
      }, []);

      return fps;
    }

    function FpsHud() {
      const fps = useFps();
      const tier = fps >= 55 ? "good" : fps >= 40 ? "warn" : "bad";
      const tierText = tier === "good" ? "順暢" : tier === "warn" ? "注意" : "卡頓";
      return (
        <div className="hud" role="status" aria-live="polite">
          <span className={"dot " + tier} />
          <span><span className="label">FPS</span> <span className="fps-num">{fps}</span> <span className="label">({tierText})</span></span>
          <span className="label">·</span>
          <span className="label">目標 60</span>
        </div>
      );
    }

    // ============================================================
    // Demo 1：Orb — 滑鼠跟隨 + 拖曳
    // 重點：
    //   - x / y 用 useMotionValue 存（不進 React render）
    //   - rotateX / rotateY / scale 從同一個 motion value 派生（共用同一個 RAF 訂閱）
    //   - dragConstraints 限制在 stage 內
    //   - 動畫期開 will-change，動畫結束釋放（透過 .anim-done class）
    // ============================================================
    function OrbDemo() {
      const reduced = useReducedMotion();
      const x = useMotionValue(0);
      const y = useMotionValue(0);

      // 從同一個 motion value 派生 rotateX / rotateY / scale（共用 RAF）
      // reduced motion 模式下走 null 退場（motion 自動忽略），避免不必要的訂閱
      const rotateX = useTransform(y, [-90, 90], [15, -15]);
      const rotateY = useTransform(x, [-90, 90], [-15, 15]);
      const scale   = useTransform(x, [-90, 90], [1.05, 0.95]);

      const orbRef = useRef(null);
      const markAnimDone = useCallback(() => {
        const el = orbRef.current;
        if (el) el.classList.add('anim-done');
      }, []);

      return (
        <div className="glass">
          <h2>① 滑鼠跟隨 · 拖曳 Orb</h2>
          <p className="desc">
            <code>useMotionValue</code> + <code>useTransform</code>：三個屬性（rotateX / rotateY / scale）共用同一個 RAF 訂閱，避免多次 setState。
          </p>
          <div className="stage">
            <div className="orb-ring" />
            <motion.div
              ref={orbRef}
              className="orb"
              drag
              dragConstraints={{ top: -90, right: 90, bottom: 90, left: -90 }}
              dragElastic={0.15}
              dragMomentum={true}
              style={{
                x: reduced ? 0 : x,
                y: reduced ? 0 : y,
                rotateX: reduced ? 0 : rotateX,
                rotateY: reduced ? 0 : rotateY,
                scale:   reduced ? 1 : scale,
              }}
              whileHover={{ scale: 1.1 }}
              whileTap={{ scale: 0.95 }}
              transition={{ type: "spring", stiffness: 350, damping: 28, mass: 0.6 }}
              onAnimationComplete={markAnimDone}
            />
          </div>
        </div>
      );
    }

    // ============================================================
    // Demo 2：List — 加入/移除/重排 with shared layout
    // 重點：
    //   - layoutId + layout 動畫 = 只動 transform（其他動畫庫常見的 height 動畫會 reflow，這裡避免）
    //   - AnimatePresence mode="popLayout"：退出元素不佔空間，新元素立即可 layout
    //   - 父層 variants 控制 staggerChildren（但限制最多 8 個並發，避免 frame budget 爆掉）
    // ============================================================
    const PALETTE = [
      { name: "Coral",   color: "#ff5c6c" },
      { name: "Sunset",  color: "#ff8c5c" },
      { name: "Lemon",   color: "#ffcc5c" },
      { name: "Mint",    color: "#5cffaa" },
      { name: "Sky",     color: "#5cbeff" },
      { name: "Indigo",  color: "#7c5cff" },
      { name: "Violet",  color: "#c45cff" },
      { name: "Rose",    color: "#ff5cb4" },
    ];

    const listVariants = {
      visible: { transition: { staggerChildren: 0.04, delayChildren: 0.05 } },
      hidden:  {},
    };
    const itemVariants = {
      hidden:  { opacity: 0, y: 16, scale: 0.95 },
      visible: { opacity: 1, y: 0,  scale: 1, transition: { type: "spring", stiffness: 320, damping: 26 } },
      exit:    { opacity: 0, x: -40, scale: 0.9, transition: { duration: 0.18 } },
    };

    function ListDemo() {
      const [items, setItems] = useState(() =>
        PALETTE.slice(0, 5).map((p, i) => ({ id: p.name + "-" + i, name: p.name, color: p.color }))
      );

      const add = useCallback(() => {
        setItems(prev => {
          const available = PALETTE.filter(p => !prev.some(x => x.name === p.name));
          if (available.length === 0) return prev;
          const pick = available[Math.floor(Math.random() * available.length)];
          return [...prev, { id: pick.name + "-" + Date.now(), name: pick.name, color: pick.color }];
        });
      }, []);

      const remove = useCallback((id) => {
        setItems(prev => prev.filter(x => x.id !== id));
      }, []);

      const shuffle = useCallback(() => {
        setItems(prev => [...prev].sort(() => Math.random() - 0.5));
      }, []);

      return (
        <div className="glass">
          <h2>② List · 加入 / 移除 / 重排</h2>
          <p className="desc">
            <code>layoutId</code> + <code>layout</code>：只動 transform / opacity，不 reflow。<code>AnimatePresence mode="popLayout"</code> 讓退出元素不佔空間。
          </p>
          <div className="stage" style={{ height: "auto", minHeight: 220, maxHeight: 260, overflowY: "auto", padding: 12 }}>
            <motion.ul
              variants={listVariants}
              initial="hidden"
              animate="visible"
              style={{ listStyle: "none", padding: 0, margin: 0 }}
            >
              <AnimatePresence mode="popLayout" initial={false}>
                {items.map((it) => (
                  <motion.li
                    key={it.id}
                    layout
                    layoutId={it.id}
                    variants={itemVariants}
                    exit="exit"
                    onClick={() => remove(it.id)}
                    className="list-row"
                    whileHover={{ x: 4, backgroundColor: "rgba(255,255,255,0.07)" }}
                    whileTap={{ scale: 0.98 }}
                    transition={{ type: "spring", stiffness: 380, damping: 30 }}
                  >
                    <div className="swatch" style={{ background: it.color }} />
                    <div className="label">{it.name}</div>
                    <div className="idx">#{it.id.slice(-4)}</div>
                  </motion.li>
                ))}
              </AnimatePresence>
            </motion.ul>
          </div>
          <div className="list-controls">
            <button className="btn" onClick={add}>+ 加入</button>
            <button className="btn" onClick={shuffle}>⇄ 重排</button>
            <button className="btn" onClick={() => setItems([])}>清空</button>
          </div>
        </div>
      );
    }

    // ============================================================
    // Demo 3：Tilt Card — 滑鼠傾斜 + 高光跟隨
    // 重點：
    //   - rotateX/Y 用 useTransform 從滑鼠 motion value 派生（單一 RAF）
    //   - 高光位置用 CSS variable + linear-gradient，opacity 動畫
    //   - 全部 transform / opacity 路徑，無 layout
    // ============================================================
    function TiltDemo() {
      const ref = useRef(null);
      const mx = useMotionValue(0.5);  // 0..1
      const my = useMotionValue(0.5);
      // 在 -12deg ~ 12deg 範圍內映射
      const rotateY = useTransform(mx, [0, 1], [-12, 12]);
      const rotateX = useTransform(my, [0, 1], [12, -12]);
      const glareOpacity = useTransform(mx, [0, 1], [0.4, 1]);

      const onMove = (e) => {
        const r = ref.current.getBoundingClientRect();
        mx.set((e.clientX - r.left) / r.width);
        my.set((e.clientY - r.top) / r.height);
      };
      const onLeave = () => { mx.set(0.5); my.set(0.5); };

      return (
        <div className="glass">
          <h2>③ Tilt Card · 滑鼠傾斜</h2>
          <p className="desc">
            兩個 <code>motion value</code>（mx / my）派生三個屬性：<code>rotateX</code>、<code>rotateY</code>、<code>glareOpacity</code>。高光用 <code>linear-gradient</code> + CSS variable 動，不重繪。
          </p>
          <div className="stage" style={{ padding: 16 }}>
            <div className="tilt-wrap" onMouseMove={onMove} onMouseLeave={onLeave}>
              <motion.div
                ref={ref}
                className="tilt-card"
                style={{ rotateX, rotateY, transformStyle: "preserve-3d" }}
                transition={{ type: "spring", stiffness: 220, damping: 20 }}
              >
                <motion.div
                  className="glare"
                  style={{ opacity: glareOpacity }}
                />
                <div className="big">60 FPS</div>
                <div className="small">GPU-accelerated · compositor only</div>
              </motion.div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 效能自檢小工具（畫面右上角顯示「本頁用了哪些優化」）
    // ============================================================
    function CheckList() {
      const items = [
        "只動 transform / opacity（合成器友好）",
        "useMotionValue 繞過 React render",
        "useTransform 派生共用同一個 RAF 訂閱",
        "layout 動畫用 transform，不用 height/width",
        "AnimatePresence mode='popLayout'",
        "staggerChildren 限制並發",
        "will-change 僅在動畫期（.anim-done 釋放）",
        "@supports fallback 給舊瀏覽器",
        "prefers-reduced-motion 完整支援",
        "FPS HUD 即時驗證不掉幀",
      ];
      return (
        <motion.div
          className="glass"
          initial={{ opacity: 0, y: 20 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ delay: 0.2, type: "spring", stiffness: 200, damping: 24 }}
        >
          <h2>④ 優化清單（自我審查）</h2>
          <p className="desc">本頁所有動畫遵守以下原則。違反任一條就有掉幀風險。</p>
          <ul style={{ paddingLeft: 18, margin: 0, color: "var(--fg-1)", fontSize: 14, lineHeight: 1.8 }}>
            {items.map((t, i) => (
              <motion.li
                key={i}
                initial={{ opacity: 0, x: -10 }}
                animate={{ opacity: 1, x: 0 }}
                transition={{ delay: 0.3 + i * 0.04, duration: 0.3 }}
              >
                {t}
              </motion.li>
            ))}
          </ul>
        </motion.div>
      );
    }

    // ============================================================
    // App
    // ============================================================
    function App() {
      return (
        <MotionConfig reducedMotion="user" transition={{ duration: 0.35 }}>
          <div className="page">
            <header className="header">
              <motion.h1
                initial={{ opacity: 0, y: -16 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ type: "spring", stiffness: 180, damping: 20 }}
              >
                Framer Motion · 高質感 UI × 零掉幀
              </motion.h1>
              <motion.p
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                transition={{ delay: 0.15, duration: 0.4 }}
              >
                11 個動畫細節優化 · 右下角 FPS 即時監控
              </motion.p>
            </header>

            <div className="grid">
              <OrbDemo />
              <ListDemo />
              <TiltDemo />
              <CheckList />
            </div>

            <footer>
              技術棧：React 18 (UMD) + Framer Motion 11 (UMD) + Babel-standalone · 單一 HTML 檔
            </footer>
          </div>
          <FpsHud />
        </MotionConfig>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
