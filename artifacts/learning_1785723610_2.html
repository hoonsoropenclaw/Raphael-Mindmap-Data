<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>deskauto · 文件自動分類儀表板</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #232730;
    --border: #2d3340;
    --fg: #e6e8ec;
    --muted: #8a93a3;
    --accent: #6ee7b7;
    --accent-2: #60a5fa;
    --warn: #fbbf24;
    --bad: #f87171;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
  }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.3px;
  }
  header .ver { color: var(--muted); font-family: var(--mono); font-size: 13px; }
  main { padding: 24px 32px 60px; max-width: 1280px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card h3 {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    font-weight: 600;
  }
  .card .num { font-size: 30px; font-weight: 600; font-family: var(--mono); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin: 20px 0 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input, .toolbar select {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  .toolbar input { flex: 1; min-width: 200px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  th { background: var(--panel-2); color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.8px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(110,231,183,0.04); }
  td.path { font-family: var(--mono); font-size: 12px; color: var(--accent-2); word-break: break-all; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(110,231,183,0.15);
    color: var(--accent);
    border: 1px solid rgba(110,231,183,0.3);
  }
  .badge.kind { background: rgba(96,165,250,0.15); color: var(--accent-2); border-color: rgba(96,165,250,0.3); }
  .badge.unknown { background: rgba(248,113,113,0.15); color: var(--bad); border-color: rgba(248,113,113,0.3); }
  .bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.4s ease; }
  .label-list { display: flex; flex-direction: column; gap: 10px; }
  .label-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .label-item .name { min-width: 110px; color: var(--fg); }
  .label-item .count { font-family: var(--mono); color: var(--muted); font-size: 12px; min-width: 36px; text-align: right; }
  .label-item .barwrap { flex: 1; }
  footer { color: var(--muted); font-size: 12px; padding: 24px 32px; border-top: 1px solid var(--border); text-align: center; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .empty code { font-family: var(--mono); background: var(--panel-2); padding: 2px 8px; border-radius: 4px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { background: var(--panel-2); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 11px; max-height: 200px; }
  .search-hl { background: rgba(251,191,36,0.25); border-radius: 2px; padding: 0 2px; }
</style>
</head>
<body>
<header>
  <h1>📁 deskauto · 文件自動分類儀表板</h1>
  <span class="ver" id="ver"></span>
  <span class="ver" id="gen"></span>
</header>
<main>
  <div class="grid" id="stats"></div>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋檔名 / 內容 / 分類… (例: 發票、合約、Alice)">
    <select id="filter">
      <option value="">全部分類</option>
    </select>
    <select id="kind">
      <option value="">全部類型</option>
      <option value="image">圖片(OCR)</option>
      <option value="pdf">PDF</option>
      <option value="text">純文字</option>
      <option value="unknown">無法識別</option>
    </select>
  </div>

  <section>
    <h2 style="font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:24px 0 10px;">📊 分類分佈</h2>
    <div class="card">
      <div class="label-list" id="label-dist"></div>
    </div>
  </section>

  <section>
    <h2 style="font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:24px 0 10px;">📚 已索引文件</h2>
    <table id="docs">
      <thead>
        <tr>
          <th>檔名</th>
          <th>分類</th>
          <th>信心</th>
          <th>類型</th>
          <th>大小</th>
          <th>索引時間</th>
          <th>預覽</th>
        </tr>
      </thead>
      <tbody id="docs-body"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">
      尚未索引任何文件。<br>
      請先執行 <code>python3 deskauto.py demo --root ./demo_files</code> 建立範例,或 <code>python3 deskauto.py scan --root &lt;你的資料夾&gt;</code>。
    </div>
  </section>
</main>
<footer>
  deskauto v1.0 · OCR + 檔案監控 + 自動分類 · 本機離線運行
</footer>

<script>
const DATA_URL = './index.json';

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return escHtml(text);
  return escHtml(text.slice(0, i)) +
         '<span class="search-hl">' + escHtml(text.slice(i, i+q.length)) + '</span>' +
         escHtml(text.slice(i+q.length));
}

let ALL_DOCS = [];
let STATS = {};

async function load() {
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    STATS = data.stats || {};
    ALL_DOCS = data.docs || [];
    document.getElementById('ver').textContent = 'v1.0.0';
    document.getElementById('gen').textContent = '生成: ' + (data.generated_at || '—');
    render();
  } catch (e) {
    document.getElementById('docs-body').innerHTML =
      '<tr><td colspan="7" class="empty">⚠️ 無法載入 index.json — ' + escHtml(e.message) +
      '<br><br>請先在終端機執行: <code>python3 deskauto.py demo --root ./demo_files</code></td></tr>';
  }
}

function render() {
  // Stats cards
  const statsEl = document.getElementById('stats');
  const totalDocs = STATS.total_docs || 0;
  const totalBytes = STATS.total_bytes || 0;
  const labelCount = (STATS.by_label || []).length;
  const kindCount = (STATS.by_kind || []).length;
  statsEl.innerHTML = `
    <div class="card"><h3>已索引文件</h3><div class="num">${totalDocs}</div></div>
    <div class="card"><h3>總大小</h3><div class="num">${fmtBytes(totalBytes)}</div></div>
    <div class="card"><h3>分類數</h3><div class="num">${labelCount}</div></div>
    <div class="card"><h3>檔案類型</h3><div class="num">${kindCount}</div></div>
  `;

  // Label distribution
  const dist = STATS.by_label || [];
  const maxCount = Math.max(1, ...dist.map(d => d.count));
  document.getElementById('label-dist').innerHTML = dist.map(d => `
    <div class="label-item">
      <span class="name">${escHtml(d.label)}</span>
      <span class="count">${d.count}</span>
      <div class="barwrap"><div class="bar"><div style="width:${(d.count/maxCount*100).toFixed(1)}%"></div></div></div>
    </div>
  `).join('') || '<div class="empty">無資料</div>';

  // Filter dropdown
  const filter = document.getElementById('filter');
  filter.innerHTML = '<option value="">全部分類</option>' +
    dist.map(d => `<option value="${escHtml(d.label)}">${escHtml(d.label)} (${d.count})</option>`).join('');

  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('q').value.trim();
  const label = document.getElementById('filter').value;
  const kind = document.getElementById('kind').value;

  let docs = ALL_DOCS.slice();
  if (label) docs = docs.filter(d => d.label === label);
  if (kind) docs = docs.filter(d => d.kind === kind);
  if (q) {
    const ql = q.toLowerCase();
    docs = docs.filter(d =>
      (d.path || '').toLowerCase().includes(ql) ||
      (d.label || '').toLowerCase().includes(ql) ||
      (d.ext || '').toLowerCase().includes(ql)
    );
  }

  const body = document.getElementById('docs-body');
  const empty = document.getElementById('empty');
  if (!docs.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  body.innerHTML = docs.map(d => {
    const fname = (d.path || '').split('/').pop();
    const score = (d.score != null) ? (d.score * 100).toFixed(0) + '%' : '—';
    const cls = (d.label === '未分類' || d.label === '無法識別') ? 'unknown' : '';
    return `
      <tr>
        <td class="path" title="${escHtml(d.path)}">${highlight(fname, q)}</td>
        <td><span class="badge ${cls}">${escHtml(d.label || '—')}</span></td>
        <td><span class="badge">${score}</span></td>
        <td><span class="badge kind">${escHtml(d.kind || '—')}</span></td>
        <td>${fmtBytes(d.size || 0)}</td>
        <td>${escHtml((d.indexed_at || '').replace('T', ' '))}</td>
        <td>
          <details>
            <summary>路徑 / SHA / 命中</summary>
            <pre>${escHtml(d.path)}
sha256: ${escHtml((d.sha256 || '').slice(0, 16))}…
hits: ${escHtml(JSON.stringify(d.hits || {}, null, 2))}</pre>
          </details>
        </td>
      </tr>
    `;
  }).join('');
}

document.getElementById('q').addEventListener('input', applyFilters);
document.getElementById('filter').addEventListener('change', applyFilters);
document.getElementById('kind').addEventListener('change', applyFilters);

load();
setInterval(load, 15000); // 每 15 秒自動重新載入
</script>
</body>
</html>
