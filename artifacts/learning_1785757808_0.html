<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1018" />
  <title>Flowcraft · DAG Workflow Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
  <style>
    :root {
      --ink: #e9edf5;
      --muted: #8994a6;
      --muted-2: #5f6b7e;
      --paper: #0b1018;
      --surface: #111823;
      --surface-2: #151e2b;
      --surface-3: #1c2736;
      --rule: rgba(177, 195, 221, .13);
      --rule-strong: rgba(177, 195, 221, .22);
      --accent: #e7c27a;
      --accent-soft: rgba(231, 194, 122, .12);
      --green: #8fd3b2;
      --red: #ed8f8f;
      --blue: #8db4e8;
      --display: "Space Grotesk", sans-serif;
      --body: "DM Sans", sans-serif;
      --mono: "DM Mono", monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --dur: 180ms;
    }
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; width: 100%; overflow-x: clip; }
    body { background: var(--paper); color: var(--ink); font-family: var(--body); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app { min-height: 100vh; display: grid; grid-template-rows: 64px minmax(0, 1fr); background: radial-gradient(circle at 78% 0%, rgba(82, 112, 157, .13), transparent 32%), var(--paper); }
    .topbar { border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 22px; background: rgba(11,16,24,.92); backdrop-filter: blur(18px); z-index: 20; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 220px; }
    .brand-mark { width: 30px; height: 30px; border: 1px solid var(--accent); display: grid; place-items: center; color: var(--accent); transform: rotate(45deg); }
    .brand-mark span { transform: rotate(-45deg); font-family: var(--mono); font-size: 11px; }
    .brand-copy { line-height: 1.05; }
    .brand-copy strong { display: block; font-family: var(--display); font-size: 14px; letter-spacing: .03em; }
    .brand-copy small { display: block; color: var(--muted); font-family: var(--mono); font-size: 10px; margin-top: 4px; }
    .workflow-name { display: flex; align-items: center; gap: 8px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .workflow-name input { background: transparent; border: 0; color: var(--ink); width: 180px; padding: 7px 4px; border-bottom: 1px solid transparent; }
    .workflow-name input:hover, .workflow-name input:focus { border-color: var(--rule-strong); outline: 0; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .btn { border: 1px solid var(--rule-strong); background: transparent; color: var(--ink); padding: 8px 12px; border-radius: 6px; font-size: 12px; display: inline-flex; gap: 8px; align-items: center; transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform 100ms var(--ease); white-space: nowrap; }
    .btn:hover { background: var(--surface-3); border-color: rgba(231,194,122,.45); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { color: #1a160e; background: var(--accent); border-color: var(--accent); font-weight: 700; }
    .btn.primary:hover { background: #f0d291; }
    .btn.subtle { color: var(--muted); border-color: transparent; }
    .btn.danger { color: var(--red); }
    .icon { width: 14px; height: 14px; display: inline-block; }
    .workspace { min-height: 0; display: grid; grid-template-columns: 224px minmax(0,1fr) 286px; }
    .sidebar, .inspector { min-height: 0; background: rgba(17,24,35,.88); }
    .sidebar { border-right: 1px solid var(--rule); padding: 18px 14px; overflow-y: auto; }
    .inspector { border-left: 1px solid var(--rule); padding: 18px 16px; overflow-y: auto; }
    .panel-label { color: var(--muted-2); font-family: var(--mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; margin: 0 8px 12px; }
    .palette { display: grid; gap: 8px; }
    .palette-item { width: 100%; padding: 11px 10px; display: flex; align-items: center; gap: 10px; text-align: left; color: var(--ink); border: 1px solid var(--rule); background: rgba(28,39,54,.54); border-radius: 6px; transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
    .palette-item:hover { transform: translateX(3px); background: var(--surface-3); border-color: var(--rule-strong); }
    .palette-item small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .type-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .type-dot.trigger { background: var(--green); }
    .type-dot.action { background: var(--blue); }
    .type-dot.condition { background: var(--accent); }
    .type-dot.output { background: #ca9fe6; }
    .type-dot.delay { background: #e19b70; }
    .side-section { border-top: 1px solid var(--rule); margin-top: 22px; padding-top: 17px; }
    .side-note { color: var(--muted); font-size: 11px; line-height: 1.6; padding: 0 8px; }
    .side-note strong { color: var(--ink); font-weight: 600; }
    .canvas-wrap { min-width: 0; min-height: 0; position: relative; background-color: #0d141e; background-image: linear-gradient(rgba(157,177,205,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(157,177,205,.055) 1px, transparent 1px); background-size: 28px 28px; }
    .canvas-header { position: absolute; top: 16px; left: 18px; right: 18px; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .canvas-title { pointer-events: auto; }
    .canvas-title h1 { margin: 0; font-family: var(--display); font-size: 18px; letter-spacing: -.02em; }
    .canvas-title p { color: var(--muted); margin: 5px 0 0; font-size: 11px; }
    .canvas-tools { display: flex; gap: 6px; pointer-events: auto; }
    .tool-btn { width: 32px; height: 30px; padding: 0; display: grid; place-items: center; background: rgba(17,24,35,.9); border: 1px solid var(--rule-strong); color: var(--muted); border-radius: 5px; }
    .tool-btn:hover { color: var(--ink); background: var(--surface-3); }
    .react-flow { font-family: var(--body); }
    .react-flow__controls { box-shadow: none; border: 1px solid var(--rule-strong); }
    .react-flow__controls-button { background: var(--surface); border-bottom: 1px solid var(--rule); fill: var(--muted); }
    .react-flow__controls-button:hover { background: var(--surface-3); fill: var(--ink); }
    .react-flow__minimap { background: rgba(17,24,35,.9); border: 1px solid var(--rule); }
    .react-flow__node.selected .flow-node { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(231,194,122,.24); }
    .flow-node { width: 210px; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px; overflow: visible; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
    .node-head { display: flex; align-items: center; gap: 9px; padding: 10px 11px; border-bottom: 1px solid var(--rule); }
    .node-head .type-dot { width: 8px; height: 8px; }
    .node-head strong { font-size: 12px; font-weight: 600; flex: 1; }
    .node-kind { color: var(--muted-2); font-family: var(--mono); font-size: 9px; text-transform: uppercase; }
    .node-body { padding: 10px 11px 12px; }
    .node-body p { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 0; }
    .node-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
    .node-tag { color: var(--muted); background: var(--surface-3); border: 1px solid var(--rule); border-radius: 4px; font-family: var(--mono); font-size: 9px; padding: 3px 5px; }
    .handle { width: 8px; height: 8px; background: var(--paper); border: 1px solid var(--accent); }
    .handle.source { background: var(--accent); }
    .inspector h2 { font-family: var(--display); font-size: 16px; margin: 0 0 4px; }
    .inspector-intro { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 0 0 18px; }
    .status-card { border: 1px solid var(--rule); background: rgba(28,39,54,.46); border-radius: 7px; padding: 12px; margin-bottom: 16px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 11px; margin: 7px 0; }
    .status-row:first-child { margin-top: 0; }
    .status-row:last-child { margin-bottom: 0; }
    .status-row span:first-child { color: var(--muted); }
    .status-good { color: var(--green); }
    .status-warn { color: var(--accent); }
    .status-bad { color: var(--red); }
    .field { margin: 13px 0; }
    .field label { color: var(--muted); display: block; font-family: var(--mono); font-size: 10px; margin-bottom: 6px; }
    .field input, .field textarea, .field select { width: 100%; color: var(--ink); background: var(--surface-2); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 9px; font-size: 12px; }
    .field textarea { min-height: 72px; resize: vertical; line-height: 1.45; }
    .field input:hover, .field textarea:hover, .field select:hover { border-color: var(--rule-strong); }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: 0; }
    .inspector-actions { display: flex; gap: 7px; margin-top: 17px; }
    .inspector-actions .btn { flex: 1; justify-content: center; }
    .empty-inspector { color: var(--muted); font-size: 12px; line-height: 1.65; border: 1px dashed var(--rule-strong); padding: 13px; border-radius: 7px; }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 60; min-width: 240px; max-width: 360px; border: 1px solid var(--rule-strong); background: var(--surface-3); padding: 12px 14px; border-radius: 7px; box-shadow: 0 12px 32px rgba(0,0,0,.25); font-size: 12px; animation: toast-in 180ms var(--ease); }
    .toast.good { border-color: rgba(143,211,178,.5); }
    .toast.bad { border-color: rgba(237,143,143,.55); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .run-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
    .run-line { position: absolute; height: 2px; background: var(--accent); opacity: .75; transform-origin: left center; animation: flow-line 900ms var(--ease) infinite; }
    @keyframes flow-line { from { opacity: .2; } 50% { opacity: 1; } to { opacity: .2; } }
    .legend { position: absolute; bottom: 16px; left: 18px; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(17,24,35,.82); border: 1px solid var(--rule); border-radius: 6px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .legend-item { display: flex; gap: 5px; align-items: center; }
    @media (max-width: 980px) { .workspace { grid-template-columns: 188px minmax(0,1fr); } .inspector { display: none; } .brand { min-width: auto; } .workflow-name { display: none; } }
    @media (max-width: 680px) { .app { grid-template-rows: auto minmax(0,1fr); } .topbar { min-height: 62px; padding: 10px 14px; flex-wrap: wrap; } .top-actions .btn:not(.primary) { display: none; } .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(520px,1fr); } .sidebar { border-right: 0; border-bottom: 1px solid var(--rule); padding: 12px; } .panel-label, .side-section, .side-note { display: none; } .palette { display: flex; overflow-x: auto; padding-bottom: 2px; } .palette-item { min-width: 145px; } .canvas-header { top: 12px; left: 12px; right: 12px; } .canvas-tools { display: none; } .legend { left: 12px; bottom: 12px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useCallback, useMemo, useEffect } = React;
    const RF = window.ReactFlow || window.ReactFlowRenderer || window.ReactFlowRender || {};
    const { ReactFlow, Background, Controls, MiniMap, Handle, Position, addEdge, useNodesState, useEdgesState, MarkerType } = RF;

    const ICONS = {
      plus: '<path d="M12 5v14M5 12h14"/>',
      save: '<path d="M4 4h13l3 3v13H4zM7 4v6h8V4M8 16h8"/>',
      play: '<path d="m8 5 11 7-11 7z"/>',
      download: '<path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14"/>',
      upload: '<path d="M12 16V4m0 0 5 5m-5-5-5 5M5 20h14"/>',
      fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
      trash: '<path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
      link: '<path d="M10 13a5 5 0 0 0 7.1.1l1.4-1.4a5 5 0 0 0-7.1-7.1L10.6 5.4M14 11a5 5 0 0 0-7.1-.1l-1.4 1.4a5 5 0 0 0 7.1 7.1l.8-.8"/>',
      close: '<path d="m6 6 12 12M18 6 6 18"/>',
      check: '<path d="m5 12 4 4L19 6"/>',
      alert: '<path d="M12 8v4m0 4h.01M10.3 4.3 2.9 17a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/>',
      reset: '<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6"/>'
    };
    function Icon({ name, size=15 }) { return <svg className="icon" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html: ICONS[name] || ''}} />; }

    const TYPE_META = {
      trigger: { label: 'Trigger', title: 'Webhook received', description: 'Starts when a signed webhook enters the workflow.', color: '#8fd3b2', tags: ['POST', 'verified'] },
      action: { label: 'Action', title: 'Normalize payload', description: 'Maps incoming fields into the canonical task schema.', color: '#8db4e8', tags: ['transform', 'JSON'] },
      condition: { label: 'Condition', title: 'Priority gate', description: 'Routes urgent requests to the fast lane.', color: '#e7c27a', tags: ['if / else', 'branch'] },
      output: { label: 'Output', title: 'Create ticket', description: 'Writes a ticket to the operations queue.', color: '#ca9fe6', tags: ['queue', 'notify'] },
      delay: { label: 'Delay', title: 'Wait 15 minutes', description: 'Pauses execution before the follow-up action.', color: '#e19b70', tags: ['15 min', 'timer'] }
    };
    const INITIAL_NODES = [
      { id: 'trigger-1', type: 'workflow', position: { x: 80, y: 180 }, data: { kind: 'trigger', label: 'Webhook received', description: TYPE_META.trigger.description, config: { event: 'task.created', secret: 'signature-v2' } } },
      { id: 'action-1', type: 'workflow', position: { x: 370, y: 180 }, data: { kind: 'action', label: 'Normalize payload', description: TYPE_META.action.description, config: { mapping: 'canonical-task-v1' } } },
      { id: 'condition-1', type: 'workflow', position: { x: 670, y: 180 }, data: { kind: 'condition', label: 'Priority gate', description: TYPE_META.condition.description, config: { expression: 'priority === high' } } },
      { id: 'output-1', type: 'workflow', position: { x: 980, y: 92 }, data: { kind: 'output', label: 'Create ticket', description: TYPE_META.output.description, config: { queue: 'operations' } } },
      { id: 'delay-1', type: 'workflow', position: { x: 980, y: 280 }, data: { kind: 'delay', label: 'Wait 15 minutes', description: TYPE_META.delay.description, config: { minutes: 15 } } }
    ];
    const INITIAL_EDGES = [
      { id: 'e-trigger-action', source: 'trigger-1', target: 'action-1', type: 'smoothstep', animated: false, markerEnd: { type: MarkerType ? MarkerType.ArrowClosed : 'arrowclosed', color: '#8994a6' } },
      { id: 'e-action-condition', source: 'action-1', target: 'condition-1', type: 'smoothstep', markerEnd: { type: MarkerType ? MarkerType.ArrowClosed : 'arrowclosed', color: '#8994a6' } },
      { id: 'e-condition-output', source: 'condition-1', target: 'output-1', sourceHandle: 'true', type: 'smoothstep', label: 'true', markerEnd: { type: MarkerType ? MarkerType.ArrowClosed : 'arrowclosed', color: '#8994a6' } },
      { id: 'e-condition-delay', source: 'condition-1', target: 'delay-1', sourceHandle: 'false', type: 'smoothstep', label: 'false', markerEnd: { type: MarkerType ? MarkerType.ArrowClosed : 'arrowclosed', color: '#8994a6' } }
    ];

    function WorkflowNode({ data, selected }) {
      const meta = TYPE_META[data.kind];
      const isCondition = data.kind === 'condition';
      return <div className="flow-node">
        <Handle className="handle" type="target" position={Position.Left} />
        <div className="node-head"><span className={'type-dot ' + data.kind}></span><strong>{data.label}</strong><span className="node-kind">{meta.label}</span></div>
        <div className="node-body"><p>{data.description}</p><div className="node-meta">{meta.tags.map(tag => <span className="node-tag" key={tag}>{tag}</span>)}</div></div>
        {isCondition ? <><Handle id="true" className="handle source" type="source" position={Position.Right} style={{ top: '34%' }} /><Handle id="false" className="handle source" type="source" position={Position.Right} style={{ top: '72%' }} /></> : <Handle className="handle source" type="source" position={Position.Right} />}
      </div>;
    }
    const nodeTypes = { workflow: WorkflowNode };

    function hasPath(edges, start, goal, ignoredEdgeId) {
      const seen = new Set([start]); const stack = [start];
      while (stack.length) { const cur = stack.pop(); for (const edge of edges) { if (edge.id === ignoredEdgeId) continue; if (edge.source === cur && !seen.has(edge.target)) { if (edge.target === goal) return true; seen.add(edge.target); stack.push(edge.target); } } }
      return false;
    }
    function validateDag(nodes, edges) {
      const indegree = Object.fromEntries(nodes.map(n => [n.id, 0]));
      for (const e of edges) { if (e.source === e.target) return { ok: false, message: 'Self-loop detected: a node cannot connect to itself.' }; if (!(e.target in indegree)) return { ok: false, message: 'Edge points to a missing node.' }; indegree[e.target]++; }
      const queue = nodes.filter(n => indegree[n.id] === 0).map(n => n.id); let visited = 0;
      while (queue.length) { const id = queue.shift(); visited++; for (const e of edges.filter(x => x.source === id)) { indegree[e.target]--; if (indegree[e.target] === 0) queue.push(e.target); } }
      return visited === nodes.length ? { ok: true, message: 'Valid DAG · no circular dependencies.' } : { ok: false, message: 'Cycle detected · connection rejected.' };
    }
    function newNode(kind, index) { const meta = TYPE_META[kind]; return { id: kind + '-' + Date.now(), type: 'workflow', position: { x: 160 + (index % 3) * 280, y: 120 + Math.floor(index / 3) * 190 }, data: { kind, label: meta.title, description: meta.description, config: {} } }; }

    function App() {
      const [nodes, setNodes, onNodesChange] = useNodesState(INITIAL_NODES);
      const [edges, setEdges, onEdgesChange] = useEdgesState(INITIAL_EDGES);
      const [selectedId, setSelectedId] = useState(null);
      const [workflowName, setWorkflowName] = useState('Intake → triage → operations');
      const [toast, setToast] = useState(null);
      const [running, setRunning] = useState(false);
      const [runState, setRunState] = useState({});
      const [rfInstance, setRfInstance] = useState(null);
      const [fileInput] = useState(() => document.createElement('input'));
      const selectedNode = nodes.find(n => n.id === selectedId);
      const validation = useMemo(() => validateDag(nodes, edges), [nodes, edges]);
      const notify = useCallback((message, tone='good') => { setToast({message, tone}); window.clearTimeout(window.__flowToast); window.__flowToast = window.setTimeout(() => setToast(null), 3000); }, []);
      const onConnect = useCallback((connection) => {
        const candidate = { ...connection, id: 'e-' + Date.now(), type: 'smoothstep', markerEnd: { type: MarkerType ? MarkerType.ArrowClosed : 'arrowclosed', color: '#8994a6' } };
        if (connection.source === connection.target || hasPath(edges, connection.target, connection.source)) { notify('Connection rejected · this edge would create a cycle.', 'bad'); return; }
        setEdges(existing => addEdge(candidate, existing)); notify('Edge connected · DAG remains acyclic.');
      }, [edges, notify, setEdges]);
      const addNode = useCallback((kind) => { setNodes(existing => [...existing, newNode(kind, existing.length)]); notify(TYPE_META[kind].label + ' node added.'); }, [notify, setNodes]);
      const updateSelected = (patch) => setNodes(existing => existing.map(n => n.id === selectedId ? { ...n, data: { ...n.data, ...patch } } : n));
      const deleteSelected = () => { if (!selectedId) return; setNodes(ns => ns.filter(n => n.id !== selectedId)); setEdges(es => es.filter(e => e.source !== selectedId && e.target !== selectedId)); setSelectedId(null); notify('Node removed.'); };
      const save = () => { const payload = { version: 1, workflowName, nodes, edges, savedAt: new Date().toISOString() }; localStorage.setItem('flowcraft-workflow', JSON.stringify(payload)); notify('Workflow saved locally.'); };
      const exportJson = () => { const payload = JSON.stringify({ version: 1, workflowName, nodes, edges }, null, 2); const blob = new Blob([payload], {type: 'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'flowcraft-workflow.json'; a.click(); URL.revokeObjectURL(url); notify('Workflow JSON exported.'); };
      const importJson = () => { fileInput.accept = '.json,application/json'; fileInput.onchange = e => { const f = e.target.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = () => { try { const p = JSON.parse(reader.result); const check = validateDag(p.nodes || [], p.edges || []); if (!check.ok) throw new Error(check.message); setNodes(p.nodes || []); setEdges(p.edges || []); setWorkflowName(p.workflowName || 'Imported workflow'); notify('Workflow imported.'); } catch (err) { notify('Import failed · ' + err.message, 'bad'); } }; reader.readAsText(f); }; fileInput.click(); };
      const reset = () => { setNodes(INITIAL_NODES); setEdges(INITIAL_EDGES); setSelectedId(null); setRunState({}); notify('Canvas reset.'); };
      const run = () => { if (!validation.ok) { notify(validation.message, 'bad'); return; } setRunning(true); setRunState({}); const ordered = []; const indegree = Object.fromEntries(nodes.map(n => [n.id, 0])); edges.forEach(e => indegree[e.target]++); const q = nodes.filter(n => !indegree[n.id]).map(n => n.id); while (q.length) { const id=q.shift(); ordered.push(id); edges.filter(e=>e.source===id).forEach(e=>{indegree[e.target]--; if(!indegree[e.target]) q.push(e.target);}); } ordered.forEach((id, i) => setTimeout(() => { setRunState(s => ({...s, [id]: 'done'})); if (i === ordered.length - 1) { setRunning(false); notify('Run completed · ' + ordered.length + ' nodes traversed.'); } }, i * 520 + 250)); };
      useEffect(() => { const saved = localStorage.getItem('flowcraft-workflow'); if (!saved) return; try { const p=JSON.parse(saved); if (p.nodes && p.edges && validateDag(p.nodes,p.edges).ok) { setNodes(p.nodes); setEdges(p.edges); setWorkflowName(p.workflowName || workflowName); } } catch (_) {} }, []);
      useEffect(() => { setEdges(es => es.map(e => ({...e, animated: running && (!!runState[e.source] || !!runState[e.target])}))); }, [running, runState, setEdges]);
      if (!ReactFlow) return <div style={{padding: 30, color: '#e9edf5', background: '#0b1018', minHeight: '100vh', fontFamily: 'sans-serif'}}>React Flow failed to load. Check network access and reload.</div>;
      return <div className="app">
        <header className="topbar">
          <div className="brand"><div className="brand-mark"><span>F</span></div><div className="brand-copy"><strong>FLOWCRAFT</strong><small>DAG WORKFLOW STUDIO</small></div></div>
          <label className="workflow-name"><span>WORKFLOW /</span><input value={workflowName} onChange={e=>setWorkflowName(e.target.value)} aria-label="Workflow name" /></label>
          <div className="top-actions"><button className="btn subtle" onClick={reset}><Icon name="reset"/>Reset</button><button className="btn" onClick={exportJson}><Icon name="download"/>Export</button><button className="btn" onClick={importJson}><Icon name="upload"/>Import</button><button className="btn" onClick={save}><Icon name="save"/>Save</button><button className="btn primary" onClick={run} disabled={running}><Icon name="play"/>{running ? 'Running…' : 'Run workflow'}</button></div>
        </header>
        <main className="workspace">
          <aside className="sidebar"><p className="panel-label">Node palette</p><div className="palette">{Object.entries(TYPE_META).map(([kind, meta]) => <button className="palette-item" key={kind} onClick={()=>addNode(kind)} draggable onDragStart={e=>e.dataTransfer.setData('application/flowcraft-node',kind)}><span className={'type-dot '+kind}></span><span><strong>{meta.label}</strong><small>{meta.title}</small></span><Icon name="plus" size={14}/></button>)}</div><div className="side-section"><p className="panel-label">Editor guide</p><p className="side-note"><strong>Drag</strong> nodes to arrange the graph.<br/><br/><strong>Connect</strong> handles to create dependencies. Cycles are rejected before they enter the graph.<br/><br/><strong>Select</strong> any node to edit its label and configuration.</p></div></aside>
          <section className="canvas-wrap"><div className="canvas-header"><div className="canvas-title"><h1>Workflow canvas</h1><p>Design dependencies visually. Execute only valid directed acyclic graphs.</p></div><div className="canvas-tools"><button className="tool-btn" title="Fit view" onClick={()=>rfInstance?.fitView({padding:.2,duration:350})}><Icon name="fit"/></button><button className="tool-btn" title="Save" onClick={save}><Icon name="save"/></button></div></div><div className="run-overlay"></div><ReactFlow nodes={nodes.map(n=>({...n, className: runState[n.id] ? 'node-complete' : ''}))} edges={edges} onNodesChange={onNodesChange} onEdgesChange={onEdgesChange} onConnect={onConnect} onNodeClick={(_,n)=>setSelectedId(n.id)} onPaneClick={()=>setSelectedId(null)} onInit={setRfInstance} nodeTypes={nodeTypes} fitView fitViewOptions={{padding:.2}} minZoom={.3} maxZoom={1.6} defaultEdgeOptions={{type:'smoothstep'}}><Background color="#2a384b" gap={28} size={1}/><Controls showInteractive={false}/><MiniMap nodeColor={n=>TYPE_META[n.data?.kind]?.color || '#8994a6'} maskColor="rgba(11,16,24,.75)"/></ReactFlow><div className="legend"><span className="legend-item"><span className="type-dot trigger"></span>start</span><span className="legend-item"><span className="type-dot condition"></span>branch</span><span className="legend-item"><span className="type-dot output"></span>output</span></div></section>
          <aside className="inspector"><h2>Inspector</h2><p className="inspector-intro">Graph health, selected node properties, and execution state.</p><div className="status-card"><div className="status-row"><span>Graph status</span><strong className={validation.ok?'status-good':'status-bad'}><Icon name={validation.ok?'check':'alert'} size={12}/> {validation.ok?'VALID DAG':'INVALID'}</strong></div><div className="status-row"><span>Nodes</span><strong>{nodes.length}</strong></div><div className="status-row"><span>Connections</span><strong>{edges.length}</strong></div><div className="status-row"><span>Execution</span><strong className={running?'status-warn':'status-good'}>{running?'IN PROGRESS':'READY'}</strong></div></div>{selectedNode ? <><p className="panel-label" style={{marginLeft:0}}>Selected node</p><div className="field"><label>LABEL</label><input value={selectedNode.data.label} onChange={e=>updateSelected({label:e.target.value})}/></div><div className="field"><label>TYPE</label><select value={selectedNode.data.kind} onChange={e=>updateSelected({kind:e.target.value})}>{Object.keys(TYPE_META).map(k=><option value={k} key={k}>{TYPE_META[k].label}</option>)}</select></div><div className="field"><label>DESCRIPTION</label><textarea value={selectedNode.data.description} onChange={e=>updateSelected({description:e.target.value})}/></div><div className="field"><label>CONFIGURATION</label><textarea value={JSON.stringify(selectedNode.data.config || {}, null, 2)} onChange={e=>{try{updateSelected({config:JSON.parse(e.target.value)})}catch(_){}}}/></div><div className="inspector-actions"><button className="btn danger" onClick={deleteSelected}><Icon name="trash"/>Delete node</button><button className="btn" onClick={()=>setSelectedId(null)}><Icon name="close"/>Close</button></div></> : <div className="empty-inspector"><strong>No node selected.</strong><br/>Choose a node on the canvas to inspect its parameters, or drag a new node from the palette.</div>}</aside>
        </main>{toast && <div className={'toast '+toast.tone} role="status">{toast.message}</div>}
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
