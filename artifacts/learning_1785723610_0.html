<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowframe — Workflow Control Surface</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
  <script>
    window.ReactFlowAPI = window.ReactFlow;
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root {
      --ink: #08111c; --ink-2: #0d1a27; --panel: #102131; --panel-2: #142b3c;
      --line: rgba(184, 221, 226, .16); --line-strong: rgba(184, 221, 226, .28);
      --text: #e9f2f0; --muted: #8da6ad; --lime: #d8fb69; --cyan: #62dbe0;
      --orange: #ffad5c; --red: #ff7373; --purple: #c0a2ff;
    }
    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: var(--ink); color: var(--text); font-family: 'Manrope', sans-serif; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .23; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 32px 32px; mask-image: linear-gradient(to bottom, #000, transparent 90%); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-rows: 68px 1fr; position: relative; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding: 0 28px; border-bottom: 1px solid var(--line); background: rgba(8,17,28,.88); backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 20; }
    .brand { display:flex; align-items:center; gap: 12px; letter-spacing: -.04em; }
    .brand-mark { width: 31px; height: 31px; border: 1px solid var(--lime); color: var(--lime); display:grid; place-items:center; transform: rotate(45deg); }
    .brand-mark span { transform: rotate(-45deg); font-weight:800; font-size: 13px; }
    .brand-name { font-size: 16px; font-weight: 800; }
    .brand-name em { font-style:normal; color:var(--lime); font-weight:500; }
    .top-actions { display:flex; gap: 10px; align-items:center; }
    .tiny-meta { color: var(--muted); font: 11px 'DM Mono', monospace; letter-spacing: .08em; margin-right: 12px; }
    .btn { border: 1px solid var(--line-strong); color: var(--text); background: transparent; border-radius: 6px; padding: 9px 13px; display:inline-flex; gap:8px; align-items:center; transition: .18s ease; font-size: 12px; font-weight:700; }
    .btn:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-1px); }
    .btn.primary { color: var(--ink); background: var(--lime); border-color: var(--lime); }
    .btn.primary:hover { background:#e6ff92; color:var(--ink); box-shadow: 0 0 24px rgba(216,251,105,.25); }
    .btn.ghost { border-color: transparent; color: var(--muted); }
    .layout { display:grid; grid-template-columns: 236px minmax(520px, 1fr) 318px; min-height: calc(100vh - 68px); }
    .sidebar, .inspector { background: rgba(10,23,35,.76); }
    .sidebar { border-right:1px solid var(--line); padding: 22px 15px; }
    .inspector { border-left:1px solid var(--line); padding: 20px 18px; overflow:auto; }
    .section-kicker { color:var(--muted); font: 10px 'DM Mono', monospace; text-transform:uppercase; letter-spacing:.18em; margin: 0 10px 12px; }
    .nav-item { width:100%; display:flex; align-items:center; justify-content:space-between; border:0; color:var(--muted); background:transparent; border-radius:7px; padding: 11px 10px; text-align:left; font-size:12px; margin-bottom:3px; }
    .nav-item > span:first-child { display:flex; align-items:center; gap:10px; }
    .nav-item:hover, .nav-item.active { color:var(--text); background: rgba(98,219,224,.08); }
    .nav-item.active { box-shadow: inset 2px 0 var(--cyan); }
    .count { font: 10px 'DM Mono', monospace; color:var(--muted); }
    .workspaces { border-top:1px solid var(--line); margin-top: 23px; padding-top:21px; }
    .workspace-card { border:1px solid var(--line); border-radius:8px; padding:13px; margin: 0 3px 22px; background: linear-gradient(135deg, rgba(216,251,105,.08), rgba(98,219,224,.04)); }
    .workspace-card strong { display:block; font-size:12px; margin-bottom:6px; }
    .workspace-card p { font: 10px 'DM Mono', monospace; color:var(--muted); margin:0; }
    .online { color:var(--lime); font-size:10px; margin-top:12px; display:flex; gap:6px; align-items:center; }
    .online::before { content:''; width:6px; height:6px; background:var(--lime); border-radius:50%; box-shadow: 0 0 9px var(--lime); }
    .palette-title { margin-top:28px; }
    .palette-item { border:1px solid var(--line); background:rgba(255,255,255,.025); border-radius:7px; padding:10px; display:flex; align-items:center; gap:10px; margin:7px 3px; color:var(--text); font-size:11px; transition:.18s; }
    .palette-item:hover { border-color:var(--line-strong); background:rgba(255,255,255,.06); transform:translateX(3px); }
    .palette-icon { width:24px; height:24px; display:grid; place-items:center; border-radius:5px; }
    .i-trigger { background:rgba(216,251,105,.15); color:var(--lime); } .i-task { background:rgba(98,219,224,.14); color:var(--cyan); } .i-approval { background:rgba(255,173,92,.14); color:var(--orange); } .i-form { background:rgba(192,162,255,.14); color:var(--purple); }
    .canvas-wrap { display:flex; flex-direction:column; min-width:0; background: #0b1925; }
    .canvas-head { height:79px; display:flex; align-items:center; justify-content:space-between; padding: 0 25px; border-bottom:1px solid var(--line); background:rgba(13,26,39,.74); }
    .canvas-title h1 { font-size:17px; letter-spacing:-.04em; margin:0 0 5px; }
    .canvas-title p { color:var(--muted); font: 10px 'DM Mono', monospace; margin:0; }
    .head-tools { display:flex; align-items:center; gap:8px; }
    .select { background:var(--panel); border:1px solid var(--line-strong); color:var(--text); border-radius:5px; padding:8px 10px; font-size:11px; }
    .flow-area { flex:1; min-height:610px; position:relative; }
    .flow-area .react-flow { background: radial-gradient(circle at 48% 42%, rgba(98,219,224,.055), transparent 32%); }
    .react-flow__node { font-family:'Manrope',sans-serif; }
    .react-flow__edge-path { stroke: #62818d; stroke-width: 1.6; }
    .react-flow__connectionline { stroke:var(--lime); }
    .react-flow__controls { box-shadow:none; border:1px solid var(--line); }
    .react-flow__controls-button { background:var(--panel); border-color:var(--line); fill:var(--muted); }
    .react-flow__minimap { background:var(--panel); border:1px solid var(--line); }
    .node-card { width:190px; background:rgba(17,38,53,.97); border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; box-shadow: 0 14px 25px rgba(0,0,0,.2); }
    .node-card.selected { border-color:var(--lime); box-shadow: 0 0 0 1px rgba(216,251,105,.2), 0 14px 30px rgba(0,0,0,.3); }
    .node-accent { height:3px; background:var(--cyan); } .node-accent.trigger { background:var(--lime); } .node-accent.approval { background:var(--orange); } .node-accent.form { background:var(--purple); } .node-accent.end { background:var(--red); }
    .node-body { padding:11px 13px 12px; }
    .node-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .node-type { color:var(--muted); font: 9px 'DM Mono', monospace; text-transform:uppercase; letter-spacing:.1em; }
    .node-icon { color:var(--cyan); } .node-icon.trigger { color:var(--lime); } .node-icon.approval {color:var(--orange);} .node-icon.form {color:var(--purple);} .node-icon.end {color:var(--red);}
    .node-label { font-size:12px; font-weight:800; letter-spacing:-.02em; margin-bottom:5px; }
    .node-sub { color:var(--muted); font: 9px 'DM Mono', monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .node-footer { border-top:1px solid var(--line); margin-top:11px; padding-top:8px; display:flex; justify-content:space-between; color:var(--muted); font:9px 'DM Mono', monospace; }
    .node-footer b { color:var(--lime); font-weight:400; }
    .handle { width:7px!important; height:7px!important; border:2px solid var(--ink)!important; background:var(--cyan)!important; }
    .handle.trigger { background:var(--lime)!important; }
    .status-strip { position:absolute; z-index:5; left:20px; bottom:17px; display:flex; gap:8px; }
    .status-chip { display:flex; align-items:center; gap:7px; border:1px solid var(--line); background:rgba(10,23,35,.88); padding:7px 9px; border-radius:5px; color:var(--muted); font:9px 'DM Mono', monospace; backdrop-filter: blur(6px); }
    .status-chip b { color:var(--text); font-weight:500; }
    .dot { width:5px; height:5px; border-radius:50%; background:var(--lime); }
    .inspector-head { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:15px; margin-bottom:19px; }
    .inspector-head h2 { font-size:15px; letter-spacing:-.04em; margin:0 0 5px; }
    .inspector-head p { color:var(--muted); font:9px 'DM Mono', monospace; margin:0; }
    .close { border:0; background:transparent; color:var(--muted); padding:2px; }
    .close:hover { color:var(--text); }
    .field-label { display:flex; justify-content:space-between; color:var(--muted); font:9px 'DM Mono',monospace; letter-spacing:.1em; text-transform:uppercase; margin:18px 0 8px; }
    .text-input { width:100%; border:1px solid var(--line); background:rgba(255,255,255,.035); color:var(--text); border-radius:5px; padding:10px; outline:none; font-size:11px; }
    .text-input:focus { border-color:var(--cyan); box-shadow:0 0 0 2px rgba(98,219,224,.1); }
    .rule { border-top:1px solid var(--line); margin:19px 0; }
    .role-row { display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.025); border:1px solid var(--line); padding:9px 10px; border-radius:5px; margin-bottom:6px; }
    .role-info { display:flex; align-items:center; gap:9px; font-size:11px; }
    .role-avatar { width:22px; height:22px; display:grid; place-items:center; border-radius:50%; font-size:9px; font-weight:800; color:var(--ink); background:var(--lime); }
    .role-avatar.blue { background:var(--cyan); } .role-avatar.orange {background:var(--orange);}
    .role-info small { display:block; color:var(--muted); font:8px 'DM Mono',monospace; margin-top:2px; }
    .toggle { width:28px; height:16px; border-radius:12px; background:#2a404d; border:0; padding:2px; transition:.2s; }
    .toggle span { display:block; width:12px; height:12px; border-radius:50%; background:#77909a; transition:.2s; }
    .toggle.on { background:var(--lime); } .toggle.on span { transform:translateX(12px); background:var(--ink); }
    .builder-box { border:1px solid var(--line); border-radius:7px; overflow:hidden; }
    .builder-header { display:flex; justify-content:space-between; align-items:center; padding:10px; background:rgba(255,255,255,.035); }
    .builder-header strong { font-size:11px; } .builder-header span { color:var(--muted); font:9px 'DM Mono',monospace; }
    .builder-item { display:flex; align-items:center; gap:8px; padding:10px; border-top:1px solid var(--line); font-size:10px; }
    .drag { color:var(--muted); } .builder-item em { color:var(--purple); font:9px 'DM Mono',monospace; margin-left:auto; font-style:normal; }
    .add-field { color:var(--cyan); border:0; background:transparent; padding:10px; width:100%; text-align:left; font-size:10px; border-top:1px dashed var(--line); }
    .add-field:hover { background:rgba(98,219,224,.06); }
    .inspector-actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:19px; }
    .empty-inspector { color:var(--muted); font-size:12px; line-height:1.7; padding:24px 8px; }
    .toast { position:fixed; right:24px; bottom:22px; z-index:50; background:var(--lime); color:var(--ink); border-radius:6px; padding:12px 15px; font-size:11px; font-weight:800; box-shadow: 0 12px 30px rgba(0,0,0,.3); animation: rise .22s ease-out; }
    @keyframes rise { from { transform:translateY(10px); opacity:0; } to {transform:translateY(0);opacity:1;} }
    @media (max-width: 1050px) { .layout { grid-template-columns: 190px minmax(500px,1fr); } .inspector { grid-column:1 / -1; border-left:0; border-top:1px solid var(--line); min-height:400px; } }
    @media (max-width: 720px) { .layout { display:block; } .sidebar { display:none; } .topbar { padding:0 15px; } .tiny-meta { display:none; } .flow-area { min-height:550px; } .canvas-head { padding:0 15px; } .head-tools .btn:not(.primary) { display:none; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useMemo, useCallback, useEffect } = React;
  const RF = window.ReactFlowAPI || window.ReactFlow || window.ReactFlowRenderer;
  const { ReactFlow, Background, Controls, MiniMap, Handle, Position, addEdge } = RF;
  const icons = { trigger:'zap', task:'layers-3', approval:'shield-check', form:'file-pen-line', end:'flag', workflow:'workflow', plus:'plus', save:'save', play:'play', x:'x', grip:'grip-vertical', users:'users', settings:'settings', layout:'layout-dashboard', database:'database', history:'history', chevron:'chevron-right', eye:'eye', lock:'lock-keyhole', check:'check', copy:'copy' };
  const Icon = ({ name, size=15, className='' }) => <i data-lucide={icons[name] || name} className={className} style={{width:size,height:size}}></i>;

  const initialNodes = [
    { id:'start', type:'custom', position:{x:50,y:175}, data:{kind:'trigger', label:'案件建立', subtitle:'表單送出時觸發', owner:'所有員工', rule:'AUTO'} },
    { id:'validate', type:'custom', position:{x:300,y:110}, data:{kind:'task', label:'資料完整性檢查', subtitle:'HR Operations', owner:'HR 專員', rule:'3 rules'} },
    { id:'approval', type:'custom', position:{x:300,y:295}, data:{kind:'approval', label:'主管審核', subtitle:'Department Lead', owner:'處室主管', rule:'RBAC'} },
    { id:'form', type:'custom', position:{x:565,y:110}, data:{kind:'form', label:'補件表單', subtitle:'Dynamic form v2.4', owner:'HR 專員', rule:'4 fields'} },
    { id:'archive', type:'custom', position:{x:565,y:295}, data:{kind:'task', label:'建立人事案件', subtitle:'HRIS / Records', owner:'系統自動化', rule:'API'} },
    { id:'done', type:'custom', position:{x:820,y:205}, data:{kind:'end', label:'流程完成', subtitle:'Notification dispatched', owner:'System', rule:'DONE'} }
  ];
  const initialEdges = [
    {id:'e1',source:'start',target:'validate',animated:true}, {id:'e2',source:'start',target:'approval',label:'需審核'},
    {id:'e3',source:'validate',target:'form',label:'資料不足'}, {id:'e4',source:'validate',target:'archive',label:'通過'},
    {id:'e5',source:'approval',target:'archive',label:'核准'}, {id:'e6',source:'form',target:'validate',label:'重新檢查'},
    {id:'e7',source:'archive',target:'done',animated:true}
  ];
  const roleDefaults = { employee:true, hr:true, lead:false };

  function CustomNode({data, selected}) {
    return <div className={'node-card '+(selected?'selected':'')}>
      <Handle type="target" position={Position.Left} className={'handle '+data.kind} />
      <div className={'node-accent '+data.kind}></div>
      <div className="node-body">
        <div className="node-top"><span className="node-type">{data.kind}</span><Icon name={data.kind} size={15} className={'node-icon '+data.kind}/></div>
        <div className="node-label">{data.label}</div><div className="node-sub">{data.subtitle}</div>
        <div className="node-footer"><span>{data.owner}</span><b>{data.rule}</b></div>
      </div>
      <Handle type="source" position={Position.Right} className={'handle '+data.kind} />
    </div>
  }
  const nodeTypes = { custom: CustomNode };

  function App(){
    const [nodes,setNodes] = useState(initialNodes); const [edges,setEdges] = useState(initialEdges);
    const [selectedId,setSelectedId] = useState('approval'); const [roles,setRoles] = useState(roleDefaults);
    const [fields,setFields] = useState(['員工姓名','申請類型','生效日期']); const [toast,setToast] = useState('');
    const [activeNav,setActiveNav] = useState('流程設計器'); const [version,setVersion] = useState('v2.4 · Draft');
    const selected = nodes.find(n=>n.id===selectedId) || null;
    const showToast = (text) => { setToast(text); window.clearTimeout(window.__toast); window.__toast=window.setTimeout(()=>setToast(''),2400); };
    const onNodesChange = useCallback((changes)=>setNodes(ns=>RF.applyNodeChanges(changes,ns)),[]);
    const onEdgesChange = useCallback((changes)=>setEdges(es=>RF.applyEdgeChanges(changes,es)),[]);
    const onConnect = useCallback((connection)=>{ setEdges(es=>addEdge({...connection, animated:true},es)); showToast('已建立新的流程連線'); },[]);
    const onNodeClick = (_,node)=>setSelectedId(node.id);
    const updateNodeLabel = (value) => setNodes(ns=>ns.map(n=>n.id===selectedId?{...n,data:{...n.data,label:value}}:n));
    const deleteSelected = () => { if(!selected) return; setNodes(ns=>ns.filter(n=>n.id!==selectedId)); setEdges(es=>es.filter(e=>e.source!==selectedId&&e.target!==selectedId)); setSelectedId(null); showToast('節點已移除'); };
    const addPaletteNode = (kind) => { const id=kind+'-'+Date.now(); const labels={trigger:'新觸發器',task:'處理任務',approval:'審批節點',form:'自訂表單'}; const base={kind,label:labels[kind],subtitle:'New workflow step',owner:'未指定',rule:'DRAFT'}; setNodes(ns=>[...ns,{id,type:'custom',position:{x:160+Math.random()*420,y:360+Math.random()*170},data:base}]); setSelectedId(id); showToast('已新增節點，拖曳至畫布定位'); };
    const addField = () => { const next='新欄位 '+(fields.length+1); setFields(f=>[...f,next]); showToast('表單欄位已加入'); };
    const toggleRole = (key) => setRoles(r=>({...r,[key]:!r[key]}));
    const save = () => { setVersion('v2.5 · Saved'); showToast('流程已儲存至草稿版本 v2.5'); };
    useEffect(()=>{ window.lucide && window.lucide.createIcons(); },[nodes,selectedId,fields,roles,toast]);
    return <div className="app">
      <header className="topbar"><div className="brand"><div className="brand-mark"><span>F</span></div><div className="brand-name">FLOW<em>FRAME</em></div></div><div className="top-actions"><span className="tiny-meta">WORKSPACE / HR OPERATIONS</span><button className="btn ghost"><Icon name="history" size={14}/> 變更紀錄</button><button className="btn primary" onClick={save}><Icon name="save" size={14}/> 儲存流程</button></div></header>
      <div className="layout">
        <aside className="sidebar">
          <div className="section-kicker">Workspace</div>
          {[['流程設計器','workflow', ''],['執行監控','activity','12'],['權限與角色','users','5'],['表單資料庫','database','24'],['系統設定','settings','']].map(([label,ico,count])=><button key={label} onClick={()=>setActiveNav(label)} className={'nav-item '+(activeNav===label?'active':'')}><span><Icon name={ico} size={15}/>{label}</span>{count&&<span className="count">{count}</span>}</button>)}
          <div className="workspaces"><div className="section-kicker">Current flow</div><div className="workspace-card"><strong>人事案件申請流程</strong><p>FLOW-HR-024 · {version}</p><div className="online">同步運作中</div></div></div>
          <div className="section-kicker palette-title">Add to canvas</div>
          {[['trigger','觸發器'],['task','處理任務'],['approval','權限審批'],['form','自訂表單']].map(([kind,label])=><button key={kind} className="palette-item" onClick={()=>addPaletteNode(kind)}><span className={'palette-icon i-'+kind}><Icon name={kind} size={14}/></span>{label}<Icon name="plus" size={13} style={{marginLeft:'auto'}}/></button>)}
        </aside>
        <main className="canvas-wrap"><div className="canvas-head"><div className="canvas-title"><h1>{activeNav==='流程設計器'?'人事案件申請流程':activeNav}</h1><p>LAST EDITED 2 MIN AGO · 6 NODES · 7 CONNECTIONS</p></div><div className="head-tools"><select className="select" value={version} onChange={e=>setVersion(e.target.value)}><option>v2.4 · Draft</option><option>v2.3 · Published</option><option>v2.1 · Archived</option></select><button className="btn" onClick={()=>showToast('正在模擬流程執行…')}><Icon name="play" size={13}/> 測試流程</button></div></div><div className="flow-area"><ReactFlow nodes={nodes} edges={edges} nodeTypes={nodeTypes} onNodesChange={onNodesChange} onEdgesChange={onEdgesChange} onConnect={onConnect} onNodeClick={onNodeClick} fitView fitViewOptions={{padding:.22}} deleteKeyCode={['Backspace','Delete']} proOptions={{hideAttribution:true}}><Background gap={24} size={1} color="rgba(141,166,173,.15)"/><Controls/><MiniMap nodeColor={n=>({trigger:'#d8fb69',task:'#62dbe0',approval:'#ffad5c',form:'#c0a2ff',end:'#ff7373'}[n.data?.kind]||'#62818d')} maskColor="rgba(8,17,28,.76)" /></ReactFlow><div className="status-strip"><div className="status-chip"><span className="dot"></span><b>LIVE CANVAS</b></div><div className="status-chip"><span>Edges</span><b>{edges.length}</b></div><div className="status-chip"><span>RBAC</span><b>ENFORCED</b></div></div></div></main>
        <aside className="inspector">{selected?<><div className="inspector-head"><div><h2>節點設定</h2><p>NODE / {selected.data.kind.toUpperCase()} / {selected.id}</p></div><button className="close" onClick={()=>setSelectedId(null)}><Icon name="x" size={15}/></button></div><div className="field-label"><span>顯示名稱</span><span>TEXT</span></div><input className="text-input" value={selected.data.label} onChange={e=>updateNodeLabel(e.target.value)} /><div className="field-label"><span>執行擁有者</span><span>RBAC</span></div><select className="text-input" defaultValue={selected.data.owner}><option>所有員工</option><option>HR 專員</option><option>處室主管</option><option>系統自動化</option></select><div className="rule"></div><div className="field-label"><span>可執行角色</span><span>{Object.values(roles).filter(Boolean).length} / 3 enabled</span></div>{[['employee','一般員工','申請、查看案件','E'],['hr','HR 專員','檢查、補件、建檔','H'],['lead','處室主管','核准、退回','L']].map(([key,label,desc,letter],i)=><div className="role-row" key={key}><div className="role-info"><span className={'role-avatar '+(i===1?'blue':i===2?'orange':'')}>{letter}</span><span>{label}<small>{desc}</small></span></div><button className={'toggle '+(roles[key]?'on':'')} onClick={()=>toggleRole(key)}><span></span></button></div>)}<div className="rule"></div><div className="field-label"><span>表單 schema</span><span>FORM BUILDER</span></div><div className="builder-box"><div className="builder-header"><strong>案件補充資料</strong><span>{fields.length} fields</span></div>{fields.map((field,i)=><div className="builder-item" key={field+i}><Icon name="grip" size={13} className="drag"/><span>{field}</span><em>{i===1?'SELECT':'TEXT'}</em></div>)}<button className="add-field" onClick={addField}>＋ 新增欄位</button></div><div className="inspector-actions"><button className="btn" onClick={deleteSelected}><Icon name="trash-2" size={13}/> 刪除節點</button><button className="btn primary" onClick={()=>showToast('節點設定已套用')}><Icon name="check" size={13}/> 套用變更</button></div></>:<div className="empty-inspector"><Icon name="layout" size={28}/><p>選取畫布上的節點，開始編輯流程步驟、RBAC 角色和動態表單。</p><button className="btn" onClick={()=>setSelectedId('approval')}>選取審批節點 <Icon name="chevron" size={13}/></button></div>}</aside>
      </div>{toast&&<div className="toast">{toast}</div>}
    </div>
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
