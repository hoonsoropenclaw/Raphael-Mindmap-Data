<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>File System Watchdog · 即時監控控制台</title>
<style>
:root {
  --bg: #0a0e14;
  --bg-1: #11161f;
  --bg-2: #1a2230;
  --line: #1f2937;
  --line-2: #2d3748;
  --text: #e6edf3;
  --muted: #7d8590;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --cyan: #39d0d8;
  --orange: #fb8500;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }

/* ─── Header ─── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px; background: var(--bg-1); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 36px; height: 36px; border-radius: 8px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  display: grid; place-items: center; font-size: 20px;
  box-shadow: 0 0 20px rgba(88,166,255,.3);
}
.brand h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
.brand h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12px; }
.header-status { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--muted); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s ease-in-out infinite; }
.status-dot.disconnected { background: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

/* ─── Main 3-col grid ─── */
.main { display: grid; grid-template-columns: 280px 1fr 340px; gap: 1px; background: var(--line); overflow: hidden; }
.panel { background: var(--bg); padding: 16px; overflow-y: auto; }
.panel h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted);
  margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.panel h2 .badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; background: var(--bg-2); color: var(--text); letter-spacing: 0; }
.panel h2 .badge.green { background: rgba(63,185,80,.15); color: var(--green); }
.panel h2 .badge.red { background: rgba(248,81,73,.15); color: var(--red); }

/* watch list */
.watch-list { display: flex; flex-direction: column; gap: 6px; }
.watch-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; background: var(--bg-1); border-radius: 6px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 12px;
}
.watch-item .path { color: var(--cyan); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.watch-item .unwatch {
  background: transparent; border: 1px solid var(--line-2); color: var(--muted);
  padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 8px;
}
.watch-item .unwatch:hover { border-color: var(--red); color: var(--red); }
.add-watch { display: flex; gap: 6px; margin-top: 10px; }
.add-watch input {
  flex: 1; background: var(--bg-1); border: 1px solid var(--line-2); color: var(--text);
  padding: 8px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px;
}
.add-watch input:focus { outline: none; border-color: var(--blue); }
.add-watch button {
  background: var(--blue); color: #fff; border: none; padding: 8px 12px;
  border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 12px;
}
.add-watch button:hover { background: #4a8be0; }
.add-watch button:disabled { background: var(--line-2); cursor: not-allowed; }
.hint { color: var(--muted); font-size: 11px; margin-top: 6px; font-family: var(--mono); }

/* rules */
.rules-list { display: flex; flex-direction: column; gap: 8px; }
.rule {
  padding: 10px; background: var(--bg-1); border-radius: 6px;
  border: 1px solid var(--line);
}
.rule-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.rule-name { font-family: var(--mono); font-size: 12px; color: var(--orange); font-weight: 500; }
.rule-toggle { position: relative; width: 36px; height: 20px; background: var(--line-2); border-radius: 10px; cursor: pointer; transition: .2s; }
.rule-toggle::after { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: .2s; }
.rule-toggle.on { background: var(--green); }
.rule-toggle.on::after { left: 18px; }
.rule-desc { font-size: 11px; color: var(--muted); margin-top: 4px; }
.rule-types { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.rule-type { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--bg-2); font-family: var(--mono); color: var(--muted); }

/* ─── center: events ─── */
.events-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.filter-btn {
  background: var(--bg-1); border: 1px solid var(--line-2); color: var(--muted);
  padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: var(--mono);
}
.filter-btn:hover { border-color: var(--blue); color: var(--text); }
.filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.clear-btn { margin-left: auto; background: transparent; border: 1px solid var(--line-2); color: var(--muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.clear-btn:hover { color: var(--red); border-color: var(--red); }

.event-list { display: flex; flex-direction: column; gap: 4px; }
.event {
  display: grid; grid-template-columns: 70px 70px 1fr;
  gap: 10px; padding: 8px 10px; background: var(--bg-1); border-radius: 4px;
  border-left: 3px solid var(--line-2); font-family: var(--mono); font-size: 12px;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.event .ts { color: var(--muted); }
.event .type { font-weight: 600; padding: 2px 6px; border-radius: 3px; text-align: center; }
.event .type.created { background: rgba(63,185,80,.15); color: var(--green); }
.event .type.modified { background: rgba(88,166,255,.15); color: var(--blue); }
.event .type.deleted { background: rgba(248,81,73,.15); color: var(--red); }
.event .type.moved { background: rgba(188,140,255,.15); color: var(--purple); }
.event .path { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event .path .old { color: var(--muted); }

/* empty */
.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

/* ─── right: actions + stats ─── */
.section { margin-bottom: 20px; }
.action-list { display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow-y: auto; }
.action {
  padding: 8px 10px; background: var(--bg-1); border-radius: 4px;
  border: 1px solid var(--line); font-family: var(--mono); font-size: 11px;
  display: flex; flex-direction: column; gap: 4px;
}
.action .head { display: flex; justify-content: space-between; gap: 8px; }
.action .rule-tag { color: var(--orange); font-weight: 500; }
.action .ts { color: var(--muted); }
.action .result { color: var(--text); word-break: break-all; }
.action .result.backup { color: var(--green); }
.action .result.quarantine { color: var(--red); }
.action .result.skipped { color: var(--muted); }
.action .result.error { color: var(--red); }

.stats { display: flex; flex-direction: column; gap: 4px; }
.stat-row {
  display: grid; grid-template-columns: 1fr auto; gap: 8px;
  padding: 6px 10px; background: var(--bg-1); border-radius: 4px;
  font-family: var(--mono); font-size: 11px; align-items: center;
}
.stat-row .path { color: var(--cyan); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat-row .counts { display: flex; gap: 4px; }
.stat-count { padding: 2px 6px; border-radius: 3px; font-size: 10px; }
.stat-count.created { background: rgba(63,185,80,.15); color: var(--green); }
.stat-count.modified { background: rgba(88,166,255,.15); color: var(--blue); }
.stat-count.deleted { background: rgba(248,81,73,.15); color: var(--red); }
.stat-count.moved { background: rgba(188,140,255,.15); color: var(--purple); }

/* ─── footer simulator ─── */
.footer {
  background: var(--bg-1); border-top: 1px solid var(--line);
  padding: 12px 22px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.footer .label { color: var(--muted); font-size: 12px; margin-right: 8px; }
.sim-btn {
  background: var(--bg-2); border: 1px solid var(--line-2); color: var(--text);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
  transition: .15s;
}
.sim-btn:hover { border-color: var(--blue); background: rgba(88,166,255,.08); }
.sim-btn.create { color: var(--green); }
.sim-btn.modify { color: var(--blue); }
.sim-btn.delete { color: var(--red); }
.sim-btn.move { color: var(--purple); }
.sim-btn.danger { color: var(--orange); }
.sim-btn:disabled { opacity: .4; cursor: not-allowed; }
.sim-btn.loading { opacity: .5; }

/* toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--bg-2); border: 1px solid var(--line-2);
  padding: 10px 16px; border-radius: 6px; box-shadow: var(--shadow);
  font-size: 13px; opacity: 0; transform: translateY(20px);
  transition: all .25s; z-index: 1000; max-width: 400px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { border-color: var(--red); color: var(--red); }
.toast.success { border-color: var(--green); color: var(--green); }

/* scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* responsive */
@media (max-width: 1100px) {
  .main { grid-template-columns: 240px 1fr; }
  .panel.right { display: none; }
}
@media (max-width: 700px) {
  .main { grid-template-columns: 1fr; }
  .panel.left { display: none; }
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-logo">👁</div>
    <h1>File System Watchdog <small>即時監控 · 自動處理 · 可視化控制台</small></h1>
  </div>
  <div class="header-status">
    <span><span id="wsDot" class="status-dot"></span><span id="wsStatus">連線中</span></span>
    <span>事件緩衝: <b id="bufferSize">0</b></span>
    <span>運作時間: <b id="uptime">0s</b></span>
  </div>
</header>

<div class="main">
  <!-- LEFT: watch + rules -->
  <aside class="panel left">
    <section class="section">
      <h2>📂 監控點 <span class="badge" id="watchCount">0</span></h2>
      <div class="watch-list" id="watchList"></div>
      <div class="add-watch">
        <input id="newPath" placeholder="/tmp/test_watchdog" />
        <button id="addWatch">+</button>
      </div>
      <div class="hint">輸入絕對路徑，遞迴監控子目錄</div>
    </section>

    <section class="section">
      <h2>⚙️ 自動化規則 <span class="badge" id="ruleCount">0</span></h2>
      <div class="rules-list" id="rulesList"></div>
    </section>
  </aside>

  <!-- CENTER: events -->
  <main class="panel center">
    <h2>
      📡 即時事件流
      <span class="badge" id="eventCount">0</span>
    </h2>
    <div class="events-toolbar">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="created">建立</button>
      <button class="filter-btn" data-filter="modified">修改</button>
      <button class="filter-btn" data-filter="deleted">刪除</button>
      <button class="filter-btn" data-filter="moved">搬移</button>
      <button class="clear-btn" id="clearEvents">清空畫面</button>
    </div>
    <div class="event-list" id="eventList"></div>
  </main>

  <!-- RIGHT: actions + stats -->
  <aside class="panel right">
    <section class="section">
      <h2>⚡ 自動化動作 <span class="badge green" id="actionCount">0</span></h2>
      <div class="action-list" id="actionList"></div>
    </section>

    <section class="section">
      <h2>📊 路徑統計</h2>
      <div class="stats" id="stats"></div>
    </section>
  </aside>
</div>

<footer class="footer">
  <span class="label">🧪 模擬觸發器（寫入監控點）:</span>
  <button class="sim-btn create" id="simCreate">+ 建檔 hello.txt</button>
  <button class="sim-btn modify" id="simModify">✏ 改檔 hello.txt</button>
  <button class="sim-btn move" id="simMove">↔ 搬檔 hello.txt</button>
  <button class="sim-btn delete" id="simDelete">🗑 刪檔 hello.txt</button>
  <button class="sim-btn danger" id="simQuarantine">⚠ 建危險檔 evil.sh</button>
  <button class="sim-btn" id="simLoad">📦 批次觸發 10 個事件</button>
</footer>

<div id="toast" class="toast"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
// ─── State ───
const state = {
  watching: [],
  rules: [],
  events: [],       // 顯示的事件（可能被過濾）
  allEvents: [],    // 全部事件（含過濾掉的）
  actions: [],
  stats: {},
  filter: 'all',
  startTime: Date.now(),
};

// ─── DOM ───
const $ = id => document.getElementById(id);
const wsDot = $('wsDot');
const wsStatus = $('wsStatus');
const watchList = $('watchList');
const watchCount = $('watchCount');
const rulesList = $('rulesList');
const ruleCount = $('ruleCount');
const eventList = $('eventList');
const eventCount = $('eventCount');
const actionList = $('actionList');
const actionCount = $('actionCount');
const statsEl = $('stats');
const bufferSize = $('bufferSize');
const uptimeEl = $('uptime');
const toast = $('toast');

// ─── Utils ───
function showToast(msg, type='') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.className = 'toast', 2400);
}
function fmtTs(ts) {
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0');
}
function fmtUptime() {
  const s = Math.floor((Date.now() - state.startTime) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm' + (s%60) + 's';
  return Math.floor(s/3600) + 'h' + Math.floor((s%3600)/60) + 'm';
}
setInterval(() => uptimeEl.textContent = fmtUptime(), 1000);

// ─── API ───
async function api(path, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({error: r.statusText}));
    throw new Error(e.error || r.statusText);
  }
  return r.json();
}

async function refreshStatus() {
  const s = await api('/api/status');
  state.watching = s.watching;
  state.rules = s.rules;
  bufferSize.textContent = s.buffer_size;
  renderWatch();
  renderRules();
}

async function refreshEvents() {
  state.allEvents = await api('/api/events?limit=200');
  applyFilter();
}

async function refreshActions() {
  state.actions = await api('/api/actions?limit=30');
  renderActions();
}

async function refreshStats() {
  state.stats = await api('/api/stats');
  renderStats();
}

// ─── Render ───
function renderWatch() {
  watchCount.textContent = state.watching.length;
  if (state.watching.length === 0) {
    watchList.innerHTML = '<div class="empty">尚未監控任何路徑<br>輸入路徑開始監控</div>';
    return;
  }
  watchList.innerHTML = state.watching.map(p => `
    <div class="watch-item">
      <span class="path" title="${p}">${p}</span>
      <button class="unwatch" data-path="${p}">移除</button>
    </div>
  `).join('');
  watchList.querySelectorAll('.unwatch').forEach(b => {
    b.onclick = () => unwatch(b.dataset.path);
  });
}

function renderRules() {
  ruleCount.textContent = state.rules.length;
  rulesList.innerHTML = state.rules.map(r => `
    <div class="rule">
      <div class="rule-head">
        <span class="rule-name">${r.name}</span>
        <div class="rule-toggle ${r.enabled ? 'on' : ''}" data-name="${r.name}"></div>
      </div>
      <div class="rule-desc">${r.description}</div>
      <div class="rule-types">
        ${r.event_types.map(t => `<span class="rule-type">${t}</span>`).join('')}
      </div>
    </div>
  `).join('');
  rulesList.querySelectorAll('.rule-toggle').forEach(t => {
    t.onclick = () => toggleRule(t.dataset.name, !t.classList.contains('on'));
  });
}

function renderEvents() {
  eventCount.textContent = state.events.length;
  if (state.events.length === 0) {
    eventList.innerHTML = '<div class="empty">等待事件...<br>試試底部模擬觸發器</div>';
    return;
  }
  eventList.innerHTML = state.events.slice(-100).reverse().map(e => {
    let pathHtml = `<span class="path">${e.path}</span>`;
    if (e.src_path) {
      pathHtml = `<span class="path"><span class="old">${e.src_path}</span> → ${e.path}</span>`;
    }
    return `
      <div class="event">
        <span class="ts">${fmtTs(e.ts)}</span>
        <span class="type ${e.event_type}">${e.event_type}</span>
        ${pathHtml}
      </div>
    `;
  }).join('');
}

function renderActions() {
  actionCount.textContent = state.actions.length;
  if (state.actions.length === 0) {
    actionList.innerHTML = '<div class="empty">尚無動作</div>';
    return;
  }
  actionList.innerHTML = state.actions.slice().reverse().map(a => {
    let cls = '';
    if (a.result.startsWith('BACKED')) cls = 'backup';
    else if (a.result.startsWith('QUARANTINED')) cls = 'quarantine';
    else if (a.result.startsWith('skipped')) cls = 'skipped';
    else if (a.result.startsWith('ERROR')) cls = 'error';
    return `
      <div class="action">
        <div class="head">
          <span class="rule-tag">[${a.rule}]</span>
          <span class="ts">${fmtTs(a.ts)}</span>
        </div>
        <div class="result ${cls}">${a.result}</div>
        <div class="ts">${a.path}</div>
      </div>
    `;
  }).join('');
}

function renderStats() {
  const paths = Object.keys(state.stats);
  if (paths.length === 0) {
    statsEl.innerHTML = '<div class="empty">尚無數據</div>';
    return;
  }
  statsEl.innerHTML = paths.map(p => {
    const counts = state.stats[p];
    const parts = Object.entries(counts).map(([k,v]) =>
      `<span class="stat-count ${k}">${k[0]}×${v}</span>`
    ).join('');
    return `
      <div class="stat-row">
        <span class="path" title="${p}">${p}</span>
        <span class="counts">${parts}</span>
      </div>
    `;
  }).join('');
}

function applyFilter() {
  if (state.filter === 'all') {
    state.events = [...state.allEvents];
  } else {
    state.events = state.allEvents.filter(e => e.event_type === state.filter);
  }
  renderEvents();
}

// ─── Actions ───
async function addWatch(path) {
  if (!path) { showToast('請輸入路徑', 'error'); return; }
  try {
    await api('/api/watch', 'POST', { path, recursive: true });
    showToast('已加入監控: ' + path, 'success');
    $('newPath').value = '';
    await refreshStatus();
  } catch (e) {
    showToast('失敗: ' + e.message, 'error');
  }
}

async function unwatch(path) {
  await api('/api/unwatch', 'POST', { path });
  showToast('已移除: ' + path);
  await refreshStatus();
}

async function toggleRule(name, enabled) {
  await api('/api/rule/toggle', 'POST', { name, enabled });
  showToast(`${name} ${enabled ? '✓ ON' : '✗ OFF'}`);
  await refreshStatus();
}

// ─── 模擬觸發器（透過 /tmp/test_watchdog）───
async function sim(action) {
  const btn = document.querySelector(`#sim${action}`);
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  try {
    const r = await fetch('/api/sim/' + action.toLowerCase(), { method: 'POST' });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    showToast(`✓ ${action} 觸發完成`);
  } catch (e) {
    showToast('觸發失敗: ' + e.message, 'error');
  } finally {
    if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
  }
}

// ─── Event listeners ───
$('addWatch').onclick = () => addWatch($('newPath').value.trim());
$('newPath').onkeydown = e => { if (e.key === 'Enter') addWatch($('newPath').value.trim()); };
$('clearEvents').onclick = () => { state.allEvents = []; applyFilter(); };
document.querySelectorAll('.filter-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.filter = b.dataset.filter;
    applyFilter();
  };
});
$('simCreate').onclick = () => sim('Create');
$('simModify').onclick = () => sim('Modify');
$('simDelete').onclick = () => sim('Delete');
$('simMove').onclick = () => sim('Move');
$('simQuarantine').onclick = () => sim('Quarantine');
$('simLoad').onclick = () => sim('Load');

// ─── WebSocket ───
const socket = io();
socket.on('connect', () => {
  wsDot.classList.remove('disconnected');
  wsDot.classList.add('connected');
  wsStatus.textContent = '已連線';
});
socket.on('disconnect', () => {
  wsDot.classList.remove('connected');
  wsDot.classList.add('disconnected');
  wsStatus.textContent = '連線中斷';
});
socket.on('fs:event', ev => {
  state.allEvents.push(ev);
  if (state.allEvents.length > 500) state.allEvents = state.allEvents.slice(-500);
  applyFilter();
});
socket.on('fs:action', entry => {
  state.actions.push(entry);
  if (state.actions.length > 100) state.actions = state.actions.slice(-100);
  renderActions();
});

// ─── Initial load ───
(async function init() {
  await refreshStatus();
  await refreshEvents();
  await refreshActions();
  await refreshStats();
  // 定期 refresh 統計與緩衝大小
  setInterval(() => { refreshStatus(); refreshStats(); }, 3000);
  setInterval(() => { refreshEvents(); refreshActions(); }, 5000);
})();
</script>
