  <script type="module">
    import React, { useState, useCallback, useMemo, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      ReactFlow,
      ReactFlowProvider,
      Background,
      Controls,
      MiniMap,
      Handle,
      Position,
      useNodesState,
      useEdgesState,
      addEdge,
      applyNodeChanges,
      applyEdgeChanges,
      MarkerType,
      Panel,
    } from '@xyflow/react';

    /* =========================================================
       DAG VALIDATION (from dag_editor_implementation module)
       ========================================================= */
    function validateDAG(nodes, edges) {
      const visited = new Set();
      const recStack = new Set();

      function dfs(nodeId) {
        if (recStack.has(nodeId)) return false; // cycle!
        if (visited.has(nodeId)) return true;
        visited.add(nodeId);
        recStack.add(nodeId);
        const outgoing = edges.filter(e => e.source === nodeId);
        for (const e of outgoing) {
          if (!dfs(e.target)) return false;
        }
        recStack.delete(nodeId);
        return true;
      }

      for (const n of nodes) {
        if (!dfs(n.id)) return false;
      }
      return true;
    }

    // Find cycles for highlighting
    function findCycleEdges(nodes, edges) {
      const WHITE = 0, GRAY = 1, BLACK = 2;
      const color = new Map(nodes.map(n => [n.id, WHITE]));
      const cycleEdgeIds = new Set();

      function dfs(nodeId, path) {
        color.set(nodeId, GRAY);
        const outgoing = edges.filter(e => e.source === nodeId);
        for (const e of outgoing) {
          if (color.get(e.target) === GRAY) {
            // found a back edge — trace cycle
            const cycleStartIdx = path.indexOf(e.target);
            if (cycleStartIdx !== -1) {
              const cycleNodes = path.slice(cycleStartIdx);
              // mark edges whose source is in cycleNodes and target is in cycleNodes
              for (const ed of edges) {
                if (cycleNodes.includes(ed.source) && cycleNodes.includes(ed.target)) {
                  cycleEdgeIds.add(ed.id);
                }
              }
            }
          } else if (color.get(e.target) === WHITE) {
            dfs(e.target, [...path, e.target]);
          }
        }
        color.set(nodeId, BLACK);
      }

      for (const n of nodes) {
        if (color.get(n.id) === WHITE) {
          dfs(n.id, [n.id]);
        }
      }
      return cycleEdgeIds;
    }

    // Topology — compute execution order
    function topologicalOrder(nodes, edges) {
      const inDegree = new Map(nodes.map(n => [n.id, 0]));
      for (const e of edges) {
        inDegree.set(e.target, (inDegree.get(e.target) || 0) + 1);
      }
      const queue = nodes.filter(n => inDegree.get(n.id) === 0).map(n => n.id);
      const order = [];
      while (queue.length) {
        const id = queue.shift();
        order.push(id);
        const outgoing = edges.filter(e => e.source === id);
        for (const e of outgoing) {
          inDegree.set(e.target, inDegree.get(e.target) - 1);
          if (inDegree.get(e.target) === 0) queue.push(e.target);
        }
      }
      return order;
    }

    /* =========================================================
       CUSTOM NODES (Input / Process / Output)
       ========================================================= */
    const NODE_DEFS = {
      input: {
        label: 'Input',
        icon: '⬇',
        description: '資料來源 / 起點',
        color: 'input',
        inputs: 0,
        outputs: 1,
      },
      process: {
        label: 'Process',
        icon: '⚙',
        description: '轉換 / 處理步驟',
        color: 'process',
        inputs: 1,
        outputs: 1,
      },
      output: {
        label: 'Output',
        icon: '⬆',
        description: '結果 / 終點',
        color: 'output',
        inputs: 1,
        outputs: 0,
      },
    };

    function DagNode({ data, type, selected }) {
      const def = NODE_DEFS[type] || NODE_DEFS.process;
      return (
        React.createElement('div', { className: `dag-node ${selected ? 'selected' : ''}` },
          React.createElement(Handle, {
            type: 'target',
            position: Position.Left,
            style: { visibility: def.inputs > 0 ? 'visible' : 'hidden' }
          }),
          React.createElement('div', { className: `dag-node-header ${def.color}` },
            React.createElement('div', { className: 'dag-node-icon' }, def.icon),
            React.createElement('div', { className: 'dag-node-type' }, def.label)
          ),
          React.createElement('div', { className: 'dag-node-body' },
            React.createElement('div', { className: 'dag-node-label' }, data.label || '未命名'),
            data.config && Object.keys(data.config).length > 0 && React.createElement('div', { className: 'dag-node-meta' },
              Object.entries(data.config).slice(0, 2).map(([k, v]) => `${k}: ${v}`).join('  •  ')
            )
          ),
          React.createElement(Handle, {
            type: 'source',
            position: Position.Right,
            style: { visibility: def.outputs > 0 ? 'visible' : 'hidden' }
          })
        )
      );
    }

    const nodeTypes = {
      input: DagNode,
      process: DagNode,
      output: DagNode,
    };

    /* =========================================================
       INITIAL DATA (sample DAG showcasing the editor)
       ========================================================= */
    const initialNodes = [
      {
        id: '1',
        type: 'input',
        position: { x: 60, y: 180 },
        data: { label: 'User Request', config: { source: 'http', schema: 'JSON' } },
      },
      {
        id: '2',
        type: 'process',
        position: { x: 320, y: 80 },
        data: { label: 'Auth Check', config: { method: 'JWT', timeout: '5s' } },
      },
      {
        id: '3',
        type: 'process',
        position: { x: 320, y: 280 },
        data: { label: 'Parse Payload', config: { format: 'JSON', depth: 3 } },
      },
      {
        id: '4',
        type: 'process',
        position: { x: 600, y: 180 },
        data: { label: 'Business Logic', config: { fn: 'transform' } },
      },
      {
        id: '5',
        type: 'output',
        position: { x: 880, y: 180 },
        data: { label: 'API Response', config: { status: 200 } },
      },
    ];

    const initialEdges = [
      { id: 'e1-2', source: '1', target: '2', label: 'token', animated: true, markerEnd: { type: MarkerType.ArrowClosed } },
      { id: 'e1-3', source: '1', target: '3', label: 'body', markerEnd: { type: MarkerType.ArrowClosed } },
      { id: 'e2-4', source: '2', target: '4', label: 'user', markerEnd: { type: MarkerType.ArrowClosed } },
      { id: 'e3-4', source: '3', target: '4', label: 'data', markerEnd: { type: MarkerType.ArrowClosed } },
      { id: 'e4-5', source: '4', target: '5', markerEnd: { type: MarkerType.ArrowClosed } },
    ];

    /* =========================================================
       TOAST HELPERS
       ========================================================= */
    function showToast(message, kind = 'info') {
      const container = document.getElementById('toast-root');
      const toast = document.createElement('div');
      toast.className = `toast ${kind}`;
      const icon = kind === 'success' ? '✓' : kind === 'error' ? '✕' : 'ℹ';
      toast.innerHTML = `<span style="font-weight:700;color:var(--${kind === 'success' ? 'success' : kind === 'error' ? 'danger' : 'accent'})">${icon}</span> ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.transition = 'all 0.3s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(120%)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    /* =========================================================
       THEME MANAGEMENT
       ========================================================= */
    function useTheme() {
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('flowforge-theme');
        return saved || 'dark';
      });

      useEffect(() => {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('flowforge-theme', theme);
      }, [theme]);

      return [theme, setTheme];
    }

    /* =========================================================
       SIDEBAR — NODE PALETTE
       ========================================================= */
    function NodePalette() {
      const onDragStart = (event, nodeType) => {
        event.dataTransfer.setData('application/reactflow', nodeType);
        event.dataTransfer.effectAllowed = 'move';
      };

      return React.createElement('div', { className: 'sidebar glass' },
        React.createElement('div', { className: 'sidebar-title' }, 'Node Palette'),
        Object.entries(NODE_DEFS).map(([type, def]) =>
          React.createElement('div', {
            key: type,
            className: 'palette-item',
            draggable: true,
            onDragStart: (e) => onDragStart(e, type),
            title: `拖曳到畫布建立 ${def.label} 節點`,
          },
            React.createElement('div', { className: `palette-icon ${def.color}` }, def.icon),
            React.createElement('div', { style: { flex: 1 } },
              React.createElement('div', null, def.label),
              React.createElement('div', { className: 'palette-desc' }, def.description)
            )
          )
        ),
        React.createElement('div', { className: 'palette-info' },
          React.createElement('strong', null, '⚡ 操作提示'),
          React.createElement('div', null, '• 從上方拖曳節點到畫布'),
          React.createElement('div', null, '• 從節點右側圓點拖曳到另一節點建立連線'),
          React.createElement('div', null, '• 點擊節點查看右側屬性面板'),
          React.createElement('div', null, '• 滾輪縮放、空白處拖曳平移'),
        )
      );
    }

    /* =========================================================
       RIGHT PANEL — INSPECTOR + STATS
       ========================================================= */
    function RightPanel({ nodes, edges, selectedNode, setSelectedNode, onUpdateNode, onDeleteNode, onExport, onImport, onClear, onValidate }) {
      const fileInputRef = useRef(null);

      const isValid = useMemo(() => validateDAG(nodes, edges), [nodes, edges]);
      const cycleEdges = useMemo(() => findCycleEdges(nodes, edges), [nodes, edges]);
      const order = useMemo(() => isValid ? topologicalOrder(nodes, edges) : [], [nodes, edges, isValid]);

      const jsonStr = useMemo(() => JSON.stringify({
        nodes: nodes.map(n => ({ id: n.id, type: n.type, position: n.position, data: n.data })),
        edges: edges.map(e => ({ id: e.id, source: e.source, target: e.target, label: e.label })),
        valid: isValid,
        order,
      }, null, 2), [nodes, edges, isValid, order]);

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.nodes && data.edges) {
              onImport(data);
              showToast('匯入成功', 'success');
            } else {
              showToast('檔案格式錯誤', 'error');
            }
          } catch (err) {
            showToast('JSON 解析失敗: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = ''; // reset
      };

      return React.createElement('div', { className: 'right-panel glass' },
        // Validation status
        React.createElement('div', { className: 'panel-section' },
          React.createElement('div', { className: 'panel-section-title' }, 'DAG Status'),
          React.createElement('div', { className: 'stat-row' },
            React.createElement('span', { className: 'stat-label' }, '總節點'),
            React.createElement('span', { className: 'stat-value' }, nodes.length)
          ),
          React.createElement('div', { className: 'stat-row' },
            React.createElement('span', { className: 'stat-label' }, '連線數'),
            React.createElement('span', { className: 'stat-value' }, edges.length)
          ),
          React.createElement('div', { className: 'stat-row' },
            React.createElement('span', { className: 'stat-label' }, 'DAG 有效性'),
            React.createElement('span', { className: `stat-value ${isValid ? 'good' : 'bad'}` },
              isValid ? '✓ 有效' : '✕ 含循環'
            )
          ),
          isValid && order.length > 0 && React.createElement('div', { className: 'stat-row' },
            React.createElement('span', { className: 'stat-label' }, '執行順序'),
            React.createElement('span', { className: 'stat-value', style: { fontSize: '11px' } }, order.slice(0, 3).join(' → ') + (order.length > 3 ? '…' : ''))
          ),
          !isValid && React.createElement('div', { className: 'stat-row' },
            React.createElement('span', { className: 'stat-label' }, '循環邊數'),
            React.createElement('span', { className: 'stat-value bad' }, cycleEdges.size)
          ),
        ),

        // Selected node inspector
        React.createElement('div', { className: 'panel-section' },
          React.createElement('div', { className: 'panel-section-title' }, 'Inspector'),
          selectedNode
            ? React.createElement(React.Fragment, null,
                React.createElement('div', { className: 'property-field' },
                  React.createElement('label', null, '類型'),
                  React.createElement('div', { className: 'stat-value', style: { padding: '4px 0' } },
                    NODE_DEFS[selectedNode.type]?.label || selectedNode.type
                  )
                ),
                React.createElement('div', { className: 'property-field' },
                  React.createElement('label', null, '名稱'),
                  React.createElement('input', {
                    type: 'text',
                    value: selectedNode.data.label || '',
                    onChange: (e) => onUpdateNode(selectedNode.id, { label: e.target.value }),
                  })
                ),
                React.createElement('div', { className: 'property-field' },
                  React.createElement('label', null, 'Config (JSON)'),
                  React.createElement('textarea', {
                    value: JSON.stringify(selectedNode.data.config || {}, null, 2),
                    onChange: (e) => {
                      try {
                        const cfg = JSON.parse(e.target.value);
                        onUpdateNode(selectedNode.id, { config: cfg });
                      } catch {}
                    },
                  })
                ),
                React.createElement('button', {
                  className: 'btn btn-danger',
                  style: { width: '100%', marginTop: '4px' },
                  onClick: () => onDeleteNode(selectedNode.id),
                }, '🗑 刪除節點')
              )
            : React.createElement('div', { className: 'empty-state' }, '在畫布上點擊節點以查看屬性')
        ),

        // I/O
        React.createElement('div', { className: 'panel-section' },
          React.createElement('div', { className: 'panel-section-title' }, 'Import / Export'),
          React.createElement('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } },
            React.createElement('button', { className: 'btn', onClick: onExport }, '⬇ 匯出 JSON'),
            React.createElement('button', { className: 'btn', onClick: () => fileInputRef.current?.click() }, '⬆ 匯入'),
            React.createElement('button', { className: 'btn btn-danger', onClick: onClear }, '🗑 清空'),
          ),
          React.createElement('input', {
            ref: fileInputRef,
            type: 'file',
            accept: '.json,application/json',
            style: { display: 'none' },
            onChange: handleImport,
          }),
          React.createElement('div', { className: 'json-output', style: { marginTop: '10px' } }, jsonStr)
        ),
      );
    }

    /* =========================================================
       TOP BAR
       ========================================================= */
    function TopBar({ theme, setTheme, onValidate }) {
      const themes = ['light', 'dark', 'aurora'];
      return React.createElement('div', { className: 'topbar glass' },
        React.createElement('div', { className: 'brand' },
          React.createElement('div', { className: 'brand-logo' }, '⚡'),
          React.createElement('div', null, 'FlowForge'),
          React.createElement('span', { className: 'brand-tag' }, 'DAG Editor · Next.js')
        ),
        React.createElement('div', { className: 'topbar-spacer' }),
        React.createElement('button', { className: 'btn btn-primary', onClick: onValidate }, '▶ Validate DAG'),
        React.createElement('div', { className: 'theme-switcher' },
          themes.map(t => React.createElement('button', {
            key: t,
            className: `theme-btn ${theme === t ? 'active' : ''}`,
            onClick: () => setTheme(t),
          }, t.toUpperCase()))
        )
      );
    }

    /* =========================================================
       MAIN FLOW APP
       ========================================================= */
    function FlowApp() {
      const [theme, setTheme] = useTheme();
      const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
      const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const reactFlowWrapper = useRef(null);
      const [reactFlowInstance, setReactFlowInstance] = useState(null);

      const isValid = useMemo(() => validateDAG(nodes, edges), [nodes, edges]);
      const cycleEdges = useMemo(() => findCycleEdges(nodes, edges), [nodes, edges]);

      // Annotate invalid edges (cycle)
      const styledEdges = useMemo(() => edges.map(e => ({
        ...e,
        className: cycleEdges.has(e.id) ? 'invalid' : '',
        animated: !cycleEdges.has(e.id) && e.animated,
      })), [edges, cycleEdges]);

      const selectedNode = useMemo(
        () => nodes.find(n => n.id === selectedNodeId) || null,
        [nodes, selectedNodeId]
      );

      const onConnect = useCallback((params) => {
        setEdges((eds) => addEdge({
          ...params,
          markerEnd: { type: MarkerType.ArrowClosed },
          animated: true,
        }, eds));
      }, [setEdges]);

      const onNodeClick = useCallback((_, node) => {
        setSelectedNodeId(node.id);
      }, []);

      const onPaneClick = useCallback(() => {
        setSelectedNodeId(null);
      }, []);

      const onUpdateNode = useCallback((id, patch) => {
        setNodes((nds) => nds.map(n =>
          n.id === id ? { ...n, data: { ...n.data, ...patch } } : n
        ));
      }, [setNodes]);

      const onDeleteNode = useCallback((id) => {
        setNodes((nds) => nds.filter(n => n.id !== id));
        setEdges((eds) => eds.filter(e => e.source !== id && e.target !== id));
        setSelectedNodeId(null);
        showToast('節點已刪除', 'success');
      }, [setNodes, setEdges]);

      const onDragOver = useCallback((event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
      }, []);

      const onDrop = useCallback((event) => {
        event.preventDefault();
        const type = event.dataTransfer.getData('application/reactflow');
        if (!type || !NODE_DEFS[type]) return;
        if (!reactFlowInstance) return;

        const position = reactFlowInstance.screenToFlowPosition({
          x: event.clientX,
          y: event.clientY,
        });

        const newId = String(Math.max(0, ...nodes.map(n => parseInt(n.id) || 0)) + 1);
        const newNode = {
          id: newId,
          type,
          position,
          data: {
            label: `${NODE_DEFS[type].label} ${newId}`,
            config: {},
          },
        };
        setNodes((nds) => nds.concat(newNode));
        showToast(`已新增 ${NODE_DEFS[type].label} 節點`, 'success');
      }, [reactFlowInstance, nodes, setNodes]);

      // I/O handlers
      const onExport = useCallback(() => {
        const data = {
          version: '1.0',
          exported_at: new Date().toISOString(),
          nodes: nodes.map(n => ({ id: n.id, type: n.type, position: n.position, data: n.data })),
          edges: edges.map(e => ({ id: e.id, source: e.source, target: e.target, label: e.label })),
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `flowforge-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('已匯出 JSON', 'success');
      }, [nodes, edges]);

      const onImport = useCallback((data) => {
        setNodes(data.nodes.map(n => ({ ...n, data: n.data || {} })));
        setEdges(data.edges.map(e => ({ ...e, markerEnd: { type: MarkerType.ArrowClosed } })));
      }, [setNodes, setEdges]);

      const onClear = useCallback(() => {
        if (nodes.length === 0 && edges.length === 0) return;
        if (confirm('確定要清空所有節點與連線嗎？')) {
          setNodes([]);
          setEdges([]);
          setSelectedNodeId(null);
          showToast('畫布已清空', 'info');
        }
      }, [nodes, edges, setNodes, setEdges]);

      const onValidate = useCallback(() => {
        if (isValid) {
          const order = topologicalOrder(nodes, edges);
          showToast(`✓ DAG 有效,執行順序: ${order.length} 步`, 'success');
        } else {
          showToast(`✕ 偵測到 ${cycleEdges.size} 條循環邊`, 'error');
        }
      }, [isValid, cycleEdges, nodes, edges]);

      // Show status on every change
      useEffect(() => {
        if (nodes.length > 0 && !isValid) {
          // Could show banner, but keep subtle via toast only on big changes
        }
      }, [isValid, nodes.length]);

      return React.createElement(React.Fragment, null,
        React.createElement(TopBar, { theme, setTheme, onValidate }),
        React.createElement('div', { className: 'main' },
          React.createElement(NodePalette, null),
          React.createElement('div', {
            className: 'canvas-wrapper',
            ref: reactFlowWrapper,
          },
            React.createElement(ReactFlow, {
              nodes: nodes,
              edges: styledEdges,
              onNodesChange: onNodesChange,
              onEdgesChange: onEdgesChange,
              onConnect: onConnect,
              onInit: setReactFlowInstance,
              onDrop: onDrop,
              onDragOver: onDragOver,
              onNodeClick: onNodeClick,
              onPaneClick: onPaneClick,
              nodeTypes: nodeTypes,
              fitView: true,
              fitViewOptions: { padding: 0.2 },
              proOptions: { hideAttribution: false },
            },
              React.createElement(Background, { color: 'currentColor', gap: 24, size: 1, style: { opacity: 0.3 } }),
              React.createElement(Controls, { showInteractive: false }),
              React.createElement(MiniMap, {
                nodeColor: (n) => {
                  if (n.type === 'input') return 'var(--node-input)';
                  if (n.type === 'output') return 'var(--node-output)';
                  return 'var(--node-process)';
                },
                maskColor: 'rgba(0,0,0,0.4)',
                style: { background: 'var(--bg-glass)' },
              }),
              // Status overlay
              React.createElement(Panel, { position: 'top-right', style: { margin: '12px' } },
                React.createElement('div', {
                  className: 'glass',
                  style: {
                    padding: '8px 14px',
                    borderRadius: '10px',
                    fontSize: '12px',
                    fontWeight: 500,
                    color: isValid ? 'var(--success)' : 'var(--danger)',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '8px',
                  }
                },
                  React.createElement('span', {
                    style: {
                      width: '8px',
                      height: '8px',
                      borderRadius: '50%',
                      background: isValid ? 'var(--success)' : 'var(--danger)',
                      boxShadow: `0 0 8px ${isValid ? 'var(--success)' : 'var(--danger)'}`,
                    }
                  }),
                  isValid ? `DAG Valid · ${nodes.length} nodes` : `Cycle Detected`
                )
              )
            )
          ),
          React.createElement(RightPanel, {
            nodes,
            edges,
            selectedNode,
            setSelectedNode: setSelectedNodeId,
            onUpdateNode,
            onDeleteNode,
            onExport,
            onImport,
            onClear,
            onValidate,
          })
        )
      );
    }

    /* =========================================================
       ROOT MOUNT
       ========================================================= */
    function App() {
      return React.createElement(ReactFlowProvider, null,
        React.createElement(FlowApp, null)
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App, null));

    // Welcome toast
    setTimeout(() => showToast('🎉 FlowForge 已就緒 — 開始打造你的 DAG!', 'info'), 500);
  </script>
</body>
</html>
