<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowForge — 工作流自動化設計工具</title>
<style>
  /* ============================================================
     FlowForge — Workflow Automation Designer
     Pure vanilla JS + SVG. No external dependencies.
     Anti-slop design: dark warm-neutral palette, intentional typography,
     8px grid, real interactions, no gratuitous gradients.
     ============================================================ */

  :root {
    --bg-0: #0e0f12;
    --bg-1: #16181d;
    --bg-2: #1c1f26;
    --bg-3: #242832;
    --border-1: #2a2f3a;
    --border-2: #353b48;
    --text-0: #e7e9ee;
    --text-1: #a8adb9;
    --text-2: #6e7585;
    --accent: #f0b35e;       /* warm amber */
    --accent-dim: #b8843a;
    --ok: #5cb87a;
    --warn: #e8a849;
    --err: #d8645a;
    --info: #6c9ad6;
    --trigger: #6c9ad6;
    --condition: #c97ad6;
    --action: #5cb87a;
    --notify: #e8a849;
    --end: #6e7585;
    --grid: #1a1d23;
    --grid-strong: #232730;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 4px 16px rgba(0,0,0,.5);
    --shadow-3: 0 12px 40px rgba(0,0,0,.6);
    --radius: 6px;
    --radius-lg: 10px;
    --font-mono: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--text-0);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* ----- App layout ----- */
  .app {
    display: grid;
    grid-template-rows: 48px 1fr 28px;
    grid-template-columns: 240px 1fr 280px;
    grid-template-areas:
      "topbar  topbar  topbar"
      "palette canvas  inspector"
      "status  status  status";
    height: 100vh;
  }

  /* ----- Topbar ----- */
  .topbar {
    grid-area: topbar;
    background: var(--bg-1);
    border-bottom: 1px solid var(--border-1);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    user-select: none;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .brand-mark {
    width: 22px;
    height: 22px;
    background: var(--accent);
    border-radius: 4px;
    position: relative;
    box-shadow: 0 0 0 1px var(--accent-dim) inset;
  }
  .brand-mark::before, .brand-mark::after {
    content: '';
    position: absolute;
    background: var(--bg-1);
    border-radius: 1px;
  }
  .brand-mark::before { width: 8px; height: 2px; top: 6px; left: 4px; }
  .brand-mark::after  { width: 2px; height: 8px; top: 7px; left: 7px; }

  .brand-name { color: var(--text-0); }
  .brand-sub {
    color: var(--text-2);
    font-size: 11px;
    font-weight: 400;
    margin-left: 4px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .topbar-divider {
    width: 1px;
    height: 24px;
    background: var(--border-1);
    margin: 0 4px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg-2);
    color: var(--text-0);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    transition: background .12s, border-color .12s, transform .04s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-3); border-color: var(--border-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--accent);
    color: #1a1409;
    border-color: var(--accent-dim);
  }
  .btn.primary:hover { background: #f5bd72; }
  .btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-1);
  }
  .btn.ghost:hover { background: var(--bg-2); color: var(--text-0); }
  .btn.danger { color: var(--err); }
  .btn.danger:hover { background: rgba(216,100,90,.12); border-color: var(--err); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-icon {
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }

  .topbar-spacer { flex: 1; }

  .flow-name {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-0);
    font-family: inherit;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 4px;
    width: 200px;
    transition: border-color .12s, background .12s;
  }
  .flow-name:hover { border-color: var(--border-1); }
  .flow-name:focus { outline: none; border-color: var(--accent); background: var(--bg-2); }

  /* ----- Status bar ----- */
  .statusbar {
    grid-area: status;
    background: var(--bg-1);
    border-top: 1px solid var(--border-1);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    font-size: 11px;
    color: var(--text-2);
    user-select: none;
  }
  .status-item { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok);
  }
  .status-dot.warn { background: var(--warn); }
  .status-dot.err  { background: var(--err); }

  /* ----- Palette ----- */
  .palette {
    grid-area: palette;
    background: var(--bg-1);
    border-right: 1px solid var(--border-1);
    overflow-y: auto;
    padding: 12px 8px;
  }
  .panel-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-2);
    padding: 8px 8px 6px;
    user-select: none;
  }
  .palette-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin: 2px 0;
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    cursor: grab;
    transition: background .12s, border-color .12s, transform .08s;
    user-select: none;
  }
  .palette-item:hover { background: var(--bg-3); border-color: var(--border-2); }
  .palette-item:active { cursor: grabbing; transform: scale(0.98); }
  .palette-item.dragging { opacity: 0.5; }

  .palette-icon {
    width: 28px; height: 28px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
    background: var(--bg-3);
  }
  .palette-text { flex: 1; min-width: 0; }
  .palette-text-title { font-size: 12px; font-weight: 500; color: var(--text-0); }
  .palette-text-desc  { font-size: 10px; color: var(--text-2); margin-top: 1px; }

  /* node-type accent */
  .palette-item[data-type="trigger"]   .palette-icon { background: rgba(108,154,214,.15); color: var(--trigger); }
  .palette-item[data-type="condition"] .palette-icon { background: rgba(201,122,214,.15); color: var(--condition); }
  .palette-item[data-type="action"]    .palette-icon { background: rgba(92,184,122,.15); color: var(--action); }
  .palette-item[data-type="notify"]    .palette-icon { background: rgba(232,168,73,.15); color: var(--notify); }
  .palette-item[data-type="end"]       .palette-icon { background: rgba(110,117,133,.15); color: var(--end); }

  /* ----- Canvas ----- */
  .canvas-wrap {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
    background: var(--bg-0);
  }
  .canvas-toolbar {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 4px;
    background: var(--bg-1);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    padding: 4px;
    box-shadow: var(--shadow-2);
    z-index: 10;
  }
  .zoom-display {
    display: inline-flex; align-items: center;
    padding: 0 8px;
    font-size: 11px;
    color: var(--text-1);
    font-family: var(--font-mono);
    min-width: 48px;
    justify-content: center;
  }

  .canvas-legend {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: var(--bg-1);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 10px;
    color: var(--text-2);
    box-shadow: var(--shadow-2);
    user-select: none;
    pointer-events: none;
  }
  .canvas-legend kbd {
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-0);
  }

  svg.canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  svg.canvas.panning { cursor: grabbing; }
  svg.canvas.connecting { cursor: crosshair; }

  /* SVG node group */
  .node-group { cursor: move; }
  .node-group.selected .node-body {
    stroke: var(--accent);
    stroke-width: 2;
  }
  .node-group.executing .node-body {
    stroke: var(--ok);
    stroke-width: 2;
    filter: drop-shadow(0 0 8px rgba(92,184,122,.5));
  }
  .node-group.error .node-body {
    stroke: var(--err);
    stroke-width: 2;
  }
  .node-group.completed .node-body {
    stroke: var(--ok);
    stroke-width: 1.5;
  }

  .node-body {
    fill: var(--bg-2);
    stroke: var(--border-2);
    stroke-width: 1;
    transition: stroke .15s;
  }
  .node-header {
    cursor: move;
  }
  .node-title {
    fill: var(--text-0);
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
  }
  .node-subtitle {
    fill: var(--text-1);
    font-size: 10px;
    pointer-events: none;
  }
  .node-type-badge {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    pointer-events: none;
  }

  /* node-type specific header color */
  .node-group[data-type="trigger"]   .node-header-rect { fill: var(--trigger); }
  .node-group[data-type="condition"] .node-header-rect { fill: var(--condition); }
  .node-group[data-type="action"]    .node-header-rect { fill: var(--action); }
  .node-group[data-type="notify"]    .node-header-rect { fill: var(--notify); }
  .node-group[data-type="end"]       .node-header-rect { fill: var(--end); }

  .handle {
    cursor: crosshair;
    fill: var(--bg-3);
    stroke: var(--border-2);
    stroke-width: 1.5;
    transition: fill .12s, r .12s;
  }
  .handle:hover, .handle.source-hover {
    fill: var(--accent);
    stroke: var(--accent-dim);
  }
  .handle.connecting {
    fill: var(--accent);
    stroke: var(--accent-dim);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { r: 5; }
    50% { r: 7; }
  }

  .handle-label {
    font-size: 8px;
    fill: var(--text-2);
    pointer-events: none;
    font-weight: 600;
    text-anchor: middle;
  }

  /* edges */
  .edge-path {
    fill: none;
    stroke: var(--border-2);
    stroke-width: 1.5;
    transition: stroke .12s;
  }
  .edge-group:hover .edge-path {
    stroke: var(--accent);
    stroke-width: 2;
  }
  .edge-group.selected .edge-path {
    stroke: var(--accent);
    stroke-width: 2.5;
  }
  .edge-group.would-create-cycle .edge-path {
    stroke: var(--err);
    stroke-width: 2;
    stroke-dasharray: 4 3;
  }

  .ghost-edge {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 4 3;
    pointer-events: none;
    opacity: 0.7;
  }

  /* canvas grid */
  .grid-pattern {
    fill: url(#grid);
  }

  /* drop indicator */
  .drop-indicator {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-dasharray: 4 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s;
  }
  .drop-indicator.active { opacity: 1; }

  /* ----- Inspector ----- */
  .inspector {
    grid-area: inspector;
    background: var(--bg-1);
    border-left: 1px solid var(--border-1);
    overflow-y: auto;
    padding: 12px;
  }
  .inspector-empty {
    color: var(--text-2);
    text-align: center;
    padding: 40px 16px;
    font-size: 12px;
    line-height: 1.6;
  }
  .inspector-empty-icon {
    font-size: 32px;
    color: var(--text-2);
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .field {
    margin-bottom: 12px;
  }
  .field-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-2);
    margin-bottom: 4px;
  }
  .field-input,
  .field-textarea,
  .field-select {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    color: var(--text-0);
    padding: 6px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    transition: border-color .12s;
  }
  .field-input:focus,
  .field-textarea:focus,
  .field-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field-textarea { resize: vertical; min-height: 60px; font-family: var(--font-mono); font-size: 11px; }

  .inspector-section {
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 12px;
  }
  .inspector-section-title {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-1);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .inspector-meta {
    background: var(--bg-2);
    border: 1px solid var(--border-1);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 11px;
    color: var(--text-1);
    font-family: var(--font-mono);
  }
  .inspector-meta-row { display: flex; justify-content: space-between; padding: 2px 0; }
  .inspector-meta-key { color: var(--text-2); }
  .inspector-meta-val { color: var(--text-0); }

  /* ----- Modal ----- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--bg-1);
    border: 1px solid var(--border-2);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-3);
    max-width: 720px;
    width: 90%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-1);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title { font-size: 14px; font-weight: 600; }
  .modal-body {
    padding: 18px;
    overflow: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 12px 18px;
    border-top: 1px solid var(--border-1);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .code-preview {
    background: var(--bg-0);
    border: 1px solid var(--border-1);
    border-radius: 4px;
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-0);
    overflow: auto;
    max-height: 360px;
    white-space: pre;
  }

  /* toast */
  .toast-container {
    position: fixed;
    bottom: 40px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 200;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    border-left: 3px solid var(--info);
    color: var(--text-0);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 12px;
    box-shadow: var(--shadow-2);
    min-width: 200px;
    max-width: 360px;
    animation: slideIn .2s ease;
    pointer-events: auto;
  }
  .toast.success { border-left-color: var(--ok); }
  .toast.warn    { border-left-color: var(--warn); }
  .toast.error   { border-left-color: var(--err); }
  @keyframes slideIn {
    from { transform: translateX(20px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }

  /* validator banner */
  .validator-banner {
    background: rgba(216,100,90,.1);
    border: 1px solid var(--err);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-bottom: 8px;
    color: var(--err);
    font-size: 11px;
    display: none;
  }
  .validator-banner.show { display: block; }
  .validator-banner.ok {
    background: rgba(92,184,122,.1);
    border-color: var(--ok);
    color: var(--ok);
  }

  /* execution log */
  .exec-log {
    background: var(--bg-0);
    border: 1px solid var(--border-1);
    border-radius: 4px;
    padding: 10px;
    max-height: 200px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-1);
  }
  .exec-log-entry { padding: 2px 0; }
  .exec-log-entry .ts { color: var(--text-2); margin-right: 6px; }
  .exec-log-entry.ok    { color: var(--ok); }
  .exec-log-entry.error { color: var(--err); }
  .exec-log-entry.skip  { color: var(--text-2); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-1); }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 5px; border: 2px solid var(--bg-1); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

  /* empty state */
  .canvas-empty {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--text-2);
    pointer-events: none;
    user-select: none;
  }
  .canvas-empty-icon {
    font-size: 56px;
    color: var(--border-2);
    margin-bottom: 12px;
  }
  .canvas-empty-text { font-size: 14px; }
  .canvas-empty-hint { font-size: 11px; color: var(--text-2); margin-top: 4px; }

</style>
</head>
<body>
<div class="app">

  <!-- ===================== Topbar ===================== -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <span class="brand-name">FlowForge</span>
      <span class="brand-sub">v1.0</span>
    </div>
    <div class="topbar-divider"></div>
    <input type="text" class="flow-name" id="flowName" value="My Workflow" />
    <div class="topbar-divider"></div>
    <div class="toolbar">
      <button class="btn ghost" id="btnUndo" title="復原 (Ctrl+Z)">
        <span class="btn-icon">↶</span> 復原
      </button>
      <button class="btn ghost" id="btnRedo" title="重做 (Ctrl+Shift+Z)">
        <span class="btn-icon">↷</span> 重做
      </button>
      <div class="topbar-divider"></div>
      <button class="btn" id="btnValidate" title="驗證 DAG 結構">
        <span class="btn-icon">✓</span> 驗證
      </button>
      <button class="btn" id="btnSimulate" title="執行模擬">
        <span class="btn-icon">▶</span> 執行
      </button>
      <div class="topbar-divider"></div>
      <button class="btn" id="btnImport">匯入</button>
      <button class="btn" id="btnExport">匯出 JSON</button>
      <button class="btn" id="btnExportCode">匯出程式碼</button>
      <div class="topbar-divider"></div>
      <button class="btn danger" id="btnClear">清空</button>
    </div>
    <div class="topbar-spacer"></div>
    <button class="btn primary" id="btnSave">儲存</button>
  </header>

  <!-- ===================== Palette ===================== -->
  <aside class="palette" id="palette">
    <div class="panel-title">節點類型</div>
    <!-- populated by JS -->
  </aside>

  <!-- ===================== Canvas ===================== -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-toolbar">
      <button class="btn ghost" id="btnZoomIn" title="放大">＋</button>
      <span class="zoom-display" id="zoomDisplay">100%</span>
      <button class="btn ghost" id="btnZoomOut" title="縮小">－</button>
      <button class="btn ghost" id="btnZoomFit" title="適配">⊡</button>
    </div>

    <svg class="canvas" id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="#2a2f3a" />
        </pattern>
        <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="url(#grid)"/>
          <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#232730" stroke-width="0.5"/>
        </pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--border-2)" />
        </marker>
        <marker id="arrowHover" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" />
        </marker>
        <marker id="arrowGhost" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="8" markerHeight="8" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)" opacity="0.6" />
        </marker>
      </defs>
      <rect class="grid-pattern" x="0" y="0" width="100%" height="100%" />
      <g id="viewport">
        <g id="edgesLayer"></g>
        <g id="nodesLayer"></g>
        <g id="overlayLayer"></g>
      </g>
    </svg>

    <div class="canvas-empty" id="canvasEmpty">
      <div class="canvas-empty-icon">⬡</div>
      <div class="canvas-empty-text">從左側拖曳節點開始設計流程</div>
      <div class="canvas-empty-hint">點擊節點圓點拖出連線 · Delete 鍵刪除選中項目</div>
    </div>

    <div class="canvas-legend">
      <kbd>拖曳</kbd> 移動節點 · <kbd>點擊圓點</kbd> 連線 ·
      <kbd>Del</kbd> 刪除 · <kbd>Ctrl+Z</kbd> 復原 · <kbd>滾輪</kbd> 縮放
    </div>
  </div>

  <!-- ===================== Inspector ===================== -->
  <aside class="inspector" id="inspector">
    <div class="inspector-empty" id="inspectorEmpty">
      <div class="inspector-empty-icon">◇</div>
      尚未選取節點<br/>
      點擊任一節點或連線以檢視屬性
    </div>
    <div id="inspectorContent" style="display:none"></div>
  </aside>

  <!-- ===================== Statusbar ===================== -->
  <footer class="statusbar">
    <div class="status-item">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">就緒</span>
    </div>
    <div class="status-item">
      節點: <span id="statNodes" style="color:var(--text-0);margin-left:4px">0</span>
    </div>
    <div class="status-item">
      連線: <span id="statEdges" style="color:var(--text-0);margin-left:4px">0</span>
    </div>
    <div class="status-item" id="statCycle" style="display:none">
      <span class="status-dot err"></span>
      偵測到循環
    </div>
    <div style="flex:1"></div>
    <div class="status-item" id="statHint" style="color:var(--text-2)">
      FlowForge — 工作流自動化設計工具
    </div>
  </footer>

</div>

<!-- ===================== Modal ===================== -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Modal</div>
      <button class="btn ghost" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ===================== Toast container ===================== -->
<div class="toast-container" id="toasts"></div>

<script>
/* ============================================================
   FlowForge — Workflow Automation Designer
   Pure vanilla JS + SVG architecture.
   Reuses concepts from micro-skills:
   - #17 react_flow_integration: node/edge state model
   - #2 drag_drop_palette_to_canvas: HTML5 drag API
   - #4 dag_workflow_management: hasCycle() (DFS), validation
   - #11 Advanced Dynamic Form: dynamic field rendering
   - #16 Schema-Driven: per-node-type schema
   ============================================================ */

(function() {
  'use strict';

  /* ============================================================
     1. CONSTANTS & NODE-TYPE SCHEMA
     Schema-driven approach: each node type declares its appearance,
     default data, and inspector fields.
     ============================================================ */

  const NODE_TYPES = {
    trigger: {
      label: '觸發器',
      description: '流程入口,事件發生時啟動',
      color: 'var(--trigger)',
      icon: '⚡',
      defaultData: () => ({ source: 'manual', event: 'button_click' }),
      inputs: 0,
      outputs: 1,
      fieldSchema: [
        { key: 'source', label: '觸發來源', type: 'select',
          options: [
            { value: 'manual', label: '手動觸發' },
            { value: 'schedule', label: '排程' },
            { value: 'webhook', label: 'Webhook' },
            { value: 'email', label: '電子郵件' }
          ]
        },
        { key: 'event', label: '事件名稱', type: 'text', placeholder: '例如: order_created' }
      ]
    },
    condition: {
      label: '條件判斷',
      description: '根據條件分流到不同分支',
      color: 'var(--condition)',
      icon: '◇',
      defaultData: () => ({ expression: 'value > 0', trueLabel: '是', falseLabel: '否' }),
      inputs: 1,
      outputs: 2,
      fieldSchema: [
        { key: 'expression', label: '判斷表達式', type: 'text',
          placeholder: '例如: value > 10' },
        { key: 'trueLabel', label: 'True 分支標籤', type: 'text' },
        { key: 'falseLabel', label: 'False 分支標籤', type: 'text' }
      ]
    },
    action: {
      label: '執行動作',
      description: '執行 API 呼叫、資料處理等',
      color: 'var(--action)',
      icon: '▶',
      defaultData: () => ({ action: 'http_request', url: 'https://api.example.com', method: 'GET' }),
      inputs: 1,
      outputs: 1,
      fieldSchema: [
        { key: 'action', label: '動作類型', type: 'select',
          options: [
            { value: 'http_request', label: 'HTTP 請求' },
            { value: 'transform', label: '資料轉換' },
            { value: 'database', label: '資料庫操作' },
            { value: 'function', label: '自訂函式' }
          ]
        },
        { key: 'url', label: 'URL / 端點', type: 'text' },
        { key: 'method', label: 'HTTP 方法', type: 'select',
          options: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH']
        }
      ]
    },
    notify: {
      label: '發送通知',
      description: 'Email、Slack、簡訊通知',
      color: 'var(--notify)',
      icon: '✉',
      defaultData: () => ({ channel: 'email', recipient: 'team@example.com', template: 'default' }),
      inputs: 1,
      outputs: 1,
      fieldSchema: [
        { key: 'channel', label: '通知管道', type: 'select',
          options: [
            { value: 'email', label: 'Email' },
            { value: 'slack', label: 'Slack' },
            { value: 'sms', label: '簡訊' },
            { value: 'push', label: '推播' }
          ]
        },
        { key: 'recipient', label: '收件者', type: 'text' },
        { key: 'template', label: '訊息範本', type: 'textarea', placeholder: '訊息內容...' }
      ]
    },
    end: {
      label: '結束',
      description: '流程結束點',
      color: 'var(--end)',
      icon: '■',
      defaultData: () => ({ status: 'success' }),
      inputs: 1,
      outputs: 0,
      fieldSchema: [
        { key: 'status', label: '結束狀態', type: 'select',
          options: [
            { value: 'success', label: '成功' },
            { value: 'failure', label: '失敗' },
            { value: 'cancelled', label: '取消' }
          ]
        }
      ]
    }
  };

  const NODE_W = 180;
  const NODE_HEADER_H = 28;
  const NODE_BODY_H = 56;

  /* ============================================================
     2. STATE
     ============================================================ */

  const state = {
    flowName: 'My Workflow',
    nodes: [],     // { id, type, x, y, data, label }
    edges: [],     // { id, source, target, sourceHandle, targetHandle }
    selectedNodeId: null,
    selectedEdgeId: null,
    zoom: 1,
    pan: { x: 0, y: 0 },
    nextId: 1,
    history: [],
    historyIndex: -1,
    historyMax: 50,
    connecting: null,   // { sourceId, sourceHandle }
    panning: null,
    nodeDrag: null,
    isExecuting: false
  };

  function genId(prefix) {
    return (prefix || 'n') + '_' + (state.nextId++) + '_' + Math.random().toString(36).slice(2, 6);
  }

  /* ============================================================
     3. DOM REFS
     ============================================================ */

  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const viewport = $('viewport');
  const nodesLayer = $('nodesLayer');
  const edgesLayer = $('edgesLayer');
  const overlayLayer = $('overlayLayer');
  const canvasWrap = $('canvasWrap');
  const inspector = $('inspector');
  const inspectorEmpty = $('inspectorEmpty');
  const inspectorContent = $('inspectorContent');
  const paletteEl = $('palette');
  const canvasEmpty = $('canvasEmpty');
  const zoomDisplay = $('zoomDisplay');

  /* ============================================================
     4. UTILITIES
     ============================================================ */

  function svgPoint(evt) {
    const pt = canvas.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const ctm = viewport.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function debounce(fn, ms) {
    let t;
    return function() {
      clearTimeout(t);
      const args = arguments;
      t = setTimeout(() => fn.apply(null, args), ms);
    };
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  /* ============================================================
     5. TOAST NOTIFICATIONS
     ============================================================ */

  function toast(message, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = message;
    $('toasts').appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 250);
    }, 3000);
  }

  /* ============================================================
     6. HISTORY (Undo/Redo)
     ============================================================ */

  function snapshot() {
    return JSON.stringify({
      nodes: state.nodes,
      edges: state.edges,
      flowName: state.flowName
    });
  }

  function pushHistory() {
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(snapshot());
    if (state.history.length > state.historyMax) state.history.shift();
    state.historyIndex = state.history.length - 1;
  }

  function restoreSnapshot(snap) {
    const data = JSON.parse(snap);
    state.nodes = data.nodes;
    state.edges = data.edges;
    state.flowName = data.flowName;
    $('flowName').value = state.flowName;
    state.selectedNodeId = null;
    state.selectedEdgeId = null;
    render();
    renderInspector();
  }

  function undo() {
    if (state.historyIndex <= 0) return;
    state.historyIndex--;
    restoreSnapshot(state.history[state.historyIndex]);
    toast('已復原', '');
  }

  function redo() {
    if (state.historyIndex >= state.history.length - 1) return;
    state.historyIndex++;
    restoreSnapshot(state.history[state.historyIndex]);
    toast('已重做', '');
  }

  /* ============================================================
     7. RENDERING — PALETTE
     ============================================================ */

  function renderPalette() {
    paletteEl.innerHTML = '<div class="panel-title">節點類型</div>';
    Object.entries(NODE_TYPES).forEach(([type, schema]) => {
      const item = document.createElement('div');
      item.className = 'palette-item';
      item.draggable = true;
      item.dataset.type = type;
      item.innerHTML = `
        <div class="palette-icon">${schema.icon}</div>
        <div class="palette-text">
          <div class="palette-text-title">${escapeHtml(schema.label)}</div>
          <div class="palette-text-desc">${escapeHtml(schema.description)}</div>
        </div>
      `;
      item.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('application/flowforge-node', type);
        e.dataTransfer.effectAllowed = 'copy';
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => item.classList.remove('dragging'));
      paletteEl.appendChild(item);
    });
  }

  /* ============================================================
     8. RENDERING — NODES (SVG)
     ============================================================ */

  function nodeBBox(n) {
    return { x: n.x, y: n.y, w: NODE_W, h: NODE_HEADER_H + NODE_BODY_H };
  }

  function nodeCenter(n) {
    return { x: n.x + NODE_W / 2, y: n.y + NODE_HEADER_H + NODE_BODY_H / 2 };
  }

  function handlePos(n, handleKind, handleIndex) {
    const schema = NODE_TYPES[n.type];
    if (handleKind === 'target') {
      return { x: n.x, y: n.y + NODE_HEADER_H + NODE_BODY_H / 2 };
    } else {
      // source: distribute along right edge
      const count = schema.outputs;
      if (count === 1) {
        return { x: n.x + NODE_W, y: n.y + NODE_HEADER_H + NODE_BODY_H / 2 };
      } else {
        const slot = NODE_BODY_H / (count + 1);
        return {
          x: n.x + NODE_W,
          y: n.y + NODE_HEADER_H + slot * (handleIndex + 1)
        };
      }
    }
  }

  function renderNode(n) {
    const schema = NODE_TYPES[n.type];
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('node-group');
    g.dataset.nodeId = n.id;
    g.dataset.type = n.type;

    if (n.id === state.selectedNodeId) g.classList.add('selected');

    // Body rectangle
    const body = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    body.classList.add('node-body');
    body.setAttribute('x', n.x);
    body.setAttribute('y', n.y);
    body.setAttribute('width', NODE_W);
    body.setAttribute('height', NODE_HEADER_H + NODE_BODY_H);
    body.setAttribute('rx', 6);
    g.appendChild(body);

    // Header (only top corners rounded — use a path for clean rendering)
    const headerPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    headerPath.classList.add('node-header-rect');
    const r = 6; // corner radius
    const hx = n.x, hy = n.y, hw = NODE_W, hh = NODE_HEADER_H;
    headerPath.setAttribute('d',
      `M ${hx + r} ${hy} L ${hx + hw - r} ${hy} Q ${hx + hw} ${hy} ${hx + hw} ${hy + r} L ${hx + hw} ${hy + hh} L ${hx} ${hy + hh} L ${hx} ${hy + r} Q ${hx} ${hy} ${hx + r} ${hy} Z`
    );
    g.appendChild(headerPath);

    // Icon
    const iconText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    iconText.setAttribute('x', n.x + 10);
    iconText.setAttribute('y', n.y + 19);
    iconText.setAttribute('fill', '#0e0f12');
    iconText.setAttribute('font-size', '14');
    iconText.setAttribute('font-weight', '700');
    iconText.textContent = schema.icon;
    g.appendChild(iconText);

    // Title
    const titleText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    titleText.classList.add('node-title');
    titleText.setAttribute('x', n.x + 30);
    titleText.setAttribute('y', n.y + 19);
    titleText.textContent = n.label || schema.label;
    g.appendChild(titleText);

    // Type badge (top-right)
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    badge.classList.add('node-type-badge');
    badge.setAttribute('x', n.x + NODE_W - 8);
    badge.setAttribute('y', n.y + 19);
    badge.setAttribute('text-anchor', 'end');
    badge.setAttribute('fill', 'rgba(14,15,18,0.6)');
    badge.textContent = schema.label;
    g.appendChild(badge);

    // Body content — show key field value
    const summary = nodeSummary(n);
    if (summary) {
      const summaryText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      summaryText.classList.add('node-subtitle');
      summaryText.setAttribute('x', n.x + 12);
      summaryText.setAttribute('y', n.y + NODE_HEADER_H + 20);
      summaryText.textContent = truncate(summary.primary, NODE_W - 24);
      g.appendChild(summaryText);

      if (summary.secondary) {
        const subText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        subText.classList.add('node-subtitle');
        subText.setAttribute('x', n.x + 12);
        subText.setAttribute('y', n.y + NODE_HEADER_H + 36);
        subText.setAttribute('fill', 'var(--text-2)');
        subText.textContent = truncate(summary.secondary, NODE_W - 24);
        g.appendChild(subText);
      }
    }

    // Input handle
    if (schema.inputs > 0) {
      const inputHandle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      inputHandle.classList.add('handle');
      inputHandle.dataset.handleKind = 'target';
      const pos = handlePos(n, 'target', 0);
      inputHandle.setAttribute('cx', pos.x);
      inputHandle.setAttribute('cy', pos.y);
      inputHandle.setAttribute('r', 5);
      g.appendChild(inputHandle);
    }

    // Output handles
    for (let i = 0; i < schema.outputs; i++) {
      const outHandle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      outHandle.classList.add('handle');
      outHandle.dataset.handleKind = 'source';
      outHandle.dataset.handleIndex = i;
      const pos = handlePos(n, 'source', i);
      outHandle.setAttribute('cx', pos.x);
      outHandle.setAttribute('cy', pos.y);
      outHandle.setAttribute('r', 5);
      g.appendChild(outHandle);

      if (schema.outputs > 1) {
        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        lbl.classList.add('handle-label');
        const offsetY = i === 0 ? -8 : 16;
        lbl.setAttribute('x', pos.x - 10);
        lbl.setAttribute('y', pos.y + offsetY);
        lbl.textContent = i === 0 ? 'T' : 'F';
        g.appendChild(lbl);
      }
    }

    attachNodeHandlers(g, n);
    return g;
  }

  function truncate(s, max) {
    if (!s) return '';
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  function nodeSummary(n) {
    const data = n.data || {};
    switch (n.type) {
      case 'trigger':   return { primary: data.source || '', secondary: data.event || '' };
      case 'condition': return { primary: data.expression || '', secondary: '' };
      case 'action':    return { primary: (data.method || '') + ' ' + (data.url || ''), secondary: data.action || '' };
      case 'notify':    return { primary: data.channel + ' → ' + (data.recipient || ''), secondary: '' };
      case 'end':       return { primary: 'status: ' + (data.status || ''), secondary: '' };
      default: return null;
    }
  }

  /* ============================================================
     9. RENDERING — EDGES
     ============================================================ */

  function bezierPath(p1, p2) {
    const dx = Math.abs(p2.x - p1.x) * 0.5;
    const c1x = p1.x + dx;
    const c1y = p1.y;
    const c2x = p2.x - dx;
    const c2y = p2.y;
    return `M ${p1.x} ${p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
  }

  function renderEdge(e) {
    const src = state.nodes.find(n => n.id === e.source);
    const tgt = state.nodes.find(n => n.id === e.target);
    if (!src || !tgt) return null;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('edge-group');
    g.dataset.edgeId = e.id;
    if (e.id === state.selectedEdgeId) g.classList.add('selected');

    const p1 = handlePos(src, 'source', e.sourceHandle || 0);
    const p2 = handlePos(tgt, 'target', 0);

    // Invisible thick path for hit testing
    const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hitPath.setAttribute('d', bezierPath(p1, p2));
    hitPath.setAttribute('fill', 'none');
    hitPath.setAttribute('stroke', 'transparent');
    hitPath.setAttribute('stroke-width', '14');
    hitPath.style.cursor = 'pointer';
    g.appendChild(hitPath);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.classList.add('edge-path');
    path.setAttribute('d', bezierPath(p1, p2));
    path.setAttribute('marker-end', 'url(#arrow)');
    g.appendChild(path);

    // Midpoint label for conditions
    if (src.type === 'condition' && src.data) {
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      lbl.setAttribute('x', midX);
      lbl.setAttribute('y', midY - 4);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('font-size', '10');
      lbl.setAttribute('font-weight', '600');
      lbl.setAttribute('fill', 'var(--text-1)');
      lbl.style.pointerEvents = 'none';
      const idx = e.sourceHandle || 0;
      lbl.textContent = idx === 0 ? (src.data.trueLabel || 'T') : (src.data.falseLabel || 'F');
      g.appendChild(lbl);
    }

    g.addEventListener('click', (evt) => {
      evt.stopPropagation();
      state.selectedNodeId = null;
      state.selectedEdgeId = e.id;
      render();
      renderInspector();
    });
    return g;
  }

  /* ============================================================
     10. RENDER LOOP
     ============================================================ */

  function render() {
    // edges first (under nodes)
    edgesLayer.innerHTML = '';
    state.edges.forEach(e => {
      const el = renderEdge(e);
      if (el) edgesLayer.appendChild(el);
    });

    nodesLayer.innerHTML = '';
    state.nodes.forEach(n => {
      nodesLayer.appendChild(renderNode(n));
    });

    updateStatus();
    applyViewport();
    updateCanvasEmpty();
  }

  function applyViewport() {
    viewport.setAttribute('transform', `translate(${state.pan.x}, ${state.pan.y}) scale(${state.zoom})`);
    zoomDisplay.textContent = Math.round(state.zoom * 100) + '%';
  }

  function updateCanvasEmpty() {
    canvasEmpty.style.display = state.nodes.length === 0 ? 'block' : 'none';
  }

  function updateStatus() {
    $('statNodes').textContent = state.nodes.length;
    $('statEdges').textContent = state.edges.length;
    const cycle = hasCycle(state.nodes, state.edges);
    $('statCycle').style.display = cycle ? 'flex' : 'none';
    $('statusDot').className = 'status-dot' + (cycle ? ' err' : '');
    $('statusText').textContent = cycle ? '循環偵測' : '就緒';
  }

  /* ============================================================
     11. CANVAS INTERACTIONS — Drag/Drop, Pan, Zoom
     ============================================================ */

  // Drag from palette → drop on canvas
  canvasWrap.addEventListener('dragover', (e) => {
    if (e.dataTransfer.types.includes('application/flowforge-node')) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    }
  });

  canvasWrap.addEventListener('drop', (e) => {
    const type = e.dataTransfer.getData('application/flowforge-node');
    if (!type || !NODE_TYPES[type]) return;
    e.preventDefault();
    const pt = svgPoint(e);
    const node = createNode(type, pt.x - NODE_W / 2, pt.y - (NODE_HEADER_H + NODE_BODY_H) / 2);
    state.nodes.push(node);
    state.selectedNodeId = node.id;
    state.selectedEdgeId = null;
    pushHistory();
    render();
    renderInspector();
  });

  // Pan
  canvas.addEventListener('mousedown', (e) => {
    if (e.target === canvas || e.target.classList.contains('grid-pattern')) {
      // start pan
      state.panning = { startX: e.clientX, startY: e.clientY, panX: state.pan.x, panY: state.pan.y };
      canvas.classList.add('panning');
      // deselect
      if (state.selectedNodeId || state.selectedEdgeId) {
        state.selectedNodeId = null;
        state.selectedEdgeId = null;
        render();
        renderInspector();
      }
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (state.panning) {
      const dx = e.clientX - state.panning.startX;
      const dy = e.clientY - state.panning.startY;
      state.pan.x = state.panning.panX + dx;
      state.pan.y = state.panning.panY + dy;
      applyViewport();
    } else if (state.nodeDrag) {
      const pt = svgPoint(e);
      const n = state.nodes.find(nn => nn.id === state.nodeDrag.nodeId);
      if (n) {
        n.x = pt.x - state.nodeDrag.offsetX;
        n.y = pt.y - state.nodeDrag.offsetY;
        // re-render just this node + edges (cheap: re-render all)
        render();
      }
    } else if (state.connecting) {
      // update ghost edge
      updateGhostEdge(e);
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (state.panning) {
      state.panning = null;
      canvas.classList.remove('panning');
    }
    if (state.nodeDrag) {
      state.nodeDrag = null;
      pushHistory();
    }
    if (state.connecting) {
      // try to complete connection
      finishConnection(e);
    }
  });

  // Zoom
  canvasWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const newZoom = clamp(state.zoom * factor, 0.25, 3);
    // zoom around mouse position
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const dx = (mx - state.pan.x) * (factor - 1);
    const dy = (my - state.pan.y) * (factor - 1);
    state.pan.x -= dx * state.zoom / newZoom;
    state.pan.y -= dy * state.zoom / newZoom;
    state.zoom = newZoom;
    applyViewport();
  }, { passive: false });

  function zoomBy(factor) {
    const cx = canvas.clientWidth / 2;
    const cy = canvas.clientHeight / 2;
    const newZoom = clamp(state.zoom * factor, 0.25, 3);
    const dx = (cx - state.pan.x) * (factor - 1);
    const dy = (cy - state.pan.y) * (factor - 1);
    state.pan.x -= dx * state.zoom / newZoom;
    state.pan.y -= dy * state.zoom / newZoom;
    state.zoom = newZoom;
    applyViewport();
  }

  function fitView() {
    if (state.nodes.length === 0) {
      state.zoom = 1; state.pan = { x: 0, y: 0 };
      applyViewport();
      return;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    state.nodes.forEach(n => {
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + NODE_W);
      maxY = Math.max(maxY, n.y + NODE_HEADER_H + NODE_BODY_H);
    });
    const padding = 60;
    const w = maxX - minX + padding * 2;
    const h = maxY - minY + padding * 2;
    const sx = canvas.clientWidth / w;
    const sy = canvas.clientHeight / h;
    state.zoom = clamp(Math.min(sx, sy), 0.25, 1.5);
    state.pan.x = padding - minX * state.zoom + (canvas.clientWidth - w * state.zoom) / 2;
    state.pan.y = padding - minY * state.zoom + (canvas.clientHeight - h * state.zoom) / 2;
    applyViewport();
  }

  /* ============================================================
     12. NODE INTERACTIONS — drag, select, connect
     ============================================================ */

  function attachNodeHandlers(g, n) {
    g.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('handle')) return; // handle handles its own
      e.stopPropagation();

      // select
      state.selectedNodeId = n.id;
      state.selectedEdgeId = null;
      render();
      renderInspector();

      // start drag
      const pt = svgPoint(e);
      state.nodeDrag = {
        nodeId: n.id,
        offsetX: pt.x - n.x,
        offsetY: pt.y - n.y
      };
    });

    g.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      // inline rename via inspector; double-click could prompt
      const newLabel = prompt('節點標籤', n.label || NODE_TYPES[n.type].label);
      if (newLabel !== null) {
        n.label = newLabel;
        pushHistory();
        render();
      }
    });

    // handle click for connection
    g.querySelectorAll('.handle').forEach(h => {
      h.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        const kind = h.dataset.handleKind;
        if (kind === 'source') {
          state.connecting = {
            sourceId: n.id,
            sourceHandle: parseInt(h.dataset.handleIndex || '0', 10)
          };
          canvas.classList.add('connecting');
          h.classList.add('connecting');
          e.preventDefault();
        }
      });

      h.addEventListener('mouseup', (e) => {
        if (state.connecting && h.dataset.handleKind === 'target') {
          e.stopPropagation();
          completeConnection(n.id);
        }
      });
    });
  }

  function updateGhostEdge(e) {
    overlayLayer.innerHTML = '';
    const src = state.nodes.find(n => n.id === state.connecting.sourceId);
    if (!src) return;
    const p1 = handlePos(src, 'source', state.connecting.sourceHandle);
    const pt = svgPoint(e);
    const p2 = { x: pt.x, y: pt.y };

    // check if would create cycle
    const wouldCycle = wouldCreateCycle(state.connecting.sourceId, p2);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', bezierPath(p1, p2));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', wouldCycle ? 'var(--err)' : 'var(--accent)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-dasharray', '4 3');
    path.setAttribute('marker-end', 'url(#arrowGhost)');
    path.style.pointerEvents = 'none';
    overlayLayer.appendChild(path);
  }

  function finishConnection(e) {
    canvas.classList.remove('connecting');
    overlayLayer.innerHTML = '';
    document.querySelectorAll('.handle.connecting').forEach(h => h.classList.remove('connecting'));
    // If mouseup is over a target handle, attachConnection already done
    state.connecting = null;
  }

  function completeConnection(targetId) {
    const src = state.connecting.sourceId;
    if (src === targetId) {
      toast('不能連接到自己', 'warn');
      finishConnection();
      return;
    }
    // prevent duplicate
    if (state.edges.some(e => e.source === src && e.target === targetId)) {
      toast('連線已存在', 'warn');
      finishConnection();
      return;
    }
    // check cycle
    if (wouldCreateCycle(src, null, targetId)) {
      toast('連線會造成循環', 'error');
      finishConnection();
      return;
    }
    state.edges.push({
      id: genId('e'),
      source: src,
      target: targetId,
      sourceHandle: state.connecting.sourceHandle
    });
    finishConnection();
    pushHistory();
    render();
  }

  function wouldCreateCycle(sourceId, dropPoint, explicitTargetId) {
    // Build a candidate edge and test
    const targetId = explicitTargetId;
    if (!targetId) return false; // can't pre-check without a target
    const candidate = {
      id: '__candidate__',
      source: sourceId,
      target: targetId
    };
    const testEdges = state.edges.concat([candidate]);
    return hasCycle(state.nodes, testEdges);
  }

  /* ============================================================
     13. DAG VALIDATION (DFS cycle detection, from micro-skill #4)
     ============================================================ */

  function hasCycle(nodes, edges) {
    if (nodes.length === 0) return false;
    const adj = {};
    nodes.forEach(n => { adj[n.id] = []; });
    edges.forEach(e => {
      if (adj[e.source]) adj[e.source].push(e.target);
    });
    const visited = new Set();
    const recStack = new Set();
    function dfs(id) {
      if (recStack.has(id)) return true;
      if (visited.has(id)) return false;
      visited.add(id);
      recStack.add(id);
      for (const next of (adj[id] || [])) {
        if (dfs(next)) return true;
      }
      recStack.delete(id);
      return false;
    }
    for (const n of nodes) {
      if (dfs(n.id)) return true;
    }
    return false;
  }

  function topologicalSort(nodes, edges) {
    const inDeg = {};
    const byId = {};
    nodes.forEach(n => { inDeg[n.id] = 0; byId[n.id] = n; });
    edges.forEach(e => {
      if (byId[e.target] && inDeg[e.target] != null) {
        inDeg[e.target]++;
      }
    });
    const queue = nodes.filter(n => inDeg[n.id] === 0);
    const order = [];
    const adj = {};
    nodes.forEach(n => { adj[n.id] = []; });
    edges.forEach(e => {
      if (adj[e.source]) adj[e.source].push(e.target);
    });
    while (queue.length) {
      const n = queue.shift();
      order.push(n);
      (adj[n.id] || []).forEach(t => {
        if (inDeg[t] == null) return;
        inDeg[t]--;
        if (inDeg[t] === 0 && byId[t]) queue.push(byId[t]);
      });
    }
    return order;
  }

  /* ============================================================
     14. CREATE NODE
     ============================================================ */

  function createNode(type, x, y) {
    const schema = NODE_TYPES[type];
    return {
      id: genId(type[0]),
      type: type,
      x: clamp(x, -2000, 2000),
      y: clamp(y, -2000, 2000),
      label: schema.label,
      data: schema.defaultData()
    };
  }

  /* ============================================================
     15. INSPECTOR
     ============================================================ */

  function renderInspector() {
    inspectorContent.innerHTML = '';
    if (state.selectedNodeId) {
      const n = state.nodes.find(x => x.id === state.selectedNodeId);
      if (n) { renderNodeInspector(n); return; }
    }
    if (state.selectedEdgeId) {
      const e = state.edges.find(x => x.id === state.selectedEdgeId);
      if (e) { renderEdgeInspector(e); return; }
    }
    // empty
    inspectorEmpty.style.display = 'block';
    inspectorContent.style.display = 'none';
  }

  function renderNodeInspector(n) {
    inspectorEmpty.style.display = 'none';
    inspectorContent.style.display = 'block';
    const schema = NODE_TYPES[n.type];

    // meta
    const meta = document.createElement('div');
    meta.className = 'inspector-meta';
    meta.innerHTML = `
      <div class="inspector-meta-row"><span class="inspector-meta-key">ID</span><span class="inspector-meta-val">${escapeHtml(n.id)}</span></div>
      <div class="inspector-meta-row"><span class="inspector-meta-key">類型</span><span class="inspector-meta-val">${escapeHtml(schema.label)}</span></div>
      <div class="inspector-meta-row"><span class="inspector-meta-key">座標</span><span class="inspector-meta-val">${Math.round(n.x)}, ${Math.round(n.y)}</span></div>
      <div class="inspector-meta-row"><span class="inspector-meta-key">輸入/輸出</span><span class="inspector-meta-val">${schema.inputs} / ${schema.outputs}</span></div>
    `;
    inspectorContent.appendChild(meta);

    // properties section
    const section = document.createElement('div');
    section.className = 'inspector-section';
    section.innerHTML = `<div class="inspector-section-title">屬性</div>`;

    // label
    const labelField = makeField({ key: '__label__', label: '顯示標籤', type: 'text', placeholder: schema.label });
    section.appendChild(labelField);
    labelField.querySelector('input').value = n.label || '';
    labelField.querySelector('input').addEventListener('input', (e) => {
      n.label = e.target.value;
      render();
    });
    labelField.querySelector('input').addEventListener('change', pushHistory);

    // type-specific fields
    schema.fieldSchema.forEach(field => {
      const f = makeField(field);
      f.querySelector('input, textarea, select').value = n.data[field.key] != null ? n.data[field.key] : '';
      f.querySelector('input, textarea, select').addEventListener('input', (e) => {
        n.data[field.key] = e.target.value;
        render();
      });
      f.querySelector('input, textarea, select').addEventListener('change', pushHistory);
      section.appendChild(f);
    });

    inspectorContent.appendChild(section);

    // connections section
    const connSection = document.createElement('div');
    connSection.className = 'inspector-section';
    connSection.innerHTML = `<div class="inspector-section-title">連線 <span>${incomingOf(n.id).length} in / ${outgoingOf(n.id).length} out</span></div>`;
    const incoming = incomingOf(n.id);
    const outgoing = outgoingOf(n.id);
    if (incoming.length === 0 && outgoing.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'font-size:11px;color:var(--text-2);padding:4px 0';
      empty.textContent = '無連線';
      connSection.appendChild(empty);
    } else {
      incoming.forEach(e => {
        const src = state.nodes.find(x => x.id === e.source);
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px;border-top:1px solid var(--border-1)';
        row.innerHTML = `<span style="color:var(--text-2)">← ${escapeHtml(src ? src.label : '?')}</span>`;
        const btn = document.createElement('button');
        btn.className = 'btn ghost';
        btn.textContent = '✕';
        btn.style.fontSize = '10px';
        btn.style.padding = '2px 6px';
        btn.addEventListener('click', () => {
          state.edges = state.edges.filter(x => x.id !== e.id);
          pushHistory(); render(); renderInspector();
        });
        row.appendChild(btn);
        connSection.appendChild(row);
      });
      outgoing.forEach(e => {
        const tgt = state.nodes.find(x => x.id === e.target);
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px;border-top:1px solid var(--border-1)';
        row.innerHTML = `<span style="color:var(--text-2)">→ ${escapeHtml(tgt ? tgt.label : '?')}</span>`;
        const btn = document.createElement('button');
        btn.className = 'btn ghost';
        btn.textContent = '✕';
        btn.style.fontSize = '10px';
        btn.style.padding = '2px 6px';
        btn.addEventListener('click', () => {
          state.edges = state.edges.filter(x => x.id !== e.id);
          pushHistory(); render(); renderInspector();
        });
        row.appendChild(btn);
        connSection.appendChild(row);
      });
    }
    inspectorContent.appendChild(connSection);

    // delete button
    const delSection = document.createElement('div');
    delSection.style.cssText = 'margin-top:12px';
    const delBtn = document.createElement('button');
    delBtn.className = 'btn danger';
    delBtn.style.width = '100%';
    delBtn.innerHTML = '<span class="btn-icon">✕</span> 刪除節點';
    delBtn.addEventListener('click', () => {
      if (!confirm('確定刪除此節點? 相關連線也會一併移除。')) return;
      deleteNode(n.id);
    });
    delSection.appendChild(delBtn);
    inspectorContent.appendChild(delSection);
  }

  function renderEdgeInspector(e) {
    inspectorEmpty.style.display = 'none';
    inspectorContent.style.display = 'block';
    const src = state.nodes.find(n => n.id === e.source);
    const tgt = state.nodes.find(n => n.id === e.target);
    const meta = document.createElement('div');
    meta.className = 'inspector-meta';
    meta.innerHTML = `
      <div class="inspector-meta-row"><span class="inspector-meta-key">ID</span><span class="inspector-meta-val">${escapeHtml(e.id)}</span></div>
      <div class="inspector-meta-row"><span class="inspector-meta-key">來源</span><span class="inspector-meta-val">${escapeHtml(src ? src.label : '?')}</span></div>
      <div class="inspector-meta-row"><span class="inspector-meta-key">目標</span><span class="inspector-meta-val">${escapeHtml(tgt ? tgt.label : '?')}</span></div>
      <div class="inspector-meta-row"><span class="inspector-meta-key">來源端點</span><span class="inspector-meta-val">#${e.sourceHandle || 0}</span></div>
    `;
    inspectorContent.appendChild(meta);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn danger';
    delBtn.style.cssText = 'width:100%;margin-top:12px';
    delBtn.innerHTML = '<span class="btn-icon">✕</span> 刪除連線';
    delBtn.addEventListener('click', () => {
      state.edges = state.edges.filter(x => x.id !== e.id);
      state.selectedEdgeId = null;
      pushHistory();
      render(); renderInspector();
    });
    inspectorContent.appendChild(delBtn);
  }

  function makeField(field) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const label = document.createElement('label');
    label.className = 'field-label';
    label.textContent = field.label;
    wrap.appendChild(label);

    if (field.type === 'textarea') {
      const ta = document.createElement('textarea');
      ta.className = 'field-textarea';
      ta.placeholder = field.placeholder || '';
      wrap.appendChild(ta);
    } else if (field.type === 'select') {
      const sel = document.createElement('select');
      sel.className = 'field-select';
      const options = Array.isArray(field.options) ? field.options : field.options.map(v => ({ value: v, label: v }));
      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.value || opt;
        o.textContent = opt.label || opt;
        sel.appendChild(o);
      });
      wrap.appendChild(sel);
    } else {
      const inp = document.createElement('input');
      inp.className = 'field-input';
      inp.type = 'text';
      inp.placeholder = field.placeholder || '';
      wrap.appendChild(inp);
    }
    return wrap;
  }

  function incomingOf(nodeId) {
    return state.edges.filter(e => e.target === nodeId);
  }
  function outgoingOf(nodeId) {
    return state.edges.filter(e => e.source === nodeId);
  }

  function deleteNode(nodeId) {
    state.nodes = state.nodes.filter(n => n.id !== nodeId);
    state.edges = state.edges.filter(e => e.source !== nodeId && e.target !== nodeId);
    state.selectedNodeId = null;
    pushHistory();
    render(); renderInspector();
  }

  /* ============================================================
     16. EXPORT / IMPORT
     ============================================================ */

  function exportJSON() {
    const data = {
      version: '1.0',
      name: state.flowName,
      createdAt: new Date().toISOString(),
      nodes: state.nodes,
      edges: state.edges
    };
    const json = JSON.stringify(data, null, 2);
    showModal('匯出流程 JSON', json, [
      { label: '下載 .json', primary: true, action: () => downloadFile(json, slugify(state.flowName) + '.json', 'application/json') },
      { label: '複製到剪貼簿', action: () => { copyToClipboard(json); } },
      { label: '關閉', action: closeModal }
    ]);
  }

  function exportCode() {
    const code = generateWorkflowCode();
    showModal('匯出執行引擎程式碼', code, [
      { label: '下載 .js', primary: true, action: () => downloadFile(code, slugify(state.flowName) + '.js', 'text/javascript') },
      { label: '複製到剪貼簿', action: () => { copyToClipboard(code); } },
      { label: '關閉', action: closeModal }
    ]);
  }

  function generateWorkflowCode() {
    // generate a Node.js-style execution function
    const lines = [];
    lines.push('/**');
    lines.push(' * ' + state.flowName);
    lines.push(' * Generated by FlowForge on ' + new Date().toISOString());
    lines.push(' * Nodes: ' + state.nodes.length + ', Edges: ' + state.edges.length);
    lines.push(' */');
    lines.push('');
    lines.push('async function executeWorkflow(context = {}) {');
    lines.push('  const log = (msg, data) => console.log(`[${new Date().toISOString()}] ${msg}`, data ?? "");');
    lines.push('  const state = {};');
    lines.push('  const results = {};');
    lines.push('');
    lines.push('  // --- Node definitions ---');
    state.nodes.forEach(n => {
      const dataStr = JSON.stringify(n.data || {}).replace(/`/g, '\\`').replace(/\\/g, '\\\\');
      const label = (n.label || NODE_TYPES[n.type].label).replace(/'/g, "\\'");
      const fnName = 'node_' + n.id.replace(/[^a-zA-Z0-9_]/g, '_');
      lines.push('  // ' + n.id + ' (' + n.type + ') "' + label + '"');
      lines.push('  async function ' + fnName + '(input) {');
      lines.push('    log(\'Executing ' + label + '\');');
      lines.push('    const data = ' + dataStr + ';');
      switch (n.type) {
        case 'trigger':
          lines.push('    // Trigger: source=' + (dataStr.match(/"source"\s*:\s*"([^"]*)"/) || [])[1] + ', event=' + ((dataStr.match(/"event"\s*:\s*"([^"]*)"/) || [])[1] || ''));
          lines.push('    return { triggered: true, source: data.source, event: data.event, payload: input };');
          break;
        case 'condition':
          const expr = (n.data && n.data.expression) || '';
          lines.push('    // Condition: ' + String(expr).replace(/'/g, "\\'"));
          lines.push('    // TODO: evaluate expression safely in production');
          lines.push('    const value = input && input.value;');
          lines.push("    return { branch: value ? 'true' : 'false', value };");
          break;
        case 'action':
          const url = (n.data && n.data.url) || '';
          const method = (n.data && n.data.method) || '';
          const act = (n.data && n.data.action) || '';
          lines.push('    // Action: ' + String(act).replace(/'/g, "\\'") + ' ' + String(method).replace(/'/g, "\\'") + ' ' + String(url).replace(/'/g, "\\'"));
          lines.push('    return { action: data.action, url: data.url, method: data.method, result: { ok: true } };');
          break;
        case 'notify':
          const ch = (n.data && n.data.channel) || '';
          const rcpt = (n.data && n.data.recipient) || '';
          lines.push('    // Notify: ' + String(ch).replace(/'/g, "\\'") + ' -> ' + String(rcpt).replace(/'/g, "\\'"));
          lines.push('    return { channel: data.channel, recipient: data.recipient, sent: true };');
          break;
        case 'end':
          lines.push('    return { status: data.status, finished: true };');
          break;
      }
      lines.push('  }');
      lines.push('');
    });
    lines.push('  // --- Topology ---');
    lines.push('  const adjacency = {');
    state.nodes.forEach(n => {
      const outs = outgoingOf(n.id).map(e => {
        const tgt = state.nodes.find(x => x.id === e.target);
        return "'" + (tgt ? tgt.id : '') + "': " + (e.sourceHandle || 0);
      });
      lines.push("    '" + n.id + "': { " + outs.join(', ') + " },");
    });
    lines.push('  };');
    lines.push('');
    lines.push('  // --- Execution (topological) ---');
    lines.push('  const nodeFns = {');
    state.nodes.forEach(n => {
      const safeId = n.id.replace(/[^a-zA-Z0-9_]/g, '_');
      lines.push("    '" + n.id + "': node_" + safeId + ",");
    });
    lines.push('  };');
    lines.push('  const inDeg = {};');
    state.nodes.forEach(n => { lines.push("  inDeg['" + n.id + "'] = " + incomingOf(n.id).length + ';'); });
    lines.push('  const queue = [];');
    state.nodes.forEach(n => { if (incomingOf(n.id).length === 0) lines.push("  queue.push('" + n.id + "');"); });
    lines.push('  while (queue.length) {');
    lines.push('    const id = queue.shift();');
    lines.push('    const fn = nodeFns[id];');
    lines.push('    const result = await fn(state[id]);');
    lines.push('    results[id] = result;');
    lines.push('    Object.entries(adjacency[id] || {}).forEach(([tgt, h]) => {');
    lines.push('      state[tgt] = state[tgt] || {};');
    lines.push('      state[tgt][h === 0 ? "true" : "false"] = result;');
    lines.push('      if (--inDeg[tgt] === 0) queue.push(tgt);');
    lines.push('    });');
    lines.push('  }');
    lines.push('  return results;');
    lines.push('}');
    lines.push('');
    lines.push('module.exports = { executeWorkflow };');
    return lines.join('\n');
  }

  function importJSON(jsonStr) {
    try {
      const data = JSON.parse(jsonStr);
      if (!data.nodes || !data.edges) throw new Error('缺少 nodes 或 edges 欄位');
      state.nodes = data.nodes;
      state.edges = data.edges;
      state.flowName = data.name || 'Imported Workflow';
      $('flowName').value = state.flowName;
      state.selectedNodeId = null;
      state.selectedEdgeId = null;
      // re-id to avoid collision
      const used = new Set();
      state.nodes.forEach(n => {
        if (!n.id || used.has(n.id)) n.id = genId(n.type ? n.type[0] : 'n');
        used.add(n.id);
      });
      state.edges.forEach(e => {
        if (!e.id || used.has(e.id)) e.id = genId('e');
        used.add(e.id);
      });
      pushHistory();
      render();
      fitView();
      toast('匯入成功', 'success');
    } catch (err) {
      toast('匯入失敗: ' + err.message, 'error');
    }
  }

  function downloadFile(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => toast('已複製到剪貼簿', 'success'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      toast('已複製到剪貼簿', 'success');
    }
  }

  function slugify(s) {
    return (s || 'workflow').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '');
  }

  /* ============================================================
     17. MODAL
     ============================================================ */

  function showModal(title, bodyHtml, buttons) {
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = bodyHtml;
    $('modalFooter').innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'btn' + (b.primary ? ' primary' : '');
      btn.textContent = b.label;
      btn.addEventListener('click', b.action);
      $('modalFooter').appendChild(btn);
    });
    $('modal').classList.add('open');
  }
  function closeModal() { $('modal').classList.remove('open'); }

  /* ============================================================
     18. SIMULATION
     ============================================================ */

  async function simulate() {
    if (state.isExecuting) {
      toast('模擬正在執行中', 'warn');
      return;
    }
    if (state.nodes.length === 0) {
      toast('流程是空的', 'warn');
      return;
    }
    if (hasCycle(state.nodes, state.edges)) {
      toast('流程有循環,無法執行', 'error');
      return;
    }
    state.isExecuting = true;
    clearExecutionStyles();
    const order = topologicalSort(state.nodes, state.edges);
    const logEntries = [];

    // show log in modal
    const logHtml = '<div class="exec-log" id="execLog"></div>';
    showModal('流程執行模擬', logHtml, [
      { label: '關閉', action: () => { state.isExecuting = false; clearExecutionStyles(); closeModal(); } }
    ]);

    function addLog(msg, kind) {
      const ts = new Date().toLocaleTimeString();
      const log = $('execLog');
      if (!log) return;
      const entry = document.createElement('div');
      entry.className = 'exec-log-entry ' + (kind || '');
      entry.innerHTML = `<span class="ts">${ts}</span>${escapeHtml(msg)}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    addLog('開始執行: ' + state.flowName);
    for (const n of order) {
      const nodeEl = nodesLayer.querySelector(`[data-node-id="${n.id}"]`);
      if (nodeEl) nodeEl.classList.add('executing');
      addLog(`▶ ${n.label || NODE_TYPES[n.type].label} (${n.type})`, '');
      await sleep(450);
      if (n.type === 'end') {
        if (nodeEl) {
          nodeEl.classList.remove('executing');
          nodeEl.classList.add('completed');
        }
        addLog(`✓ 流程結束 (${n.data && n.data.status || 'success'})`, 'ok');
      } else {
        if (nodeEl) {
          nodeEl.classList.remove('executing');
          nodeEl.classList.add('completed');
        }
        addLog(`✓ 完成`, 'ok');
      }
    }
    addLog('---', '');
    addLog('全部節點執行完畢', 'ok');
    state.isExecuting = false;
  }

  function clearExecutionStyles() {
    nodesLayer.querySelectorAll('.node-group').forEach(el => {
      el.classList.remove('executing', 'completed', 'error');
    });
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ============================================================
     19. VALIDATION MODAL
     ============================================================ */

  function validate() {
    const issues = [];
    if (state.nodes.length === 0) issues.push('流程沒有任何節點');
    // 0 triggers
    const triggers = state.nodes.filter(n => n.type === 'trigger');
    if (triggers.length === 0) issues.push('流程缺少觸發器 (Trigger)');
    if (triggers.length > 1) issues.push(`流程有多個觸發器 (${triggers.length} 個) — 預期只有 1 個入口`);
    // 0 ends
    const ends = state.nodes.filter(n => n.type === 'end');
    if (ends.length === 0) issues.push('流程缺少結束節點 (End)');
    // disconnected nodes
    const reachable = new Set();
    triggers.forEach(t => {
      const stack = [t.id];
      while (stack.length) {
        const id = stack.pop();
        if (reachable.has(id)) continue;
        reachable.add(id);
        outgoingOf(id).forEach(e => stack.push(e.target));
      }
    });
    const disconnected = state.nodes.filter(n => !reachable.has(n.id));
    if (disconnected.length) issues.push(`${disconnected.length} 個節點未連入主流程: ${disconnected.map(n => n.label).join(', ')}`);
    // cycle
    if (hasCycle(state.nodes, state.edges)) issues.push('偵測到循環 (DAG 必須是無循環的有向圖)');
    // orphan edges
    state.edges.forEach(e => {
      if (!state.nodes.find(n => n.id === e.source)) issues.push('連線 ' + e.id + ' 來源節點不存在');
      if (!state.nodes.find(n => n.id === e.target)) issues.push('連線 ' + e.id + ' 目標節點不存在');
    });
    // dangling handles
    state.nodes.forEach(n => {
      const schema = NODE_TYPES[n.type];
      if (schema.inputs > 0 && incomingOf(n.id).length === 0 && n.type !== 'trigger') {
        issues.push(`節點 "${n.label}" 沒有輸入連線`);
      }
    });

    if (issues.length === 0) {
      showModal('驗證結果', `
        <div class="validator-banner ok" style="display:block">
          ✓ 流程結構正確,沒有發現問題
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-1)">
          統計: ${state.nodes.length} 個節點 · ${state.edges.length} 條連線 · ${triggers.length} 個入口 · ${ends.length} 個結束
        </div>
      `, [{ label: '確定', primary: true, action: closeModal }]);
    } else {
      const html = `
        <div class="validator-banner" style="display:block">
          ✗ 發現 ${issues.length} 個問題
        </div>
        <ul style="margin-top:12px;padding-left:20px;font-size:12px;line-height:1.8;color:var(--text-1)">
          ${issues.map(i => `<li>${escapeHtml(i)}</li>`).join('')}
        </ul>
      `;
      showModal('驗證結果', html, [{ label: '確定', primary: true, action: closeModal }]);
    }
  }

  /* ============================================================
     20. KEYBOARD SHORTCUTS
     ============================================================ */

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (state.selectedNodeId) { deleteNode(state.selectedNodeId); e.preventDefault(); }
      else if (state.selectedEdgeId) {
        state.edges = state.edges.filter(x => x.id !== state.selectedEdgeId);
        state.selectedEdgeId = null;
        pushHistory(); render(); renderInspector();
        e.preventDefault();
      }
    } else if (e.key === 'Escape') {
      if (state.connecting) finishConnection();
      else {
        state.selectedNodeId = null; state.selectedEdgeId = null;
        render(); renderInspector();
      }
    } else if (e.key === 'z' && (e.ctrlKey || e.metaKey) && !e.shiftKey) {
      e.preventDefault(); undo();
    } else if ((e.key === 'z' && (e.ctrlKey || e.metaKey) && e.shiftKey) || (e.key === 'y' && (e.ctrlKey || e.metaKey))) {
      e.preventDefault(); redo();
    } else if (e.key === '0' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); fitView();
    }
  });

  /* ============================================================
     21. TOPBAR / TOOLBAR BINDINGS
     ============================================================ */

  $('flowName').addEventListener('input', (e) => { state.flowName = e.target.value; });
  $('flowName').addEventListener('change', pushHistory);

  $('btnUndo').addEventListener('click', undo);
  $('btnRedo').addEventListener('click', redo);
  $('btnValidate').addEventListener('click', validate);
  $('btnSimulate').addEventListener('click', simulate);
  $('btnImport').addEventListener('click', () => {
    showModal('匯入流程', `
      <p style="font-size:12px;color:var(--text-1);margin-bottom:8px">貼上先前匯出的 JSON:</p>
      <textarea id="importText" class="field-textarea" style="min-height:200px;width:100%" placeholder='{"nodes":[...], "edges":[...]}'></textarea>
    `, [
      { label: '取消', action: closeModal },
      { label: '匯入', primary: true, action: () => { const v = $('importText').value; if (v) { importJSON(v); closeModal(); } } }
    ]);
  });
  $('btnExport').addEventListener('click', exportJSON);
  $('btnExportCode').addEventListener('click', exportCode);
  $('btnClear').addEventListener('click', () => {
    if (state.nodes.length === 0) return;
    if (!confirm('確定清空整個流程? 復原可恢復。')) return;
    state.nodes = []; state.edges = [];
    state.selectedNodeId = null; state.selectedEdgeId = null;
    pushHistory();
    render(); renderInspector();
  });
  $('btnSave').addEventListener('click', () => {
    // save to localStorage
    try {
      localStorage.setItem('flowforge:' + slugify(state.flowName), snapshot());
      toast('已儲存: ' + state.flowName, 'success');
    } catch (err) {
      toast('儲存失敗: ' + err.message, 'error');
    }
  });

  $('btnZoomIn').addEventListener('click', () => zoomBy(1.2));
  $('btnZoomOut').addEventListener('click', () => zoomBy(1/1.2));
  $('btnZoomFit').addEventListener('click', fitView);

  $('modalClose').addEventListener('click', closeModal);
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')) closeModal();
  });

  /* ============================================================
     22. INIT — load demo + render
     ============================================================ */

  function loadDemo() {
    // first bump nextId past demo ids
    state.nextId = 100;
    state.nodes = [
      { id: 't1', type: 'trigger', x: 80, y: 120, label: '訂單建立',
        data: { source: 'webhook', event: 'order.created' } },
      { id: 'c1', type: 'condition', x: 360, y: 120, label: '金額檢查',
        data: { expression: 'amount > 10000', trueLabel: '高', falseLabel: '低' } },
      { id: 'a1', type: 'action', x: 660, y: 40, label: '風控審核',
        data: { action: 'http_request', url: 'https://risk.example.com/review', method: 'POST' } },
      { id: 'n1', type: 'notify', x: 660, y: 200, label: '通知業務',
        data: { channel: 'slack', recipient: '#sales', template: '新訂單 {{id}}' } },
      { id: 'e1', type: 'end', x: 960, y: 120, label: '完成',
        data: { status: 'success' } }
    ];
    state.edges = [
      { id: 'e_t1_c1', source: 't1', target: 'c1', sourceHandle: 0 },
      { id: 'e_c1_a1', source: 'c1', target: 'a1', sourceHandle: 0 },
      { id: 'e_c1_n1', source: 'c1', target: 'n1', sourceHandle: 1 },
      { id: 'e_a1_e1', source: 'a1', target: 'e1', sourceHandle: 0 },
      { id: 'e_n1_e1', source: 'n1', target: 'e1', sourceHandle: 0 }
    ];
    state.flowName = '訂單處理流程';
    $('flowName').value = state.flowName;
  }

  function init() {
    renderPalette();
    loadDemo();
    pushHistory();
    render();
    fitView();
    toast('歡迎使用 FlowForge — 試試拖曳節點到畫布', '');
  }

  init();

  // expose for debugging
  window.FlowForge = { state, NODE_TYPES, hasCycle, topologicalSort, exportJSON, importJSON };

})();
</script>
