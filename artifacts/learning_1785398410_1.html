// ───────── Hooks ─────────
function useDarkMode() {
  const [dark, setDark] = useState(() => {
    try {
      const saved = localStorage.getItem("admin-dark");
      if (saved !== null) return saved === "1";
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch { return false; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
    try { localStorage.setItem("admin-dark", dark ? "1" : "0"); } catch {}
  }, [dark]);
  return [dark, setDark];
}

// ───────── Building blocks ─────────
function StatCard({ kpi, index }) {
  const reduce = useReducedMotion();
  const positive = kpi.invert ? kpi.delta < 0 : kpi.delta > 0;
  return (
    <motion.div
      initial={reduce ? false : { opacity: 0, y: 20 }}
      animate={{ opacity: 1, y: 0 }}
      transition={{ delay: 0.05 * index, duration: 0.5, ease: [0.2, 0.8, 0.2, 1] }}
      whileHover={reduce ? {} : { y: -4, transition: { duration: 0.2 } }}
      whileTap={reduce ? {} : { scale: 0.98 }}
      className="glass rounded-2xl p-5 shadow-glass relative overflow-hidden focus-ring"
      tabIndex={0}
      role="article"
      aria-label={`${kpi.label} ${kpi.value}${kpi.suffix}`}
    >
      <div className={`absolute -top-12 -right-12 w-40 h-40 rounded-full bg-gradient-to-br ${kpi.color} opacity-20 blur-2xl pointer-events-none`} />
      <div className="flex items-start justify-between mb-3">
        <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${kpi.color} text-white grid place-items-center shadow-glow`}>
          <Icon name={kpi.icon} className="w-5 h-5" />
        </div>
        <motion.span
          initial={reduce ? false : { opacity: 0, x: 10 }}
          animate={{ opacity: 1, x: 0 }}
          transition={{ delay: 0.05 * index + 0.2 }}
          className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-1 rounded-full ${
            positive ? "bg-emerald-500/15 text-emerald-600 dark:text-emerald-300"
                     : "bg-rose-500/15 text-rose-600 dark:text-rose-300"}`}
        >
          <Icon name={positive ? "arrowUp" : "arrowDown"} className="w-3 h-3" />
          {Math.abs(kpi.delta)}%
        </motion.span>
      </div>
      <div className="text-sm text-slate-500 dark:text-slate-400">{kpi.label}</div>
      <div className="mt-1 flex items-baseline gap-1">
        <motion.span
          initial={reduce ? false : { opacity: 0 }}
          animate={{ opacity: 1 }}
          transition={{ delay: 0.05 * index + 0.1, duration: 0.6 }}
          className="text-3xl font-extrabold tracking-tight gradient-text"
        >
          {kpi.value.toLocaleString()}
        </motion.span>
        <span className="text-sm text-slate-500 dark:text-slate-400">{kpi.suffix}</span>
      </div>

          d="M0,18 L12,14 L24,16 L36,9 L48,12 L60,6 L72,10 L84,4 L100,7"
          fill="none"
          stroke="url(#g)"
          strokeWidth="2"
          strokeLinecap="round"
          initial={reduce ? false : { pathLength: 0 }}
          animate={{ pathLength: 1 }}
          transition={{ delay: 0.05 * index + 0.3, duration: 1.2, ease: "easeOut" }}
        />
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#3563ff"/>
            <stop offset="100%" stopColor="#ec4899"/>
          </linearGradient>
        </defs>
      </svg>
    </motion.div>
  );
}

function BarChart({ data }) {
  const reduce = useReducedMotion();
  const max = Math.max(...data.map(d => d.v));
  return (
    <div className="flex items-end gap-3 sm:gap-5 h-48" role="img" aria-label="本週處理量長條圖">
      {data.map((d, i) => {
        const h = (d.v / max);
        return (
          <div key={d.d} className="flex-1 flex flex-col items-center gap-2 h-full">
            <motion.div
              initial={reduce ? false : { scaleY: 0, opacity: 0 }}
              animate={{ scaleY: h, opacity: 1 }}
              transition={{ delay: 0.08 * i, duration: 0.9, ease: [0.2, 0.8, 0.2, 1] }}
              className="w-full rounded-xl bar-fill shadow-glow relative group cursor-pointer origin-bottom"
              style={{ minHeight: 8, height: '100%' }}
              whileHover={reduce ? {} : { scale: 1.05 }}
              aria-label={`${d.d} ${d.v} 件`}
            >
              <div className="opacity-0 group-hover:opacity-100 transition-opacity absolute -top-7 left-1/2 -translate-x-1/2
                              text-[10px] bg-slate-900 text-white px-1.5 py-0.5 rounded whitespace-nowrap">
                {d.v} 件
              </div>
            </motion.div>
            <span className="text-xs text-slate-500 dark:text-slate-400">{d.d}</span>
          </div>
        );
      })}
    </div>
  );
}

function TaskTable({ tasks, onOpen }) {
  const reduce = useReducedMotion();
  const [filter, setFilter] = useState("全部");
  const [sortKey, setSortKey] = useState("due");
  const [sortDir, setSortDir] = useState("asc");
  const [q, setQ] = useState("");

  const filtered = useMemo(() => {
    let r = tasks.slice();
    if (filter !== "全部") r = r.filter(t => t.status === filter);
    if (q.trim()) r = r.filter(t => (t.title + t.owner + t.dept).toLowerCase().includes(q.toLowerCase()));
    r.sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return r;
  }, [tasks, filter, q, sortKey, sortDir]);

  const toggleSort = (k) => {
    if (sortKey === k) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortKey(k); setSortDir("asc"); }
  };

  const statusStyle = (s) => ({
    "待審":   "bg-amber-500/15 text-amber-700 dark:text-amber-300",
    "進行中": "bg-brand-500/15 text-brand-700 dark:text-brand-300",
    "已完成": "bg-emerald-500/15 text-emerald-700 dark:text-emerald-300",
  }[s] || "bg-slate-500/15");

  const priorityStyle = (p) => ({

function DetailModal({ task, onClose }) {

    if (!task) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    setTimeout(() => ref.current?.focus(), 50);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [task, onClose]);

  return (
    <AnimatePresence>

          <section aria-label="關鍵指標" className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            {KPIS.map((kpi, i) => <StatCard key={kpi.id} kpi={kpi} index={i} />)}
          </section>

          <section className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <motion.div
              initial={reduce ? false : { opacity: 0, y: 16 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ delay: 0.2, duration: 0.5 }}
              className="glass rounded-2xl p-5 shadow-glass lg:col-span-2"
            >
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h3 className="text-lg font-bold">本週處理量</h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400">單位：件 / 工作天</p>
                </div>
                <div className="flex gap-1 text-xs">
                  {["週", "月", "季"].map((p, i) => (
                    <button key={p} className={`px-2.5 py-1 rounded-lg focus-ring ${i === 0 ? "bg-brand-500 text-white" : "bg-white/60 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10"}`}>{p}</button>
                  ))}
                </div>
              </div>
              <BarChart data={BAR_DATA} />
            </motion.div>

            <motion.div
              initial={reduce ? false : { opacity: 0, y: 16 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ delay: 0.3, duration: 0.5 }}
              className="glass rounded-2xl p-5 shadow-glass"
            >
              <h3 className="text-lg font-bold mb-3">近期動態</h3>
              <ul className="space-y-3">
                {[
                  { who: "王小明", what: "送審", target: "暑期營隊報名", time: "剛剛", color: "from-brand-500 to-purple-500" },
                  { who: "陳大文", what: "完成", target: "體育館借用", time: "10 分鐘前", color: "from-emerald-500 to-teal-500" },
                  { who: "林怡君", what: "指派", target: "資訊採購案給 王組長", time: "1 小時前", color: "from-amber-500 to-orange-500" },
                  { who: "張雅婷", what: "退回", target: "新進教師文件 v1", time: "2 小時前", color: "from-rose-500 to-pink-500" },
                  { who: "李建宏", what: "更新", target: "會計月結報告", time: "今天 09:21", color: "from-brand-500 to-pink-500" },
                ].map((a, i) => (
                  <motion.li
                    key={i}
                    initial={reduce ? false : { opacity: 0, x: -10 }}
                    animate={{ opacity: 1, x: 0 }}
                    transition={{ delay: 0.4 + 0.06 * i }}
                    className="flex items-start gap-3"
                  >
                    <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${a.color} text-white grid place-items-center text-xs font-bold flex-shrink-0`}>
                      {a.who.slice(-2)}
                    </div>
                    <div className="flex-1 min-w-0 text-sm">
                      <div className="truncate">
                        <b>{a.who}</b> <span className="text-slate-500 dark:text-slate-400">{a.what}</span> <span>{a.target}</span>
                      </div>
                      <div className="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">{a.time}</div>
                    </div>
                  </motion.li>
                ))}
              </ul>
            </motion.div>
          </section>

          <motion.section
            initial={reduce ? false : { opacity: 0, y: 16 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ delay: 0.4, duration: 0.5 }}
            className="glass rounded-2xl p-5 shadow-glass"
          >
            <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
              <div>
                <h3 className="text-lg font-bold">案件管理</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400">共 {tasks.length} 件 · {tasks.filter(t => t.status === "待審").length} 件待審</p>
              </div>
              <div className="flex gap-2">
                <button className="px-3 py-1.5 rounded-xl text-xs font-medium bg-white/70 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 focus-ring">匯出 CSV</button>
                <button className="px-3 py-1.5 rounded-xl text-xs font-medium bg-white/70 dark:bg-white/5 hover:bg-white dark:hover:bg-white/10 focus-ring">進階篩選</button>
              </div>
            </div>
            <TaskTable tasks={tasks} onOpen={setModalTask} />
          </motion.section>

          <footer className="text-center text-xs text-slate-500 dark:text-slate-400 py-4">
            © 2026 Enki Admin · Built with React 18 · Framer Motion 11 · Tailwind CSS
          </footer>
        </main>
      </div>

      <DetailModal task={modalTask} onClose={() => setModalTask(null)} />
      <Toast toasts={toasts} onDismiss={(id) => setToasts(arr => arr.filter(t => t.id !== id))} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
