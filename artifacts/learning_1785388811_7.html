<style>
  /* ============================================================
     Glassmorphism Design System - 公務資料知識庫
     ============================================================ */
  :root {
    --bg-grad-1: #0f0c29;
    --bg-grad-2: #302b63;
    --bg-grad-3: #24243e;
    --glass-bg: rgba(40, 50, 90, 0.55);
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-hover: rgba(60, 70, 120, 0.65);
    --text-primary: #f5f5f7;
    --text-secondary: rgba(245, 245, 247, 0.78);
    --text-tertiary: rgba(245, 245, 247, 0.55);
    --accent-blue: #6ea8fe;
    --accent-purple: #c084fc;
    --accent-cyan: #67e8f9;
    --accent-green: #4ade80;
    --accent-orange: #fb923c;
    --accent-red: #f87171;
    --accent-yellow: #fbbf24;
    --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 24px rgba(110, 168, 254, 0.22);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(110, 168, 254, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.1) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1320px; margin: 0 auto; padding: 32px 24px; position: relative; z-index: 1; }

  /* ---------- Header ---------- */
  .header {
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 28px 36px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-glass);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: var(--shadow-glow);
  }

  .brand-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .brand-subtitle {
    font-size: 12px;
    color: var(--text-tertiary);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .header-stat {
    backdrop-filter: blur(10px);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 10px 16px;
    border-radius: var(--radius-md);
    font-size: 13px;
    color: var(--text-secondary);
  }
  .header-stat strong { color: var(--accent-cyan); font-weight: 700; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .tab {
    backdrop-filter: blur(10px);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 10px 18px;
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .tab:hover { background: var(--glass-hover); color: var(--text-primary); }
  .tab.active {
    background: linear-gradient(135deg, rgba(110, 168, 254, 0.3), rgba(192, 132, 252, 0.3));
    border-color: rgba(110, 168, 254, 0.5);
    color: var(--text-primary);
    box-shadow: var(--shadow-glow);
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    backdrop-filter: blur(16px);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    margin-bottom: 24px;
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: var(--shadow-glass);
  }

  .search-box {
    flex: 1;
    min-width: 240px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 10px 16px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .search-box::placeholder { color: var(--text-tertiary); }
  .search-box:focus {
    outline: none;
    border-color: var(--accent-blue);
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.18);
  }

  .result-count {
    font-size: 13px;
    color: var(--text-tertiary);
  }
  .result-count strong { color: var(--accent-cyan); }

  /* ---------- Card Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 18px;
  }

  .card {
    background: linear-gradient(135deg, rgba(60, 70, 120, 0.6), rgba(40, 50, 90, 0.5));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 22px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
    opacity: 0.6;
  }
  .card:hover {
    background: var(--glass-hover);
    border-color: rgba(110, 168, 254, 0.4);
    transform: translateY(-2px);
    box-shadow: var(--shadow-glass), var(--shadow-glow);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .card-num {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  .card-title {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text-primary);
  }

  .card-source {
    display: inline-block;
    font-size: 11px;
    color: var(--accent-cyan);
    background: rgba(103, 232, 249, 0.1);
    padding: 3px 9px;
    border-radius: 6px;
    border: 1px solid rgba(103, 232, 249, 0.2);
    margin-bottom: 4px;
  }

  .card-content {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .meta-tag {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--glass-border);
    color: var(--text-secondary);
  }
  .meta-tag strong {
    color: var(--accent-cyan);
    font-weight: 600;
    margin-right: 4px;
  }

  .card-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-tertiary);
  }

  .card-link {
    color: var(--accent-blue);
    text-decoration: none;
    font-size: 12px;
    transition: color 0.2s;
  }
  .card-link:hover { color: var(--accent-purple); }

  /* ---------- Empty / Loading ---------- */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-tertiary);
    backdrop-filter: blur(10px);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 40px;
    padding: 24px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12px;
    backdrop-filter: blur(10px);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
  }
  .footer code {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    color: var(--accent-cyan);
    background: rgba(103, 232, 249, 0.08);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 640px) {
    .container { padding: 16px 12px; }
    .header { padding: 20px 18px; }
    .grid { grid-template-columns: 1fr; }
  }

  /* ---------- Animations ---------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeUp 0.4s ease both; }
  .card:nth-child(2n) { animation-delay: 0.04s; }
  .card:nth-child(3n) { animation-delay: 0.08s; }
  .card:nth-child(5n) { animation-delay: 0.12s; }
</style>
</head>

  // ============================================================
  // 狀態
  // ============================================================
  let activeSite = "all";
  let searchQuery = "";

  // ============================================================
  // 工具
  // ============================================================
  const SITE_LABELS = {
    "all": "全部",
    "data_gov_tw": "📊 政府資料開放平臺",
    "ey_gov_announcements": "📢 行政院人事總處",
    "generic_table_demo": "🔍 通用表格掃描",
    "wiki_tw_admin": "🗺️ 維基百科 - 臺灣行政區劃",
  };

  function escapeHtml(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function siteLabel(name) { return SITE_LABELS[name] || name; }

  function matches(doc) {
    if (activeSite !== "all" && doc.source_site !== activeSite) return false;
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    const haystack = [
      doc.title || "",
      doc.content || "",
      JSON.stringify(doc.metadata || {}),
    ].join(" ").toLowerCase();
    return haystack.includes(q);
  }

  // ============================================================
  // 渲染
  // ============================================================
  function renderHeader() {
    const s = DATA.stats;
    const html = `
      <div class="header-stat">總文件 <strong>${s.total_documents}</strong></div>
      <div class="header-stat">來源網站 <strong>${Object.keys(s.by_site).length}</strong></div>
      <div class="header-stat">成功抓取 <strong>${s.successful_scrapes}</strong></div>
      <div class="header-stat">更新 <strong>${DATA.scraped_at.split("T")[1] || ""}</strong></div>
    `;
    document.getElementById("header-stats").innerHTML = html;
  }

  function renderTabs() {
    const sites = ["all", ...new Set(DATA.documents.map(d => d.source_site))];
    const html = sites.map(site => {
      const count = site === "all"
        ? DATA.documents.length
        : DATA.documents.filter(d => d.source_site === site).length;
      return `<button class="tab ${site === activeSite ? "active" : ""}" data-site="${escapeHtml(site)}">
        ${siteLabel(site)} <span style="opacity:0.6">(${count})</span>
      </button>`;
    }).join("");
    document.getElementById("tabs").innerHTML = html;

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeSite = btn.dataset.site;
        render();
      });
    });
  }

  function renderGrid() {
    const filtered = DATA.documents.filter(matches);
    document.getElementById("result-count").innerHTML =
      `顯示 <strong>${filtered.length}</strong> / ${DATA.documents.length} 筆`;

    if (filtered.length === 0) {
      document.getElementById("grid").innerHTML = `
        <div class="empty" style="grid-column: 1 / -1;">
          <div class="empty-icon">📭</div>
          <div>沒有符合條件的文件</div>
        </div>`;
      return;
    }

    document.getElementById("grid").innerHTML = filtered.map((doc, i) => {
      const metaTags = Object.entries(doc.metadata || {})
        .slice(0, 4)
        .map(([k, v]) => `<span class="meta-tag"><strong>${escapeHtml(k)}:</strong>${escapeHtml(v)}</span>`)
        .join("");

      const content = doc.content
        ? `<div class="card-content">${escapeHtml(doc.content)}</div>`
        : "";

      const link = doc.source_url && doc.source_url.startsWith("http")
        ? `<a href="${escapeHtml(doc.source_url)}" target="_blank" rel="noopener" class="card-link">🔗 來源連結</a>`
        : `<span class="card-link" style="color: var(--text-tertiary);">📁 ${escapeHtml((doc.source_url || "").slice(0, 30))}</span>`;

      return `
        <article class="card">
          <div class="card-header">
            <div class="card-num">${i + 1}</div>
            <div style="flex:1">
              <span class="card-source">${escapeHtml(siteLabel(doc.source_site))}</span>
              <div class="card-title">${escapeHtml(doc.title)}</div>
            </div>
          </div>
          ${content}
          <div class="meta-row">${metaTags}</div>
          <div class="card-footer">
            <span>${escapeHtml((doc.created_at || "").split("T")[0])}</span>
            ${link}
          </div>
        </article>
      `;
    }).join("");
  }

  function render() { renderHeader(); renderTabs(); renderGrid(); }

  // ============================================================
  // 事件
  // ============================================================
  document.getElementById("search").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderGrid();
  });

  // 啟動
  render();
</script>
