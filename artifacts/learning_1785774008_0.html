<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes 視覺回歸測試示範頁</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #475569;
    --accent: #2563eb;
    --accent-2: #10b981;
    --danger: #ef4444;
    --radius: 14px;
    --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { padding: 32px; }
  .container { max-width: 1080px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 0.2px; }
  header .tag { background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .card h3 { margin: 0 0 6px 0; font-size: 14px; color: var(--muted); font-weight: 500; }
  .card .value { font-size: 28px; font-weight: 700; }
  .card.success .value { color: var(--accent-2); }
  .card.warn .value { color: var(--danger); }
  .panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px 0; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .status.pass { background: rgba(16,185,129,0.12); color: var(--accent-2); }
  .status.fail { background: rgba(239,68,68,0.12); color: var(--danger); }
  .status.run { background: rgba(37,99,235,0.12); color: var(--accent); }
  .btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">Hermes 視覺回歸測試示範</h1>
      <span class="tag" id="env-tag">env: production</span>
    </header>

    <section class="grid" aria-label="kpi">
      <div class="card">
        <h3>總測試數</h3>
        <div class="value" id="kpi-total">128</div>
      </div>
      <div class="card success">
        <h3>通過</h3>
        <div class="value" id="kpi-pass">120</div>
      </div>
      <div class="card warn">
        <h3>失敗</h3>
        <div class="value" id="kpi-fail">8</div>
      </div>
    </section>

    <section class="panel">
      <h2>最近測試結果</h2>
      <table id="result-table">
        <thead>
          <tr><th>測試名稱</th><th>瀏覽器</th><th>耗時</th><th>狀態</th></tr>
        </thead>
        <tbody>
          <tr><td>homepage-render</td><td>chromium</td><td>1.2s</td><td><span class="status pass">PASS</span></td></tr>
          <tr><td>login-flow</td><td>firefox</td><td>2.4s</td><td><span class="status pass">PASS</span></td></tr>
          <tr><td>checkout-mobile</td><td>webkit</td><td>3.1s</td><td><span class="status fail">FAIL</span></td></tr>
          <tr><td>visual-regression</td><td>chromium</td><td>0.9s</td><td><span class="status run">RUN</span></td></tr>
        </tbody>
      </table>
    </section>

    <section class="panel">
      <h2>控制台</h2>
      <button class="btn" id="replay-btn">重跑測試</button>
    </section>

    <footer>© 2026 Hermes Demo · fixed-pixel-render</footer>
  </div>

  <script>
    // 固定像素,避免動態隨機造成 visual regression 假警報
    document.getElementById('replay-btn').addEventListener('click', () => {
      const tbody = document.querySelector('#result-table tbody');
      const row = document.createElement('tr');
      row.innerHTML = '<td>manual-replay</td><td>chromium</td><td>0.0s</td><td><span class="status run">RUN</span></td>';
      tbody.appendChild(row);
    });
  </script>
</body>
</html>
