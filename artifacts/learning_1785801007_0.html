<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>跨瀏覽器視覺回歸測試目標頁 · 交付展示</title>
<style>
  :root {
    --bg: #f5f7fb;
    --fg: #1a202c;
    --primary: #3b82f6;
    --accent: #10b981;
    --radius: 8px;
    --shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 28px; margin: 0 0 8px; color: var(--fg); }
  .subtitle { color: #64748b; margin: 0; }
  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
  }
  .btn {
    display: inline-block;
    padding: 10px 20px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background .2s;
  }
  .btn:hover { background: #2563eb; }
  .btn-success { background: var(--accent); }
  .btn-success:hover { background: #059669; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .grid-item {
    padding: 16px;
    background: #f1f5f9;
    border-radius: var(--radius);
    text-align: center;
    font-weight: 500;
  }
  #counter {
    font-size: 36px;
    font-weight: 700;
    color: var(--primary);
    text-align: center;
    margin: 16px 0;
  }
  #status {
    margin-top: 8px;
    padding: 8px 12px;
    background: #ecfdf5;
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: #065f46;
  }
  footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 32px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>跨瀏覽器視覺回歸測試目標頁</h1>
    <p class="subtitle">Playwright · Chromium / Firefox / WebKit</p>
  </header>

  <section class="card" data-testid="counter-card">
    <h2>計數器組件</h2>
    <div id="counter" data-testid="counter-value">0</div>
    <div style="text-align:center;">
      <button class="btn" id="decrement" data-testid="btn-decrement">−</button>
      <button class="btn" id="increment" data-testid="btn-increment">+</button>
      <button class="btn btn-success" id="reset" data-testid="btn-reset">重置</button>
    </div>
    <div id="status" data-testid="status">準備就緒</div>
  </section>

  <section class="card" data-testid="grid-card">
    <h2>響應式網格</h2>
    <p>用於驗證 CSS Grid 在三個瀏覽器的渲染一致性。</p>
    <div class="grid" data-testid="grid">
      <div class="grid-item">項目 1</div>
      <div class="grid-item">項目 2</div>
      <div class="grid-item">項目 3</div>
      <div class="grid-item">項目 4</div>
      <div class="grid-item">項目 5</div>
      <div class="grid-item">項目 6</div>
    </div>
  </section>

  <footer>
    渲染於 <span id="browser-info" data-testid="browser-info">unknown</span>
  </footer>
</div>

<script>
  (function () {
    var counter = 0;
    var counterEl = document.getElementById('counter');
    var statusEl = document.getElementById('status');
    var browserEl = document.getElementById('browser-info');

    function update(label) {
      counterEl.textContent = String(counter);
      statusEl.textContent = label + ' (當前值: ' + counter + ')';
    }

    document.getElementById('increment').addEventListener('click', function () {
      counter += 1;
      update('已 +1');
    });
    document.getElementById('decrement').addEventListener('click', function () {
      counter -= 1;
      update('已 -1');
    });
    document.getElementById('reset').addEventListener('click', function () {
      counter = 0;
      update('已重置');
    });

    var ua = navigator.userAgent;
    var browser = 'unknown';
    if (ua.indexOf('Firefox') !== -1) browser = 'Firefox';
    else if (ua.indexOf('WebKit') !== -1 && ua.indexOf('Chrome') === -1) browser = 'WebKit';
    else if (ua.indexOf('Chrome') !== -1) browser = 'Chromium';
    browserEl.textContent = browser;
  })();
</script>
</body>
</html>
