<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Node Error Console</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a2e;--line:#263653;--text:#d9e4ff;--muted:#8ca0c5;--red:#ff6b81;--amber:#ffc857;--green:#5ee6a8;--blue:#75a7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1c2b50 0,#0b1020 45%);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}button,select{background:#192743;color:var(--text);border:1px solid #38527c;border-radius:7px;padding:8px 12px;font:inherit;cursor:pointer}button:hover{border-color:var(--blue)}main{max-width:1300px;margin:0 auto;padding:22px 28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.status{color:var(--green);margin-left:auto}.status.offline{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel h2{font-size:13px;color:var(--muted);padding:12px 14px;margin:0;border-bottom:1px solid var(--line)}#events{max-height:620px;overflow:auto}.event{padding:13px 15px;border-bottom:1px solid #1c2943;cursor:pointer}.event:hover,.event.active{background:#172643}.event-head{display:flex;gap:10px;align-items:center}.badge{font-size:11px;border-radius:4px;padding:2px 6px;background:#3d1e31;color:var(--red)}.badge.warn{background:#463719;color:var(--amber)}.message{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.detail{padding:16px;min-height:300px}.empty{color:var(--muted);padding:30px;text-align:center}.kv{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:8px 0}.kv b{color:var(--muted)}pre{white-space:pre-wrap;overflow:auto;background:#09101f;border:1px solid var(--line);padding:12px;border-radius:8px;color:#b9cdf6}label{color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.status{margin-left:0}}
</style>
</head>
<body>
<header><h1>◈ Node.js / Browser Error Console</h1><span id="status" class="status">connecting…</span></header>
<main>
<div class="toolbar"><button id="test">觸發後端測試錯誤</button><button id="clear">清除畫面</button><button id="pause">暫停串流</button><select id="filter"><option value="all">全部事件</option><option value="error">error</option><option value="backend">backend</option><option value="console">console</option><option value="unhandledrejection">unhandledrejection</option></select></div>
<div class="grid"><section class="panel"><h2>LIVE EVENTS (<span id="count">0</span>)</h2><div id="events"><div class="empty">等待錯誤事件…</div></div></section><section class="panel"><h2>EVENT INSPECTOR</h2><div id="detail" class="detail"><div class="empty">選取左側事件查看完整資訊</div></div></section></div>
</main>
<script>
'use strict';
const eventsEl=document.querySelector('#events'), detailEl=document.querySelector('#detail'), countEl=document.querySelector('#count'), statusEl=document.querySelector('#status');
const state={events:[],paused:false,source:null,selected:null};
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const filter=document.querySelector('#filter').value;const visible=state.events.filter(e=>filter==='all'||e.type===filter);countEl.textContent=visible.length;eventsEl.innerHTML=visible.length?'':'<div class="empty">沒有符合條件的事件</div>';visible.slice().reverse().forEach(e=>{const row=document.createElement('article');row.className='event'+(state.selected===e.id?' active':'');row.innerHTML=`<div class="event-head"><span class="badge ${e.level==='warn'?'warn':''}">${escapeHtml(e.type)}</span><span>${escapeHtml(e.receivedAt)}</span></div><div class="message">${escapeHtml(e.message)}</div><div class="meta">${escapeHtml(e.source)} · ${escapeHtml(e.request?.method)} ${escapeHtml(e.request?.path)}</div>`;row.onclick=()=>{state.selected=e.id;renderDetail(e);render();};eventsEl.appendChild(row);});}
function renderDetail(e){detailEl.innerHTML=`<div class="kv"><b>ID</b><span>${escapeHtml(e.id)}</span></div><div class="kv"><b>Time</b><span>${escapeHtml(e.receivedAt)}</span></div><div class="kv"><b>Type</b><span>${escapeHtml(e.type)} / ${escapeHtml(e.level)}</span></div><div class="kv"><b>Source</b><span>${escapeHtml(e.source)}</span></div><div class="kv"><b>Request</b><span>${escapeHtml(e.request?.method)} ${escapeHtml(e.request?.path)}</span></div><div class="kv"><b>Message</b><span>${escapeHtml(e.message)}</span></div><h3>Stack</h3><pre>${escapeHtml(e.stack||'No stack available')}</pre>`;}
function addEvent(e){if(state.paused)return;state.events.push(e);if(state.events.length>200)state.events.shift();render();}
function connect(){if(state.source)state.source.close();const source=new EventSource('/api/errors/stream');state.source=source;source.addEventListener('ready',()=>{statusEl.textContent='● connected';statusEl.className='status'});source.addEventListener('error',()=>{statusEl.textContent='● disconnected';statusEl.className='status offline'});source.addEventListener('error',event=>{try{if(event.data)addEvent(JSON.parse(event.data));}catch(_){}});}
document.querySelector('#test').onclick=()=>fetch('/api/test-error',{method:'POST'});document.querySelector('#clear').onclick=()=>{state.events=[];state.selected=null;detailEl.innerHTML='<div class="empty">選取左側事件查看完整資訊</div>';render();};document.querySelector('#pause').onclick=e=>{state.paused=!state.paused;e.target.textContent=state.paused?'恢復串流':'暫停串流';};document.querySelector('#filter').onchange=render;
window.addEventListener('error',e=>fetch('/api/errors',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'error',source:'browser',message:e.message,stack:e.error?.stack,url:location.href,line:e.lineno,column:e.colno})}));window.addEventListener('unhandledrejection',e=>fetch('/api/errors',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'unhandledrejection',source:'browser',message:String(e.reason?.message||e.reason),stack:e.reason?.stack,url:location.href})}));
connect();fetch('/api/errors').then(r=>r.json()).then(d=>{state.events=d.errors||[];render();}).catch(()=>{});
</script>
</body>
</html>
