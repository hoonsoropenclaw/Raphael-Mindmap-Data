<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Workflow · 動態工作流自動化平台</title>

    <!-- React Flow CSS -->
    <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/base.css" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 UMD + Babel (for legacy fallback handling) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-0: #06070d;
            --bg-1: #0b0f1a;
            --bg-2: #121826;
            --panel: rgba(18, 24, 38, 0.72);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #7c5cff;
            --accent-2: #22d3ee;
            --accent-3: #f59e0b;
            --accent-4: #ef4444;
            --accent-5: #34d399;
            --text: #e6e8ee;
            --text-dim: #9aa3b2;
            --text-faint: #5b6470;
        }
        html, body, #root { height: 100%; }
        body {
            margin: 0;
            background:
                radial-gradient(1200px 800px at 12% -10%, rgba(124,92,255,0.22), transparent 60%),
                radial-gradient(900px 600px at 100% 0%, rgba(34,211,238,0.18), transparent 55%),
                radial-gradient(800px 600px at 50% 110%, rgba(245,158,11,0.10), transparent 60%),
                var(--bg-0);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', Tahoma, sans-serif;
            overflow: hidden;
        }
        .glass {
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--panel-border);
        }
        .glass-strong {
            background: rgba(11, 15, 26, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
        }
        .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .scrollbar::-webkit-scrollbar-track { background: transparent; }
        .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
        .scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }

        /* React Flow overrides */
        .react-flow__background { background-color: transparent; }
        .react-flow__node {
            font-size: 12px;
        }
        .react-flow__edge-path,
        .react-flow__connection-path { stroke-width: 2; }
        .react-flow__handle {
            width: 12px; height: 12px;
            border-radius: 999px;
            border: 2px solid #06070d;
        }
        .react-flow__handle.target { background: #22d3ee; }
        .react-flow__handle.source { background: #7c5cff; }
        .react-flow__minimap { background: rgba(11,15,26,0.85)!important; border-radius: 10px; }
        .react-flow__controls {
            background: rgba(11,15,26,0.85);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45);
        }
        .react-flow__controls-button {
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #cbd5e1;
            fill: #cbd5e1;
        }
        .react-flow__controls-button:hover { background: rgba(124,92,255,0.15); }

        /* Custom node */
        .wf-node {
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            min-width: 220px;
            max-width: 260px;
            color: var(--text);
            box-shadow: 0 6px 22px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .wf-node.selected {
            box-shadow: 0 0 0 1.5px var(--accent), 0 0 24px rgba(124,92,255,0.4), 0 6px 22px rgba(0,0,0,0.35);
        }
        .wf-node .head {
            padding: 10px 12px;
            display: flex; align-items: center; gap: 8px;
            font-weight: 600; font-size: 12.5px; letter-spacing: 0.2px;
        }
        .wf-node .body { padding: 8px 12px 12px; font-size: 12px; color: var(--text-dim); }
        .wf-node .body .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .wf-node .body .chip {
            font-size: 10px;
            padding: 2px 7px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 999px;
            color: var(--text-dim);
        }
        .wf-node.trigger .head { background: linear-gradient(90deg, rgba(124,92,255,0.22), rgba(124,92,255,0)); border-bottom: 1px solid rgba(124,92,255,0.25); }
        .wf-node.action .head { background: linear-gradient(90deg, rgba(34,211,238,0.22), rgba(34,211,238,0)); border-bottom: 1px solid rgba(34,211,238,0.25); }
        .wf-node.condition .head { background: linear-gradient(90deg, rgba(245,158,11,0.22), rgba(245,158,11,0)); border-bottom: 1px solid rgba(245,158,11,0.25); }
        .wf-node.delay .head { background: linear-gradient(90deg, rgba(52,211,153,0.22), rgba(52,211,153,0)); border-bottom: 1px solid rgba(52,211,153,0.25); }
        .wf-node.output .head { background: linear-gradient(90deg, rgba(239,68,68,0.22), rgba(239,68,68,0)); border-bottom: 1px solid rgba(239,68,68,0.25); }

        .wf-node.running { animation: pulseRunning 1.2s ease-in-out infinite; }
        .wf-node.success { box-shadow: 0 0 0 1.5px var(--accent-5), 0 0 24px rgba(52,211,153,0.45); }
        .wf-node.failed { box-shadow: 0 0 0 1.5px var(--accent-4), 0 0 24px rgba(239,68,68,0.45); }
        .wf-node.skipped { opacity: 0.45; }

        @keyframes pulseRunning {
            0%, 100% { box-shadow: 0 0 0 1.5px var(--accent), 0 0 18px rgba(124,92,255,0.35); }
            50% { box-shadow: 0 0 0 2.5px var(--accent), 0 0 28px rgba(124,92,255,0.65); }
        }

        .badge-soft { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--text-dim); }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 12px; border-radius: 9px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text); cursor: pointer; font-size: 12px;
            transition: all 0.18s ease;
        }
        .btn:hover { background: rgba(124,92,255,0.18); border-color: rgba(124,92,255,0.4); }
        .btn-primary {
            background: linear-gradient(135deg, #7c5cff 0%, #22d3ee 100%);
            border: none; color: white; font-weight: 600;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-danger { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); }
        .btn-danger:hover { background: rgba(239,68,68,0.25); }
        .input, .select, .textarea {
            width: 100%; padding: 7px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text); font-size: 12.5px; font-family: inherit;
            outline: none;
        }
        .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
        .select option { background: #0b0f1a; color: var(--text); }
        .label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; display: block; letter-spacing: 0.4px; text-transform: uppercase; }

        .palette-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 9px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            cursor: grab; user-select: none;
            font-size: 12.5px;
            transition: all 0.18s ease;
            margin-bottom: 6px;
        }
        .palette-item:hover { background: rgba(124,92,255,0.1); border-color: rgba(124,92,255,0.3); transform: translateY(-1px); }
        .palette-item:active { cursor: grabbing; transform: scale(0.98); }
        .palette-icon {
            width: 26px; height: 26px; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            color: white;
        }

        .log-line {
            font-family: 'JetBrains Mono', 'Menlo', monospace;
            font-size: 11.5px; padding: 4px 8px;
            border-radius: 6px;
            display: flex; gap: 8px; align-items: baseline;
        }
        .log-line .ts { color: var(--text-faint); flex-shrink: 0; }
        .log-line .tag { flex-shrink: 0; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        .log-line.ok .tag { background: rgba(52,211,153,0.2); color: #34d399; }
        .log-line.err .tag { background: rgba(239,68,68,0.2); color: #ef4444; }
        .log-line.info .tag { background: rgba(34,211,238,0.2); color: #22d3ee; }
        .log-line.warn .tag { background: rgba(245,158,11,0.2); color: #f59e0b; }

        /* React Flow edge animations */
        .react-flow__edge.animated .react-flow__edge-path {
            stroke-dasharray: 6;
            animation: dashdraw 0.6s linear infinite;
        }
        @keyframes dashdraw { to { stroke-dashoffset: -12; } }

        .react-flow__edge.selected .react-flow__edge-path,
        .react-flow__edge:hover .react-flow__edge-path { stroke: #7c5cff; }

        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-faint); font-size: 13px;
            pointer-events: none;
        }
        .status-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 999px;
        }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 999px; background: #34d399;
            box-shadow: 0 0 0 0 rgba(52,211,153,0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.7); }
            70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
            100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
        }

        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(6, 7, 13, 0.7);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: rgba(15, 20, 32, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            width: min(720px, 92vw);
            max-height: 80vh;
            overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
        }
        .kbd {
            display: inline-block; padding: 1px 5px; border-radius: 4px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
            font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
            color: var(--text-dim);
        }

        /* Animated drop hint */
        .drop-target { outline: 2px dashed rgba(124,92,255,0.5); outline-offset: -2px; }

        @media (max-width: 768px) {
            .side-panel { display: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="boot-error" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:40px;background:#06070d;color:#f8fafc;font-family:sans-serif;z-index:9999"></div>

    <script>
        // Boot-time diagnostic surface so any module/CDN failure shows up in the page itself
        (function () {
            const errBox = document.getElementById('boot-error');
            const showErr = (msg) => {
                errBox.style.display = 'flex';
                errBox.innerHTML = '<div style="max-width:560px"><h1 style="font-size:22px;margin:0 0 10px">⚠️ 無法啟動 Antigravity Workflow</h1>' +
                    '<pre style="white-space:pre-wrap;background:#0b0f1a;padding:14px;border-radius:8px;font-size:12px;color:#fca5a5">' + msg + '</pre>' +
                    '<p style="color:#9aa3b2;font-size:12.5px;margin-top:14px">請檢查網路連線,或重新整理頁面。</p></div>';
            };
            window.addEventListener('error', (e) => {
                if (!e || !e.message) return;
                showErr('[window.error] ' + e.message + (e.filename ? '\n  at ' + e.filename + ':' + e.lineno : ''));
            });
            window.addEventListener('unhandledrejection', (e) => {
                const reason = e && e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'unknown';
                showErr('[unhandledrejection] ' + reason);
            });
        })();
    </script>

    <!-- React Flow via importmap-style ESM: we use UMD build of React Flow 11 instead -->
    <script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>

    <script type="text/babel" data-presets="react,env">
    // ============================================================
    // Antigravity Workflow · Dynamic Workflow Automation Platform
    // Tech: React 18 (UMD) + React Flow 11 (UMD) + Tailwind
    // ============================================================

    const { useState, useEffect, useMemo, useCallback, useRef, useReducer } = React;
    const RF = window.ReactFlow; // namespace from UMD build

    const {
        ReactFlow,
        Background,
        Controls,
        MiniMap,
        ReactFlowProvider,
        useNodesState,
        useEdgesState,
        addEdge,
        Handle,
        Position,
        useReactFlow,
        MarkerType,
    } = RF;

    // ------------------------------------------------------------
    // NODE TYPE DEFINITIONS
    // ------------------------------------------------------------
    const NODE_TYPES = {
        trigger: {
            label: '觸發器',
            color: '#7c5cff',
            cls: 'trigger',
            icon: 'zap',
            variants: [
                { id: 'manual',     name: '手動觸發',     desc: '點按按鈕啟動工作流' },
                { id: 'webhook',    name: 'Webhook',      desc: '接收 HTTP POST 觸發' },
                { id: 'schedule',   name: '排程',         desc: 'Cron 時間觸發' },
                { id: 'form',       name: '表單提交',     desc: '使用者送出表單時觸發' },
                { id: 'email-in',   name: '收到信件',     desc: 'IMAP/POP3 信件到達' },
            ],
        },
        action: {
            label: '動作',
            color: '#22d3ee',
            cls: 'action',
            icon: 'play',
            variants: [
                { id: 'http',       name: 'HTTP 請求',      desc: '呼叫 REST API' },
                { id: 'send-email', name: '發送 Email',     desc: 'SMTP 寄信' },
                { id: 'db-write',   name: '寫入資料庫',     desc: 'INSERT / UPDATE' },
                { id: 'slack',      name: 'Slack 通知',     desc: '發到指定頻道' },
                { id: 'transform',  name: '資料轉換',       desc: 'JSON / 字串處理' },
                { id: 'ai-prompt',  name: 'AI 推論',        desc: '送 prompt 給 LLM' },
            ],
        },
        condition: {
            label: '條件',
            color: '#f59e0b',
            cls: 'condition',
            icon: 'git-branch',
            variants: [
                { id: 'if',         name: 'IF 分支',        desc: 'true / false 兩條路' },
                { id: 'switch',     name: 'Switch',         desc: '多路徑分流' },
                { id: 'filter',     name: 'Filter',         desc: '繼續或中止' },
            ],
        },
        delay: {
            label: '延遲',
            color: '#34d399',
            cls: 'delay',
            icon: 'clock',
            variants: [
                { id: 'wait-ms',    name: '等待 N 秒',      desc: 'sleep 任意時間' },
                { id: 'until',      name: '直到某時間',     desc: '等到特定 timestamp' },
                { id: 'debounce',   name: '去抖動',         desc: 'N 秒內合併多次' },
            ],
        },
        output: {
            label: '輸出',
            color: '#ef4444',
            cls: 'output',
            icon: 'flag',
            variants: [
                { id: 'log',        name: '記錄日誌',       desc: '輸出到 Log' },
                { id: 'webhook-out',name: '轉發 Webhook',   desc: '送給外部 endpoint' },
                { id: 'return',     name: '結束並回傳',     desc: '標記工作流完成' },
            ],
        },
    };

    // ------------------------------------------------------------
    // ICONS (lucide via window.lucide)
    // ------------------------------------------------------------
    const iconCache = new Map();
    function Icon({ name, size = 16, color = 'currentColor', strokeWidth = 2, className = '' }) {
        const ref = useRef(null);
        useEffect(() => {
            if (!ref.current || !window.lucide) return;
            const key = name + '|' + size + '|' + color + '|' + strokeWidth;
            if (iconCache.has(key)) {
                ref.current.innerHTML = iconCache.get(key);
                return;
            }
            try {
                const svg = window.lucide.createElement(window.lucide[name], { size, color, 'stroke-width': strokeWidth });
                const html = svg.outerHTML;
                iconCache.set(key, html);
                ref.current.innerHTML = html;
            } catch (e) {
                ref.current.textContent = '●';
            }
        }, [name, size, color, strokeWidth]);
        return <span ref={ref} className={className} style={{ display: 'inline-flex', lineHeight: 0 }} />;
    }

    // ------------------------------------------------------------
    // CUSTOM NODE COMPONENT
    // ------------------------------------------------------------
    function WorkflowNode({ id, data, selected, type }) {
        const cfg = NODE_TYPES[type] || NODE_TYPES.action;
        return (
            <div className={`wf-node ${cfg.cls} ${selected ? 'selected' : ''} ${data.status || ''}`}>
                {/* Handles — trigger has only source, output has only target, others both */}
                {type !== 'output' && (
                    <Handle type="target" position={Position.Left} id="in" />
                )}
                {type !== 'trigger' && (
                    <Handle type="source" position={Position.Right} id="out" />
                )}
                {type === 'condition' && (
                    <>
                        <Handle type="source" position={Position.Bottom} id="false" style={{ left: '35%', background: '#ef4444' }} />
                        <Handle type="source" position={Position.Bottom} id="true" style={{ left: '65%', background: '#34d399' }} />
                    </>
                )}
                <div className="head">
                    <Icon name={cfg.icon} size={15} color={cfg.color} />
                    <span style={{ flex: 1 }}>{cfg.label}</span>
                    {data.variant && <span className="badge-soft">{variantName(type, data.variant)}</span>}
                </div>
                <div className="body">
                    <div style={{ color: '#e6e8ee', fontWeight: 500, marginBottom: 4 }}>
                        {data.label || defaultLabel(type, data)}
                    </div>
                    <div style={{ fontSize: 11, color: '#9aa3b2' }}>
                        {data.summary || variantDesc(type, data.variant)}
                    </div>
                    {data.tags && data.tags.length > 0 && (
                        <div className="meta">
                            {data.tags.slice(0, 3).map((t, i) => (
                                <span className="chip" key={i}>{t}</span>
                            ))}
                        </div>
                    )}
                    {data.status && (
                        <div style={{ marginTop: 6, fontSize: 11, opacity: 0.85 }}>
                            {data.status === 'running' && <span style={{ color: '#7c5cff' }}>● 執行中...</span>}
                            {data.status === 'success' && <span style={{ color: '#34d399' }}>✓ 完成 ({data.durationMs || 0}ms)</span>}
                            {data.status === 'failed' && <span style={{ color: '#ef4444' }}>✕ 失敗：{data.error || ''}</span>}
                            {data.status === 'skipped' && <span style={{ color: '#5b6470' }}>○ 略過</span>}
                        </div>
                    )}
                </div>
            </div>
        );
    }

    function variantName(type, vId) {
        const v = NODE_TYPES[type]?.variants?.find(x => x.id === vId);
        return v ? v.name : vId;
    }
    function variantDesc(type, vId) {
        const v = NODE_TYPES[type]?.variants?.find(x => x.id === vId);
        return v ? v.desc : '';
    }
    function defaultLabel(type, data) {
        if (data.variant) return variantName(type, data.variant);
        if (type === 'condition') return data.expression || 'IF ...';
        if (type === 'delay') return `${data.ms || 1000}ms`;
        if (type === 'trigger') return '啟動工作流';
        return (NODE_TYPES[type]?.label) || type;
    }

    // ------------------------------------------------------------
    // SIDEBAR PALETTE
    // ------------------------------------------------------------
    function Palette({ onDragStart }) {
        return (
            <div className="scrollbar" style={{ overflowY: 'auto', padding: '6px 14px 14px' }}>
                {Object.entries(NODE_TYPES).map(([type, cfg]) => (
                    <div key={type} style={{ marginBottom: 14 }}>
                        <div style={{ fontSize: 11, color: 'var(--text-dim)', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 6 }}>
                            <Icon name={cfg.icon} size={12} color={cfg.color} />
                            {cfg.label}
                        </div>
                        {cfg.variants.map(v => (
                            <div
                                key={v.id}
                                className="palette-item"
                                draggable
                                onDragStart={(event) => onDragStart(event, type, v.id)}
                                title={v.desc}
                            >
                                <div className="palette-icon" style={{ background: cfg.color }}>
                                    <Icon name={cfg.icon} size={14} color="white" />
                                </div>
                                <div style={{ flex: 1, overflow: 'hidden' }}>
                                    <div style={{ fontSize: 12.5, color: 'var(--text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{v.name}</div>
                                    <div style={{ fontSize: 10.5, color: 'var(--text-faint)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{v.desc}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                ))}
            </div>
        );
    }

    // ------------------------------------------------------------
    // INSPECTOR PANEL (right)
    // ------------------------------------------------------------
    function Inspector({ node, edge, onChange, onDelete, onClose }) {
        if (!node && !edge) return (
            <div style={{ padding: 20, color: 'var(--text-faint)', fontSize: 12, textAlign: 'center' }}>
                <div style={{ marginBottom: 8, opacity: 0.6 }}>
                    <Icon name="mouse-pointer-click" size={28} color="#5b6470" />
                </div>
                點選節點或連線<br/>以編輯屬性
            </div>
        );

        if (edge) {
            return (
                <div className="scrollbar" style={{ padding: 16, overflowY: 'auto' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>

    // ------------------------------------------------------------
    // EXECUTION SIMULATOR
    // ------------------------------------------------------------
    async function simulateRun(nodes, edges, log) {
        const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
        const adj = {};
        edges.forEach(e => { (adj[e.source] ||= []).push(e); });

        // find triggers
        const triggers = nodes.filter(n => n.type === 'trigger');
        if (!triggers.length) {
            log({ ts: Date.now(), level: 'warn', msg: '沒有觸發器，無法執行' });
            return { success: false, ran: 0 };
        }

        let ranCount = 0;
        const visited = new Set();

        async function runNode(id, input) {
            if (visited.has(id)) return;
            visited.add(id);
            const node = nodeMap[id];
            if (!node) return;

            const start = Date.now();
            setNodeStatus(id, 'running');
            log({ ts: Date.now(), level: 'info', nodeId: id, msg: '▶ 開始執行 ' + (node.data.label || node.type) });

            // simulate duration based on variant
            const variantDurations = {
                'manual': 200, 'webhook': 600, 'schedule': 100, 'form': 400, 'email-in': 800,
                'http': 800, 'send-email': 600, 'db-write': 400, 'slack': 300, 'transform': 150, 'ai-prompt': 1500,
                'if': 100, 'switch': 100, 'filter': 100,
                'wait-ms': Math.max(0, Math.min(node.data.ms || 1000, 4000)),
                'until': 200, 'debounce': 300,
                'log': 100, 'webhook-out': 500, 'return': 50,
            };
            const dur = variantDurations[node.data.variant] != null ? variantDurations[node.data.variant] : 400;

            await new Promise(r => setTimeout(r, dur));
            const ms = Date.now() - start;

            // simulate failure for demo
            let failed = false;
            if (node.data.variant === 'http' && /fail/.test(node.data.url || '')) failed = true;
            if (node.data.variant === 'send-email' && /fail/.test(node.data.to || '')) failed = true;

            if (failed) {
                setNodeStatus(id, 'failed', { error: '模擬失敗（網址/收件人含 fail）', durationMs: ms });
                log({ ts: Date.now(), level: 'err', nodeId: id, msg: '✕ 失敗 ' + node.data.label + ' after ' + ms + 'ms' });
                return;
            }
            setNodeStatus(id, 'success', { durationMs: ms });
            ranCount++;
            log({ ts: Date.now(), level: 'ok', nodeId: id, msg: '✓ ' + (node.data.label || node.type) + ' 完成 (' + ms + 'ms)' });

            // propagate to children
            const outs = adj[id] || [];
            for (const e of outs) {
                if (node.type === 'condition' && e.sourceHandle) {
                    if (node.data.variant === 'if') {
                        const expr = (node.data.expression || '').trim();
                        const truthy = expr ? !/^(false|0|''|""|null|undefined)$/i.test(expr) : true;
                        const handleWanted = truthy ? 'true' : 'false';
                        if (e.sourceHandle !== handleWanted) {
                            log({ ts: Date.now(), level: 'info', nodeId: id, msg: '↪ 條件走 ' + handleWanted + ', 略過 ' + e.target });
                            continue;
                        }
                    }
                }
                await runNode(e.target, { ok: true, source: id });
            }
        }

        for (const t of triggers) {
            await runNode(t.id, { ok: true });
        }

        // clean up any untouched nodes (skipped)
        nodes.forEach(n => {
            if (!visited.has(n.id)) setNodeStatus(n.id, 'skipped');
        });

        log({ ts: Date.now(), level: 'info', msg: '🏁 執行完成。共觸達 ' + ranCount + ' 個節點' });
        return { success: true, ran: ranCount };
    }

    // Validate the workflow graph
    function validate(nodes, edges) {
        const errors = [];
        if (nodes.length === 0) errors.push('畫布是空的');
        const triggers = nodes.filter(n => n.type === 'trigger');
        if (triggers.length === 0) errors.push('缺少觸發器（Trigger）');
        if (triggers.length > 1) errors.push(`目前有 ${triggers.length} 個觸發器 —— 將全部同時啟動`);

        // orphans (no incoming edge and not a trigger)
        const incoming = new Set(edges.map(e => e.target));
        const orphans = nodes.filter(n => n.type !== 'trigger' && !incoming.has(n.id));
        if (orphans.length) errors.push(`${orphans.length} 個非觸發節點沒有上游連線 (${orphans.map(o => o.data.label || o.id).join(', ')})`);

        // nodes with no outgoing
        const outgoing = new Set(edges.map(e => e.source));
        const sinks = nodes.filter(n => n.type !== 'output' && !outgoing.has(n.id));
        if (sinks.length) errors.push(`${sinks.length} 個節點沒有下游連線: ${sinks.map(o => o.data.label || o.id).slice(0,3).join(', ')}`);

        // duplicate ids
        const ids = new Set();
        nodes.forEach(n => { if (ids.has(n.id)) errors.push(`重複節點 ID: ${n.id}`); ids.add(n.id); });

        return { ok: errors.length === 0, errors };
    }

    function AppInner() {
        const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes());
        const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges());
        const [wfName, setWfName] = useState('Webhook → 分流處理流程');
        const [selectedNode, setSelectedNode] = useState(null);
        const [selectedEdge, setSelectedEdge] = useState(null);
        const [logs, setLogs] = useState([]);
        const [isRunning, setIsRunning] = useState(false);
        const [libraryOpen, setLibraryOpen] = useState(false);
        const reactFlowWrapper = useRef(null);
        const { project } = useReactFlow();

        // Listen for status updates from simulator
        useEffect(() => {
            const onStatus = (e) => {
                const { id, status, ...rest } = e.detail;
                setNodes(curr => curr.map(n => n.id === id ? { ...n, data: { ...n.data, status, ...rest } } : n));
            };
            window.addEventListener('wf-node-status', onStatus);
            return () => window.removeEventListener('wf-node-status', onStatus);
        }, [setNodes]);

        const onConnect = useCallback((params) => setEdges((eds) => addEdge({ ...params, animated: false, markerEnd: { type: MarkerType.ArrowClosed } }, eds)), [setEdges]);

        const onDragStart = (event, nodeType, variant) => {
            event.dataTransfer.setData('application/reactflow', JSON.stringify({ nodeType, variant }));
            event.dataTransfer.effectAllowed = 'move';
        };

        const onDragOver = useCallback((event) => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
        }, []);

        const onDrop = useCallback((event) => {
            event.preventDefault();
            const raw = event.dataTransfer.getData('application/reactflow');
            if (!raw || !reactFlowWrapper.current) return;
            let payload;
            try { payload = JSON.parse(raw); } catch { return; }
            const { nodeType, variant } = payload;
            const bounds = reactFlowWrapper.current.getBoundingClientRect();
            const position = project({ x: event.clientX - bounds.left, y: event.clientY - bounds.top });
            const cfg = NODE_TYPES[nodeType];
            const variantInfo = cfg.variants.find(v => v.id === variant);
            const newId = `${nodeType}-${Date.now().toString(36).slice(-5)}`;
            const newNode = {
                id: newId,
                type: nodeType,
                position,
                data: {
                    label: variantInfo?.name || '新節點',
                    variant,
                    summary: variantInfo?.desc,
                },
            };
            setNodes(nds => nds.concat(newNode));
        }, [project, setNodes]);

        const updateNode = useCallback((id, patch) => {
            setNodes(curr => curr.map(n => n.id === id ? { ...n, ...patch } : n));
        }, [setNodes]);
        const updateEdge = useCallback((id, patch) => {
            setEdges(curr => curr.map(e => e.id === id ? { ...e, ...patch } : e));
        }, [setEdges]);

        const handleChange = (kind, updated) => {
            if (kind === 'node') updateNode(updated.id, updated);
            else updateEdge(updated.id, updated);
        };
        const handleDelete = (kind, id) => {
            if (kind === 'node') {
                setNodes(curr => curr.filter(n => n.id !== id));
                setEdges(curr => curr.filter(e => e.source !== id && e.target !== id));
                setSelectedNode(null);
            } else {
                setEdges(curr => curr.filter(e => e.id !== id));
                setSelectedEdge(null);
            }
        };

        const onSelectionChange = useCallback(({ nodes: ns, edges: es }) => {
            setSelectedNode(ns[0] || null);
            setSelectedEdge(es[0] || null);
        }, []);

        const clearStatuses = () => {
            setNodes(curr => curr.map(n => { const { status, durationMs, error, ...rest } = n.data; return { ...n, data: rest }; }));
        };

        const appendLog = (l) => setLogs(prev => [...prev, l].slice(-200));

        // wire global log sink
        useEffect(() => {
            const h = (e) => appendLog(e.detail);
            window.addEventListener('wf-log', h);
            return () => window.removeEventListener('wf-log', h);
        }, []);

        const run = async () => {
            if (isRunning) return;
            setIsRunning(true);
            clearStatuses();
            setLogs([]);
            appendLog({ ts: Date.now(), level: 'info', msg: '🚀 開始執行工作流' });
            try {
                await simulateRun(nodes, edges, appendLog);
            } catch (e) {
                appendLog({ ts: Date.now(), level: 'err', msg: '例外: ' + (e.message || e) });
            } finally {
                setIsRunning(false);
            }
        };

        const exportJSON = () => {
            const data = { name: wfName, nodes, edges, exportedAt: new Date().toISOString(), version: 1 };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${wfName.replace(/\s+/g, '-')}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            appendLog({ ts: Date.now(), level: 'info', msg: '💾 已匯出 JSON' });
        };

        const importJSON = () => {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = '.json';
            inp.onchange = (e) => {
                const f = e.target.files?.[0]; if (!f) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.name) setWfName(data.name);
                        if (Array.isArray(data.nodes)) setNodes(data.nodes);
                        if (Array.isArray(data.edges)) setEdges(data.edges);
                        setSelectedNode(null); setSelectedEdge(null);
                        appendLog({ ts: Date.now(), level: 'info', msg: '📥 已匯入: ' + (data.name || '未命名') });
                    } catch (err) {
                        alert('JSON 解析失敗：' + err.message);
                    }
                };
                reader.readAsText(f);
            };
            inp.click();
        };

        const save = () => {
            try {
                localStorage.setItem('antigravity-workflow', JSON.stringify({ name: wfName, nodes, edges }));
                appendLog({ ts: Date.now(), level: 'info', msg: '💾 已儲存到瀏覽器本地' });
            } catch (e) {
                appendLog({ ts: Date.now(), level: 'err', msg: '儲存失敗: ' + e.message });
            }
        };

        const loadFromStorage = () => {
            try {
                const raw = localStorage.getItem('antigravity-workflow');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.name) setWfName(data.name);
                if (data.nodes?.length) setNodes(data.nodes);
                if (data.edges?.length) setEdges(data.edges);
                appendLog({ ts: Date.now(), level: 'info', msg: '↺ 已從本地讀回' });
            } catch (e) { /* ignore */ }
        };

        useEffect(() => { loadFromStorage(); /* eslint-disable-next-line */ }, []);

        const reset = () => {
            if (!confirm('確定要清空畫布並重新載入預設範例？')) return;
            setNodes(initialNodes());
            setEdges(initialEdges());
            setWfName('Webhook → 分流處理流程');
            setSelectedNode(null); setSelectedEdge(null);
        };

        const loadTemplate = (key) => {
            const tpl = DEMO_TEMPLATES[key];
            if (!tpl) return;
            // re-id to avoid collisions
            const stamp = Date.now().toString(36).slice(-4);
            const reId = (id) => `${id}-${stamp}`;
            const newNodes = tpl.nodes.map(n => ({ ...n, id: reId(n.id) }));
            const idMap = Object.fromEntries(tpl.nodes.map(n => [n.id, reId(n.id)]));
            const newEdges = tpl.edges.map(e => ({ ...e, id: `e-${stamp}-${Math.random().toString(36).slice(2,6)}`, source: idMap[e.source], target: idMap[e.target] }));
            setNodes(newNodes);
            setEdges(newEdges);
            setWfName(key + ' (範本)');
            setLibraryOpen(false);
            setSelectedNode(null); setSelectedEdge(null);
        };

        const validation = useMemo(() => validate(nodes, edges), [nodes, edges]);

        // Re-fit on mount / when underlying container changes.
        // Containers here are overlaid side-panels that take screen real-estate;
        // we approximate the free area and set React Flow viewport accordingly.
        const rfInstance = useReactFlow();
        useEffect(() => {
            const refit = () => {
                try {
                    rfInstance.fitView({ padding: 0.22, includeHiddenNodes: false, duration: 400 });
                } catch (e) { /* not yet mounted */ }
            };
            const t = setTimeout(refit, 220);
            window.addEventListener('resize', refit);
            return () => { clearTimeout(t); window.removeEventListener('resize', refit); };
        }, [rfInstance]);

        return (
            <div style={{ width: '100%', height: '100%', position: 'relative', display: 'flex', flexDirection: 'column' }}>
                <Topbar
                    name={wfName} setName={setWfName}
                    onRun={run}
                    onValidate={() => appendLog({ ts: Date.now(), level: validation.ok ? 'ok' : 'warn', msg: validation.ok ? '✓ 工作流可用' : '⚠ ' + validation.errors.join(' / ') })}
                    onExport={exportJSON}
                    onImport={importJSON}
                    onReset={reset}
                    onSave={save}
                    onOpenLibrary={() => setLibraryOpen(true)}
                    isRunning={isRunning}
                    validation={validation}
                />

                {/* Main row: left palette | canvas | right inspector (each in flex column, no overlap) */}
                <div style={{ flex: 1, position: 'relative', display: 'flex', marginTop: 84, paddingBottom: 14, paddingLeft: 14, paddingRight: 14, gap: 14, minHeight: 0 }}>
                    {/* Left palette */}
                    <div className="side-panel glass" style={{
                        width: 200, flexShrink: 0, borderRadius: 14, zIndex: 6,
                        display: 'flex', flexDirection: 'column', position: 'relative',
                    }}>
                    <div style={{ padding: '12px 14px 6px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <div style={{ fontSize: 13, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6 }}>
                            <Icon name="shapes" size={14} color="#9aa3b2" /> 節點類型
                        </div>
                        <span style={{ fontSize: 10.5, color: 'var(--text-faint)' }}>{Object.keys(NODE_TYPES).length} 類</span>
                    </div>
                    <Palette onDragStart={onDragStart} />
                    <div style={{ marginTop: 'auto', padding: 12, borderTop: '1px solid rgba(255,255,255,0.06)', fontSize: 10.5, color: 'var(--text-faint)' }}>
                        <div style={{ marginBottom: 6, fontWeight: 600, color: 'var(--text-dim)' }}>快速鍵</div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                            <div><span className="kbd">Del</span> 刪除選取</div>
                            <div><span className="kbd">拖曳</span> 從元件庫新增</div>
                            <div><span className="kbd">滾輪</span> 縮放</div>
                        </div>
                    </div>
                </div>

                {/* Canvas (flex: 1 so it fills remaining width — panels don't overlap RF) */}
                <div ref={reactFlowWrapper} style={{ flex: 1, minWidth: 0, position: 'relative', borderRadius: 14, overflow: 'hidden', background: 'rgba(7, 10, 18, 0.55)', border: '1px solid rgba(255,255,255,0.06)' }} onDrop={onDrop} onDragOver={onDragOver}>
                    <ReactFlow
                        nodes={nodes}
                        edges={edges}
                        onNodesChange={onNodesChange}
                        onEdgesChange={onEdgesChange}
                        onConnect={onConnect}
                        onSelectionChange={onSelectionChange}
                        nodeTypes={nodeTypes}
                        fitView
                        fitViewOptions={{ padding: 0.22, duration: 500 }}
                        minZoom={0.15}
                        maxZoom={2}
                        defaultEdgeOptions={{ animated: false, style: { stroke: '#9aa3b2' }, markerEnd: { type: MarkerType.ArrowClosed, color: '#9aa3b2' } }}
                        proOptions={{ hideAttribution: true }}
                    >
                        <Background gap={24} size={1.5} color="rgba(255,255,255,0.08)" />
                        <Controls position="bottom-right" />
                        <MiniMap
                            pannable zoomable
                            nodeColor={(n) => (NODE_TYPES[n.type] || NODE_TYPES.action).color}
                            maskColor="rgba(6,7,13,0.65)"
                            position="bottom-left"
                        />
                    </ReactFlow>

                    {nodes.length === 0 && (
                        <div className="empty-state">
                            <Icon name="mouse-pointer-square" size={40} color="#5b6470" />
                            <div style={{ marginTop: 12 }}>從左側元件庫拖曳節點到畫布</div>
                        </div>
                    )}
                </div>

                {/* Right inspector */}
                <div className="side-panel glass" style={{
                    width: 280, flexShrink: 0, borderRadius: 14, zIndex: 6,
                    overflow: 'hidden', position: 'relative',
                }}>
                    <div style={{ padding: '12px 14px', borderBottom: '1px solid rgba(255,255,255,0.06)', display: 'flex', alignItems: 'center', gap: 8 }}>
                        <Icon name="settings-2" size={14} color="#9aa3b2" />
                        <div style={{ fontSize: 13, fontWeight: 600 }}>屬性面板</div>
                        {(selectedNode || selectedEdge) && (
                            <button className="btn" style={{ marginLeft: 'auto', padding: '4px 8px' }} onClick={() => { setSelectedNode(null); setSelectedEdge(null); }}>
                                <Icon name="x" size={12} />
                            </button>
                        )}
                    </div>
                    <Inspector
                        node={selectedNode}
                        edge={selectedEdge}
                        onChange={handleChange}
                        onDelete={handleDelete}
                    />
                </div>

                {/* Logs */}
                <LogsPanel logs={logs} onClear={() => setLogs([])} />

                {/* Status badge bottom-right */}
                <div style={{
                    position: 'absolute', bottom: 14, right: 14, zIndex: 9,
                    padding: '6px 12px', borderRadius: 999, fontSize: 11,
                    background: 'rgba(11,15,26,0.85)', border: '1px solid rgba(255,255,255,0.08)',
                    color: 'var(--text-dim)', display: 'flex', alignItems: 'center', gap: 8,
                }}>
                    <span className="status-dot" style={{ background: isRunning ? '#f59e0b' : '#34d399' }} />
                    {isRunning ? '執行中' : '待命中'} · {nodes.length} 節點 · {edges.length} 連線
                </div>

                {/* Library modal */}
                {libraryOpen && (
                    <div className="modal-backdrop" onClick={() => setLibraryOpen(false)}>
                        <div className="modal-card" onClick={e => e.stopPropagation()}>
                            <div style={{ padding: '16px 18px', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
                                <div style={{ fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 8 }}>
                                    <Icon name="folder-open" size={16} /> 範本庫
                                </div>
                                <div style={{ fontSize: 11, color: 'var(--text-faint)', marginTop: 4 }}>
                                    載入後會替換目前畫布（不會合併）
                                </div>
                            </div>
                            <div className="scrollbar" style={{ padding: 18, overflowY: 'auto' }}>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                                    {Object.entries(DEMO_TEMPLATES).map(([k, tpl]) => (
                                        <div key={k} onClick={() => loadTemplate(k)} style={{
                                            padding: 14, borderRadius: 10, cursor: 'pointer',
                                            background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.07)',
                                            transition: 'all 0.2s',
                                        }}>
                                            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 6 }}>{k}</div>
                                            <div style={{ fontSize: 11.5, color: 'var(--text-dim)' }}>
                                                {tpl.nodes.length} 節點 · {tpl.edges.length} 連線
                                            </div>
                                            <div style={{ marginTop: 10, fontSize: 12, color: 'var(--text-faint)' }}>
                                                {Object.entries(tpl.nodes.reduce((acc, n) => { acc[n.type] = (acc[n.type]||0)+1; return acc; }, {}))
                                                    .map(([t, c]) => `${NODE_TYPES[t]?.label}×${c}`).join(', ')}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div style={{ padding: 12, borderTop: '1px solid rgba(255,255,255,0.08)', display: 'flex', justifyContent: 'flex-end' }}>
                                <button className="btn" onClick={() => setLibraryOpen(false)}>關閉</button>
                            </div>
                        </div>
                    </div>
                )}
                </div>
            </div>
        );
    }

    const nodeTypes = { trigger: WorkflowNode, action: WorkflowNode, condition: WorkflowNode, delay: WorkflowNode, output: WorkflowNode };

    function App() {
        return (
            <ReactFlowProvider>
                <AppInner />
            </ReactFlowProvider>
        );
    }

    // ------------------------------------------------------------
    // MOUNT
    // ------------------------------------------------------------
    function mount() {
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            // Re-run lucide for any non-React icons we may have added
            setTimeout(() => { try { window.lucide.createIcons(); } catch (e) { /* ignore */ } }, 100);
        } catch (e) {
            document.getElementById('boot-error').style.display = 'flex';
            document.getElementById('boot-error').innerHTML = '<div style="max-width:560px"><h1 style="font-size:22px">⚠️ React 掛載失敗</h1><pre style="white-space:pre-wrap;background:#0b0f1a;padding:14px;border-radius:8px;color:#fca5a5">' + (e.stack || e.message || e) + '</pre></div>';
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', mount);
    } else {
        mount();
    }
    </script>
</body>
</html>
