<script>
// ============================================================================
// /lib/rbac.js — Role-Based Access Control core
// ============================================================================
//
// DESIGN (real-world Next.js RBAC pattern)
// -----------------------------------------
// 1. PERMISSIONS are flat strings ("USER_READ", "ORG_ADMIN").
// 2. ROLES are groups of permissions (admin / manager / org_admin / member / viewer).
// 3. A user has ONE global role + an array of `memberships`:
//      { orgId, role: "org_admin" | "member" | "viewer" }
//    The effective permission at runtime is:
//      GLOBAL role perms ∪ any matching org-scoped role perms.
// 4. Ownership is a SEPARATE concept: even with the permission, if the resource
//    lives in an org the user doesn't belong to, access is DENIED.
//    This is what the dynamic route layer checks via `requireOrgAccess`.

const PERMISSIONS = {
  // user / org admin
  USER_READ:         'USER_READ',
  USER_WRITE:        'USER_WRITE',
  USER_DELETE:       'USER_DELETE',
  USER_INVITE:       'USER_INVITE',
  // org admin
  ORG_READ:          'ORG_READ',
  ORG_WRITE:         'ORG_WRITE',
  ORG_DELETE:        'ORG_DELETE',
  ORG_ADMIN:         'ORG_ADMIN',
  // project
  PROJECT_READ:      'PROJECT_READ',
  PROJECT_WRITE:     'PROJECT_WRITE',
  PROJECT_DELETE:    'PROJECT_DELETE',
  // settings
  SETTINGS_READ:     'SETTINGS_READ',
  SETTINGS_WRITE:    'SETTINGS_WRITE',
  // audit
  AUDIT_READ:        'AUDIT_READ',
};

const ROLE_MATRIX = {
  admin: new Set([
    PERMISSIONS.USER_READ, PERMISSIONS.USER_WRITE, PERMISSIONS.USER_DELETE, PERMISSIONS.USER_INVITE,
    PERMISSIONS.ORG_READ,  PERMISSIONS.ORG_WRITE,  PERMISSIONS.ORG_DELETE,  PERMISSIONS.ORG_ADMIN,
    PERMISSIONS.PROJECT_READ, PERMISSIONS.PROJECT_WRITE, PERMISSIONS.PROJECT_DELETE,
    PERMISSIONS.SETTINGS_READ, PERMISSIONS.SETTINGS_WRITE,
    PERMISSIONS.AUDIT_READ,
  ]),
  manager: new Set([
    PERMISSIONS.USER_READ, PERMISSIONS.USER_INVITE,
    PERMISSIONS.ORG_READ,
    PERMISSIONS.PROJECT_READ, PERMISSIONS.PROJECT_WRITE, PERMISSIONS.PROJECT_DELETE,
    PERMISSIONS.SETTINGS_READ, PERMISSIONS.SETTINGS_WRITE,
    PERMISSIONS.AUDIT_READ,
  ]),
  org_admin: new Set([
    PERMISSIONS.USER_READ, PERMISSIONS.USER_INVITE,
    PERMISSIONS.ORG_READ, PERMISSIONS.ORG_WRITE, PERMISSIONS.ORG_ADMIN,
    PERMISSIONS.PROJECT_READ, PERMISSIONS.PROJECT_WRITE, PERMISSIONS.PROJECT_DELETE,
    PERMISSIONS.SETTINGS_READ, PERMISSIONS.SETTINGS_WRITE,
  ]),
  member: new Set([
    PERMISSIONS.USER_READ,
    PERMISSIONS.ORG_READ,
    PERMISSIONS.PROJECT_READ, PERMISSIONS.PROJECT_WRITE,
    PERMISSIONS.SETTINGS_READ,
  ]),
  viewer: new Set([
    PERMISSIONS.USER_READ,
    PERMISSIONS.ORG_READ,
    PERMISSIONS.PROJECT_READ,
    PERMISSIONS.SETTINGS_READ,
  ]),
};

const ROLE_LABELS = {
  admin:    '超級管理員',
  manager:  '全域管理員',
  org_admin:'組織管理員',
  member:   '一般成員',
  viewer:   '唯讀訪客',
};

const ROLE_COLORS = {
  admin:     'bg-purple-100 text-purple-800 border-purple-300',
  manager:   'bg-blue-100 text-blue-800 border-blue-300',
  org_admin: 'bg-emerald-100 text-emerald-800 border-emerald-300',
  member:    'bg-amber-100 text-amber-800 border-amber-300',
  viewer:    'bg-slate-100 text-slate-700 border-slate-300',
};

// --- Demo users -------------------------------------------------------------
// `role` = global role. `memberships` = per-org role (the dynamic route layer
// checks membership BEFORE falling through to global permissions).
const USERS = [
  {
    id: 'u1', username: 'alice',  name: 'Alice Chen', email: 'alice@acme.dev',
    role: 'admin',
    memberships: [
      { orgId: 'org-acme',    role: 'org_admin' },
      { orgId: 'org-globex',  role: 'org_admin' },
    ],
  },
  {
    id: 'u2', username: 'bob',    name: 'Bob Lin',    email: 'bob@acme.dev',
    role: 'manager',
    memberships: [
      { orgId: 'org-acme',    role: 'member' },
      { orgId: 'org-globex',  role: 'org_admin' },
    ],
  },
  {
    id: 'u3', username: 'carol',  name: 'Carol Wu',   email: 'carol@acme.dev',
    role: 'org_admin',
    memberships: [
      { orgId: 'org-acme',    role: 'org_admin' },
    ],
  },
  {
    id: 'u4', username: 'dave',   name: 'Dave Yang',  email: 'dave@acme.dev',
    role: 'member',
    memberships: [
      { orgId: 'org-acme',    role: 'member' },
    ],
  },
  {
    id: 'u5', username: 'erin',   name: 'Erin Hsu',   email: 'erin@globex.dev',
    role: 'viewer',
    memberships: [
      { orgId: 'org-globex',  role: 'viewer' },
    ],
  },
];

// --- Demo orgs & resources ---------------------------------------------------
const ORGS = {
  'org-acme':    { id: 'org-acme',    name: 'Acme Corp',     plan: 'enterprise', ownerId: 'u3' },
  'org-globex':  { id: 'org-globex',  name: 'Globex Inc.',   plan: 'team',       ownerId: 'u2' },
};

// Projects (slug = projectId). For member-level permission, `assignees` matters
// (e.g. only assignee OR org_admin can edit a project).
const PROJECTS = {
  'proj-apollo': { id: 'proj-apollo', orgId: 'org-acme',   name: 'Apollo Migration',     assignees: ['u4','u3'] },
  'proj-zephyr': { id: 'proj-zephyr', orgId: 'org-acme',   name: 'Zephyr Analytics',     assignees: ['u4'] },
  'proj-helios': { id: 'proj-helios', orgId: 'org-globex', name: 'Helios Growth Engine', assignees: ['u2'] },
};

// ============================================================================
// rbac.can(user, perm, ctx?) — pure permission check
// ============================================================================
function hasGlobalPermission(user, perm) {
  const perms = ROLE_MATRIX[user.role];
  return perms ? perms.has(perm) : false;
}

function hasOrgPermission(user, perm, orgId) {
  if (!orgId) return false;
  const m = user.memberships.find(x => x.orgId === orgId);
  if (!m) return false;
  const perms = ROLE_MATRIX[m.role];
  return perms ? perms.has(perm) : false;
}

const rbac = {
  can(user, perm, ctx) {
    if (!user) return false;
    // 1. Global role shortcut (e.g. admin / manager bypass org scope)
    if (hasGlobalPermission(user, perm)) return true;
    // 2. Org-scoped role (the dynamic-route case)
    if (ctx && ctx.orgId && hasOrgPermission(user, perm, ctx.orgId)) return true;
    return false;
  },

  // require() — server-action / route-handler style throw-on-deny
  require(user, perm, ctx) {
    if (!this.can(user, perm, ctx)) {
      const err = new Error('Forbidden');
      err.code = 'FORBIDDEN';
      err.required = perm;
      err.ctx = ctx;
      throw err;
    }
  },

  // requireOrgMembership — used by dynamic [orgId]/page.jsx.
  // Even if the user has the perm globally, they must be a member of the org
  // to access any /orgs/[orgId]/* path.
  requireOrgMembership(user, orgId) {
    const isGlobal = user.role === 'admin' || user.role === 'manager';
    const isMember = user.memberships.some(m => m.orgId === orgId);
    if (!isGlobal && !isMember) {
      const err = new Error('Not a member of this organization');
      err.code = 'NOT_MEMBER';
      err.required = 'ORG_READ';
      err.ctx = { orgId };
      throw err;
    }
  },

  // guardRoute(path) — used by /middleware.js. Returns the permission(s) that
  // the given path requires, OR null if the path is public.
  // Dynamic segments [orgId] / [projectId] are matched literally here (the
  // middleware doesn't know the concrete value yet — it only enforces the
  // shape, the page does the membership check).
  guardRoute(path) {
    // Strip query / hash
    const clean = path.split('?')[0].split('#')[0];
    // Public routes
    if (clean === '/login' || clean === '/' && false) return null;
    if (clean === '/login') return null;

    // Order matters: most specific first.
    // dynamic [orgId]/settings/[section]
    if (/^\/orgs\/[^/]+\/settings\/[^/]+$/.test(clean)) return { perm: 'SETTINGS_READ', dynamic: ['orgId','section'] };
    // dynamic [orgId]/projects/[projectId]
    if (/^\/orgs\/[^/]+\/projects\/[^/]+$/.test(clean)) return { perm: 'PROJECT_READ', dynamic: ['orgId','projectId'] };
    // dynamic [orgId]/users/[userId]
    if (/^\/orgs\/[^/]+\/users\/[^/]+$/.test(clean)) return { perm: 'USER_READ', dynamic: ['orgId','userId'] };
    // dynamic [orgId]
    if (/^\/orgs\/[^/]+$/.test(clean)) return { perm: 'ORG_READ', dynamic: ['orgId'] };

    // Static pages
    if (clean === '/users')       return { perm: 'USER_READ' };
    if (clean === '/roles')       return { perm: 'AUDIT_READ' };
    if (clean === '/audit')       return { perm: 'AUDIT_READ' };
    if (clean === '/dashboard' || clean === '/') return null;

    // API routes (would also be guarded here in real middleware)
    return null;
  },
};

// ============================================================================
// /lib/dynamicRoutes.js — Next.js dynamic route templates
// ============================================================================
//
// In Next.js 14 App Router, dynamic segments use the [bracket] convention:
//   app/orgs/[orgId]/projects/[projectId]/page.jsx
//
// At build time, generateStaticParams() returns the concrete combinations
// to pre-render. In our demo, we expose this so the UI can preview what
// the route tree WOULD look like after build.

const ROUTE_TEMPLATES = [
  // Static
  { pattern: '/login',                 file: 'app/(auth)/login/page.jsx',                            perm: null },
  { pattern: '/dashboard',             file: 'app/(dashboard)/page.jsx',                             perm: null },
  { pattern: '/users',                 file: 'app/(dashboard)/users/page.jsx',                       perm: 'USER_READ' },
  { pattern: '/roles',                 file: 'app/(dashboard)/roles/page.jsx',                       perm: 'AUDIT_READ' },
  { pattern: '/audit',                 file: 'app/(dashboard)/audit/page.jsx',                       perm: 'AUDIT_READ' },

  // Dynamic: one segment
  { pattern: '/orgs/[orgId]',          file: 'app/(dashboard)/orgs/[orgId]/page.jsx',                perm: 'ORG_READ', dynamic: ['orgId'] },

  // Dynamic: two segments
  { pattern: '/orgs/[orgId]/projects/[projectId]',  file: 'app/(dashboard)/orgs/[orgId]/projects/[projectId]/page.jsx',  perm: 'PROJECT_READ',  dynamic: ['orgId','projectId'] },
  { pattern: '/orgs/[orgId]/users/[userId]',        file: 'app/(dashboard)/orgs/[orgId]/users/[userId]/page.jsx',        perm: 'USER_READ',     dynamic: ['orgId','userId'] },
  { pattern: '/orgs/[orgId]/settings/[section]',    file: 'app/(dashboard)/orgs/[orgId]/settings/[section]/page.jsx',    perm: 'SETTINGS_READ', dynamic: ['orgId','section'] },

  // Catch-all (Next.js [...slug] convention)
  { pattern: '/orgs/[orgId]/files/[...path]',       file: 'app/(dashboard)/orgs/[orgId]/files/[...path]/page.jsx',       perm: 'PROJECT_READ',  dynamic: ['orgId','...path'] },
];

// generateStaticParams() — Next.js builds these concrete paths at build time
function generateStaticParams() {
  const out = [];
  for (const tmpl of ROUTE_TEMPLATES) {
    if (!tmpl.dynamic) { out.push({ template: tmpl.pattern, params: {} }); continue; }

    if (tmpl.pattern === '/orgs/[orgId]') {
      for (const orgId of Object.keys(ORGS)) {
        out.push({ template: tmpl.pattern, params: { orgId } });
      }
    } else if (tmpl.pattern === '/orgs/[orgId]/projects/[projectId]') {
      for (const proj of Object.values(PROJECTS)) {
        out.push({ template: tmpl.pattern, params: { orgId: proj.orgId, projectId: proj.id } });
      }
    } else if (tmpl.pattern === '/orgs/[orgId]/users/[userId]') {
      for (const u of USERS) {
        for (const m of u.memberships) {
          out.push({ template: tmpl.pattern, params: { orgId: m.orgId, userId: u.id } });
        }
      }
    } else if (tmpl.pattern === '/orgs/[orgId]/settings/[section]') {
      for (const orgId of Object.keys(ORGS)) {
        for (const section of ['general', 'billing', 'security']) {
          out.push({ template: tmpl.pattern, params: { orgId, section } });
        }
      }
    } else if (tmpl.pattern === '/orgs/[orgId]/files/[...path]') {
      out.push({ template: tmpl.pattern, params: { orgId: 'org-acme', path: ['reports','2026-q3.pdf'] } });
    }
  }
  return out;
}

// Resolve a concrete path to its template + params
function resolveDynamicParams(cleanPath) {
  for (const tmpl of ROUTE_TEMPLATES) {
    if (!tmpl.dynamic) continue;
    const regexStr = '^' + tmpl.pattern.replace(/\[\.\.\.(\w+)\]/g, '(?:.+(?:/(?:.+))*)?')
                                     .replace(/\[(\w+)\]/g, '([^/]+)') + '$';
    const m = cleanPath.match(new RegExp(regexStr));
    if (m) {
      const params = {};
      tmpl.dynamic.forEach((key, i) => {
        const val = m[i + 1];
        params[key.startsWith('...') ? key.slice(3) : key] = key.startsWith('...') && val ? val.split('/') : val;
      });
      return { template: tmpl.pattern, file: tmpl.file, perm: tmpl.perm, params };
    }
  }
  return null;
}

// ============================================================================
// /middleware.js — Next.js global request middleware
// ============================================================================
//
// In a real Next.js 14 app, /middleware.js exports a `middleware(request)` and
// `config.matcher` that runs BEFORE the page renders. Here we simulate it.
const middleware = {
  // Returns { allow: true } | { allow: false, reason, perm, path }
  check(path, user) {
    if (!user) {
      const isPublic = (path === '/login' || path === '/');
      if (isPublic) return { allow: true };
      return { allow: false, reason: 'NOT_AUTHENTICATED', redirect: '/login', path };
    }
    const guarded = rbac.guardRoute(path);
    if (!guarded) return { allow: true };
    if (!guarded.dynamic) {
      if (rbac.can(user, guarded.perm)) return { allow: true, perm: guarded.perm };
      return { allow: false, reason: 'MISSING_PERM', perm: guarded.perm, path };
    }
    // Dynamic segment — middleware can't know membership yet (path params
    // not resolved until the page). Middleware enforces the SHAPE only:
    // e.g. /orgs/foo/bar is denied if /orgs/[orgId]/projects/[projectId] is
    // the matching template AND user has no PROJECT_READ at all.
    if (rbac.can(user, guarded.perm)) return { allow: true, perm: guarded.perm, dynamic: guarded.dynamic };
    return { allow: false, reason: 'MISSING_PERM', perm: guarded.perm, path, dynamic: guarded.dynamic };
  },
};

// ============================================================================
// Audit log — append-only, root_cause annotated
// ============================================================================
const auditLog = [];
function audit(kind, payload) {
  auditLog.unshift({
    id: 'a' + Math.random().toString(36).slice(2, 10),
    ts: new Date().toISOString(),
    kind,
    ...payload,
  });
  if (auditLog.length > 80) auditLog.length = 80;
}

// ============================================================================
// /components/Can.jsx — Component-level guard
// ============================================================================
//
// Pattern:
//   <Can perm="USER_DELETE" ctx={{ orgId }}>
//     <DeleteButton />
//   </Can>
// If the user lacks the perm, returns null + optionally shows a lock indicator.
function Can({ user, perm, ctx, fallback, children }) {
  const allowed = rbac.can(user, perm, ctx);
  if (allowed) return children;
  if (fallback !== undefined) return fallback;
  return null;
}

// ForbiddenPage — shown when middleware rejects the route
function ForbiddenPage({ user, reason, perm, path }) {
  const whoHasIt = [];
  for (const [role, perms] of Object.entries(ROLE_MATRIX)) {
    if (perms.has(perm)) whoHasIt.push(ROLE_LABELS[role]);
  }
  return h('div', { className: 'fade-in max-w-3xl mx-auto mt-12' },
    h('div', { className: 'glass rounded-2xl p-8 shadow-xl border-2 border-deny-500' },
      h('div', { className: 'flex items-center gap-3 mb-4' },
        h('div', { className: 'text-4xl' }, '🚫'),
        h('div', null,
          h('h1', { className: 'text-2xl font-bold text-deny-600' }, '403 · 訪問被拒絕'),
          h('p', { className: 'text-sm text-slate-500 mt-1' }, '你的角色沒有足夠權限存取此路徑'),
        ),
      ),
      h('div', { className: 'grid grid-cols-2 gap-4 mt-6' },
        h('div', { className: 'bg-slate-50 rounded-lg p-4 border border-slate-200' },
          h('div', { className: 'text-xs uppercase tracking-wide text-slate-500 mb-1' }, '嘗試路徑'),
          h('code', { className: 'mono-cell text-deny-600 font-semibold' }, path),
        ),

// ============================================================================
// Page: /roles — interactive role matrix
// ============================================================================
function RolesPage({ user }) {
  if (!rbac.can(user, 'AUDIT_READ')) {
    return h(ForbiddenPage, { user, reason: 'MISSING_PERM', perm: 'AUDIT_READ', path: '/roles' });
  }
  const allPerms = Object.values(PERMISSIONS);
  const [overrides, setOverrides] = React.useState({}); // { perm: { role: bool } } — toggles for demo

  function toggle(role, perm) {
    const key = perm;
    setOverrides(prev => ({
      ...prev,
      [key]: { ...(prev[key] || {}), [role]: !(prev[key]?.[role] ?? ROLE_MATRIX[role].has(perm)) },
    }));
  }
  function effective(role, perm) {
    const ov = overrides[perm]?.[role];
    return ov !== undefined ? ov : ROLE_MATRIX[role].has(perm);
  }

  return h('div', { className: 'fade-in space-y-6' },
    h('div', { className: 'glass rounded-2xl p-6 shadow-lg' },
      h('h1', { className: 'text-2xl font-bold mb-2' }, '角色權限矩陣'),
      h('p', { className: 'text-sm text-slate-600 mb-4' }, '點擊儲存格可即時切換權限。所有變更僅存在於前端狀態(重新整理後重置),用於演示 RBAC 對 UI 的即時影響。'),
      h('div', { className: 'overflow-x-auto' },
        h('table', { className: 'w-full text-sm border-collapse' },
          h('thead', null,
            h('tr', { className: 'border-b-2 border-slate-200' },
              h('th', { className: 'text-left py-2 px-3' }, '權限 \\ 角色'),
              ...Object.keys(ROLE_MATRIX).map(role =>
                h('th', { key: role, className: 'text-left py-2 px-3' },
                  h('span', { className: `badge ${ROLE_COLORS[role]}` }, ROLE_LABELS[role]),
                ),
              ),
            ),
          ),
          h('tbody', null,
            allPerms.map(perm =>
              h('tr', { key: perm, className: 'border-b border-slate-100 hover:bg-slate-50' },
                h('td', { className: 'py-2 px-3 mono-cell font-semibold text-slate-700' }, perm),
                ...Object.keys(ROLE_MATRIX).map(role => {
                  const ok = effective(role, perm);
                  return h('td', {
                    key: role,
                    onClick: () => { toggle(role, perm); audit('perm_toggle', { actor: user.username, perm, role, newValue: !ok }); },
                    className: `py-2 px-3 cursor-pointer text-center transition select-none ${ok ? 'bg-emerald-50 hover:bg-emerald-100' : 'bg-red-50 hover:bg-red-100'}`,
                  },
                    h('span', { className: ok ? 'badge badge-ok' : 'badge badge-deny' }, ok ? '✓' : '✗'),
                  );
                }),
              ),
            ),
          ),
        ),
      ),
    ),
    h('div', { className: 'glass rounded-2xl p-6 shadow-lg' },
      h('h2', { className: 'font-bold mb-3' }, '動態路由 × 角色 可達性矩陣'),
      h('p', { className: 'text-sm text-slate-600 mb-3' }, '每個角色的有效權限下,能存取哪些動態路由模板。'),
      h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
        Object.keys(ROLE_MATRIX).map(role => {
          const accessible = ROUTE_TEMPLATES.filter(t => t.dynamic && t.perm && ROLE_MATRIX[role].has(t.perm));
          const denied = ROUTE_TEMPLATES.filter(t => t.dynamic && t.perm && !ROLE_MATRIX[role].has(t.perm));
          return h('div', { key: role, className: 'p-4 rounded-xl border-2 border-slate-200' },
            h('div', { className: 'flex items-center gap-2 mb-3' },
              h('span', { className: `badge ${ROLE_COLORS[role]}` }, ROLE_LABELS[role]),
              h('span', { className: 'text-xs text-slate-500' }, `${accessible.length} 可存取 · ${denied.length} 拒絕`),
            ),
            h('div', { className: 'space-y-1' },
              [...accessible, ...denied].map(t =>
                h('div', { key: t.pattern, className: 'flex items-center gap-2 text-xs mono-cell' },
                  h('span', { className: ROLE_MATRIX[role].has(t.perm) ? 'text-emerald-600' : 'text-red-400' },
                    ROLE_MATRIX[role].has(t.perm) ? '✓' : '✗'),
                  h('span', { className: ROLE_MATRIX[role].has(t.perm) ? '' : 'line-through text-slate-400' }, t.pattern),
                ),
              ),
            ),
          );
        }),
      ),
    ),
  );
}

// ============================================================================
// Router (Next.js useRouter + useParams simulation)
// ============================================================================
function navigate(path, opts = {}) {
  window.location.hash = '#' + path;
  if (opts.audit !== false) {
    // Defer audit to after path resolves (let middleware run)
    setTimeout(() => {}, 0);
  }
}
window.navigate = navigate; // expose for sidebar

function useRouter() {
  const [path, setPath] = React.useState(window.location.hash.replace(/^#/, '') || '/login');
  React.useEffect(() => {
    const onHash = () => setPath(window.location.hash.replace(/^#/, '') || '/login');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return path;
}

function useParams(path) {
  // Match against ROUTE_TEMPLATES, extract concrete params from segments.
  // Order matters: check MOST SPECIFIC first so catch-all doesn't eat
  // concrete matches like /orgs/foo/projects/bar.
  const ordered = [...ROUTE_TEMPLATES].sort((a, b) =>
    (b.dynamic?.length || 0) - (a.dynamic?.length || 0)
  );
  for (const tmpl of ordered) {
    if (!tmpl.dynamic) continue;
    const regexStr = '^' + tmpl.pattern.replace(/\[\.\.\.(\w+)\]/g, '(?:.+(?:/.+)*)?')
                                     .replace(/\[(\w+)\]/g, '([^/]+)') + '$';
    const m = path.match(new RegExp(regexStr));
    if (m) {
      const params = {};
      let captureIdx = 0;
      tmpl.dynamic.forEach((key) => {
        if (key.startsWith('...')) {
          // Catch-all: capture the remainder (may contain slashes)
          // But for hash-based routing we usually have no slashes here
          params[key.slice(3)] = decodeURIComponent(path.split('/').slice(
            tmpl.pattern.split('/').filter(s => !s.startsWith('[')).length
          ).join('/'));
        } else {
          params[key] = decodeURIComponent(m[++captureIdx] || '');
        }
      });
      return { template: tmpl, params };
    }
  }
  return null;
}

// ============================================================================
// App
// ============================================================================
function App() {
  const [user, setUser] = React.useState(window.__user || null);
  const path = useRouter();
  const resolved = useParams(path);
  const resolvedPath = path.split('?')[0].split('#')[0];

  // Persist user across page reloads
  React.useEffect(() => {
    if (user) {
      window.__user = user;
      sessionStorage.setItem('rbac_user', JSON.stringify(user));
    } else {
      window.__user = null;
      sessionStorage.removeItem('rbac_user');
    }
  }, [user]);
  React.useEffect(() => {
    const saved = sessionStorage.getItem('rbac_user');
    if (saved && !user) setUser(JSON.parse(saved));
  }, []);

  window.__logout = () => { setUser(null); navigate('/login', { audit: false }); };

  // ---- Middleware gate ----------------------------------------------------
  if (!user && resolvedPath !== '/login') {
    setTimeout(() => navigate('/login', { audit: false }), 0);
    return h('div', { className: 'text-center mt-20 text-slate-500' }, '重新導向 /login ...');
  }
  if (user && resolvedPath === '/login') {
    setTimeout(() => navigate('/dashboard', { audit: false }), 0);
    return null;
  }
  const mwCheck = middleware.check(resolvedPath, user);
  if (user && !mwCheck.allow) {
    audit('denied', { user: user.username, path: resolvedPath, reason: mwCheck.reason, required: mwCheck.perm });
    return h(Shell, { user, currentPath: resolvedPath },
      h(ForbiddenPage, { user, reason: mwCheck.reason, perm: mwCheck.perm, path: resolvedPath }),
    );
  }

  // ---- Page router --------------------------------------------------------
  let page;
  if (!user) {
    page = h(LoginPage, { onLogin: (u) => { setUser(u); audit('system', { event: 'login', user: u.username }); navigate('/dashboard'); } });
  } else if (resolvedPath === '/dashboard' || resolvedPath === '/') {
    page = h(DashboardPage, { user });
  } else if (resolvedPath === '/users') {
    page = h(UsersPage, { user });
  } else if (resolvedPath === '/roles') {
    page = h(RolesPage, { user });
  } else if (resolvedPath === '/audit') {
    page = h(AuditPage, { user });
  } else if (resolved) {
    // Dynamic routes
    if (resolved.template.pattern === '/orgs/[orgId]') {
      page = h(OrgPage, { user, params: resolved.params });
    } else if (resolved.template.pattern === '/orgs/[orgId]/projects/[projectId]') {
      page = h(ProjectPage, { user, params: resolved.params });
    } else if (resolved.template.pattern === '/orgs/[orgId]/users/[userId]') {
      page = h(OrgUserPage, { user, params: resolved.params });
    } else if (resolved.template.pattern === '/orgs/[orgId]/settings/[section]') {
      page = h(SettingsPage, { user, params: resolved.params });
    } else {
      page = h(NotFoundPage, { path: resolvedPath });
    }
  } else if (resolvedPath === '/login') {
    page = h(LoginPage, { onLogin: (u) => { setUser(u); audit('system', { event: 'login', user: u.username }); navigate('/dashboard'); } });
  } else {
    page = h(NotFoundPage, { path: resolvedPath });
  }

  return h(Shell, { user, currentPath: resolvedPath }, page);
}

function Shell({ user, currentPath, children }) {
  if (!user) {
    return h('div', { className: 'min-h-screen p-6' }, children);
  }
  return h('div', { className: 'flex min-h-screen' },
    h(Sidebar, { user, currentPath }),
    h('main', { className: 'flex-1 p-6 overflow-auto' }, children),
  );
}

function NotFoundPage({ path }) {
  return h('div', { className: 'fade-in glass rounded-2xl p-12 text-center max-w-2xl mx-auto mt-12 shadow-xl' },
    h('div', { className: 'text-6xl mb-4' }, '🧭'),
    h('h1', { className: 'text-3xl font-bold mb-2' }, '404 · 路徑不存在'),
    h('p', { className: 'text-sm text-slate-500 mono-cell' }, path),
    h('a', {
      href: '#',
      onClick: (e) => { e.preventDefault(); navigate('/dashboard'); },
      className: 'inline-block mt-4 px-4 py-2 bg-brand-600 text-white rounded-lg',
    }, '← 返回 Dashboard'),
  );
}

// ============================================================================
// React boot

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
</script>
