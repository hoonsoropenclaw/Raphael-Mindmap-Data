<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>行政系統 — Chronicle / 人事案件指揮中心</title>

  <!-- Tailwind via CDN (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter + Noto Sans TC for 繁中 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <!-- React 18 + Framer Motion 11 -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/framer-motion@11.3.19/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script>
    /* === Tailwind 客製化 (摘自 tailwind_config_extend 微技能) === */
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink:    '#071b22',
            lagoon:  '#127b78',
            mint:   '#6ed3bd',
            ice:    '#dff8f2',
            coral:  '#ff8c78',
            mist:   '#0c2730',
          },
          fontFamily: {
            sans:    ['"Noto Sans TC"', 'Inter', 'system-ui', 'sans-serif'],
            displayface: ['Inter', '"Noto Sans TC"', 'sans-serif'],
            mono:    ['ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          boxShadow: {
            glass:  '0 20px 60px rgba(0,24,32,.35)',
            glow:   '0 0 0 1px rgba(110,211,189,.35), 0 8px 32px rgba(110,211,189,.25)',
            coral:  '0 12px 32px rgba(255,140,120,.35)',
          },
          backgroundImage: {
            'aurora': "radial-gradient(60% 80% at 20% 10%, rgba(110,211,189,.35) 0%, transparent 60%), radial-gradient(50% 70% at 90% 30%, rgba(255,140,120,.30) 0%, transparent 60%), radial-gradient(80% 60% at 50% 100%, rgba(18,123,120,.30) 0%, transparent 70%)",
            'mesh':   "linear-gradient(135deg, rgba(110,211,189,.08) 0%, rgba(18,123,120,.04) 50%, rgba(255,140,120,.08) 100%)",
          },
          keyframes: {
            floaty: {
              '0%,100%': { transform: 'translateY(0)' },
              '50%':     { transform: 'translateY(-6px)' },
            },
            shimmer: {
              '0%':   { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            pulseDot: {
              '0%,100%': { opacity: 1, transform: 'scale(1)' },
              '50%':     { opacity: .5, transform: 'scale(1.4)' },
            },
          },
          animation: {
            floaty:  'floaty 6s ease-in-out infinite',
            shimmer: 'shimmer 2.4s linear infinite',
            pulseDot:'pulseDot 2s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <style>
    html, body { font-family: 'Noto Sans TC', 'Inter', system-ui, sans-serif; }
    /* Aurora 背景 + Mesh 細紋底 */
    body {
      background: #071b22;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(60% 80% at 20% 10%, rgba(110,211,189,.30) 0%, transparent 60%),
                  radial-gradient(50% 70% at 90% 30%, rgba(255,140,120,.25) 0%, transparent 60%),
                  radial-gradient(80% 60% at 50% 100%, rgba(18,123,120,.25) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      pointer-events: none; z-index: 0;
    }
    /* Glassmorphism 卡片基底 */
    .glass {
      background: linear-gradient(135deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 100%);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }
    .glass-strong {
      background: linear-gradient(135deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.04) 100%);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(24px) saturate(160%);
    }
    .shine {
      position: relative; overflow: hidden;
    }
    .shine::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.12) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .9s ease;
    }
    .shine:hover::after { transform: translateX(100%); }

    /* 滾動條 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(110,211,189,.4); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* 雜訊紋理 (subtle film grain) */
    .grain { position: relative; }
    .grain::before {
      content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* 進場動畫用的 stagger helper (若 framer-motion 沒載入時 fallback) */
    .fallback-fade { opacity: 0; transform: translateY(8px); animation: fadeIn .6s forwards; }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

    /* 主題：亮色 */
    .light body, html.light body {
      background: #f5f7fa;
      color: #071b22;
    }
    html.light body::before {
      background: radial-gradient(60% 80% at 20% 10%, rgba(110,211,189,.30) 0%, transparent 60%),
                  radial-gradient(50% 70% at 90% 30%, rgba(255,140,120,.20) 0%, transparent 60%);
    }
    html.light .glass {
      background: linear-gradient(135deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.5) 100%);
      border: 1px solid rgba(7,27,34,.06);
    }
    html.light .glass-strong {
      background: linear-gradient(135deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.65) 100%);
      border: 1px solid rgba(7,27,34,.08);
    }
  </style>
</head>
<body class="text-white antialiased">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    // Framer Motion 11 UMD 把 exports 掛在 window.Motion
    const FM = (typeof window !== 'undefined' && window.Motion) || {};
    const {
      motion, AnimatePresence,
      useScroll, useTransform, useMotionValue, useSpring,
      LayoutGroup, Reorder,
    } = FM;

    /* ============================================================
     * 工具 & 常數
     * ============================================================ */
    const cx = (...c) => c.filter(Boolean).join(' ');
    const fmtTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

    const STATUS = {
      pending:    { label: '待審核', color: 'bg-amber-400/20 text-amber-300 ring-amber-300/30',   dot: 'bg-amber-400' },
      processing: { label: '處理中', color: 'bg-lagoon/30 text-mint ring-mint/40',                  dot: 'bg-mint'     },
      done:       { label: '已完成', color: 'bg-emerald-400/20 text-emerald-300 ring-emerald-300/30',dot: 'bg-emerald-400'},
      rejected:   { label: '退件',   color: 'bg-coral/20 text-coral ring-coral/40',                  dot: 'bg-coral'    },
    };

    const SEED_CASES = [
      { id: 'C-2026-0512', title: '陳怡君 — 育嬰留職停薪申請', dept: '教務處',  prio: 'high',   status: 'processing', avatar: '陳' },
      { id: 'C-2026-0513', title: '王大明 — 加班費核銷 (5月)',  dept: '總務處',  prio: 'mid',    status: 'pending',    avatar: '王' },
      { id: 'C-2026-0514', title: '林小芳 — 研習時數登錄',      dept: '人事室',  prio: 'low',    status: 'done',       avatar: '林' },
      { id: 'C-2026-0515', title: '張志豪 — 公文蓋章申請',      dept: '秘書室',  prio: 'mid',    status: 'processing', avatar: '張' },
      { id: 'C-2026-0516', title: '李雅婷 — 出差請示 (台中)',   dept: '會計室',  prio: 'high',   status: 'rejected',   avatar: '李' },
      { id: 'C-2026-0517', title: '黃柏翔 — 設備採購簽核',      dept: '資訊組',  prio: 'mid',    status: 'pending',    avatar: '黃' },
    ];

    const SEED_TODOS = [
      { id: 1, text: '簽核 0513 加班費核銷單',        done: false, tag: 'urgent' },
      { id: 2, text: '回覆 0515 公文系統問題單',      done: false, tag: 'normal' },
      { id: 3, text: '更新 6 月行事曆並通知處室',    done: true,  tag: 'normal' },
      { id: 4, text: '安排 5/30 主管會報議程',        done: false, tag: 'urgent' },
      { id: 5, text: '彙整 113 學年度預算追加表',     done: false, tag: 'normal' },
    ];

    /* ============================================================
     * 子元件：動態數字 (useMotionValue + spring)
     * ============================================================ */
    function Counter({ value, duration = 1.2 }) {
      const mv = useMotionValue(0);
      const sp = useSpring(mv, { duration: duration * 1000, bounce: 0 });
      const [display, setDisplay] = useState(0);
      useEffect(() => {
        mv.set(value);
        const unsub = sp.on('change', v => setDisplay(Math.round(v)));
        return () => unsub();
      }, [value]);
      return <span>{display.toLocaleString()}</span>;
    }

    /* ============================================================
     * 子元件：側邊欄
     * ============================================================ */
    function Sidebar({ active, onSelect }) {
      const items = [
        { key: 'dashboard', icon: '⌂', label: '儀表板' },
        { key: 'cases',     icon: '▤', label: '人事案件' },
        { key: 'calendar',  icon: '▦', label: '行事曆' },
        { key: 'docs',      icon: '⎙', label: '公文' },
        { key: 'reports',   icon: '◐', label: '報表中心' },
        { key: 'settings',  icon: '⚙', label: '系統設定' },
      ];
      return (
        <motion.aside
          initial={{ x: -32, opacity: 0 }}
          animate={{ x: 0, opacity: 1 }}
          transition={{ duration: .6, ease: [0.22, 1, 0.36, 1] }}
          className="hidden lg:flex w-64 shrink-0 flex-col gap-2 p-5"
        >
          {/* Logo */}
          <div className="flex items-center gap-3 px-3 py-4">
            <motion.div
              initial={{ rotate: -90, scale: 0 }}
              animate={{ rotate: 0, scale: 1 }}
              transition={{ type: 'spring', stiffness: 220, damping: 14, delay: .2 }}
              className="w-10 h-10 rounded-2xl bg-gradient-to-br from-mint to-lagoon grid place-items-center shadow-glow"
            >
              <span className="font-displayface font-black text-ink text-xl">C</span>
            </motion.div>
            <div>
              <div className="font-displayface font-bold tracking-wide text-white">Chronicle</div>
              <div className="text-[10px] text-mint/80 uppercase tracking-[0.18em]">Admin OS · v4.6</div>
            </div>
          </div>

          <div className="mt-4 mb-2 text-[10px] uppercase tracking-[0.2em] text-white/40 px-3">工作區</div>
          <nav className="flex flex-col gap-1">
            {items.map((it, i) => (
              <motion.button
                key={it.key}
                initial={{ opacity: 0, x: -16 }}
                animate={{ opacity: 1, x: 0 }}
                transition={{ delay: .15 + i * 0.05 }}
                whileHover={{ x: 4 }}
                whileTap={{ scale: .97 }}
                onClick={() => onSelect(it.key)}
                className={cx(
                  'group relative flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors',
                  active === it.key
                    ? 'bg-gradient-to-r from-mint/20 to-transparent text-white ring-1 ring-mint/30'
                    : 'text-white/60 hover:text-white hover:bg-white/5'
                )}
              >
                {active === it.key && (
                  <motion.span
                    layoutId="sideIndicator"
                    className="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 rounded-r-full bg-mint shadow-[0_0_16px_2px_rgba(110,211,189,.7)]"
                  />
                )}
                <span className="text-lg w-6 text-center">{it.icon}</span>
                <span>{it.label}</span>
              </motion.button>
            ))}
          </nav>

          <div className="mt-auto p-4 rounded-2xl glass relative overflow-hidden">
            <div className="absolute -right-8 -top-8 w-32 h-32 rounded-full bg-mint/20 blur-2xl" />
            <div className="text-[11px] text-mint uppercase tracking-widest">Pro Tip</div>
            <div className="text-sm mt-1 leading-snug text-white/80">拖曳右側案件卡片即可改變狀態，所有變更會即時同步至雲端。</div>
          </div>
        </motion.aside>
      );
    }

    /* ============================================================
     * 子元件：頂部列
     * ============================================================ */
    function Topbar({ onToggleTheme, theme, notifyCount }) {
      const { scrollY } = useScroll();
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        return scrollY.on('change', v => setScrolled(v > 12));
      }, [scrollY]);

      return (
        <motion.header
          initial={{ y: -40, opacity: 0 }}
          animate={{ y: 0, opacity: 1 }}
          transition={{ duration: .6, ease: [0.22, 1, 0.36, 1] }}
          className={cx(
            'sticky top-0 z-40 px-6 lg:px-10 py-4 flex items-center gap-4 transition-all',
            scrolled ? 'glass-strong shadow-glass' : 'bg-transparent'
          )}
        >
          <div className="flex items-center gap-2 text-white/60 text-sm">
            <span>工作區</span><span className="text-mint">/</span>
            <span className="text-white">人事案件指揮中心</span>
          </div>

          {/* 搜尋 */}
          <motion.div
            whileFocus={{ scale: 1.02 }}
            className="ml-auto flex items-center gap-2 px-4 py-2 rounded-full glass min-w-[260px] max-w-md flex-1"
          >
            <svg className="w-4 h-4 text-mint" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input
              placeholder="搜尋案件 / 員工 / 公文編號…"
              className="bg-transparent outline-none text-sm placeholder:text-white/30 flex-1"
            />
            <kbd className="text-[10px] text-white/40 border border-white/15 px-1.5 rounded">⌘K</kbd>
          </motion.div>

          <motion.button
            whileHover={{ scale: 1.06 }}
            whileTap={{ scale: .92 }}
            onClick={onToggleTheme}
            className="w-10 h-10 rounded-full glass grid place-items-center text-mint"
            title="切換主題"
          >
            <AnimatePresence mode="wait">
              <motion.span
                key={theme}
                initial={{ rotate: -90, opacity: 0 }}
                animate={{ rotate: 0, opacity: 1 }}
                exit={{ rotate: 90, opacity: 0 }}
                transition={{ duration: .25 }}
              >
                {theme === 'dark' ? '☾' : '☀'}
              </motion.span>
            </AnimatePresence>
          </motion.button>

          <motion.button
            whileHover={{ scale: 1.06 }}
            whileTap={{ scale: .92 }}
            className="relative w-10 h-10 rounded-full glass grid place-items-center"
            title="通知"
          >
            <span className="text-coral">◉</span>
            {notifyCount > 0 && (
              <motion.span
                initial={{ scale: 0 }}
                animate={{ scale: 1 }}
                className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-coral text-[10px] font-bold grid place-items-center text-ink shadow-coral"
              >
                <Counter value={notifyCount} />
              </motion.span>
            )}
          </motion.button>

          <motion.div whileHover={{ scale: 1.04 }} className="flex items-center gap-3 pl-3 pr-1 py-1 rounded-full glass">
            <div className="text-right hidden md:block">
              <div className="text-xs text-white/50">行政主任</div>
              <div className="text-sm font-medium">林雅文</div>
            </div>
            <div className="w-9 h-9 rounded-full bg-gradient-to-br from-coral to-lagoon grid place-items-center font-bold text-ink shadow-glow">林</div>
          </motion.div>
        </motion.header>
      );
    }

    /* ============================================================
     * 子元件：KPI 卡片 (含 SVG 動畫進度環)
     * ============================================================ */
    function ProgressRing({ size = 88, stroke = 6, progress, color = '#6ed3bd' }) {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const mv = useMotionValue(0);
      const sp = useSpring(mv, { duration: 1400, bounce: 0 });
      const offset = useTransform(sp, v => c - (v / 100) * c);
      useEffect(() => { mv.set(progress); }, [progress]);
      return (
        <svg width={size} height={size} className="-rotate-90">
          <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,.08)" strokeWidth={stroke} fill="none" />
          <motion.circle
            cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
            strokeLinecap="round"
            style={{ strokeDasharray: c, strokeDashoffset: offset }}
          />
        </svg>
      );
    }

    // Inline SVG icon set（避免 emoji 在某些字型下變方框）
    const Icon = ({ name, className = '' }) => {
      const paths = {
        inbox:  <path d="M3 13l3-8h12l3 8M3 13v6a2 2 0 002 2h14a2 2 0 002-2v-6M3 13h5l1 2h6l1-2h5" />,
        check:  <path d="M5 12l5 5L20 7" />,
        clock:  <g><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>,
        alert:  <g><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/></g>,
        wave:   <path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0" />,
        spark:  <path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" />,
        bell:   <g><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 21a2 2 0 004 0"/></g>,
        hand:   <g><path d="M7 11V6a2 2 0 014 0v5M11 11V5a2 2 0 014 0v6M15 11V6a2 2 0 014 0v8M19 13a7 7 0 01-14 0V9a2 2 0 014 0"/></g>,
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || paths.spark}
        </svg>
      );
    };

    function KPICard({ label, value, suffix, change, iconName, color, progress, delay = 0 }) {
      const pos = change >= 0;
      const ringColor = color.includes('mint') ? '#6ed3bd' : color.includes('coral') ? '#ff8c78' : color.includes('amber') ? '#fbbf24' : '#6ed3bd';
      return (
        <motion.div
          initial={{ opacity: 0, y: 24, scale: .96 }}
          animate={{ opacity: 1, y: 0, scale: 1 }}
          transition={{ duration: .6, delay, ease: [0.22, 1, 0.36, 1] }}
          whileHover={{ y: -4, transition: { duration: .2 } }}
          className="glass shine rounded-3xl p-5 relative overflow-hidden"
        >
          <div className={cx('absolute -right-8 -top-8 w-32 h-32 rounded-full blur-2xl opacity-40', color)} />
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className="text-xs uppercase tracking-widest text-white/50">{label}</div>
              <div className="mt-2 font-displayface font-bold text-3xl tracking-tight whitespace-nowrap">
                <Counter value={value} />{suffix && <span className="text-sm text-white/50 ml-1">{suffix}</span>}
              </div>
              <div className={cx('mt-2 inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full',
                pos ? 'bg-emerald-400/15 text-emerald-300' : 'bg-coral/15 text-coral'
              )}>
                <span>{pos ? '▲' : '▼'}</span>{Math.abs(change)}%
                <span className="text-white/40 ml-1">vs 上週</span>
              </div>
            </div>
            <div className="relative shrink-0">
              <ProgressRing progress={progress} color={ringColor} />
              <div className="absolute inset-0 grid place-items-center text-white/80">
                <Icon name={iconName} className="w-7 h-7" />
              </div>
            </div>
          </div>
        </motion.div>
      );
    }

    /* ============================================================
     * 子元件：Kanban 看板 (拖移改變狀態)
     * ============================================================ */
    function CaseCard({ c, idx }) {
      const s = STATUS[c.status];
      const prioColor = c.prio === 'high' ? 'bg-coral' : c.prio === 'mid' ? 'bg-amber-400' : 'bg-white/30';
      return (
        <motion.div
          layout
          layoutId={c.id}
          initial={{ opacity: 0, y: 16, scale: .96 }}
          animate={{ opacity: 1, y: 0, scale: 1 }}
          exit={{ opacity: 0, scale: .9 }}
          whileHover={{ y: -3 }}
          whileDrag={{ scale: 1.04, rotate: 1.5, boxShadow: '0 24px 60px rgba(0,0,0,.45)' }}
          drag
          dragSnapToOrigin
          dragElastic={0.15}
          dragMomentum={false}
          transition={{ type: 'spring', stiffness: 320, damping: 28 }}
          className="glass shine rounded-2xl p-3.5 mb-2.5 cursor-grab active:cursor-grabbing"
        >
          <div className="flex items-start justify-between gap-2">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-full bg-gradient-to-br from-mint/80 to-lagoon/80 grid place-items-center text-ink font-bold text-sm">{c.avatar}</div>
              <div className="text-[11px] text-white/40 font-mono">{c.id}</div>
            </div>
            <div className="flex items-center gap-1">

    function Kanban({ cases, setCases }) {
      const cols = ['pending', 'processing', 'done', 'rejected'];

      const onDragEnd = (c, info) => {
        // 根據拖移終點 X 判定落入哪欄
        const x = info.point.x;
        const board = document.getElementById('kanban-board');
        if (!board) return;
        const rect = board.getBoundingClientRect();
        const colWidth = rect.width / cols.length;
        const idx = Math.max(0, Math.min(cols.length - 1, Math.floor((x - rect.left) / colWidth)));
        const next = cols[idx];
        if (next !== c.status) {
          setCases(prev => prev.map(p => p.id === c.id ? { ...p, status: next } : p));
        }
      };

      // 卡片綁定 onDragEnd 的小封裝
      const DraggableCard = ({ c, idx }) => {
        return (
          <motion.div
            drag
            dragSnapToOrigin
            dragElastic={0.15}
            dragMomentum={false}
            onDragEnd={(_, info) => onDragEnd(c, info)}
            whileDrag={{ scale: 1.04, rotate: 1.5, zIndex: 50, boxShadow: '0 24px 60px rgba(0,0,0,.45)' }}
            layout
            layoutId={c.id}
          >
            <CaseCard c={c} idx={idx} />
          </motion.div>
        );
      };

      return (
        <motion.div
          id="kanban-board"
          initial={{ opacity: 0, y: 24 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: .7, delay: .35 }}
          className="glass rounded-3xl p-5"
        >
          <div className="flex items-center justify-between mb-4">
            <div>
              <h3 className="font-displayface font-bold text-lg">人事案件看板</h3>
              <p className="text-xs text-white/40 mt-0.5">拖曳卡片以變更狀態 · 即時同步</p>
            </div>
            <div className="flex items-center gap-2 text-xs text-white/50">
              <span className="w-2 h-2 rounded-full bg-mint animate-pulseDot" />
              即時同步中
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
            {cols.map((col, ci) => {
              const s = STATUS[col];
              const list = cases.filter(c => c.status === col);
              return (
                <motion.div
                  key={col}
                  initial={{ opacity: 0, y: 12 }}
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ delay: .4 + ci * 0.08 }}
                  className="rounded-2xl p-3 bg-white/[.03] border border-white/[.06] min-h-[200px]"
                >
                  <div className="flex items-center justify-between px-1.5 mb-3">
                    <div className="flex items-center gap-2">
                      <span className={cx('w-2 h-2 rounded-full', s.dot)} />
                      <span className="text-sm font-medium">{s.label}</span>
                    </div>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-white/5 text-white/60 font-mono">{list.length}</span>
                  </div>

                  <LayoutGroup>
                    <AnimatePresence>
                      {list.map((c, i) => <DraggableCard key={c.id} c={c} idx={i} />)}
                    </AnimatePresence>
                  </LayoutGroup>

                  {list.length === 0 && (
                    <motion.div
                      initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                      className="text-center text-xs text-white/30 py-8 border border-dashed border-white/10 rounded-xl"
                    >
                      拖曳至此
                    </motion.div>
                  )}
                </motion.div>
              );
            })}
          </div>
        </motion.div>
      );

    /* ============================================================
     * 子元件：流程圖 (SVG path 繪製動畫)
     * ============================================================ */
    function FlowDiagram() {
      const nodes = [
        { id: 'A', label: '申請提交',   sub: '送出表單',       x: 20,  y: 60 },
        { id: 'B', label: '初審',       sub: '人事室',         x: 200, y: 30 },
        { id: 'C', label: '主管核可',   sub: '處室主任',       x: 200, y: 120 },
        { id: 'D', label: '會辦',       sub: '會計/秘書',      x: 380, y: 75 },
        { id: 'E', label: '決行',       sub: '校長/主任秘書',  x: 560, y: 30 },
        { id: 'F', label: '歸檔通知',   sub: 'E-mail + 系統',  x: 560, y: 120 },
      ];
      const edges = [
        ['A','B'], ['A','C'], ['B','D'], ['C','D'], ['D','E'], ['E','F'],
      ];

      // path 動畫（依節點動態計算）
      const drawPath = (A, B) => {
        const midX = (A.x + B.x) / 2;
        const d = `M ${A.x + 100} ${A.y + 22} C ${midX} ${A.y + 22}, ${midX} ${B.y + 22}, ${B.x} ${B.y + 22}`;
        return (
          <motion.path
            d={d}
            stroke="url(#flowGrad)" strokeWidth="1.6" fill="none"
            strokeLinecap="round"
            initial={{ pathLength: 0, opacity: 0 }}
            animate={{ pathLength: 1, opacity: 1 }}
            transition={{ duration: 1.4, delay: 1.0 }}
          />
        );
      };

      return (
        <motion.div
          initial={{ opacity: 0, y: 24 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: .7, delay: .55 }}
          className="glass rounded-3xl p-5"
        >
          <div className="flex items-center justify-between mb-2">
            <div>
              <h3 className="font-displayface font-bold text-lg">案件流程圖</h3>
              <p className="text-xs text-white/40 mt-0.5">典型人事申請 · 平均 1.8 工作天</p>
            </div>
            <button className="text-xs text-mint hover:text-white">查看完整 SOP →</button>
          </div>

          <div className="relative overflow-x-auto">
            <svg viewBox="0 0 760 200" className="w-full min-w-[680px]">
              <defs>
                <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%"  stopColor="#6ed3bd" stopOpacity="0.2"/>
                  <stop offset="50%" stopColor="#6ed3bd" stopOpacity="1"/>
                  <stop offset="100%" stopColor="#ff8c78" stopOpacity="0.8"/>
                </linearGradient>
                <filter id="nodeGlow">
                  <feGaussianBlur stdDeviation="3" result="b"/>
                  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
              </defs>

              {/* 邊線 */}
              {edges.map(([a,b], i) => {
                const A = nodes.find(n => n.id === a);
                const B = nodes.find(n => n.id === b);
                return <g key={i}>{drawPath(A, B)}</g>;
              })}

              {/* 節點 */}
              {nodes.map((n, i) => (
                <motion.g
                  key={n.id}
                  initial={{ opacity: 0, scale: .6 }}
                  animate={{ opacity: 1, scale: 1 }}
                  transition={{ delay: 0.7 + i * 0.12, type: 'spring', stiffness: 280, damping: 18 }}
                  whileHover={{ scale: 1.05 }}
                  style={{ transformOrigin: `${n.x + 50}px ${n.y + 22}px`, cursor: 'pointer' }}
                >
                  <rect x={n.x} y={n.y} width="100" height="44" rx="11"
                    fill="rgba(255,255,255,.06)" stroke="rgba(110,211,189,.5)" strokeWidth="1"
                    filter="url(#nodeGlow)" />
                  <text x={n.x + 50} y={n.y + 19} textAnchor="middle" fontSize="12" fontWeight="600" fill="#dff8f2">
                    {n.label}
                  </text>
                  <text x={n.x + 50} y={n.y + 34} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,.5)">
                    {n.sub}
                  </text>
                </motion.g>
              ))}

              {/* 流動光點 */}
              <motion.circle r="3" fill="#6ed3bd" filter="url(#nodeGlow)">
                <animateMotion dur="3s" repeatCount="indefinite" path="M 120 82 C 180 82 180 52 200 52" />
              </motion.circle>
              <motion.circle r="3" fill="#ff8c78" filter="url(#nodeGlow)">
                <animateMotion dur="4s" repeatCount="indefinite" begin="1s"
                  path="M 300 142 C 380 142 380 97 380 97 C 540 97 540 52 560 52" />
              </motion.circle>
            </svg>
          </div>

          <div className="grid grid-cols-3 gap-3 mt-3">
            <div className="rounded-xl bg-white/[.03] p-3 border border-white/[.05]">
              <div className="text-[10px] text-white/40 uppercase tracking-widest">平均天數</div>
              <div className="font-displayface text-2xl font-bold mt-1"><Counter value={1.8} duration={1.4} /></div>
            </div>
            <div className="rounded-xl bg-white/[.03] p-3 border border-white/[.05]">
              <div className="text-[10px] text-white/40 uppercase tracking-widest">瓶頸環節</div>
              <div className="font-displayface text-lg font-bold mt-1">主管核可</div>
            </div>
            <div className="rounded-xl bg-white/[.03] p-3 border border-white/[.05]">
              <div className="text-[10px] text-white/40 uppercase tracking-widest">本月流量</div>
              <div className="font-displayface text-2xl font-bold mt-1"><Counter value={142} /></div>
            </div>
          </div>
        </motion.div>
      );
    }

                <div className="text-[11px] uppercase tracking-[0.25em] text-mint/70 mb-2">Chronicle · Admin OS</div>
                <h1 className="font-displayface font-bold text-3xl md:text-4xl tracking-tight flex items-center gap-3">
                  <span>早安，林主任</span>
                  <motion.span
                    initial={{ rotate: 0 }} animate={{ rotate: [0, 14, -8, 14, 0] }} transition={{ delay: 1.4, duration: 1.4 }}
                    className="inline-block origin-bottom-right text-coral"
                  >
                    <Icon name="hand" className="w-9 h-9" />
                  </motion.span>
                </h1>
                <p className="text-white/55 mt-1.5 text-sm">今日有 <span className="text-mint font-medium">3 件</span> 急件待您核可，<span className="text-coral font-medium">1 件</span> 將於今日到期。</p>
              </motion.section>

              {/* KPI 卡片 */}
              <section className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
                <KPICard label="待審案件"   value={cases.filter(c => c.status === 'pending').length}    suffix="件" change={12}  iconName="inbox" color="bg-amber-400/30"  progress={68} delay={.15} />
                <KPICard label="本月完成"   value={47}  suffix="件" change={8}   iconName="check" color="bg-mint/30"     progress={82} delay={.22} />
                <KPICard label="平均天數"   value={1.8} suffix="天" change={-15} iconName="clock" color="bg-lagoon/30"  progress={45} delay={.29} />
                <KPICard label="退件率"     value={3.2} suffix="%"  change={-2}  iconName="alert" color="bg-coral/30"    progress={32} delay={.36} />
              </section>

              {/* 主區兩欄 */}
              <section className="grid grid-cols-1 xl:grid-cols-3 gap-4 mb-6">
                <div className="xl:col-span-2"><Kanban cases={cases} setCases={(updater) => {
                  const prev = cases;
                  const next = typeof updater === 'function' ? updater(prev) : updater;
                  // 比對差異產生 toast
                  if (Array.isArray(prev) && Array.isArray(next)) {
                    prev.forEach(p => {
                      const n = next.find(x => x.id === p.id);
                      if (n && n.status !== p.status) {
                        window.dispatchEvent(new CustomEvent('case-status-changed', { detail: { caseId: p.id, next: n.status } }));
                      }
                    });
                  }
                  setCases(next);
                }} /></div>
                <div><Timeline todos={todos} setTodos={setTodos} /></div>
              </section>

              {/* 流程圖 */}
              <section className="mb-6"><FlowDiagram /></section>

              {/* 動作按鈕區 */}
              <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {[
                  { title: '建立新案件',     desc: '一鍵開立人事/總務申請單',   icon: '+', cta: '開始', color: 'from-mint to-lagoon' },
                  { title: '批次匯入公文',   desc: '從公文系統 XML / CSV 匯入',  icon: '↧', cta: '選擇檔案', color: 'from-lagoon to-coral' },
                  { title: '產生月報 PDF',   desc: '自動彙整本月案件統計',      icon: '⎙', cta: '產生', color: 'from-coral to-amber-400' },
                ].map((a, i) => (
                  <motion.button
                    key={a.title}
                    initial={{ opacity: 0, y: 16 }}
                    animate={{ opacity: 1, y: 0 }}
                    transition={{ delay: .65 + i * .08 }}
                    whileHover={{ y: -3 }}
                    whileTap={{ scale: .98 }}
                    onClick={() => pushToast({ type: 'success', title: a.title, msg: `已開啟「${a.title}」流程` })}
                    className="glass shine rounded-3xl p-5 text-left relative overflow-hidden group"
                  >
                    <div className={cx('absolute -right-10 -bottom-10 w-32 h-32 rounded-full blur-2xl opacity-30 bg-gradient-to-br', a.color)} />
                    <div className="flex items-center gap-3">
                      <div className={cx('w-11 h-11 rounded-2xl grid place-items-center font-displayface font-bold text-ink text-lg bg-gradient-to-br shadow-glow', a.color)}>
                        {a.icon}
                      </div>
                      <div>
                        <div className="font-displayface font-bold">{a.title}</div>
                        <div className="text-xs text-white/55 mt-0.5">{a.desc}</div>
                      </div>
                    </div>
                    <div className="mt-3 text-xs text-mint inline-flex items-center gap-1">{a.cta} →</div>
                  </motion.button>
                ))}
              </section>
            </main>
          </div>

          <ToastStack toasts={toasts} dismiss={dismissToast} />
          <CaseModal caseId={modalCaseId} onClose={() => setModalCaseId(null)} />
          <BottomProgress active={activePage} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
