<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Next.js 動態 RBAC 自動化測試儀表板 · C 方案 v4</title>
<style>
:root {
  --bg: #0b0f17;
  --panel: #121826;
  --panel-2: #1a2233;
  --line: #243049;
  --ink: #e6edf7;
  --ink-2: #9aa7bd;
  --ink-3: #6b7791;
  --accent: #4f8cff;
  --accent-2: #7ab8ff;
  --ok: #2ecc71;
  --ok-2: #1f9d57;
  --warn: #f5a623;
  --err: #ff5566;
  --err-2: #c0394a;
  --code: #0d1322;
  --shadow: 0 4px 18px rgba(0,0,0,.35);
  --radius: 10px;
  --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
a { color: var(--accent-2); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }

/* ========== Layout ========== */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 0; position: sticky; top:0; height: 100vh; overflow-y:auto; }
.brand { padding: 0 18px 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.brand-title { font-weight: 700; font-size: 14px; letter-spacing: .3px; }
.brand-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.nav-item { display:flex; align-items:center; gap:10px; padding: 9px 18px; cursor: pointer; color: var(--ink-2); font-size: 13px; border-left: 3px solid transparent; }
.nav-item:hover { background: var(--panel-2); color: var(--ink); }
.nav-item.active { background: var(--panel-2); color: var(--ink); border-left-color: var(--accent); }
.nav-item .ico { width:18px; text-align:center; opacity:.7; }
.nav-section { font-size: 10px; text-transform: uppercase; color: var(--ink-3); padding: 14px 18px 6px; letter-spacing: 1px; }
.user-card { margin: 14px 12px 0; padding: 12px; background: var(--panel-2); border-radius: 8px; font-size: 12px; }
.user-card .name { font-weight: 600; color: var(--ink); }
.user-card .role { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; background: var(--accent); color: #fff; margin-top: 4px; }
.user-card .role.dept_officer { background: #2ecc71; }
.user-card .role.sysadmin { background: #c0394a; }
.user-card .role.teacher { background: #f5a623; color:#000; }
.user-card .role.parent { background: #9b59b6; }
.user-card .role.student { background: #3498db; }
.user-card .role.guest { background: #6b7791; }
.user-card button { margin-top: 8px; width: 100%; }

.main { padding: 24px 32px; min-width: 0; }
.page-head { display:flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.page-title { font-size: 20px; font-weight: 700; margin: 0; }
.page-sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.breadcrumb { font-size: 12px; color: var(--ink-3); }
.breadcrumb .sep { margin: 0 6px; opacity: .5; }

/* ========== Buttons ========== */
button, .btn { font-family: var(--sans); font-size: 12.5px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 6px; cursor: pointer; transition: all .15s; }
button:hover, .btn:hover { background: #232c44; border-color: #344368; }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
button.primary:hover { background: #6a9eff; }
button.danger { background: var(--err-2); border-color: var(--err-2); color:#fff; }
button.danger:hover { background: #e64556; }
button.ghost { background: transparent; border-color: var(--line); }
button:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display:flex; gap: 8px; flex-wrap: wrap; }
.btn-sm { font-size: 11.5px; padding: 4px 10px; }

/* ========== Cards / Panels ========== */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-head { display:flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.card-title { font-size: 14px; font-weight: 600; margin: 0; }
.card-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

/* ========== KPI Tiles ========== */
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.kpi .label { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .5px; }
.kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
.kpi.ok .value { color: var(--ok); }
.kpi.err .value { color: var(--err); }
.kpi.warn .value { color: var(--warn); }

/* ========== Table ========== */
table { width:100%; border-collapse: collapse; }
table th, table td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 12.5px; }
table th { background: var(--panel-2); color: var(--ink-2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
table tr:hover td { background: var(--panel-2); }
table td.mono, table td code { font-family: var(--mono); font-size: 11.5px; }

/* ========== Tag / Badge ========== */
.tag { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .3px; }
.tag.ok { background: rgba(46,204,113,.15); color: var(--ok); border: 1px solid rgba(46,204,113,.3); }
.tag.err { background: rgba(255,85,102,.15); color: var(--err); border: 1px solid rgba(255,85,102,.3); }
.tag.warn { background: rgba(245,166,35,.15); color: var(--warn); border: 1px solid rgba(245,166,35,.3); }
.tag.info { background: rgba(79,140,255,.15); color: var(--accent-2); border: 1px solid rgba(79,140,255,.3); }
.tag.muted { background: var(--panel-2); color: var(--ink-3); border: 1px solid var(--line); }

/* ========== Form / Input ========== */
label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
input[type="text"], input[type="password"], input[type="email"], select, textarea {
  width:100%; padding: 8px 10px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; font-size: 12.5px; font-family: var(--sans);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.field { margin-bottom: 12px; }
.field .hint { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* ========== Login Page ========== */
.login-shell { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-card { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
.login-card h1 { margin: 0 0 4px; font-size: 22px; }
.login-card .sub { color: var(--ink-3); font-size: 12.5px; margin-bottom: 22px; }
.demo-list { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.demo-list h3 { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px; }
.demo-acc { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.demo-acc:hover { background: var(--panel-2); }
.demo-acc .acc-name { font-family: var(--mono); }
.demo-acc .acc-role { color: var(--ink-3); font-size: 11px; }

/* ========== Test Runner ========== */
.test-list { display: flex; flex-direction: column; gap: 8px; }
.test-item { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 12px; }
.test-item .status { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.test-item .status.pending { background: var(--ink-3); color: var(--bg); }
.test-item .status.running { background: var(--warn); color: #000; animation: pulse 1s infinite; }
.test-item .status.passed { background: var(--ok); color: #04240e; }
.test-item .status.failed { background: var(--err); color: #250308; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.test-item .name { font-weight: 500; font-size: 13px; }
.test-item .name .desc { display:block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; margin-top: 1px; }
.test-item .meta { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.test-item.expand { grid-template-columns: 22px 1fr; }
.test-item.expand .meta { grid-column: 2; margin-top: 6px; }
.test-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.test-detail .step { font-family: var(--mono); font-size: 11px; color: var(--ink-2); padding: 2px 0; }
.test-detail .step.err { color: var(--err); }
.test-detail .step.ok { color: var(--ok); }

/* ========== Progress / Logs ========== */
.progress-bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 10px 0; }
.progress-bar .fill { height: 100%; background: var(--accent); transition: width .25s; }
.log-window { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-family: var(--mono); font-size: 11.5px; height: 280px; overflow-y: auto; color: #c8d3e6; }
.log-window .line { padding: 1px 0; }
.log-window .ts { color: var(--ink-3); }
.log-window .lvl { display:inline-block; width: 56px; }
.log-window .lvl.info { color: var(--accent-2); }
.log-window .lvl.pass { color: var(--ok); }
.log-window .lvl.fail { color: var(--err); }
.log-window .lvl.warn { color: var(--warn); }
.log-window .lvl.req { color: #c084fc; }

/* ========== Code Block ========== */
pre.code-block { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 14px; overflow-x: auto; font-size: 11.5px; line-height: 1.5; color: #d2dcef; }
pre.code-block .k { color: #c084fc; }
pre.code-block .s { color: #98d982; }
pre.code-block .c { color: var(--ink-3); font-style: italic; }
pre.code-block .f { color: #f5a623; }
pre.code-block .n { color: #6ec1ff; }

/* ========== Matrix ========== */
.matrix-table { font-size: 11.5px; }
.matrix-table th, .matrix-table td { text-align: center; padding: 7px 8px; }
.matrix-table td.account { text-align: left; font-family: var(--mono); }
.matrix-table td.pass { background: rgba(46,204,113,.15); color: var(--ok); }
.matrix-table td.fail { background: rgba(255,85,102,.15); color: var(--err); }
.matrix-table td.skip { background: var(--panel-2); color: var(--ink-3); }

/* ========== Misc ========== */
.flex { display: flex; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .gap-16 { gap: 16px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
.text-12 { font-size: 12px; } .text-11 { font-size: 11px; } .text-13 { font-size: 13px; }
.muted { color: var(--ink-3); } .dim { color: var(--ink-2); }
.center { text-align: center; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.scroll-y { overflow-y: auto; }
.toast { position: fixed; top: 20px; right: 20px; z-index: 1000; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; box-shadow: var(--shadow); font-size: 13px; max-width: 360px; }
.toast.ok { border-left: 4px solid var(--ok); }
.toast.err { border-left: 4px solid var(--err); }
.toast.warn { border-left: 4px solid var(--warn); }
.toast.info { border-left: 4px solid var(--accent); }
.section-title { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px; font-weight: 600; }
.empty { padding: 30px; text-align: center; color: var(--ink-3); font-size: 13px; }

.role-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.role-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.role-pill.sysadmin .dot { background: #c0394a; } .role-pill.sysadmin { background: rgba(192,57,74,.12); color: #ff8e98; }
.role-pill.dept_officer .dot { background: #2ecc71; } .role-pill.dept_officer { background: rgba(46,204,113,.12); color: #6ee7a0; }
.role-pill.teacher .dot { background: #f5a623; } .role-pill.teacher { background: rgba(245,166,35,.12); color: #ffc771; }
.role-pill.parent .dot { background: #9b59b6; } .role-pill.parent { background: rgba(155,89,182,.12); color: #d2a8e6; }
.role-pill.student .dot { background: #3498db; } .role-pill.student { background: rgba(52,152,219,.12); color: #7fc6ee; }
.role-pill.guest .dot { background: #6b7791; } .role-pill.guest { background: rgba(107,119,145,.12); color: #b8c1d4; }

@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="app" id="app-root">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<div id="toast-host"></div>

<script>
/* =============================================================================
 *  Next.js 動態 RBAC 自動化測試儀表板 — C 方案 v4 完整實作
 *  -----------------------------------------------------------------------------
 *  本檔案為「單檔 HTML 完整 SPA」，模擬一個 Next.js 14+ App Router 風格的系統：
 *   1) 動態角色權限管理後端（in-memory store + 9 帳號 + RBAC 矩陣）
 *   2) 動態角色 CRUD UI（admin 增刪改 + 權限指派）
 *   3) Playwright 自動化測試引擎（內嵌 async test runner + 9 帳號 E2E 矩陣）
 *   4) 測試結果即時儀表板（pass / fail / trace / timing / log）
 *   5) C 方案 v4 鐵律：matchAudience noop + 受眾不可寫 403
 *
 *  對應 micro-skills (SKILL_CATALOG.md):
 *    #2  nextjs_rbac_frontend
 *    #17 playwright_testing
 *    #11 test_environment_management
 *    #15 headless_testing_framework
 *    #4  frontend_ui_design_patterns
 *
 *  對應 trial-and-error 內 audience-permission-logic.md
 *    C 方案 v4 5 鐵律全部實作並由自動化測試守護
 * ============================================================================= */

'use strict';

/* ============================================================================
 * §1  RBAC 核心模型 + 9 帳號 Demo Data
 * ============================================================================ */
const PERMISSIONS = [
  // 公告 / 內容
  { key: 'announcement.read',         group: '公告',   desc: '讀取公告列表 / 詳情' },
  { key: 'announcement.create',       group: '公告',   desc: '發布新公告' },
  { key: 'announcement.update',       group: '公告',   desc: '編輯自己處室公告' },
  { key: 'announcement.delete',       group: '公告',   desc: '刪除公告' },
  { key: 'announcement.publish_all',  group: '公告',   desc: '跨處室強制發布' },
  // 使用者
  { key: 'user.read',                 group: '使用者', desc: '查看使用者列表' },
  { key: 'user.create',               group: '使用者', desc: '新增使用者帳號' },
  { key: 'user.update',               group: '使用者', desc: '編輯使用者資料' },
  { key: 'user.delete',               group: '使用者', desc: '刪除使用者' },
  // 角色（動態）
  { key: 'role.read',                 group: '角色',   desc: '查看角色清單' },
  { key: 'role.create',               group: '角色',   desc: '新增角色' },
  { key: 'role.update',               group: '角色',   desc: '編輯角色（含權限指派）' },
  { key: 'role.delete',               group: '角色',   desc: '刪除角色' },
  // 系統
  { key: 'system.audit',              group: '系統',   desc: '查看 audit log' },
  { key: 'system.config',             group: '系統',   desc: '修改系統設定' },
];

// 預設角色（內建，動態角色由 admin 在 UI 新增）
const DEFAULT_ROLES = [
  { id: 'r_sysadmin',  name: 'sysadmin',     label: '系統管理員',   builtin: true,
    permissions: PERMISSIONS.map(p => p.key) },
  { id: 'r_dept_off',  name: 'dept_officer', label: '處室承辦人',   builtin: true,
    permissions: ['announcement.read','announcement.create','announcement.update','announcement.delete','user.read','role.read'] },
  { id: 'r_teacher',   name: 'teacher',      label: '教師',         builtin: true,
    permissions: ['announcement.read','user.read'] },
  { id: 'r_parent',    name: 'parent',       label: '家長',         builtin: true,
    permissions: ['announcement.read'] },
  { id: 'r_student',   name: 'student',      label: '學生',         builtin: true,
    permissions: ['announcement.read'] },
  { id: 'r_guest',     name: 'guest',        label: '訪客',         builtin: true,
    permissions: ['announcement.read'] },
];

// 9 個 demo 帳號（完全對應 C 方案 v4 E2E 矩陣）
const DEMO_ACCOUNTS = [
  { id: 'u_001', username: 'principal',    password: 'School@2026', name: '王校長',   dept: 'principal',   role: 'sysadmin',     email: 'principal@school.edu.tw' },
  { id: 'u_002', username: 'teaching',     password: 'School@2026', name: '陳教務長', dept: 'teaching',    role: 'dept_officer', email: 'teaching@school.edu.tw' },
  { id: 'u_003', username: 'student',      password: 'School@2026', name: '林學務長', dept: 'student',     role: 'dept_officer', email: 'student@school.edu.tw' },
  { id: 'u_004', username: 'general',      password: 'School@2026', name: '黃總務長', dept: 'general',     role: 'dept_officer', email: 'general@school.edu.tw' },
  { id: 'u_005', username: 'counsel',      password: 'School@2026', name: '吳輔導長', dept: 'counsel',     role: 'dept_officer', email: 'counsel@school.edu.tw' },
  { id: 'u_006', username: 'it',           password: 'School@2026', name: '李資訊組長', dept: 'it',         role: 'dept_officer', email: 'it@school.edu.tw' },
  { id: 'u_007', username: 'teacher_lin',  password: 'School@2026', name: '林老師',   dept: 'teaching',    role: 'teacher',      email: 'teacher_lin@school.edu.tw' },
  { id: 'u_008', username: 'parent_chen',  password: 'School@2026', name: '陳家長',   dept: 'parent',      role: 'parent',       email: 'parent_chen@school.edu.tw' },
  { id: 'u_009', username: 'student_wang', password: 'School@2026', name: '王同學',   dept: 'student',     role: 'student',      email: 'student_wang@school.edu.tw' },
];

// 4 個 demo 公告（v4 過渡期 = 任何人都能看見全部）
const DEMO_ANNOUNCEMENTS = [
  { id: 'a_001', title: '【教務處】114 學年度課程計畫說明會', dept: 'teaching',  publisherId: 'u_002', createdAt: '2026-08-01T09:00:00Z', status: 'published' },
  { id: 'a_002', title: '【學務處】友善校園宣導週',           dept: 'student',   publisherId: 'u_003', createdAt: '2026-08-02T10:30:00Z', status: 'published' },
  { id: 'a_003', title: '【總務處】暑假校舍修繕進度',         dept: 'general',   publisherId: 'u_004', createdAt: '2026-08-03T14:00:00Z', status: 'published' },
  { id: 'a_004', title: '【輔導室】新生心理適應量表施測',     dept: 'counsel',   publisherId: 'u_005', createdAt: '2026-08-04T08:00:00Z', status: 'published' },
];


/* ============================================================================
 * §2  In-Memory Store（模擬 Next.js + Supabase 持久層）
 * ============================================================================ */
const DB = {
  users:         JSON.parse(JSON.stringify(DEMO_ACCOUNTS)),
  roles:         JSON.parse(JSON.stringify(DEFAULT_ROLES)),
  announcements: JSON.parse(JSON.stringify(DEMO_ANNOUNCEMENTS)),
  auditLog:      [],
  // 動態建立的自訂角色（id 從 r_dyn_001 起跳）
  nextRoleId: 1,
};

function logAudit(actorId, action, target, payload) {
  DB.auditLog.unshift({
    id: 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    ts: new Date().toISOString(),
    actorId, action, target, payload: payload || null,
  });
  if (DB.auditLog.length > 200) DB.auditLog.pop();
}


/* ============================================================================
 * §3  API 層（模擬 Next.js Route Handlers，回傳 NextResponse-like 結構）
 *     路徑設計完全對應 Next.js 14 App Router 的 app/api/[endpoint]/route.ts 風格
 * ============================================================================ */
// API handlers 結構：{ 'METHOD /path': fn }
// 路徑設計完全對應 Next.js 14 App Router 的 app/api/[endpoint]/route.ts 風格
const Api = {
  // --- Auth ---
  'POST /api/auth/login': function(ctx, body) {
    const { username, password } = body || {};
    const u = DB.users.find(x => x.username === username);
    if (!u || u.password !== password) {
      return { status: 401, body: { error: { code: 'INVALID_CREDENTIALS', message: '帳號或密碼錯誤' } } };
    }
    const token = 'tok_' + u.id + '_' + Date.now().toString(36);
    logAudit(u.id, 'auth.login', u.id);
    return { status: 200, body: { data: { token, user: stripUser(u) } } };
  },
  'GET /api/auth/me': function(ctx) {
    const u = currentUser(ctx);
    if (!u) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    return { status: 200, body: { data: stripUser(u) } };
  },
  'POST /api/auth/logout': function(ctx) {
    ctx.token = null;
    return { status: 200, body: { data: { ok: true } } };
  },

  // --- Announcements ---
  'GET /api/announcements': function(ctx) {
    // C 方案 v4 鐵律 1 + 5：matchAudience noop = 所有人都能看見全部
    const list = matchAudience(DB.announcements, ctx);
    return { status: 200, body: { data: list } };
  },
  'POST /api/announcements': function(ctx, body) {
    // C 方案 v4 鐵律 3：受眾（teacher/parent/student/guest）不可發布 → 403
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!canPublish(me)) {
      return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有發布公告的權限。處室承辦才能發布公告。' } } };
    }
    const { title, dept, status } = body || {};
    if (!title) return { status: 400, body: { error: { code: 'VALIDATION', message: 'title 必填' } } };
    const ann = {
      id: 'a_' + String(DB.announcements.length + 1).padStart(3, '0'),
      title, dept: dept || me.dept, publisherId: me.id, status: status || 'published',
      createdAt: new Date().toISOString(),
    };
    DB.announcements.push(ann);
    logAudit(me.id, 'announcement.create', ann.id, { title });
    return { status: 201, body: { data: ann } };
  },
  'PATCH /api/announcements': function(ctx, body) {
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!canPublish(me)) return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有編輯公告的權限。處室承辦才能編輯公告。' } } };
    const { id, ...patch } = body || {};
    const idx = DB.announcements.findIndex(a => a.id === id);
    if (idx < 0) return { status: 404, body: { error: { code: 'NOT_FOUND', message: '公告不存在' } } };
    DB.announcements[idx] = { ...DB.announcements[idx], ...patch };
    logAudit(me.id, 'announcement.update', id, patch);
    return { status: 200, body: { data: DB.announcements[idx] } };
  },
  'DELETE /api/announcements': function(ctx, body) {
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!canPublish(me)) return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有刪除公告的權限。處室承辦才能刪除公告。' } } };
    const { id } = body || {};
    const idx = DB.announcements.findIndex(a => a.id === id);
    if (idx < 0) return { status: 404, body: { error: { code: 'NOT_FOUND', message: '公告不存在' } } };
    DB.announcements.splice(idx, 1);
    logAudit(me.id, 'announcement.delete', id);
    return { status: 200, body: { data: { ok: true } } };
  },

  // --- Roles (Dynamic) ---
  'GET /api/roles': function(ctx) {
    return { status: 200, body: { data: DB.roles } };
  },
  'POST /api/roles': function(ctx, body) {
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!hasPerm(me, 'role.create')) return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有新增角色的權限。' } } };
    const { name, label, permissions } = body || {};
    if (!name || !/^[a-z][a-z0-9_]{2,30}$/.test(name)) {
      return { status: 400, body: { error: { code: 'VALIDATION', message: 'name 須為小寫英文 / 數字 / 底線，3-30 字' } } };
    }
    if (DB.roles.some(r => r.name === name)) {
      return { status: 409, body: { error: { code: 'CONFLICT', message: '角色名稱已存在' } } };
    }
    const role = { id: 'r_dyn_' + String(DB.nextRoleId++).padStart(3,'0'), name, label: label || name, builtin: false, permissions: permissions || [] };
    DB.roles.push(role);
    logAudit(me.id, 'role.create', role.id, { name, permissions });
    return { status: 201, body: { data: role } };
  },
  'PATCH /api/roles': function(ctx, body) {
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!hasPerm(me, 'role.update')) return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有編輯角色的權限。' } } };
    const { id, name, label, permissions } = body || {};
    const role = DB.roles.find(r => r.id === id);
    if (!role) return { status: 404, body: { error: { code: 'NOT_FOUND', message: '角色不存在' } } };
    if (role.builtin && role.name !== name) {
      return { status: 400, body: { error: { code: 'BUILTIN_RENAME', message: '內建角色不可改名' } } };
    }
    if (name && /^[a-z][a-z0-9_]{2,30}$/.test(name) && name !== role.name) {
      if (DB.roles.some(r => r.name === name)) {
        return { status: 409, body: { error: { code: 'CONFLICT', message: '角色名稱已被使用' } } };
      }
      role.name = name;
    }
    if (label) role.label = label;
    if (Array.isArray(permissions)) role.permissions = permissions;
    logAudit(me.id, 'role.update', id, { name: role.name, permissions: role.permissions });
    return { status: 200, body: { data: role } };
  },
  'DELETE /api/roles': function(ctx, body) {
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!hasPerm(me, 'role.delete')) return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有刪除角色的權限。' } } };
    const { id } = body || {};
    const role = DB.roles.find(r => r.id === id);
    if (!role) return { status: 404, body: { error: { code: 'NOT_FOUND', message: '角色不存在' } } };
    if (role.builtin) return { status: 400, body: { error: { code: 'BUILTIN_DELETE', message: '內建角色不可刪除' } } };
    if (DB.users.some(u => u.role === role.name)) {
      return { status: 409, body: { error: { code: 'ROLE_IN_USE', message: '仍有使用者綁定此角色，請先轉移' } } };
    }
    DB.roles = DB.roles.filter(r => r.id !== id);
    logAudit(me.id, 'role.delete', id);
    return { status: 200, body: { data: { ok: true } } };
  },

  // --- Users ---
  'GET /api/users': function(ctx) {
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!hasPerm(me, 'user.read')) return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有查看使用者的權限。' } } };
    return { status: 200, body: { data: DB.users.map(stripUser) } };
  },

  // --- Audit ---
  'GET /api/audit': function(ctx) {
    const me = currentUser(ctx);
    if (!me) return { status: 401, body: { error: { code: 'UNAUTHENTICATED', message: '請先登入' } } };
    if (!hasPerm(me, 'system.audit')) return { status: 403, body: { error: { code: 'FORBIDDEN', message: '您的角色沒有查看 audit 的權限。' } } };
    return { status: 200, body: { data: DB.auditLog } };
  },
};


/* ============================================================================
 * §4  RBAC 核心邏輯（對應 C 方案 v4 5 鐵律）
 * ============================================================================ */

function stripUser(u) {
  if (!u) return null;
  const { password, ...rest } = u;
  return rest;
}

function currentUser(ctx) {
  if (!ctx || !ctx.token) return null;
  // token 格式：tok_<userId>_<ts>
  const m = /^tok_(u_\d{3})_/.exec(ctx.token);
  if (!m) return null;
  return DB.users.find(u => u.id === m[1]) || null;
}

function getRoleByName(roleName) {
  return DB.roles.find(r => r.name === roleName);
}

function hasPerm(user, permKey) {
  if (!user) return false;
  const role = getRoleByName(user.role);
  if (!role) return false;
  return role.permissions.includes(permKey);
}

// C 方案 v4 鐵律 3：可發布 = dept_officer + sysadmin（受眾一律 403）
function canPublish(user) {
  return user && (user.role === 'dept_officer' || user.role === 'sysadmin');
}

// C 方案 v4 鐵律 1 + 5：matchAudience 過渡期 = noop（所有人都看見全部）
//   當未來「內部公告」機制建立時，此函式才有邏輯可寫。
function matchAudience(list /*, ctx */) {
  // v4 簡化：登入後 >= 未登入 = 設計聖經
  // 在 isInternal / audience_type 機制建立前，直接 return 全部
  return list.slice();
}


/* ============================================================================
 * §5  In-Memory HTTP Client（給 Playwright TestRunner 用）
 *     完全模擬 fetch() → /api/** 的 round-trip
 * ============================================================================ */
const HttpClient = {
  call(method, path, body, token) {
    const ctx = { token: token || null };
    const key = method + ' ' + path;
    const handler = Api[key];
    if (!handler) {
      return Promise.resolve({ status: 404, body: { error: { code: 'NO_HANDLER', message: 'No handler for ' + method + ' ' + path } } });
    }
    // 模擬非同步
    return new Promise(resolve => {
      setTimeout(() => {
        const res = handler(ctx, body);
        // 模擬 NextResponse.json 的延遲
        resolve({ status: res.status, body: res.body });
      }, 5 + Math.random() * 25);
    });
  }
};


/* ============================================================================
 * §6  Playwright-style 自動化測試引擎（內嵌版）
 *     - 風格：playwright_test 規範（test/expect）
 *     - 用途：對 §3 的 API + §4 的 RBAC 跑 9 帳號 E2E 矩陣 + 動態角色 CRUD
 * ============================================================================ */
const TestEngine = {
  suite: [],
  results: [],
  current: null,
  add(test) { this.suite.push(test); },
  clear() { this.suite = []; this.results = []; },
  _assert(cond, msg, ctx) {
    if (cond) { ctx.pass++; return { ok: true }; }
    ctx.fail++; return { ok: false, msg };
  },
  async _runOne(t, logFn) {
    const ctx = { pass: 0, fail: 0, steps: [] };
    const start = performance.now();
    let error = null, result = 'passed';
    try {
      // 支援 async / sync
      const ret = await t.fn({ assert: (cond, msg) => this._assert(cond, msg, ctx), log: (s, lvl='info') => ctx.steps.push({ lvl, msg: s }), http: HttpClient, db: DB, PERMISSIONS });
      if (ret && ret.failed) result = 'failed';
    } catch (e) {
      error = e.message + (e.stack ? '\n' + e.stack.split('\n').slice(0,3).join('\n') : '');
      result = 'failed';
      ctx.fail++;
    }
    const dur = Math.round(performance.now() - start);
    return { name: t.name, desc: t.desc, group: t.group, status: result, dur, steps: ctx.steps, error };
  },
  async runAll(progressFn) {
    this.results = [];
    let i = 0;
    for (const t of this.suite) {
      const r = await this._runOne(t);
      this.results.push(r);
      if (progressFn) progressFn(++i, this.suite.length, r);
    }
    return this.results;
  },
};

      const r = await http.call('DELETE', '/api/roles', { id: c.body.data.id }, login.body.data.token);
      assert(r.status === 200, '應為 200 實際 ' + r.status);
    }});
  T.add({ group: '動態角色', name: 'C8: 刪除內建角色 → 400',
    desc: 'builtin 不可刪除',
    fn: async ({ assert, http }) => {
      const login = await http.call('POST', '/api/auth/login', { username: 'principal', password: 'School@2026' });
      const r = await http.call('DELETE', '/api/roles', { id: 'r_teacher' }, login.body.data.token);
      assert(r.status === 400, '應為 400 實際 ' + r.status);
    }});
  T.add({ group: '動態角色', name: 'C9: 刪除「有人使用中」角色 → 409',
    desc: 'still in use',
    fn: async ({ assert, http }) => {
      // 我們會先建一個角色，並把某 user 換過去
      const login = await http.call('POST', '/api/auth/login', { username: 'principal', password: 'School@2026' });
      const c = await http.call('POST', '/api/roles', { name: 'temp_used', label: '暫用', permissions: [] }, login.body.data.token);
      // 暫時把 parent_chen 切到 temp_used
      const target = DB.users.find(u => u.username === 'parent_chen');
      const origRole = target.role;
      target.role = 'temp_used';
      const r = await http.call('DELETE', '/api/roles', { id: c.body.data.id }, login.body.data.token);
      target.role = origRole; // restore
      assert(r.status === 409, '應為 409 實際 ' + r.status);
    }});

  // ---- §D. matchAudience / 矩陣進階 ----
  T.add({ group: '進階', name: 'D1: 未登入訪客可看到全部公告 (v4 鐵律 1)',
    desc: 'C 方案 v4 過渡期 = 任何視角 return true',
    fn: async ({ assert, http }) => {
      const r = await http.call('GET', '/api/announcements', null, null);
      assert(r.status === 200, '應為 200');
      assert(r.body.data.length === 4, '應看到 4 個');
    }});
  T.add({ group: '進階', name: 'D2: dept_officer 跨處室可見 (v4 鐵律 2)',
    desc: 'teaching 可看到 general / counsel 發的公告',
    fn: async ({ assert, http }) => {
      const login = await http.call('POST', '/api/auth/login', { username: 'teaching', password: 'School@2026' });
      const r = await http.call('GET', '/api/announcements', null, login.body.data.token);
      const depts = new Set(r.body.data.map(a => a.dept));
      assert(depts.size === 4, 'teaching 應看到 4 個不同處室的公告，實際 ' + depts.size);
    }});
  T.add({ group: '進階', name: 'D3: 受眾登入後看見 >= 未登入 (v4 鐵律 v4)',
    desc: '登入後數量 >= 未登入',
    fn: async ({ assert, http }) => {
      const guest = (await http.call('GET', '/api/announcements', null, null)).body.data.length;
      for (const u of ['teacher_lin','parent_chen','student_wang']) {
        const login = await http.call('POST', '/api/auth/login', { username: u, password: 'School@2026' });
        const cnt = (await http.call('GET', '/api/announcements', null, login.body.data.token)).body.data.length;
        assert(cnt >= guest, u + ' 看到 ' + cnt + ' < 未登入 ' + guest + ' = v4 違反');
      }
    }});
  T.add({ group: '進階', name: 'D4: hasPerm 函式單元測試',
    desc: 'role.permissions 包含檢查',
    fn: async ({ assert }) => {
      const p = (uname, perm) => {
        const u = DB.users.find(x => x.username === uname);
        const role = DB.roles.find(r => r.name === u.role);
        return role.permissions.includes(perm);
      };
      assert(p('principal',  'role.delete')  === true,  'sysadmin 應有 role.delete');
      assert(p('teaching',   'announcement.create') === true, 'dept_officer 應有 announcement.create');
      assert(p('teacher_lin','announcement.create') === false, 'teacher 不應有 announcement.create');
      assert(p('parent_chen','announcement.read') === true, 'parent 應有 announcement.read');
    }});

  // ---- §E. Audit & Misc ----
  T.add({ group: '系統', name: 'E1: 任何寫入都會進 audit log',
    desc: 'POST /api/announcements → log 內有新一筆',
    fn: async ({ assert, http }) => {
      const login = await http.call('POST', '/api/auth/login', { username: 'principal', password: 'School@2026' });
      const before = DB.auditLog.length;
      await http.call('POST', '/api/announcements', { title: 'audit 測試' }, login.body.data.token);
      const after = DB.auditLog.length;
      assert(after === before + 1, 'audit log 應 +1 實際 ' + (after - before));
    }});
  T.add({ group: '系統', name: 'E2: GET /api/audit 需 system.audit 權限',
    desc: 'teacher 沒權限 → 403',
    fn: async ({ assert, http }) => {
      const login = await http.call('POST', '/api/auth/login', { username: 'teacher_lin', password: 'School@2026' });
      const r = await http.call('GET', '/api/audit', null, login.body.data.token);
      assert(r.status === 403, '應為 403 實際 ' + r.status);
    }});
  T.add({ group: '系統', name: 'E3: 9 帳號登入並行效能 < 800ms',
    desc: '20 個並行請求 P95 < 800ms (in-memory)',
    fn: async ({ assert, http }) => {
      const t0 = performance.now();
      const tasks = [];
      for (let i = 0; i < 20; i++) {
        tasks.push(http.call('GET', '/api/announcements', null, null));
      }
      await Promise.all(tasks);
      const dur = performance.now() - t0;
      assert(dur < 800, '20 並行耗時 ' + Math.round(dur) + 'ms 應 < 800ms');
    }});
}

        <div id="r-perms" style="max-height:280px; overflow-y:auto; padding:6px; background:var(--panel-2); border-radius:6px;">
          ${PERMISSIONS.map(p => `<label style="display:block; padding:3px 0; font-weight:normal;">
            <input type="checkbox" value="${p.key}" ${role.permissions.includes(p.key) ? 'checked' : ''} style="width:auto; margin-right:6px;">${p.key}
            <span class="muted text-11">— ${p.desc}</span>
          </label>`).join('')}
        </div>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="UI.submitEditRole('${role.id}')">儲存</button>
        <button class="ghost" onclick="document.getElementById('role-edit-panel').style.display='none'">取消</button>
      </div>
    `;
    document.getElementById('role-edit-body').innerHTML = html;
    document.getElementById('edit-role-name').textContent = role.name;
    document.getElementById('role-edit-panel').style.display = 'block';
  },

  async submitEditRole(id) {
    const name = document.getElementById('r-name').value.trim();
    const label = document.getElementById('r-label').value.trim();
    const perms = Array.from(document.querySelectorAll('#r-perms input:checked')).map(i => i.value);
    const r = await HttpClient.call('PATCH', '/api/roles', { id, name, label, permissions: perms }, this.session.token);
    if (r.status === 200) {
      this.toast('角色已更新：' + r.body.data.name, 'ok');
      this.render();
    } else {
      this.toast(r.body.error.message, 'err');
    }
  },

  async confirmDeleteRole(id) {
    const role = DB.roles.find(r => r.id === id);
    if (!confirm('確定刪除角色「' + role.name + '」？此操作無法復原。')) return;
    const r = await HttpClient.call('DELETE', '/api/roles', { id }, this.session.token);
    if (r.status === 200) {
      this.toast('角色已刪除', 'ok');
      this.render();
    } else {
      this.toast(r.body.error.message, 'err');
    }
  },

  openAnnModal() {
    const html = `
      <div class="card-head"><div><div class="card-title">發布公告</div></div></div>
      <div class="field"><label>標題</label><input id="a-title" placeholder="公告標題"></div>
      <div class="field"><label>處室</label>
        <select id="a-dept">
          <option value="teaching">教務處</option>
          <option value="student">學務處</option>
          <option value="general">總務處</option>
          <option value="counsel">輔導室</option>
          <option value="it">資訊組</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="UI.submitNewAnn()">發布</button>
        <button class="ghost" onclick="document.getElementById('role-edit-panel').style.display='none'">取消</button>
      </div>
    `;
    document.getElementById('role-edit-body').innerHTML = html;
    document.getElementById('edit-role-name').textContent = '新公告';
    document.getElementById('role-edit-panel').style.display = 'block';
  },
  async submitNewAnn() {
    const title = document.getElementById('a-title').value.trim();
    const dept = document.getElementById('a-dept').value;
    const r = await HttpClient.call('POST', '/api/announcements', { title, dept }, this.session.token);
    if (r.status === 201) {
      this.toast('公告已發布：' + r.body.data.title, 'ok');
      document.getElementById('role-edit-panel').style.display = 'none';
      this.render();
    } else {
      this.toast(r.body.error.message, 'err');
    }
  },
  async deleteAnn(id) {
    if (!confirm('確定刪除公告？')) return;
    const r = await HttpClient.call('DELETE', '/api/announcements', { id }, this.session.token);
    if (r.status === 200) { this.toast('已刪除', 'ok'); this.render(); }
    else this.toast(r.body.error.message, 'err');
  },

  // ---- 測試執行 ----
  _logLine(lvl, msg) {
    const win = document.getElementById('log-window');
    if (!win) return;
    const ts = new Date().toISOString().slice(11,19);
    const line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = `<span class="ts">${ts}</span> <span class="lvl ${lvl}">[${lvl.toUpperCase()}]</span> ${msg}`;
    win.appendChild(line);
    win.scrollTop = win.scrollHeight;
  },
  async runTests() {
    const btn = document.getElementById('run-btn');
    btn.disabled = true; btn.textContent = '執行中…';
    document.getElementById('log-window').innerHTML = '';
    this._logLine('info', 'TestEngine: 開始執行 ' + TestEngine.suite.length + ' 個測試');
    // 重置 DB 副作用：還原 4 個 demo 公告 + 清空 audit（測試間互不污染）
    DB.announcements = JSON.parse(JSON.stringify(DEMO_ANNOUNCEMENTS));
    DB.auditLog = [];
    const t0 = performance.now();
    let i = 0;
    for (const t of TestEngine.suite) {
      const tsEl = document.getElementById('ts-' + i);
      const tmEl = document.getElementById('tm-' + i);
      tsEl.className = 'status running'; tsEl.textContent = '…';
      tmEl.textContent = 'running…';
      this._logLine('req', '▶ ' + t.name);
      const r = await TestEngine._runOne(t);
      TestEngine.results[i] = r;
      if (r.status === 'passed') {
        tsEl.className = 'status passed'; tsEl.textContent = '✓';
        this._logLine('pass', '✓ ' + t.name + ' (' + r.dur + 'ms)');
      } else {
        tsEl.className = 'status failed'; tsEl.textContent = '✗';
        this._logLine('fail', '✗ ' + t.name + ' — ' + (r.error || 'assertion failed') + ' (' + r.dur + 'ms)');
      }
      tmEl.textContent = r.dur + 'ms';
      document.getElementById('test-progress').style.width = (((++i) / TestEngine.suite.length) * 100) + '%';
      // 更新 KPI
      const pass = TestEngine.results.filter(r => r.status === 'passed').length;
      const fail = TestEngine.results.filter(r => r.status === 'failed').length;
      document.getElementById('kpi-pass').textContent = pass;
      document.getElementById('kpi-fail').textContent = fail;
    }
    const dur = Math.round(performance.now() - t0);
    document.getElementById('kpi-dur').textContent = dur + 'ms';
    const pass = TestEngine.results.filter(r => r.status === 'passed').length;
    const fail = TestEngine.results.filter(r => r.status === 'failed').length;
    const verdict = fail === 0 ? `<span class="tag ok">全部通過</span>` : `<span class="tag err">${fail} 個失敗</span>`;
    document.getElementById('final-result').innerHTML = `
      <div class="grid-3 mt-8">
        <div class="kpi ok"><div class="label">通過</div><div class="value">${pass}</div></div>
        <div class="kpi err"><div class="label">失敗</div><div class="value">${fail}</div></div>
        <div class="kpi warn"><div class="label">總耗時</div><div class="value">${dur}ms</div></div>
      </div>
      <div class="mt-12 center text-13">${verdict} · ${TestEngine.suite.length} 個測試案例</div>
    `;
    this._logLine('info', 'TestEngine: 結束 · ' + pass + ' pass / ' + fail + ' fail · ' + dur + 'ms');
    btn.disabled = false; btn.textContent = '▶ 重新執行';
  },
  async runOneGroup(group) {
    const fullSuite = TestEngine.suite.slice();
    TestEngine.suite = TestEngine.suite.filter(t => t.group === group);
    this.render();
    await this.runTests();
    TestEngine.suite = fullSuite;
  },

  async runMatrixE2E() {
    const rows = [
      { u: '未登入',       role: 'guest',        ann: 4, post: 401 },
      { u: 'principal',    role: 'sysadmin',     ann: 4, post: 201 },
      { u: 'teaching',     role: 'dept_officer', ann: 4, post: 201 },
      { u: 'student',      role: 'dept_officer', ann: 4, post: 201 },
      { u: 'general',      role: 'dept_officer', ann: 4, post: 201 },
      { u: 'counsel',      role: 'dept_officer', ann: 4, post: 201 },
      { u: 'it',           role: 'dept_officer', ann: 4, post: 201 },
      { u: 'teacher_lin',  role: 'teacher',      ann: 4, post: 403 },
      { u: 'parent_chen',  role: 'parent',       ann: 4, post: 403 },
      { u: 'student_wang', role: 'student',      ann: 4, post: 403 },
    ];
    const res = document.getElementById('e2e-result');
    res.innerHTML = '<div class="muted">執行中…</div>';
    let passCnt = 0, failCnt = 0, errs = [];
    for (const row of rows) {
      // 每個 row 各自重置 DB（POST 副作用不累積）
      DB.announcements = JSON.parse(JSON.stringify(DEMO_ANNOUNCEMENTS));
      DB.auditLog = [];
      let token = null, actualAnn = 0, actualPost = 0;
      if (row.u !== '未登入') {
        const login = await HttpClient.call('POST', '/api/auth/login', { username: row.u, password: 'School@2026' });
        token = login.body.data.token;
      }
      const ann = await HttpClient.call('GET', '/api/announcements', null, token);
      actualAnn = ann.body.data.length;
      const post = await HttpClient.call('POST', '/api/announcements', { title: 'matrix-e2e probe' }, token);
      actualPost = post.status;
      const annOk = actualAnn === row.ann;
      const postOk = actualPost === row.post;
      const ok = annOk && postOk;
      if (ok) passCnt++; else { failCnt++; errs.push(row.u + ': ann=' + actualAnn + ' (exp ' + row.ann + ') post=' + actualPost + ' (exp ' + row.post + ')'); }
      const annCell = document.getElementById('e2e-ann-' + row.u);
      const postCell = document.getElementById('e2e-post-' + row.u);
      const okCell = document.getElementById('e2e-ok-' + row.u);
      annCell.innerHTML = `<span class="tag ${annOk ? 'ok' : 'err'}">${actualAnn}</span>`;
      postCell.innerHTML = `<span class="tag ${postOk ? 'ok' : 'err'}">${actualPost}</span>`;
      okCell.innerHTML = ok ? '<span class="tag ok">PASS</span>' : '<span class="tag err">FAIL</span>';
    }
    res.innerHTML = `
      <div class="grid-3">
        <div class="kpi ok"><div class="label">通過</div><div class="value">${passCnt}</div></div>
        <div class="kpi err"><div class="label">失敗</div><div class="value">${failCnt}</div></div>
        <div class="kpi"><div class="label">總視角</div><div class="value">${rows.length}</div></div>
      </div>
      <div class="mt-12 center text-13">${failCnt === 0 ? '<span class="tag ok">✓ 全部 9+1 視角符合 C 方案 v4 矩陣</span>' : '<span class="tag err">✗ 失敗：' + errs.join('; ') + '</span>'}</div>
    `;
  },
};
