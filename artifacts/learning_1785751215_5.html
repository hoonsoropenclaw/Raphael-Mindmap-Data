<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Dynamic API Forensics Report</title>
<style>
:root { --bg:#07111f; --panel:#0d1b2d; --panel2:#10243d; --line:#25405f; --text:#e9f2ff; --muted:#91a7c2; --cyan:#5ee8ff; --green:#75f0b0; --amber:#ffd479; --red:#ff8f9d; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:radial-gradient(circle at 10% 0%,#153357 0,transparent 34%),linear-gradient(135deg,#07111f,#091827 55%,#06101b); color:var(--text); font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
main { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:52px 0 80px; }
header { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; margin-bottom:28px; }
.eyebrow { color:var(--cyan); text-transform:uppercase; letter-spacing:.18em; font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; }
h1 { margin:10px 0 8px; padding:6px 0; font-size:clamp(32px,6vw,64px); line-height:1.14; letter-spacing:-.055em; max-width:780px; }
.subtitle { color:var(--muted); max-width:760px; margin:0; }
.badge { border:1px solid #2a5c72; color:var(--green); background:#0b2530; border-radius:999px; padding:8px 13px; white-space:nowrap; font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
.meta { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:26px 0 34px; }
.stat { background:linear-gradient(180deg,rgba(20,45,73,.9),rgba(10,26,45,.9)); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 18px 45px rgba(0,0,0,.18); }
.stat strong { display:block; font-size:30px; letter-spacing:-.04em; }
.stat span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.1em; }
.toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin:0 0 14px; }
h2 { margin:0; font-size:20px; }
#target { color:var(--muted); font:12px ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; text-align:right; }
.grid { display:grid; gap:14px; }
.card { background:linear-gradient(135deg,rgba(16,36,61,.96),rgba(9,25,43,.96)); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:0 20px 52px rgba(0,0,0,.2); }
.card-head { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
.method { border-radius:8px; padding:5px 8px; background:#173d50; color:var(--cyan); font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
.endpoint { font:650 14px ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
.calls { color:var(--muted); white-space:nowrap; }
.chips { display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 0; }
.chip { border:1px solid #31516f; border-radius:999px; padding:4px 8px; color:#bfd2e8; font-size:12px; }
.chip.good { color:var(--green); border-color:#2f6e56; }
.chip.warn { color:var(--amber); border-color:#705d34; }
details { margin-top:14px; border-top:1px solid rgba(83,119,153,.3); padding-top:12px; }
summary { cursor:pointer; color:var(--cyan); }
pre { max-height:340px; overflow:auto; padding:14px; border-radius:12px; background:#07121f; color:#c7d7ea; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
.empty { color:var(--muted); text-align:center; padding:40px; }
footer { margin-top:28px; color:var(--muted); border-top:1px solid var(--line); padding-top:18px; font-size:12px; }
@media (max-width:760px) { header { grid-template-columns:1fr; } .meta { grid-template-columns:repeat(2,1fr); } .toolbar { align-items:flex-start; flex-direction:column; } #target { text-align:left; } .card-head { grid-template-columns:auto 1fr; } .calls { grid-column:1/-1; } }
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Playwright · network evidence</div><h1>Dynamic API<br>Forensics</h1><p class="subtitle">從瀏覽器實際 XHR / fetch 流量建立 endpoint interface map；敏感資料在寫檔前遮罩，單次觀察不冒充完整契約。</p></div><div class="badge">READ-ONLY TRACE</div></header>
<section class="meta" id="stats" aria-label="Capture statistics"></section>
<section><div class="toolbar"><h2>Endpoint inventory</h2><div id="target"></div></div><div class="grid" id="inventory"></div></section>
<footer id="footer"></footer>
</main>

<script>
"use strict";
const report = JSON.parse(document.getElementById("report-data").textContent);
const create = (tag, className, text) => { const node=document.createElement(tag); if(className) node.className=className; if(text!==undefined) node.textContent=String(text); return node; };
const summary = report.summary || {};
const stats = [["Requests",summary.total_requests||0],["API records",summary.api_records||0],["Endpoints",summary.unique_endpoints||0],["Failures",summary.failed_requests||0]];
const statsNode=document.getElementById("stats");
stats.forEach(([label,value])=>{ const box=create("div","stat"); box.append(create("strong","",value),create("span","",label)); statsNode.append(box); });
document.getElementById("target").textContent=report.target_url||"";
const inventory=document.getElementById("inventory");
(report.inventory||[]).forEach(item=>{
  const card=create("article","card"); card.dataset.endpointCard="true";
  const head=create("div","card-head");
  head.append(create("span","method",item.method),create("div","endpoint",item.endpoint),create("div","calls",`${item.calls} call${item.calls===1?"":"s"}`));
  card.append(head);
  const chips=create("div","chips");
  const kind=item.graphql_operation?`${item.api_kind} · ${item.graphql_operation}`:item.api_kind;
  chips.append(create("span","chip",kind),create("span",`chip ${item.evidence_level>1?"good":"warn"}`,`L${item.evidence_level} ${item.evidence_label}`));
  Object.entries(item.statuses||{}).forEach(([status,count])=>chips.append(create("span",`chip ${String(status).startsWith("2")?"good":"warn"}`,`${status} × ${count}`)));
  (item.query_parameters||[]).forEach(name=>chips.append(create("span","chip",`?${name}`)));
  card.append(chips);
  const details=create("details"); details.append(create("summary","","Schemas & sanitized samples"));
  const pre=create("pre"); pre.textContent=JSON.stringify({request_schema:item.request_schema,response_schema:item.response_schema,samples:item.samples},null,2); details.append(pre); card.append(details);
  inventory.append(card);
});
if(!(report.inventory||[]).length) inventory.append(create("div","empty","No dynamic API evidence matched this session."));
document.getElementById("footer").textContent=`Captured ${report.captured_at||""} · Evidence is observational and secrets are redacted before persistence.`;
</script>
</body>
</html>
