<!-- ═════════════════════════════════════════════════════════════
     Section 1: Next.js 14 App Router 路由表 + generateStaticParams
     ═════════════════════════════════════════════════════════════ -->
<script>
const ROUTE_TEMPLATES = [
  { pattern: '/', file: 'app/page.jsx', title: '首頁 Dashboard', segment: ['(home)'], dynamic: [], category: 'static', description: '設計系統總覽 + 即時 token 健康度' },
  { pattern: '/tokens', file: 'app/tokens/page.jsx', title: '設計 Token', segment: ['tokens'], dynamic: [], category: 'static', description: '4 種色彩、6 種模糊、5 種陰影、7 種動畫' },
  { pattern: '/components', file: 'app/components/page.jsx', title: '組件庫', segment: ['components'], dynamic: [], category: 'static', description: '12 個可用組件,所有組件皆為 Server Component 預設' },
  { pattern: '/components/[id]', file: 'app/components/[id]/page.jsx', title: '組件詳情', segment: ['components', '[id]'], dynamic: ['id'], category: 'dynamic', description: '動態路由 — 從 MDX 載入單一組件 API 文件' },
  { pattern: '/showcase', file: 'app/showcase/page.jsx', title: '案例展示', segment: ['showcase'], dynamic: [], category: 'static', description: '實際產品應用案例' },
  { pattern: '/showcase/[category]', file: 'app/showcase/[category]/page.jsx', title: '案例分類', segment: ['showcase', '[category]'], dynamic: ['category'], category: 'dynamic', description: '動態路由 — 篩選某個分類下的所有案例' },
  { pattern: '/docs', file: 'app/docs/page.jsx', title: '文件總覽', segment: ['docs'], dynamic: [], category: 'static', description: 'Getting Started、Migration、API' },
  { pattern: '/docs/[...slug]', file: 'app/docs/[...slug]/page.jsx', title: '巢狀文件', segment: ['docs', '[...slug]'], dynamic: ['...slug'], category: 'catch-all', description: 'Catch-all 動態路由 — 支援多層路徑如 /docs/guides/auth/jwt' },
  { pattern: '/playground', file: 'app/playground/page.jsx', title: '即時 Playground', segment: ['playground'], dynamic: [], category: 'interactive', description: '即時調整 token 預覽 + 程式碼生成' },
  { pattern: '/audit', file: 'app/audit/page.jsx', title: '審計日誌', segment: ['audit'], dynamic: [], category: 'system', description: 'RBAC 拒絕事件 + 路由切換紀錄', requiresRole: 'admin' },
];

function generateStaticParams() {
  const out = [];
  for (const tmpl of ROUTE_TEMPLATES) {
    if (tmpl.dynamic.length === 0) continue;
    if (tmpl.pattern === '/components/[id]') {
      for (const c of COMPONENTS) {
        out.push({ pattern: tmpl.pattern, params: { id: c.id }, reason: 'COMPONENTS[*].id' });
      }
    } else if (tmpl.pattern === '/showcase/[category]') {
      for (const cat of SHOWCASE_CATEGORIES) {
        out.push({ pattern: tmpl.pattern, params: { category: cat.slug }, reason: 'CATEGORIES[*].slug' });
      }
    } else if (tmpl.dynamic[0].startsWith('...')) {
      for (const doc of DOCS) {
        const segs = doc.slug.split('/');
        out.push({ pattern: tmpl.pattern, params: { slug: segs }, reason: 'DOCS[*].slug' });
      }
    }
  }
  return out;
}

window.ROUTE_TEMPLATES = ROUTE_TEMPLATES;
window.generateStaticParams = generateStaticParams;
</script>

     Section 3: Next.js 14 App Router 模擬層
     ═════════════════════════════════════════════════════════════ -->
<script>
function navigate(path, opts = {}) {
  if (typeof path !== 'string') return;
  if (!path.startsWith('/')) path = '/' + path;
  if (opts.replace) {
    const url = new URL(window.location.href);
    url.hash = '#' + path;
    window.history.replaceState(null, '', url);
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  } else {
    window.location.hash = '#' + path;
  }
  if (opts.scroll !== false) {
    setTimeout(() => {
      const main = document.getElementById('main-scroll');
      if (main) main.scrollTop = 0;
      else window.scrollTo(0, 0);
    }, 0);
  }
  if (window.__auditLog && opts.audit !== false) {
    window.__auditLog.push({ ts: Date.now(), event: 'navigate', path, from: window.__prevPath || null });
    window.__prevPath = path;
  }
}
window.navigate = navigate;

function useRouter() {
  const [path, setPath] = React.useState(window.location.hash.replace(/^#/, '') || '/');
  React.useEffect(() => {
    const onHash = () => setPath(window.location.hash.replace(/^#/, '') || '/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const cleanPath = path.split('?')[0].split('#')[0] || '/';
  const queryStr = path.includes('?') ? path.split('?')[1].split('#')[0] : '';
  const query = {};
  if (queryStr) {
    queryStr.split('&').forEach(kv => {
      const [k, v] = kv.split('=');
      if (k) query[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
  }
  return {
    pathname: cleanPath,
    asPath: path,
    query,
    push: (p, opts) => navigate(p, opts),
    replace: (p, opts) => navigate(p, Object.assign({}, opts, { replace: true })),
    back: () => window.history.back(),
  };
}

function useParams(path) {
  if (!path) return {};
  const ordered = [...ROUTE_TEMPLATES].sort((a, b) =>
    (b.dynamic && b.dynamic.length || 0) - (a.dynamic && a.dynamic.length || 0)
  );
  for (const tmpl of ordered) {
    if (!tmpl.dynamic || tmpl.dynamic.length === 0) continue;
    const regexStr = '^' + tmpl.pattern
      .replace(/\[\.\.\.(\w+)\]/g, '(?:.+)')
      .replace(/\[(\w+)\]/g, '([^/]+)') + '$';
    const m = path.match(new RegExp(regexStr));
    if (m) {
      const params = {};
      let idx = 0;
      tmpl.dynamic.forEach((key) => {
        if (key.startsWith('...')) {
          const paramName = key.slice(3);
          const fixedSegs = tmpl.pattern.split('/').filter(s => s && !s.startsWith('[')).length;
          const parts = path.split('/').slice(fixedSegs + 1);
          params[paramName] = parts;
        } else {
          params[key] = decodeURIComponent(m[++idx] || '');
        }
      });
      return params;
    }
  }
  return {};
}

function useSearchParams() {
  const router = useRouter();
  return router.query;
}
</script>

function guessType(p) {
  if (/size|width|height|max/.test(p)) return 'string | number';
  if (/icon|loading|open|onClose|disabled/.test(p)) return 'boolean';
  if (/variant|type|placement|orientation/.test(p)) return 'string (union)';
  if (/items|data|children/.test(p)) return 'array | ReactNode';
  if (/on[A-Z]/.test(p)) return '(event) => void';
  return 'string';
}
function sampleValue(p) {
  if (/size/.test(p)) return '"md"';
  if (/icon|loading|open|disabled/.test(p)) return '{true}';
  if (/variant|placement|orientation/.test(p)) return '"primary"';
  if (/on[A-Z]/.test(p)) return '{handleEvent}';
  return '"value"';
}

<!-- ═════════════════════════════════════════════════════════════
     Section 6: App Shell + Router dispatch
     ═════════════════════════════════════════════════════════════ -->
<script>
function App() {
  const router = useRouter();
  const params = useParams(router.pathname);
  const search = useSearchParams();
  const path = router.pathname;

  const [notFound, setNotFound] = React.useState(false);
  React.useEffect(() => {
    window.__notFoundBoundary = () => setNotFound(true);
    return () => { window.__notFoundBoundary = null; };
  }, []);
  React.useEffect(() => { setNotFound(false); }, [path]);

  const user = window.__currentUser || { role: 'admin' };
  const matchedTemplate = ROUTE_TEMPLATES.find(t => t.pattern === path);
  if (matchedTemplate && matchedTemplate.requiresRole && user.role !== matchedTemplate.requiresRole) {
    if (window.__auditLog) window.__auditLog.push({ ts: Date.now(), event: 'denied', path: path, reason: 'RBAC: requires ' + matchedTemplate.requiresRole });
    return h(Shell, { currentPath: path },
      h('div', { className: 'fade-in' },
        h('div', { className: 'glass-strong rounded-2xl p-12 text-center' },
          h('i', { className: 'ri-lock-2-line text-6xl text-deny-500 mb-4 block' }),
          h('h1', { className: 'text-2xl font-bold mb-2' }, '403 · RBAC 拒絕'),
          h('p', { className: 'text-slate-600 mb-1' }, '此路徑需要 '),
          h('code', { className: 'px-2 py-1 rounded bg-slate-100 mono-cell text-sm' }, "role = '" + matchedTemplate.requiresRole + "'"),
          h('p', { className: 'text-slate-600 mt-1' }, '目前角色: '),
          h('code', { className: 'px-2 py-1 rounded bg-slate-100 mono-cell text-sm' }, user.role || 'guest'),
          h('br'),
          h('button', { onClick: () => navigate('/'), className: 'mt-5 px-5 py-2.5 rounded-xl bg-brand-600 text-white font-semibold border-0' }, '返回首頁')
        )
      )
    );
  }

  const [loading, setLoading] = React.useState(false);
  React.useEffect(() => {
    setLoading(true);
    const t = setTimeout(() => setLoading(false), 150);
    return () => clearTimeout(t);
  }, [path]);

  let page;
  if (notFound) {
    page = h(NotFoundPage, { path: path });
  } else if (loading) {
    page = h('div', { className: 'flex flex-col items-center justify-center py-32 gap-3' },
      h('div', { className: 'suspense-spinner' }),
      h('p', { className: 'text-sm text-slate-500' }, 'RSC streaming...')
    );
  } else if (path === '/' || path === '') {
    page = h(DashboardPage, { params: params, search: search });
  } else if (path === '/tokens') {
    page = h(TokensPage, { params: params, search: search });
  } else if (path === '/components') {
    page = h(ComponentsListPage, { params: params, search: search });
  } else if (path === '/showcase') {
    page = h(ShowcaseListPage, { params: params, search: search });
  } else if (path === '/docs') {
    page = h(DocsListPage, { params: params, search: search });
  } else if (path === '/playground') {
    page = h(PlaygroundPage, { params: params, search: search });
  } else if (path === '/audit') {
    page = h(AuditPage, { params: params, search: search });
  } else if (path.startsWith('/components/')) {
    page = h(ComponentDetailPage, { params: params, search: search });
  } else if (path.startsWith('/showcase/')) {
    page = h(ShowcaseCategoryPage, { params: params, search: search });
  } else if (path.startsWith('/docs/')) {
    page = h(DocDetailPage, { params: params, search: search });
  } else {
    page = h(NotFoundPage, { path: path });
  }

  return h(Shell, { currentPath: path }, page);
}

function Shell({ currentPath, children }) {
  const [theme, setTheme] = React.useState('light');
  const breadcrumb = buildBreadcrumb(currentPath);
  return h('div', { className: 'flex min-h-screen relative z-10' },
    h(Sidebar, { currentPath: currentPath, onNav: navigate }),
    h('div', { className: 'flex-1 flex flex-col min-w-0' },
      h(Topbar, {
        breadcrumb: breadcrumb, theme: theme, onThemeToggle: () => setTheme(t => t === 'light' ? 'dark' : 'light'),
        onNav: navigate,
      }),
      h('main', { id: 'main-scroll', className: 'flex-1 p-6 md:p-8 overflow-y-auto' }, children)
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));

if (!window.__auditLog) {
  window.__auditLog = [];
  window.__currentUser = { role: 'admin', name: 'demo' };
}
</script>
