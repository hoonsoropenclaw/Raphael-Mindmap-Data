<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>服務品質儀表板 — 設計 token 重構（BEFORE）</title>
<!--
  BEFORE 版：典型的「能用就好」行政儀表板
  問題清單（這是今天的學習對象）：
  1. 硬編碼 hex，沒有設計 token；換主題要逐處改
  2. 色階用 sRGB 手調，灰階相鄰級距視覺不均勻
  3. 用純紅 #ef4444 / 純綠 #22c55e / 純藍 #3b82f6 原色
  4. 沒有 cascade layers，靠 !important 與 specificity 硬幹
  5. 靠 media query 硬斷點 → 同一元件在側欄會爆版
  6. 陰影堆疊（box-shadow 四層）表示層次，暗色不可行
-->
<style>
  /* ==== 硬編碼色票，無 token ==== */
  :root {
    --not-a-token: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f0f2f5;
    color: #1f2328;
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    background: #2c3e50;
    color: #ecf0f1;
    padding: 20px 12px;
    flex-shrink: 0;
  }
  .sidebar h1 { font-size: 15px; margin: 0 0 20px 8px; font-weight: 700; }
  .nav-item {
    padding: 9px 10px; margin-bottom: 2px; border-radius: 4px;
    font-size: 13px; cursor: pointer;
  }
  .nav-item.active { background: #3498db; color: white; font-weight: 600; }
  .main { flex: 1; padding: 20px; min-width: 0; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .toolbar h2 { font-size: 20px; margin: 0; font-weight: 700; }
  .btn {
    background: #3b82f6; color: white; border: none;
    padding: 7px 14px; border-radius: 4px; font-size: 13px; cursor: pointer;
  }
  /* 硬斷點：視窗寬就以為主欄夠寬，側欄塞進去會爆版 */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi-card {
    background: white;
    border-radius: 8px;
    padding: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  }
  .kpi-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .kpi-value { font-size: 26px; font-weight: 700; }
  .kpi-delta { font-size: 12px; margin-top: 4px; }
  .up { color: #22c55e; }     /* 純綠 */
  .down { color: #ef4444; }   /* 純紅 */
  .panel {
    background: white; border-radius: 8px; padding: 16px; margin-top: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e5e7eb; }
  td.num { text-align: right; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-ok { background: #dcfce7; color: #16a34a; }
  .badge-warn { background: #fef3c7; color: #d97706; }
  .badge-bad { background: #fee2e2; color: #dc2626; }
  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>服務品質儀表板</h1>
    <div class="nav-item active">總覽</div>
    <div class="nav-item">案件量</div>
    <div class="nav-item">滿意度</div>
    <div class="nav-item">人力配置</div>
    <div class="nav-item">系統LOG</div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <h2>113 年度第 2 季服務品質總覽</h2>
      <button class="btn">匯出報表</button>
    </div>

    <!-- 這 4 張卡在右側 320px 摘要欄會直接爆版（沒有 container query） -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">案件總數</div>
        <div class="kpi-value">4,812</div>
        <div class="kpi-delta up">▲ 6.2% 較上季</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">平均處理天數</div>
        <div class="kpi-value">3.4</div>
        <div class="kpi-delta up">▼ 0.6 天（改善）</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">滿意度</div>
        <div class="kpi-value">87.2%</div>
        <div class="kpi-delta down">▼ 1.8 百分點</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">超時案件</div>
        <div class="kpi-value">43</div>
        <div class="kpi-delta down">▲ 12 件</div>
      </div>
    </section>

    <section class="panel">
      <h3 style="margin:0 0 12px;font-size:15px;font-weight:700;">各處室案件處理概況</h3>
      <table>
        <thead>
          <tr><th>處室</th><th>案件數</th><th>平均天數</th><th>超時率</th><th>狀態</th></tr>
        </thead>
        <tbody>
          <tr><td>人事室</td><td class="num">1,204</td><td class="num">2.8</td><td class="num">0.8%</td><td><span class="badge badge-ok">達標</span></td></tr>
          <tr><td>總務室</td><td class="num">986</td><td class="num">3.9</td><td class="num">2.1%</td><td><span class="badge badge-ok">達標</span></td></tr>
          <tr><td>學務組</td><td class="num">842</td><td class="num">5.4</td><td class="num">4.7%</td><td><span class="badge badge-warn">觀察</span></td></tr>
          <tr><td>總務處櫃台</td><td class="num">711</td><td class="num">4.2</td><td class="num">3.3%</td><td><span class="badge badge-ok">達標</span></td></tr>
          <tr><td>資訊維運</td><td class="num">634</td><td class="num">6.8</td><td class="num">7.9%</td><td><span class="badge badge-bad">超標</span></td></tr>
          <tr><td>財產管理</td><td class="num">435</td><td class="num">3.1</td><td class="num">1.4%</td><td><span class="badge badge-ok">達標</span></td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
</body>
</html>
