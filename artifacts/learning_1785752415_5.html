<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next.js RBAC 管理後台 · 角色權限控制展示</title>
<style>
  /* ===========================================================
     設計目標：Next.js 風格 (App Router + Server Components 抽象) +
     玻璃 UI + 暗色 + 冷暖對比。對齊 tailwind/shadcn 視覺語言但全自寫。
     =========================================================== */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg-0: #09090b;
    --bg-1: #0c0d12;
    --bg-2: #111319;
    --bg-3: #181a22;
    --line: #23262f;
    --line-2: #353945;
    --text-0: #fafafa;
    --text-1: #d4d4d8;
    --text-2: #a1a1aa;
    --text-3: #71717a;

    --accent: #6366f1;        /* indigo-500 - admin */
    --accent-2: #22d3ee;      /* cyan-400 - manager */
    --accent-3: #f59e0b;      /* amber-500 - viewer */
    --accent-glow: rgba(99,102,241,.35);

    --good: #10b981;
    --warn: #f59e0b;
    --bad:  #ef4444;

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 18px;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow:    0 4px 12px rgba(0,0,0,.4);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.5);

    --header-h: 60px;
    --sidebar-w: 260px;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99,102,241,.12), transparent 70%),
                radial-gradient(ellipse 60% 50% at 100% 100%, rgba(34,211,238,.08), transparent 70%),
                var(--bg-0);
    background-attachment: fixed;
    color: var(--text-0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--accent-glow); color: var(--text-0); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4d59; }

  /* ---------- 共用元件 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px;
    border-radius: var(--r-sm);
    font-size: 13px; font-weight: 500;
    cursor: pointer; user-select: none;
    border: 1px solid transparent;
    background: var(--bg-3); color: var(--text-0);
    transition: all .15s ease;
  }
  .btn:hover { background: var(--line); border-color: var(--line-2); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #4f52d6; border-color: #4f52d6; box-shadow: 0 0 0 3px var(--accent-glow); }
  .btn-danger { background: rgba(239,68,68,.12); color: #fca5a5; border-color: rgba(239,68,68,.35); }
  .btn-danger:hover { background: rgba(239,68,68,.22); border-color: var(--bad); }
  .btn-ghost { background: transparent; }
  .btn-ghost:hover { background: var(--bg-3); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; pointer-events: none; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    height: 22px; padding: 0 9px;
    border-radius: 99px; font-size: 11px; font-weight: 600;
    background: var(--bg-3); color: var(--text-2);
    border: 1px solid var(--line);
  }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip-good { color: var(--good); background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); }
  .chip-warn { color: var(--warn); background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); }
  .chip-bad  { color: var(--bad);  background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.3); }
  .chip-info { color: var(--accent-2); background: rgba(34,211,238,.1); border-color: rgba(34,211,238,.3); }
  .chip-accent { color: var(--accent); background: rgba(99,102,241,.12); border-color: rgba(99,102,241,.3); }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.02), transparent),
                var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px;
    transition: border-color .2s ease;
  }
  .card:hover { border-color: var(--line-2); }
  .card-title {
    font-size: 12px; font-weight: 600; color: var(--text-2);
    text-transform: uppercase; letter-spacing: .8px;
    margin: 0 0 12px;
  }
  .card-value {
    font-size: 26px; font-weight: 700; color: var(--text-0);
    font-feature-settings: "tnum" 1;
  }
  .card-trend {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 6px; font-size: 12px; color: var(--good);
  }
  .card-trend.down { color: var(--bad); }

  .input {
    width: 100%; height: 38px;
    padding: 0 12px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--text-0); font-size: 13px;
    font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input::placeholder { color: var(--text-3); }
  .input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    font-size: 13px;
  }
  thead th {
    text-align: left;
    padding: 11px 14px;
    font-size: 11px; font-weight: 600;
    color: var(--text-2); text-transform: uppercase; letter-spacing: .6px;
    background: var(--bg-1);
    border-bottom: 1px solid var(--line);
  }
  thead th:first-child { border-top-left-radius: var(--r-md); }
  thead th:last-child  { border-top-right-radius: var(--r-md); }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--text-1);
  }
  tbody tr:hover td { background: rgba(255,255,255,.02); }
  tbody tr:last-child td { border-bottom: none; }

  .kbd {
    display: inline-block;
    padding: 1px 6px; font-size: 11px; font-family: ui-monospace, monospace;
    background: var(--bg-3); color: var(--text-2);
    border: 1px solid var(--line-2);
    border-bottom-width: 2px;
    border-radius: 4px;
  }

  /* ===========================================================
     登入頁
     =========================================================== */
  #login-view {
    height: 100vh; display: grid; place-items: center;
    padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 420px;
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)),
                var(--bg-2);
    border: 1px solid var(--line-2);
    border-radius: var(--r-xl);
    padding: 32px;
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.03) inset;
    backdrop-filter: blur(20px);
    animation: rise .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(20px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .login-logo {
    width: 48px; height: 48px;
    border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 22px; color: #fff;
    margin-bottom: 18px;
    box-shadow: 0 8px 20px var(--accent-glow);
  }
  .login-title {
    font-size: 22px; font-weight: 700; margin: 0 0 4px;
  }
  .login-sub {
    font-size: 13px; color: var(--text-2); margin: 0 0 24px;
  }
  .login-field { margin-bottom: 14px; }
  .login-field label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-2); margin-bottom: 6px;
  }
  .login-quick {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-top: 20px;
  }
  .quick-role {
    padding: 10px 8px;
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-sm);
    cursor: pointer; text-align: center;
    transition: all .15s ease;
  }
  .quick-role:hover { border-color: var(--accent); transform: translateY(-1px); }
  .quick-role-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .quick-role-name.role-admin   { color: var(--accent); }
  .quick-role-name.role-manager { color: var(--accent-2); }
  .quick-role-name.role-viewer  { color: var(--accent-3); }
  .quick-role-desc { font-size: 10.5px; color: var(--text-3); }

  .login-error {
    margin-top: 12px; padding: 10px 12px;
    background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
    border-radius: var(--r-sm);
    font-size: 12px; color: #fca5a5;
    display: none;
  }
  .login-error.show { display: block; animation: shake .3s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ===========================================================
     後台 layout
     =========================================================== */
  #app-view { display: none; height: 100vh; }
  #app-view.active { display: grid; grid-template-columns: var(--sidebar-w) 1fr; }

  /* --- sidebar --- */
  aside {
    background: linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--bg-1);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .brand {
    height: var(--header-h);
    display: flex; align-items: center; gap: 10px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
  }
  .brand-logo {
    width: 32px; height: 32px;
    border-radius: var(--r-sm);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 800; font-size: 15px; color: #fff;
    box-shadow: 0 4px 12px var(--accent-glow);
  }
  .brand-text { display: flex; flex-direction: column; }
  .brand-name { font-weight: 700; font-size: 14px; }
  .brand-sub  { font-size: 10.5px; color: var(--text-3); }

  nav.menu { padding: 14px 12px; flex: 1; overflow-y: auto; }
  .menu-group { margin-bottom: 18px; }
  .menu-group-label {
    padding: 0 10px 8px;
    font-size: 10.5px; font-weight: 600;
    color: var(--text-3); text-transform: uppercase; letter-spacing: .8px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; margin-bottom: 2px;
    border-radius: var(--r-sm);
    color: var(--text-2); font-size: 13px; font-weight: 500;
    cursor: pointer; user-select: none;
    transition: all .12s ease;
    position: relative;
  }
  .menu-item:hover { background: var(--bg-3); color: var(--text-0); }
  .menu-item.active {
    background: rgba(99,102,241,.12); color: var(--text-0);
  }
  .menu-item.active::before {
    content: ''; position: absolute;
    left: -12px; top: 8px; bottom: 8px; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .menu-item.locked {
    opacity: .45; cursor: not-allowed;
  }
  .menu-item.locked:hover {
    background: transparent; color: var(--text-2);
  }
  .menu-icon {
    width: 18px; height: 18px; display: grid; place-items: center;
    font-size: 14px;
  }
  .menu-label { flex: 1; }
  .menu-lock {
    font-size: 10px; color: var(--text-3);
  }

  .user-card {
    border-top: 1px solid var(--line);
    padding: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px; color: #fff;
    flex-shrink: 0;
  }
  .avatar.role-admin   { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  .avatar.role-manager { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
  .avatar.role-viewer  { background: linear-gradient(135deg, #f59e0b, #f97316); }
  .user-info { flex: 1; min-width: 0; }
  .user-name {
    font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .user-role {
    font-size: 10.5px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: .5px;
  }

  /* --- main --- */
  main {
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .topbar {
    height: var(--header-h);
    display: flex; align-items: center; gap: 12px;
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
    background: rgba(12,13,18,.6);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 10;
  }
  .breadcrumbs {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-2);
  }
  .breadcrumbs .crumb-current { color: var(--text-0); font-weight: 600; }
  .topbar-spacer { flex: 1; }
  .topbar-search {
    position: relative; width: 280px;
  }
  .topbar-search input {
    height: 34px; padding: 0 14px 0 36px;
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-sm); color: var(--text-0); font-size: 13px;
    width: 100%;
    transition: border-color .15s ease;
  }
  .topbar-search input:focus { outline: none; border-color: var(--accent); }
  .topbar-search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-3); font-size: 13px;
  }

  .content { padding: 28px; flex: 1; }

  /* ===========================================================
     Dashboard
     =========================================================== */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-bottom: 28px;
  }
  @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }

  .panels {
    display: grid; grid-template-columns: 1.4fr 1fr;
    gap: 20px;
  }
  @media (max-width: 1100px) { .panels { grid-template-columns: 1fr; } }

  .panel-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 0 16px;
  }
  .panel-title h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .panel-title .panel-action { font-size: 12px; color: var(--text-2); }

  .activity-list { list-style: none; padding: 0; margin: 0; }
  .activity-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-icon {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    background: var(--bg-3);
    display: grid; place-items: center;
    flex-shrink: 0; font-size: 13px;
  }
  .activity-icon.login   { background: rgba(99,102,241,.15);  color: var(--accent); }
  .activity-icon.create  { background: rgba(16,185,129,.15);  color: var(--good); }
  .activity-icon.delete  { background: rgba(239,68,68,.15);   color: var(--bad); }
  .activity-icon.warning { background: rgba(245,158,11,.15);  color: var(--warn); }
  .activity-content { flex: 1; min-width: 0; }
  .activity-text {
    font-size: 13px; color: var(--text-1);
    line-height: 1.45;
  }
  .activity-text strong { color: var(--text-0); font-weight: 600; }
  .activity-time {
    font-size: 11px; color: var(--text-3); margin-top: 3px;
  }

  /* ===========================================================
     權限矩陣
     =========================================================== */
  .matrix-wrap { overflow-x: auto; }
  .matrix { width: 100%; }
  .matrix th, .matrix td {
    text-align: center; padding: 12px 8px;
  }
  .matrix th:first-child, .matrix td:first-child {
    text-align: left; padding-left: 16px;
  }
  .matrix .row-resource {
    font-weight: 600; color: var(--text-0);
  }
  .matrix .row-desc {
    font-size: 11px; color: var(--text-3); font-weight: 400;
  }
  .perm-toggle {
    width: 30px; height: 18px;
    background: var(--bg-3);
    border-radius: 99px;
    border: 1px solid var(--line-2);
    position: relative; cursor: pointer;
    transition: all .15s ease;
    display: inline-block;
  }
  .perm-toggle::after {
    content: ''; position: absolute;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text-3);
    top: 2px; left: 2px;
    transition: all .15s ease;
  }
  .perm-toggle.on { background: var(--accent); border-color: var(--accent); }
  .perm-toggle.on::after { background: #fff; left: 14px; }
  .perm-toggle[disabled] { opacity: .35; cursor: not-allowed; }
  .matrix.editing .perm-toggle:not([disabled]):hover { box-shadow: 0 0 0 4px var(--accent-glow); }

  /* ===========================================================
     拒絕存取遮罩
     =========================================================== */
  .denied {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 24px; text-align: center;
  }
  .denied-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(239,68,68,.1);
    border: 2px solid rgba(239,68,68,.3);
    display: grid; place-items: center;
    font-size: 36px; color: var(--bad);
    margin-bottom: 20px;
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.3); }
    50%      { box-shadow: 0 0 0 14px rgba(239,68,68,0); }
  }
  .denied-title { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
  .denied-desc { font-size: 14px; color: var(--text-2); max-width: 480px; margin: 0 auto 20px; }
  .denied-needed {
    background: var(--bg-1); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 12px 16px;
    display: inline-block; font-size: 12px;
    color: var(--text-1); margin-bottom: 20px;
  }
  .denied-needed code {
    background: var(--bg-3); padding: 1px 6px; border-radius: 3px;
    font-family: ui-monospace, monospace; color: var(--accent);
  }

  /* ===========================================================
     Modal
     =========================================================== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
    animation: fade .15s ease;
  }
  .modal-backdrop.show { display: flex; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    border-radius: var(--r-lg);
    padding: 24px;
    width: 100%; max-width: 480px;
    box-shadow: var(--shadow-lg);
    animation: pop .2s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-title { font-size: 16px; font-weight: 600; margin: 0; }
  .modal-close {
    background: transparent; border: none; color: var(--text-2);
    cursor: pointer; font-size: 20px; line-height: 1;
    width: 28px; height: 28px; border-radius: var(--r-sm);
  }
  .modal-close:hover { background: var(--bg-3); color: var(--text-0); }
  .modal-body { font-size: 13px; color: var(--text-1); margin-bottom: 16px; }
  .modal-form-row { margin-bottom: 12px; }
  .modal-form-row label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-2); margin-bottom: 5px;
  }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; }

  /* ===========================================================
     Toast
     =========================================================== */
  #toast-container {
    position: fixed; bottom: 24px; right: 24px;
    z-index: 200;
    display: flex; flex-direction: column-reverse; gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-3);
    border: 1px solid var(--line-2);
    border-radius: var(--r-md);
    padding: 12px 18px;
    min-width: 260px; max-width: 380px;
    box-shadow: var(--shadow-lg);
    font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    animation: slideIn .25s ease;
    pointer-events: auto;
  }
  .toast.success { border-color: rgba(16,185,129,.4); }
  .toast.error   { border-color: rgba(239,68,68,.4); }
  .toast.info    { border-color: rgba(99,102,241,.4); }
  .toast-icon { font-size: 16px; }
  .toast.success .toast-icon { color: var(--good); }
  .toast.error   .toast-icon { color: var(--bad); }
  .toast.info    .toast-icon { color: var(--accent); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ===========================================================
     響應式
     =========================================================== */
  @media (max-width: 800px) {
    :root { --sidebar-w: 0px; }
    #app-view.active { grid-template-columns: 1fr; }

<div id="toast-container"></div>

<script>
/* ============================================================
   RBAC Core Engine
   - 模擬 Next.js App Router 的 server-side 權限檢查
   - 在 production 這些邏輯應放在 middleware.ts / API route handler
   ============================================================ */

/** -------- 角色定義 -------- */
const ROLES = {
  admin: {
    id: 'admin',
    label: '管理員',
    color: 'admin',
    desc: '完整存取所有資源 (CRUD + 系統管理)',
    inherits: ['manager', 'viewer'],
  },
  manager: {
    id: 'manager',
    label: '業務經理',
    color: 'manager',
    desc: '管理使用者/文章/財務，唯獨不能動角色矩陣',
    inherits: ['viewer'],
  },
  viewer: {
    id: 'viewer',
    label: '檢視者',
    color: 'viewer',
    desc: '唯讀所有資源',
    inherits: [],
  },
};

/** -------- 資源 / 操作 -------- */
const RESOURCES = {
  users:    { label: '使用者',     icon: '👤', desc: '管理使用者帳號' },
  posts:    { label: '文章',       icon: '📄', desc: 'CMS 文章內容' },
  finance:  { label: '財務記錄',   icon: '💰', desc: '敏感財務資料' },
  settings: { label: '系統設定',   icon: '⚙', desc: '全域設定' },
  roles:    { label: '角色權限',   icon: '🔐', desc: 'RBAC 矩陣' },
  audit:    { label: '審計日誌',   icon: '📜', desc: '操作日誌' },
};
const ACTIONS = ['read', 'create', 'update', 'delete'];

/** -------- 權限矩陣 (resource × role × action) -------- */
const PERMISSIONS = {
  users: {
    admin:   { read: true,  create: true,  update: true,  delete: true  },
    manager: { read: true,  create: true,  update: true,  delete: false },
    viewer:  { read: true,  create: false, update: false, delete: false },
  },
  posts: {
    admin:   { read: true,  create: true,  update: true,  delete: true  },
    manager: { read: true,  create: true,  update: true,  delete: true  },
    viewer:  { read: true,  create: false, update: false, delete: false },
  },
  finance: {
    admin:   { read: true,  create: true,  update: true,  delete: true  },
    manager: { read: true,  create: true,  update: false, delete: false },
    viewer:  { read: true,  create: false, update: false, delete: false },
  },
  settings: {
    admin:   { read: true,  create: true,  update: true,  delete: true  },
    manager: { read: true,  create: false, update: false, delete: false },
    viewer:  { read: true,  create: false, update: false, delete: false },
  },
  roles: {
    admin:   { read: true,  create: true,  update: true,  delete: true  },
    manager: { read: true,  create: false, update: false, delete: false },
    viewer:  { read: true,  create: false, update: false, delete: false },
  },
  audit: {
    admin:   { read: true,  create: false, update: false, delete: false },
    manager: { read: true,  create: false, update: false, delete: false },
    viewer:  { read: true,  create: false, update: false, delete: false },
  },
};

/** -------- Demo 使用者 -------- */
const DEMO_USERS = {
  'admin@nextjs.local':   { id: 'u1', name: '王小明', role: 'admin',   email: 'admin@nextjs.local' },
  'manager@nextjs.local': { id: 'u2', name: '李大仁', role: 'manager', email: 'manager@nextjs.local' },
  'viewer@nextjs.local':  { id: 'u3', name: '陳小華', role: 'viewer',  email: 'viewer@nextjs.local' },
};

/** -------- Session state (LocalStorage persistence) -------- */
const SESSION_KEY = 'rbac-demo-session';

const Session = {
  current: null,
  load() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) this.current = JSON.parse(raw);
    } catch (e) { this.current = null; }
  },
  set(user) {
    this.current = user;
    localStorage.setItem(SESSION_KEY, JSON.stringify(user));
  },
  clear() {
    this.current = null;
    localStorage.removeItem(SESSION_KEY);
  },
};

/** -------- Audit log (in-memory) -------- */
const Audit = {
  entries: [],
  log(entry) {
    const record = {
      ts: new Date().toISOString(),
      user: Session.current ? Session.current.name : 'anonymous',
      role: Session.current ? Session.current.role : '-',
      ...entry,
    };
    this.entries.unshift(record);
    if (this.entries.length > 100) this.entries.pop();
    // 把拒絕事件特別標記
    if (entry.allowed === false) {
      console.warn('[AUDIT-DENY]', record);
    }
  },
  getAll() { return this.entries; },
};

/** -------- Core permission check -------- */
function can(user, action, resource) {
  if (!user) return false;
  const role = PERMISSIONS[resource]?.[user.role];
  if (!role) return false;
  if (role[action]) return true;
  // 繼承機制：admin → manager → viewer
  if (ROLES[user.role]?.inherits) {
    for (const inheritedRole of ROLES[user.role].inherits) {
      const inherited = PERMISSIONS[resource]?.[inheritedRole];
      if (inherited && inherited[action]) return true;
    }
  }
  return false;
}

/** -------- 路由守衛 (Route Guard) -------- */
const ROUTES = ['dashboard', 'users', 'posts', 'finance', 'settings', 'roles', 'audit'];
const ROUTE_REQUIRED_PERMS = {
  dashboard: { read: 'dashboard' },                         // 任何登入者都可看
  users:     { read: 'users' },
  posts:     { read: 'posts' },
  finance:   { read: 'finance' },
  settings:  { read: 'settings' },
  roles:     { read: 'roles' },
  audit:     { read: 'audit' },
};

function canAccessRoute(user, route) {
  if (!user) return false;
  if (route === 'dashboard') return true;
  const required = ROUTE_REQUIRED_PERMS[route];
  if (!required) return false;
  return can(user, 'read', required.read);
}

/* ============================================================
   UI 控制器
   ============================================================ */

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function toast(text, kind='info') {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  const icon = kind === 'success' ? '✓' : kind === 'error' ? '✕' : 'ⓘ';
  t.innerHTML = `<span class="toast-icon">${icon}</span><span>${text}</span>`;
  $('#toast-container').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(20px)'; t.style.transition='all .2s'; }, 2400);
  setTimeout(() => t.remove(), 2700);
}

function initialsOf(name) {
  return (name || '?').slice(0, 1).toUpperCase();
}

/* ============================================================
   登入流程
   ============================================================ */
function showLogin() {
  $('#login-view').style.display = 'grid';
  $('#app-view').classList.remove('active');
}
function showApp() {
  $('#login-view').style.display = 'none';
  $('#app-view').classList.add('active');
  renderUserCard();
  applyMenuGating();
  navigate('dashboard');
}

function handleLogin(email) {
  email = email.trim().toLowerCase();
  const user = DEMO_USERS[email];
  if (!user) {
    const err = $('#login-error');
    err.textContent = `找不到使用者 "${email}"。請用下方三個示範帳號之一。`;
    err.classList.add('show');
    Audit.log({ action: 'login.attempt', target: email, allowed: false, reason: 'user_not_found' });
    return;
  }
  Session.set(user);
  Audit.log({ action: 'login.success', target: email, allowed: true });
  toast(`${user.name} 登入成功 (${ROLES[user.role].label})`, 'success');
  showApp();
}

$('#login-form').addEventListener('submit', e => {
  e.preventDefault();
  const email = $('#login-email').value;
  handleLogin(email);
});
$$('.quick-role').forEach(el => {
  el.addEventListener('click', () => {
    const role = el.dataset.quick;
    const email = `${role}@nextjs.local`;
    $('#login-email').value = email;
    handleLogin(email);
  });
});

/* ============================================================
   登出
   ============================================================ */
$('#logout-btn').addEventListener('click', () => {
  Audit.log({ action: 'logout', target: Session.current?.email, allowed: true });
  Session.clear();
  showLogin();
  toast('已登出', 'info');
});

/* 側邊欄 user card */
function renderUserCard() {
  const u = Session.current;
  if (!u) return;
  const avatar = $('#avatar');
  avatar.textContent = initialsOf(u.name);
  avatar.className = `avatar role-${u.role}`;
  $('#user-name').textContent = u.name;
  $('#user-role').textContent = ROLES[u.role].label.toUpperCase();
}

/* ============================================================
   選單 gating (鎖定不可存取的路由)
   ============================================================ */
function applyMenuGating() {
  $$('.menu-item[data-route]').forEach(item => {
    const route = item.dataset.route;
    const accessible = canAccessRoute(Session.current, route);
    item.classList.toggle('locked', !accessible);
    const label = item.querySelector('.menu-label');
    let lockBadge = item.querySelector('.menu-lock');
    if (!accessible) {
      if (!lockBadge) {
        lockBadge = document.createElement('span');
        lockBadge.className = 'menu-lock';
        lockBadge.textContent = '🔒';
        item.appendChild(lockBadge);
      }
    } else {
      lockBadge?.remove();
    }
  });
}

/* ============================================================
   路由系統
   ============================================================ */
let currentRoute = 'dashboard';

function navigate(route) {
  if (!Session.current) return showLogin();
  if (!ROUTES.includes(route)) route = 'dashboard';

  // ===== Route Guard =====
  if (!canAccessRoute(Session.current, route)) {
    Audit.log({
      action: 'route.deny',
      target: route,
      allowed: false,
      reason: 'route_guard_failed',
    });
    renderDenied(route);
    setActiveMenu(route);
    $('#crumb-current').textContent = ROLES[Session.current.role].label + ' · 被拒絕';
    return;
  }

  currentRoute = route;
  setActiveMenu(route);
  $('#crumb-current').textContent = ({
    dashboard: 'Dashboard',
    users: '使用者',
    posts: '文章',
    finance: '財務記錄',
    settings: '系統設定',
    roles: '角色 / 權限',
    audit: '審計日誌',
  })[route] || route;

  Audit.log({ action: 'route.visit', target: route, allowed: true });
  renderRoute(route);
}

function setActiveMenu(route) {
  $$('.menu-item').forEach(el => el.classList.toggle('active', el.dataset.route === route));
}

/* ============================================================
   渲染被拒絕頁面
   ============================================================ */
function renderDenied(route) {
  const resource = route;
  const needed = `role.<${ACTIONS.join('|')}>.${resource}`;
  $('#page-content').innerHTML = `
    <div class="denied">
      <div class="denied-icon">🔒</div>
      <h2 class="denied-title">403 · 存取被拒絕</h2>
      <p class="denied-desc">
        你的角色 <strong>${ROLES[Session.current.role].label}</strong> 沒有存取
        <strong>${RESOURCES[resource]?.label || route}</strong> 的權限。
        請聯絡系統管理員，或切換到具備權限的角色。
      </p>
      <div class="denied-needed">
        必要權限：<code>can('${Session.current.role}', 'read', '${resource}')</code> → <strong style="color:var(--bad);">false</strong>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn" data-go="dashboard">← 回到 Dashboard</button>
        <button class="btn btn-primary" data-go="logout">切換角色</button>
      </div>
    </div>
  `;
  $$('[data-go]', $('#page-content')).forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.go === 'logout') { Session.clear(); showLogin(); }
      else navigate(b.dataset.go);
    });
  });
}

/* ============================================================
   各路由頁面
   ============================================================ */
function renderRoute(route) {
  const root = $('#page-content');
  switch (route) {
    case 'dashboard': return renderDashboard(root);
    case 'users':     return renderUsers(root);
    case 'posts':     return renderPosts(root);
    case 'finance':   return renderFinance(root);
    case 'settings':  return renderSettings(root);
    case 'roles':     return renderRoles(root);
    case 'audit':     return renderAudit(root);
  }
}

/* ---------- Dashboard ---------- */
function renderDashboard(root) {
  const u = Session.current;
  const canCreateUser  = can(u, 'create', 'users');
  const canCreatePost  = can(u, 'create', 'posts');
  const canCreateFin   = can(u, 'create', 'finance');
  const canViewRoles   = can(u, 'update', 'roles');

  root.innerHTML = `
    <div style="margin-bottom: 22px;">
      <h1 style="margin:0 0 4px; font-size: 24px;">歡迎回來，${u.name} 👋</h1>
      <p style="margin:0; color: var(--text-2); font-size: 14px;">
        你目前以 <span class="role-tag-${u.role}"><strong>${ROLES[u.role].label}</strong></span> 身份登入 ·
        ${ROLES[u.role].desc}
      </p>
    </div>

    <div class="stats-grid">
      <div class="card">
        <div class="card-title">活躍使用者</div>
        <div class="card-value">1,247</div>
        <div class="card-trend">↑ 12.4% vs 上週</div>
      </div>
      <div class="card">
        <div class="card-title">本月文章</div>
        <div class="card-value">89</div>
        <div class="card-trend">↑ 6 新發布</div>
      </div>
      <div class="card">
        <div class="card-title">收入 (NT$)</div>
        <div class="card-value">2,486,000</div>
        <div class="card-trend">↑ 8.2%</div>
      </div>
      <div class="card">
        <div class="card-title">審計事件 (24h)</div>
        <div class="card-value">${Audit.entries.length}</div>
        <div class="card-trend ${Audit.entries.filter(e => e.allowed === false).length > 0 ? 'down' : ''}">
          ${Audit.entries.filter(e => e.allowed === false).length} 個拒絕事件
        </div>
      </div>
    </div>

    <div class="panels">
      <div class="card">
        <div class="panel-title">
          <h3>你的權限總覽</h3>
          <span class="panel-action">${Object.keys(ROLES).length} 個角色 / ${Object.keys(RESOURCES).length} 個資源</span>
        </div>
        <table>
          <thead>
            <tr><th>資源</th>${ACTIONS.map(a => `<th style="text-align:center;">${labelForAction(a)}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${Object.keys(RESOURCES).map(res => `
              <tr>
                <td style="font-weight: 600; color: var(--text-0);">${RESOURCES[res].icon} ${RESOURCES[res].label}</td>
                ${ACTIONS.map(a => {
                  const ok = can(u, a, res);
                  return `<td style="text-align:center;">
                    <span class="chip ${ok ? 'chip-good' : 'chip-bad'}">
                      ${ok ? '✓' : '✕'}
                    </span>
                  </td>`;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div class="card">
        <div class="panel-title">
          <h3>最近活動</h3>
          <span class="panel-action">${Audit.entries.length} 筆</span>
        </div>
        <ul class="activity-list">
          ${Audit.entries.slice(0, 8).map(e => activityItem(e)).join('') || `
            <li style="padding: 24px 0; text-align: center; color: var(--text-3); font-size: 13px;">
              尚無活動記錄，登入後的操作都會顯示在這裡
            </li>
          `}
        </ul>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <div class="panel-title">
        <h3>快速操作 (基於權限自動啟用 / 停用)</h3>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-primary" ${canCreateUser ? '' : 'disabled'} data-act="create-user">
          + 新增使用者
        </button>
        <button class="btn" ${canCreatePost ? '' : 'disabled'} data-act="create-post">
          + 新增文章
        </button>
        <button class="btn" ${canCreateFin ? '' : 'disabled'} data-act="create-finance">
          + 新增財務記錄
        </button>
        <button class="btn" ${canViewRoles ? '' : 'disabled'} data-act="edit-roles">
          編輯權限矩陣
        </button>

/* ---------- Audit ---------- */
function renderAudit(root) {
  const u = Session.current;
  if (!can(u, 'read', 'audit')) return renderDenied('audit');
  const entries = Audit.getAll();

  const total = entries.length;
  const denied = entries.filter(e => e.allowed === false).length;
  const allowed = total - denied;
  const byAction = {};
  entries.forEach(e => {
    const k = `${e.role}/${e.action}`;
    byAction[k] = (byAction[k] || 0) + 1;
  });

  root.innerHTML = `
    <h1 style="margin:0 0 16px;">審計日誌</h1>

    <div class="stats-grid">
      <div class="card"><div class="card-title">全部事件</div><div class="card-value">${total}</div></div>
      <div class="card"><div class="card-title">允許事件</div><div class="card-value" style="color: var(--good);">${allowed}</div></div>
      <div class="card"><div class="card-title">拒絕事件</div><div class="card-value" style="color: var(--bad);">${denied}</div></div>
      <div class="card"><div class="card-title">目前登入者</div><div class="card-value" style="font-size: 16px;">${u.name}</div></div>
    </div>

    <div class="card" style="padding: 0;">
      <table>
        <thead>
          <tr><th>時間</th><th>使用者</th><th>角色</th><th>動作</th><th>目標</th><th>結果</th></tr>
        </thead>
        <tbody>
          ${entries.length === 0 ? `
            <tr><td colspan="6" style="padding: 30px; text-align: center; color: var(--text-3);">
              尚無審計記錄。在 Dashboard、Users、Roles 等頁面操作，事件會即時累積在這裡。
            </td></tr>
          ` : entries.map(e => `
            <tr>
              <td style="font-family: ui-monospace; font-size: 12px; color: var(--text-2);">
                ${formatTime(e.ts)}
              </td>
              <td><strong style="color: var(--text-0);">${e.user}</strong></td>
              <td><span class="chip role-tag-${e.role}" style="border-color: currentColor;">${ROLES[e.role]?.label || e.role}</span></td>
              <td><code style="font-size: 12px; color: var(--accent);">${e.action}</code></td>
              <td style="font-size: 12px; color: var(--text-2);">${e.target || '—'}</td>
              <td>${e.allowed === false
                ? '<span class="chip chip-bad"><span class="chip-dot"></span>DENY</span>'
                : '<span class="chip chip-good"><span class="chip-dot"></span>OK</span>'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================================================
   工具
   ============================================================ */
function labelForAction(a) {
  return ({ read: '讀', create: '建', update: '改', delete: '刪' })[a] || a;
}
function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-Hant', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function activityItem(e) {
  const icon = e.action.startsWith('login') ? 'login'
              : e.action.startsWith('users.create') || e.action.startsWith('posts.create') || e.action.startsWith('finance.create') ? 'create'
              : e.action.includes('delete') || e.allowed === false ? (e.allowed === false ? 'warning' : 'delete')
              : 'login';
  const time = formatTime(e.ts);
  let text = '';
  if (e.action === 'login.success')  text = `<strong>${e.user}</strong> 登入系統`;
  else if (e.action === 'logout')    text = `<strong>${e.user}</strong> 登出系統`;
  else if (e.action === 'login.attempt') text = `嘗試登入 <strong>${e.target}</strong> 失敗 (${e.reason})`;
  else if (e.action === 'route.visit')   text = `瀏覽 <strong>${e.target}</strong> 頁面`;
  else if (e.action === 'route.deny')    text = `嘗試存取 <strong>${e.target}</strong> 被拒絕`;
  else if (e.action === 'action.deny')   text = `操作 <code>${e.target}</code> 被拒絕 (無權限)`;
  else if (e.action.startsWith('roles.update')) text = `編輯權限: <code>${e.target}</code> <span style="color:var(--text-3);">${e.detail || ''}</span>`;
  else text = `<code>${e.action}</code> on <strong>${e.target}</strong>`;

  return `<li class="activity-item">
    <div class="activity-icon ${icon}">${e.allowed === false ? '✕' : '✓'}</div>
    <div class="activity-content">
      <div class="activity-text">${text}</div>
      <div class="activity-time">${time} · ${ROLES[e.role]?.label || e.role}</div>
    </div>
  </li>`;
}

function showPermissionDenied(action, resource) {
  Audit.log({ action: `${resource}.${action}`, allowed: false, reason: 'no_permission' });
  toast(`✕ 權限不足：需要 ${ROLES[Session.current.role].label} 對 ${RESOURCES[resource]?.label || resource} 的 <code style="color:#fff;background:#000;padding:1px 5px;border-radius:3px;">${action}</code> 權限`, 'error');
}

/* ============================================================
   Modal
   ============================================================ */
function openModal(title, bodyHtml, onConfirm) {
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHtml;
  $('#modal-footer').innerHTML = `
    <button class="btn" id="modal-cancel">取消</button>
    <button class="btn btn-primary" id="modal-ok">確認</button>
  `;
  $('#modal-backdrop').classList.add('show');
  $('#modal-cancel').addEventListener('click', closeModal);
  $('#modal-ok').addEventListener('click', () => onConfirm?.());
  $('#modal-close').onclick = closeModal;
  $('#modal-backdrop').onclick = (e) => { if (e.target.id === 'modal-backdrop') closeModal(); };
}
function closeModal() {
  $('#modal-backdrop').classList.remove('show');
}

/* ============================================================
   其他 UI 綁定
   ============================================================ */
$$('.menu-item').forEach(item => {
  item.addEventListener('click', () => {
    const route = item.dataset.route;
    if (!route) return;
    if (item.classList.contains('locked')) {
      Audit.log({ action: 'route.deny', target: route, allowed: false, reason: 'menu_guard' });
      showPermissionDenied('read', route);
      return;
    }
    navigate(route);
  });
});
$('#menu-toggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
$('#lock-btn').addEventListener('click', () => {
  applyMenuGating();
  navigate(currentRoute);
  toast('已重新檢查權限 ✓', 'info');
});
$('#topbar-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = e.target.value.trim();
    if (q) {
      Audit.log({ action: 'search', target: q, allowed: true });
      toast(`搜尋 "${q}" (模擬)`, 'info');
    }
  }
});

/* 全域鍵盤 ⌘K 搜尋 */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    $('#topbar-search').focus();
  }
});

/* ============================================================
   啟動
   ============================================================ */
Session.load();
if (Session.current && DEMO_USERS[Session.current.email]) {
  showApp();
} else {
  showLogin();
}

</script>
</body>
</html>
